<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360" role="img" aria-label="工具接口的三个旋钮"><defs><marker id="ah-b1knobs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6577"/></marker></defs><rect x="0" y="0" width="900" height="360" fill="#ffffff"/><line x1="280" y1="154" x2="460" y2="154" stroke="#9AA5B4" stroke-width="2"/><path d="M370,154 L457,154" fill="none" stroke="#9AA5B4" stroke-width="2" marker-end="url(#ah-b1knobs)"/><line x1="280" y1="230" x2="460" y2="230" stroke="#9AA5B4" stroke-width="2"/><path d="M370,230 L457,230" fill="none" stroke="#9AA5B4" stroke-width="2" marker-end="url(#ah-b1knobs)"/><line x1="280" y1="306" x2="460" y2="306" stroke="#9AA5B4" stroke-width="2"/><path d="M370,306 L457,306" fill="none" stroke="#9AA5B4" stroke-width="2" marker-end="url(#ah-b1knobs)"/><rect x="20" y="40" width="860" height="64" rx="6" fill="#F3F5F8" stroke="#D5DBE4" stroke-width="1"/><rect x="120" y="134" width="160" height="40" rx="5" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1.5"/><rect x="460" y="134" width="160" height="40" rx="5" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1.5"/><rect x="120" y="210" width="160" height="40" rx="5" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1.5"/><rect x="460" y="210" width="160" height="40" rx="5" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1.5"/><rect x="120" y="286" width="160" height="40" rx="5" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1.5"/><rect x="460" y="286" width="160" height="40" rx="5" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1.5"/><text x="20" y="24" text-anchor="start" font-size="12" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">比较接口时最好一次只拧一个旋钮，并且把工具权限和总预算固定住</text><text x="36" y="62" text-anchor="start" font-size="12" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">先做受控替换：The Harness Effect</text><text x="36" y="84" text-anchor="start" font-size="11" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">固定任务和模型，只换编排层（上下文怎样组装、工具怎样暴露、失败怎样处理）；作者在企业任务样本上报告成本、时延和 token 都下降了</text><text x="20" y="156" text-anchor="start" font-size="12.5" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">表达形式</text><text x="200" y="157.41" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">原生 JSON 调用</text><text x="540" y="157.41" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">程序式调用</text><text x="370" y="146" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" style="paint-order:stroke;stroke-width:4px;stroke-linejoin:round" stroke="#ffffff">往右：更强也更难控制</text><text x="640" y="146" text-anchor="start" font-size="10.5" font-weight="500" fill="#0E6E7E" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">The Bitter Lesson of Tool Calling</text><text x="640" y="162" text-anchor="start" font-size="10.5" font-weight="500" fill="#0E6E7E" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Harness as a Language</text><text x="20" y="232" text-anchor="start" font-size="12.5" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">启动时机</text><text x="200" y="233.41" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">生成完再执行</text><text x="540" y="233.41" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">边生成边启动</text><text x="370" y="222" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" style="paint-order:stroke;stroke-width:4px;stroke-linejoin:round" stroke="#ffffff">往右：更强也更难控制</text><text x="640" y="222" text-anchor="start" font-size="10.5" font-weight="500" fill="#0E6E7E" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Speculative Programmatic</text><text x="640" y="238" text-anchor="start" font-size="10.5" font-weight="500" fill="#0E6E7E" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Tool Calling</text><text x="20" y="308" text-anchor="start" font-size="12.5" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">先验理解</text><text x="200" y="309.41" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">只读工具说明</text><text x="540" y="309.41" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">训练里学会用工具</text><text x="370" y="298" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" style="paint-order:stroke;stroke-width:4px;stroke-linejoin:round" stroke="#ffffff">往右：更强也更难控制</text><text x="640" y="298" text-anchor="start" font-size="10.5" font-weight="500" fill="#0E6E7E" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">MidTool（中期训练）</text><text x="640" y="314" text-anchor="start" font-size="10.5" font-weight="500" fill="#0E6E7E" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Salesforce Koa（模拟任务）</text></svg>
