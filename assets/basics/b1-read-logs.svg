<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" width="880" height="330" role="img" aria-label="读二十几个日志的三种接口（示意）"><defs><marker id="ah-b1readlogs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6577"/></marker></defs><rect x="0" y="0" width="880" height="330" fill="#ffffff"/><rect x="20" y="44" width="260" height="270" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="36" y="86" width="228" height="36" rx="4" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1"/><rect x="36" y="140" width="228" height="40" rx="4" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1"/><rect x="36" y="192" width="228" height="40" rx="4" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1"/><rect x="36" y="244" width="228" height="40" rx="4" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1"/><rect x="310" y="44" width="260" height="270" rx="5" fill="#DCEFF1" stroke="#0E6E7E" stroke-width="1.5"/><rect x="326" y="86" width="228" height="36" rx="4" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1"/><rect x="326" y="140" width="228" height="40" rx="4" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1"/><rect x="326" y="192" width="228" height="40" rx="4" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1"/><rect x="326" y="244" width="228" height="40" rx="4" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1"/><rect x="600" y="44" width="260" height="270" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="616" y="86" width="228" height="36" rx="4" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1"/><rect x="616" y="140" width="228" height="40" rx="4" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1"/><rect x="616" y="192" width="228" height="40" rx="4" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1"/><rect x="616" y="244" width="228" height="40" rx="4" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1"/><text x="20" y="24" text-anchor="start" font-size="12" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">示意：三种接口都能完成检查，交给模型的动作空间却很不一样</text><text x="150" y="70" text-anchor="middle" font-size="13" font-weight="700" fill="#26805A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">一次读一个文件</text><text x="150" y="109" text-anchor="middle" font-size="11" font-weight="500" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">read_file(path)</text><text x="150" y="165" text-anchor="middle" font-size="11" font-weight="500" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">二十几次来回</text><text x="150" y="217" text-anchor="middle" font-size="11" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">每一步都能单独审计</text><text x="150" y="269" text-anchor="middle" font-size="11" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">错一步只影响这一步</text><text x="440" y="70" text-anchor="middle" font-size="13" font-weight="700" fill="#0E6E7E" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">一次读一组文件</text><text x="440" y="109" text-anchor="middle" font-size="11" font-weight="500" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">read_files([p1, p2, …])</text><text x="440" y="165" text-anchor="middle" font-size="11" font-weight="500" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">来回次数少</text><text x="440" y="217" text-anchor="middle" font-size="11" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">一次返回的内容变多</text><text x="440" y="269" text-anchor="middle" font-size="11" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">要靠分页、截断控制返回量</text><text x="730" y="70" text-anchor="middle" font-size="13" font-weight="700" fill="#5B45B0" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">写一段程序</text><text x="730" y="109" text-anchor="middle" font-size="11" font-weight="500" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">for p in logs: parse(p)</text><text x="730" y="165" text-anchor="middle" font-size="11" font-weight="500" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">表达力最强：循环、变量、依赖</text><text x="730" y="217" text-anchor="middle" font-size="11" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">要读懂整段程序才能审计</text><text x="730" y="269" text-anchor="middle" font-size="11" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">一段写错的程序会影响很多步</text></svg>
