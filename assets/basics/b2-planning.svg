<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img" aria-label="规划分支的三个实验视角"><defs><marker id="ah-b2planning" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6577"/></marker></defs><rect x="0" y="0" width="900" height="470" fill="#ffffff"/><path d="M370.667,72 L391.667,72" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-b2planning)"/><path d="M535.333,72 L556.333,72" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-b2planning)"/><path d="M374.5,314 L395.5,314" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-b2planning)"/><path d="M543,314 L564,314" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-b2planning)"/><path d="M711.5,314 L732.5,314" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-b2planning)"/><path d="M807.75,340 L807.75,362 L639.25,362 L639.25,343" fill="none" stroke="#5A6577" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#ah-b2planning)"/><path d="M470.75,288 L470.75,278 L302.25,278 L302.25,285" fill="none" stroke="#5A6577" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#ah-b2planning)"/><rect x="230" y="46" width="140.667" height="52" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><rect x="394.667" y="46" width="140.667" height="52" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="559.333" y="46" width="140.667" height="52" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="720" y="46" width="160" height="52" rx="5" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.5"/><rect x="230" y="146" width="650" height="110" rx="6" fill="#F4FAFB" stroke="#0E6E7E" stroke-width="1.2" stroke-dasharray="5 4"/><rect x="244" y="178" width="200" height="66" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><rect x="456" y="178" width="200" height="66" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="668" y="178" width="200" height="66" rx="5" fill="#E9EDF3" stroke="#47546A" stroke-width="1.5"/><rect x="230" y="288" width="144.5" height="52" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="398.5" y="288" width="144.5" height="52" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="567" y="288" width="144.5" height="52" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><rect x="735.5" y="288" width="144.5" height="52" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="20" y="392" width="860" height="62" rx="5" fill="#F3F5F8" stroke="#D5DBE4" stroke-width="1.5"/><text x="20" y="24" text-anchor="start" font-size="12" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">三篇工作分别回答：哪个角色需要大模型、规划在什么条件下值得、什么时候才该开始分解</text><text x="20" y="62" text-anchor="start" font-size="12.5" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Think Big, Search Small</text><text x="20" y="80" text-anchor="start" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">按角色定位瓶颈</text><text x="300.333" y="68.665" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">委派</text><text x="300.333" y="83.035" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">拆问题、派子查询</text><text x="465" y="68.665" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">检索执行</text><text x="465" y="83.035" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">检索与抽取证据</text><text x="629.667" y="68.665" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">回答生成</text><text x="629.667" y="83.035" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">固定不变，作对照</text><text x="800" y="68.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">结果对委派模型</text><text x="800" y="83.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">的规模更敏感</text><text x="465" y="118" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">经过轨迹蒸馏的小执行器可以保持竞争力；结论出自多跳问答实验</text><text x="20" y="172" text-anchor="start" font-size="12.5" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Empirical Study of</text><text x="20" y="190" text-anchor="start" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Harness Design：固定循环，只改三个组件</text><text x="555" y="166" text-anchor="middle" font-size="11" font-weight="600" fill="#0E6E7E" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">固定的执行循环</text><text x="344" y="200.92" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">规划</text><text x="344" y="215.48" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">弱模型：帮着提高准确率；强模型：更多</text><text x="344" y="229.28" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">是省成本</text><text x="556" y="207.82" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">动作空间</text><text x="556" y="222.38" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">改变模型能调用的操作</text><text x="768" y="207.82" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">上下文管理</text><text x="768" y="222.38" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">主要收益来自避免窗口溢出</text><text x="20" y="304" text-anchor="start" font-size="12.5" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Stellar Colosseum</text><text x="20" y="322" text-anchor="start" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">先判断路线是否成熟，再分解</text><text x="302.25" y="317.565" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">探索候选策略</text><text x="470.75" y="310.665" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">准备度检查</text><text x="470.75" y="325.035" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">路线够成熟吗</text><text x="639.25" y="317.565" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">分解成小节子问题</text><text x="807.75" y="310.665" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">验证</text><text x="807.75" y="325.035" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">针对性证伪</text><text x="763.5" y="357" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" style="paint-order:stroke;stroke-width:4px;stroke-linejoin:round" stroke="#ffffff">发现送回受影响的部分</text><text x="416.5" y="274" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" style="paint-order:stroke;stroke-width:4px;stroke-linejoin:round" stroke="#ffffff">还不成熟</text><text x="450" y="419.165" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">组合的另一面：Raven 组合各有工具与经验的模型-框架单元；Codebook Agent 发现通信图画得稀疏，未必更省 token</text><text x="450" y="433.845" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">报告规划收益时，同时报告不规划和固定流程两条基线，并把计划、审查、协调的预算算进去</text></svg>
