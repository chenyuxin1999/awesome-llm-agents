<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" role="img" aria-label="观察：下一步需要什么，就去看什么"><defs><marker id="ah-b3observation" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6577"/></marker></defs><rect x="0" y="0" width="900" height="420" fill="#ffffff"/><path d="M170,72 L217,82" fill="none" stroke="#9AA5B4" stroke-width="1.4" marker-end="url(#ah-b3observation)"/><path d="M170,132 L217,132" fill="none" stroke="#9AA5B4" stroke-width="1.4" marker-end="url(#ah-b3observation)"/><path d="M170,192 L217,182" fill="none" stroke="#9AA5B4" stroke-width="1.4" marker-end="url(#ah-b3observation)"/><path d="M660,65 L707,140" fill="none" stroke="#9AA5B4" stroke-width="1.4" marker-end="url(#ah-b3observation)"/><path d="M660,115 L707,140" fill="none" stroke="#9AA5B4" stroke-width="1.4" marker-end="url(#ah-b3observation)"/><path d="M660,165 L707,140" fill="none" stroke="#9AA5B4" stroke-width="1.4" marker-end="url(#ah-b3observation)"/><path d="M660,215 L707,140" fill="none" stroke="#9AA5B4" stroke-width="1.4" marker-end="url(#ah-b3observation)"/><path d="M290,312 L317,312" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-b3observation)"/><path d="M590,312 L617,312" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-b3observation)"/><rect x="20" y="50" width="150" height="44" rx="5" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.5"/><rect x="20" y="110" width="150" height="44" rx="5" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.5"/><rect x="20" y="170" width="150" height="44" rx="5" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.5"/><rect x="220" y="44" width="440" height="42" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><rect x="220" y="94" width="440" height="42" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><rect x="220" y="144" width="440" height="42" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><rect x="220" y="194" width="440" height="42" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><rect x="710" y="80" width="170" height="120" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="20" y="284" width="270" height="56" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="320" y="284" width="270" height="56" rx="5" fill="#DCEFF1" stroke="#0E6E7E" stroke-width="1.5"/><rect x="620" y="284" width="260" height="56" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="20" y="356" width="860" height="52" rx="5" fill="#E9EDF3" stroke="#47546A" stroke-width="1.5"/><text x="20" y="24" text-anchor="start" font-size="12" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">工具返回的内容太多，决策需要的证据很稀疏；四种做法各自决定先看什么、留下什么</text><text x="95" y="75.41" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">一百处搜索匹配</text><text x="95" y="135.41" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">几小时的音视频</text><text x="95" y="195.41" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">一大批执行轨迹</text><text x="440" y="61.51" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">相关性引导的 grep</text><text x="440" y="75.69" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">A New Role for Relevance：决定先搜哪里、先给模型看哪些片段</text><text x="440" y="111.51" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">先粗看，再放大</text><text x="440" y="125.69" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">OmniReasoner：低成本全局预览，必要时放大某个时间段</text><text x="440" y="161.51" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">按需调专门工具</text><text x="440" y="175.69" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Online Video Agent Harness、AdaVDR：不可靠时回退</text><text x="440" y="211.51" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">去重并保留依赖</text><text x="440" y="225.69" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">STRACE：批次层面减少重复失败，沿依赖保留可能的原因</text><text x="795" y="121.985" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">下一步要用的证据</text><text x="795" y="137.045" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">未解决的约束</text><text x="795" y="151.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">可能推翻当前</text><text x="795" y="166.025" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">假设的信息</text><text x="20" y="270" text-anchor="start" font-size="12" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">收益来自新信息，还是来自调用时写下的意图？</text><text x="155" y="308.82" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">完整版：调用工具</text><text x="155" y="323.38" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">写下位置与意图，读回返回的图像</text><text x="455" y="308.82" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">TextCall：调用但不返回</text><text x="455" y="323.38" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">保留调用文字，图像换成占位符</text><text x="750" y="308.82" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">效果依然保留</text><text x="750" y="323.38" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">起作用的可能是写下的目标与位置</text><text x="450" y="378.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">观察以什么形式进入后面的状态</text><text x="450" y="393.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">CompactionRL 把压缩放进训练 · MemHarness 按当前情境重组经验 · Catastrophic Remembering：指令越积越多</text></svg>
