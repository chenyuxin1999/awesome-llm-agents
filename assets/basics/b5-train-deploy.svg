<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380" role="img" aria-label="训练与部署框架的连接"><defs><marker id="ah-b5traindeploy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6577"/></marker></defs><rect x="0" y="0" width="900" height="380" fill="#ffffff"/><rect x="20" y="44" width="520" height="150" rx="8" fill="#F4FAFB" stroke="#0E6E7E" stroke-width="1.3" stroke-dasharray="5 4"/><path d="M180,108 L207,108" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-b5traindeploy)"/><path d="M207,120 L183,120" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-b5traindeploy)"/><path d="M350,108 L377,108" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-b5traindeploy)"/><path d="M520,108 L597,108" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-b5traindeploy)"/><path d="M450,136 L450,192 L597,192" fill="none" stroke="#5A6577" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#ah-b5traindeploy)"/><path d="M740,160 L690,139" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-b5traindeploy)"/><rect x="40" y="80" width="140" height="56" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="210" y="80" width="140" height="56" rx="5" fill="#DCEFF1" stroke="#0E6E7E" stroke-width="1.5"/><rect x="380" y="80" width="140" height="56" rx="5" fill="#E9EDF3" stroke="#47546A" stroke-width="1.5"/><rect x="600" y="80" width="120" height="56" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="600" y="160" width="280" height="64" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><rect x="20" y="274" width="202" height="44" rx="5" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1.5"/><rect x="238" y="274" width="202" height="44" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="456" y="274" width="202" height="44" rx="5" fill="#DCEFF1" stroke="#0E6E7E" stroke-width="1.5"/><rect x="674" y="274" width="202" height="44" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><rect x="20" y="330" width="860" height="40" rx="5" fill="#F3F5F8" stroke="#D5DBE4" stroke-width="1.5"/><text x="20" y="24" text-anchor="start" font-size="11.5" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">由部署框架掌握交互循环，训练器只看模型调用边界上的请求与响应，再重建出每次决策当时看到了什么</text><text x="280" y="64" text-anchor="middle" font-size="11" font-weight="600" fill="#0E6E7E" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">部署时的执行框架（截断历史、合并请求、改返回格式）</text><text x="110" y="104.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">环境</text><text x="110" y="119.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">隔离沙箱</text><text x="280" y="104.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">框架逻辑</text><text x="280" y="119.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">工具、上下文、控制</text><text x="450" y="104.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">代理</text><text x="450" y="119.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">设在模型调用边界</text><text x="660" y="111.72" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">被训练的模型</text><text x="558" y="100" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" style="paint-order:stroke;stroke-width:4px;stroke-linejoin:round" stroke="#ffffff">请求 / 响应</text><text x="740" y="188.82" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">训练器</text><text x="740" y="203.38" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">重建轨迹、重新分词、重算 log-prob、计算优势</text><text x="515" y="186" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" style="paint-order:stroke;stroke-width:4px;stroke-linejoin:round" stroke="#ffffff">记录下的调用</text><text x="280" y="176" text-anchor="middle" font-size="10.5" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">ClawGym II · Agent Lightning v1.0 · LEGO-RL</text><text x="20" y="260" text-anchor="start" font-size="12" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">比较时的四组条件（工具权限与总预算对齐）</text><text x="121" y="299.565" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">原始系统</text><text x="339" y="299.565" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">只更新模型</text><text x="557" y="299.565" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">只更新框架</text><text x="775" y="299.565" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">两者同时更新</text><text x="450" y="353.41" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Harness-Zero：把复杂框架带来的行为蒸馏进模型；Co-Evolving：只修正弱模型自己出错的那一步</text></svg>
