" y="252" width="128.333" height="40" rx="5" fill="#FDE8DD" stroke="#C2501A" stroke-width="1.5"/><rect x="459" y="252" width="128.333" height="40" rx="5" fill="#FDE8DD" stroke="#C2501A" stroke-width="1.5"/><rect x="605.333" y="252" width="128.333" height="40" rx="5" fill="#FDE8DD" stroke="#C2501A" stroke-width="1.5"/><rect x="751.667" y="252" width="128.333" height="40" rx="5" fill="#FDE8DD" stroke="#C2501A" stroke-width="1.5"/><rect x="20" y="336" width="860" height="50" rx="5" fill="#F3F5F8" stroke="#D5DBE4" stroke-width="1.5"/><text x="20" y="24" text-anchor="start" font-size="12" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">完成当前动作之后，循环应当能区分三种状态；任何优化都同时报告任务完成和约束遵守</text><text x="105" y="88.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">一次动作完成</text><text x="105" y="103.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">写对了一个文件</text><text x="370" y="62.82" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">还需要更多证据</text><text x="370" y="77.38" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">继续观察，别急着下结论</text><text x="370" y="114.82" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">需要人来决定</text><text x="370" y="129.38" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">不可逆操作前的确认点</text><text x="370" y="166.82" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">任务已经完成</text><text x="370" y="181.38" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">记录实际状态再退出</text><text x="710" y="68" text-anchor="middle" font-size="12" font-weight="700" fill="#C2501A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">EvoUndo：修改能不能撤回</text><text x="556" y="96" text-anchor="start" font-size="10.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">自我修改可能留下持久的副作用</text><text x="556" y="118" text-anchor="start" font-size="10.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">在不同于创建时的反事实状态下验证可恢复性</text><text x="556" y="140" text-anchor="start" font-size="10.5" font-weight="500" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">600 个未见任务里，197 个提升能力的修改</text><text x="556" y="162" text-anchor="start" font-size="10.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">没有通过可恢复性验证</text><text x="20" y="236" text-anchor="start" font-size="12" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">HarnessRisk：按生命周期组织的六个阶段</text><text x="84.1667" y="275.565" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">配置</text><text x="230.5" y="275.565" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">能力扩展</text><text x="376.833" y="275.565" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">运行</text><text x="523.167" y="275.565" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">状态保存</text><text x="669.5" y="275.565" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">动作控制</text><text x="815.833" y="275.565" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">事件恢复</text><text x="450" y="314" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">风险可能在模型读到恶意提示那一刻发生，也可能通过状态和扩展组件一路延续</text><text x="450" y="357.165" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">SafeEvolve：框架与策略借助经验共同改善安全 · EvoSafeHarness：针对特定模型与领域搜索防护框架</text><text x="450" y="371.845" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">为安全拒绝所有任务，和为完成任务无视限制，都没有回答真正的问题</text></svg>
