<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" role="img" aria-label="工作循环在哪里断掉"><defs><marker id="ah-boundary" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6577"/></marker></defs><rect x="0" y="0" width="900" height="420" fill="#ffffff"/><path d="M470,86 L557,86" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-boundary)"/><path d="M630,112 L630,167" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-boundary)"/><path d="M560,196 L473,196" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-boundary)"/><path d="M400,170 L400,115" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-boundary)"/><path d="M280,82 L327,86" fill="none" stroke="#C2501A" stroke-width="1.4" marker-end="url(#ah-boundary)"/><path d="M740,196 L703,196" fill="none" stroke="#C2501A" stroke-width="1.4" marker-end="url(#ah-boundary)"/><path d="M280,196 L327,196" fill="none" stroke="#C2501A" stroke-width="1.4" marker-end="url(#ah-boundary)"/><rect x="330" y="60" width="140" height="52" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="560" y="60" width="140" height="52" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="560" y="170" width="140" height="52" rx="5" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.5"/><rect x="330" y="170" width="140" height="52" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="20" y="46" width="260" height="72" rx="5" fill="#FDE8DD" stroke="#C2501A" stroke-width="1.5"/><rect x="740" y="140" width="150" height="112" rx="5" fill="#FDE8DD" stroke="#C2501A" stroke-width="1.5"/><rect x="20" y="160" width="260" height="72" rx="5" fill="#FDE8DD" stroke="#C2501A" stroke-width="1.5"/><rect x="20" y="268" width="870" height="52" rx="5" fill="#FDE8DD" stroke="#C2501A" stroke-width="1.5"/><rect x="200" y="334" width="68" height="28" rx="14" fill="#FFFFFF" stroke="#C2501A" stroke-width="1.2"/><rect x="278" y="334" width="68" height="28" rx="14" fill="#FFFFFF" stroke="#C2501A" stroke-width="1.2"/><rect x="356" y="334" width="79" height="28" rx="14" fill="#FFFFFF" stroke="#C2501A" stroke-width="1.2"/><rect x="445" y="334" width="68" height="28" rx="14" fill="#FFFFFF" stroke="#C2501A" stroke-width="1.2"/><rect x="523" y="334" width="145" height="28" rx="14" fill="#FFFFFF" stroke="#C2501A" stroke-width="1.2"/><text x="20" y="24" text-anchor="start" font-size="12" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">把工作循环再画一遍：橙色框是断点，箭头指向它出问题的那一环；琥珀色小字是周报任务里的例子（示意）</text><text x="400" y="82.82" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">模型提出动作</text><text x="400" y="97.38" text-anchor="middle" font-size="10" font-weight="400" fill="#8A5300" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">send_email(导师)</text><text x="630" y="82.82" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">执行工具</text><text x="630" y="97.38" text-anchor="middle" font-size="10" font-weight="400" fill="#8A5300" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">邮件发出</text><text x="630" y="192.82" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">返回观察</text><text x="630" y="207.38" text-anchor="middle" font-size="10" font-weight="400" fill="#8A5300" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">“发送成功”</text><text x="400" y="192.82" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">检查与宣布完成</text><text x="400" y="207.38" text-anchor="middle" font-size="10" font-weight="400" fill="#8A5300" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">称已完成，漏了 exp03</text><text x="150" y="78.82" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">无外部反馈的自我纠错</text><text x="150" y="93.38" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">推理题上自查后有时更差（Cannot Self-Correct）</text><text x="815" y="165.22" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">工具返回的文字</text><text x="815" y="179.78" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">可能出错</text><text x="815" y="193.58" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">可能夹带诱导</text><text x="815" y="207.38" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">越权的指令</text><text x="815" y="221.18" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">（Lilian Weng 的</text><text x="815" y="234.98" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">“接口不可靠”）</text><text x="150" y="192.82" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">宣布完成，其实没做完</text><text x="150" y="207.38" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Chip Huyen：agent 以为自己完成了任务</text><text x="455" y="290.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">评测与现实效用的落差（The Second Half）</text><text x="455" y="305.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">大多数基准让 agent 独自运行，把每道题当作互不相关的样本；现实中要和人来回交互，要在相关任务中积累经验</text><text x="20" y="350" text-anchor="start" font-size="12" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Chip Huyen 的规划失败分类</text><text x="234" y="352" text-anchor="middle" font-size="11" font-weight="500" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">无效工具</text><text x="312" y="352" text-anchor="middle" font-size="11" font-weight="500" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">无效参数</text><text x="395.5" y="352" text-anchor="middle" font-size="11" font-weight="500" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">参数值错误</text><text x="479" y="352" text-anchor="middle" font-size="11" font-weight="500" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">目标失败</text><text x="595.5" y="352" text-anchor="middle" font-size="11" font-weight="500" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">效率：步数、成本、时间</text><text x="20" y="396" text-anchor="start" font-size="11" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">读“成功率提升”时可以问：衡量的是格式正确、调用正确，还是任务真正完成？代价又是多少？</text></svg>
