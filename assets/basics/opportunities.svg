<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-label="周报的三道坎与三个研究问题"><defs><marker id="ah-opportunities" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6577"/></marker></defs><rect x="0" y="0" width="900" height="300" fill="#ffffff"/><path d="M163,95 L187,95" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-opportunities)"/><path d="M290,140 L290,167" fill="none" stroke="#5A6577" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#ah-opportunities)"/><path d="M393,95 L417,95" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-opportunities)"/><path d="M520,140 L520,167" fill="none" stroke="#5A6577" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#ah-opportunities)"/><path d="M623,95 L647,95" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-opportunities)"/><path d="M750,140 L750,167" fill="none" stroke="#5A6577" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#ah-opportunities)"/><rect x="20" y="60" width="140" height="70" rx="5" fill="#E3EBFF" stroke="#2B57C9" stroke-width="1.5"/><rect x="190" y="50" width="200" height="90" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><rect x="190" y="170" width="200" height="54" rx="5" fill="#F3F5F8" stroke="#D5DBE4" stroke-width="1.5"/><rect x="420" y="50" width="200" height="90" rx="5" fill="#DCEFF1" stroke="#0E6E7E" stroke-width="1.5"/><rect x="420" y="170" width="200" height="54" rx="5" fill="#F3F5F8" stroke="#D5DBE4" stroke-width="1.5"/><rect x="650" y="50" width="200" height="90" rx="5" fill="#FDE8DD" stroke="#C2501A" stroke-width="1.5"/><rect x="650" y="170" width="200" height="54" rx="5" fill="#F3F5F8" stroke="#D5DBE4" stroke-width="1.5"/><text x="20" y="24" text-anchor="start" font-size="12" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">从“说出怎么做”到“把周报交到导师手里”，中间跨过三道坎</text><text x="90" y="91.82" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">一句模糊的请求</text><text x="90" y="106.38" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">“整理周报发给导师”</text><text x="290" y="84.23" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">第一道坎</text><text x="290" y="99.29" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">变成可执行、可修正的步骤</text><text x="290" y="113.78" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">对应：规划阶段</text><text x="290" y="192.82" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">研究问题 1</text><text x="290" y="208" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">开放目标怎样变成任务结构</text><text x="520" y="84.23" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">第二道坎</text><text x="520" y="99.29" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">执行系统按实际情况调整自己</text><text x="520" y="113.78" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">对应：执行框架阶段</text><text x="520" y="192.82" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">研究问题 2</text><text x="520" y="208" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">框架按任务状态自适应</text><text x="750" y="84.23" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">第三道坎</text><text x="750" y="99.29" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">每步之后仍可恢复、可继续</text><text x="750" y="113.78" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">对应：边界</text><text x="750" y="192.82" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">研究问题 3</text><text x="750" y="208" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">可恢复、可组合的行动单元</text><text x="450" y="260" text-anchor="middle" font-size="11" font-weight="500" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">姚顺雨的效用问题落到基础系统上：基准上的成功率很高，真实工作流里的事情却未必做成了</text><text x="450" y="282" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">一个 agent 今天留下的状态，就是它明天开始工作的环境</text></svg>
