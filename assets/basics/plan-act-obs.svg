<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" width="860" height="300" role="img" aria-label="计划、动作与观察的区别"><defs><marker id="ah-planactobs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6577"/></marker></defs><rect x="0" y="0" width="860" height="300" fill="#ffffff"/><path d="M278,129 L301,129" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-planactobs)"/><path d="M562,129 L585,129" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-planactobs)"/><rect x="20" y="44" width="256" height="170" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><rect x="38" y="104" width="220" height="62" rx="4" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1"/><rect x="304" y="44" width="256" height="170" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="322" y="104" width="220" height="62" rx="4" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1"/><rect x="588" y="44" width="256" height="170" rx="5" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.5"/><rect x="606" y="104" width="220" height="62" rx="4" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1"/><rect x="20" y="230" width="820" height="56" rx="5" fill="#FDE8DD" stroke="#C2501A" stroke-width="1.2"/><text x="20" y="24" text-anchor="start" font-size="12" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">以周报为例：三样东西出现在同一段输出附近，含义完全不同</text><text x="148" y="70" text-anchor="middle" font-size="13" font-weight="700" fill="#B83560" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">计划</text><text x="148" y="90" text-anchor="middle" font-size="11" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">一个意图</text><text x="148" y="130" text-anchor="middle" font-size="11.5" font-weight="500" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">“解析全部日志，</text><text x="148" y="152" text-anchor="middle" font-size="11.5" font-weight="500" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">找出崩掉的实验”</text><text x="148" y="194" text-anchor="middle" font-size="11" font-weight="500" fill="#B83560" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">还没有任何事情发生</text><text x="432" y="70" text-anchor="middle" font-size="13" font-weight="700" fill="#5B45B0" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">动作</text><text x="432" y="90" text-anchor="middle" font-size="11" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">一次工具调用</text><text x="432" y="130" text-anchor="middle" font-size="11.5" font-weight="500" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">read_file(</text><text x="432" y="152" text-anchor="middle" font-size="11.5" font-weight="500" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">&quot;exp07/train.log&quot;)</text><text x="432" y="194" text-anchor="middle" font-size="11" font-weight="500" fill="#5B45B0" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">执行框架去执行它</text><text x="716" y="70" text-anchor="middle" font-size="13" font-weight="700" fill="#B86E00" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">观察</text><text x="716" y="90" text-anchor="middle" font-size="11" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">工具真正返回的内容</text><text x="716" y="130" text-anchor="middle" font-size="11.5" font-weight="500" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">…epoch 12  loss nan</text><text x="716" y="152" text-anchor="middle" font-size="11.5" font-weight="500" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Traceback …</text><text x="716" y="194" text-anchor="middle" font-size="11" font-weight="500" fill="#B86E00" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">这时才知道 exp07 崩了</text><text x="36" y="252" text-anchor="start" font-size="11.5" font-weight="700" fill="#C2501A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">写出来不代表发生了：</text><text x="36" y="274" text-anchor="start" font-size="11.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">模型写下“已经运行了测试”，测试并没有因此运行；计划里列着“修复错误”，也说明不了检查已经通过。</text></svg>
