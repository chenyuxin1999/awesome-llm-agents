<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 250" width="860" height="250" role="img" aria-label="只读工具与写入工具"><defs><marker id="ah-s2readwrite" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6577"/></marker></defs><rect x="0" y="0" width="860" height="250" fill="#ffffff"/><path d="M645,184 L645,197" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-s2readwrite)"/><rect x="20" y="44" width="390" height="140" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="44" y="86" width="104" height="30" rx="15" fill="#FFFFFF" stroke="#26805A" stroke-width="1.2"/><rect x="164" y="86" width="104" height="30" rx="15" fill="#FFFFFF" stroke="#26805A" stroke-width="1.2"/><rect x="284" y="86" width="104" height="30" rx="15" fill="#FFFFFF" stroke="#26805A" stroke-width="1.2"/><rect x="450" y="44" width="390" height="140" rx="5" fill="#FDE8DD" stroke="#C2501A" stroke-width="1.5"/><rect x="474" y="86" width="104" height="30" rx="15" fill="#FFFFFF" stroke="#C2501A" stroke-width="1.2"/><rect x="594" y="86" width="104" height="30" rx="15" fill="#FFFFFF" stroke="#C2501A" stroke-width="1.2"/><rect x="714" y="86" width="104" height="30" rx="15" fill="#FFFFFF" stroke="#C2501A" stroke-width="1.2"/><rect x="450" y="200" width="390" height="38" rx="5" fill="#DCEFF1" stroke="#0E6E7E" stroke-width="1.5"/><text x="20" y="24" text-anchor="start" font-size="12" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Chip Huyen 的划分：只读动作扩展模型能看到的东西，写入动作扩展它能做的事，风险也跟着变大</text><text x="215" y="68" text-anchor="middle" font-size="13" font-weight="700" fill="#26805A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">只读：感知环境</text><text x="96" y="106" text-anchor="middle" font-size="10.5" font-weight="500" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">列出日志目录</text><text x="216" y="106" text-anchor="middle" font-size="10.5" font-weight="500" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">读取 train.log</text><text x="336" y="106" text-anchor="middle" font-size="10.5" font-weight="500" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">搜索报错关键词</text><text x="215" y="150" text-anchor="middle" font-size="11" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">做错了通常只是浪费一次调用</text><text x="215" y="168" text-anchor="middle" font-size="11" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">可以放心让 agent 自己反复做</text><text x="645" y="68" text-anchor="middle" font-size="13" font-weight="700" fill="#C2501A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">写入：改变环境</text><text x="526" y="106" text-anchor="middle" font-size="10.5" font-weight="500" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">发邮件给导师</text><text x="646" y="106" text-anchor="middle" font-size="10.5" font-weight="500" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">删除旧日志</text><text x="766" y="106" text-anchor="middle" font-size="10.5" font-weight="500" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">改数据库</text><text x="645" y="150" text-anchor="middle" font-size="11" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">做错了可能收不回来</text><text x="645" y="168" text-anchor="middle" font-size="11" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">需要更谨慎的信任与安全机制</text><text x="645" y="222.565" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">执行前加一道确认点：先停下来请人确认</text><text x="215" y="224" text-anchor="middle" font-size="11" font-weight="500" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">周报里只有最后那封邮件属于写入动作</text></svg>
