<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" width="880" height="360" role="img" aria-label="Toolformer 与 HuggingGPT"><defs><marker id="ah-s2toolformer" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6577"/></marker></defs><rect x="0" y="0" width="880" height="360" fill="#ffffff"/><path d="M168.8,128 L189.8,128" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-s2toolformer)"/><path d="M341.6,128 L362.6,128" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-s2toolformer)"/><path d="M514.4,128 L535.4,128" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-s2toolformer)"/><path d="M687.2,128 L708.2,128" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-s2toolformer)"/><path d="M212,286 L233,286" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-s2toolformer)"/><path d="M428,286 L449,286" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-s2toolformer)"/><path d="M644,286 L665,286" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-s2toolformer)"/><rect x="20" y="88" width="148.8" height="80" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="192.8" y="88" width="148.8" height="80" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="365.6" y="88" width="148.8" height="80" rx="5" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.5"/><rect x="538.4" y="88" width="148.8" height="80" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><rect x="711.2" y="88" width="148.8" height="80" rx="5" fill="#E9EDF3" stroke="#47546A" stroke-width="1.5"/><rect x="20" y="256" width="192" height="60" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><rect x="236" y="256" width="192" height="60" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><rect x="452" y="256" width="192" height="60" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="668" y="256" width="192" height="60" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><text x="20" y="24" text-anchor="start" font-size="12" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">两条并行的路：把工具使用训进模型，或者让模型当调度者。琥珀色小字是流过每一步的例子：上排取自 Toolformer 论文，下排是示意</text><text x="20" y="62" text-anchor="start" font-size="12.5" font-weight="700" fill="#5B45B0" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Toolformer：把工具使用训进模型</text><text x="20" y="80" text-anchor="start" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">2023-02 · 计算器、问答系统、搜索、翻译、日历</text><text x="94.4" y="108" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">在文本中插入</text><text x="267.2" y="108" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">执行调用</text><text x="440" y="108" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">比较</text><text x="612.8" y="108" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">只留有帮助的</text><text x="785.6" y="108" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">用这些数据微调</text><text x="94.4" y="130" text-anchor="middle" font-size="10" font-weight="400" fill="#8A5300" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">1400 人中 400 人</text><text x="94.4" y="144" text-anchor="middle" font-size="10" font-weight="400" fill="#8A5300" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">[Calculator(400/1400)]</text><text x="94.4" y="158" text-anchor="middle" font-size="10" font-weight="400" fill="#8A5300" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">通过了测试</text><text x="267.2" y="130" text-anchor="middle" font-size="10" font-weight="400" fill="#8A5300" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">→ 0.29</text><text x="440" y="130" text-anchor="middle" font-size="10" font-weight="400" fill="#8A5300" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">模型自己算：带上 0.29，</text><text x="440" y="144" text-anchor="middle" font-size="10" font-weight="400" fill="#8A5300" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">后文“29%”的损失更低</text><text x="612.8" y="130" text-anchor="middle" font-size="10" font-weight="400" fill="#8A5300" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">这条留下；没让后文</text><text x="612.8" y="144" text-anchor="middle" font-size="10" font-weight="400" fill="#8A5300" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">更好预测的丢掉</text><text x="785.6" y="130" text-anchor="middle" font-size="10" font-weight="400" fill="#8A5300" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">信号：带调用的原文，</text><text x="785.6" y="144" text-anchor="middle" font-size="10" font-weight="400" fill="#8A5300" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">照常预测下一个词</text><text x="440" y="192" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">前四步不训练，只是造数据；目标：模型自己学会何时调用、调用哪个、参数怎么填，每个 API 只需少量示范</text><text x="20" y="222" text-anchor="start" font-size="12.5" font-weight="700" fill="#B83560" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">HuggingGPT：让大模型当控制器</text><text x="20" y="240" text-anchor="start" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">2023-03 · 用语言作为接口协调已有的 AI 模型</text><text x="860" y="240" text-anchor="end" font-size="10.5" font-weight="400" fill="#8A5300" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">请求：“描述这张损失曲线截图，标出尖峰”</text><text x="116" y="282.665" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">任务规划</text><text x="116" y="297.035" text-anchor="middle" font-size="10" font-weight="400" fill="#8A5300" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">① 图像描述 ② 目标检测</text><text x="332" y="282.665" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">模型选择</text><text x="332" y="297.035" text-anchor="middle" font-size="10" font-weight="400" fill="#8A5300" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">按模型卡各挑一个模型</text><text x="548" y="282.665" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">任务执行</text><text x="548" y="297.035" text-anchor="middle" font-size="10" font-weight="400" fill="#8A5300" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">“一条下降曲线”“2 处尖峰”</text><text x="764" y="282.665" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">回答生成</text><text x="764" y="297.035" text-anchor="middle" font-size="10" font-weight="400" fill="#8A5300" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">“整体下降，两处尖峰”</text><text x="440" y="346" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">这一路不训练：工具（这里是别的模型）不进参数，靠控制器读说明来挑</text></svg>
