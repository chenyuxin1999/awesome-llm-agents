<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" width="880" height="330" role="img" aria-label="Toolformer 与 HuggingGPT"><defs><marker id="ah-s2toolformer" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6577"/></marker></defs><rect x="0" y="0" width="880" height="330" fill="#ffffff"/><path d="M168.8,124 L189.8,124" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-s2toolformer)"/><path d="M341.6,124 L362.6,124" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-s2toolformer)"/><path d="M514.4,124 L535.4,124" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-s2toolformer)"/><path d="M687.2,124 L708.2,124" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-s2toolformer)"/><path d="M212,276 L233,276" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-s2toolformer)"/><path d="M428,276 L449,276" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-s2toolformer)"/><path d="M644,276 L665,276" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-s2toolformer)"/><rect x="20" y="96" width="148.8" height="56" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="192.8" y="96" width="148.8" height="56" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="365.6" y="96" width="148.8" height="56" rx="5" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.5"/><rect x="538.4" y="96" width="148.8" height="56" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><rect x="711.2" y="96" width="148.8" height="56" rx="5" fill="#E9EDF3" stroke="#47546A" stroke-width="1.5"/><rect x="20" y="248" width="192" height="56" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><rect x="236" y="248" width="192" height="56" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><rect x="452" y="248" width="192" height="56" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="668" y="248" width="192" height="56" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><text x="20" y="24" text-anchor="start" font-size="12" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">两条并行的路：把工具使用训进模型，或者让模型当调度者</text><text x="20" y="62" text-anchor="start" font-size="12.5" font-weight="700" fill="#5B45B0" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Toolformer：把工具使用训进模型</text><text x="20" y="80" text-anchor="start" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">2023-02 · 计算器、问答系统、搜索、翻译、日历</text><text x="94.4" y="120.665" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">在文本中插入</text><text x="94.4" y="135.035" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">候选 API 调用</text><text x="267.2" y="120.665" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">执行调用</text><text x="267.2" y="135.035" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">拿到返回结果</text><text x="440" y="120.665" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">比较</text><text x="440" y="135.035" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">后文是否更好预测</text><text x="612.8" y="120.665" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">只留有帮助的</text><text x="612.8" y="135.035" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">其余调用丢掉</text><text x="785.6" y="120.665" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">在这些数据上</text><text x="785.6" y="135.035" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">微调模型</text><text x="440" y="176" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">模型由此自学何时调用、调用哪个、参数怎么填；每个 API 只需要少量示范</text><text x="20" y="214" text-anchor="start" font-size="12.5" font-weight="700" fill="#B83560" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">HuggingGPT：让大模型当控制器</text><text x="20" y="232" text-anchor="start" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">2023-03 · 用语言作为接口协调已有的 AI 模型</text><text x="116" y="272.665" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">任务规划</text><text x="116" y="287.035" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">把请求拆成子任务</text><text x="332" y="272.665" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">模型选择</text><text x="332" y="287.035" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">按 Hugging Face 上的模型描述挑选</text><text x="548" y="272.665" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">任务执行</text><text x="548" y="287.035" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">调用选中的模型</text><text x="764" y="272.665" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">回答生成</text><text x="764" y="287.035" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">汇总结果给用户</text><text x="440" y="324" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">工具（这里是别的模型）不进参数，靠控制器读说明来挑</text></svg>
