<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 290" width="880" height="290" role="img" aria-label="Reflexion 的一轮与反思的边界"><defs><marker id="ah-s3reflexion" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6577"/></marker></defs><rect x="0" y="0" width="880" height="290" fill="#ffffff"/><path d="M168.8,76 L189.8,76" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-s3reflexion)"/><path d="M341.6,76 L362.6,76" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-s3reflexion)"/><path d="M514.4,76 L535.4,76" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-s3reflexion)"/><path d="M687.2,76 L708.2,76" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-s3reflexion)"/><path d="M785.6,108 L785.6,130 L94.4,130 L94.4,111" fill="none" stroke="#5A6577" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#ah-s3reflexion)"/><rect x="20" y="44" width="148.8" height="64" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="192.8" y="44" width="148.8" height="64" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="365.6" y="44" width="148.8" height="64" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><rect x="538.4" y="44" width="148.8" height="64" rx="5" fill="#E9EDF3" stroke="#47546A" stroke-width="1.5"/><rect x="711.2" y="44" width="148.8" height="64" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="20" y="152" width="400" height="124" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="460" y="152" width="400" height="124" rx="5" fill="#FDE8DD" stroke="#C2501A" stroke-width="1.5"/><text x="20" y="24" text-anchor="start" font-size="12" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">目标：权重不变，同一个任务第二次做得比第一次好。琥珀色小字是周报里的例子（示意）；成败由外部检查程序给出</text><text x="94.4" y="72.665" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">试做一次</text><text x="94.4" y="87.035" text-anchor="middle" font-size="10" font-weight="400" fill="#8A5300" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">周报只标出 exp07</text><text x="267.2" y="72.665" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">拿到成败</text><text x="267.2" y="87.035" text-anchor="middle" font-size="10" font-weight="400" fill="#8A5300" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">检查程序：崩溃 1/2 ✗</text><text x="440" y="65.765" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">写一段反思</text><text x="440" y="80.135" text-anchor="middle" font-size="10" font-weight="400" fill="#8A5300" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">“只搜了 loss=nan，漏了</text><text x="440" y="93.935" text-anchor="middle" font-size="10" font-weight="400" fill="#8A5300" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">grad_norm=nan”</text><text x="612.8" y="72.665" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">存进记忆</text><text x="612.8" y="87.035" text-anchor="middle" font-size="10" font-weight="400" fill="#8A5300" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">这段话留到下一次</text><text x="785.6" y="72.665" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">带着反思再试</text><text x="785.6" y="87.035" text-anchor="middle" font-size="10" font-weight="400" fill="#8A5300" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">两种 nan 都搜，标出 exp03</text><text x="440" y="134" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" style="paint-order:stroke;stroke-width:4px;stroke-linejoin:round" stroke="#ffffff">还不对就再来一轮</text><text x="220" y="176" text-anchor="middle" font-size="12.5" font-weight="700" fill="#26805A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">有外部反馈</text><text x="220" y="200" text-anchor="middle" font-size="11" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">测试结果、环境返回、标准答案</text><text x="220" y="222" text-anchor="middle" font-size="11" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">反思有依据，经验可以积累</text><text x="220" y="244" text-anchor="middle" font-size="11" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">记忆保存经验，环境判断经验有没有用</text><text x="660" y="176" text-anchor="middle" font-size="12.5" font-weight="700" fill="#C2501A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">没有外部反馈，只靠模型自查</text><text x="660" y="200" text-anchor="middle" font-size="11" font-weight="500" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Cannot Self-Correct Reasoning Yet（2023）</text><text x="660" y="222" text-anchor="middle" font-size="11" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">推理题上自我纠错后，表现有时反而下降</text><text x="660" y="244" text-anchor="middle" font-size="11" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Chip Huyen：反思有用，也带来额外延迟和成本</text></svg>
