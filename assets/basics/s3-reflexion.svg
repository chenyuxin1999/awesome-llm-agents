<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 290" width="880" height="290" role="img" aria-label="Reflexion 的一轮与反思的边界"><defs><marker id="ah-s3reflexion" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6577"/></marker></defs><rect x="0" y="0" width="880" height="290" fill="#ffffff"/><path d="M168.8,78 L189.8,78" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-s3reflexion)"/><path d="M341.6,78 L362.6,78" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-s3reflexion)"/><path d="M514.4,78 L535.4,78" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-s3reflexion)"/><path d="M687.2,78 L708.2,78" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-s3reflexion)"/><path d="M785.6,106 L785.6,128 L94.4,128 L94.4,109" fill="none" stroke="#5A6577" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#ah-s3reflexion)"/><rect x="20" y="50" width="148.8" height="56" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="192.8" y="50" width="148.8" height="56" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="365.6" y="50" width="148.8" height="56" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><rect x="538.4" y="50" width="148.8" height="56" rx="5" fill="#E9EDF3" stroke="#47546A" stroke-width="1.5"/><rect x="711.2" y="50" width="148.8" height="56" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="20" y="152" width="400" height="124" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="460" y="152" width="400" height="124" rx="5" fill="#FDE8DD" stroke="#C2501A" stroke-width="1.5"/><text x="20" y="24" text-anchor="start" font-size="12" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Reflexion 改变的是下一次尝试能拿到的信息；反思靠不靠得住，取决于反馈从哪里来</text><text x="94.4" y="74.665" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">尝试任务</text><text x="94.4" y="89.035" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">行动者</text><text x="267.2" y="74.665" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">评估</text><text x="267.2" y="89.035" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">成败或分数</text><text x="440" y="74.665" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">写反思</text><text x="440" y="89.035" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">用自然语言总结教训</text><text x="612.8" y="74.665" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">反思记忆</text><text x="612.8" y="89.035" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">存起来</text><text x="785.6" y="74.665" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">下一次尝试</text><text x="785.6" y="89.035" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">把反思带上</text><text x="440" y="124" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" style="paint-order:stroke;stroke-width:4px;stroke-linejoin:round" stroke="#ffffff">可以多轮重复</text><text x="220" y="176" text-anchor="middle" font-size="12.5" font-weight="700" fill="#26805A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">有外部反馈</text><text x="220" y="200" text-anchor="middle" font-size="11" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">测试结果、环境返回、标准答案</text><text x="220" y="222" text-anchor="middle" font-size="11" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">反思有依据，经验可以积累</text><text x="220" y="244" text-anchor="middle" font-size="11" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">记忆保存经验，环境判断经验有没有用</text><text x="660" y="176" text-anchor="middle" font-size="12.5" font-weight="700" fill="#C2501A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">没有外部反馈，只靠模型自查</text><text x="660" y="200" text-anchor="middle" font-size="11" font-weight="500" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Cannot Self-Correct Reasoning Yet（2023）</text><text x="660" y="222" text-anchor="middle" font-size="11" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">推理题上自我纠错后，表现有时反而下降</text><text x="660" y="244" text-anchor="middle" font-size="11" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Chip Huyen：反思有用，也带来额外延迟和成本</text></svg>
