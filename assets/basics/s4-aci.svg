<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380" role="img" aria-label="同一类修复任务的三种接口"><defs><marker id="ah-s4aci" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6577"/></marker></defs><rect x="0" y="0" width="900" height="380" fill="#ffffff"/><path d="M340,74 L377,74" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-s4aci)"/><path d="M340,178 L377,178" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-s4aci)"/><path d="M580,178 L617,178" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-s4aci)"/><path d="M740,206 L740,222 L280,222 L280,209" fill="none" stroke="#5A6577" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#ah-s4aci)"/><path d="M417.333,294 L438.333,294" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-s4aci)"/><path d="M638.667,294 L659.667,294" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-s4aci)"/><rect x="220" y="46" width="120" height="56" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="380" y="46" width="110" height="56" rx="5" fill="#DCEFF1" stroke="#0E6E7E" stroke-width="1.5"/><rect x="502" y="46" width="110" height="56" rx="5" fill="#DCEFF1" stroke="#0E6E7E" stroke-width="1.5"/><rect x="624" y="46" width="110" height="56" rx="5" fill="#DCEFF1" stroke="#0E6E7E" stroke-width="1.5"/><rect x="746" y="46" width="110" height="56" rx="5" fill="#DCEFF1" stroke="#0E6E7E" stroke-width="1.5"/><rect x="220" y="150" width="120" height="56" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="380" y="150" width="200" height="56" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="620" y="150" width="240" height="56" rx="5" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.5"/><rect x="220" y="266" width="197.333" height="56" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><rect x="441.333" y="266" width="197.333" height="56" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="662.667" y="266" width="197.333" height="56" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><text x="20" y="24" text-anchor="start" font-size="12" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">同一类软件任务，接口和动作空间换一种，表现就跟着变。琥珀色小字是同一个问题“日志里有 nan 时解析脚本崩溃”的例子（示意）</text><text x="20" y="64" text-anchor="start" font-size="12.5" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">SWE-agent（2024-05）</text><text x="20" y="82" text-anchor="start" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">为 agent 设计的计算机接口（ACI）</text><text x="280" y="70.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">模型</text><text x="280" y="85.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#8A5300" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">search nan</text><text x="435" y="70.82" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">文件查看器</text><text x="435" y="85.38" text-anchor="middle" font-size="10" font-weight="400" fill="#8A5300" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">parse.py 80–180 行</text><text x="557" y="70.82" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">搜索</text><text x="557" y="85.38" text-anchor="middle" font-size="10" font-weight="400" fill="#8A5300" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">nan 出现在 3 处</text><text x="679" y="70.82" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">编辑</text><text x="679" y="85.38" text-anchor="middle" font-size="10" font-weight="400" fill="#8A5300" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">第 88 行加判断</text><text x="801" y="70.82" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">运行</text><text x="801" y="85.38" text-anchor="middle" font-size="10" font-weight="400" fill="#8A5300" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">测试 12/12 通过</text><text x="620" y="120" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">同一个模型，接口设计得更好，修复成功率明显提升</text><text x="20" y="170" text-anchor="start" font-size="12.5" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">CodeAct（2024-02）</text><text x="20" y="188" text-anchor="start" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">动作写成可执行的 Python 代码</text><text x="280" y="175.165" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">模型</text><text x="280" y="189.225" text-anchor="middle" font-size="9.5" font-weight="400" fill="#8A5300" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">for f in logs: parse(f)</text><text x="480" y="174.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Python 解释器</text><text x="480" y="189.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#8A5300" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">一段代码里循环读完 23 个日志</text><text x="740" y="174.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">执行结果或报错</text><text x="740" y="189.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#8A5300" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">ValueError: nan（exp07）→ 回到模型改</text><text x="510" y="238" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">作者在 17 个模型上报告，比常见动作格式成功率最多高 20%</text><text x="20" y="286" text-anchor="start" font-size="12.5" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Agentless（2024-07）</text><text x="20" y="304" text-anchor="start" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">固定流程，模型不选下一步</text><text x="318.667" y="290.665" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">定位</text><text x="318.667" y="305.035" text-anchor="middle" font-size="10" font-weight="400" fill="#8A5300" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">parse.py 第 88 行</text><text x="540" y="290.665" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">修复</text><text x="540" y="305.035" text-anchor="middle" font-size="10" font-weight="400" fill="#8A5300" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">3 个候选补丁</text><text x="761.333" y="290.665" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">验证</text><text x="761.333" y="305.035" text-anchor="middle" font-size="10" font-weight="400" fill="#8A5300" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">只有补丁 2 过测试</text><text x="540" y="350" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">自主循环很少，结果相当有竞争力：先问任务究竟需要多少动态决策</text></svg>
