<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380" role="img" aria-label="上下文工程与工具设计"><defs><marker id="ah-s5context" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6577"/></marker></defs><rect x="0" y="0" width="900" height="380" fill="#ffffff"/><path d="M140,70 L196,70" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-s5context)"/><path d="M140,124 L196,124" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-s5context)"/><path d="M140,178 L196,178" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-s5context)"/><path d="M140,232 L196,232" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-s5context)"/><path d="M370,70 L417,70" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-s5context)"/><path d="M370,124 L417,124" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-s5context)"/><path d="M370,178 L417,178" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-s5context)"/><path d="M370,232 L417,232" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-s5context)"/><rect x="20" y="50" width="120" height="40" rx="5" fill="#E3EBFF" stroke="#2B57C9" stroke-width="1.5"/><rect x="20" y="104" width="120" height="40" rx="5" fill="#DCEFF1" stroke="#0E6E7E" stroke-width="1.5"/><rect x="20" y="158" width="120" height="40" rx="5" fill="#E9EDF3" stroke="#47546A" stroke-width="1.5"/><rect x="20" y="212" width="120" height="40" rx="5" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.5"/><rect x="200" y="50" width="170" height="40" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><rect x="200" y="104" width="170" height="40" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><rect x="200" y="158" width="170" height="40" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><rect x="200" y="212" width="170" height="40" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><rect x="420" y="50" width="130" height="202" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="580" y="50" width="300" height="202" rx="5" fill="#DCEFF1" stroke="#0E6E7E" stroke-width="1.5"/><rect x="20" y="310" width="860" height="50" rx="5" fill="#F3F5F8" stroke="#D5DBE4" stroke-width="1.5"/><text x="20" y="24" text-anchor="start" font-size="12" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">上下文是有限资源，越长越容易“腐化”；目标是找到能最大化期望结果的最小一组高信号 token</text><text x="80" y="73.72" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">系统提示</text><text x="80" y="127.72" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">工具说明</text><text x="80" y="181.72" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">历史消息</text><text x="80" y="235.72" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">工具返回</text><text x="285" y="66.82" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">即时检索</text><text x="285" y="81.38" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">先留标识，用到再读</text><text x="285" y="120.82" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">压缩</text><text x="285" y="135.38" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">把旧历史总结成摘要</text><text x="285" y="174.82" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">结构化笔记</text><text x="285" y="189.38" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">写到窗口外，需要再取</text><text x="285" y="228.82" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">子 agent</text><text x="285" y="243.38" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">分头探索，只交回摘要</text><text x="485" y="140" text-anchor="middle" font-size="12" font-weight="700" fill="#5B45B0" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">上下文窗口</text><text x="485" y="160" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">有限，边际收益递减</text><text x="285" y="282" text-anchor="middle" font-size="10.5" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Effective context engineering（2025-09）</text><text x="730" y="74" text-anchor="middle" font-size="12" font-weight="700" fill="#0E6E7E" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">工具怎么写（Writing effective tools）</text><text x="598" y="104" text-anchor="start" font-size="11" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">· 围绕少数高价值工作流来设计</text><text x="598" y="132" text-anchor="start" font-size="11" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">· 用命名空间划清工具边界</text><text x="598" y="160" text-anchor="start" font-size="11" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">· 返回人读得懂的名字，少给低层 ID</text><text x="598" y="188" text-anchor="start" font-size="11" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">· 分页、过滤、截断控制返回量</text><text x="598" y="216" text-anchor="start" font-size="11" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">· 用贴近真实的多步任务评测迭代</text><text x="730" y="282" text-anchor="middle" font-size="10.5" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">例：Claude Code 默认把工具返回限制在 25,000 token 以内</text><text x="450" y="331.32" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">两篇合起来回答：给 agent 什么样的工具，让什么信息进入它的上下文</text><text x="450" y="346.19" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">本章三.1 讨论工具接口，三.3 讨论观察与上下文</text></svg>
