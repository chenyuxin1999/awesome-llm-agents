<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" width="880" height="380" role="img" aria-label="工作流与 agent"><defs><marker id="ah-workflowvsagent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6577"/></marker></defs><rect x="0" y="0" width="880" height="380" fill="#ffffff"/><rect x="20" y="40" width="410" height="190" rx="6" fill="#F3F5F8" stroke="#D5DBE4" stroke-width="1"/><path d="M146,110 L163,110" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-workflowvsagent)"/><path d="M276,110 L293,110" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-workflowvsagent)"/><path d="M221,132 L221,160 L91,160 L91,135" fill="none" stroke="#5A6577" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#ah-workflowvsagent)"/><rect x="450" y="40" width="410" height="190" rx="6" fill="#F3F5F8" stroke="#D5DBE4" stroke-width="1"/><path d="M600,106 L697,106" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-workflowvsagent)"/><path d="M697,128 L603,128" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-workflowvsagent)"/><path d="M540,140 L540,178" fill="none" stroke="#5A6577" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#ah-workflowvsagent)"/><rect x="36" y="88" width="110" height="44" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="166" y="88" width="110" height="44" rx="5" fill="#DCEFF1" stroke="#0E6E7E" stroke-width="1.5"/><rect x="296" y="88" width="110" height="44" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="480" y="92" width="120" height="48" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="700" y="92" width="130" height="48" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="20" y="280" width="158" height="56" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><rect x="190" y="280" width="158" height="56" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><rect x="360" y="280" width="158" height="56" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><rect x="530" y="280" width="158" height="56" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><rect x="700" y="280" width="158" height="56" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><text x="20" y="24" text-anchor="start" font-size="12" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">区别在于下一步由谁决定：预先写好的代码路径，还是模型自己</text><text x="34" y="62" text-anchor="start" font-size="12.5" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">工作流：代码预先编排</text><text x="91" y="113.72" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">模型调用 1</text><text x="221" y="113.72" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">代码检查</text><text x="351" y="113.72" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">模型调用 2</text><text x="156" y="175" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" style="paint-order:stroke;stroke-width:4px;stroke-linejoin:round" stroke="#ffffff">未通过：按写好的规则重来</text><text x="225" y="210" text-anchor="middle" font-size="11" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">路径固定、可预测；适合定义清楚的任务</text><text x="464" y="62" text-anchor="start" font-size="12.5" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">agent：模型动态决定</text><text x="540" y="112.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">模型</text><text x="540" y="127.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">选下一步和工具</text><text x="765" y="119.72" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">工具 / 环境</text><text x="648" y="100" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" style="paint-order:stroke;stroke-width:4px;stroke-linejoin:round" stroke="#ffffff">动作</text><text x="648" y="144" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" style="paint-order:stroke;stroke-width:4px;stroke-linejoin:round" stroke="#ffffff">观察</text><text x="550" y="190" text-anchor="start" font-size="11" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">模型自己判断何时停下</text><text x="655" y="214" text-anchor="middle" font-size="11" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">步数无法预知；更灵活，也更难预测</text><text x="20" y="262" text-anchor="start" font-size="12" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Building effective agents 总结的五种工作流模式（从简单方案出发，按需往上加）</text><text x="99" y="304.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">提示链</text><text x="99" y="319.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">一步的输出接下一步</text><text x="269" y="304.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">路由</text><text x="269" y="319.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">先分类，再交给专门流程</text><text x="439" y="304.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">并行化</text><text x="439" y="319.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">分段同跑或多次投票</text><text x="609" y="304.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">编排者与工作者</text><text x="609" y="319.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">中心模型拆分并派活</text><text x="779" y="304.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">评估者与优化者</text><text x="779" y="319.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">一个生成，一个评价</text><text x="440" y="364" text-anchor="middle" font-size="11" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">基本单元是“增强型大模型”：带检索、工具和记忆的一次模型调用</text></svg>
