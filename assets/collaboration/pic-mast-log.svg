<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360" role="img" aria-label="一段多智能体运行记录和 MAST 会给它贴的失败标签"><defs><marker id="ah-picmastlog" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6577"/></marker></defs><rect x="0" y="0" width="900" height="360" fill="#ffffff"/><text x="20" y="26" font-size="13.5" fill="#0E6E7E" font-weight="700" text-anchor="start" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" xml:space="preserve">一段运行记录（接组会前一周改 bug 的例子）</text><text x="620" y="26" font-size="13.5" fill="#0E6E7E" font-weight="700" text-anchor="start" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" xml:space="preserve">MAST 会贴的标签</text><rect x="20" y="44" width="580" height="38" rx="4" fill="#F7F9FB" stroke="#D5DBE4" stroke-width="1"/><rect x="28" y="51" width="64" height="24" rx="12" fill="#FCE4EC" stroke="#B83560" stroke-width="1.4"/><text x="60" y="68" font-size="11.5" fill="#B83560" font-weight="700" text-anchor="middle" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" xml:space="preserve">协调者</text><text x="104" y="68" font-size="12.5" fill="#18202C" font-weight="400" text-anchor="start" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" xml:space="preserve">拆成三块：改数据加载、改训练循环、补测试。</text><rect x="20" y="90" width="580" height="38" rx="4" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1"/><rect x="28" y="97" width="64" height="24" rx="12" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.4"/><text x="60" y="114" font-size="11.5" fill="#5B45B0" font-weight="700" text-anchor="middle" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" xml:space="preserve">成员 A</text><text x="104" y="114" font-size="12.5" fill="#18202C" font-weight="400" text-anchor="start" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" xml:space="preserve">好的，我把字段名统一改成小写。</text><line x1="602" y1="109" x2="616" y2="109" stroke="#5A6577" stroke-width="1.2" marker-end="url(#ah-picmastlog)"/><rect x="620" y="94" width="260" height="30" rx="5" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.4"/><text x="632" y="114" font-size="12.5" fill="#B86E00" font-weight="700" text-anchor="start" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" xml:space="preserve">没问清就动手</text><text x="870" y="114" font-size="10.5" fill="#5A6577" font-weight="400" text-anchor="end" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" xml:space="preserve">第二类 成员不一致</text><rect x="20" y="136" width="580" height="38" rx="4" fill="#F7F9FB" stroke="#D5DBE4" stroke-width="1"/><rect x="28" y="143" width="64" height="24" rx="12" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.4"/><text x="60" y="160" font-size="11.5" fill="#5B45B0" font-weight="700" text-anchor="middle" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" xml:space="preserve">成员 B</text><text x="104" y="160" font-size="12.5" fill="#18202C" font-weight="400" text-anchor="start" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" xml:space="preserve">（没读 A 的消息）照旧读取 batch[&quot;Label&quot;]。</text><line x1="602" y1="155" x2="616" y2="155" stroke="#5A6577" stroke-width="1.2" marker-end="url(#ah-picmastlog)"/><rect x="620" y="140" width="260" height="30" rx="5" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.4"/><text x="632" y="160" font-size="12.5" fill="#B86E00" font-weight="700" text-anchor="start" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" xml:space="preserve">无视别人的输入</text><text x="870" y="160" font-size="10.5" fill="#5A6577" font-weight="400" text-anchor="end" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" xml:space="preserve">第二类 成员不一致</text><rect x="20" y="182" width="580" height="38" rx="4" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1"/><rect x="28" y="189" width="64" height="24" rx="12" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.4"/><text x="60" y="206" font-size="11.5" fill="#5B45B0" font-weight="700" text-anchor="middle" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" xml:space="preserve">成员 C</text><text x="104" y="206" font-size="12.5" fill="#18202C" font-weight="400" text-anchor="start" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" xml:space="preserve">测试写好了，顺手把数据加载也改一下。</text><line x1="602" y1="201" x2="616" y2="201" stroke="#5A6577" stroke-width="1.2" marker-end="url(#ah-picmastlog)"/><rect x="620" y="186" width="260" height="30" rx="5" fill="#E9EDF3" stroke="#47546A" stroke-width="1.4"/><text x="632" y="206" font-size="12.5" fill="#47546A" font-weight="700" text-anchor="start" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" xml:space="preserve">违背任务或角色规定</text><text x="870" y="206" font-size="10.5" fill="#5A6577" font-weight="400" text-anchor="end" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" xml:space="preserve">第一类 系统设计</text><rect x="20" y="228" width="580" height="38" rx="4" fill="#F7F9FB" stroke="#D5DBE4" stroke-width="1"/><rect x="28" y="235" width="64" height="24" rx="12" fill="#DDF3E8" stroke="#26805A" stroke-width="1.4"/><text x="60" y="252" font-size="11.5" fill="#26805A" font-weight="700" text-anchor="middle" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" xml:space="preserve">审查者</text><text x="104" y="252" font-size="12.5" fill="#18202C" font-weight="400" text-anchor="start" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" xml:space="preserve">读了一遍改动，看起来没问题。</text><line x1="602" y1="247" x2="616" y2="247" stroke="#5A6577" stroke-width="1.2" marker-end="url(#ah-picmastlog)"/><rect x="620" y="232" width="260" height="30" rx="5" fill="#FDE8DD" stroke="#C2501A" stroke-width="1.4"/><text x="632" y="252" font-size="12.5" fill="#C2501A" font-weight="700" text-anchor="start" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" xml:space="preserve">验证缺失或不完整</text><text x="870" y="252" font-size="10.5" fill="#5A6577" font-weight="400" text-anchor="end" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" xml:space="preserve">第三类 任务验证</text><rect x="20" y="274" width="580" height="38" rx="4" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1"/><rect x="28" y="281" width="64" height="24" rx="12" fill="#FCE4EC" stroke="#B83560" stroke-width="1.4"/><text x="60" y="298" font-size="11.5" fill="#B83560" font-weight="700" text-anchor="middle" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" xml:space="preserve">协调者</text><text x="104" y="298" font-size="12.5" fill="#18202C" font-weight="400" text-anchor="start" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" xml:space="preserve">审查通过，结束运行。</text><line x1="602" y1="293" x2="616" y2="293" stroke="#5A6577" stroke-width="1.2" marker-end="url(#ah-picmastlog)"/><rect x="620" y="278" width="260" height="30" rx="5" fill="#FDE8DD" stroke="#C2501A" stroke-width="1.4"/><text x="632" y="298" font-size="12.5" fill="#C2501A" font-weight="700" text-anchor="start" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" xml:space="preserve">过早结束</text><text x="870" y="298" font-size="10.5" fill="#5A6577" font-weight="400" text-anchor="end" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" xml:space="preserve">第三类 任务验证</text><text x="20" y="340" font-size="10.5" fill="#5A6577" font-weight="400" text-anchor="start" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" xml:space="preserve">记录为示意；标签名取自 MAST 的十四种失败模式，三类的颜色同右栏</text></svg>
