<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 370" width="900" height="370" role="img" aria-label="多次采样投票、多智能体辩论与等预算对照"><defs><marker id="ah-picvotevsdebate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6577"/></marker></defs><rect x="0" y="0" width="900" height="370" fill="#ffffff"/><rect x="150" y="12" width="600" height="34" rx="6" fill="#E3EBFF" stroke="#2B57C9" stroke-width="1.4"/><text x="450" y="34" font-size="13" fill="#18202C" font-weight="400" text-anchor="middle" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" xml:space="preserve">题目：一个班 23 人，每人交 17 元班费，一共多少元？（正确答案 391）</text><rect x="20" y="62" width="280" height="276" rx="8" fill="#F7F9FB" stroke="#D5DBE4" stroke-width="1"/><text x="160" y="86" font-size="14" fill="#0E6E7E" font-weight="700" text-anchor="middle" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" xml:space="preserve">多次采样再投票</text><text x="160" y="106" font-size="11.5" fill="#5A6577" font-weight="400" text-anchor="middle" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" xml:space="preserve">同一个模型答 5 次，成员之间不交流</text><rect x="310" y="62" width="280" height="276" rx="8" fill="#F7F9FB" stroke="#D5DBE4" stroke-width="1"/><text x="450" y="86" font-size="14" fill="#0E6E7E" font-weight="700" text-anchor="middle" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" xml:space="preserve">多智能体辩论</text><text x="450" y="106" font-size="11.5" fill="#5A6577" font-weight="400" text-anchor="middle" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" xml:space="preserve">3 个实例读彼此的答案，再改一轮</text><rect x="600" y="62" width="280" height="276" rx="8" fill="#F7F9FB" stroke="#D5DBE4" stroke-width="1"/><text x="740" y="86" font-size="14" fill="#0E6E7E" font-weight="700" text-anchor="middle" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sa