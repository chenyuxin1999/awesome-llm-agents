<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 290" width="900" height="290" role="img" aria-label="最准的模型未必是最好的队友"><defs><marker id="ah-preteammate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6577"/></marker></defs><rect x="0" y="0" width="900" height="290" fill="#ffffff"/><rect x="8" y="8" width="470" height="274" rx="6" fill="#F3F5F8" stroke="#D5DBE4" stroke-width="1"/><path d="M114,138 L137,138" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-preteammate)"/><path d="M232,130 L265,80" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-preteammate)"/><path d="M232,146 L265,196" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-preteammate)"/><rect x="490" y="8" width="402" height="274" rx="6" fill="#F3F5F8" stroke="#D5DBE4" stroke-width="1"/><path d="M594,142 L594,167" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-preteammate)"/><path d="M788,142 L788,167" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-preteammate)"/><rect x="22" y="110" width="92" height="56" rx="5" fill="#E3EBFF" stroke="#2B57C9" stroke-width="1.5"/><rect x="140" y="110" width="92" height="56" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="268" y="48" width="196" height="56" rx="5" fill="#DCEFF1" stroke="#0E6E7E" stroke-width="1.5"/><rect x="268" y="170" width="196" height="56" rx="5" fill="#DCEFF1" stroke="#0E6E7E" stroke-width="1.5"/><rect x="140" y="238" width="324" height="34" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="506" y="50" width="176" height="92" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="700" y="50" width="176" height="92" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="506" y="170" width="176" height="50" rx="5" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1.5"/><rect x="700" y="170" width="176" height="50" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><text x="243" y="30" text-anchor="middle" font-size="12.5" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">一次人机共同决策（取自 2020 年论文的设定）</text><text x="68" y="134.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">一个决策</text><text x="68" y="149.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">金融、医疗等</text><text x="186" y="141.72" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">AI 给建议</text><text x="366" y="72.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">人接受建议</text><text x="366" y="87.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">省时间，但要承担 AI 的错误</text><text x="366" y="194.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">人自己解题</text><text x="366" y="209.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">付出核验与思考的成本</text><text x="248" y="104" text-anchor="end" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" style="paint-order:stroke;stroke-width:4px;stroke-linejoin:round" stroke="#ffffff">人判断要不要信</text><text x="302" y="258.255" text-anchor="middle" font-size="10.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">团队效用 = 决策质量，扣掉核验成本，再看人机各自的能力</text><text x="691" y="30" text-anchor="middle" font-size="12.5" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">两个 AI，同一个人（示意）</text><text x="594" y="77.985" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">AI 甲</text><text x="594" y="93.045" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">单独准确率更高</text><text x="594" y="107.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">何时出错难以预判</text><text x="594" y="122.025" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">人难以判断何时该核</text><text x="788" y="77.985" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">AI 乙</text><text x="788" y="93.045" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">准确率略低</text><text x="788" y="107.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">何时出错可以预期</text><text x="788" y="122.025" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">人知道该在哪里多看一眼</text><text x="594" y="198.41" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">团队结果：未必更好</text><text x="788" y="198.41" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">团队结果：可能更好</text><text x="691" y="252" text-anchor="middle" font-size="10.5" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">要优化的是整支队伍的结果，单人分数相加说明不了它</text></svg>
