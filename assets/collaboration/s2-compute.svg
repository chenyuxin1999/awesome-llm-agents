<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="900" height="320" role="img" aria-label="等预算对照：收益从哪里来"><defs><marker id="ah-s2compute" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6577"/></marker></defs><rect x="0" y="0" width="900" height="320" fill="#ffffff"/><path d="M450,48 L154,70" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-s2compute)"/><path d="M154,142 L154,155" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-s2compute)"/><path d="M450,48 L450,70" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-s2compute)"/><path d="M450,142 L450,155" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-s2compute)"/><path d="M450,48 L746,70" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-s2compute)"/><path d="M746,142 L746,155" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-s2compute)"/><rect x="370" y="10" width="160" height="38" rx="5" fill="#E3EBFF" stroke="#2B57C9" stroke-width="1.5"/><rect x="14" y="72" width="280" height="70" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="14" y="158" width="280" height="66" rx="5" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1.5"/><rect x="310" y="72" width="280" height="70" rx="5" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.5"/><rect x="310" y="158" width="280" height="66" rx="5" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1.5"/><rect x="606" y="72" width="280" height="70" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><rect x="606" y="158" width="280" height="66" rx="5" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1.5"/><rect x="14" y="244" width="872" height="64" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><text x="450" y="32.72" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">同一批推理任务</text><text x="154" y="103.63" text-anchor="middle" font-size="12.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">单个模型 + 好提示</text><text x="154" y="118.88" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Rethinking the Bounds</text><text x="154" y="187.01" text-anchor="middle" font-size="10.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">提示写得好，几乎追平当时最好的讨论方法；只有不给示</text><text x="154" y="201.5" text-anchor="middle" font-size="10.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">例时，讨论才明显占优</text><text x="450" y="103.63" text-anchor="middle" font-size="12.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">多次采样 + 投票</text><text x="450" y="118.88" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">More Agents Is All You Need</text><text x="450" y="194.255" text-anchor="middle" font-size="10.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">性能随采样数量上升，任务越难，提升越明显</text><text x="746" y="103.63" text-anchor="middle" font-size="12.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">多智能体讨论</text><text x="746" y="118.88" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">多智能体辩论等</text><text x="746" y="194.255" text-anchor="middle" font-size="10.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">成员读彼此的答案、互相修改，花掉的调用次数也多得多</text><text x="450" y="264.54" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">第二阶段留下的方法论</text><text x="450" y="280.1" text-anchor="middle" font-size="11" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">把多智能体系统和等预算的单体、独立多次尝试放在一起比，才分得清</text><text x="450" y="295.28" text-anchor="middle" font-size="11" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">收益来自交流本身，还是只来自多算了几遍</text></svg>
