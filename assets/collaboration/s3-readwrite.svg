<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" role="img" aria-label="读可以并行，写需要共享上下文"><defs><marker id="ah-s3readwrite" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6577"/></marker></defs><rect x="0" y="0" width="900" height="330" fill="#ffffff"/><rect x="8" y="8" width="430" height="314" rx="6" fill="#F3F5F8" stroke="#D5DBE4" stroke-width="1"/><path d="M224,82 L118,113" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-s3readwrite)"/><path d="M224,82 L330,113" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-s3readwrite)"/><path d="M118,172 L180,207" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-s3readwrite)"/><path d="M330,172 L268,207" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-s3readwrite)"/><rect x="450" y="8" width="442" height="314" rx="6" fill="#F3F5F8" stroke="#D5DBE4" stroke-width="1"/><rect x="134" y="42" width="180" height="40" rx="5" fill="#E3EBFF" stroke="#2B57C9" stroke-width="1.5"/><rect x="28" y="116" width="180" height="56" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="240" y="116" width="180" height="56" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="98" y="210" width="252" height="52" rx="5" fill="#FDE8DD" stroke="#C2501A" stroke-width="1.5"/><rect x="466" y="46" width="200" height="120" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="676" y="46" width="200" height="120" rx="5" fill="#FDE8DD" stroke="#C2501A" stroke-width="1.5"/><rect x="466" y="186" width="410" height="60" rx="5" fill="#E9EDF3" stroke="#47546A" stroke-width="1.5"/><text x="223" y="30" text-anchor="middle" font-size="12.5" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Cognition 的 Flappy Bird 例子：并行写</text><text x="224" y="65.72" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">任务：做一个 Flappy Bird</text><text x="118" y="140.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">子 agent 1：背景</text><text x="118" y="155.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">做成了马里奥风格</text><text x="330" y="140.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">子 agent 2：小鸟</text><text x="330" y="155.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">和游戏机制对不上</text><text x="150" y="100" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" style="paint-order:stroke;stroke-width:4px;stroke-linejoin:round" stroke="#ffffff">只拿到任务摘要</text><text x="224" y="232.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">合并：风格与机制冲突</text><text x="224" y="247.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">两边各自做了对方看不见的隐含决定</text><text x="224" y="296" text-anchor="middle" font-size="10.5" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">原则：共享完整轨迹；每个动作都带着隐含决定</text><text x="671" y="30" text-anchor="middle" font-size="12.5" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Harrison Chase 的调和：读写之分</text><text x="566" y="80.74" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">读</text><text x="566" y="95.8" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">检索、调查、回答窄问题</text><text x="566" y="110.29" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">各条线索彼此独立</text><text x="566" y="124.78" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">冲突的读取后果轻</text><text x="566" y="139.27" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">汇总时去重即可</text><text x="776" y="80.74" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">写</text><text x="776" y="95.8" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">写代码、写报告</text><text x="776" y="110.29" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">并行就要共享上下文</text><text x="776" y="124.78" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">冲突的写入后果重</text><text x="776" y="139.27" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">合并时要对齐决定</text><text x="671" y="212.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Anthropic Research 正好落在左边</text><text x="671" y="227.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">子 agent 只检索，最终报告仍由一个 agent 写</text><text x="671" y="274" text-anchor="middle" font-size="10.5" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">回到开头的故事：查文献那组在读，改代码那组在写</text><text x="671" y="294" text-anchor="middle" font-size="10.5" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">两组结局不同，几乎是注定的</text></svg>
