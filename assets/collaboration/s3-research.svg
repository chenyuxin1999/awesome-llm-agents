="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><rect x="298" y="30" width="150" height="52" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="298" y="96" width="150" height="52" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="298" y="162" width="150" height="52" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="298" y="228" width="150" height="52" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="484" y="106" width="136" height="84" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><rect x="646" y="106" width="112" height="84" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="784" y="106" width="102" height="84" rx="5" fill="#E9EDF3" stroke="#47546A" stroke-width="1.5"/><rect x="484" y="256" width="402" height="100" rx="5" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1.5"/><text x="64" y="131.02" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">用户问题</text><text x="64" y="145.58" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">“世界模型用在</text><text x="64" y="159.38" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">机器人上，有哪</text><text x="64" y="173.18" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">几条路线？”</text><text x="198" y="137.92" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">主研究员 agent</text><text x="198" y="152.48" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">计划：分三个方向查</text><text x="198" y="166.28" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">边查边决定追哪条线</text><text x="373" y="46.3" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">子 agent A</text><text x="373" y="59.98" text-anchor="middle" font-size="9.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">查视频预测</text><text x="373" y="73.09" text-anchor="middle" font-size="9.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">读 9 篇，交回 5 行</text><text x="373" y="112.3" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">子 agent B</text><text x="373" y="125.98" text-anchor="middle" font-size="9.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">查规划</text><text x="373" y="139.09" text-anchor="middle" font-size="9.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">读 7 篇，交回 4 行</text><text x="373" y="178.3" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">子 agent C</text><text x="373" y="191.98" text-anchor="middle" font-size="9.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">查真机训练</text><text x="373" y="205.09" text-anchor="middle" font-size="9.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">读 8 篇，交回 5 行</text><text x="373" y="250.855" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">……</text><text x="373" y="264.535" text-anchor="middle" font-size="9.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">通常 3 到 5 个并行</text><text x="464" y="302" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" style="paint-order:stroke;stroke-width:4px;stroke-linejoin:round" stroke="#ffffff">只把精华交回</text><text x="552" y="131.02" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">主 agent 汇总</text><text x="552" y="145.58" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">判断够不够：</text><text x="552" y="159.38" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">缺少评测方面，</text><text x="552" y="173.18" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">再派一轮</text><text x="376" y="13" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" style="paint-order:stroke;stroke-width:4px;stroke-linejoin:round" stroke="#ffffff">继续追查</text><text x="702" y="131.02" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">引用 agent</text><text x="702" y="145.58" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">每句结论</text><text x="702" y="159.38" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">对回一篇论文</text><text x="702" y="173.18" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">的具体段落</text><text x="835" y="137.765" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">带引用的报告</text><text x="835" y="152.135" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">三条路线，</text><text x="835" y="165.935" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">每条附来源</text><text x="498" y="278" text-anchor="start" font-size="11.5" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">文章报告的数字</text><text x="498" y="300" text-anchor="start" font-size="10.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">内部研究评测：Opus 4 主 + Sonnet 4 子，比单个 Opus 4 高 90.2%</text><text x="498" y="320" text-anchor="start" font-size="10.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">BrowseComp：token 用量一项解释约 80% 的表现差异</text><text x="498" y="340" text-anchor="start" font-size="10.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">代价：约为普通对话 15 倍的 token；复杂查询研究时间最多缩短九成</text><text x="14" y="332" text-anchor="start" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">左半边的问题、篇数和行数都是示意</text><text x="14" y="356" text-anchor="start" font-size="11" font-weight="600" fill="#B83560" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">子 agent 只做读（检索）；最终报告仍由一个 agent 来写</text></svg>
