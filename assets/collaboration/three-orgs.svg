240" fill="none" stroke="#5A6577" stroke-width="1.4" marker-start="url(#ah-threeorgs)" marker-end="url(#ah-threeorgs)"/><rect x="20" y="100" width="78" height="62" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="112" y="100" width="78" height="62" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="204" y="100" width="78" height="62" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="30" y="214" width="242" height="50" rx="5" fill="#FDE8DD" stroke="#C2501A" stroke-width="1.5" stroke-dasharray="4 3"/><rect x="380" y="68" width="130" height="44" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><rect x="316" y="146" width="78" height="46" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="406" y="146" width="78" height="46" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="496" y="146" width="78" height="46" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="360" y="220" width="170" height="44" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><rect x="657" y="116" width="164" height="104" rx="5" fill="#E9EDF3" stroke="#47546A" stroke-width="1.5"/><rect x="649" y="68" width="54" height="28" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="775" y="68" width="54" height="28" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="649" y="242" width="54" height="28" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="775" y="242" width="54" height="28" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><text x="8" y="18" text-anchor="start" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">示意：同一份文献综述，交给三种组织方式去做</text><text x="151" y="54" text-anchor="middle" font-size="13" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">流水线</text><text x="151" y="320" text-anchor="middle" font-size="10.5" font-weight="400" fill="#26805A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">长处：容易追踪</text><text x="151" y="340" text-anchor="middle" font-size="10.5" font-weight="400" fill="#C2501A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">代价：后面的环节继承前面的遗漏</text><text x="445" y="54" text-anchor="middle" font-size="13" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">协调者与工作者</text><text x="445" y="320" text-anchor="middle" font-size="10.5" font-weight="400" fill="#26805A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">长处：适合独立的并行检索</text><text x="445" y="340" text-anchor="middle" font-size="10.5" font-weight="400" fill="#C2501A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">代价：派活和汇总都要排队等协调者</text><text x="739" y="54" text-anchor="middle" font-size="13" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">去中心 / 共享工作区</text><text x="739" y="320" text-anchor="middle" font-size="10.5" font-weight="400" fill="#26805A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">长处：适合探索性的工作</text><text x="739" y="340" text-anchor="middle" font-size="10.5" font-weight="400" fill="#C2501A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">代价：要处理冲突、重复和停止条件</text><text x="59" y="127.82" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">检索</text><text x="59" y="142.38" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">找到 12 篇</text><text x="151" y="120.92" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">写作</text><text x="151" y="135.48" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">按这 12 篇</text><text x="151" y="149.28" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">写 3 页</text><text x="243" y="127.82" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">审查</text><text x="243" y="142.38" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">只读这 3 页</text><text x="151" y="196" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">按顺序交接，每一棒只看到上一棒的产物</text><text x="151" y="235.2" text-anchor="middle" font-size="10" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">检索漏掉的那篇关键论文，</text><text x="151" y="249" text-anchor="middle" font-size="10" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">写作和审查都无从知道</text><text x="445" y="86.82" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">协调者</text><text x="445" y="101.38" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">拆成三条线索</text><text x="355" y="165.51" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">线索 1</text><text x="355" y="179.69" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">读 5 篇</text><text x="445" y="165.51" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">线索 2</text><text x="445" y="179.69" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">读 4 篇</text><text x="535" y="165.51" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">线索 3</text><text x="535" y="179.69" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">读 4 篇</text><text x="445" y="238.82" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">协调者汇总</text><text x="445" y="253.38" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">13 篇去掉 1 篇重复</text><text x="739" y="134" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">共享任务板</text><text x="665" y="156" text-anchor="start" font-size="10" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">查视频预测</text><text x="813" y="156" text-anchor="end" font-size="10" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">甲 认领</text><text x="665" y="178" text-anchor="start" font-size="10" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">查规划</text><text x="813" y="178" text-anchor="end" font-size="10" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">乙 认领</text><text x="665" y="200" text-anchor="start" font-size="10" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">查机器人</text><text x="813" y="200" text-anchor="end" font-size="10" font-weight="500" fill="#C2501A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">甲、丙都认领了</text><text x="676" y="85.41" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">甲</text><text x="802" y="85.41" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">乙</text><text x="676" y="259.41" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">丙</text><text x="802" y="259.41" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">丁</text><text x="739" y="296" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">自己认领任务，交换发现；谁也不负责叫停</text></svg>
