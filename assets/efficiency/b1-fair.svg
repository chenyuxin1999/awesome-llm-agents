<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" width="880" height="380" role="img" aria-label="循环模型的三种比较条件"><defs><marker id="ah-b1fair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6577"/></marker></defs><rect x="0" y="0" width="880" height="380" fill="#ffffff"/><rect x="8" y="34" width="280" height="180" rx="6" fill="#F3F5F8" stroke="#D5DBE4" stroke-width="1"/><rect x="298" y="34" width="280" height="180" rx="6" fill="#F3F5F8" stroke="#D5DBE4" stroke-width="1"/><rect x="588" y="34" width="280" height="180" rx="6" fill="#F3F5F8" stroke="#D5DBE4" stroke-width="1"/><rect x="8" y="224" width="430" height="148" rx="6" fill="#F3F5F8" stroke="#D5DBE4" stroke-width="1"/><path d="M112,301 L147,301" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-b1fair)"/><path d="M270,301 L305,301" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-b1fair)"/><path d="M250,276 L250,262 L170,262 L170,273" fill="none" stroke="#5A6577" stroke-width="1.4" stroke-dasharray="3 3" marker-end="url(#ah-b1fair)"/><rect x="446" y="224" width="426" height="148" rx="6" fill="#F3F5F8" stroke="#D5DBE4" stroke-width="1"/><path d="M520,293 L545,293" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-b1fair)"/><rect x="38" y="114" width="22" height="56" rx="2" fill="#E9EDF3" stroke="#47546A" stroke-width="1.1"/><rect x="64" y="114" width="22" height="56" rx="2" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.1"/><rect x="158" y="114" width="22" height="56" rx="2" fill="#E9EDF3" stroke="#47546A" stroke-width="1.1"/><rect x="184" y="58" width="22" height="112" rx="2" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.1"/><rect x="328" y="114" width="22" height="56" rx="2" fill="#E9EDF3" stroke="#47546A" stroke-width="1.1"/><rect x="354" y="142" width="22" height="28" rx="2" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.1"/><rect x="448" y="114" width="22" height="56" rx="2" fill="#E9EDF3" stroke="#47546A" stroke-width="1.1"/><rect x="474" y="114" width="22" height="56" rx="2" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.1"/><rect x="618" y="114" width="22" height="56" rx="2" fill="#E9EDF3" stroke="#47546A" stroke-width="1.1"/><rect x="644" y="114" width="22" height="56" rx="2" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.1"/><rect x="698" y="114" width="22" height="56" rx="2" fill="#E9EDF3" stroke="#47546A" stroke-width="1.1"/><rect x="724" y="114" width="22" height="56" rx="2" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.1"/><rect x="778" y="114" width="22" height="56" rx="2" fill="#E9EDF3" stroke="#47546A" stroke-width="1.1"/><rect x="804" y="114" width="22" height="56" rx="2" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.1"/><rect x="700" y="8" width="52" height="18" rx="9" fill="#E9EDF3" stroke="#47546A" stroke-width="1.1"/><rect x="780" y="8" width="52" height="18" rx="9" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.1"/><rect x="22" y="276" width="90" height="50" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="150" y="276" width="120" height="50" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="308" y="276" width="90" height="50" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="460" y="276" width="60" height="34" rx="5" fill="#E3EBFF" stroke="#2B57C9" stroke-width="1.5"/><rect x="548" y="266" width="44" height="54" rx="5" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.5"/><rect x="598" y="266" width="44" height="54" rx="5" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.5"/><rect x="648" y="266" width="44" height="54" rx="5" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.5"/><rect x="698" y="266" width="44" height="54" rx="5" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.5"/><rect x="760" y="266" width="100" height="54" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><text x="20" y="22" text-anchor="start" font-size="12" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">同一个循环模型，换一种比较条件，结论回答的就是另一个问题（柱高示意）</text><text x="22" y="56" text-anchor="start" font-size="12.5" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">同参数比</text><text x="63" y="186" text-anchor="middle" font-size="10" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">参数</text><text x="183" y="186" text-anchor="middle" font-size="10" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">每 token 运算</text><text x="148" y="204" text-anchor="middle" font-size="10" font-weight="500" fill="#C2501A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">循环模型多算了，收益可能来自额外计算</text><text x="312" y="56" text-anchor="start" font-size="12.5" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">同计算比</text><text x="353" y="186" text-anchor="middle" font-size="10" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">参数</text><text x="473" y="186" text-anchor="middle" font-size="10" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">每 token 运算</text><text x="438" y="204" text-anchor="middle" font-size="10" font-weight="500" fill="#B83560" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">只匹配了一项，其他预算仍可能不同</text><text x="602" y="56" text-anchor="start" font-size="12.5" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">三项同时匹配（SMELT）</text><text x="643" y="186" text-anchor="middle" font-size="10" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">运算</text><text x="723" y="186" text-anchor="middle" font-size="10" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">非嵌入参数</text><text x="803" y="186" text-anchor="middle" font-size="10" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">KV 缓存</text><text x="728" y="204" text-anchor="middle" font-size="10" font-weight="500" fill="#26805A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">三项都接近相等，剩下的差别才归结构</text><text x="726" y="20.6" text-anchor="middle" font-size="10" font-weight="600" fill="#47546A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">普通模型</text><text x="806" y="20.6" text-anchor="middle" font-size="10" font-weight="600" fill="#5B45B0" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">循环模型</text><text x="22" y="246" text-anchor="start" font-size="12.5" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">SMELT：中间一半层循环两次</text><text x="67" y="297.82" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">前段层</text><text x="67" y="312.38" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">MoE</text><text x="210" y="297.82" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">中间一半层</text><text x="210" y="312.38" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">走两遍</text><text x="353" y="297.82" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">后段层</text><text x="353" y="312.38" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">MoE</text><text x="222" y="346" text-anchor="middle" font-size="10.5" font-weight="600" fill="#26805A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">计算最优前沿上省 6.8%—18.0% 的训练 FLOPs</text><text x="222" y="365" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">优势迁移到下游基准，代码任务上最大</text><text x="460" y="246" text-anchor="start" font-size="12.5" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Hidden Decoding：沿序列方向加计算</text><text x="490" y="296.255" text-anchor="middle" font-size="10.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">token</text><text x="570" y="296.1" text-anchor="middle" font-size="10" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">流 1</text><text x="620" y="296.1" text-anchor="middle" font-size="10" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">流 2</text><text x="670" y="296.1" text-anchor="middle" font-size="10" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">流 3</text><text x="720" y="296.1" text-anchor="middle" font-size="10" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">流 4</text><text x="810" y="289.7" text-anchor="middle" font-size="10.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">主干层数不变</text><text x="810" y="303.19" text-anchor="middle" font-size="9.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">多数层只在流内注意</text><text x="659" y="336" text-anchor="middle" font-size="10.5" font-weight="500" fill="#B86E00" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">每个 token 展开成 n 条流，少数层跨流混合</text><text x="659" y="356" text-anchor="middle" font-size="10.5" font-weight="400" fill="#C2501A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">代价：要继续预训练，内部序列和缓存变多</text></svg>
