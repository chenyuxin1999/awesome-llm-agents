="#2B57C9" stroke-width="1.5"/><rect x="28" y="124" width="80" height="34" rx="5" fill="#E3EBFF" stroke="#2B57C9" stroke-width="1.5"/><rect x="28" y="178" width="80" height="34" rx="5" fill="#E3EBFF" stroke="#2B57C9" stroke-width="1.5"/><rect x="163" y="118" width="110" height="46" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="22" y="266" width="256" height="76" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.1"/><rect x="394" y="72" width="100" height="30" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="374" y="132" width="140" height="50" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="394" y="212" width="100" height="30" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="316" y="266" width="256" height="76" rx="5" fill="#FDE8DD" stroke="#C2501A" stroke-width="1.1"/><rect x="616" y="80" width="34" height="30" rx="4" fill="#FFFFFF" stroke="#A8B1BF" stroke-width="1.1" stroke-dasharray="3 3"/><rect x="658" y="80" width="34" height="30" rx="4" fill="#FFFFFF" stroke="#A8B1BF" stroke-width="1.1" stroke-dasharray="3 3"/><rect x="700" y="80" width="34" height="30" rx="4" fill="#FFFFFF" stroke="#A8B1BF" stroke-width="1.1" stroke-dasharray="3 3"/><rect x="742" y="80" width="34" height="30" rx="4" fill="#FFFFFF" stroke="#A8B1BF" stroke-width="1.1" stroke-dasharray="3 3"/><rect x="784" y="80" width="34" height="30" rx="4" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.1"/><rect x="826" y="80" width="34" height="30" rx="4" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.1"/><rect x="616" y="166" width="34" height="20" rx="3" fill="#DDF3E8" stroke="#26805A" stroke-width="1"/><rect x="658" y="166" width="34" height="20" rx="3" fill="#DDF3E8" stroke="#26805A" stroke-width="1"/><rect x="700" y="166" width="34" height="20" rx="3" fill="#DDF3E8" stroke="#26805A" stroke-width="1"/><rect x="742" y="166" width="34" height="20" rx="3" fill="#DDF3E8" stroke="#26805A" stroke-width="1"/><rect x="784" y="166" width="34" height="20" rx="3" fill="#DDF3E8" stroke="#26805A" stroke-width="1"/><rect x="826" y="166" width="34" height="20" rx="3" fill="#DDF3E8" stroke="#26805A" stroke-width="1"/><rect x="610" y="266" width="256" height="76" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.1"/><text x="22" y="32" text-anchor="start" font-size="12.5" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">DeepLoop</text><text x="22" y="50" text-anchor="start" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">梯度从多次访问汇聚</text><text x="316" y="32" text-anchor="start" font-size="12.5" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Gated Recurrent T.</text><text x="316" y="50" text-anchor="start" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">门控调节每轮更新</text><text x="610" y="32" text-anchor="start" font-size="12.5" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">截断反传与新目标</text><text x="610" y="50" text-anchor="start" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">只反传最后几轮</text><text x="68" y="90.1" text-anchor="middle" font-size="10" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">第 1 次访问</text><text x="68" y="144.1" text-anchor="middle" font-size="10" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">第 2 次访问</text><text x="68" y="198.1" text-anchor="middle" font-size="10" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">第 3 次访问</text><text x="218" y="137.82" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">共享块</text><text x="218" y="152.38" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">一份参数</text><text x="136" y="236" text-anchor="middle" font-size="10" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">三次访问的梯度汇成一次更新，下一次前向</text><text x="136" y="252" text-anchor="middle" font-size="10" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">又被这三次访问一起读回</text><text x="150" y="286" text-anchor="middle" font-size="10" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">残差缩放按“访问”调整</text><text x="150" y="305" text-anchor="middle" font-size="10" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">对照：没有复用时新配方基本不改变表现</text><text x="150" y="324" text-anchor="middle" font-size="10" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">结果来自 GPT-2 小中规模</text><text x="444" y="90.255" text-anchor="middle" font-size="10.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Coda（固定）</text><text x="444" y="154.165" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">共享核心 ×R</text><text x="444" y="168.225" text-anchor="middle" font-size="9.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">门控决定每轮改多少</text><text x="444" y="230.255" text-anchor="middle" font-size="10.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Prelude（固定）</text><text x="444" y="286" text-anchor="middle" font-size="10" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">大规模设置：参数少 63%，峰值解码内存少 59%</text><text x="444" y="305" text-anchor="middle" font-size="10" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">编译后的生成延迟增加 10%</text><text x="444" y="324" text-anchor="middle" font-size="10" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">省下的显存和省下的时间是两笔账</text><text x="633" y="99" text-anchor="middle" font-size="9.5" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">轮1</text><text x="675" y="99" text-anchor="middle" font-size="9.5" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">轮2</text><text x="717" y="99" text-anchor="middle" font-size="9.5" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">轮3</text><text x="759" y="99" text-anchor="middle" font-size="9.5" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">轮4</text><text x="801" y="99" text-anchor="middle" font-size="9.5" font-weight="500" fill="#5B45B0" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">轮5</text><text x="843" y="99" text-anchor="middle" font-size="9.5" font-weight="500" fill="#5B45B0" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">轮6</text><text x="801" y="128" text-anchor="middle" font-size="10" font-weight="500" fill="#5B45B0" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">只有这几轮有梯度</text><text x="610" y="156" text-anchor="start" font-size="10.5" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Looped Flows：每轮加一个局部去噪目标</text><text x="633" y="180" text-anchor="middle" font-size="9" font-weight="500" fill="#26805A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">去噪</text><text x="675" y="180" text-anchor="middle" font-size="9" font-weight="500" fill="#26805A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">去噪</text><text x="717" y="180" text-anchor="middle" font-size="9" font-weight="500" fill="#26805A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">去噪</text><text x="759" y="180" text-anchor="middle" font-size="9" font-weight="500" fill="#26805A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">去噪</text><text x="801" y="180" text-anchor="middle" font-size="9" font-weight="500" fill="#26805A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">去噪</text><text x="843" y="180" text-anchor="middle" font-size="9" font-weight="500" fill="#26805A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">去噪</text><text x="738" y="204" text-anchor="middle" font-size="9.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">噪声逐步减小、共享噪声，让早期轮次学会为后面铺路</text><text x="610" y="232" text-anchor="start" font-size="10.5" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">LoopMTP：第 t 轮对齐 t 步之后的 token</text><text x="738" y="286" text-anchor="middle" font-size="10" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Looped Transformers as Optimizers：</text><text x="738" y="305" text-anchor="middle" font-size="10" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">把每轮更新看作对局部目标的一步优化</text><text x="738" y="324" text-anchor="middle" font-size="10" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">由此推导循环变换的形式</text></svg>
