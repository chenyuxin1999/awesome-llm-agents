="440" y="256" width="420" height="66" rx="5" fill="#E9EDF3" stroke="#47546A" stroke-width="1.2"/><text x="20" y="22" text-anchor="start" font-size="12" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">示意：每一列是一个 token，从下往上是层；箭头画出几种回流把信号送到了哪里</text><text x="90" y="316" text-anchor="middle" font-size="11" font-weight="600" fill="#2B57C9" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">t1</text><text x="90" y="284" text-anchor="middle" font-size="10" font-weight="500" fill="#5B45B0" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">层 1</text><text x="90" y="228" text-anchor="middle" font-size="10" font-weight="500" fill="#5B45B0" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">层 2</text><text x="90" y="172" text-anchor="middle" font-size="10" font-weight="500" fill="#5B45B0" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">层 3</text><text x="90" y="116" text-anchor="middle" font-size="10" font-weight="500" fill="#5B45B0" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">层 4</text><text x="182" y="316" text-anchor="middle" font-size="11" font-weight="600" fill="#2B57C9" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">t2</text><text x="182" y="284" text-anchor="middle" font-size="10" font-weight="500" fill="#5B45B0" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">层 1</text><text x="182" y="228" text-anchor="middle" font-size="10" font-weight="500" fill="#5B45B0" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">层 2</text><text x="182" y="172" text-anchor="middle" font-size="10" font-weight="500" fill="#5B45B0" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">层 3</text><text x="182" y="116" text-anchor="middle" font-size="10" font-weight="500" fill="#5B45B0" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">层 4</text><text x="274" y="316" text-anchor="middle" font-size="11" font-weight="600" fill="#2B57C9" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">t3</text><text x="274" y="284" text-anchor="middle" font-size="10" font-weight="500" fill="#5B45B0" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">层 1</text><text x="274" y="228" text-anchor="middle" font-size="10" font-weight="500" fill="#5B45B0" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">层 2</text><text x="274" y="172" text-anchor="middle" font-size="10" font-weight="500" fill="#5B45B0" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">层 3</text><text x="274" y="116" text-anchor="middle" font-size="10" font-weight="500" fill="#5B45B0" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">层 4</text><text x="366" y="316" text-anchor="middle" font-size="11" font-weight="600" fill="#2B57C9" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">t4</text><text x="366" y="284" text-anchor="middle" font-size="10" font-weight="500" fill="#5B45B0" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">层 1</text><text x="366" y="228" text-anchor="middle" font-size="10" font-weight="500" fill="#5B45B0" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">层 2</text><text x="366" y="172" text-anchor="middle" font-size="10" font-weight="500" fill="#5B45B0" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">层 3</text><text x="366" y="116" text-anchor="middle" font-size="10" font-weight="500" fill="#5B45B0" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">层 4</text><text x="20" y="280" text-anchor="start" font-size="10" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">浅</text><text x="20" y="112" text-anchor="start" font-size="10" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">深</text><text x="452" y="60" text-anchor="start" font-size="11.5" font-weight="700" fill="#B83560" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Write Back the Δ（ReFlux）</text><text x="452" y="79" text-anchor="start" font-size="10.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">把两层之间新增的信息 Δ 写回较浅的层，不回传整个状态</text><text x="452" y="96" text-anchor="start" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">可以同步写回同一个 token，也可以流式送给后面的 token</text><text x="452" y="132" text-anchor="start" font-size="11.5" font-weight="700" fill="#B86E00" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">T^2MLR</text><text x="452" y="151" text-anchor="start" font-size="10.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">前一个 token 的中层表示，送进当前 token 的较早层</text><text x="452" y="168" text-anchor="start" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">中间计算跨时间延续；可以改装进预训练好的模型</text><text x="452" y="204" text-anchor="start" font-size="11.5" font-weight="700" fill="#26805A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Recirculation（虚线，示意）</text><text x="452" y="223" text-anchor="start" font-size="10.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">冻结权重，推理时把较深层的信号反馈到较早处</text><text x="452" y="240" text-anchor="start" font-size="10.5" font-weight="600" fill="#C2501A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">生成时几乎不加延迟，预填充却要逐个位置串行</text><text x="452" y="276" text-anchor="start" font-size="11.5" font-weight="700" fill="#47546A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Looped LM 与组合工具调用</text><text x="452" y="295" text-anchor="start" font-size="10.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">相互依赖的多步调用受益更多，孤立调用收益较小</text><text x="452" y="312" text-anchor="start" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">自适应推理只在需要时加计算，性价比更好</text></svg>
