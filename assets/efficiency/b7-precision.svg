<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" width="880" height="330" role="img" aria-label="低精度的收益要过几道关"><defs><marker id="ah-b7precision" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6577"/></marker></defs><rect x="0" y="0" width="880" height="330" fill="#ffffff"/><path d="M144,60 L160,60" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-b7precision)"/><path d="M287,60 L303,60" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-b7precision)"/><path d="M430,60 L446,60" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-b7precision)"/><path d="M573,60 L589,60" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-b7precision)"/><path d="M716,60 L732,60" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-b7precision)"/><path d="M153.5,100 L153.5,83" fill="none" stroke="#5A6577" stroke-width="1" stroke-dasharray="3 3" marker-end="url(#ah-b7precision)"/><path d="M368,100 L368,83" fill="none" stroke="#5A6577" stroke-width="1" stroke-dasharray="3 3" marker-end="url(#ah-b7precision)"/><path d="M511,100 L511,83" fill="none" stroke="#5A6577" stroke-width="1" stroke-dasharray="3 3" marker-end="url(#ah-b7precision)"/><path d="M654,100 L654,83" fill="none" stroke="#5A6577" stroke-width="1" stroke-dasharray="3 3" marker-end="url(#ah-b7precision)"/><rect x="20" y="40" width="124" height="40" rx="5" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.5"/><rect x="163" y="40" width="124" height="40" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><rect x="306" y="40" width="124" height="40" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="449" y="40" width="124" height="40" rx="5" fill="#FDE8DD" stroke="#C2501A" stroke-width="1.5"/><rect x="592" y="40" width="124" height="40" rx="5" fill="#FDE8DD" stroke="#C2501A" stroke-width="1.5"/><rect x="735" y="40" width="124" height="40" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="20" y="100" width="267" height="80" rx="5" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1.1"/><rect x="306" y="100" width="124" height="80" rx="5" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1.1"/><rect x="449" y="100" width="124" height="80" rx="5" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1.1"/><rect x="592" y="100" width="124" height="80" rx="5" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1.1"/><rect x="20" y="200" width="840" height="56" rx="5" fill="#FDE8DD" stroke="#C2501A" stroke-width="1.2"/><text x="20" y="22" text-anchor="start" font-size="12" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">从“少存几位”到“任务质量不掉”，中间要过好几道关；本分支的论文各管一段</text><text x="82" y="63.565" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">存储位数</text><text x="225" y="63.565" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">解包与转换</text><text x="368" y="63.565" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">内核运算</text><text x="511" y="63.565" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">单层误差</text><text x="654" y="63.565" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">跨层累积</text><text x="797" y="63.565" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">任务质量</text><text x="153.5" y="136.7" text-anchor="middle" font-size="10.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Breaking the 1.58-bit Barrier</text><text x="153.5" y="150.19" text-anchor="middle" font-size="9.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">三值权重里零最多占 51.5%；按分布编码，最低 1.485 位</text><text x="368" y="130.145" text-anchor="middle" font-size="10.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">VC-Attention</text><text x="368" y="143.635" text-anchor="middle" font-size="9.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">值平滑压离群值；FP8 概</text><text x="368" y="156.745" text-anchor="middle" font-size="9.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">率转换省掉 FP32 指数</text><text x="511" y="130.145" text-anchor="middle" font-size="10.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">KronQ</text><text x="511" y="143.635" text-anchor="middle" font-size="9.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">量化目标里加入梯度协方</text><text x="511" y="156.745" text-anchor="middle" font-size="9.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">差</text><text x="654" y="122.9" text-anchor="middle" font-size="10.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Quantization</text><text x="654" y="137.39" text-anchor="middle" font-size="10.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Degradation</text><text x="654" y="150.88" text-anchor="middle" font-size="9.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">误差在层间可能衰减、保</text><text x="654" y="163.99" text-anchor="middle" font-size="9.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">持或放大</text><text x="34" y="222" text-anchor="start" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">FlashLoop：跨轮稀疏更新 + 稀疏注意力 + KV 残差量化，同时作用在好几环上</text><text x="34" y="242" text-anchor="start" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">每一项近似单独都小，叠在一起的误差要一个组件一个组件地加进去看</text><text x="20" y="282" text-anchor="start" font-size="10.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">VC-Attention 同时报告了内核速度（比 BF16 FlashAttention-4 快 1.46—1.59 倍，数据中心 GPU）和整段视频生成速度（1.13—1.19 倍）：</text><text x="20" y="302" text-anchor="start" font-size="10.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">两个数字差得不小，正好用来练习区分算子层面和端到端的测量</text></svg>
