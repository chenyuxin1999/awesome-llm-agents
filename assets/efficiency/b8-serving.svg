l="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="630" y="40" width="106" height="40" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><rect x="752" y="40" width="106" height="40" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="20" y="100" width="106" height="84" rx="5" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1.1"/><rect x="264" y="100" width="228" height="84" rx="5" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1.1"/><rect x="508" y="100" width="228" height="84" rx="5" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1.1"/><rect x="630" y="196" width="106" height="84" rx="5" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1.1"/><rect x="20" y="296" width="840" height="52" rx="5" fill="#E9EDF3" stroke="#47546A" stroke-width="1.2"/><text x="20" y="22" text-anchor="start" font-size="12" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">一个请求从到达到完成经过的环节；本分支的论文落在不同环节上</text><text x="73" y="63.41" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">分词</text><text x="195" y="63.41" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">到达与排队</text><text x="317" y="63.41" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">媒体预处理</text><text x="439" y="63.41" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">预填充</text><text x="561" y="63.41" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">解码批处理</text><text x="683" y="63.41" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">层与专家路由</text><text x="805" y="63.41" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">输出</text><text x="73" y="124.9" text-anchor="middle" font-size="10.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Objective vs.</text><text x="73" y="139.39" text-anchor="middle" font-size="10.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Search</text><text x="73" y="152.88" text-anchor="middle" font-size="9.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">搜索过程比训练</text><text x="73" y="165.99" text-anchor="middle" font-size="9.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">目标影响更大</text><text x="378" y="132.145" text-anchor="middle" font-size="10.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">MiMo-V2.5 全流程优化</text><text x="378" y="145.635" text-anchor="middle" font-size="9.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">GPU 图像预处理、并行视频解码</text><text x="378" y="158.745" text-anchor="middle" font-size="9.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">滑动窗口前缀树、分布式缓存、亲和路由</text><text x="622" y="132.145" text-anchor="middle" font-size="10.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">vSkipper</text><text x="622" y="145.635" text-anchor="middle" font-size="9.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">跳层接回连续批处理、分页缓存和计算图</text><text x="622" y="158.745" text-anchor="middle" font-size="9.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">预计划算时才走路由</text><text x="683" y="228.145" text-anchor="middle" font-size="10.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">专家裁剪</text><text x="683" y="241.635" text-anchor="middle" font-size="9.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">保留约 2/3 的专家</text><text x="683" y="254.745" text-anchor="middle" font-size="9.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">平均保住 98.8% 的表现</text><text x="195" y="116" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">请求长度、并发</text><text x="195" y="132" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">和到达方式要报告</text><text x="34" y="317" text-anchor="start" font-size="10.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">最底下还有软硬件栈：在 16 卡 Ascend 910 上部署 MoE 和多模态服务，用了 12 处源码补丁，</text><text x="34" y="336" text-anchor="start" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">还关掉了几项高吞吐特性来保住数值正确；迁移和维护的成本同样是效率的一部分</text></svg>
