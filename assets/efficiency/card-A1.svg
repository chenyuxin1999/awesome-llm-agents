<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 230" width="560" height="230" role="img" aria-label="ACT 结构"><defs><marker id="ah-carda1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6577"/></marker></defs><rect x="0" y="0" width="560" height="230" fill="#ffffff"/><path d="M127.5,79 L150.5,79" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-carda1)"/><path d="M267,79 L290,79" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-carda1)"/><path d="M406.5,79 L429.5,79" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-carda1)"/><path d="M349.75,118 L349.75,140 L210.25,140 L210.25,121" fill="none" stroke="#5A6577" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#ah-carda1)"/><rect x="14" y="160" width="532" height="44" rx="4" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.2" stroke-dasharray="4 3"/><rect x="14" y="40" width="113.5" height="78" rx="5" fill="#E3EBFF" stroke="#2B57C9" stroke-width="1.5"/><rect x="153.5" y="40" width="113.5" height="78" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="293" y="40" width="113.5" height="78" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><rect x="432.5" y="40" width="113.5" height="78" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><text x="26" y="177" text-anchor="start" font-size="10.2" font-weight="500" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">训练信号：任务本身的损失，加上每多走一步就记一笔的思考代价</text><text x="26" y="195" text-anchor="start" font-size="10.2" font-weight="500" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">训练目标：在答得好的前提下少走几步</text><text x="280" y="17" text-anchor="middle" font-size="10.5" font-weight="600" fill="#2B57C9" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">目标：难的输入多算几步，简单的少算</text><text x="70.75" y="75.665" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">一个输入</text><text x="70.75" y="90.035" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">简单的或困难的</text><text x="210.25" y="75.665" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">网络走一步</text><text x="210.25" y="90.035" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">更新一次内部状态</text><text x="349.75" y="68.765" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">停止单元打分</text><text x="349.75" y="83.135" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">给出这一步停下的概</text><text x="349.75" y="96.935" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">率</text><text x="489.25" y="68.765" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">累计够了就停</text><text x="489.25" y="83.135" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">简单输入早停，难的</text><text x="489.25" y="96.935" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">多走</text><text x="280" y="135" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" style="paint-order:stroke;stroke-width:4px;stroke-linejoin:round" stroke="#ffffff">累计不够，再走一步</text><text x="280" y="220" text-anchor="middle" font-size="10.5" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">网络自己学会在每个输入上走多少步</text></svg>
