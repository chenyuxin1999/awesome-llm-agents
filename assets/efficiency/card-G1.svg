<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 128" width="560" height="128" role="img" aria-label="Manus 上下文工程"><defs><marker id="ah-cardg1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6577"/></marker></defs><rect x="0" y="0" width="560" height="128" fill="#ffffff"/><path d="M127.5,55 L150.5,55" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-cardg1)"/><path d="M267,55 L290,55" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-cardg1)"/><path d="M406.5,55 L429.5,55" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-cardg1)"/><rect x="14" y="16" width="113.5" height="78" rx="5" fill="#E3EBFF" stroke="#2B57C9" stroke-width="1.5"/><rect x="153.5" y="16" width="113.5" height="78" rx="5" fill="#E3EBFF" stroke="#2B57C9" stroke-width="1.5"/><rect x="293" y="16" width="113.5" height="78" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><rect x="432.5" y="16" width="113.5" height="78" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><text x="70.75" y="44.765" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">开头保持不变</text><text x="70.75" y="59.135" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">系统提示里不放精确</text><text x="70.75" y="72.935" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">到秒的时间戳</text><text x="210.25" y="44.765" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">上下文只追加</text><text x="210.25" y="59.135" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">不回头改已有内容，</text><text x="210.25" y="72.935" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">JSON 键顺序固定</text><text x="349.75" y="44.765" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">屏蔽而不删工具</text><text x="349.75" y="59.135" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">工具列表不动，解码</text><text x="349.75" y="72.935" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">时压掉不该选的</text><text x="489.25" y="44.765" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">缓存一直命中</text><text x="489.25" y="59.135" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">命中的输入 token 便</text><text x="489.25" y="72.935" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">宜十倍</text><text x="280" y="118" text-anchor="middle" font-size="10.5" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">agent 每写 1 个 token 要读约 100 个，缓存命中率决定成本</text></svg>
