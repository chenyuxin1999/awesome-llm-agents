<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 182" width="560" height="182" role="img" aria-label="FlashAttention 结构"><defs><marker id="ah-cardo2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6577"/></marker></defs><rect x="0" y="0" width="560" height="182" fill="#ffffff"/><path d="M127.5,79 L150.5,79" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-cardo2)"/><path d="M267,79 L290,79" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-cardo2)"/><path d="M406.5,79 L429.5,79" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-cardo2)"/><path d="M349.75,118 L349.75,140 L210.25,140 L210.25,121" fill="none" stroke="#5A6577" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#ah-cardo2)"/><rect x="14" y="40" width="113.5" height="78" rx="5" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.5"/><rect x="153.5" y="40" width="113.5" height="78" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><rect x="293" y="40" width="113.5" height="78" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="432.5" y="40" width="113.5" height="78" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><text x="280" y="17" text-anchor="middle" font-size="10.5" font-weight="600" fill="#2B57C9" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">目标：算完整个注意力，又不把序列长×序列长的分数矩阵写回显存</text><text x="70.75" y="75.665" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">把 Q、K、V 切块</text><text x="70.75" y="90.035" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">一次只取一小块</text><text x="210.25" y="68.765" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">搬进片上存储</text><text x="210.25" y="83.135" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">片上小而快，显存大</text><text x="210.25" y="96.935" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">而慢</text><text x="349.75" y="68.765" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">块内算注意力</text><text x="349.75" y="83.135" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">边算边更新 softmax</text><text x="349.75" y="96.935" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">的统计量</text><text x="489.25" y="68.765" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">累加进输出</text><text x="489.25" y="83.135" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">整张分数矩阵从不写</text><text x="489.25" y="96.935" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">回显存</text><text x="280" y="135" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" style="paint-order:stroke;stroke-width:4px;stroke-linejoin:round" stroke="#ffffff">取下一块</text><text x="280" y="172" text-anchor="middle" font-size="10.5" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">公式一字不改，长序列也算得动</text></svg>
