<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 230" width="560" height="230" role="img" aria-label="EAGLE 结构"><defs><marker id="ah-cards3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6577"/></marker></defs><rect x="0" y="0" width="560" height="230" fill="#ffffff"/><path d="M127.5,79 L150.5,79" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-cards3)"/><path d="M267,79 L290,79" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-cards3)"/><path d="M406.5,79 L429.5,79" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-cards3)"/><path d="M489.25,118 L489.25,140 L70.75,140 L70.75,121" fill="none" stroke="#5A6577" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#ah-cards3)"/><rect x="14" y="160" width="532" height="44" rx="4" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.2" stroke-dasharray="4 3"/><rect x="14" y="40" width="113.5" height="78" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="153.5" y="40" width="113.5" height="78" rx="5" fill="#E3EBFF" stroke="#2B57C9" stroke-width="1.5"/><rect x="293" y="40" width="113.5" height="78" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><rect x="432.5" y="40" width="113.5" height="78" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><text x="26" y="177" text-anchor="start" font-size="10.2" font-weight="500" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">训练信号：大模型在训练文本上算出的真实特征和下一个 token</text><text x="26" y="195" text-anchor="start" font-size="10.2" font-weight="500" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">训练目标：草稿头猜出的特征和 token 都贴近大模型的</text><text x="280" y="17" text-anchor="middle" font-size="10.5" font-weight="600" fill="#2B57C9" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">目标：让草稿猜得更准，每轮少浪费大模型的验证</text><text 