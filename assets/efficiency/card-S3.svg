 sans-serif">稿</text><text x="280" y="135" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" style="paint-order:stroke;stroke-width:4px;stroke-linejoin:round" stroke="#ffffff">收下的部分接回去</text><text x="280" y="220" text-anchor="middle" font-size="10.5" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">猜特征比猜 token 准，每轮能收下更多 token</text></svg>
