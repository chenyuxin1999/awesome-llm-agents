<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" role="img" aria-label="三种耗时与算子融合"><defs><marker id="ah-l1bottlenecks" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6577"/></marker></defs><rect x="0" y="0" width="880" height="400" fill="#ffffff"/><path d="M186,249 L217,249" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-l1bottlenecks)"/><path d="M284,249 L337,249" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-l1bottlenecks)"/><path d="M468,249 L497,249" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-l1bottlenecks)"/><path d="M564,249 L617,249" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-l1bottlenecks)"/><path d="M186,311 L257,311" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-l1bottlenecks)"/><path d="M430,311 L497,311" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-l1bottlenecks)"/><rect x="20" y="40" width="270" height="76" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="20" y="124" width="270" height="30" rx="4" fill="#FFFFFF" stroke="#5B45B0" stroke-width="1"/><rect x="304" y="40" width="270" height="76" rx="5" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.5"/><rect x="304" y="124" width="270" height="30" rx="4" fill="#FFFFFF" stroke="#B86E00" stroke-width="1"/><rect x="588" y="40" width="270" height="76" rx="5" fill="#E9EDF3" stroke="#47546A" stroke-width="1.5"/><rect x="588" y="124" width="270" height="30" rx="4" fill="#FFFFFF" stroke="#47546A" stroke-width="1"/><rect x="90" y="232" width="96" height="34" rx="5" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.5"/><rect x="220" y="232" width="64" height="34" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="340" y="232" width="128" height="34" rx="5" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.5"/><rect x="500" y="232" width="64" height="34" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="620" y="232" width="96" height="34" rx="5" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.5"/><rect x="90" y="294" width="96" height="34" rx="5" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.5"/><rect x="260" y="294" width="170" height="34" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="500" y="294" width="96" height="34" rx="5" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.5"/><text x="20" y="24" text-anchor="start" font-size="12" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">GPU 像一座工厂：计算单元是车间，显存是仓库；车间再快，运货的路堵了，整座工厂照样闲着</text><text x="155" y="67.23" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">计算</text><text x="155" y="82.29" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">大矩阵乘法</text><text x="155" y="96.78" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">这是买 GPU 想要的部分</text><text x="155" y="144" text-anchor="middle" font-size="11" font-weight="600" fill="#5B45B0" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">对策：让矩阵乘法用满 Tensor Core</text><text x="439" y="67.23" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">带宽</text><text x="439" y="82.29" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">逐元素运算、归一化</text><text x="439" y="96.78" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">时间花在读进来、写回去</text><text x="439" y="144" text-anchor="middle" font-size="11" font-weight="600" fill="#B86E00" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">对策：算子融合</text><text x="723" y="67.23" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">开销</text><text x="723" y="82.29" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Python、框架分发、内核启动</text><text x="723" y="96.78" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">不随问题规模增长</text><text x="723" y="144" text-anchor="middle" font-size="11" font-weight="600" fill="#47546A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">对策：追踪编译、CUDA Graphs</text><text x="20" y="178" text-anchor="start" font-size="11" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">简单诊断：把批量翻倍，运行时间也大致翻倍，就说明开销不是瓶颈；时间几乎不变，就是卡在开销上</text><text x="20" y="212" text-anchor="start" font-size="12.5" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">融合的例子：对同一个张量连做两次余弦</text><text x="20" y="252" text-anchor="start" font-size="11.5" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">不融合</text><text x="138" y="252.41" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">显存 x</text><text x="252" y="252.41" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">cos</text><text x="404" y="252.41" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">显存 中间结果</text><text x="532" y="252.41" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">cos</text><text x="668" y="252.41" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">显存 y</text><text x="203" y="243" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" style="paint-order:stroke;stroke-width:4px;stroke-linejoin:round" stroke="#ffffff">读</text><text x="312" y="243" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" style="paint-order:stroke;stroke-width:4px;stroke-linejoin:round" stroke="#ffffff">写</text><text x="484" y="243" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" style="paint-order:stroke;stroke-width:4px;stroke-linejoin:round" stroke="#ffffff">读</text><text x="592" y="243" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" style="paint-order:stroke;stroke-width:4px;stroke-linejoin:round" stroke="#ffffff">写</text><text x="860" y="254" text-anchor="end" font-size="12" font-weight="700" fill="#C2501A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">4 次显存读写</text><text x="20" y="314" text-anchor="start" font-size="11.5" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">融合后</text><text x="138" y="314.41" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">显存 x</text><text x="345" y="314.41" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">cos 再 cos（片上完成）</text><text x="548" y="314.41" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">显存 y</text><text x="221" y="305" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" style="paint-order:stroke;stroke-width:4px;stroke-linejoin:round" stroke="#ffffff">读</text><text x="463" y="305" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" style="paint-order:stroke;stroke-width:4px;stroke-linejoin:round" stroke="#ffffff">写</text><text x="860" y="316" text-anchor="end" font-size="12" font-weight="700" fill="#26805A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">2 次显存读写</text><text x="20" y="384" text-anchor="start" font-size="11" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">BERT 里非矩阵乘法的操作只占约 0.2% 的浮点运算，实际算力利用率却远低于矩阵乘法，在运行时间里占了不小的份额</text></svg>
