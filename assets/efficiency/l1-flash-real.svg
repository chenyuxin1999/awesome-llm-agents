<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" role="img" aria-label="同一行注意力的两种算法，数字逐步演示"><rect x="0" y="0" width="900" height="500" fill="#ffffff"/><defs><marker id="ar-l1-flash-real" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6577"/></marker></defs><text x="16" y="24" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="13.5" fill="#18202C" text-anchor="start" font-weight="bold">示意：一个查询对 4 个键算注意力（分数取 2.0、1.0、3.0、0.5，值取 1、2、3、4），两种算法得到同一个输出</text><rect x="16" y="40" width="868" height="190" rx="6" fill="#F3F5F8" stroke="#D5DBE4" stroke-width="1.2"/><text x="30" y="64" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="12.5" fill="#C2501A" text-anchor="start" font-weight="bold">标准实现：整行分数先写回显存，再读回来</text><text x="30" y="96" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="11" fill="#5A6577" text-anchor="start" font-weight="normal">① 算分数</text><rect x="30" y="104" width="52" height="26" rx="2" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1.2"/><text x="56.0" y="121.0" font-family="Menlo, Consolas, PingFang SC, Noto Sans CJK SC, monospace" font-size="11" fill="#18202C" text-anchor="middle" font-weight="normal">2.0</text><rect x="82" y="104" width="52" height="26" rx="2" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1.2"/><text x="108.0" y="121.0" font-family="Menlo, Consolas, PingFang SC, Noto Sans CJK SC, monospace" font-size="11" fill="#18202C" text-anchor="middle" font-weight="normal">1.0</text><rect x="134" y="104" width="52" height="26" rx="2" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1.2"/><text x="160.0" y="121.0" font-family="Menlo, Consolas, PingFang SC, Noto Sans CJK SC, monospace" font-size="11" fill="#18202C" text-anchor="middle" font-weight="normal">3.0</text><rect x="186" y="104" width="52" height="26" rx="2" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1.2"/><text x="212.0" y="121.0" font-family="Menlo, Consolas, PingFang SC, Noto Sans CJK SC, monospace" font-size="11" fill="#18202C" text-anchor="middle" font-weight="normal">0.5</text><line x1="240" y1="117" x2="268" y2="117" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ar-l1-flash-real)"/><rect x="272" y="100" width="80" height="34" rx="4" fill="#FDE8DD" stroke="#C2501A" stroke-width="1.2"/><text x="312" y="121" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="11" fill="#C2501A" text-anchor="middle" font-weight="bold">写回显存</text><line x1="354" y1="117" x2="380" y2="117" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ar-l1-flash-real)"/><text x="384" y="96" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="11" fill="#5A6577" text-anchor="start" font-weight="normal">② 读回做 softmax</text><rect x="384" y="104" width="58" height="26" rx="2" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1.2"/><text x="413.0" y="121.0" font-family="Menlo, Consolas, PingFang SC, Noto Sans CJK SC, monospace" font-size="11" fill="#18202C" text-anchor="middle" font-weight="normal">0.232</text><rect x="442" y="104" width="58" height="26" rx="2" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1.2"/><text x="471.0" y="121.0" font-family="Menlo, Consolas, PingFang SC, Noto Sans CJK SC, monospace" font-size="11" fill="#18202C" text-anchor="middle" font-weight="normal">0.085</text><rect x="500" y="104" width="58" height="26" rx="2" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1.2"/><text x="529.0" y="121.0" font-family="Menlo, Consolas, PingFang SC, Noto Sans CJK SC, monospace" font-size="11" fill="#18202C" text-anchor="middle" font-weight="normal">0.631</text><rect x="558" y="104" width="58" height="26" rx="2" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1.2"/><text x="587.0" y="121.0" font-family="Menlo, Consolas, PingFang SC, Noto Sans CJK SC, monospace" font-size="11" fill="#18202C" text-anchor="middle" font-weight="normal">0.052</text><line x1="618" y1="117" x2="640" y2="117" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ar-l1-flash-real)"/><rect x="644" y="100" width="80" height="34" rx="4" fill="#FDE8DD" stroke="#C2501A" stroke-width="1.2"/><text x="684" y="121" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="11" fill="#C2501A" text-anchor="middle" font-weight="bold">写回显存</text><line x1="726" y1="117" x2="750" y2="117" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ar-l1-flash-real)"/><text x="754" y="96" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="11" fill="#5A6577" text-anchor="start" font-weight="normal">③ 读回乘值</text><rect x="754" y="104" width="116" height="26" rx="2" fill="#DDF3E8" stroke="#26805A" stroke-width="1.2"/><text x="812" y="121" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="11.5" fill="#26805A" text-anchor="middle" font-weight="bold">输出 2.502</text><text x="30" y="170" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="11" fill="#18202C" text-anchor="start" font-weight="normal">这里只有 4 个数，可序列长 N = 4096 时，这张分数表每个头、每层有 1,678 万个数，16 位存下来约 32 MB，</text><text x="30" y="190" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="11" fill="#18202C" text-anchor="start" font-weight="normal">要写两遍、读两遍；时间花在搬运上，算本身很快。</text><text x="30" y="214" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="11" fill="#C2501A" text-anchor="start" font-weight="normal">公式没有问题，问题在中间结果走了一趟显存。</text><rect x="16" y="244" width="868" height="214" rx="6" fill="#F3F5F8" stroke="#D5DBE4" stroke-width="1.2"/><text x="30" y="268" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="12.5" fill="#26805A" text-anchor="start" font-weight="bold">FlashAttention：一块一块搬进片上存储，边算边更新两个统计量</text><rect x="30" y="282" width="380" height="120" rx="5" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1.2"/><text x="42" y="302" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="11.5" fill="#18202C" text-anchor="start" font-weight="bold">块 1：键 1、2</text><rect x="42" y="312" width="52" height="26" rx="2" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1.2"/><text x="68.0" y="329.0" font-family="Menlo, Consolas, PingFang SC, Noto Sans CJK SC, monospace" font-size="11" fill="#18202C" text-anchor="middle" font-weight="normal">2.0</text><rect x="94" y="312" width="52" height="26" rx="2" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1.2"/><text x="120.0" y="329.0" font-family="Menlo, Consolas, PingFang SC, Noto Sans CJK SC, monospace" font-size="11" fill="#18202C" text-anchor="middle" font-weight="normal">1.0</text><text x="160" y="324" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#18202C" text-anchor="start" font-weight="normal">当前最大值 m = 2</text><text x="42" y="360" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#18202C" text-anchor="start" font-weight="normal">分母 l = 1 + e⁻¹ = 1.368</text><text x="42" y="378" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#18202C" text-anchor="start" font-weight="normal">分子 = 1×1 + 0.368×2 = 1.736</text><line x1="412" y1="342" x2="440" y2="342" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ar-l1-flash-real)"/><rect x="444" y="282" width="426" height="120" rx="5" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1.2"/><text x="456" y="302" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="11.5" fill="#18202C" text-anchor="start" font-weight="bold">块 2：键 3、4</text><rect x="456" y="312" width="52" height="26" rx="2" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1.2"/><text x="482.0" y="329.0" font-family="Menlo, Consolas, PingFang SC, Noto Sans CJK SC, monospace" font-size="11" fill="#18202C" text-anchor="middle" font-weight="normal">3.0</text><rect x="508" y="312" width="52" height="26" rx="2" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1.2"/><text x="534.0" y="329.0" font-family="Menlo, Consolas, PingFang SC, Noto Sans CJK SC, monospace" font-size="11" fill="#18202C" text-anchor="middle" font-weight="normal">0.5</text><text x="574" y="324" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#B86E00" text-anchor="start" font-weight="normal">新最大值 3：旧的分母和分子先乘 e⁻¹ = 0.368</text><text x="456" y="360" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#18202C" text-anchor="start" font-weight="normal">分母 l = 1.368×0.368 + 1 + e⁻²·⁵ = 1.585</text><text x="456" y="378" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#18202C" text-anchor="start" font-weight="normal">分子 = 1.736×0.368 + 1×3 + 0.082×4 = 3.967</text><rect x="30" y="414" width="840" height="32" rx="4" fill="#DDF3E8" stroke="#26805A" stroke-width="1.2"/><text x="450" y="435" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="11.5" fill="#26805A" text-anchor="middle" font-weight="bold">输出 = 3.967 ÷ 1.585 = 2.502，和标准实现一样；整行分数一直留在片上，写回显存的只有这个输出</text><text x="16" y="484" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="11" fill="#5A6577" text-anchor="start" font-weight="normal">分数和值为示意；32 MB 按 4096 × 4096 个 16 位数算出。这里没有训练，改的只是计算顺序。</text></svg>
