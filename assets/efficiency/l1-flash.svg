<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" width="880" height="330" role="img" aria-label="标准注意力与 FlashAttention 的数据流"><defs><marker id="ah-l1flash" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6577"/></marker></defs><rect x="0" y="0" width="880" height="330" fill="#ffffff"/><rect x="8" y="34" width="864" height="128" rx="6" fill="#F3F5F8" stroke="#D5DBE4" stroke-width="1"/><path d="M112,95 L157,95" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-l1flash)"/><path d="M280,95 L325,95" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-l1flash)"/><path d="M448,95 L493,95" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-l1flash)"/><path d="M616,95 L661,95" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-l1flash)"/><path d="M784,95 L797,95" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-l1flash)"/><rect x="8" y="172" width="864" height="150" rx="6" fill="#F3F5F8" stroke="#D5DBE4" stroke-width="1"/><path d="M336,254 L347,254" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-l1flash)"/><path d="M480,254 L491,254" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-l1flash)"/><path d="M559,232 L559,214 L271,214 L271,229" fill="none" stroke="#5A6577" stroke-width="1.4" stroke-dasharray="3 3" marker-end="url(#ah-l1flash)"/><path d="M132,245 L187,245" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-l1flash)"/><path d="M640,248 L697,248" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-l1flash)"/><rect x="22" y="70" width="90" height="50" rx="5" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.5"/><rect x="160" y="70" width="120" height="50" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="328" y="70" width="120" height="50" rx="5" fill="#FDE8DD" stroke="#C2501A" stroke-width="1.5"/><rect x="496" y="70" width="120" height="50" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="664" y="70" width="120" height="50" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="800" y="70" width="60" height="50" rx="5" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.5"/><rect x="22" y="212" width="110" height="66" rx="5" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.5"/><rect x="190" y="204" width="450" height="84" rx="6" fill="#FFFFFF" stroke="#5B45B0" stroke-width="1.2" stroke-dasharray="5 4"/><rect x="206" y="232" width="130" height="44" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="350" y="232" width="130" height="44" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="494" y="232" width="130" height="44" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="700" y="226" width="90" height="44" rx="5" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.5"/><text x="20" y="22" text-anchor="start" font-size="12" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">示意：注意力的公式不变，变的是数据在显存（HBM）和片上存储（SRAM）之间怎样流动</text><text x="22" y="56" text-anchor="start" font-size="12.5" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">标准实现</text><text x="67" y="91.82" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Q、K、V</text><text x="67" y="106.38" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">在显存</text><text x="220" y="91.82" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">算分数</text><text x="220" y="106.38" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">N×N 矩阵</text><text x="388" y="91.82" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">写回显存</text><text x="388" y="106.38" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">整张分数矩阵</text><text x="556" y="91.82" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">读回做 softmax</text><text x="556" y="106.38" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">再写回一次</text><text x="724" y="98.72" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">再读回乘 V</text><text x="830" y="98.41" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">输出</text><text x="440" y="146" text-anchor="middle" font-size="11" font-weight="500" fill="#C2501A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">N×N 的中间矩阵在显存里来回写读；序列越长，搬运越重</text><text x="22" y="194" text-anchor="start" font-size="12.5" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">FlashAttention</text><text x="77" y="241.82" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Q、K、V</text><text x="77" y="256.38" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">切成小块</text><text x="415" y="222" text-anchor="middle" font-size="11" font-weight="600" fill="#5B45B0" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">片上存储里，一块一块地算</text><text x="271" y="257.41" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">读入一块</text><text x="415" y="250.855" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">块内算分数</text><text x="415" y="264.535" text-anchor="middle" font-size="9.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">边算边更新 softmax</text><text x="559" y="257.41" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">累加到输出</text><text x="700" y="214" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">下一块</text><text x="745" y="251.41" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">只写回输出</text><text x="440" y="310" text-anchor="middle" font-size="11" font-weight="500" fill="#26805A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">完整的分数矩阵从不落回显存；显存读写大幅减少，算的东西基本一样</text></svg>
