roke-width="1.5"/><rect x="152" y="162" width="116" height="62" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="284" y="162" width="80" height="62" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="380" y="162" width="98" height="62" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="608" y="162" width="98" height="62" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="380" y="238" width="212" height="50" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="734" y="162" width="126" height="126" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><text x="20" y="24" text-anchor="start" font-size="12" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">KV 缓存的大小由几个因子相乘而来；第 2 层的经典工作各自压住其中一个</text><text x="78" y="67.51" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">同时处理的序列数</text><text x="78" y="81.69" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">并发</text><text x="210" y="67.51" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">每条保留的历史长度</text><text x="210" y="81.69" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">token 数</text><text x="324" y="74.41" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">层数</text><text x="429" y="74.41" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">键值头的组数</text><text x="543" y="74.41" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">每组的维度</text><text x="657" y="67.51" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">每个数的字节</text><text x="657" y="81.69" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">精度</text><text x="144" y="76" text-anchor="middle" font-size="14" font-weight="700" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">×</text><text x="276" y="76" text-anchor="middle" font-size="14" font-weight="700" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">×</text><text x="372" y="76" text-anchor="middle" font-size="14" font-weight="700" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">×</text><text x="486" y="76" text-anchor="middle" font-size="14" font-weight="700" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">×</text><text x="600" y="76" text-anchor="middle" font-size="14" font-weight="700" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">×</text><text x="718" y="76" text-anchor="middle" font-size="14" font-weight="700" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">=</text><text x="797" y="67.665" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">KV 缓存大小</text><text x="797" y="82.035" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">每个请求、每块卡</text><text x="78" y="183.145" text-anchor="middle" font-size="10.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">批量大小的取舍</text><text x="78" y="196.635" text-anchor="middle" font-size="9.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">吞吐高了，单请求更慢</text><text x="78" y="209.745" text-anchor="middle" font-size="9.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">（第 3 层）</text><text x="210" y="189.7" text-anchor="middle" font-size="10.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">滑动窗口、驱逐</text><text x="210" y="203.19" text-anchor="middle" font-size="9.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">H2O、StreamingLLM</text><text x="324" y="189.7" text-anchor="middle" font-size="10.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">跨层共享</text><text x="324" y="203.19" text-anchor="middle" font-size="9.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">几层共用一份</text><text x="429" y="183.145" text-anchor="middle" font-size="10.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">MQA、GQA</text><text x="429" y="196.635" text-anchor="middle" font-size="9.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">多个查询头共用键</text><text x="429" y="209.745" text-anchor="middle" font-size="9.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">值</text><text x="657" y="189.7" text-anchor="middle" font-size="10.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">量化缓存</text><text x="657" y="203.19" text-anchor="middle" font-size="9.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">用更少的位存</text><text x="486" y="259.7" text-anchor="middle" font-size="10.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">MLA：键值压进低维潜在向量</text><text x="486" y="273.19" text-anchor="middle" font-size="9.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">DeepSeek-V2 报告缓存减少 93.3%</text><text x="797" y="200.81" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">分页分配</text><text x="797" y="214.99" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">PagedAttention</text><text x="797" y="228.79" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">大小没变</text><text x="797" y="242.59" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">碎片少了</text><text x="797" y="256.39" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">同样显存装更多</text><text x="20" y="318" text-anchor="start" font-size="11" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">左边几项改的是“逻辑上要存多少”，右边的分页改的是“实际分配得有多高效”，这两件事要分开看</text></svg>
