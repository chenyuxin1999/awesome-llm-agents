<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" width="880" height="360" role="img" aria-label="推测解码的一轮"><defs><marker id="ah-l2specdec" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6577"/></marker></defs><rect x="0" y="0" width="880" height="360" fill="#ffffff"/><path d="M170,72 L196,72" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-l2specdec)"/><path d="M386,72 L417,72" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-l2specdec)"/><path d="M415,198 L415,239" fill="none" stroke="#5A6577" stroke-width="1.4" stroke-dasharray="3 3" marker-end="url(#ah-l2specdec)"/><rect x="20" y="44" width="150" height="56" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><rect x="200" y="56" width="38" height="30" rx="4" fill="#E3EBFF" stroke="#2B57C9" stroke-width="1.2" stroke-dasharray="4 3"/><rect x="246" y="56" width="38" height="30" rx="4" fill="#E3EBFF" stroke="#2B57C9" stroke-width="1.2" stroke-dasharray="4 3"/><rect x="292" y="56" width="38" height="30" rx="4" fill="#E3EBFF" stroke="#2B57C9" stroke-width="1.2" stroke-dasharray="4 3"/><rect x="338" y="56" width="38" height="30" rx="4" fill="#E3EBFF" stroke="#2B57C9" stroke-width="1.2" stroke-dasharray="4 3"/><rect x="420" y="44" width="210" height="56" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="200" y="150" width="78" height="48" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="288" y="150" width="78" height="48" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="376" y="150" width="78" height="48" rx="5" fill="#FDE8DD" stroke="#C2501A" stroke-width="1.5"/><rect x="464" y="150" width="78" height="48" rx="5" fill="#F3F5F8" stroke="#D5DBE4" stroke-width="1.5"/><rect x="330" y="242" width="180" height="44" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="590" y="172" width="38" height="30" rx="4" fill="#E3EBFF" stroke="#2B57C9" stroke-width="1.2"/><rect x="636" y="172" width="38" height="30" rx="4" fill="#E3EBFF" stroke="#2B57C9" stroke-width="1.2"/><rect x="682" y="172" width="38" height="30" rx="4" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.2"/><rect x="20" y="298" width="840" height="50" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.2"/><text x="20" y="24" text-anchor="start" font-size="12" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">推测解码的一轮：草稿模型先猜，目标模型一次验完</text><text x="95" y="68.82" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">① 草稿模型</text><text x="95" y="83.38" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">便宜，逐个猜 4 个</text><text x="219" y="76" text-anchor="middle" font-size="11" font-weight="600" fill="#2B57C9" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">d1</text><text x="265" y="76" text-anchor="middle" font-size="11" font-weight="600" fill="#2B57C9" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">d2</text><text x="311" y="76" text-anchor="middle" font-size="11" font-weight="600" fill="#2B57C9" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">d3</text><text x="357" y="76" text-anchor="middle" font-size="11" font-weight="600" fill="#2B57C9" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">d4</text><text x="525" y="68.82" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">② 目标模型一次前向</text><text x="525" y="83.38" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">5 个位置的概率一起算出</text><text x="752" y="64" text-anchor="middle" font-size="10.5" font-weight="500" fill="#5B45B0" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">目标模型只被调用一次</text><text x="752" y="82" text-anchor="middle" font-size="10.5" font-weight="500" fill="#5B45B0" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">权重只读一遍</text><text x="20" y="136" text-anchor="start" font-size="12" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">③ 从左往右逐个检查</text><text x="239" y="170.51" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">d1</text><text x="239" y="184.69" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">收下</text><text x="327" y="170.51" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">d2</text><text x="327" y="184.69" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">收下</text><text x="415" y="170.51" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">d3</text><text x="415" y="184.69" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">拒绝</text><text x="503" y="170.51" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">d4</text><text x="503" y="184.69" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">作废</text><text x="420" y="260.82" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">在 d3 处重新采一个</text><text x="420" y="275.38" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">按修正后的分布</text><text x="590" y="160" text-anchor="start" font-size="12" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">④ 本轮输出</text><text x="609" y="192" text-anchor="middle" font-size="11" font-weight="600" fill="#2B57C9" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">d1</text><text x="655" y="192" text-anchor="middle" font-size="11" font-weight="600" fill="#2B57C9" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">d2</text><text x="701" y="192" text-anchor="middle" font-size="11" font-weight="600" fill="#5B45B0" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">新</text><text x="730" y="192" text-anchor="start" font-size="10.5" font-weight="500" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">3 个 token，1 次目标模型调用</text><text x="590" y="226" text-anchor="start" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">4 个全收下时，还能顺手从目标模型多得 1 个</text><text x="34" y="318" text-anchor="start" font-size="11" font-weight="500" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">接受规则：目标模型给这个 token 的概率不低于草稿模型，就直接收下；否则按两者之比的概率收下</text><text x="34" y="337" text-anchor="start" font-size="11" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">配合拒绝后的修正采样，输出分布和直接用目标模型采样一致（Leviathan 等；Chen 等）</text></svg>
