="4" fill="#FFFFFF" stroke="#A8B1BF" stroke-width="1" stroke-dasharray="3 3"/><rect x="428" y="104" width="42" height="36" rx="5" fill="#E3EBFF" stroke="#2B57C9" stroke-width="1.5"/><rect x="474" y="104" width="42" height="36" rx="4" fill="#FFFFFF" stroke="#A8B1BF" stroke-width="1" stroke-dasharray="3 3"/><rect x="336" y="162" width="42" height="36" rx="4" fill="#FFFFFF" stroke="#A8B1BF" stroke-width="1" stroke-dasharray="3 3"/><rect x="382" y="162" width="42" height="36" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><rect x="428" y="162" width="42" height="36" rx="4" fill="#FFFFFF" stroke="#A8B1BF" stroke-width="1" stroke-dasharray="3 3"/><rect x="474" y="162" width="42" height="36" rx="5" fill="#E3EBFF" stroke="#2B57C9" stroke-width="1.5"/><rect x="22" y="208" width="490" height="50" rx="5" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.5"/><rect x="618" y="74" width="180" height="44" rx="5" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.5"/><rect x="558" y="156" width="140" height="40" rx="5" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.5"/><rect x="718" y="156" width="140" height="40" rx="5" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.5"/><rect x="558" y="232" width="140" height="40" rx="5" fill="#E3EBFF" stroke="#2B57C9" stroke-width="1.5"/><rect x="718" y="232" width="140" height="40" rx="5" fill="#E3EBFF" stroke="#2B57C9" stroke-width="1.5"/><text x="20" y="24" text-anchor="start" font-size="12" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">左：把每条序列的缓存切成小块，按需分配；右：前缀相同的请求复用已经算好的键值</text><text x="22" y="58" text-anchor="start" font-size="12.5" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">PagedAttention（vLLM）</text><text x="70" y="84" text-anchor="start" font-size="11" font-weight="600" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">逻辑块</text><text x="22" y="112" text-anchor="start" font-size="11" font-weight="700" fill="#2B57C9" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">请求 A</text><text x="22" y="162" text-anchor="start" font-size="11" font-weight="700" fill="#B83560" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">请求 B</text><text x="91" y="111.255" text-anchor="middle" font-size="10.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">A0</text><text x="139" y="111.255" text-anchor="middle" font-size="10.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">A1</text><text x="187" y="111.255" text-anchor="middle" font-size="10.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">A2</text><text x="91" y="161.255" text-anchor="middle" font-size="10.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">B0</text><text x="139" y="161.255" text-anchor="middle" font-size="10.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">B1</text><text x="118" y="190" text-anchor="middle" font-size="9.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">A0、B0 是相同的前缀，都指向 #0</text><text x="272" y="84" text-anchor="middle" font-size="11" font-weight="600" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">块表</text><text x="232" y="118" text-anchor="start" font-size="10.5" font-weight="600" fill="#2B57C9" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">A → #0 #2 #7</text><text x="232" y="156" text-anchor="start" font-size="10.5" font-weight="600" fill="#B83560" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">B → #0 #5</text><text x="426" y="84" text-anchor="middle" font-size="11" font-weight="600" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">显存里的物理块</text><text x="357" y="101" text-anchor="middle" font-size="9" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">#0</text><text x="357" y="124.945" text-anchor="middle" font-size="9.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">前缀</text><text x="403" y="101" text-anchor="middle" font-size="9" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">#1</text><text x="403" y="126" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">空</text><text x="449" y="101" text-anchor="middle" font-size="9" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">#2</text><text x="449" y="125.255" text-anchor="middle" font-size="10.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">A1</text><text x="495" y="101" text-anchor="middle" font-size="9" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">#3</text><text x="495" y="126" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">空</text><text x="357" y="159" text-anchor="middle" font-size="9" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">#4</text><text x="357" y="184" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">空</text><text x="403" y="159" text-anchor="middle" font-size="9" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">#5</text><text x="403" y="183.255" text-anchor="middle" font-size="10.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">B1</text><text x="449" y="159" text-anchor="middle" font-size="9" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">#6</text><text x="449" y="184" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">空</text><text x="495" y="159" text-anchor="middle" font-size="9" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">#7</text><text x="495" y="183.255" text-anchor="middle" font-size="10.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">A2</text><text x="267" y="229.82" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">块表记下每个逻辑块放在哪个物理块</text><text x="267" y="244.38" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">物理块不必连续；新 token 写满一块再分配下一块</text><text x="267" y="284" text-anchor="middle" font-size="11" font-weight="500" fill="#26805A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">碎片少了，同一块显存能装下更多并发请求</text><text x="267" y="306" text-anchor="middle" font-size="11" font-weight="500" fill="#B86E00" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">两个请求的前缀放在同一个物理块里，只存一份</text><text x="558" y="58" text-anchor="start" font-size="12.5" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">RadixAttention（SGLang）</text><text x="708" y="92.82" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">系统提示 + 工具说明</text><text x="708" y="107.38" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">所有请求共用</text><text x="628" y="179.41" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">对话 1 的历史</text><text x="788" y="179.41" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">对话 2 的历史</text><text x="628" y="255.41" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">第 3 轮新输入</text><text x="788" y="255.41" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">第 5 轮新输入</text><text x="708" y="300" text-anchor="middle" font-size="11" font-weight="500" fill="#2B57C9" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">只有蓝色部分要重新预填充</text></svg>
