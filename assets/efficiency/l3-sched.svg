<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" width="880" height="360" role="img" aria-label="预填充与解码的三种调度"><defs><marker id="ah-l3sched" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6577"/></marker></defs><rect x="0" y="0" width="880" height="360" fill="#ffffff"/><path d="M330,250 L330,279" fill="none" stroke="#5A6577" stroke-width="1.4" stroke-dasharray="3 3" marker-end="url(#ah-l3sched)"/><rect x="190" y="50" width="40" height="34" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="234" y="50" width="40" height="34" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="278" y="50" width="236" height="34" rx="5" fill="#E3EBFF" stroke="#2B57C9" stroke-width="1.5"/><rect x="518" y="50" width="40" height="34" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="562" y="50" width="40" height="34" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="278" y="92" width="236" height="22" rx="4" fill="#FDE8DD" stroke="#C2501A" stroke-width="1"/><rect x="190" y="136" width="92" height="34" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><rect x="286" y="136" width="92" height="34" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><rect x="382" y="136" width="92" height="34" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><rect x="478" y="136" width="92" height="34" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><rect x="574" y="136" width="40" height="34" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="618" y="136" width="40" height="34" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="190" y="220" width="150" height="30" rx="5" fill="#E3EBFF" stroke="#2B57C9" stroke-width="1.5"/><rect x="344" y="220" width="150" height="30" rx="5" fill="#E3EBFF" stroke="#2B57C9" stroke-width="1.5"/><rect x="498" y="220" width="150" height="30" rx="5" fill="#E3EBFF" stroke="#2B57C9" stroke-width="1.5"/><rect x="190" y="282" width="40" height="30" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="234" y="282" width="40" height="30" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="278" y="282" width="40" height="30" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="322" y="282" width="40" height="30" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="366" y="282" width="40" height="30" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="410" y="282" width="40" height="30" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="454" y="282" width="40" height="30" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="498" y="282" width="40" height="30" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="542" y="282" width="40" height="30" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="586" y="282" width="40" height="30" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><text x="20" y="24" text-anchor="start" font-size="12" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">示意：横向是时间，每一格是 GPU 上执行的一批；d 是正在解码的请求，P 是新来请求的预填充</text><text x="20" y="64" text-anchor="start" font-size="12" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">混在一起</text><text x="20" y="82" text-anchor="start" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">朴素的批处理</text><text x="210" y="70.255" text-anchor="middle" font-size="10.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">d</text><text x="254" y="70.255" text-anchor="middle" font-size="10.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">d</text><text x="396" y="70.255" text-anchor="middle" font-size="10.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">P（整段长提示）</text><text x="538" y="70.255" text-anchor="middle" font-size="10.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">d</text><text x="582" y="70.255" text-anchor="middle" font-size="10.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">d</text><text x="396" y="107" text-anchor="middle" font-size="10.5" font-weight="500" fill="#C2501A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">这段时间里正在解码的请求全被卡住</text><text x="20" y="150" text-anchor="start" font-size="12" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Sarathi-Serve</text><text x="20" y="168" text-anchor="start" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">切块后拼进解码批</text><text x="236" y="156.255" text-anchor="middle" font-size="10.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">d + P 第 1 块</text><text x="332" y="156.255" text-anchor="middle" font-size="10.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">d + P 第 2 块</text><text x="428" y="156.255" text-anchor="middle" font-size="10.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">d + P 第 3 块</text><text x="524" y="156.255" text-anchor="middle" font-size="10.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">d + P 第 4 块</text><text x="594" y="156.255" text-anchor="middle" font-size="10.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">d</text><text x="638" y="156.255" text-anchor="middle" font-size="10.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">d</text><text x="430" y="196" text-anchor="middle" font-size="10.5" font-weight="500" fill="#26805A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">每批大小相近，解码一直在往前走</text><text x="20" y="236" text-anchor="start" font-size="12" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">DistServe</text><text x="20" y="254" text-anchor="start" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">两个阶段分开放</text><text x="265" y="238.255" text-anchor="middle" font-size="10.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">P（请求 1）</text><text x="419" y="238.255" text-anchor="middle" font-size="10.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">P（请求 2）</text><text x="573" y="238.255" text-anchor="middle" font-size="10.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">P（请求 3）</text><text x="660" y="240" text-anchor="start" font-size="10.5" font-weight="600" fill="#2B57C9" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">GPU 组 A：只做预填充</text><text x="210" y="300.255" text-anchor="middle" font-size="10.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">d</text><text x="254" y="300.255" text-anchor="middle" font-size="10.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">d</text><text x="298" y="300.255" text-anchor="middle" font-size="10.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">d</text><text x="342" y="300.255" text-anchor="middle" font-size="10.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">d</text><text x="386" y="300.255" text-anchor="middle" font-size="10.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">d</text><text x="430" y="300.255" text-anchor="middle" font-size="10.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">d</text><text x="474" y="300.255" text-anchor="middle" font-size="10.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">d</text><text x="518" y="300.255" text-anchor="middle" font-size="10.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">d</text><text x="562" y="300.255" text-anchor="middle" font-size="10.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">d</text><text x="606" y="300.255" text-anchor="middle" font-size="10.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">d</text><text x="638" y="302" text-anchor="start" font-size="10.5" font-weight="600" fill="#5B45B0" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">GPU 组 B：只做解码</text><text x="340" y="270" text-anchor="start" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" style="paint-order:stroke;stroke-width:4px;stroke-linejoin:round" stroke="#ffffff">KV 缓存传过去</text><text x="20" y="344" text-anchor="start" font-size="11" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">DistServe 按首 token 延迟和每 token 延迟两个目标分别给两组 GPU 配资源；代价是两组之间要搬 KV 缓存</text></svg>
