<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 372" width="880" height="372" role="img" aria-label="循环深度模型的结构与训练"><defs><marker id="ah-l4recurrentdepth" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6577"/></marker></defs><rect x="0" y="0" width="880" height="372" fill="#ffffff"/><path d="M116,95 L147,95" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-l4recurrentdepth)"/><path d="M280,95 L477,95" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-l4recurrentdepth)"/><path d="M440,162 L565,162 L565,137" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-l4recurrentdepth)"/><path d="M650,95 L697,95" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-l4recurrentdepth)"/><path d="M780,126 L780,153" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-l4recurrentdepth)"/><path d="M600,56 L600,40 L530,40 L530,53" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-l4recurrentdepth)"/><rect x="20" y="70" width="96" height="50" rx="5" fill="#E3EBFF" stroke="#2B57C9" stroke-width="1.5"/><rect x="150" y="64" width="130" height="62" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="320" y="140" width="120" height="44" rx="5" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.5"/><rect x="480" y="56" width="170" height="78" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="700" y="64" width="160" height="62" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="700" y="156" width="160" height="36" rx="5" fill="#E3EBFF" stroke="#2B57C9" stroke-width="1.5"/><rect x="20" y="214" width="410" height="144" rx="6" fill="#FCE4EC" stroke="#B83560" stroke-width="1.2"/><rect x="450" y="214" width="410" height="74" rx="6" fill="#DDF3E8" stroke="#26805A" stroke-width="1.2"/><rect x="450" y="296" width="410" height="62" rx="6" fill="#FDE8DD" stroke="#C2501A" stroke-width="1.2"/><text x="20" y="24" text-anchor="start" font-size="12" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Geiping 等人（2025）：在标准 Transformer 里放一个可以反复调用的循环块，测试时多转几圈</text><text x="68" y="98.72" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">输入 token</text><text x="215" y="91.82" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Prelude</text><text x="215" y="106.38" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">几层，把输入嵌入为 e</text><text x="380" y="158.82" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">初始状态 s₀</text><text x="380" y="173.38" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">随机噪声</text><text x="565" y="84.92" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">循环块 R</text><text x="565" y="99.48" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">读入上一轮状态和 e</text><text x="565" y="113.28" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">输出新状态</text><text x="780" y="91.82" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Coda</text><text x="780" y="106.38" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">几层 + 预测头</text><text x="780" y="177.41" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">下一个 token 的概率</text><text x="378" y="87" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" style="paint-order:stroke;stroke-width:4px;stroke-linejoin:round" stroke="#ffffff">e：每一轮都重新注入</text><text x="565" y="34" text-anchor="middle" font-size="11" font-weight="700" fill="#5B45B0" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" style="paint-order:stroke;stroke-width:4px;stroke-linejoin:round" stroke="#ffffff">转 r 轮</text><text x="34" y="236" text-anchor="start" font-size="12.5" font-weight="700" fill="#B83560" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">训练</text><text x="34" y="258" text-anchor="start" font-size="11" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">每个序列随机抽一个循环次数（平均 32，带长尾）</text><text x="34" y="280" text-anchor="start" font-size="11" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">只对最后 8 轮反传，显存和反向计算不随轮数增长</text><text x="34" y="302" text-anchor="start" font-size="11" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">35 亿参数，用 8000 亿 token 训练</text><text x="464" y="236" text-anchor="start" font-size="12.5" font-weight="700" fill="#26805A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">测试</text><text x="464" y="258" text-anchor="start" font-size="11" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">多转几圈，推理基准上的表现随之上升；某些情况下</text><text x="464" y="278" text-anchor="start" font-size="11" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">计算负载相当于一个 500 亿参数的模型</text><text x="464" y="318" text-anchor="start" font-size="12" font-weight="700" fill="#C2501A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Lilian Weng 提醒的问题</text><text x="464" y="341" text-anchor="start" font-size="11" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">训练脆弱，隐藏状态可能塌缩；增加轮数后收益会饱和</text></svg>
