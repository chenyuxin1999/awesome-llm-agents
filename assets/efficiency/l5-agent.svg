<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" width="880" height="380" role="img" aria-label="agent 层面的效率取舍"><defs><marker id="ah-l5agent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6577"/></marker></defs><rect x="0" y="0" width="880" height="380" fill="#ffffff"/><path d="M310,59 L417,80" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-l5agent)"/><path d="M310,105 L417,110" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-l5agent)"/><path d="M310,151 L417,140" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-l5agent)"/><path d="M310,197 L417,170" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-l5agent)"/><path d="M310,243 L417,241" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-l5agent)"/><path d="M650,127 L677,127" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-l5agent)"/><path d="M650,241 L677,241" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-l5agent)"/><path d="M270,338 L297,338" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-l5agent)"/><rect x="20" y="40" width="290" height="38" rx="5" fill="#E3EBFF" stroke="#2B57C9" stroke-width="1.5"/><rect x="20" y="86" width="290" height="38" rx="5" fill="#E3EBFF" stroke="#2B57C9" stroke-width="1.5"/><rect x="20" y="132" width="290" height="38" rx="5" fill="#E3EBFF" stroke="#2B57C9" stroke-width="1.5"/><rect x="20" y="178" width="290" height="38" rx="5" fill="#E3EBFF" stroke="#2B57C9" stroke-width="1.5"/><rect x="20" y="224" width="290" height="38" rx="5" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.5"/><rect x="420" y="52" width="230" height="150" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><rect x="420" y="218" width="230" height="46" rx="5" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.5"/><rect x="680" y="52" width="180" height="212" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="20" y="310" width="250" height="56" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="300" y="310" width="170" height="56" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="490" y="310" width="170" height="56" rx="5" fill="#FDE8DD" stroke="#C2501A" stroke-width="1.5"/><rect x="680" y="310" width="180" height="56" rx="5" fill="#E9EDF3" stroke="#47546A" stroke-width="1.5"/><text x="20" y="24" text-anchor="start" font-size="12" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Manus 的几条做法，各自在为梯子上的哪一层服务</text><text x="165" y="55.855" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">前缀保持稳定</text><text x="165" y="69.535" text-anchor="middle" font-size="9.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">开头不放精确到秒的时间戳</text><text x="165" y="108.41" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">上下文只追加、不回改</text><text x="165" y="154.41" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">序列化时 JSON 键的顺序固定</text><text x="165" y="200.41" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">屏蔽 logits，不在中途增删工具</text><text x="165" y="239.855" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">把文件系统当作外部记忆</text><text x="165" y="253.535" text-anchor="middle" font-size="9.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">网页正文可以丢，留下 URL</text><text x="535" y="101.74" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">前缀缓存命中</text><text x="535" y="116.8" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">第 3 层的前缀复用</text><text x="535" y="131.29" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">命中缓存的输入 token</text><text x="535" y="145.78" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">比未命中的便宜十倍</text><text x="535" y="160.27" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">（按 Claude Sonnet 的价格）</text><text x="535" y="237.82" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">可恢复的压缩</text><text x="535" y="252.38" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">第 2 层驱逐之外的另一条路</text><text x="770" y="125.495" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">共同目标</text><text x="770" y="140.555" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">输入约 100</text><text x="770" y="155.045" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">输出约 1</text><text x="770" y="169.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif"></text><text x="770" y="184.025" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">预填充和缓存</text><text x="770" y="198.515" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">命中率是成本大头</text><text x="20" y="296" text-anchor="start" font-size="12" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Anthropic 的多 agent 研究系统：时间和 token 朝相反方向走</text><text x="145" y="341.41" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">并行子 agent + 并行工具调用</text><text x="385" y="334.82" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">研究时间</text><text x="385" y="349.38" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">复杂查询最多缩短 90%</text><text x="575" y="334.82" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">token 用量</text><text x="575" y="349.38" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">约为普通对话的 15 倍</text><text x="770" y="334.82" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">适用条件</text><text x="770" y="349.38" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">任务价值足够高</text></svg>
