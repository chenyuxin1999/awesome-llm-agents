<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380" role="img" aria-label="一次服务一个请求和八个请求拼成一批"><rect x="0" y="0" width="900" height="380" fill="#ffffff"/><defs><marker id="ar-pic-batching" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6577"/></marker></defs><text x="20" y="28" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="13" fill="#18202C" text-anchor="start" font-weight="bold">同一块 GPU、同一个 70 亿参数的模型（16 位权重约 14 GB），解码每一步都要读一遍权重和 KV 缓存（时间按带宽约 2 TB/s 估算，示意）</text><rect x="16" y="44" width="426" height="320" rx="6" fill="#F3F5F8" stroke="#D5DBE4" stroke-width="1.2"/><text x="30" y="70" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="13" fill="#2B57C9" text-anchor="start" font-weight="bold">一次只服务 1 个请求</text><rect x="30" y="84" width="150" height="46" rx="4" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.2"/><text x="105" y="104" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="12" fill="#5B45B0" text-anchor="middle" font-weight="bold">读一遍权重</text><text x="105" y="121" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="11" fill="#5A6577" text-anchor="middle" font-weight="normal">14 GB</text><rect x="230" y="84" width="44" height="20" rx="3" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.2"/><text x="252" y="98" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#B86E00" text-anchor="middle" font-weight="normal">R1</text><rect x="280" y="84" width="44" height="20" rx="3" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1.2" stroke-dasharray="3 3"/><text x="302" y="98" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#5A6577" text-anchor="middle" font-weight="normal">R2</text><rect x="330" y="84" width="44" height="20" rx="3" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1.2" stroke-dasharray="3 3"/><text x="352" y="98" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#5A6577" text-anchor="middle" font-weight="normal">R3</text><rect x="380" y="84" width="44" height="20" rx="3" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1.2" stroke-dasharray="3 3"/><text x="402" y="98" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#5A6577" text-anchor="middle" font-weight="normal">R4</text><rect x="230" y="110" width="44" height="20" rx="3" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1.2" stroke-dasharray="3 3"/><text x="252" y="124" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#5A6577" text-anchor="middle" font-weight="normal">R5</text><rect x="280" y="110" width="44" height="20" rx="3" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1.2" stroke-dasharray="3 3"/><text x="302" y="124" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#5A6577" text-anchor="middle" font-weight="normal">R6</text><rect x="330" y="110" width="44" height="20" rx="3" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1.2" stroke-dasharray="3 3"/><text x="352" y="124" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#5A6577" text-anchor="middle" font-weight="normal">R7</text><rect x="380" y="110" width="44" height="20" rx="3" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1.2" stroke-dasharray="3 3"/><text x="402" y="124" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#5A6577" text-anchor="middle" font-weight="normal">R8</text><line x1="182" y1="107" x2="224" y2="107" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ar-pic-batching)"/><text x="30" y="160" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="12" fill="#5A6577" text-anchor="start" font-weight="normal">每一步花的时间</text><text x="196" y="160" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="12.5" fill="#18202C" text-anchor="start" font-weight="bold">约 8 毫秒（读 14 + 2.4 GB）</text><text x="30" y="186" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="12" fill="#5A6577" text-anchor="start" font-weight="normal">每一步写出</text><text x="196" y="186" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="12.5" fill="#18202C" text-anchor="start" font-weight="bold">1 个 token</text><text x="30" y="212" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="12" fill="#5A6577" text-anchor="start" font-weight="normal">KV 缓存（每个请求 2 万 token）</text><text x="276" y="212" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="12.5" fill="#18202C" text-anchor="start" font-weight="bold">2.4 GB</text><text x="30" y="238" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="12" fill="#5A6577" text-anchor="start" font-weight="normal">新请求</text><text x="196" y="238" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="12.5" fill="#18202C" text-anchor="start" font-weight="bold">不用等，到了就算</text><rect x="458" y="44" width="426" height="320" rx="6" fill="#F3F5F8" stroke="#D5DBE4" stroke-width="1.2"/><text x="472" y="70" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="13" fill="#26805A" text-anchor="start" font-weight="bold">8 个请求拼成一批</text><rect x="472" y="84" width="150" height="46" rx="4" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.2"/><text x="547" y="104" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="12" fill="#5B45B0" text-anchor="middle" font-weight="bold">读一遍权重</text><text x="547" y="121" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="11" fill="#5A6577" text-anchor="middle" font-weight="normal">14 GB</text><rect x="672" y="84" width="44" height="20" rx="3" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.2"/><text x="694" y="98" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#B86E00" text-anchor="middle" font-weight="normal">R1</text><rect x="722" y="84" width="44" height="20" rx="3" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.2"/><text x="744" y="98" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#B86E00" text-anchor="middle" font-weight="normal">R2</text><rect x="772" y="84" width="44" height="20" rx="3" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.2"/><text x="794" y="98" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#B86E00" text-anchor="middle" font-weight="normal">R3</text><rect x="822" y="84" width="44" height="20" rx="3" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.2"/><text x="844" y="98" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#B86E00" text-anchor="middle" font-weight="normal">R4</text><rect x="672" y="110" width="44" height="20" rx="3" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.2"/><text x="694" y="124" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#B86E00" text-anchor="middle" font-weight="normal">R5</text><rect x="722" y="110" width="44" height="20" rx="3" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.2"/><text x="744" y="124" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#B86E00" text-anchor="middle" font-weight="normal">R6</text><rect x="772" y="110" width="44" height="20" rx="3" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.2"/><text x="794" y="124" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#B86E00" text-anchor="middle" font-weight="normal">R7</text><rect x="822" y="110" width="44" height="20" rx="3" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.2"/><text x="844" y="124" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#B86E00" text-anchor="middle" font-weight="normal">R8</text><line x1="624" y1="107" x2="666" y2="107" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ar-pic-batching)"/><text x="472" y="160" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="12" fill="#5A6577" text-anchor="start" font-weight="normal">每一步花的时间</text><text x="638" y="160" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="12.5" fill="#18202C" text-anchor="start" font-weight="bold">约 16.5 毫秒（读 14 + 19 GB）</text><text x="472" y="186" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="12" fill="#5A6577" text-anchor="start" font-weight="normal">每一步写出</text><text x="638" y="186" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="12.5" fill="#18202C" text-anchor="start" font-weight="bold">8 个 token</text><text x="472" y="212" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="12" fill="#5A6577" text-anchor="start" font-weight="normal">KV 缓存（每个请求 2 万 token）</text><text x="718" y="212" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="12.5" fill="#18202C" text-anchor="start" font-weight="bold">8 × 2.4 ≈ 19 GB</text><text x="472" y="238" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="12" fill="#5A6577" text-anchor="start" font-weight="normal">新请求</text><text x="638" y="238" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="12.5" fill="#18202C" text-anchor="start" font-weight="bold">新到的请求要等下一批</text><rect x="30" y="262" width="398" height="88" rx="4" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1.2"/><text x="44" y="286" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="12.5" fill="#2B57C9" text-anchor="start" font-weight="bold">吞吐：每秒约 120 个 token</text><text x="44" y="308" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="11.5" fill="#18202C" text-anchor="start" font-weight="normal">读一遍权重只服务一个请求，</text><text x="44" y="328" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="11.5" fill="#18202C" text-anchor="start" font-weight="normal">计算单元大部分时间闲着</text><rect x="472" y="262" width="398" height="88" rx="4" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1.2"/><text x="486" y="286" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="12.5" fill="#26805A" text-anchor="start" font-weight="bold">吞吐：每秒约 480 个 token</text><text x="486" y="308" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="11.5" fill="#18202C" text-anchor="start" font-weight="normal">代价：缓存涨到约 19 GB，每一步</text><text x="486" y="328" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="11.5" fill="#18202C" text-anchor="start" font-weight="normal">慢了一倍，新请求还要排队</text></svg>
