l="#C2501A" text-anchor="middle" font-weight="normal">0.00</text><rect x="788" y="140" width="70" height="30" rx="2" fill="#FDE8DD" stroke="#C2501A" stroke-width="1.4"/><text x="823" y="160" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="12" fill="#C2501A" text-anchor="middle" font-weight="normal">60.0</text><text x="250" y="190" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="12" fill="#C2501A" text-anchor="start" font-weight="normal">8 个普通数只剩 0 和 ±0.47 三种取值，差别几乎全丢了</text><text x="20" y="228" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="12" fill="#5A6577" text-anchor="start" font-weight="normal">LLM.int8()：离群维度单独留在 16 位，其余按自己的最大值 0.53 量化</text><text x="20" y="258" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="12.5" fill="#18202C" text-anchor="start" font-weight="bold">变回小数</text><rect x="250" y="238" width="60" height="30" rx="2" fill="#DDF3E8" stroke="#26805A" stroke-width="1"/><text x="280" y="258" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="12" fill="#26805A" text-anchor="middle" font-weight="normal">0.12</text><rect x="316" y="238" width="60" height="30" rx="2" fill="#DDF3E8" stroke="#26805A" stroke-width="1"/><text x="346" y="258" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="12" fill="#26805A" text-anchor="middle" font-weight="normal">-0.53</text><rect x="382" y="238" width="60" height="30" rx="2" fill="#DDF3E8" stroke="#26805A" stroke-width="1"/><text x="412" y="258" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="12" fill="#26805A" text-anchor="middle" font-weight="normal">0.07</text><rect x="448" y="238" width="60" height="30" rx="2" fill="#DDF3E8" stroke="#26805A" stroke-width="1"/><text x="478" y="258" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="12" fill="