<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360" role="img" aria-label="推测解码的账：接受率高和低时"><rect x="0" y="0" width="900" height="360" fill="#ffffff"/><defs><marker id="ar-pic-spec-accounting" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6577"/></marker></defs><text x="20" y="28" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="13" fill="#18202C" text-anchor="start" font-weight="bold">每轮草稿猜 4 个，草稿每猜一个花大模型一次前向的 0.1；大模型验证一轮花 1（成本为示意，期望值按推测采样的接受规则算）</text><rect x="16" y="44" width="868" height="142" rx="6" fill="#F3F5F8" stroke="#D5DBE4" stroke-width="1.2"/><text x="30" y="68" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="13" fill="#26805A" text-anchor="start" font-weight="bold">草稿猜得准：接受率 0.8</text><rect x="30" y="82" width="52" height="30" rx="3" fill="#DDF3E8" stroke="#26805A" stroke-width="1.2"/><text x="56" y="102" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="11" fill="#26805A" text-anchor="middle" font-weight="normal">收下</text><rect x="88" y="82" width="52" height="30" rx="3" fill="#DDF3E8" stroke="#26805A" stroke-width="1.2"/><text x="114" y="102" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="11" fill="#26805A" text-anchor="middle" font-weight="normal">收下</text><rect x="146" y="82" width="52" height="30" rx="3" fill="#DDF3E8" stroke="#26805A" stroke-width="1.2"/><text x="172" y="102" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="11" fill="#26805A" text-anchor="middle" font-weight="normal">收下</text><rect x="204" y="82" width="52" height="30" rx="3" fill="#FDE8DD" stroke="#C2501A" stroke-width="1.2"/><text x="230" y="102" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="11" fill="#C2501A" text-anchor="middle" font-weight="normal">被拒</text><rect x="262" y="82" width="52" height="30" rx="3" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.2"/><text x="288" y="102" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="11" fill="#5B45B0" text-anchor="middle" font-weight="normal">补 1 个</text><text x="330" y="94" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="11.5" fill="#5A6577" text-anchor="start" font-weight="normal">这一次的例子：</text><text x="330" y="112" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="12" fill="#18202C" text-anchor="start" font-weight="normal">大模型一次前向拿到 4 个 token</text><text x="30" y="140" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="12" fill="#5A6577" text-anchor="start" font-weight="normal">接受率 0.8 时，平均每轮收下</text><text x="260" y="140" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="13" fill="#18202C" text-anchor="start" font-weight="bold">约 3.4 个 token</text><text x="30" y="166" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="12" fill="#5A6577" text-anchor="start" font-weight="normal">每轮成本 1 + 4 × 0.1 =</text><text x="260" y="166" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="13" fill="#18202C" text-anchor="start" font-weight="bold">1.4</text><rect x="600" y="80" width="268" height="92" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.2"/><text x="734" y="106" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="12" fill="#26805A" text-anchor="middle" font-weight="normal">平均每个 token 花</text><text x="734" y="136" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="20" fill="#26805A" text-anchor="middle" font-weight="bold">1.4 ÷ 3.4 ≈ 0.42</text><text x="734" y="160" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="11" fill="#5A6577" text-anchor="middle" font-weight="normal">（不用推测解码时是 1）</text><rect x="16" y="198" width="868" height="142" rx="6" fill="#F3F5F8" stroke="#D5DBE4" stroke-width="1.2"/><text x="30" y="222" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="13" fill="#C2501A" text-anchor="start" font-weight="bold">草稿猜不准：接受率 0.3</text><rect x="30" y="236" width="52" height="30" rx="3" fill="#DDF3E8" stroke="#26805A" stroke-width="1.2"/><text x="56" y="256" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="11" fill="#26805A" text-anchor="middle" font-weight="normal">收下</text><rect x="88" y="236" width="52" height="30" rx="3" fill="#FDE8DD" stroke="#C2501A" stroke-width="1.2"/><text x="114" y="256" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="11" fill="#C2501A" text-anchor="middle" font-weight="normal">被拒</text><rect x="146" y="236" width="52" height="30" rx="3" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1.2" stroke-dasharray="3 3"/><text x="172" y="256" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="11" fill="#5A6577" text-anchor="middle" font-weight="normal">作废</text><rect x="204" y="236" width="52" height="30" rx="3" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1.2" stroke-dasharray="3 3"/><text x="230" y="256" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="11" fill="#5A6577" text-anchor="middle" font-weight="normal">作废</text><rect x="262" y="236" width="52" height="30" rx="3" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.2"/><text x="288" y="256" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="11" fill="#5B45B0" text-anchor="middle" font-weight="normal">补 1 个</text><text x="330" y="248" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="11.5" fill="#5A6577" text-anchor="start" font-weight="normal">这一次的例子：</text><text x="330" y="266" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="12" fill="#18202C" text-anchor="start" font-weight="normal">大模型一次前向拿到 2 个 token</text><text x="30" y="294" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="12" fill="#5A6577" text-anchor="start" font-weight="normal">接受率 0.3 时，平均每轮收下</text><text x="260" y="294" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="13" fill="#18202C" text-anchor="start" font-weight="bold">约 1.4 个 token</text><text x="30" y="320" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="12" fill="#5A6577" text-anchor="start" font-weight="normal">每轮成本 1 + 4 × 0.1 =</text><text x="260" y="320" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="13" fill="#18202C" text-anchor="start" font-weight="bold">1.4</text><rect x="600" y="234" width="268" height="92" rx="5" fill="#FDE8DD" stroke="#C2501A" stroke-width="1.2"/><text x="734" y="260" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="12" fill="#C2501A" text-anchor="middle" font-weight="normal">平均每个 token 花</text><text x="734" y="290" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="20" fill="#C2501A" text-anchor="middle" font-weight="bold">1.4 ÷ 1.4 ≈ 0.98</text><text x="734" y="314" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="11" fill="#5A6577" text-anchor="middle" font-weight="normal">（不用推测解码时是 1）</text></svg>
