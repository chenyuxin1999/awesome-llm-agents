C" stroke="#B86E00" stroke-width="1"/><rect x="534" y="132" width="11" height="22" rx="2" fill="#FFF1DC" stroke="#B86E00" stroke-width="1" stroke-dasharray="2 2"/><rect x="612" y="122" width="96" height="42" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="422" y="196" width="11" height="22" rx="2" fill="#FFF1DC" stroke="#B86E00" stroke-width="1"/><rect x="436" y="196" width="11" height="22" rx="2" fill="#FFF1DC" stroke="#B86E00" stroke-width="1"/><rect x="450" y="196" width="11" height="22" rx="2" fill="#FFF1DC" stroke="#B86E00" stroke-width="1"/><rect x="464" y="196" width="11" height="22" rx="2" fill="#FFF1DC" stroke="#B86E00" stroke-width="1"/><rect x="478" y="196" width="11" height="22" rx="2" fill="#FFF1DC" stroke="#B86E00" stroke-width="1"/><rect x="492" y="196" width="11" height="22" rx="2" fill="#FFF1DC" stroke="#B86E00" stroke-width="1"/><rect x="506" y="196" width="11" height="22" rx="2" fill="#FFF1DC" stroke="#B86E00" stroke-width="1"/><rect x="520" y="196" width="11" height="22" rx="2" fill="#FFF1DC" stroke="#B86E00" stroke-width="1"/><rect x="534" y="196" width="11" height="22" rx="2" fill="#FFF1DC" stroke="#B86E00" stroke-width="1"/><rect x="548" y="196" width="11" height="22" rx="2" fill="#FFF1DC" stroke="#B86E00" stroke-width="1" stroke-dasharray="2 2"/><rect x="612" y="186" width="96" height="42" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="366" y="266" width="492" height="50" rx="5" fill="#FDE8DD" stroke="#C2501A" stroke-width="1.5"/><text x="22" y="32" text-anchor="start" font-size="13" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">预填充：一次读完整段提示</text><text x="44" y="68" text-anchor="middle" font-size="10" font-weight="500" fill="#2B57C9" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">t1</text><text x="80" y="68" text-anchor="middle" font-size="10" font-weight="500" fill="#2B57C9" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">t2</text><text x="116" y="68" text-anchor="middle" font-size="10" font-weight="500" fill="#2B57C9" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">t3</text><text x="152" y="68" text-anchor="middle" font-size="10" font-weight="500" fill="#2B57C9" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">t4</text><text x="188" y="68" text-anchor="middle" font-size="10" font-weight="500" fill="#2B57C9" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">t5</text><text x="224" y="68" text-anchor="middle" font-size="10" font-weight="500" fill="#2B57C9" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">t6</text><text x="260" y="68" text-anchor="middle" font-size="10" font-weight="500" fill="#2B57C9" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">t7</text><text x="296" y="68" text-anchor="middle" font-size="10" font-weight="500" fill="#2B57C9" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">t8</text><text x="170" y="130.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">一次前向，8 个位置一起算</text><text x="170" y="145.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">矩阵乘法很大，计算单元能忙起来</text><text x="176" y="180" text-anchor="start" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">写入</text><text x="170" y="234" text-anchor="middle" font-size="10.5" font-weight="500" fill="#B86E00" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">8 个位置的 KV 缓存</text><text x="170" y="275.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">瓶颈：算力</text><text x="170" y="290.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">长提示天然带来大量并行运算</text><text x="170" y="332" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">agent 每一步都要做一次</text><text x="366" y="32" text-anchor="start" font-size="13" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">解码：每步只出一个 token</text><text x="803" y="131.23" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">全部权重</text><text x="803" y="146.29" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">每一步</text><text x="803" y="160.78" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">都要读一遍</text><text x="368" y="82" text-anchor="start" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">第 1 步</text><text x="660" y="75.51" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">前向</text><text x="660" y="89.69" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">出 1 个 token</text><text x="368" y="146" text-anchor="start" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">第 2 步</text><text x="660" y="139.51" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">前向</text><text x="660" y="153.69" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">出 1 个 token</text><text x="368" y="210" text-anchor="start" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">第 3 步</text><text x="660" y="203.51" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">前向</text><text x="660" y="217.69" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">出 1 个 token</text><text x="512" y="254" text-anchor="middle" font-size="10.5" font-weight="400" fill="#B86E00" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">琥珀色小格是 KV 缓存，每步多一格（虚线）</text><text x="612" y="287.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">瓶颈：显存带宽</text><text x="612" y="302.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">运算只够填满一小部分计算单元，时间几乎都花在读权重和 KV 上</text><text x="612" y="336" text-anchor="middle" font-size="9.8" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">A100 算力与带宽之比约 208（kipply）；TPU v5e 上 bf16 约要 240 的批量才摸到算力上限（Scaling Book）</text></svg>
