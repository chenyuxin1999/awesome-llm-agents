<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 278" width="900" height="278" role="img" aria-label="模拟器强化学习闭环：训练信号与目标"><defs><marker id="ah-embg2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6577"/></marker></defs><rect x="0" y="0" width="900" height="278" fill="#ffffff"/><path d="M166,76 L193,76" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-embg2)"/><path d="M346,76 L373,76" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-embg2)"/><path d="M526,76 L553,76" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-embg2)"/><path d="M706,76 L743,76" fill="none" stroke="#5A6577" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#ah-embg2)"/><path d="M631,108 L631,128 L91,128 L91,111" fill="none" stroke="#5A6577" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#ah-embg2)"/><rect x="16" y="44" width="150" height="64" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="196" y="44" width="150" height="64" rx="5" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.5"/><rect x="376" y="44" width="150" height="64" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="556" y="44" width="150" height="64" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><rect x="746" y="44" width="138" height="64" rx="5" fill="#FDE8DD" stroke="#C2501A" stroke-width="1.5"/><rect x="220" y="146" width="460" height="60" rx="4" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.4" stroke-dasharray="4 3"/><rect x="220" y="214" width="460" height="28" rx="4" fill="#FFFFFF" stroke="#18202C" stroke-width="1.2"/><text x="16" y="22" text-anchor="start" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">第二段要的是一个在真机上也能用的策略，经验全在模拟器里攒</text><text x="91" y="65.92" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">模拟器</text><text x="91" y="80.48" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">例：一只虚拟</text><text x="91" y="94.28" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">四足机器人在走路</text><text x="271" y="65.92" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">虚拟状态</text><text x="271" y="80.48" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">身体前倾 3°，</text><text x="271" y="94.28" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">速度 0.8 米/秒</text><text x="451" y="72.82" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">策略网络</text><text x="451" y="87.38" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">看状态，出动作</text><text x="631" y="65.92" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">关节角度</text><text x="631" y="80.48" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">12 个关节的目标角：</text><text x="631" y="94.28" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">[0.1, 0.8, -1.5, …]</text><text x="815" y="72.82" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">搬到真机</text><text x="815" y="87.38" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">这一步不训练</text><text x="361" y="124" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" style="paint-order:stroke;stroke-width:4px;stroke-linejoin:round" stroke="#ffffff">下一步的状态，反复试几百万次</text><text x="450" y="162" text-anchor="middle" font-size="10.8" font-weight="700" fill="#B86E00" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">训练信号从哪来：模拟器按人写的奖励公式算出奖励</text><text x="450" y="179" text-anchor="middle" font-size="10.2" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">比如有没有摔倒、跟没跟上指定速度、叠得像不像；</text><text x="450" y="194" text-anchor="middle" font-size="10.2" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">这一步：没摔倒，速度差 0.2 米/秒，奖励 +0.8（示意）</text><text x="450" y="232" text-anchor="middle" font-size="10.8" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">目标：让累计奖励尽量高</text><text x="450" y="262" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">刚体和行走算得准，布料和接触算不准，叠衣服就卡在这里</text></svg>
