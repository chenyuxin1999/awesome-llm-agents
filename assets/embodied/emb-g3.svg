<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 270" width="900" height="270" role="img" aria-label="模仿学习流程：训练信号与目标"><defs><marker id="ah-embg3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6577"/></marker></defs><rect x="0" y="0" width="900" height="270" fill="#ffffff"/><path d="M210,58 L237,58" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-embg3)"/><path d="M430,58 L457,58" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-embg3)"/><line x1="16" y1="152" x2="884" y2="152" stroke="#D5DBE4" stroke-width="1"/><path d="M210,188 L237,188" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-embg3)"/><path d="M430,188 L457,188" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-embg3)"/><path d="M630,188 L657,188" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-embg3)"/><path d="M545,86 L545,120 L335,120 L335,157" fill="none" stroke="#5B45B0" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#ah-embg3)"/><rect x="60" y="30" width="150" height="56" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="240" y="30" width="190" height="56" rx="5" fill="#E9EDF3" stroke="#47546A" stroke-width="1.5"/><rect x="460" y="30" width="170" height="56" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="650" y="30" width="234" height="60" rx="4" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.4" stroke-dasharray="4 3"/><rect x="650" y="98" width="234" height="28" rx="4" fill="#FFFFFF" stroke="#18202C" stroke-width="1.2"/><rect x="60" y="160" width="150" height="56" rx="5" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.5"/><rect x="240" y="160" width="190" height="56" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="460" y="160" width="170" height="56" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><rect x="660" y="160" width="170" height="56" rx="5" fill="#FDE8DD" stroke="#C2501A" stroke-width="1.5"/><text x="16" y="22" text-anchor="start" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">第三段要的是一个看到画面就做出和人一样动作的策略，经验来自人的示范</text><text x="16" y="50" text-anchor="start" font-size="11" font-weight="700" fill="#B83560" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">训练</text><text x="135" y="47.92" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">人握主臂遥控</text><text x="135" y="62.48" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">把 T 恤叠一遍，</text><text x="135" y="76.28" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">录下每一刻</text><text x="335" y="47.92" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">示范数据（某一刻）</text><text x="335" y="62.48" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">画面：T 恤左袖在左下角</text><text x="335" y="76.28" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">人的动作：夹爪左移 1.2 厘米</text><text x="545" y="54.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">训练策略</text><text x="545" y="69.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">ACT / 扩散策略</text><text x="767" y="46" text-anchor="middle" font-size="10.8" font-weight="700" fill="#B86E00" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">训练信号从哪来</text><text x="767" y="63" text-anchor="middle" font-size="10.2" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">示范里人接下来那一段动作</text><text x="767" y="78" text-anchor="middle" font-size="10.2" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">就是答案</text><text x="767" y="116" text-anchor="middle" font-size="10.8" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">目标：看到同样画面做出同样动作</text><text x="16" y="178" text-anchor="start" font-size="11" font-weight="700" fill="#C2501A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">部署</text><text x="135" y="177.92" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">真实相机</text><text x="135" y="192.48" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">一件新 T 恤，</text><text x="135" y="206.28" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">左袖在左下角</text><text x="335" y="184.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">学好的策略</text><text x="335" y="199.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">这一步不训练</text><text x="545" y="177.92" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">动作块</text><text x="545" y="192.48" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">接下来一串动作，</text><text x="545" y="206.28" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">第 1 行：左移 1.1 厘米</text><text x="745" y="191.72" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">机械臂执行</text><text x="440" y="114" text-anchor="middle" font-size="10" font-weight="500" fill="#5B45B0" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" style="paint-order:stroke;stroke-width:4px;stroke-linejoin:round" stroke="#ffffff">训练好的策略拿去用</text><text x="450" y="248" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">录够叠 T 恤的示范就能叠 T 恤，换成叠裤子就得重新录</text><text x="450" y="264" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">画面描述和位移数值都是示意</text></svg>
