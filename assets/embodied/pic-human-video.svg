428" font-size="11.5" fill="#26805A" font-weight="700" text-anchor="middle" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" xml:space="preserve">结果：只有人做过的场景里，表现约翻倍</text><text x="715" y="446" font-size="11" fill="#5A6577" font-weight="400" text-anchor="middle" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" xml:space="preserve">机器人预训练数据越多，越能吸收人类视频</text><text x="20" y="450" font-size="10.5" fill="#5A6577" font-weight="400" text-anchor="start" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" xml:space="preserve">表中数值为示意；用三维手部位置当动作、加入 π0.5 微调按 Physical Intelligence 博客</text></svg>
