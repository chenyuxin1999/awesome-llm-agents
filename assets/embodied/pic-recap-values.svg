<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360" role="img" aria-label="Recap 用价值的变化给每段动作打上优势标注"><defs><marker id="ah-picrecapvalues" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6577"/></marker></defs><rect x="0" y="0" width="900" height="360" fill="#ffffff"/><text x="20" y="24" font-size="13" fill="#0E6E7E" font-weight="700" text-anchor="start" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" xml:space="preserve">一次递杯子的尝试，价值函数估计每个局面“有多大希望做成”</text><rect x="40" y="40" width="840" height="130" rx="6" fill="#F7F9FB" stroke="#D5DBE4" stroke-width="1"/><path d="M91,127 L237,114 L383,94 L529,122 L675,100 L821,61" stroke="#5B45B0" stroke-width="2" fill="none"/><circle cx="91" cy="127" r="5" fill="#5B45B0" stroke="none" stroke-width="1.2"/><text x="91" y="117" font-size="11.5" fill="#5B45B0" font-weight="700" text-anchor="middle" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" xml:space="preserve">V = 0.30</text><circle cx="237" cy="113.8" r="5" fill="#5B45B0" stroke="none" stroke-width="1.2"/><text x="237" y="103.8" font-size="11.5" fill="#5B45B0" font-weight="700" text-anchor="middle" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" xml:space="preserve">V = 0.42</text><circle cx="383" cy="94" r="5" fill="#5B45B0" stroke="none" stroke-width="1.2"/><text x="383" y="84" font-size="11.5" fill="#5B45B0" font-weight="700" text-anchor="middle" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" xml:space="preserve">V = 0.60</text><circle cx="529" cy="121.5" r="5" fill="#5B45B0" stroke="none" stroke-width="1.2"/><text x="529" y="111.5" font-size="11.5" fill="#5B45B0" font-weight="700" text-anchor="middle" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" xml:space="preserve">V = 0.35</text><circle cx="675" cy="99.5" r="5" fill="#5B45B0" stroke="none" stroke-width="1.2"/><text x="675" y="89.5" font-size="11.5" fill="#5B45B0" font-weight="700" text-anchor="middle" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" xml:space="preserve">V = 0.55</text><circle cx="821" cy="61" r="5" fill="#5B45B0" stroke="none" stroke-width="1.2"/><text x="821" y="51" font-size="11.5" fill="#5B45B0" font-weight="700" text-anchor="middle" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" xml:space="preserve">V = 0.90</text><rect x="36" y="184" width="110" height="54" rx="5" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1"/><text x="91" y="206" font-size="11.5" fill="#18202C" font-weight="700" text-anchor="middle" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" xml:space="preserve">伸手</text><rect x="182" y="184" width="110" height="54" rx="5" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1"/><text x="237" y="206" font-size="11.5" fill="#18202C" font-weight="700" text-anchor="middle" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" xml:space="preserve">碰到杯柄</text><rect x="328" y="184" width="110" height="54" rx="5" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1"/><text x="383" y="206" font-size="11.5" fill="#18202C" font-weight="700" text-anchor="middle" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" xml:space="preserve">抓稳</text><rect x="474" y="184" width="110" height="54" rx="5" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1"/><text x="529" y="206" font-size="11.5" fill="#18202C" font-weight="700" text-anchor="middle" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" xml:space="preserve">提起时打滑</text><rect x="620" y="184" width="110" height="54" rx="6" fill="#FCE4EC" stroke="#B83560" stroke-width="1.4"/><text x="675" y="206" font-size="11.5" fill="#18202C" font-weight="700" text-anchor="middle" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" xml:space="preserve">人接管：</text><text x="675" y="226" font-size="11.5" fill="#18202C" font-weight="700" text-anchor="middle" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" xml:space="preserve">放下重抓</text><rect x="766" y="184" width="110" height="54" rx="5" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1"/><text x="821" y="206" font-size="11.5" fill="#18202C" font-weight="700" text-anchor="middle" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" xml:space="preserve">递到手里</text><rect x="126" y="252" width="76" height="46" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.4"/><text x="164" y="270" font-size="12.5" fill="#26805A" font-weight="700" text-anchor="middle" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" xml:space="preserve">+0.12</text><text x="164" y="290" font-size="11" fill="#26805A" font-weight="400" text-anchor="middle" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" xml:space="preserve">优势为正</text><rect x="272" y="252" width="76" height="46" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.4"/><text x="310" y="270" font-size="12.5" fill="#26805A" font-weight="700" text-anchor="middle" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" xml:space="preserve">+0.18</text><text x="310" y="290" font-size="11" fill="#26805A" font-weight="400" text-anchor="middle" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" xml:space="preserve">优势为正</text><rect x="418" y="252" width="76" height="46" rx="5" fill="#FDE8DD" stroke="#C2501A" stroke-width="1.4"/><text x="456" y="270" font-size="12.5" fill="#C2501A" font-weight="700" text-anchor="middle" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" xml:space="preserve">-0.25</text><text x="456" y="290" font-size="11" fill="#C2501A" font-weight="400" text-anchor="middle" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" xml:space="preserve">优势为负</text><rect x="564" y="252" width="76" height="46" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.4"/><text x="602" y="270" font-size="12.5" fill="#26805A" font-weight="700" text-anchor="middle" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" xml:space="preserve">+0.20</text><text x="602" y="290" font-size="11" fill="#26805A" font-weight="400" text-anchor="middle" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" xml:space="preserve">优势为正</text><rect x="710" y="252" width="76" height="46" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.4"/><text x="748" y="270" font-size="12.5" fill="#26805A" font-weight="700" text-anchor="middle" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" xml:space="preserve">+0.35</text><text x="748" y="290" font-size="11" fill="#26805A" font-weight="400" text-anchor="middle" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" xml:space="preserve">优势为正</text><text x="20" y="276" font-size="11.5" fill="#5A6577" font-weight="400" text-anchor="start" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" xml:space="preserve">价值的变化</text><rect x="40" y="310" width="840" height="40" rx="6" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.4"/><text x="460" y="335" font-size="12.5" fill="#18202C" font-weight="700" text-anchor="middle" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" xml:space="preserve">策略学的是“动作 + 这段动作的优势标注”；执行时要求“优势为正”，就被引向让局面变好的动作</text><text x="880" y="24" font-size="10" fill="#5A6577" font-weight="400" text-anchor="end" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" xml:space="preserve">示意</text></svg>
