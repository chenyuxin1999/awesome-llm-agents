<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" role="img" aria-label="低场景熵与高场景熵：指令有没有被真正用上"><defs><marker id="ah-picsceneentropy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6577"/></marker></defs><rect x="0" y="0" width="900" height="330" fill="#ffffff"/><text x="230" y="24" font-size="14" fill="#0E6E7E" font-weight="700" text-anchor="middle" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" xml:space="preserve">低场景熵</text><text x="230" y="44" font-size="11.5" fill="#5A6577" font-weight="400" text-anchor="middle" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" xml:space="preserve">桌上只有一只杯子</text><rect x="40" y="56" width="170" height="120" rx="4" fill="#E8EEF5" stroke="#D5DBE4" stroke-width="1"/><rect x="40" y="125.6" width="170" height="50.4" rx="0" fill="#C9A27A" stroke="none" stroke-width="1.2"/><rect x="110" y="112" width="22" height="24" rx="3" fill="#2B57C9" stroke="#3A3A3A" stroke-width="1"/><path d="M132,117 q9,2 0,14" stroke="#3A3A3A" stroke-width="2.2" fill="none"/><text x="226" y="84" font-size="11.5" fill="#18202C" font-weight="400" text-anchor="start" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" xml:space="preserve">“把杯子递给我”</text><rect x="226" y="90" width="200" height="0.01" rx="0" fill="#DDF3E8" stroke="#26805A" stroke-width="1.4"/><text x="440" y="84" font-size="11.5" fill="#26805A" font-weight="700" text-anchor="end" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" xml:space="preserve">递过杯子 ✓</text><text x="226" y="122" font-size="11.5" fill="#18202C" font-weight="400" text-anchor="start" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" xml:space="preserve">“把杯子推远一点”</text><rect x="226" y="128" width="200" height="0.01" rx="0" fill="#FDE8DD" stroke="#C2501A" stroke-width="1.4"/><text x="440" y="122" font-size="11.5" fill="#C2501A" font-weight="700" text-anchor="end" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" xml:space="preserve">还是递过杯子 ✗</text><text x="226" y="160" font-size="11.5" fill="#18202C" font-weight="400" text-anchor="start" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" xml:space="preserve">“把杯子挪到左边”</text><rect x="226" y="166" width="200" height="0.01" rx="0" fill="#FDE8DD" stroke="#C2501A" stroke-width="1.4"/><text x="440" y="160" font-size="11.5" fill="#C2501A" font-weight="700" text-anchor="end" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" xml:space="preserve">还是递过杯子 ✗</text><rect x="40" y="196" width="400" height="64" rx="6" fill="#E9EDF3" stroke="#47546A" stroke-width="1.4"/><text x="240" y="222" font-size="12" fill="#18202C" font-weight="700" text-anchor="middle" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" xml:space="preserve">只考“把杯子递给我”时，不看指令也能成功</text><text x="240" y="244" font-size="11.5" fill="#5A6577" font-weight="400" text-anchor="middle" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" xml:space="preserve">换一句指令，才露出它没在听</text><text x="670" y="24" font-size="14" fill="#0E6E7E" font-weight="700" text-anchor="middle" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" xml:space="preserve">高场景熵</text><text x="670" y="44" font-size="11.5" fill="#5A6577" font-weight="400" text-anchor="middle" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" xml:space="preserve">同一张桌上有好几种可做的动作</text><rect x="480" y="56" width="170" height="120" rx="4" fill="#E8EEF5" stroke="#D5DBE4" stroke-width="1"/><rect x="480" y="125.6" width="170" height="50.4" rx="0" fill="#C9A27A" stroke="none" stroke-width="1.2"/><rect x="494" y="112" width="22" height="24" rx="3" fill="#2B57C9" stroke="#3A3A3A" stroke-width="1"/><path d="M516,117 q9,2 0,14" stroke="#3A3A3A" stroke-width="2.2" fill="none"/><path d="M532,124 L566,124 Q562,142 549,142 Q536,142 532,124 Z" stroke="#3A3A3A" stroke-width="1" fill="#F2F2F2"/><rect x="576" y="102" width="30" height="32" rx="6" fill="#9AA6B8" stroke="#3A3A3A" stroke-width="1"/><path d="M606,110 l12,-6" stroke="#3A3A3A" stroke-width="3" fill="none"/><path d="M582,102 q9,-12 18,0" stroke="#3A3A3A" stroke-width="2" fill="none"/><rect x="620" y="130" width="22" height="6" rx="3" fill="#9AA6B8" stroke="#3A3A3A" stroke-width="1"/><text x="666" y="84" font-size="11.5" fill="#18202C" font-weight="400" text-anchor="start" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" xml:space="preserve">“把杯子递给我”</text><rect x="666" y="90" width="200" height="0.01" rx="0" fill="#DDF3E8" stroke="#26805A" stroke-width="1.4"/><text x="880" y="84" font-size="11.5" fill="#26805A" font-weight="700" text-anchor="end" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" xml:space="preserve">拿起杯子 ✓</text><text x="666" y="122" font-size="11.5" fill="#18202C" font-weight="400" text-anchor="start" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" xml:space="preserve">“把碗递给我”</text><rect x="666" y="128" width="200" height="0.01" rx="0" fill="#DDF3E8" stroke="#26805A" stroke-width="1.4"/><text x="880" y="122" font-size="11.5" fill="#26805A" font-weight="700" text-anchor="end" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" xml:space="preserve">拿起碗 ✓</text><text x="666" y="160" font-size="11.5" fill="#18202C" font-weight="400" text-anchor="start" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" xml:space="preserve">“把水壶推远一点”</text><rect x="666" y="166" width="200" height="0.01" rx="0" fill="#DDF3E8" stroke="#26805A" stroke-width="1.4"/><text x="880" y="160" font-size="11.5" fill="#26805A" font-weight="700" text-anchor="end" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" xml:space="preserve">推开水壶 ✓</text><rect x="480" y="196" width="400" height="64" rx="6" fill="#DDF3E8" stroke="#26805A" stroke-width="1.4"/><text x="680" y="222" font-size="12" fill="#18202C" font-weight="700" text-anchor="middle" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" xml:space="preserve">每句指令对应不同的动作分支</text><text x="680" y="244" font-size="11.5" fill="#5A6577" font-weight="400" text-anchor="middle" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" xml:space="preserve">只有读懂指令，才选得对</text><text x="450" y="292" font-size="12" fill="#0E6E7E" font-weight="700" text-anchor="middle" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" xml:space="preserve">RoboFollow 用高场景熵的场景，再逐层扰动布局和语义，分别检查意图理解和执行</text><text x="880" y="320" font-size="10" fill="#5A6577" font-weight="400" text-anchor="end" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" xml:space="preserve">场景和指令为示意</text></svg>
