" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="346" y="168" width="120" height="112" rx="5" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.5"/><rect x="496" y="160" width="236" height="36" rx="5" fill="#E9EDF3" stroke="#47546A" stroke-width="1.5"/><rect x="496" y="204" width="236" height="36" rx="5" fill="#E9EDF3" stroke="#47546A" stroke-width="1.5"/><rect x="496" y="248" width="236" height="36" rx="5" fill="#E9EDF3" stroke="#47546A" stroke-width="1.5"/><rect x="496" y="300" width="236" height="36" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><text x="16" y="24" text-anchor="start" font-size="12.5" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">“多少小时”只是数据规模的一个维度</text><text x="154" y="60.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">数量</text><text x="154" y="75.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">多少条、多少小时</text><text x="446" y="60.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">保真度</text><text x="446" y="75.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">观察、动作、时间同步是否对得上</text><text x="738" y="60.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">任务覆盖</text><text x="738" y="75.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">基本动作之间的衔接和组合</text><text x="446" y="106" text-anchor="middle" font-size="10" font-weight="500" fill="#26805A" font-family="PingFang SC, Noto Sans CJK S