" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="440" y="136" width="120" height="60" rx="5" fill="#FDE8DD" stroke="#C2501A" stroke-width="1.5"/><rect x="600" y="60" width="284" height="60" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="600" y="136" width="284" height="60" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><rect x="600" y="212" width="284" height="60" rx="5" fill="#E9EDF3" stroke="#47546A" stroke-width="1.5"/><rect x="250" y="284" width="310" height="52" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><rect x="16" y="352" width="868" height="38" rx="5" fill="#FFF7F2" stroke="#C2501A" stroke-width="1.2"/><text x="16" y="24" text-anchor="start" font-size="12.5" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">具身 harness：谁来讲任务，谁来边做边查，出错后谁兜底</text><text x="16" y="50" text-anchor="start" font-size="11.5" font-weight="700" fill="#2B57C9" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">谁来讲</text><text x="111" y="79.665" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">人</text><text x="111" y="94.035" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">π0.7 的一步步指导</text><text x="111" y="135.665" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">训练出的高层策略</text><text x="111" y="150.035" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">π0.7 用指导指令微调</text><text x="111" y="191.665" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">VLM 规划器</text><text x="111" y="206.035" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">LAW 规划剩余子任务</text><text x="111" y="247.665" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">通用大模型</text><text x="111" y="262.035" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">GPT-6 Astra 当高层</text><text x="325" y="162.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">机器人策略</text><text x="325" y="177.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">π0.7、π0.5、GR00T 等</text><text x="500" y="169.72" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">执行</text><text x="742" y="79.92" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">执行中检查</text><text x="742" y="94.48" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">LAW：异步判断子任务完成没有</text><text x="742" y="108.28" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Zetta：快速的代码检查器</text><text x="742" y="162.82" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">验证后交给恢复技能</text><text x="742" y="177.38" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Zetta：干预之前先过一道验证</text><text x="742" y="231.92" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">离线进化 harness</text><text x="742" y="246.48" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Zetta：失败聚类、诊断、改检查器和技能</text><text x="742" y="260.28" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">留出随机种子上验证有效才收进来</text><text x="460" y="237" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" style="paint-order:stroke;stroke-width:4px;stroke-linejoin:round" stroke="#ffffff">下一次部署</text><text x="405" y="306.82" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">在模型内部拧旋钮</text><text x="405" y="321.38" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">SteerAct：按成败参考库引导内部特征，不改权重</text><text x="450" y="376" text-anchor="middle" font-size="10.5" font-weight="500" fill="#C2501A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">报告时一起写：harness 配置、人工调试时间、检查器误判率、推理成本（GPT-6 Astra 逐个审查动作约用 766 万 token）</text></svg>
