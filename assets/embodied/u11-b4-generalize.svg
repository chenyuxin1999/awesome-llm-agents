<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="900" height="340" role="img" aria-label="泛化的三类变化"><defs><marker id="ah-u11b4generalize" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6577"/></marker></defs><rect x="0" y="0" width="900" height="340" fill="#ffffff"/><path d="M144,223 L163,223" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-u11b4generalize)"/><path d="M294,223 L313,223" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-u11b4generalize)"/><path d="M444,223 L463,223" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-u11b4generalize)"/><line x1="620" y1="176" x2="620" y2="330" stroke="#D5DBE4" stroke-width="1"/><rect x="16" y="40" width="276" height="54" rx="5" fill="#E3EBFF" stroke="#2B57C9" stroke-width="1.5"/><rect x="16" y="104" width="276" height="54" rx="5" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1.5"/><rect x="16" y="104" width="276" height="54" rx="5" fill="none" stroke="#2B57C9" stroke-width="1" stroke-dasharray="3 3"/><rect x="308" y="40" width="276" height="54" rx="5" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.5"/><rect x="308" y="104" width="276" height="54" rx="5" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1.5"/><rect x="308" y="104" width="276" height="54" rx="5" fill="none" stroke="#B86E00" stroke-width="1" stroke-dasharray="3 3"/><rect x="600" y="40" width="276" height="54" rx="5" fill="#FDE8DD" stroke="#C2501A" stroke-width="1.5"/><rect x="600" y="104" width="276" height="54" rx="5" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1.5"/><rect x="600" y="104" width="276" height="54" rx="5" fill="none" stroke="#C2501A" stroke-width="1" stroke-dasharray="3 3"/><rect x="16" y="204" width="128" height="38" rx="5" fill="#E3EBFF" stroke="#2B57C9" stroke-width="1.5"/><rect x="166" y="204" width="128" height="38" rx="5" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.5"/><rect x="316" y="204" width="128" height="38" rx="5" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.5"/><rect x="466" y="204" width="128" height="38" rx="5" fill="#FDE8DD" stroke="#C2501A" stroke-width="1.5"/><rect x="636" y="204" width="248" height="42" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="636" y="256" width="248" height="42" rx="5" fill="#FDE8DD" stroke="#C2501A" stroke-width="1.5"/><text x="16" y="24" text-anchor="start" font-size="12.5" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">“泛化”至少有三类：一次只改一类，失败了才知道该修哪里</text><text x="154" y="63.785" text-anchor="middle" font-size="13" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">语义</text><text x="154" y="79.225" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">换一种说法、换一个任务含义</text><text x="154" y="127.01" text-anchor="middle" font-size="10.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Grounded Semantic Re-Binding：</text><text x="154" y="141.5" text-anchor="middle" font-size="10.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">区分缺语义知识和联合编码失效</text><text x="446" y="63.785" text-anchor="middle" font-size="13" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">空间</text><text x="446" y="79.225" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">换位置、换相机姿态、换布局</text><text x="446" y="127.01" text-anchor="middle" font-size="10.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Lift3D-VLA、See like a Robot、</text><text x="446" y="141.5" text-anchor="middle" font-size="10.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">VistaVLA、4D 点轨迹预测</text><text x="738" y="63.785" text-anchor="middle" font-size="13" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">身体</text><text x="738" y="79.225" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">换夹爪、换机器人</text><text x="738" y="127.01" text-anchor="middle" font-size="10.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">ZETA、The Embodiment Gap、</text><text x="738" y="141.5" text-anchor="middle" font-size="10.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Pelican-VLA 0.5</text><text x="16" y="190" text-anchor="start" font-size="12.5" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">递杯子的四步对照实验（示意）</text><text x="80" y="226.565" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">改指令措辞</text><text x="230" y="226.565" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">改杯子位置</text><text x="380" y="226.565" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">改相机姿态</text><text x="530" y="226.565" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">改夹爪型号</text><text x="636" y="190" text-anchor="start" font-size="12.5" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">ZETA：零样本要分两种</text><text x="760" y="221.665" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">严格零样本</text><text x="760" y="236.035" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">预训练从没见过目标身体</text><text x="760" y="273.665" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">“零样本”但见过目标身体</text><text x="760" y="288.035" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">哪怕只有一点，结论就会变</text><text x="760" y="320" text-anchor="middle" font-size="10.5" font-weight="600" fill="#C2501A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">两种情况必须分开报告</text><text x="310" y="280" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">四样同时改，失败了也不知道是哪一样出的问题</text><text x="310" y="300" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">The Embodiment Gap 还要求把标定、动作映射、采集和硬件接口的投入列出来</text></svg>
