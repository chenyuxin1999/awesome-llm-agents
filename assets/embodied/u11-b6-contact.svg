<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="900" height="340" role="img" aria-label="接触失败的病因与触觉进入动作的时机"><defs><marker id="ah-u11b6contact" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6577"/></marker></defs><rect x="0" y="0" width="900" height="340" fill="#ffffff"/><path d="M216,65 L253,65" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-u11b6contact)"/><path d="M216,125 L253,125" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-u11b6contact)"/><line x1="500" y1="40" x2="500" y2="184" stroke="#D5DBE4" stroke-width="1"/><line x1="16" y1="196" x2="884" y2="196" stroke="#D5DBE4" stroke-width="1"/><path d="M336,290 L420,272" fill="none" stroke="#26805A" stroke-width="1.4" marker-end="url(#ah-u11b6contact)"/><rect x="16" y="40" width="200" height="50" rx="5" fill="#FDE8DD" stroke="#C2501A" stroke-width="1.5"/><rect x="16" y="100" width="200" height="50" rx="5" fill="#FDE8DD" stroke="#C2501A" stroke-width="1.5"/><rect x="256" y="40" width="220" height="50" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><rect x="256" y="100" width="220" height="50" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="516" y="66" width="56" height="20" rx="10" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.1"/><rect x="516" y="94" width="56" height="20" rx="10" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.1"/><rect x="516" y="122" width="35" height="20" rx="10" fill="#E9EDF3" stroke="#47546A" stroke-width="1.1"/><rect x="516" y="150" width="66.5" height="20" rx="10" fill="#DDF3E8" stroke="#26805A" stroke-width="1.1"/><rect x="120" y="238" width="230" height="30" rx="4" fill="#FCE4EC" stroke="#B83560" stroke-width="1.3"/><rect x="356" y="238" width="230" height="30" rx="4" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.3" stroke-dasharray="4 3"/><rect x="592" y="238" width="180" height="30" rx="4" fill="#F3F5F8" stroke="#D5DBE4" stroke-width="1.2" stroke-dasharray="4 3"/><circle cx="150" cy="290" r="4" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><circle cx="186" cy="290" r="4" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><circle cx="222" cy="290" r="4" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><circle cx="258" cy="290" r="4" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><circle cx="294" cy="290" r="4" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><circle cx="330" cy="290" r="4" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><text x="16" y="24" text-anchor="start" font-size="12.5" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">先分清病因：接触任务里的两类失败（2608.01402）</text><text x="116" y="61.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">精度问题</text><text x="116" y="76.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">差一点没插进去</text><text x="116" y="121.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">力信号问题</text><text x="116" y="136.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">用力不对、没察觉滑动</text><text x="366" y="61.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">追溯到</text><text x="366" y="76.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">生成策略的训练匹配方式</text><text x="366" y="121.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">追溯到</text><text x="366" y="136.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">力信号本身的结构</text><text x="246" y="172" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">再按病因组合针对性的机制；多接一组传感器只是最省事的猜测</text><text x="516" y="52" text-anchor="start" font-size="12.5" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">触觉进入控制的不同位置</text><text x="544" y="80" text-anchor="middle" font-size="10.5" font-weight="500" fill="#B86E00" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">数据入口</text><text x="612" y="80" text-anchor="start" font-size="10.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">AnyDexRT：人手到机器人手的重定向</text><text x="544" y="108" text-anchor="middle" font-size="10.5" font-weight="500" fill="#5B45B0" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">输入表示</text><text x="612" y="108" text-anchor="start" font-size="10.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">ReTouch、DeCAL：指尖触觉进入策略</text><text x="533.5" y="136" text-anchor="middle" font-size="10.5" font-weight="500" fill="#47546A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">记忆</text><text x="612" y="136" text-anchor="start" font-size="10.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">FM-VLA：力觉历史当作记忆</text><text x="549.25" y="164" text-anchor="middle" font-size="10.5" font-weight="500" fill="#26805A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">预测与修正</text><text x="612" y="164" text-anchor="start" font-size="10.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">TouchWorld：预判未来接触，快速修正</text><text x="16" y="220" text-anchor="start" font-size="12.5" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">TacForcing：边执行边接收触觉，只改下一块（示意）</text><text x="235" y="258" text-anchor="middle" font-size="10.5" font-weight="500" fill="#B83560" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">动作块 k：正在执行</text><text x="471" y="258" text-anchor="middle" font-size="10.5" font-weight="500" fill="#5B45B0" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">动作块 k+1：待执行</text><text x="682" y="258" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">更后面的块</text><text x="235" y="312" text-anchor="middle" font-size="10.5" font-weight="600" fill="#26805A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">执行中读到的触觉</text><text x="16" y="258" text-anchor="start" font-size="11" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">流式生成</text><text x="590" y="300" text-anchor="start" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">保留生成的中间状态，用新触觉接着生成；</text><text x="590" y="318" text-anchor="start" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">代价是缓存、时间戳和执行调度要严格对齐</text></svg>
