"#B83560" stroke-width="1.5"/><rect x="756" y="82" width="128" height="34" rx="5" fill="#FDE8DD" stroke="#C2501A" stroke-width="1.5"/><rect x="16" y="232" width="120" height="54" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="160" y="232" width="130" height="54" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="314" y="232" width="120" height="54" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><rect x="466" y="232" width="120" height="54" rx="5" fill="#FDE8DD" stroke="#C2501A" stroke-width="1.5"/><rect x="610" y="232" width="130" height="54" rx="5" fill="#E9EDF3" stroke="#47546A" stroke-width="1.5"/><rect x="764" y="232" width="120" height="54" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><text x="16" y="24" text-anchor="start" font-size="12.5" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">RoboFollow：场景里只有一种可做的动作，就测不出指令遵循</text><text x="116" y="64.075" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">低场景熵</text><text x="116" y="78.945" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">桌上只有一只杯子</text><text x="116" y="93.435" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">不看指令也能拿对</text><text x="336" y="64.075" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">高场景熵</text><text x="336" y="78.945" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">同一场景容纳多个分支</text><text x="336" y="93.435" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">语言真正影响选择</text><text x="466" y="24" text-anchor="start" font-size="12.5" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Humanoid Safe Stop：停不停得住，看身体状态</text><text x="521" y="68.41" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">当前身体状态</text><text x="665" y="68.41" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">几个可停止性估计</text><text x="820" y="60.255" text-anchor="middle" font-size="10.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">都认可：停止策略</text><text x="820" y="102.255" text-anchor="middle" font-size="10.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">否则：回退方案</text><text x="675" y="140" text-anchor="middle" font-size="10.5" font-weight="500" fill="#C2501A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">估计器仍会出错，代替不了独立的硬件防护</text><text x="226" y="140" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">逐层扰动布局和语义：强基线在深层指令条件上不再可靠</text><text x="16" y="216" text-anchor="start" font-size="12.5" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">SuperMimic：用一个可微世界模型训练人形跟踪</text><text x="76" y="262.41" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">模拟器转移数据</text><text x="225" y="255.51" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">可微世界模型</text><text x="225" y="269.69" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">所有动作共享动力学</text><text x="374" y="255.51" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">跟踪策略</text><text x="374" y="269.69" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">想象展开上反传</text><text x="300" y="316" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" style="paint-order:stroke;stroke-width:4px;stroke-linejoin:round" stroke="#ffffff">一起训练</text><text x="226" y="346" text-anchor="middle" font-size="10.5" font-weight="500" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">作者报告：单 GPU 3 小时超过基线 128 GPU 7 天的回报</text><text x="466" y="216" text-anchor="start" font-size="12.5" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">T2-z：先碰一碰，再推断看不见的物理</text><text x="526" y="255.51" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">一两次交互</text><text x="526" y="269.69" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">推一下、拿一下</text><text x="675" y="255.51" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">环境潜变量</text><text x="675" y="269.69" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">摩擦、质量、刚度</text><text x="824" y="255.51" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">冻结的世界模型</text><text x="824" y="269.69" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">据此预测与行动</text><text x="675" y="310" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">世界模型冻结，测试时只优化环境潜变量</text><text x="675" y="328" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">一满一空两只杯子看起来一样，握法完全不同</text><text x="675" y="346" text-anchor="middle" font-size="10.5" font-weight="500" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">成功率 33.73% → 72.96%（作者报告）</text></svg>
