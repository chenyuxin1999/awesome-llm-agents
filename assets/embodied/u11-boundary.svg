<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="900" height="320" role="img" aria-label="主线的两条边界和一个跨层问题"><defs><marker id="ah-u11boundary" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6577"/></marker></defs><rect x="0" y="0" width="900" height="320" fill="#ffffff"/><path d="M170,148 L227,148" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-u11boundary)"/><path d="M380,148 L437,148" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-u11boundary)"/><path d="M570,148 L627,148" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-u11boundary)"/><path d="M705,176 L705,200 L105,200 L105,179" fill="none" stroke="#5A6577" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#ah-u11boundary)"/><path d="M226,228 L305,179" fill="none" stroke="#C2501A" stroke-width="1.4" stroke-dasharray="3 3" marker-end="url(#ah-u11boundary)"/><path d="M674,228 L705,179" fill="none" stroke="#C2501A" stroke-width="1.4" stroke-dasharray="3 3" marker-end="url(#ah-u11boundary)"/><path d="M400,96 L305,117" fill="none" stroke="#C2501A" stroke-width="1.4" stroke-dasharray="3 3" marker-end="url(#ah-u11boundary)"/><path d="M560,96 L705,117" fill="none" stroke="#C2501A" stroke-width="1.4" stroke-dasharray="3 3" marker-end="url(#ah-u11boundary)"/><rect x="40" y="120" width="130" height="56" rx="5" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.5"/><rect x="230" y="120" width="150" height="56" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="440" y="120" width="130" height="56" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><rect x="630" y="120" width="150" height="56" rx="5" fill="#FDE8DD" stroke="#C2501A" stroke-width="1.5"/><rect x="16" y="228" width="420" height="76" rx="5" fill="#FDE8DD" stroke="#C2501A" stroke-width="1.5"/><rect x="464" y="228" width="420" height="76" rx="5" fill="#FDE8DD" stroke="#C2501A" stroke-width="1.5"/><rect x="250" y="40" width="400" height="56" rx="5" fill="#FDE8DD" stroke="#C2501A" stroke-width="1.5"/><text x="16" y="24" text-anchor="start" font-size="12.5" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">把闭环再画一遍，标出至今没有答案的地方</text><text x="105" y="151.72" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">观察</text><text x="305" y="151.72" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">模型与 harness</text><text x="505" y="151.72" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">动作</text><text x="705" y="151.72" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">身体与物理世界</text><text x="226" y="255.23" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">边界一：评测</text><text x="226" y="270.29" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">真机评测慢又贵，换光照、换复位的人成功率就变</text><text x="226" y="284.78" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">多是公司自测；排行榜少，刷榜变多，偏爱的方法各不相同</text><text x="674" y="255.23" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">边界二：身体</text><text x="674" y="270.29" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">多指灵巧手难做也贵；多指和手内操作让腕部相机</text><text x="674" y="284.78" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">看不清接触，触觉重新必要，却没有统一标准</text><text x="450" y="64.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">跨层：安全与停止</text><text x="450" y="79.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">高层觉得合理，底层未必做得到；低层报告成功，下一步的入口条件未必满足</text></svg>
