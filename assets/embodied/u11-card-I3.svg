<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 172" width="560" height="172" role="img" aria-label="Diffusion Policy 结构"><defs><marker id="ah-u11cardi3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6577"/></marker></defs><rect x="0" y="0" width="560" height="172" fill="#ffffff"/><path d="M127.5,55 L150.5,55" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-u11cardi3)"/><path d="M267,55 L290,55" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-u11cardi3)"/><path d="M406.5,55 L429.5,55" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-u11cardi3)"/><rect x="14" y="16" width="113.5" height="78" rx="5" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.5"/><rect x="153.5" y="16" width="113.5" height="78" rx="5" fill="#F3F5F8" stroke="#D5DBE4" stroke-width="1.5"/><rect x="293" y="16" width="113.5" height="78" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><rect x="432.5" y="16" width="113.5" height="78" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="14" y="108" width="532" height="36" rx="4" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.3" stroke-dasharray="4 3"/><text x="70.75" y="51.665" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">看当前画面</text><text x="70.75" y="66.035" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">作为生成的条件</text><text x="210.25" y="51.665" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">从随机噪声开始</text><text x="210.25" y="66.035" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">一段乱的动作</text><text x="349.75" y="51.665" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">一步步去噪</text><text x="349.75" y="66.035" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">每一步都参考画面</text><text x="489.25" y="44.765" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">得到一段动作</text><text x="489.25" y="59.135" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">从左边抓或从右边抓</text><text x="489.25" y="72.935" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">都行</text><text x="280" y="123" text-anchor="middle" font-size="10" font-weight="600" fill="#B86E00" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">训练信号：往示范动作上加噪声，学着把噪声去掉</text><text x="280" y="138" text-anchor="middle" font-size="10" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">目标：从噪声生成出像示范的一段动作</text><text x="280" y="162" text-anchor="middle" font-size="10.5" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">几种合理做法都保留下来，模型不会取平均撞向杯身</text></svg>
