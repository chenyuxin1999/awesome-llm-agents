<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 172" width="560" height="172" role="img" aria-label="FAST 结构"><defs><marker id="ah-u11cardv5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6577"/></marker></defs><rect x="0" y="0" width="560" height="172" fill="#ffffff"/><path d="M127.5,55 L150.5,55" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-u11cardv5)"/><path d="M267,55 L290,55" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-u11cardv5)"/><path d="M406.5,55 L429.5,55" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-u11cardv5)"/><rect x="14" y="16" width="113.5" height="78" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><rect x="153.5" y="16" width="113.5" height="78" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="293" y="16" width="113.5" height="78" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="432.5" y="16" width="113.5" height="78" rx="5" fill="#E9EDF3" stroke="#47546A" stroke-width="1.5"/><rect x="14" y="108" width="532" height="36" rx="4" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.3" stroke-dasharray="4 3"/><text x="70.75" y="51.665" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">一段连续动作</text><text x="70.75" y="66.035" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">每一步一个向量</text><text x="210.25" y="44.765" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">按频率拆开</text><text x="210.25" y="59.135" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">离散余弦变换，像压</text><text x="210.25" y="72.935" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">缩图像</text><text x="349.75" y="51.665" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">合并常见组合</text><text x="349.75" y="66.035" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">字节对编码</text><text x="489.25" y="51.665" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">30 到 60 个 token</text><text x="489.25" y="66.035" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">约为原来的十分之一</text><text x="280" y="123" text-anchor="middle" font-size="10" font-weight="600" fill="#B86E00" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">训练信号：示范动作压成的 token，逐个预测</text><text x="280" y="138" text-anchor="middle" font-size="10" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">目标：用更少的 token 说出同一段动作</text><text x="280" y="162" text-anchor="middle" font-size="10.5" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">自回归训练约快 5 倍，可逐个 token 解码让推理变慢</text></svg>
