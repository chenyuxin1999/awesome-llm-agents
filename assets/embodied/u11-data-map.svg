<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 414" width="900" height="414" role="img" aria-label="七种数据来源的取舍"><defs><marker id="ah-u11datamap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6577"/></marker></defs><rect x="0" y="0" width="900" height="414" fill="#ffffff"/><line x1="90" y1="352" x2="870" y2="352" stroke="#9AA6B8" stroke-width="1.2"/><line x1="90" y1="352" x2="90" y2="50" stroke="#9AA6B8" stroke-width="1.2"/><path d="M850,352 L870,352" fill="none" stroke="#9AA6B8" stroke-width="1.4" marker-end="url(#ah-u11datamap)"/><path d="M90,70 L90,50" fill="none" stroke="#9AA6B8" stroke-width="1.4" marker-end="url(#ah-u11datamap)"/><rect x="85" y="48" width="130" height="44" rx="5" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.5"/><rect x="218.15" y="98" width="163.7" height="44" rx="5" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.5"/><rect x="485" y="62" width="150" height="44" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="390" y="188" width="160" height="44" rx="5" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.5"/><rect x="628.418" y="148" width="143.165" height="44" rx="5" fill="#E9EDF3" stroke="#47546A" stroke-width="1.5"/><rect x="580" y="248" width="120" height="44" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><rect x="709.6" y="278" width="160.8" height="44" rx="5" fill="#FDE8DD" stroke="#C2501A" stroke-width="1.5"/><text x="480" y="378" text-anchor="middle" font-size="11.5" font-weight="600" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">和机器人动作的对应程度：低 → 高</text><text x="16" y="40" text-anchor="start" font-size="11.5" font-weight="600" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">可获得的量级</text><text x="16" y="58" text-anchor="start" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">大 ↑</text><text x="16" y="348" text-anchor="start" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">小</text><text x="150" y="66.665" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">人类第一视角视频</text><text x="150" y="81.035" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">规模巨大，没有动作标签</text><text x="300" y="116.665" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">人类穿戴设备</text><text x="300" y="131.035" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Generalist 自报 50 万小时以上</text><text x="560" y="80.665" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">模拟与合成数据</text><text x="560" y="95.035" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">动作精确，物理与外观有差距</text><text x="470" y="206.665" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">手持夹爪 UMI</text><text x="470" y="221.035" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">不需要机器人，要处理身体差异</text><text x="700" y="166.665" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">数据工厂 AgiBot World</text><text x="700" y="181.035" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">100 万条以上轨迹</text><text x="640" y="266.665" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">部署与自主运行</text><text x="640" y="281.035" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">含失败与纠正，攒得慢</text><text x="790" y="296.665" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">主从臂遥操作</text><text x="790" y="311.035" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">质量最高，DROID 约 350 小时</text><text x="480" y="404" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">位置是示意，用来对照第三段的表格：越往右上越理想，可惜那个角落是空的</text></svg>
