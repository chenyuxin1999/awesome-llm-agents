<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" role="img" aria-label="具身系统的闭环与经验来源"><defs><marker id="ah-u11overviewloop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6577"/></marker></defs><rect x="0" y="0" width="900" height="400" fill="#ffffff"/><path d="M144,100 L173,120" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-u11overviewloop)"/><path d="M144,160 L173,140" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-u11overviewloop)"/><path d="M300,128 L337,128" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-u11overviewloop)"/><path d="M480,128 L517,128" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-u11overviewloop)"/><path d="M652,128 L689,128" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-u11overviewloop)"/><path d="M788,170 L788,214 L84,214 L84,187" fill="none" stroke="#5A6577" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#ah-u11overviewloop)"/><rect x="12" y="44" width="300" height="150" rx="5" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1.3" stroke-dasharray="5 4"/><rect x="24" y="74" width="120" height="52" rx="5" fill="#E3EBFF" stroke="#2B57C9" stroke-width="1.5"/><rect x="24" y="136" width="120" height="48" rx="5" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.5"/><rect x="176" y="92" width="124" height="72" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="340" y="92" width="140" height="72" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><rect x="520" y="92" width="132" height="72" rx="5" fill="#FDE8DD" stroke="#C2501A" stroke-width="1.5"/><rect x="692" y="86" width="192" height="84" rx="5" fill="#FDE8DD" stroke="#C2501A" stroke-width="1.5"/><rect x="16" y="272" width="134" height="56" rx="5" fill="#E9EDF3" stroke="#47546A" stroke-width="1.5"/><rect x="162" y="272" width="134" height="56" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="308" y="272" width="134" height="56" rx="5" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.5"/><rect x="454" y="272" width="134" height="56" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="600" y="272" width="134" height="56" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><rect x="746" y="272" width="134" height="56" rx="5" fill="#E3EBFF" stroke="#2B57C9" stroke-width="1.5"/><text x="16" y="24" text-anchor="start" font-size="12.5" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">一个具身系统在做什么：从指令和观察到物理世界，再看回来</text><text x="22" y="62" text-anchor="start" font-size="10.5" font-weight="500" fill="#2B57C9" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">harness：任务怎样讲、执行中谁来查（三.10）</text><text x="84" y="96.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">语言指令</text><text x="84" y="111.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">递给我蓝色杯子</text><text x="84" y="156.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">观察</text><text x="84" y="171.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">相机、本体、触觉</text><text x="238" y="117.23" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">任务层</text><text x="238" y="132.29" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">VLM 或规划器</text><text x="238" y="146.78" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">下一步做什么</text><text x="410" y="117.23" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">技能层</text><text x="410" y="132.29" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">VLA 动作专家</text><text x="410" y="146.78" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">接下来一串动作</text><text x="586" y="117.23" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">控制层</text><text x="586" y="132.29" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">控制器跟踪</text><text x="586" y="146.78" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">位置、速度或力</text><text x="788" y="124.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">机器人与物理世界</text><text x="788" y="139.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">接触、摩擦、形变，人随时改口</text><text x="440" y="209" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" style="paint-order:stroke;stroke-width:4px;stroke-linejoin:round" stroke="#ffffff">新画面、触觉、本体状态</text><text x="238" y="182" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">按子任务更新，最慢</text><text x="410" y="182" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">每块重新观察一次</text><text x="586" y="182" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">50 Hz 到 1 kHz，最快</text><text x="16" y="258" text-anchor="start" font-size="12.5" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">经验从哪里来：本章主线的六段，每一段换一种办法把本事装进上面这几层</text><text x="83" y="296.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">第一段</text><text x="83" y="311.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">工程师写模型和规则</text><text x="229" y="296.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">第二段</text><text x="229" y="311.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">模拟器里自己试</text><text x="375" y="296.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">第三段</text><text x="375" y="311.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">请人来示范</text><text x="521" y="296.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">第四段</text><text x="521" y="311.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">向互联网借常识</text><text x="667" y="296.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">第五段</text><text x="667" y="311.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">自己的经验与人类视频</text><text x="813" y="296.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">第六段</text><text x="813" y="311.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">把任务讲给它听</text><text x="450" y="352" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">示意：前五段的经验最终写进规则或权重；第六段改的是任务怎样讲给模型，模型权重可以不动</text><text x="450" y="374" text-anchor="middle" font-size="10.5" font-weight="500" fill="#C2501A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">两个频率要分开写：模型真正看到新画面并做出新决策的次数，可能远少于控制器每秒输出的次数</text></svg>
