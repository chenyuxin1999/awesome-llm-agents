<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" width="900" height="250" role="img" aria-label="模型预测控制的一轮"><defs><marker id="ah-u11s1mpc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6577"/></marker></defs><rect x="0" y="0" width="900" height="250" fill="#ffffff"/><path d="M156,86 L193,86" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-u11s1mpc)"/><path d="M446,86 L483,86" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-u11s1mpc)"/><path d="M636,86 L673,86" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-u11s1mpc)"/><path d="M780,118 L780,152 L86,152 L86,121" fill="none" stroke="#5A6577" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#ah-u11s1mpc)"/><rect x="16" y="54" width="140" height="64" rx="5" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.5"/><rect x="196" y="44" width="250" height="84" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="212" y="92" width="31" height="24" rx="3" fill="#FCE4EC" stroke="#B83560" stroke-width="1.2"/><rect x="249" y="92" width="31" height="24" rx="3" fill="#F3F5F8" stroke="#D5DBE4" stroke-width="1.2"/><rect x="286" y="92" width="31" height="24" rx="3" fill="#F3F5F8" stroke="#D5DBE4" stroke-width="1.2"/><rect x="323" y="92" width="31" height="24" rx="3" fill="#F3F5F8" stroke="#D5DBE4" stroke-width="1.2"/><rect x="360" y="92" width="31" height="24" rx="3" fill="#F3F5F8" stroke="#D5DBE4" stroke-width="1.2"/><rect x="397" y="92" width="31" height="24" rx="3" fill="#F3F5F8" stroke="#D5DBE4" stroke-width="1.2"/><rect x="486" y="54" width="150" height="64" rx="5" fill="#FDE8DD" stroke="#C2501A" stroke-width="1.5"/><rect x="676" y="54" width="208" height="64" rx="5" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.5"/><rect x="16" y="172" width="868" height="62" rx="5" fill="#F3F5F8" stroke="#D5DBE4" stroke-width="1"/><text x="16" y="24" text-anchor="start" font-size="12.5" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">模型预测控制（MPC）：每个控制周期都重新算一遍</text><text x="86" y="82.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">当前状态</text><text x="86" y="97.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">传感器测到的位置、速度</text><text x="321" y="64" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">借动力学模型向前优化</text><text x="227" y="108" text-anchor="middle" font-size="10.5" font-weight="600" fill="#B83560" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">a1</text><text x="264" y="108" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">a2</text><text x="301" y="108" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">a3</text><text x="338" y="108" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">a4</text><text x="375" y="108" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">a5</text><text x="412" y="108" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">a6</text><text x="321" y="84" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">算出未来一小段动作 a1…a6</text><text x="561" y="82.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">只执行第一步</text><text x="561" y="97.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">a1 交给电机</text><text x="780" y="82.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">新状态</text><text x="780" y="97.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">下一个控制周期</text><text x="433" y="147" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" style="paint-order:stroke;stroke-width:4px;stroke-linejoin:round" stroke="#ffffff">其余的 a2…a6 丢掉，从新状态重新算</text><text x="450" y="196" text-anchor="middle" font-size="11" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">强处：模型准的时候，又快又准，液压 Atlas、MIT 猎豹靠的就是精确模型加这类优化</text><text x="450" y="220" text-anchor="middle" font-size="11" font-weight="500" fill="#C2501A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">软肋：一切建立在动力学模型之上；没建模的物体、会变形的衣服和线缆，模型补不过来</text></svg>
