<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-label="动作分块与多解问题"><defs><marker id="ah-u11s3chunkmm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6577"/></marker></defs><rect x="0" y="0" width="900" height="300" fill="#ffffff"/><line x1="440" y1="40" x2="440" y2="290" stroke="#D5DBE4" stroke-width="1"/><path d="M30,90 L70,82 L110,96 L150,84 L190,100 L230,90 L270,106 L310,96 L350,112 L390,104" fill="none" stroke="#C2501A" stroke-width="1.8"/><circle cx="30" cy="90" r="3" fill="#FDE8DD" stroke="#C2501A" stroke-width="1"/><circle cx="70" cy="82" r="3" fill="#FDE8DD" stroke="#C2501A" stroke-width="1"/><circle cx="110" cy="96" r="3" fill="#FDE8DD" stroke="#C2501A" stroke-width="1"/><circle cx="150" cy="84" r="3" fill="#FDE8DD" stroke="#C2501A" stroke-width="1"/><circle cx="190" cy="100" r="3" fill="#FDE8DD" stroke="#C2501A" stroke-width="1"/><circle cx="230" cy="90" r="3" fill="#FDE8DD" stroke="#C2501A" stroke-width="1"/><circle cx="270" cy="106" r="3" fill="#FDE8DD" stroke="#C2501A" stroke-width="1"/><circle cx="310" cy="96" r="3" fill="#FDE8DD" stroke="#C2501A" stroke-width="1"/><circle cx="350" cy="112" r="3" fill="#FDE8DD" stroke="#C2501A" stroke-width="1"/><circle cx="390" cy="104" r="3" fill="#FDE8DD" stroke="#C2501A" stroke-width="1"/><path d="M30,196 C110,180 170,176 210,182" fill="none" stroke="#B83560" stroke-width="2.4"/><path d="M210,182 C260,188 330,200 390,190" fill="none" stroke="#B83560" stroke-width="2.4"/><rect x="26" y="166" width="186" height="34" rx="6" fill="none" stroke="#B83560" stroke-width="1" stroke-dasharray="3 3"/><rect x="212" y="172" width="182" height="34" rx="6" fill="none" stroke="#B83560" stroke-width="1" stroke-dasharray="3 3"/><rect x="642" y="117" width="56" height="66" rx="8" fill="#E3EBFF" stroke="#2B57C9" stroke-width="1.6"/><path d="M670,270 C560,250 570,160 636,150" fill="none" stroke="#26805A" stroke-width="2" marker-end="url(#ah-u11s3chunkmm)"/><path d="M670,270 C780,250 770,160 704,150" fill="none" stroke="#26805A" stroke-width="2" marker-end="url(#ah-u11s3chunkmm)"/><path d="M670,270 L670,187" fill="none" stroke="#C2501A" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#ah-u11s3chunkmm)"/><text x="16" y="24" text-anchor="start" font-size="12.5" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">ACT：一次预测一整段动作</text><text x="16" y="52" text-anchor="start" font-size="10.5" font-weight="500" fill="#C2501A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">逐步决策：每一步都重新选，小抖动一步步叠加</text><text x="16" y="152" text-anchor="start" font-size="10.5" font-weight="500" fill="#B83560" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">动作分块：一次给出一段连贯的动作，执行完再看</text><text x="119" y="222" text-anchor="middle" font-size="10.5" font-weight="500" fill="#B83560" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">动作块 1</text><text x="303" y="228" text-anchor="middle" font-size="10.5" font-weight="500" fill="#B83560" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">动作块 2</text><text x="210" y="262" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">时间上的连贯性压住误差累积；代价是块内看不到新变化（三.2）</text><text x="460" y="24" text-anchor="start" font-size="12.5" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Diffusion Policy：同时容纳几种合理做法</text><text x="670" y="154" text-anchor="middle" font-size="11" font-weight="600" fill="#2B57C9" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">杯子</text><text x="542" y="112" text-anchor="middle" font-size="10.5" font-weight="600" fill="#26805A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">从左侧抓：合理</text><text x="798" y="112" text-anchor="middle" font-size="10.5" font-weight="600" fill="#26805A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">从右侧抓：合理</text><text x="724" y="238" text-anchor="start" font-size="10.5" font-weight="600" fill="#C2501A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">两者平均：直直撞向杯身</text><text x="670" y="290" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">生成式的动作分布保留两种做法，每次采样其中一种（示意）</text></svg>
