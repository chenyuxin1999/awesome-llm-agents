<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-label="误差累积与 DAgger"><defs><marker id="ah-u11s3dagger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6577"/></marker></defs><rect x="0" y="0" width="900" height="300" fill="#ffffff"/><line x1="30" y1="250" x2="420" y2="250" stroke="#9AA6B8" stroke-width="1"/><line x1="450" y1="40" x2="450" y2="290" stroke="#D5DBE4" stroke-width="1"/><path d="M660,92 L691,92" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-u11s3dagger)"/><path d="M789,118 L789,159" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-u11s3dagger)"/><path d="M694,188 L663,188" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-u11s3dagger)"/><path d="M565,162 L565,121" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-u11s3dagger)"/><path d="M40,150 C140,148 260,146 410,140" fill="none" stroke="#26805A" stroke-width="2"/><path d="M40,150 C120,152 180,170 240,190 S350,232 410,240" fill="none" stroke="#C2501A" stroke-width="2" stroke-dasharray="5 3"/><circle cx="138" cy="161" r="4" fill="#FDE8DD" stroke="#C2501A" stroke-width="1.5"/><rect x="470" y="66" width="190" height="52" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="694" y="66" width="190" height="52" rx="5" fill="#FDE8DD" stroke="#C2501A" stroke-width="1.5"/><rect x="694" y="162" width="190" height="52" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="470" y="162" width="190" height="52" rx="5" fill="#E9EDF3" stroke="#47546A" stroke-width="1.5"/><text x="16" y="24" text-anchor="start" font-size="12.5" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">模仿学习的老毛病：一步小错，走进示范里没有的地方</text><text x="420" y="266" text-anchor="end" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">时间</text><text x="300" y="132" text-anchor="middle" font-size="10.5" font-weight="600" fill="#26805A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">示范轨迹：专家走过的状态</text><text x="180" y="210" text-anchor="middle" font-size="10.5" font-weight="600" fill="#C2501A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">策略轨迹：小错把它带离示范</text><text x="124" y="182" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">第一次小错</text><text x="225" y="268" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">离示范越远，模型越不知道该做什么，错得越多（示意）</text><text x="470" y="50" text-anchor="start" font-size="12.5" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">DAgger 的一轮（2010）</text><text x="565" y="88.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">让策略自己去跑</text><text x="565" y="103.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">不照着示范走</text><text x="789" y="88.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">记下它到达的状态</text><text x="789" y="103.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">包括走偏之后的</text><text x="789" y="184.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">请专家标注</text><text x="789" y="199.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">在这些状态上该怎么做</text><text x="565" y="191.72" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">加回训练集，重训</text><text x="600" y="145" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" style="paint-order:stroke;stroke-width:4px;stroke-linejoin:round" stroke="#ffffff">下一轮</text><text x="677" y="246" text-anchor="middle" font-size="10.5" font-weight="500" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">示范覆盖到策略真正会走到的地方，误差就不再越滚越大</text><text x="677" y="266" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">十几年后 π*0.6 的人工接管，补的仍是这一块</text></svg>
