xt x="830" y="194.41" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">其他机器人与环境</text><text x="231" y="254" text-anchor="middle" font-size="11.5" font-weight="700" fill="#C2501A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">消融：去掉网络数据</text><text x="231" y="274" text-anchor="middle" font-size="10.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">主要伤害对新物体类别的识别</text><text x="669" y="254" text-anchor="middle" font-size="11.5" font-weight="700" fill="#C2501A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">消融：去掉其他机器人和环境的数据</text><text x="669" y="274" text-anchor="middle" font-size="10.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">在所有条件下都明显变差</text><text x="450" y="314" text-anchor="middle" font-size="10.5" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">训练环境数到约 100 个之后，在陌生家庭里的表现接近直接在测试环境里训练的基线</text></svg>
