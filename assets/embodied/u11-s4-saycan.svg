ont-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">指令</text><text x="111" y="84.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">把桌上洒的东西擦干净</text><text x="111" y="152.72" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">当前画面与状态</text><text x="314" y="52" text-anchor="middle" font-size="11.5" font-weight="700" fill="#47546A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">候选技能</text><text x="484" y="52" text-anchor="middle" font-size="11.5" font-weight="700" fill="#5B45B0" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">语言模型：有用吗</text><text x="654" y="52" text-anchor="middle" font-size="11.5" font-weight="700" fill="#26805A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">价值函数：做得成吗</text><text x="824" y="52" text-anchor="middle" font-size="11.5" font-weight="700" fill="#B83560" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">相乘</text><text x="314" y="86" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">拿起海绵</text><text x="314" y="126" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">走到桌边</text><text x="314" y="166" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">拿起抹布</text><text x="314" y="206" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">打开抽屉</text><text x="450" y="248" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">示意数值：“拿起海绵”很有用，可机器人现在做不成；“拿起抹布”两头都过得去，被选中</text><text x="450" y="270" text-anchor="middle" font-size="10.5" font-weight="500" fill="#C2501A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">选中之后，动作本身仍由一个个单独训练的技能完成；语言模型只负责挑</text></svg>
