aHei, sans-serif">③ 价值与优势</text><text x="744" y="95.565" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">训练价值函数</text><text x="744" y="149.565" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">估每个局面的希望</text><text x="744" y="203.565" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">价值的变化 = 优势</text><text x="450" y="273.565" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">每段动作打上优势标注，策略以标注为条件训练；执行时把它引向高优势的动作</text></svg>
