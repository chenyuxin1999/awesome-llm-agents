C, Microsoft YaHei, sans-serif">推理期间</text><text x="410" y="257" text-anchor="middle" font-size="10.5" font-weight="500" fill="#47546A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">冻结</text><text x="565" y="257" text-anchor="middle" font-size="10.5" font-weight="500" fill="#5B45B0" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">其余部分由模型补全</text><text x="690" y="249" text-anchor="start" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">新块的开头固定为推理期间</text><text x="690" y="265" text-anchor="start" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">必然会执行的那几步</text><text x="450" y="314" text-anchor="middle" font-size="10.5" font-weight="500" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Physical Intelligence 报告：人为加 200 毫秒延迟时吞吐量几乎不变；延迟超过 300 毫秒仍能划火柴、插网线</text></svg>
