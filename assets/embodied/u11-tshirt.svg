<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="900" height="320" role="img" aria-label="叠 T 恤为什么难"><defs><marker id="ah-u11tshirt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6577"/></marker></defs><rect x="0" y="0" width="900" height="320" fill="#ffffff"/><path d="M364,64 L381,64" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-u11tshirt)"/><path d="M496,64 L513,64" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-u11tshirt)"/><path d="M628,64 L645,64" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-u11tshirt)"/><path d="M760,64 L777,64" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-u11tshirt)"/><line x1="308" y1="86" x2="308" y2="290" stroke="#E3E7EE" stroke-width="1" stroke-dasharray="2 3"/><line x1="440" y1="86" x2="440" y2="290" stroke="#E3E7EE" stroke-width="1" stroke-dasharray="2 3"/><line x1="572" y1="86" x2="572" y2="290" stroke="#E3E7EE" stroke-width="1" stroke-dasharray="2 3"/><line x1="704" y1="86" x2="704" y2="290" stroke="#E3E7EE" stroke-width="1" stroke-dasharray="2 3"/><line x1="836" y1="86" x2="836" y2="290" stroke="#E3E7EE" stroke-width="1" stroke-dasharray="2 3"/><line x1="240" y1="120" x2="884" y2="120" stroke="#EEF1F5" stroke-width="1"/><line x1="240" y1="168" x2="884" y2="168" stroke="#EEF1F5" stroke-width="1"/><line x1="240" y1="216" x2="884" y2="216" stroke="#EEF1F5" stroke-width="1"/><line x1="240" y1="264" x2="884" y2="264" stroke="#EEF1F5" stroke-width="1"/><rect x="252" y="44" width="112" height="40" rx="5" fill="#E3EBFF" stroke="#2B57C9" stroke-width="1.5"/><rect x="384" y="44" width="112" height="40" rx="5" fill="#E3EBFF" stroke="#2B57C9" stroke-width="1.5"/><rect x="516" y="44" width="112" height="40" rx="5" fill="#E3EBFF" stroke="#2B57C9" stroke-width="1.5"/><rect x="648" y="44" width="112" height="40" rx="5" fill="#E3EBFF" stroke="#2B57C9" stroke-width="1.5"/><rect x="780" y="44" width="112" height="40" rx="5" fill="#E3EBFF" stroke="#2B57C9" stroke-width="1.5"/><rect x="16" y="100" width="220" height="40" rx="5" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.5"/><circle cx="308" cy="120" r="7" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.5"/><circle cx="440" cy="120" r="7" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.5"/><rect x="16" y="148" width="220" height="40" rx="5" fill="#FDE8DD" stroke="#C2501A" stroke-width="1.5"/><circle cx="440" cy="168" r="7" fill="#FDE8DD" stroke="#C2501A" stroke-width="1.5"/><circle cx="572" cy="168" r="7" fill="#FDE8DD" stroke="#C2501A" stroke-width="1.5"/><circle cx="704" cy="168" r="7" fill="#FDE8DD" stroke="#C2501A" stroke-width="1.5"/><rect x="16" y="196" width="220" height="40" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><circle cx="308" cy="216" r="7" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><circle cx="440" cy="216" r="7" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><circle cx="572" cy="216" r="7" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><circle cx="704" cy="216" r="7" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><circle cx="836" cy="216" r="7" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><rect x="16" y="244" width="220" height="40" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><circle cx="440" cy="264" r="7" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><circle cx="704" cy="264" r="7" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><text x="16" y="24" text-anchor="start" font-size="12.5" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">同一件家务：把揉成一团的 T 恤从洗衣篮里拿出来，叠好，放到桌上（步骤为示意）</text><text x="308" y="67.565" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">从篮子里抓起</text><text x="440" y="67.565" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">抖开、找领口</text><text x="572" y="67.565" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">铺平、压平</text><text x="704" y="67.565" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">对折几次</text><text x="836" y="67.565" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">放到桌上</text><text x="126" y="116.665" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">形状没有定数</text><text x="126" y="131.035" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">每次抓起来都不一样</text><text x="126" y="164.665" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">接触和摩擦</text><text x="126" y="179.035" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">捏、抖、压都靠力，难算准</text><text x="126" y="212.665" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">几十步串成一条链</text><text x="126" y="227.035" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">一步没捏住，后面跟着错</text><text x="126" y="260.665" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">常识</text><text x="126" y="275.035" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">哪里是领口，哪面是正面</text><text x="450" y="310" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">圆点表示这一类难点主要压在哪一步；后面六段方法，各自会在其中某一类上碰壁</text></svg>
