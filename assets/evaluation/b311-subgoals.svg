="460" y="240" width="420" height="100" rx="5" fill="#E3EBFF" stroke="#2B57C9" stroke-width="1.5"/><text x="20" y="24" text-anchor="start" font-size="12" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Long-Horizon-Terminal-Bench：把一个长任务拆成带分数的子目标，进度和交付分开看</text><text x="196" y="54" text-anchor="middle" font-size="10.5" font-weight="600" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">子目标 1</text><text x="288" y="54" text-anchor="middle" font-size="10.5" font-weight="600" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">子目标 2</text><text x="380" y="54" text-anchor="middle" font-size="10.5" font-weight="600" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">子目标 3</text><text x="472" y="54" text-anchor="middle" font-size="10.5" font-weight="600" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">子目标 4</text><text x="564" y="54" text-anchor="middle" font-size="10.5" font-weight="600" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">子目标 5</text><text x="656" y="54" text-anchor="middle" font-size="10.5" font-weight="600" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">最终产物</text><text x="20" y="88" text-anchor="start" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">运行甲</text><text x="710" y="88" text-anchor="start" font-size="10.5" font-weight="500" fill="#C2501A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">完全没有推进</text><text x="20" y="134" text-anchor="start" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">运行乙</text><text x="710" y="134" text-anchor="start" font-size="10.5" font-weight="500" fill="#C2501A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">完成部分阶段，缺关键产物</text><text x="20" y="180" text-anchor="start" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">运行丙</text><text x="710" y="180" text-anchor="start" font-size="10.5" font-weight="500" fill="#26805A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">最终交付</text><text x="150" y="222" text-anchor="start" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">前一段的产出是后一段的输入；子目标得分帮助定位瓶颈，完整成功率说明能力能否一起工作</text><text x="34" y="262" text-anchor="start" font-size="11.5" font-weight="700" fill="#0E6E7E" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">论文摘要里的数字</text><text x="34" y="284" text-anchor="start" font-size="10.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">46 个任务、9 类；每次运行平均约 231 个回合、85.3 分钟</text><text x="34" y="304" text-anchor="start" font-size="10.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">最强模型：部分奖励阈值 0.95 时 15.2%，满分阈值 1.0 时 10.9%</text><text x="34" y="324" text-anchor="start" font-size="10.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">各模型平均：两个阈值下分别是 4.3% 和 1.7%</text><text x="474" y="262" text-anchor="start" font-size="11.5" font-weight="700" fill="#2B57C9" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">描述一个任务有多长，至少交代四件事</text><text x="474" y="290" text-anchor="start" font-size="10.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">· 最长的依赖链有多长</text><text x="680" y="290" text-anchor="start" font-size="10.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">· 需要维持哪些状态</text><text x="474" y="316" text-anchor="start" font-size="10.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">· 哪些步骤可以并行，哪些必须顺序</text><text x="680" y="316" text-anchor="start" font-size="10.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">· 失败后是否允许重来</text></svg>
