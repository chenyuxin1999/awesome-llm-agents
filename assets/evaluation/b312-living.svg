B45B0" stroke-width="1.5"/><rect x="330" y="136" width="96" height="30" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="440" y="136" width="96" height="30" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><rect x="550" y="136" width="96" height="30" rx="5" fill="#F3F5F8" stroke="#D5DBE4" stroke-width="1.5"/><rect x="680" y="128" width="200" height="52" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="20" y="258" width="130" height="56" rx="5" fill="#E3EBFF" stroke="#2B57C9" stroke-width="1.5"/><rect x="176" y="258" width="120" height="56" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="320" y="252" width="116" height="32" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="320" y="290" width="116" height="32" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="472" y="258" width="120" height="36" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="472" y="304" width="120" height="36" rx="5" fill="#F3F5F8" stroke="#D5DBE4" stroke-width="1.5"/><rect x="620" y="270" width="120" height="58" rx="5" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.5"/><rect x="760" y="262" width="120" height="74" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><text x="20" y="24" text-anchor="start" font-size="11.5" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">任务进行时世界也在变：何时重新观察、何时行动、何时询问；规则要一直有效，还要分清是不是规则带来的</text><text x="20" y="52" text-anchor="start" font-size="12.5" font-weight="700" fill="#47546A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">VibeLifeBench：一条按自己时钟前进的多周时间线</text><text x="60" y="84" text-anchor="middle" font-size="10.5" font-weight="600" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">第 1 周</text><text x="265" y="84" text-anchor="middle" font-size="10.5" font-weight="600" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">第 2 周</text><text x="470" y="84" text-anchor="middle" font-size="10.5" font-weight="600" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">第 3 周</text><text x="675" y="84" text-anchor="middle" font-size="10.5" font-weight="600" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">第 4 周</text><text x="110" y="135.255" text-anchor="middle" font-size="10.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">用户提出请求</text><text x="270" y="118" text-anchor="middle" font-size="10" font-weight="600" fill="#C2501A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">静默变化</text><text x="520" y="118" text-anchor="middle" font-size="10" font-weight="600" fill="#C2501A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">静默变化</text><text x="700" y="118" text-anchor="middle" font-size="10" font-weight="600" fill="#C2501A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">静默变化</text><text x="268" y="154.255" text-anchor="middle" font-size="10.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">重新观察</text><text x="378" y="154.255" text-anchor="middle" font-size="10.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">行动</text><text x="488" y="154.255" text-anchor="middle" font-size="10.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">询问</text><text x="598" y="154.255" text-anchor="middle" font-size="10.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">保持沉默</text><text x="433" y="184" text-anchor="middle" font-size="10.5" font-weight="500" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">没有新提示，agent 也要自己决定下一步</text><text x="780" y="150.7" text-anchor="middle" font-size="10.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">只读 agent 留下的东西</text><text x="780" y="164.19" text-anchor="middle" font-size="9.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">终态、行动是否及时、隐含约束</text><text x="20" y="206" text-anchor="start" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">200 个任务、十个生活领域、22 个模拟服务</text><text x="20" y="244" text-anchor="start" font-size="12.5" font-weight="700" fill="#47546A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">HANDBOOK.md：手册从头到尾都生效</text><text x="85" y="282.51" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">操作手册</text><text x="85" y="296.69" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">20–124 页</text><text x="236" y="282.7" text-anchor="middle" font-size="10.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">长程工具使用</text><text x="236" y="296.19" text-anchor="middle" font-size="9.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">邮件、日历、工单</text><text x="378" y="271.1" text-anchor="middle" font-size="10" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">必须做的发生了</text><text x="378" y="309.1" text-anchor="middle" font-size="10" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">禁止做的没发生</text><text x="20" y="340" text-anchor="start" font-size="10.5" font-weight="500" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">严格评分（每条都过才算通过）：最强模型 36.2%</text><text x="20" y="358" text-anchor="start" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">常见失败：在环境里看似合理的未授权请求压过了手册</text><text x="472" y="244" text-anchor="start" font-size="12.5" font-weight="700" fill="#47546A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Harness-IF：拿掉规则重跑一遍</text><text x="532" y="279.255" text-anchor="middle" font-size="10.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">带规则运行</text><text x="532" y="325.255" text-anchor="middle" font-size="10.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">撤掉规则运行</text><text x="680" y="295.7" text-anchor="middle" font-size="10.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">比较两次行为</text><text x="680" y="309.19" text-anchor="middle" font-size="9.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">默认就会这样做吗</text><text x="820" y="295.355" text-anchor="middle" font-size="10.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">只计违背默认的规则</text><text x="820" y="309.345" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">AP-Acc</text><text x="472" y="362" text-anchor="start" font-size="10.5" font-weight="500" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">12 个前沿模型在违背默认倾向的规则上都更差，</text><text x="472" y="380" text-anchor="start" font-size="10.5" font-weight="500" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">差 3.6 到 7.4 分；总分因此高估了遵循程度</text></svg>
