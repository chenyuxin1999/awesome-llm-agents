<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" role="img" aria-label="跨任务积累的三种对照"><defs><marker id="ah-b313paired" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6577"/></marker></defs><rect x="0" y="0" width="900" height="400" fill="#ffffff"/><path d="M230,84 L267,75" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-b313paired)"/><path d="M230,98 L267,107" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-b313paired)"/><path d="M420,75 L457,85" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-b313paired)"/><path d="M420,107 L457,98" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-b313paired)"/><line x1="20" y1="134" x2="880" y2="134" stroke="#D5DBE4" stroke-width="1"/><path d="M44,183 L49,183" fill="none" stroke="#5A6577" stroke-width="0.9" marker-end="url(#ah-b313paired)"/><path d="M74,183 L79,183" fill="none" stroke="#5A6577" stroke-width="0.9" marker-end="url(#ah-b313paired)"/><path d="M104,183 L109,183" fill="none" stroke="#5A6577" stroke-width="0.9" marker-end="url(#ah-b313paired)"/><path d="M134,183 L139,183" fill="none" stroke="#5A6577" stroke-width="0.9" marker-end="url(#ah-b313paired)"/><path d="M164,183 L169,183" fill="none" stroke="#5A6577" stroke-width="0.9" marker-end="url(#ah-b313paired)"/><path d="M194,183 L199,183" fill="none" stroke="#5A6577" stroke-width="0.9" marker-end="url(#ah-b313paired)"/><path d="M224,183 L229,183" fill="none" stroke="#5A6577" stroke-width="0.9" marker-end="url(#ah-b313paired)"/><path d="M470,183 L507,196" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-b313paired)"/><path d="M470,223 L507,210" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-b313paired)"/><line x1="20" y1="256" x2="880" y2="256" stroke="#D5DBE4" stroke-width="1"/><path d="M150,321 L177,321" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-b313paired)"/><path d="M320,321 L347,321" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-b313paired)"/><path d="M470,314 L517,305" fill="none" stroke="#C2501A" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#ah-b313paired)"/><path d="M470,328 L517,341" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-b313paired)"/><rect x="20" y="66" width="210" height="50" rx="5" fill="#E9EDF3" stroke="#47546A" stroke-width="1.5"/><rect x="270" y="62" width="150" height="26" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="270" y="94" width="150" height="26" rx="5" fill="#F3F5F8" stroke="#D5DBE4" stroke-width="1.5"/><rect x="460" y="66" width="150" height="50" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="20" y="172" width="24" height="22" rx="3" fill="#E3EBFF" stroke="#2B57C9" stroke-width="1.1"/><rect x="50" y="172" width="24" height="22" rx="3" fill="#E3EBFF" stroke="#2B57C9" stroke-width="1.1"/><rect x="80" y="172" width="24" height="22" rx="3" fill="#E3EBFF" stroke="#2B57C9" stroke-width="1.1"/><rect x="110" y="172" width="24" height="22" rx="3" fill="#E3EBFF" stroke="#2B57C9" stroke-width="1.1"/><rect x="140" y="172" width="24" height="22" rx="3" fill="#E3EBFF" stroke="#2B57C9" stroke-width="1.1"/><rect x="170" y="172" width="24" height="22" rx="3" fill="#E3EBFF" stroke="#2B57C9" stroke-width="1.1"/><rect x="200" y="172" width="24" height="22" rx="3" fill="#E3EBFF" stroke="#2B57C9" stroke-width="1.1"/><rect x="230" y="172" width="24" height="22" rx="3" fill="#E3EBFF" stroke="#2B57C9" stroke-width="1.1"/><rect x="300" y="166" width="170" height="34" rx="5" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.5"/><rect x="300" y="206" width="170" height="34" rx="5" fill="#E9EDF3" stroke="#47546A" stroke-width="1.5"/><rect x="510" y="176" width="370" height="54" rx="5" fill="#FDE8DD" stroke="#C2501A" stroke-width="1.5"/><rect x="20" y="296" width="130" height="50" rx="5" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.5"/><rect x="180" y="296" width="140" height="50" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="350" y="296" width="120" height="50" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="520" y="290" width="160" height="30" rx="5" fill="#FDE8DD" stroke="#C2501A" stroke-width="1.5"/><rect x="520" y="326" width="160" height="30" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="710" y="290" width="170" height="66" rx="5" fill="#DCEFF1" stroke="#0E6E7E" stroke-width="1.5"/><text x="20" y="24" text-anchor="start" font-size="12" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">想证明“下一次做得更好”，关键是对照：固定其余条件、比较两种运行、把挑选和测试分开</text><text x="20" y="54" text-anchor="start" font-size="12.5" font-weight="700" fill="#0E6E7E" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">① 有没有这个技能（Evaluating Skills, Not Just Agents）</text><text x="125" y="87.855" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">固定不变</text><text x="125" y="101.535" text-anchor="middle" font-size="9.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">模型、harness、工作区、评分器</text><text x="345" y="78.255" text-anchor="middle" font-size="10.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">带技能运行</text><text x="345" y="110.255" text-anchor="middle" font-size="10.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">不带技能运行</text><text x="535" y="87.51" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">差值 = Skill Lift</text><text x="535" y="101.69" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">配对试次</text><text x="630" y="82" text-anchor="start" font-size="10.5" font-weight="500" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">947 组配对：平均综合提升 0.2134</text><text x="630" y="100" text-anchor="start" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">72.8% 的配对里为正</text><text x="20" y="158" text-anchor="start" font-size="12.5" font-weight="700" fill="#0E6E7E" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">② 收益来自可复用的技能，还是先前的上下文（ContinualSkillBench）</text><text x="20" y="212" text-anchor="start" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">每个领域 100 个相互关联、由易到难的子任务</text><text x="385" y="179.7" text-anchor="middle" font-size="10.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">连续上下文</text><text x="385" y="193.19" text-anchor="middle" font-size="9.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">直接带着之前的记录</text><text x="385" y="219.7" text-anchor="middle" font-size="10.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">显式技能维护</text><text x="385" y="233.19" text-anchor="middle" font-size="9.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">把经验写成技能</text><text x="695" y="193.145" text-anchor="middle" font-size="10.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">两者平均表现相近</text><text x="695" y="206.635" text-anchor="middle" font-size="9.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">收益多来自对先前上下文和反馈的适应；显式技能只在需要可复用流程的任务上有选</text><text x="695" y="219.745" text-anchor="middle" font-size="9.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">择性的帮助</text><text x="20" y="280" text-anchor="start" font-size="12.5" font-weight="700" fill="#0E6E7E" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">③ 挑版本用的反馈，和最后测试用的任务分开（Rethinking the Evaluation of Harness Evolution）</text><text x="85" y="317.51" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">任务反馈</text><text x="85" y="331.69" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">例如单元测试</text><text x="250" y="317.51" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">候选 harness</text><text x="250" y="331.69" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">反复修改</text><text x="410" y="324.41" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">挑最好的</text><text x="600" y="308.255" text-anchor="middle" font-size="10.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">同一基准上报告</text><text x="600" y="344.255" text-anchor="middle" font-size="10.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">留出任务上报告</text><text x="795" y="306.59" text-anchor="middle" font-size="10.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">对照同等预算的</text><text x="795" y="320.08" text-anchor="middle" font-size="9.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">简单测试时扩展</text><text x="795" y="333.19" text-anchor="middle" font-size="9.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Terminal-Bench 2.1 上</text><text x="795" y="346.3" text-anchor="middle" font-size="9.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">没有胜过它</text><text x="20" y="384" text-anchor="start" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">在 ARC-AGI-3、EdgeBench 这类长程游戏里，同等预算下任务专用的 harness 演化仍有明显收益（摘要）</text></svg>
