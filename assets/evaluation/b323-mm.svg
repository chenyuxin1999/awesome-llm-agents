roke-width="1.5"/><rect x="20" y="302" width="130" height="64" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="190" y="300" width="230" height="32" rx="5" fill="#FDE8DD" stroke="#C2501A" stroke-width="1.5"/><rect x="190" y="338" width="230" height="32" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="470" y="302" width="120" height="64" rx="5" fill="#E3EBFF" stroke="#2B57C9" stroke-width="1.5"/><rect x="630" y="300" width="100" height="20" rx="5" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.5"/><rect x="630" y="324" width="100" height="20" rx="5" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.5"/><rect x="630" y="348" width="100" height="20" rx="5" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.5"/><rect x="760" y="302" width="120" height="64" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><text x="20" y="24" text-anchor="start" font-size="12" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">分三层测：有没有看到必要的证据，有没有理解证据之间的关系，能不能据此行动或判断结果</text><text x="156" y="65.72" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">① 看到证据</text><text x="156" y="118.61" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">PerceptionBench</text><text x="156" y="132.79" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">十种原子感知能力，3,000 道短答案题；没有模型超</text><text x="156" y="146.59" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">过 60%</text><text x="448" y="65.72" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">② 理解关系</text><text x="448" y="125.51" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">ChartSync</text><text x="448" y="139.69" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">改了数据，图上的几何要跟着联动</text><text x="448" y="203.51" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Evidence-Backed VQA</text><text x="448" y="217.69" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">答案之外还要给出时空证据</text><text x="740" y="65.72" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">③ 行动与判断结果</text><text x="740" y="125.51" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">OSReward</text><text x="740" y="139.69" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">视觉裁判普遍偏宽松，把失败判成成功</text><text x="20" y="288" text-anchor="start" font-size="12.5" font-weight="700" fill="#0E6E7E" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">同一份 VLM 输出，两种读法（A VLM Answer Is Not an Anomaly Score）</text><text x="85" y="330.855" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">VLM</text><text x="85" y="344.535" text-anchor="middle" font-size="9.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">对各个答案给概率</text><text x="305" y="319.255" text-anchor="middle" font-size="10.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">只取解码出的答案：并列很多</text><text x="305" y="357.255" text-anchor="middle" font-size="10.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">按概率加权：排序信息保留</text><text x="20" y="390" text-anchor="start" font-size="10.5" font-weight="500" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">后者在各基准上平均高 7.66 到 19.95 分</text><text x="470" y="288" text-anchor="start" font-size="12.5" font-weight="700" fill="#0E6E7E" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Visual Jev：多题共享一张图</text><text x="530" y="330.855" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">图像与上下文</text><text x="530" y="344.535" text-anchor="middle" font-size="9.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">只编码一次</text><text x="680" y="312.945" text-anchor="middle" font-size="9.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">问题 1</text><text x="680" y="336.945" text-anchor="middle" font-size="9.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">问题 2</text><text x="680" y="360.945" text-anchor="middle" font-size="9.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">问题 3</text><text x="820" y="330.855" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">读候选概率</text><text x="820" y="344.535" text-anchor="middle" font-size="9.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">批量执行</text><text x="470" y="390" text-anchor="start" font-size="10.5" font-weight="500" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">每张图 32 题时比逐题串行快 8.9 倍：判断准确率和效率要分开测</text></svg>
