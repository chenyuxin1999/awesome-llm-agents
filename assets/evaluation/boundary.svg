<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="900" height="340" role="img" aria-label="从能完成多步任务到长期可靠"><defs><marker id="ah-boundary" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6577"/></marker></defs><rect x="0" y="0" width="900" height="340" fill="#ffffff"/><path d="M170,188 L217,122" fill="none" stroke="#5A6577" stroke-width="1.1" marker-end="url(#ah-boundary)"/><path d="M620,122 L727,188" fill="none" stroke="#5A6577" stroke-width="1.1" stroke-dasharray="4 3" marker-end="url(#ah-boundary)"/><path d="M170,188 L217,166" fill="none" stroke="#5A6577" stroke-width="1.1" marker-end="url(#ah-boundary)"/><path d="M620,166 L727,188" fill="none" stroke="#5A6577" stroke-width="1.1" stroke-dasharray="4 3" marker-end="url(#ah-boundary)"/><path d="M170,188 L217,210" fill="none" stroke="#5A6577" stroke-width="1.1" marker-end="url(#ah-boundary)"/><path d="M620,210 L727,188" fill="none" stroke="#5A6577" stroke-width="1.1" stroke-dasharray="4 3" marker-end="url(#ah-boundary)"/><path d="M170,188 L217,254" fill="none" stroke="#5A6577" stroke-width="1.1" marker-end="url(#ah-boundary)"/><path d="M620,254 L727,188" fill="none" stroke="#5A6577" stroke-width="1.1" stroke-dasharray="4 3" marker-end="url(#ah-boundary)"/><rect x="20" y="40" width="268" height="46" rx="5" fill="#DCEFF1" stroke="#0E6E7E" stroke-width="1.5"/><rect x="316" y="40" width="268" height="46" rx="5" fill="#DCEFF1" stroke="#0E6E7E" stroke-width="1.5"/><rect x="612" y="40" width="268" height="46" rx="5" fill="#DCEFF1" stroke="#0E6E7E" stroke-width="1.5"/><rect x="20" y="128" width="150" height="120" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="730" y="128" width="150" height="120" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="220" y="104" width="220" height="36" rx="5" fill="#FDE8DD" stroke="#C2501A" stroke-width="1.5"/><rect x="220" y="148" width="220" height="36" rx="5" fill="#FDE8DD" stroke="#C2501A" stroke-width="1.5"/><rect x="220" y="192" width="220" height="36" rx="5" fill="#FDE8DD" stroke="#C2501A" stroke-width="1.5"/><rect x="220" y="236" width="220" height="36" rx="5" fill="#FDE8DD" stroke="#C2501A" stroke-width="1.5"/><text x="20" y="24" text-anchor="start" font-size="12" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">三件事加在一起，就是前沿评测继续沿着更长和更宽展开的起点</text><text x="154" y="59.32" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">METR 的趋势线</text><text x="154" y="74.19" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">时间地平线在变长</text><text x="450" y="59.32" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Yao 的批评</text><text x="450" y="74.19" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">评测的默认假设需要改写</text><text x="746" y="59.32" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Anthropic 的手册</text><text x="746" y="74.19" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">测量本身就可能出错</text><text x="95" y="177.23" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">能完成多步任务</text><text x="95" y="192.29" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">经典基准已经接上了知识、</text><text x="95" y="206.78" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">动作和环境反馈</text><text x="805" y="177.23" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">长期可靠</text><text x="805" y="192.29" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">长时间、换环境、出过错之</text><text x="805" y="206.78" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">后，依然做对</text><text x="330" y="125.41" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">始终知道目标</text><text x="460" y="127" text-anchor="start" font-size="10.5" font-weight="600" fill="#0E6E7E" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">3.1.1 多阶段依赖</text><text x="330" y="169.41" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">发现世界已经变了</text><text x="460" y="171" text-anchor="start" font-size="10.5" font-weight="600" fill="#0E6E7E" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">3.1.2 动态环境</text><text x="330" y="213.41" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">失败后能接着做</text><text x="460" y="215" text-anchor="start" font-size="10.5" font-weight="600" fill="#0E6E7E" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">3.1.2 中断恢复 · 3.1.3</text><text x="330" y="257.41" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">结果仍满足约束</text><text x="460" y="259" text-anchor="start" font-size="10.5" font-weight="600" fill="#0E6E7E" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">3.1.2 持续约束 · 3.2.2</text><text x="300" y="300" text-anchor="middle" font-size="11" font-weight="500" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">中间这四份责任，原先都没被测量；前沿工作把它们一份份放进任务里</text><text x="300" y="320" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">领域继续扩大以后，同一套机制还要适应不同的时间要求和验收标准（三.2）</text></svg>
