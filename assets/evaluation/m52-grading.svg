<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="900" height="320" role="img" aria-label="开放产物评分的两种改法"><defs><marker id="ah-m52grading" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6577"/></marker></defs><rect x="0" y="0" width="900" height="320" fill="#ffffff"/><line x1="34" y1="196" x2="290" y2="196" stroke="#18202C" stroke-width="1"/><path d="M290,120 L307,100" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-m52grading)"/><path d="M290,140 L307,160" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-m52grading)"/><line x1="456" y1="40" x2="456" y2="300" stroke="#D5DBE4" stroke-width="1"/><path d="M642,118 L659,118" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-m52grading)"/><path d="M722,118 L739,118" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-m52grading)"/><rect x="40" y="182.667" width="36" height="13.3333" rx="2" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.5"/><rect x="90" y="169.333" width="36" height="26.6667" rx="2" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.5"/><rect x="140" y="129.333" width="36" height="66.6667" rx="2" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.5"/><rect x="190" y="89.3333" width="36" height="106.667" rx="2" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.5"/><rect x="240" y="142.667" width="36" height="53.3333" rx="2" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.5"/><rect x="310" y="80" width="120" height="40" rx="5" fill="#FDE8DD" stroke="#C2501A" stroke-width="1.5"/><rect x="310" y="140" width="120" height="40" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="472" y="70" width="170" height="96" rx="5" fill="#E3EBFF" stroke="#2B57C9" stroke-width="1.5"/><rect x="662" y="98" width="60" height="40" rx="5" fill="#F3F5F8" stroke="#D5DBE4" stroke-width="1.5"/><rect x="742" y="70" width="138" height="22" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="742" y="96" width="138" height="22" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="742" y="122" width="138" height="22" rx="5" fill="#FDE8DD" stroke="#C2501A" stroke-width="1.5"/><rect x="742" y="148" width="138" height="22" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="472" y="220" width="408" height="60" rx="5" fill="#DCEFF1" stroke="#0E6E7E" stroke-width="1.5"/><text x="20" y="24" text-anchor="start" font-size="12" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">一种改变分数的表示，一种改变评分的条件；两者都替代不了对领域事实的理解</text><text x="20" y="54" text-anchor="start" font-size="12.5" font-weight="700" fill="#0E6E7E" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">LLM-as-a-Verifier：对评分 token 的分布求期望</text><text x="58" y="212" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">1 分</text><text x="108" y="212" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">2 分</text><text x="158" y="212" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">3 分</text><text x="208" y="212" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">4 分</text><text x="258" y="212" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">5 分</text><text x="370" y="103.255" text-anchor="middle" font-size="10.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">离散：取 4 分</text><text x="370" y="163.255" text-anchor="middle" font-size="10.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">连续：约 3.6 分</text><text x="20" y="240" text-anchor="start" font-size="10.5" font-weight="500" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">档位之间的信息不再丢失，对应验证者法则里的“奖励连续”</text><text x="20" y="258" text-anchor="start" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">（分布为示意）</text><text x="472" y="54" text-anchor="start" font-size="12.5" font-weight="700" fill="#0E6E7E" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">GAMUT：结构化评分准则编译成二元检查</text><text x="557" y="101.745" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">结构化元评分准则</text><text x="557" y="115.425" text-anchor="middle" font-size="9.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">可接受的选项集合</text><text x="557" y="128.535" text-anchor="middle" font-size="9.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">有顺序的过程</text><text x="557" y="141.645" text-anchor="middle" font-size="9.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">各条事实的重要性</text><text x="692" y="120.945" text-anchor="middle" font-size="9.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">固定规则</text><text x="811" y="83.945" text-anchor="middle" font-size="9.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">检查 1：通过</text><text x="811" y="109.945" text-anchor="middle" font-size="9.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">检查 2：通过</text><text x="811" y="135.945" text-anchor="middle" font-size="9.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">检查 3：未通过</text><text x="811" y="161.945" text-anchor="middle" font-size="9.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">检查 4：通过</text><text x="472" y="196" text-anchor="start" font-size="10.5" font-weight="500" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">作者时写得丰富，评分时只做扁平的是非判断，裁判更稳定</text><text x="676" y="246.7" text-anchor="middle" font-size="10.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Mitigating Scoring Bias …</text><text x="676" y="260.19" text-anchor="middle" font-size="9.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">先让裁判随机生成数字，测出它偏爱哪些分值，再据此校正评分概率；只纠正数值偏置</text><text x="20" y="300" text-anchor="start" font-size="10.5" font-weight="400" fill="#C2501A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">开放场景越多，越要保留分领域的人工或程序检查：高分无产物、引用不支持结论、过程违反约束</text></svg>
