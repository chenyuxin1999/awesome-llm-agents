stroke="#C2501A" stroke-width="1.5"/><text x="20" y="24" text-anchor="start" font-size="12" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">把较贵的检查集中到难判的样本上：路由要能识别不确定性，后备者也要真能纠正错误</text><text x="75" y="108.41" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">待评样本</text><text x="250" y="95.3" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">廉价裁判</text><text x="250" y="108.98" text-anchor="middle" font-size="9.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">JEV：直接返回</text><text x="250" y="122.09" text-anchor="middle" font-size="9.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">标签概率与置信度</text><text x="460" y="73.255" text-anchor="middle" font-size="10.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">置信度高：直接接受</text><text x="460" y="143.255" text-anchor="middle" font-size="10.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">不确定：升级</text><text x="665" y="136.855" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">后备推理裁判</text><text x="665" y="150.535" text-anchor="middle" font-size="9.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">又慢又贵</text><text x="830" y="108.41" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">最终判决</text><text x="626" y="40" text-anchor="start" font-size="10.5" font-weight="600" fill="#C2501A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">被自动接受的部分也要随机抽查</text><text x="230" y="227.855" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">JEV-as-a-Judge</text><text x="230" y="241.535" text-anchor="middle" font-size="9.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">阈值预先冻结：1,610 对留出样本上比 GPT-6 高 0.9 分，费用为其 41%</text><text x="670" y="227.855" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">JEV vs. LLMs as Rubric Judges</text><text x="670" y="241.535" text-anchor="middle" font-size="9.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">两类裁判错在同样的地方：JEV 最有把握的错误上，约 96% 的 LLM 裁决重复同样的错</text><text x="20" y="296" text-anchor="start" font-size="10.5" font-weight="500" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">评价级联要同时报告：总成本、升级比例、升级前后错误的变化</text><text x="20" y="316" text-anchor="start" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">REFLEX（选择性控制）、ORACLE（验证器调度）、LLMRouter（模型路由）面对的是同一类权衡</text></svg>
