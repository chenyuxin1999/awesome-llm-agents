<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-label="预算与早停"><defs><marker id="ah-m54budget" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6577"/></marker></defs><rect x="0" y="0" width="900" height="300" fill="#ffffff"/><line x1="80" y1="78" x2="92" y2="78" stroke="#9AA6B8" stroke-width="1.2"/><line x1="132" y1="78" x2="144" y2="78" stroke="#9AA6B8" stroke-width="1.2"/><line x1="184" y1="78" x2="196" y2="78" stroke="#9AA6B8" stroke-width="1.2"/><line x1="236" y1="78" x2="248" y2="78" stroke="#9AA6B8" stroke-width="1.2"/><line x1="288" y1="78" x2="300" y2="78" stroke="#9AA6B8" stroke-width="1.2"/><line x1="340" y1="78" x2="352" y2="78" stroke="#9AA6B8" stroke-width="1.2"/><line x1="392" y1="78" x2="404" y2="78" stroke="#9AA6B8" stroke-width="1.2"/><line x1="444" y1="78" x2="456" y2="78" stroke="#9AA6B8" stroke-width="1.2"/><line x1="496" y1="78" x2="508" y2="78" stroke="#9AA6B8" stroke-width="1.2"/><path d="M320,92 L320,140" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-m54budget)"/><rect x="40" y="64" width="40" height="28" rx="4" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.2"/><rect x="92" y="64" width="40" height="28" rx="4" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.2"/><rect x="144" y="64" width="40" height="28" rx="4" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.2"/><rect x="196" y="64" width="40" height="28" rx="4" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.2"/><rect x="248" y="64" width="40" height="28" rx="4" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.2"/><rect x="300" y="64" width="40" height="28" rx="4" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.2"/><rect x="352" y="64" width="40" height="28" rx="4" fill="#F3F5F8" stroke="#D5DBE4" stroke-width="1.2"/><rect x="404" y="64" width="40" height="28" rx="4" fill="#F3F5F8" stroke="#D5DBE4" stroke-width="1.2"/><rect x="456" y="64" width="40" height="28" rx="4" fill="#F3F5F8" stroke="#D5DBE4" stroke-width="1.2"/><rect x="508" y="64" width="40" height="28" rx="4" fill="#F3F5F8" stroke="#D5DBE4" stroke-width="1.2"/><rect x="220" y="142" width="200" height="52" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="560" y="56" width="320" height="66" rx="5" fill="#DCEFF1" stroke="#0E6E7E" stroke-width="1.5"/><rect x="560" y="140" width="320" height="54" rx="5" fill="#FDE8DD" stroke="#C2501A" stroke-width="1.5"/><rect x="250" y="214" width="116" height="28" rx="5" fill="#F3F5F8" stroke="#D5DBE4" stroke-width="1.5"/><rect x="378" y="214" width="116" height="28" rx="5" fill="#F3F5F8" stroke="#D5DBE4" stroke-width="1.5"/><rect x="506" y="214" width="116" height="28" rx="5" fill="#F3F5F8" stroke="#D5DBE4" stroke-width="1.5"/><rect x="634" y="214" width="116" height="28" rx="5" fill="#F3F5F8" stroke="#D5DBE4" stroke-width="1.5"/><rect x="762" y="214" width="116" height="28" rx="5" fill="#F3F5F8" stroke="#D5DBE4" stroke-width="1.5"/><text x="20" y="24" text-anchor="start" font-size="12" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">EarlyEval：用中间行为预测最终结果，提前停下；省下来的钱要用完整运行的对照来核对</text><text x="196" y="112" text-anchor="middle" font-size="10.5" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">agent 一步步执行</text><text x="456" y="112" text-anchor="middle" font-size="10.5" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">被省下的步骤</text><text x="320" y="164.7" text-anchor="middle" font-size="10.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">成功 / 失败两个分类器</text><text x="320" y="178.19" text-anchor="middle" font-size="9.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">任一越过置信阈值就停</text><text x="720" y="79.3" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">摘要数字</text><text x="720" y="92.98" text-anchor="middle" font-size="9.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">省掉 13%–26% 的步骤，预测准确率 89%–97%；各 agent 的通过率平均</text><text x="720" y="106.09" text-anchor="middle" font-size="9.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">只变动一到两个百分点</text><text x="720" y="163.7" text-anchor="middle" font-size="10.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">早停时的预测并非真正的完成</text><text x="720" y="177.19" text-anchor="middle" font-size="9.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">擅长后期恢复的新系统可能被误判</text><text x="20" y="230" text-anchor="start" font-size="10.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">长程评测的成本单位不只是 token：</text><text x="308" y="231.255" text-anchor="middle" font-size="10.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">生成 token</text><text x="436" y="231.255" text-anchor="middle" font-size="10.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">环境运行</text><text x="564" y="231.255" text-anchor="middle" font-size="10.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">工具等待</text><text x="692" y="231.255" text-anchor="middle" font-size="10.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">状态保存</text><text x="820" y="231.255" text-anchor="middle" font-size="10.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">人工介入</text><text x="20" y="276" text-anchor="start" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">报告里保留超时、启动失败和模型失败的记录；公开任务配独立留出集、按时间切分与版本记录</text></svg>
