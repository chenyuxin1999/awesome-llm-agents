<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" width="880" height="420" role="img" aria-label="评测一个 agent 的基本回路"><defs><marker id="ah-overviewloop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6577"/></marker></defs><rect x="0" y="0" width="880" height="420" fill="#ffffff"/><rect x="14" y="40" width="852" height="366" rx="5" fill="#F3F5F8" stroke="#D5DBE4" stroke-width="1.2" stroke-dasharray="5 4"/><path d="M170,140 L219,130" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-overviewloop)"/><path d="M170,160 L219,262" fill="none" stroke="#5A6577" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#ah-overviewloop)"/><path d="M300,170 L300,233" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-overviewloop)"/><path d="M344,236 L344,173" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-overviewloop)"/><path d="M422,130 L477,130" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-overviewloop)"/><path d="M422,271 L477,271" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-overviewloop)"/><path d="M680,130 L719,150" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-overviewloop)"/><path d="M680,271 L719,250" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-overviewloop)"/><path d="M787,286 L787,333" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-overviewloop)"/><path d="M480,364 L100,364 L100,187" fill="none" stroke="#5A6577" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#ah-overviewloop)"/><rect x="30" y="108" width="140" height="76" rx="5" fill="#E3EBFF" stroke="#2B57C9" stroke-width="1.5"/><rect x="222" y="90" width="200" height="80" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="222" y="236" width="200" height="70" rx="5" fill="#E9EDF3" stroke="#47546A" stroke-width="1.5"/><rect x="480" y="90" width="200" height="80" rx="5" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.5"/><rect x="480" y="236" width="200" height="70" rx="5" fill="#E9EDF3" stroke="#47546A" stroke-width="1.5"/><rect x="722" y="110" width="130" height="176" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="732" y="150" width="110" height="38" rx="4" fill="#FFFFFF" stroke="#26805A" stroke-width="1.2"/><rect x="732" y="194" width="110" height="38" rx="4" fill="#FFFFFF" stroke="#26805A" stroke-width="1.2"/><rect x="732" y="238" width="110" height="38" rx="4" fill="#FFFFFF" stroke="#26805A" stroke-width="1.2"/><rect x="480" y="336" width="372" height="56" rx="5" fill="#DCEFF1" stroke="#0E6E7E" stroke-width="1.5"/><text x="20" y="24" text-anchor="start" font-size="12" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">评测一个 agent，评的是模型和它外面那层 harness 的组合；尽量对结果打分，用轨迹诊断失败</text><text x="30" y="62" text-anchor="start" font-size="11" font-weight="600" fill="#0E6E7E" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">评测框架（evaluation harness）：给出指令和工具，运行任务，记录每一步，评分并汇总</text><text x="100" y="127.985" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">任务</text><text x="100" y="143.045" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">指令</text><text x="100" y="157.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">初始环境</text><text x="100" y="172.025" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">成功标准</text><text x="322" y="119.23" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">被测对象</text><text x="322" y="134.29" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">模型 + agent harness</text><text x="322" y="148.78" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">（提示、工具、重试策略）</text><text x="322" y="267.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">环境</text><text x="322" y="282.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">文件、网页、数据库、模拟用户</text><text x="178" y="222" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" style="paint-order:stroke;stroke-width:4px;stroke-linejoin:round" stroke="#ffffff">设置初始状态</text><text x="282" y="206" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" style="paint-order:stroke;stroke-width:4px;stroke-linejoin:round" stroke="#ffffff">动作</text><text x="366" y="206" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" style="paint-order:stroke;stroke-width:4px;stroke-linejoin:round" stroke="#ffffff">观察</text><text x="580" y="119.23" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">轨迹（transcript）</text><text x="580" y="134.29" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">每一步的输出、工具调用、</text><text x="580" y="148.78" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">推理与中间结果</text><text x="580" y="267.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">结果（outcome）</text><text x="580" y="282.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">试次结束时环境的终态</text><text x="787" y="134" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">评分器</text><text x="787" y="166" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">代码</text><text x="787" y="181" text-anchor="middle" font-size="9.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">快、便宜、可复现</text><text x="787" y="210" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">模型</text><text x="787" y="225" text-anchor="middle" font-size="9.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">灵活，需和人校准</text><text x="787" y="254" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">人工</text><text x="787" y="269" text-anchor="middle" font-size="9.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">质量高，贵且慢</text><text x="700" y="128" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" style="paint-order:stroke;stroke-width:4px;stroke-linejoin:round" stroke="#ffffff">诊断</text><text x="700" y="288" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" style="paint-order:stroke;stroke-width:4px;stroke-linejoin:round" stroke="#ffffff">主要依据</text><text x="666" y="360.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">同一任务跑多次试次，再汇总</text><text x="666" y="375.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">pass@k：k 次至少一次成功 · pass^k：k 次全都成功</text><text x="290" y="356" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" style="paint-order:stroke;stroke-width:4px;stroke-linejoin:round" stroke="#ffffff">换一个任务，或在干净环境里重跑</text></svg>
