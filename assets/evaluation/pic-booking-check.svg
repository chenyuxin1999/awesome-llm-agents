<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" role="img" aria-label="轨迹里说订好了，数据库里查无此单"><rect x="0" y="0" width="900" height="330" fill="#ffffff"/><defs><marker id="ar-p06b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5a6577"/></marker></defs><text x="30.0" y="32.0" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="15" fill="#0e6e7e" font-weight="bold" text-anchor="start" style="white-space:pre">轨迹里说“机票已经订好了”，评分器去查数据库的终态（示意）</text><text x="30.0" y="64.0" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="13" fill="#18202c" font-weight="bold" text-anchor="start" style="white-space:pre">轨迹</text><rect x="30.0" y="74.0" width="330.0" height="34.0" rx="10" fill="#e3eefb" stroke="#78b4eb" stroke-width="1.2"/><text x="42.0" y="96.0" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="12" fill="#18202c" font-weight="normal" text-anchor="start" style="white-space:pre">用户：帮我订 10 月 30 日上海到北京的经济舱</text><rect x="30.0" y="116.0" width="400.0" height="30.0" rx="4" fill="#f2f4f7" stroke="#d5dbe4" stroke-width="1.2"/><text x="40.0" y="136.0" font-family="Menlo, Consolas, DejaVu Sans Mono, Noto Sans CJK SC, monospace" font-size="12" fill="#18202c" font-weight="normal" text-anchor="start" style="white-space:pre">book_flight(date=&quot;10-30&quot;, cabin=&quot;economy&quot;)</text><rect x="30.0" y="152.0" width="400.0" height="30.0" rx="4" fill="#fde8dc" stroke="#e8590c" stroke-width="1.2"/><text x="40.0" y="172.0" font-family="Menlo, Consolas, DejaVu Sans Mono, Noto Sans CJK SC, monospace" font-size="12" fill="#e8590c" font-weight="normal" text-anchor="start" style="white-space:pre">→ error: payment declined</text><rect x="70.0" y="192.0" width="360.0" height="34.0" rx="10" fill="#ece8fa" stroke="#6a4fc4" stroke-width="1.2"/><text x="82.0" y="214.0" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="12" fill="#18202c" font-weight="normal" text-anchor="start" style="white-space:pre">agent：机票已经订好了，祝您旅途愉快！</text><text x="30.0" y="256.0" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="12" fill="#5a6577" font-weight="normal" text-anchor="start" style="white-space:pre">只读轨迹的评分器：看到“订好了”，判通过</text><text x="470.0" y="64.0" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="13" fill="#18202c" font-weight="bold" text-anchor="start" style="white-space:pre">环境终态：bookings 表</text><rect x="470.0" y="74.0" width="400.0" height="30.0" rx="3" fill="#f2f4f7" stroke="#d5dbe4" stroke-width="1.2"/><text x="482.0" y="94.0" font-family="Menlo, Consolas, DejaVu Sans Mono, Noto Sans CJK SC, monospace" font-size="12" fill="#18202c" font-weight="bold" text-anchor="start" style="white-space:pre">user</text><text x="572.0" y="94.0" font-family="Menlo, Consolas, DejaVu Sans Mono, Noto Sans CJK SC, monospace" font-size="12" fill="#18202c" font-weight="bold" text-anchor="start" style="white-space:pre">flight</text><text x="682.0" y="94.0" font-family="Menlo, Consolas, DejaVu Sans Mono, Noto Sans CJK SC, monospace" font-size="12" fill="#18202c" font-weight="bold" text-anchor="start" style="white-space:pre">date</text><text x="772.0" y="94.0" font-family="Menlo, Consolas, DejaVu Sans Mono, Noto Sans CJK SC, monospace" font-size="12" fill="#18202c" font-weight="bold" text-anchor="start" style="white-space:pre">status</text><rect x="470.0" y="104.0" width="400.0" height="30.0" rx="0" fill="#ffffff" stroke="#d5dbe4" stroke-width="1.2"/><text x="482.0" y="124.0" font-family="Menlo, Consolas, DejaVu Sans Mono, Noto Sans CJK SC, monospace" font-size="12" fill="#5a6577" font-weight="normal" text-anchor="start" style="white-space:pre">u_0412</text><text x="572.0" y="124.0" font-family="Menlo, Consolas, DejaVu Sans Mono, Noto Sans CJK SC, monospace" font-size="12" fill="#5a6577" font-weight="normal" text-anchor="start" style="white-space:pre">SHA→PEK</text><text x="682.0" y="124.0" font-family="Menlo, Consolas, DejaVu Sans Mono, Noto Sans CJK SC, monospace" font-size="12" fill="#5a6577" font-weight="normal" text-anchor="start" style="white-space:pre">10-29</text><text x="772.0" y="124.0" font-family="Menlo, Consolas, DejaVu Sans Mono, Noto Sans CJK SC, monospace" font-size="12" fill="#5a6577" font-weight="normal" text-anchor="start" style="white-space:pre">paid</text><rect x="470.0" y="134.0" width="400.0" height="30.0" rx="0" fill="#ffffff" stroke="#d5dbe4" stroke-width="1.2"/><text x="482.0" y="154.0" font-family="Menlo, Consolas, DejaVu Sans Mono, Noto Sans CJK SC, monospace" font-size="12" fill="#5a6577" font-weight="normal" text-anchor="start" style="white-space:pre">u_0877</text><text x="572.0" y="154.0" font-family="Menlo, Consolas, DejaVu Sans Mono, Noto Sans CJK SC, monospace" font-size="12" fill="#5a6577" font-weight="normal" text-anchor="start" style="white-space:pre">CAN→SHA</text><text x="682.0" y="154.0" font-family="Menlo, Consolas, DejaVu Sans Mono, Noto Sans CJK SC, monospace" font-size="12" fill="#5a6577" font-weight="normal" text-anchor="start" style="white-space:pre">10-30</text><text x="772.0" y="154.0" font-family="Menlo, Consolas, DejaVu Sans Mono, Noto Sans CJK SC, monospace" font-size="12" fill="#5a6577" font-weight="normal" text-anchor="start" style="white-space:pre">paid</text><rect x="470.0" y="164.0" width="400.0" height="30.0" rx="0" fill="#ffffff" stroke="#d5dbe4" stroke-width="1.2"/><text x="482.0" y="184.0" font-family="Menlo, Consolas, DejaVu Sans Mono, Noto Sans CJK SC, monospace" font-size="12" fill="#5a6577" font-weight="normal" text-anchor="start" style="white-space:pre">u_1093</text><text x="572.0" y="184.0" font-family="Menlo, Consolas, DejaVu Sans Mono, Noto Sans CJK SC, monospace" font-size="12" fill="#5a6577" font-weight="normal" text-anchor="start" style="white-space:pre">PEK→CTU</text><text x="682.0" y="184.0" font-family="Menlo, Consolas, DejaVu Sans Mono, Noto Sans CJK SC, monospace" font-size="12" fill="#5a6577" font-weight="normal" text-anchor="start" style="white-space:pre">10-31</text><text x="772.0" y="184.0" font-family="Menlo, Consolas, DejaVu Sans Mono, Noto Sans CJK SC, monospace" font-size="12" fill="#5a6577" font-weight="normal" text-anchor="start" style="white-space:pre">refund</text><rect x="470.0" y="196.0" width="400.0" height="30.0" rx="0" fill="#ffffff" stroke="#e8590c" stroke-width="1.2" stroke-dasharray="5 4"/><text x="670.0" y="216.0" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="12" fill="#e8590c" font-weight="normal" text-anchor="middle" style="white-space:pre">没有这位用户 10 月 30 日的订单</text><text x="470.0" y="256.0" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="12" fill="#e8590c" font-weight="bold" text-anchor="start" style="white-space:pre">按终态打分的评分器：查无此单，判不通过</text><rect x="30.0" y="278.0" width="840.0" height="1.0" rx="4" fill="#d5dbe4" stroke="none" stroke-width="1.2"/><text x="30.0" y="306.0" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="12" fill="#18202c" font-weight="normal" text-anchor="start" style="white-space:pre">轨迹里的那句话只是 agent 的说法；评分看数据库，轨迹留着诊断：失败出在支付被拒之后，agent 没有如实告诉用户。</text></svg>
