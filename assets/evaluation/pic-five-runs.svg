<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" role="img" aria-label="三个任务各跑五次时的 pass@5 与 pass^5"><rect x="0" y="0" width="900" height="330" fill="#ffffff"/><defs><marker id="ar-p06c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5a6577"/></marker></defs><text x="30.0" y="32.0" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="15" fill="#0e6e7e" font-weight="bold" text-anchor="start" style="white-space:pre">三个任务各跑 5 次：pass@k 问至少成功一次，pass^k 问每次都成功（示意）</text><text x="266.0" y="66.0" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="12" fill="#5a6577" font-weight="normal" text-anchor="middle" style="white-space:pre">第 1 次</text><text x="330.0" y="66.0" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="12" fill="#5a6577" font-weight="normal" text-anchor="middle" style="white-space:pre">第 2 次</text><text x="394.0" y="66.0" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="12" fill="#5a6577" font-weight="normal" text-anchor="middle" style="white-space:pre">第 3 次</text><text x="458.0" y="66.0" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="12" fill="#5a6577" font-weight="normal" text-anchor="middle" style="white-space:pre">第 4 次</text><text x="522.0" y="66.0" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="12" fill="#5a6577" font-weight="normal" text-anchor="middle" style="white-space:pre">第 5 次</text><text x="600.0" y="66.0" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="12" fill="#5a6577" font-weight="normal" text-anchor="middle" style="white-space:pre">单次成功率</text><text x="705.0" y="66.0" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="12" fill="#5a6577" font-weight=