" style="white-space:pre">✓</text><text x="600.0" y="105.0" font-family="Menlo, Consolas, DejaVu Sans Mono, Noto Sans CJK SC, monospace" font-size="13" fill="#18202c" font-weight="normal" text-anchor="middle" style="white-space:pre">5 / 5 = 1.0</text><rect x="680.0" y="84.0" width="50.0" height="32.0" rx="2" fill="#e3f2e1" stroke="#5aa555" stroke-width="1"/><text x="705.0" y="104.7" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="13" fill="#5aa555" font-weight="bold" text-anchor="middle" style="white-space:pre">过</text><rect x="785.0" y="84.0" width="50.0" height="32.0" rx="2" fill="#e3f2e1" stroke="#5aa555" stroke-width="1"/><text x="810.0" y="104.7" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="13" fill="#5aa555" font-weight="bold" text-anchor="middle" style="white-space:pre">过</text><text x="30.0" y="155.0" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="13" fill="#18202c" font-weight="normal" text-anchor="start" style="white-space:pre">任务 2：改签一张机票</text><rect x="240.0" y="134.0" width="52.0" height="32.0" rx="2" fill="#e3f2e1" stroke="#5aa555" stroke-width="1"/><text x="266.0" y="155.8" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="16" fill="#5aa555" font-weight="bold" text-anchor="middle" style="white-space:pre">✓</text><rect x="304.0" y="134.0" width="52.0" height="32.0" rx="2" fill="#fde8dc" stroke="#e8590c" stroke-width="1"/><text x="330.0" y="155.8" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="16" fill="#e8590c" font-weight="bold" text-anchor="middle" style="white-space:pre">✗</text><rect x="368.0" y="134.0" width="52.0" height="32.0" rx="2" fill="#e3f2e1" stroke="#5aa555" stroke-width="1"/><text x="394.0" y="155.8" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="16" fill="#5aa555" font-weight="bold" text-anchor="middle" style="white-space:pre">✓</text><rect x="432.0" y="134.0" width="52.0" height="32.0" rx="2" fill="#e3f2e1" stroke="#5aa555" stroke-width="1"/><text x="458.0" y="155.8" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="16" fill="#5aa555" font-weight="bold" text-anchor="middle" style="white-space:pre">✓</text><rect x="496.0" y="134.0" width="52.0" height="32.0" rx="2" fill="#fde8dc" stroke="#e8590c" stroke-width="1"/><text x="522.0" y="155.8" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="16" fill="#e8590c" font-weight="bold" text-anchor="middle" style="white-space:pre">✗</text><text x="600.0" y="155.0" font-family="Menlo, Consolas, DejaVu Sans Mono, Noto Sans CJK SC, monospace" font-size="13" fill="#18202c" font-weight="normal" text-anchor="middle" style="white-space:pre">3 / 5 = 0.6</text><rect x="680.0" y="134.0" width="50.0" height="32.0" rx="2" fill="#e3f2e1" stroke="#5aa555" stroke-width="1"/><text x="705.0" y="154.7" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="13" fill="#5aa555" font-weight="bold" text-anchor="middle" style="white-space:pre">过</text><rect x="785.0" y="134.0" width="50.0" height="32.0" rx="2" fill="#fde8dc" stroke="#e8590c" stroke-width="1"/><text x="810.0" y="154.7" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="13" fill="#e8590c" font-weight="bold" text-anchor="middle" style="white-space:pre">不过</text><text x="30.0" y="205.0" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="13" fill="#18202c" font-weight="normal" text-anchor="start" style="white-space:pre">任务 3：取消一笔订单</text><rect x="240.0" y="184.0" width="52.0" height="32.0" rx="2" fill="#fde8dc" stroke="#e8590c" stroke-width="1"/><text x="266.0" y="205.8" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="16" fill="#e8590c" font-weight="bold" text-anchor="middle" style="white-space:pre">✗</text><rect x="304.0" y="184.0" width="52.0" height="32.0" rx="2" fill="#fde8dc" stroke="#e8590c" stroke-width="1"/><text x="330.0" y="205.8" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="16" fill="#e8590c" font-weight="bold" text-anchor="middle" style="white-space:pre">✗</text><rect x="368.0" y="184.0" width="52.0" height="32.0" rx="2" fill="#e3f2e1" stroke="#5aa555" stroke-width="1"/><text x="394.0" y="205.8" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="16" fill="#5aa555" font-weight="bold" text-anchor="middle" style="white-space:pre">✓</text><rect x="432.0" y="184.0" width="52.0" height="32.0" rx="2" fill="#fde8dc" stroke="#e8590c" stroke-width="1"/><text x="458.0" y="205.8" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="16" fill="#e8590c" font-weight="bold" text-anchor="middle" style="white-space:pre">✗</text><rect x="496.0" y="184.0" width="52.0" height="32.0" rx="2" fill="#fde8dc" stroke="#e8590c" stroke-width="1"/><text x="522.0" y="205.8" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="16" fill="#e8590c" font-weight="bold" text-anchor="middle" style="white-space:pre">✗</text><text x="600.0" y="205.0" font-family="Menlo, Consolas, DejaVu Sans Mono, Noto Sans CJK SC, monospace" font-size="13" fill="#18202c" font-weight="normal" text-anchor="middle" style="white-space:pre">1 / 5 = 0.2</text><rect x="680.0" y="184.0" width="50.0" height="32.0" rx="2" fill="#e3f2e1" stroke="#5aa555" stroke-width="1"/><text x="705.0" y="204.7" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="13" fill="#5aa555" font-weight="bold" text-anchor="middle" style="white-space:pre">过</text><rect x="785.0" y="184.0" width="50.0" height="32.0" rx="2" fill="#fde8dc" stroke="#e8590c" stroke-width="1"/><text x="810.0" y="204.7" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="13" fill="#e8590c" font-weight="bold" text-anchor="middle" style="white-space:pre">不过</text><rect x="30.0" y="238.0" width="840.0" height="1.0" rx="4" fill="#d5dbe4" stroke="none" stroke-width="1.2"/><text x="30.0" y="266.0" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="13" fill="#18202c" font-weight="normal" text-anchor="start" style="white-space:pre">平均单次成功率 (1.0 + 0.6 + 0.2) ÷ 3 = 0.6</text><text x="30.0" y="292.0" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="13" fill="#5aa555" font-weight="normal" text-anchor="start" style="white-space:pre">pass@5 = 3 个任务都过 = 100%：只要找到一个好解就行时，看这一列。</text><text x="30.0" y="316.0" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="13" fill="#e8590c" font-weight="normal" text-anchor="start" style="white-space:pre">pass^5 = 只有任务 1 过 = 1/3 ≈ 33%：面对真实客户、每次都得做对时，看这一列。</text></svg>
