<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" role="img" aria-label="带规则与撤掉规则各跑一遍"><rect x="0" y="0" width="900" height="420" fill="#ffffff"/><defs><marker id="ar-p06h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5a6577"/></marker></defs><text x="30.0" y="32.0" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="15" fill="#0e6e7e" font-weight="bold" text-anchor="start" style="white-space:pre">示意：同一个编程任务带着规则跑一遍、撤掉规则再跑一遍，只有违背默认倾向的规则才计分</text><rect x="40.0" y="58.0" width="330.0" height="34.0" rx="3" fill="#f2f4f7" stroke="#d5dbe4" stroke-width="1"/><text x="205.0" y="80.0" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="13" fill="#18202c" font-weight="bold" text-anchor="middle" style="white-space:pre">harness 里写的规则</text><rect x="390.0" y="58.0" width="110.0" height="34.0" rx="3" fill="#f2f4f7" stroke="#d5dbe4" stroke-width="1"/><text x="445.0" y="80.0" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="13" fill="#18202c" font-weight="bold" text-anchor="middle" style="white-space:pre">带规则跑</text><rect x="520.0" y="58.0" width="110.0" height="34.0" rx="3" fill="#f2f4f7" stroke="#d5dbe4" stroke-width="1"/><text x="575.0" y="80.0" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="13" fill="#18202c" font-weight="bold" text-anchor="middle" style="white-space:pre">撤掉规则跑</text><rect x="650.0" y="58.0" width="210.0" height="34.0" rx="3" fill="#f2f4f7" stroke="#d5dbe4" stroke-width="1"/><text x="755.0" y="80.0" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="13" fill="#18202c" font-weight="bold" text-anchor="middle" style="white-space:pre">算不算遵循能力</text><rect x="40.0" y="100.0" width="330.0" height="40.0" rx="3" fill="#ffffff" stroke="#d5dbe4" stroke-width="1"/><text x="54.0" y="