232 L603.8,76.5424 L608,78.137 L612.2,79.9249 L616.4,81.9253 L620.6,84.158 L624.8,86.6432 L629,89.4011 L633.2,92.4514 L637.4,95.8125 L641.6,99.5009 L645.8,103.53 L650,107.911 L654.2,112.648 L658.4,117.741 L662.6,123.182 L666.8,128.958 L671,135.045 L675.2,141.414 L679.4,148.026 L683.6,154.835 L687.8,161.789 L692,168.832 L696.2,175.904 L700.4,182.944 L704.6,189.893 L708.8,196.694 L713,203.295 L717.2,209.651 L721.4,215.725 L725.6,221.485 L729.8,226.91 L734,231.986 L738.2,236.706 L742.4,241.069 L746.6,245.082 L750.8,248.755 L755,252.101 L759.2,255.137 L763.4,257.881 L767.6,260.354 L771.8,262.575 L776,264.565 L780.2,266.343 L784.4,267.929 L788.6,269.34 L792.8,270.594 L797,271.707 L801.2,272.692 L805.4,273.564 L809.6,274.335 L813.8,275.016 L818,275.616 L822.2,276.146 L826.4,276.613 L830.6,277.023 L834.8,277.385 L839,277.703 L843.2,277.983 L847.4,278.229 L851.6,278.445 L855.8,278.635 L860,278.802" fill="none" stroke="#5B45B0" stroke-width="2.2"/><line x1="440" y1="170" x2="694" y2="170" stroke="#0E6E7E" stroke-width="1.2" stroke-dasharray="4 3"/><line x1="694" y1="170" x2="694" y2="280" stroke="#0E6E7E" stroke-width="1.2" stroke-dasharray="4 3"/><rect x="20" y="46" width="330" height="48" rx="5" fill="#E3EBFF" stroke="#2B57C9" stroke-width="1.5"/><rect x="20" y="106" width="330" height="48" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><rect x="20" y="166" width="330" height="48" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="20" y="226" width="330" height="48" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="20" y="286" width="330" height="48" rx="5" fill="#DCEFF1" stroke="#0E6E7E" stroke-width="1.5"/><text x="20" y="24" text-anchor="start" font-size="12" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">用人类完成同一任务所需的时间来衡量任务长度，再找模型成功率跌到 50% 的位置</text><text x="185" y="66.665" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">① 取任务</text><text x="185" y="81.035" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">RE-Bench、HCAST、66 个新写短任务</text><text x="185" y="126.665" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">② 人类专家计时</text><text x="185" y="141.035" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">每个任务的耗时就是它的长度</text><text x="185" y="186.665" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">③ 模型逐题跑</text><text x="185" y="201.035" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">记录每个任务的成败</text><text x="185" y="246.665" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">④ 拟合曲线</text><text x="185" y="261.035" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">成功率随人类耗时变化的逻辑斯蒂曲线</text><text x="185" y="306.665" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">⑤ 读出 50% 处</text><text x="185" y="321.035" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">对应的人类耗时就是时间地平线</text><text x="460" y="298" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">1 分钟</text><text x="538" y="298" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">4 分钟</text><text x="616" y="298" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">15 分钟</text><text x="694" y="298" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">1 小时</text><text x="772" y="298" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">4 小时</text><text x="850" y="298" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">16 小时</text><text x="434" y="284" text-anchor="end" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">0%</text><text x="434" y="174" text-anchor="end" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">50%</text><text x="434" y="64" text-anchor="end" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">100%</text><text x="702" y="162" text-anchor="start" font-size="11" font-weight="600" fill="#0E6E7E" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" style="paint-order:stroke;stroke-width:4px;stroke-linejoin:round" stroke="#ffffff">50% 时间地平线</text><text x="470" y="122" text-anchor="start" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" style="paint-order:stroke;stroke-width:4px;stroke-linejoin:round" stroke="#ffffff">人类不到 4 分钟的任务几乎全对</text><text x="470" y="260" text-anchor="start" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" style="paint-order:stroke;stroke-width:4px;stroke-linejoin:round" stroke="#ffffff">超过 4 小时的任务成功率不到一成</text><text x="650" y="318" text-anchor="middle" font-size="10.5" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">人类专家耗时（对数刻度，曲线为示意）</text><text x="20" y="350" text-anchor="start" font-size="10.5" font-weight="500" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">论文摘要：Claude 3.7 Sonnet 约 50 分钟；2019 年起前沿模型的地平线大约每七个月翻一番</text></svg>
