<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 290" width="640" height="290" role="img" aria-label="RE-Bench：时间预算与得分"><defs><marker id="ah-s5rebench" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6577"/></marker></defs><rect x="0" y="0" width="640" height="290" fill="#ffffff"/><line x1="120" y1="220" x2="600" y2="220" stroke="#18202C" stroke-width="1.2"/><line x1="120" y1="181.364" x2="600" y2="181.364" stroke="#B83560" stroke-width="1.2" stroke-dasharray="4 3"/><rect x="160" y="65.4545" width="70" height="154.545" rx="3" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="320" y="185.227" width="70" height="34.7727" rx="3" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="480" y="200.682" width="70" height="19.3182" rx="3" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><text x="20" y="24" text-anchor="start" font-size="11.5" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">RE-Bench：7 个开放式 AI 研发环境，最好的 agent 与人类专家在相同时间预算下比得分</text><text x="114" y="185.364" text-anchor="end" font-size="10" font-weight="600" fill="#B83560" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">人类 = 1</text><text x="195" y="238" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">2 小时</text><text x="195" y="57.4545" text-anchor="middle" font-size="10.5" font-weight="500" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" style="paint-order:stroke;stroke-width:4px;stroke-linejoin:round" stroke="#ffffff">agent 约为人类的 4 倍</text><text x="355" y="238" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">8 小时</text><text x="355" y="177.227" text-anchor="middle" font-size="10.5" font-weight="500" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" style="paint-order:stroke;stroke-width:4px;stroke-linejoin:round" stroke="#ffffff">人类略胜</text><text x="515" y="238" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">32 小时</text><text x="515" y="192.682" text-anchor="middle" font-size="10.5" font-weight="500" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" style="paint-order:stroke;stroke-width:4px;stroke-linejoin:round" stroke="#ffffff">人类约为 agent 的 2 倍</text><text x="114" y="62" text-anchor="end" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">agent ÷ 人类</text><text x="20" y="270" text-anchor="start" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">柱高按论文摘要的倍数关系画，8 小时一栏只表示“人类略胜”，为示意</text></svg>
