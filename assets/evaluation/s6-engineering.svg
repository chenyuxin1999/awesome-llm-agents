<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360" role="img" aria-label="评测本身成了工程"><defs><marker id="ah-s6engineering" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6577"/></marker></defs><rect x="0" y="0" width="900" height="360" fill="#ffffff"/><line x1="320" y1="40" x2="320" y2="270" stroke="#D5DBE4" stroke-width="1"/><path d="M370,106 L364,133" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-s6engineering)"/><path d="M420,106 L428,133" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-s6engineering)"/><path d="M456,156 L477,156" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-s6engineering)"/><line x1="610" y1="40" x2="610" y2="270" stroke="#D5DBE4" stroke-width="1"/><rect x="20" y="64" width="110" height="52" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="20" y="128" width="110" height="52" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="20" y="192" width="110" height="52" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="336" y="66" width="120" height="40" rx="5" fill="#E3EBFF" stroke="#2B57C9" stroke-width="1.5"/><rect x="336" y="136" width="56" height="40" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><rect x="400" y="136" width="56" height="40" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><rect x="480" y="120" width="110" height="72" rx="5" fill="#FDE8DD" stroke="#C2501A" stroke-width="1.5"/><rect x="626" y="70" width="78" height="36" rx="5" fill="#E9EDF3" stroke="#47546A" stroke-width="1.5"/><rect x="626" y="116" width="78" height="30" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="714" y="70" width="78" height="36" rx="5" fill="#E9EDF3" stroke="#47546A" stroke-width="1.5"/><rect x="714" y="116" width="78" height="30" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="802" y="70" width="78" height="36" rx="5" fill="#E9EDF3" stroke="#47546A" stroke-width="1.5"/><rect x="802" y="116" width="78" height="30" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="626" y="182" width="254" height="52" rx="5" fill="#FDE8DD" stroke="#C2501A" stroke-width="1.5"/><rect x="20" y="284" width="860" height="60" rx="5" fill="#DCEFF1" stroke="#0E6E7E" stroke-width="1.5"/><text x="20" y="24" text-anchor="start" font-size="12" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Anthropic 手册里的三件工程事：选评分器、保任务质量、隔离环境；修好它们，分数可能完全变样</text><text x="20" y="52" text-anchor="start" font-size="12.5" font-weight="700" fill="#26805A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">评分器怎么选</text><text x="75" y="93.565" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">代码评分器</text><text x="140" y="85" text-anchor="start" font-size="10.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">长处：快、便宜、可复现</text><text x="140" y="103" text-anchor="start" font-size="10.5" font-weight="400" fill="#C2501A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">短处：对合理的变体很僵硬</text><text x="75" y="157.565" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">模型评分器</text><text x="140" y="149" text-anchor="start" font-size="10.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">长处：灵活，适合开放任务</text><text x="140" y="167" text-anchor="start" font-size="10.5" font-weight="400" fill="#C2501A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">短处：不确定，要和人工校准</text><text x="75" y="221.565" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">人工评分</text><text x="140" y="213" text-anchor="start" font-size="10.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">长处：质量最高</text><text x="140" y="231" text-anchor="start" font-size="10.5" font-weight="400" fill="#C2501A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">短处：又贵又慢，主要用来校准</text><text x="336" y="52" text-anchor="start" font-size="12.5" font-weight="700" fill="#26805A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">任务本身合不合格</text><text x="396" y="89.41" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">同一个结果</text><text x="364" y="159.255" text-anchor="middle" font-size="10.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">专家甲</text><text x="428" y="159.255" text-anchor="middle" font-size="10.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">专家乙</text><text x="535" y="152.51" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">结论不一致</text><text x="535" y="166.69" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">问题出在任务上</text><text x="336" y="216" text-anchor="start" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">通过率为零，多半说明任务本身坏了</text><text x="626" y="52" text-anchor="start" font-size="12.5" font-weight="700" fill="#26805A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">试次之间要隔离</text><text x="665" y="91.255" text-anchor="middle" font-size="10.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">干净环境</text><text x="665" y="134.255" text-anchor="middle" font-size="10.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">试次 1</text><text x="753" y="91.255" text-anchor="middle" font-size="10.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">干净环境</text><text x="753" y="134.255" text-anchor="middle" font-size="10.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">试次 2</text><text x="841" y="91.255" text-anchor="middle" font-size="10.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">干净环境</text><text x="841" y="134.255" text-anchor="middle" font-size="10.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">试次 3</text><text x="756" y="166" text-anchor="middle" font-size="10.5" font-weight="500" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">每次试次都从干净环境开始</text><text x="753" y="204.51" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">共享状态</text><text x="753" y="218.69" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">失败彼此相关，也会虚高分数</text><text x="450" y="310.32" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">CORE-Bench 的例子：修好评分 bug、放开过紧的框架限制以后</text><text x="450" y="325.19" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">同一个模型的分数从 42% 变成 95%；在有人深入看过细节之前，不把任何分数当真</text></svg>
