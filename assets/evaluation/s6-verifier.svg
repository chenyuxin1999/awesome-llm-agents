<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" role="img" aria-label="验证者法则"><defs><marker id="ah-s6verifier" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6577"/></marker></defs><rect x="0" y="0" width="900" height="330" fill="#ffffff"/><line x1="400" y1="40" x2="400" y2="316" stroke="#D5DBE4" stroke-width="1"/><path d="M440,296 L852,296" fill="none" stroke="#C2501A" stroke-width="1.4" marker-end="url(#ah-s6verifier)"/><rect x="20" y="66" width="110" height="36" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="20" y="112" width="110" height="36" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="20" y="158" width="110" height="36" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="20" y="204" width="110" height="36" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="20" y="250" width="110" height="36" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="440" y="82.5" width="60" height="161.5" rx="3" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="528" y="99.5" width="60" height="144.5" rx="3" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="616" y="142" width="60" height="102" rx="3" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="704" y="193" width="60" height="51" rx="3" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="792" y="218.5" width="60" height="25.5" rx="3" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><text x="20" y="24" text-anchor="start" font-size="12" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">验证者法则：训练 AI 解决一项任务有多容易，取决于这项任务有多容易验证</text><text x="20" y="54" text-anchor="start" font-size="12.5" font-weight="700" fill="#26805A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">可验证性的五条性质</text><text x="75" y="87.41" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">有客观标准</text><text x="140" y="89" text-anchor="start" font-size="10.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">大家对好答案的看法一致</text><text x="75" y="133.41" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">验证快</text><text x="140" y="135" text-anchor="start" font-size="10.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">几秒钟就能检查一个解</text><text x="75" y="179.41" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">能大规模验证</text><text x="140" y="181" text-anchor="start" font-size="10.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">很多解可以同时检查</text><text x="75" y="225.41" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">噪声低</text><text x="140" y="227" text-anchor="start" font-size="10.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">验证结果紧贴解的质量</text><text x="75" y="271.41" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">奖励连续</text><text x="140" y="273" text-anchor="start" font-size="10.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">能给同一题的多个解排序</text><text x="420" y="54" text-anchor="start" font-size="12.5" font-weight="700" fill="#26805A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">能力因此呈锯齿状（示意）</text><text x="470" y="262" text-anchor="middle" font-size="10.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">数独</text><text x="470" y="278" text-anchor="middle" font-size="9.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">难解好验</text><text x="558" y="262" text-anchor="middle" font-size="10.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">代码有测试</text><text x="646" y="262" text-anchor="middle" font-size="10.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">网站能否用</text><text x="646" y="278" text-anchor="middle" font-size="9.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">难写好查</text><text x="734" y="262" text-anchor="middle" font-size="10.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">事实核查</text><text x="734" y="278" text-anchor="middle" font-size="9.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">验比写还难</text><text x="822" y="262" text-anchor="middle" font-size="10.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">开放科研</text><text x="822" y="278" text-anchor="middle" font-size="9.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">慢、贵、有争议</text><text x="660" y="314" text-anchor="middle" font-size="10.5" font-weight="500" fill="#C2501A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">越往右越难验证，进步越慢；柱高为示意</text></svg>
