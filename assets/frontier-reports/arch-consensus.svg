.2</text><text x="765" y="336.19" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">IndexShare：四层共用索引器</text><text x="765" y="383.32" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">DeepSeek-V4.1</text><text x="765" y="398.19" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">CSA2：跨层复用缓存与索引</text><text x="16" y="438" text-anchor="start" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">共同趋势：百万 token 上下文成为标配，大家都在用“少量全局层 ＋ 大量滑窗或压缩层”的办法压低 KV 缓存。</text><text x="16" y="458" text-anchor="start" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">DeepSeek-V4 一栏取自 Hugging Face 对上一代的解读；其余取自各自的报告或首发说明。分栏按本章正文的归类，示意。</text></svg>
