<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360" role="img" aria-label="从操作软件到理解交付目标"><defs><marker id="ah-astraloop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6577"/></marker></defs><rect x="0" y="0" width="900" height="360" fill="#ffffff"/><path d="M292,93 L306,93" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-astraloop)"/><path d="M424,93 L438,93" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-astraloop)"/><path d="M556,93 L570,93" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-astraloop)"/><path d="M146,93 L174,93" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-astraloop)"/><path d="M630,114 L630,136 L234,136 L234,117" fill="none" stroke="#5A6577" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#ah-astraloop)"/><path d="M688,93 L726,93" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-astraloop)"/><line x1="16" y1="206" x2="884" y2="206" stroke="#E2E6EC" stroke-width="1"/><rect x="16" y="60" width="130" height="66" rx="5" fill="#E3EBFF" stroke="#2B57C9" stroke-width="1.5"/><rect x="176" y="72" width="116" height="42" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="308" y="72" width="116" height="42" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="440" y="72" width="116" height="42" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="572" y="72" width="116" height="42" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="728" y="60" width="156" height="66" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="170" y="154" width="540" height="34" rx="5" fill="#E9EDF3" stroke="#47546A" stroke-width="1.5" stroke-dasharray="4 3"/><rect x="16" y="244" width="89.5" height="24" rx="12" fill="#E3EBFF" stroke="#2B57C9" stroke-width="1"/><rect x="206" y="244" width="100" height="24" rx="12" fill="#E3EBFF" stroke="#2B57C9" stroke-width="1"/><rect x="396" y="244" width="142" height="24" rx="12" fill="#E3EBFF" stroke="#2B57C9" stroke-width="1"/><rect x="586" y="244" width="110.5" height="24" rx="12" fill="#E3EBFF" stroke="#2B57C9" stroke-width="1"/><rect x="150" y="280" width="58" height="24" rx="12" fill="#FCE4EC" stroke="#B83560" stroke-width="1"/><rect x="240" y="280" width="58" height="24" rx="12" fill="#FCE4EC" stroke="#B83560" stroke-width="1"/><rect x="330" y="280" width="58" height="24" rx="12" fill="#FCE4EC" stroke="#B83560" stroke-width="1"/><text x="16" y="24" text-anchor="start" font-size="12" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">计算机与浏览器使用：目标通常对应不到某一个按钮（示意）</text><text x="81" y="82.765" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">交付目标</text><text x="81" y="97.135" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">整理记录、做图表、前端</text><text x="81" y="110.935" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">检查</text><text x="234" y="96.565" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">理解界面</text><text x="366" y="96.565" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">选择操作</text><text x="498" y="96.565" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">观察变化</text><text x="630" y="96.565" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">维持多步约束</text><text x="430" y="132" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" style="paint-order:stroke;stroke-width:4px;stroke-linejoin:round" stroke="#ffffff">没达到就再来一轮</text><text x="806" y="89.665" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">可以检查的结果</text><text x="806" y="104.035" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">交付物，而不止文字建议</text><text x="440" y="176" text-anchor="middle" font-size="10.5" font-weight="500" fill="#47546A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">执行框架（harness）也在同一次发布中改进：实际加速是模型与 harness 共同的贡献</text><text x="16" y="230" text-anchor="start" font-size="12" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">后续博客把叙事往前推：知不知道什么样的结果才算把事情做好</text><text x="60.75" y="259.78" text-anchor="middle" font-size="10.5" font-weight="500" fill="#2B57C9" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">材料要能被读懂</text><text x="256" y="259.78" text-anchor="middle" font-size="10.5" font-weight="500" fill="#2B57C9" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">图表要能支撑判断</text><text x="467" y="259.78" text-anchor="middle" font-size="10.5" font-weight="500" fill="#2B57C9" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">修改不能破坏原有业务目的</text><text x="641.25" y="259.78" text-anchor="middle" font-size="10.5" font-weight="500" fill="#2B57C9" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">哪些后果需要先确认</text><text x="16" y="296" text-anchor="start" font-size="12" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">部署系统里的边界</text><text x="179" y="295.78" text-anchor="middle" font-size="10.5" font-weight="500" fill="#B83560" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">授权控制</text><text x="269" y="295.78" text-anchor="middle" font-size="10.5" font-weight="500" fill="#B83560" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">确认策略</text><text x="359" y="295.78" text-anchor="middle" font-size="10.5" font-weight="500" fill="#B83560" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">自动审查</text><text x="16" y="324" text-anchor="start" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">系统卡研究：困难或不可完成的任务是否诱发越界，以及浏览、工具和专业环境中的失效。这些措施降低风险，保证不了模型永不越界。</text><text x="16" y="344" text-anchor="start" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">材料不披露参数规模和完整架构，也不应从能力表现上反推出来。</text></svg>
