<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img" aria-label="从操作软件到理解交付目标"><defs><marker id="ah-astraloop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6577"/></marker></defs><rect x="0" y="0" width="900" height="470" fill="#ffffff"/><path d="M126,93 L168,93" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-astraloop)"/><path d="M270,93 L318,93" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-astraloop)"/><path d="M420,93 L468,93" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-astraloop)"/><path d="M570,93 L618,93" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-astraloop)"/><path d="M720,93 L762,93" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-astraloop)"/><path d="M670,192 L670,212 L220,212 L220,195" fill="none" stroke="#5A6577" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#ah-astraloop)"/><line x1="16" y1="270" x2="884" y2="270" stroke="#E2E6EC" stroke-width="1"/><rect x="16" y="56" width="110" height="74" rx="5" fill="#E3EBFF" stroke="#2B57C9" stroke-width="1.5"/><rect x="170" y="56" width="100" height="74" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="320" y="56" width="100" height="74" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="470" y="56" width="100" height="74" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="620" y="56" width="100" height="74" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="764" y="56" width="120" height="74" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="16" y="138" width="110" height="54" rx="4" fill="#FFFFFF" stroke="#9AA6B8" stroke-width="1" stroke-dasharray="3 3"/><rect x="170" y="138" width="100" height="54" rx="4" fill="#FFFFFF" stroke="#9AA6B8" stroke-width="1" stroke-dasharray="3 3"/><rect x="320" y="138" width="100" height="54" rx="4" fill="#FFFFFF" stroke="#9AA6B8" stroke-width="1" stroke-dasharray="3 3"/><rect x="470" y="138" width="100" height="54" rx="4" fill="#FFFFFF" stroke="#9AA6B8" stroke-width="1" stroke-dasharray="3 3"/><rect x="620" y="138" width="100" height="54" rx="4" fill="#FFFFFF" stroke="#9AA6B8" stroke-width="1" stroke-dasharray="3 3"/><rect x="764" y="138" width="120" height="54" rx="4" fill="#FFFFFF" stroke="#9AA6B8" stroke-width="1" stroke-dasharray="3 3"/><rect x="170" y="226" width="540" height="30" rx="5" fill="#E9EDF3" stroke="#47546A" stroke-width="1.5" stroke-dasharray="4 3"/><rect x="16" y="304" width="207" height="52" rx="5" fill="#E3EBFF" stroke="#2B57C9" stroke-width="1.5"/><rect x="235" y="304" width="207" height="52" rx="5" fill="#E3EBFF" stroke="#2B57C9" stroke-width="1.5"/><rect x="454" y="304" width="207" height="52" rx="5" fill="#E3EBFF" stroke="#2B57C9" stroke-width="1.5"/><rect x="673" y="304" width="207" height="52" rx="5" fill="#E3EBFF" stroke="#2B57C9" stroke-width="1.5"/><rect x="150" y="368" width="232" height="40" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><rect x="394" y="368" width="232" height="40" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><rect x="638" y="368" width="232" height="40" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><text x="16" y="24" text-anchor="start" font-size="12" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">目标：自己操作软件，把一项工作推进到可以检查的结果（示意，例子是把上半年销售额做成柱状图）</text><text x="71" y="89.665" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">交付目标</text><text x="71" y="104.035" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">把销售记录做成图表</text><text x="220" y="82.765" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">理解界面</text><text x="220" y="97.135" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">认出表格在哪、菜</text><text x="220" y="110.935" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">单里有什么</text><text x="370" y="82.765" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">选择操作</text><text x="370" y="97.135" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">选中数据列，点“</text><text x="370" y="110.935" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">插入图表”</text><text x="520" y="82.765" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">观察变化</text><text x="520" y="97.135" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">新截图里出现了一</text><text x="520" y="110.935" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">张图</text><text x="670" y="82.765" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">维持多步约束</text><text x="670" y="97.135" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">核对坐标轴，原数</text><text x="670" y="110.935" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">据没被改动</text><text x="148" y="87" text-anchor="middle" font-size="9.5" font-weight="500" fill="#0E6E7E" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" style="paint-order:stroke;stroke-width:4px;stroke-linejoin:round" stroke="#ffffff">任务要求</text><text x="295" y="87" text-anchor="middle" font-size="9.5" font-weight="500" fill="#0E6E7E" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" style="paint-order:stroke;stroke-width:4px;stroke-linejoin:round" stroke="#ffffff">界面内容</text><text x="445" y="87" text-anchor="middle" font-size="9.5" font-weight="500" fill="#0E6E7E" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" style="paint-order:stroke;stroke-width:4px;stroke-linejoin:round" stroke="#ffffff">一次点击</text><text x="595" y="87" text-anchor="middle" font-size="9.5" font-weight="500" fill="#0E6E7E" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" style="paint-order:stroke;stroke-width:4px;stroke-linejoin:round" stroke="#ffffff">新的截图</text><text x="742" y="87" text-anchor="middle" font-size="9.5" font-weight="500" fill="#0E6E7E" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" style="paint-order:stroke;stroke-width:4px;stroke-linejoin:round" stroke="#ffffff">成品图表</text><text x="824" y="89.665" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">可以检查的结果</text><text x="824" y="104.035" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">交付物，不止文字建议</text><text x="22" y="151" text-anchor="start" font-size="9" font-weight="700" fill="#0E6E7E" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">例</text><text x="77" y="156" text-anchor="middle" font-size="9.6" font-weight="500" fill="#1F2937" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">sales.xlsx 里</text><text x="77" y="169" text-anchor="middle" font-size="9.6" font-weight="500" fill="#1F2937" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">1–6 月销售额</text><text x="77" y="182" text-anchor="middle" font-size="9.6" font-weight="500" fill="#1F2937" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">做成柱状图</text><text x="176" y="151" text-anchor="start" font-size="9" font-weight="700" fill="#0E6E7E" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">例</text><text x="226" y="162.5" text-anchor="middle" font-size="9.6" font-weight="500" fill="#1F2937" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">A1:B7 是数据，</text><text x="226" y="175.5" text-anchor="middle" font-size="9.6" font-weight="500" fill="#1F2937" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">菜单栏有“插入”</text><text x="326" y="151" text-anchor="start" font-size="9" font-weight="700" fill="#0E6E7E" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">例</text><text x="376" y="162.5" text-anchor="middle" font-size="9.6" font-weight="500" fill="#1F2937" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">选中 A1:B7，</text><text x="376" y="175.5" text-anchor="middle" font-size="9.6" font-weight="500" fill="#1F2937" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">点“插入→柱状图”</text><text x="476" y="151" text-anchor="start" font-size="9" font-weight="700" fill="#0E6E7E" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">例</text><text x="526" y="162.5" text-anchor="middle" font-size="9.6" font-weight="500" fill="#1F2937" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">出现 6 根柱子，</text><text x="526" y="175.5" text-anchor="middle" font-size="9.6" font-weight="500" fill="#1F2937" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">纵轴 0–120 万</text><text x="626" y="151" text-anchor="start" font-size="9" font-weight="700" fill="#0E6E7E" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">例</text><text x="676" y="162.5" text-anchor="middle" font-size="9.6" font-weight="500" fill="#1F2937" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">3 月柱高 86 万</text><text x="676" y="175.5" text-anchor="middle" font-size="9.6" font-weight="500" fill="#1F2937" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">和原表一致</text><text x="770" y="151" text-anchor="start" font-size="9" font-weight="700" fill="#0E6E7E" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">例</text><text x="830" y="162.5" text-anchor="middle" font-size="9.6" font-weight="500" fill="#1F2937" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">chart.png，</text><text x="830" y="175.5" text-anchor="middle" font-size="9.6" font-weight="500" fill="#1F2937" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">sales.xlsx 未改动</text><text x="445" y="208" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" style="paint-order:stroke;stroke-width:4px;stroke-linejoin:round" stroke="#ffffff">图不对：带着新截图回去重新看界面</text><text x="440" y="246" text-anchor="middle" font-size="10.5" font-weight="500" fill="#47546A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">执行框架（harness）也在同一次发布中改进：实际加速是模型与 harness 共同的贡献</text><text x="16" y="292" text-anchor="start" font-size="12" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">后续博客把叙事往前推：知不知道什么样的结果才算把事情做好（每条配一个这张图表上的例子）</text><text x="119.5" y="326.648" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">材料要能被读懂</text><text x="119.5" y="340.628" text-anchor="middle" font-size="9.8" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">标题写明“1–6 月销售额（万元）”</text><text x="338.5" y="326.648" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">图表要能支撑判断</text><text x="338.5" y="340.628" text-anchor="middle" font-size="9.8" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">柱状图看得出 3 月最低</text><text x="557.5" y="326.648" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">修改不能破坏原有业务目的</text><text x="557.5" y="340.628" text-anchor="middle" font-size="9.8" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">原表的公式和格式都保留</text><text x="776.5" y="326.648" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">哪些后果需要先确认</text><text x="776.5" y="340.628" text-anchor="middle" font-size="9.8" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">要发给全组前，先问用户</text><text x="16" y="384" text-anchor="start" font-size="12" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">部署系统里的边界</text><text x="266" y="391.255" text-anchor="middle" font-size="10.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">授权控制：只许读写 sales 文件夹</text><text x="510" y="391.255" text-anchor="middle" font-size="10.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">确认策略：发邮件前先停下来问</text><text x="754" y="391.255" text-anchor="middle" font-size="10.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">自动审查：删除文件的动作先拦下</text><text x="16" y="436" text-anchor="start" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">系统卡研究：困难或不可完成的任务是否诱发越界，以及浏览、工具和专业环境中的失效。这些措施降低风险，保证不了模型永不越界。</text><text x="16" y="456" text-anchor="start" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">材料不披露参数规模和完整架构，也不应从能力表现上反推出来。文件名、单元格和数字都是示意。</text></svg>
