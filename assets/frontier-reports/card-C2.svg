805A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">运行与部署</text><text x="347.5" y="78.5" text-anchor="middle" font-size="10" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">在几档思考长度下分别比</text><text x="347.5" y="93.5" text-anchor="middle" font-size="10" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">较；缓存与持续上下文；</text><text x="347.5" y="108.5" text-anchor="middle" font-size="10" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">另加安全干预</text><text x="423" y="42" text-anchor="start" font-size="10" font-weight="600" fill="#B83560" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">发布材料</text><text x="482.5" y="93.5" text-anchor="middle" font-size="10" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">发布博客、系统卡</text><text x="280" y="148" text-anchor="middle" font-size="10.5" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">同一个底层模型，换一套安全措施和访问方式，测出的行为就可能不同</text></svg>
