<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 261" width="560" height="261" role="img" aria-label="RLVR 与 GRPO 结构"><defs><marker id="ah-cardp1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6577"/></marker></defs><rect x="0" y="0" width="560" height="261" fill="#ffffff"/><path d="M109.5,73 L156.5,73" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-cardp1)"/><path d="M255,73 L302,73" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-cardp1)"/><path d="M400.5,73 L447.5,73" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-cardp1)"/><path d="M498.25,197 L498.25,219 L207.25,219 L207.25,200" fill="none" stroke="#5A6577" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#ah-cardp1)"/><rect x="14" y="34" width="95.5" height="78" rx="5" fill="#E3EBFF" stroke="#2B57C9" stroke-width="1.5"/><rect x="159.5" y="34" width="95.5" height="78" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="305" y="34" width="95.5" height="78" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="450.5" y="34" width="95.5" height="78" rx="5" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.5"/><rect x="14" y="122" width="95.5" height="75" rx="4" fill="#F3F5F8" stroke="#D5DBE4" stroke-width="1.1" stroke-dasharray="4 3"/><rect x="159.5" y="122" width="95.5" height="75" rx="4" fill="#F3F5F8" stroke="#D5DBE4" stroke-width="1.1" stroke-dasharray="4 3"/><rect x="305" y="122" width="95.5" height="75" rx="4" fill="#F3F5F8" stroke="#D5DBE4" stroke-width="1.1" stroke-dasharray="4 3"/><rect x="450.5" y="122" width="95.5" height="75" rx="4" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.1" stroke-dasharray="4 3"/><text x="14" y="20" text-anchor="start" font-size="11" font-weight="700" fill="#0E6E7E" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">P1</text><text x="38.08" y="20" text-anchor="start" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">目标：不靠人写的推理示范，让模型自己学会把题做对</text><text x="61.75" y="62.765" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">出一道题</text><text x="61.75" y="77.135" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">算 17 × 24 等于</text><text x="61.75" y="90.935" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">几</text><text x="207.25" y="62.765" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">采样一组回答</text><text x="207.25" y="77.135" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">同一个模型写出 4</text><text x="207.25" y="90.935" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">个回答</text><text x="134.5" y="67" text-anchor="middle" font-size="9.5" font-weight="500" fill="#0E6E7E" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" style="paint-order:stroke;stroke-width:4px;stroke-linejoin:round" stroke="#ffffff">一道题</text><text x="352.75" y="62.765" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">程序核对答案</text><text x="352.75" y="77.135" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">答 408 得 1 分，</text><text x="352.75" y="90.935" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">其余得 0 分</text><text x="280" y="67" text-anchor="middle" font-size="9.5" font-weight="500" fill="#0E6E7E" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" style="paint-order:stroke;stroke-width:4px;stroke-linejoin:round" stroke="#ffffff">4 个回答</text><text x="498.25" y="62.765" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">和组内平均比</text><text x="498.25" y="77.135" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">平均 0.5，高的加</text><text x="498.25" y="90.935" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">强、低的削弱</text><text x="425.5" y="67" text-anchor="middle" font-size="9.5" font-weight="500" fill="#0E6E7E" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" style="paint-order:stroke;stroke-width:4px;stroke-linejoin:round" stroke="#ffffff">1,1,0,0 分</text><text x="61.75" y="137" text-anchor="middle" font-size="9.5" font-weight="600" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">这一步不训练</text><text x="207.25" y="137" text-anchor="middle" font-size="9.5" font-weight="600" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">这一步不训练</text><text x="352.75" y="137" text-anchor="middle" font-size="9.5" font-weight="600" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">这一步不训练</text><text x="498.25" y="137" text-anchor="middle" font-size="9.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">信号：自己的分减组</text><text x="498.25" y="150" text-anchor="middle" font-size="9.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">内平均 0.5；分数来</text><text x="498.25" y="163" text-anchor="middle" font-size="9.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">自程序比对 408</text><text x="498.25" y="176" text-anchor="middle" font-size="9.5" font-weight="600" fill="#0E6E7E" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">目标：高于平均的回</text><text x="498.25" y="189" text-anchor="middle" font-size="9.5" font-weight="600" fill="#0E6E7E" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">答以后更常被写出</text><text x="352.75" y="214" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" style="paint-order:stroke;stroke-width:4px;stroke-linejoin:round" stroke="#ffffff">更新后的模型去答下一批题</text><text x="280" y="251" text-anchor="middle" font-size="10.5" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">DeepSeek-R1 只靠能自动核对的奖励，就学会了自我检查和调整策略</text></svg>
