<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 231" width="560" height="231" role="img" aria-label="带 critic 的 PPO 结构"><defs><marker id="ah-cardp2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6577"/></marker></defs><rect x="0" y="0" width="560" height="231" fill="#ffffff"/><path d="M127.5,73 L150.5,73" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-cardp2)"/><path d="M267,73 L290,73" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-cardp2)"/><path d="M406.5,73 L429.5,73" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-cardp2)"/><rect x="14" y="34" width="113.5" height="78" rx="5" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.5"/><rect x="153.5" y="34" width="113.5" height="78" rx="5" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.5"/><rect x="293" y="34" width="113.5" height="78" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="432.5" y="34" width="113.5" height="78" rx="5" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.5"/><rect x="14" y="122" width="113.5" height="75" rx="4" fill="#F3F5F8" stroke="#D5DBE4" stroke-width="1.1" stroke-dasharray="4 3"/><rect x="153.5" y="122" width="113.5" height="75" rx="4" fill="#F3F5F8" stroke="#D5DBE4" stroke-width="1.1" stroke-dasharray="4 3"/><rect x="293" y="122" width="113.5" height="75" rx="4" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.1" stroke-dasharray="4 3"/><rect x="432.5" y="122" width="113.5" height="75" rx="4" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.1" stroke-dasharray="4 3"/><text x="14" y="20" text-anchor="start" font-size="11" font-weight="700" fill="#0E6E7E" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">P2</text><text x="70.75" y="62.765" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">跑一条长任务</text><text x="70.75" y="77.135" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">百万 token 的上下文</text><text x="70.75" y="90.935" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">里接连调用工具</text><text x="210.25" y="62.765" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">压缩时切成几段</text><text x="210.25" y="77.135" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">上下文压缩把轨迹切</text><text x="210.25" y="90.935" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">开，每段都拿来训练</text><text x="349.75" y="54.83" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">另一个网络逐</text><text x="349.75" y="70.7" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">token 估分</text><text x="349.75" y="85.07" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">估计写完这个 token</text><text x="349.75" y="98.87" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">后还能拿到多少奖励</text><text x="489.25" y="62.765" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">按 token 算损失</text><text x="489.25" y="77.135" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">用 token 级的损失处</text><text x="489.25" y="90.935" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">理各段长短不一</text><text x="70.75" y="137" text-anchor="middle" font-size="9.5" font-weight="600" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">这一步不训练</text><text x="210.25" y="137" text-anchor="middle" font-size="9.5" font-weight="600" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">这一步不训练</text><text x="349.75" y="137" text-anchor="middle" font-size="9.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">信号：任务环境最后给</text><text x="349.75" y="150" text-anchor="middle" font-size="9.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">的奖励（推断，博客未</text><text x="349.75" y="163" text-anchor="middle" font-size="9.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">写）</text><text x="349.75" y="176" text-anchor="middle" font-size="9.5" font-weight="600" fill="#0E6E7E" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">目标：估准每个 token</text><text x="349.75" y="189" text-anchor="middle" font-size="9.5" font-weight="600" fill="#0E6E7E" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">之后还能拿多少奖励</text><text x="489.25" y="137" text-anchor="middle" font-size="9.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">信号：估分网络给每个</text><text x="489.25" y="150" text-anchor="middle" font-size="9.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">token 的分</text><text x="489.25" y="163" text-anchor="middle" font-size="9.5" font-weight="600" fill="#0E6E7E" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">目标：估分高的 token</text><text x="489.25" y="176" text-anchor="middle" font-size="9.5" font-weight="600" fill="#0E6E7E" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">以后更常被写出</text><text x="280" y="221" text-anchor="middle" font-size="10.5" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">GLM-5.2 让一条长轨迹里的每一步都拿到自己的学习信号，代价是多训练一个估分网络</text></svg>
