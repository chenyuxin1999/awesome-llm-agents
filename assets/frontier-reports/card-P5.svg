<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 146" width="560" height="146" role="img" aria-label="推理强度分档结构"><defs><marker id="ah-cardp5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6577"/></marker></defs><rect x="0" y="0" width="560" height="146" fill="#ffffff"/><path d="M127.5,73 L150.5,73" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-cardp5)"/><path d="M267,73 L290,73" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-cardp5)"/><path d="M406.5,73 L429.5,73" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-cardp5)"/><rect x="14" y="34" width="113.5" height="78" rx="5" fill="#E3EBFF" stroke="#2B57C9" stroke-width="1.5"/><rect x="153.5" y="34" width="113.5" height="78" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="293" y="34" width="113.5" height="78" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="432.5" y="34" width="113.5" height="78" rx="5" fill="#E3EBFF" stroke="#2B57C9" stroke-width="1.5"/><text x="14" y="20" text-anchor="start" font-size="11" font-weight="700" fill="#0E6E7E" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">P5</text><text x="70.75" y="69.665" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">同一个任务</text><text x="70.75" y="84.035" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">交给同一个模型</text><text x="210.25" y="62.765" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">选一档思考长度</text><text x="210.25" y="77.135" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">低、中、高几档，档</text><text x="210.25" y="90.935" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">位越高想得越久</text><text x="349.75" y="62.765" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">按预算组织解题</text><text x="349.75" y="77.135" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">简单步骤用低档，复</text><text x="349.75" y="90.935" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">杂阶段接着往下想</text><text x="489.25" y="54.83" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">比完整任务的总投</text><text x="489.25" y="70.7" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">入</text><text x="489.25" y="85.07" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">看完成没有，也看总</text><text x="489.25" y="98.87" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">共花了多少计算</text><text x="280" y="136" text-anchor="middle" font-size="10.5" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Kimi K3 让几档强度一起参与训练与评价，最长的推理不再是唯一的解题方式</text></svg>
