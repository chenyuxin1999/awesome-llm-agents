font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">2026 年 1 月以来平均 4 个月，</text><text x="440" y="154" text-anchor="start" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">ECI 差 8 分</text><text x="440" y="182" text-anchor="start" font-size="11" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Lambert，K3 点评，2026-07</text><text x="440" y="198" text-anchor="start" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">由此前争论的 6 到 9 个月缩到约</text><text x="440" y="212" text-anchor="start" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">3 到 5 个月</text><text x="825" y="228" text-anchor="middle" font-size="9.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">此前争论的 6 到 9 个月</text><text x="440" y="240" text-anchor="start" font-size="11" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Lambert，阅读清单，2026-09</text><text x="440" y="256" text-anchor="start" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">大约 4 到 6 个月</text><text x="440" y="326" text-anchor="start" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">口径不同（指数、时间点、是否估计），数字不完全一致；</text><text x="440" y="344" text-anchor="start" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">方向一致：开放模型稳定地跟在前沿几个月之后。</text></svg>
