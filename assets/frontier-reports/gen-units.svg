idth="1"/><rect x="520" y="184" width="18" height="18" rx="2" fill="#F6F7F9" stroke="#9AA3B2" stroke-width="1"/><rect x="190" y="214" width="18" height="18" rx="2" fill="#F6F7F9" stroke="#9AA3B2" stroke-width="1"/><rect x="212" y="214" width="18" height="18" rx="2" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1"/><rect x="234" y="214" width="18" height="18" rx="2" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1"/><rect x="256" y="214" width="18" height="18" rx="2" fill="#F6F7F9" stroke="#9AA3B2" stroke-width="1"/><rect x="278" y="214" width="18" height="18" rx="2" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1"/><rect x="300" y="214" width="18" height="18" rx="2" fill="#F6F7F9" stroke="#9AA3B2" stroke-width="1"/><rect x="322" y="214" width="18" height="18" rx="2" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1"/><rect x="344" y="214" width="18" height="18" rx="2" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1"/><rect x="366" y="214" width="18" height="18" rx="2" fill="#F6F7F9" stroke="#9AA3B2" stroke-width="1"/><rect x="388" y="214" width="18" height="18" rx="2" fill="#F6F7F9" stroke="#9AA3B2" stroke-width="1"/><rect x="410" y="214" width="18" height="18" rx="2" fill="#F6F7F9" stroke="#9AA3B2" stroke-width="1"/><rect x="432" y="214" width="18" height="18" rx="2" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1"/><rect x="454" y="214" width="18" height="18" rx="2" fill="#F6F7F9" stroke="#9AA3B2" stroke-width="1"/><rect x="476" y="214" width="18" height="18" rx="2" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1"/><rect x="498" y="214" width="18" height="18" rx="2" fill="#F6F7F9" stroke="#9AA3B2" stroke-width="1"/><rect x="520" y="214" width="18" height="18" rx="2" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1"/><rect x="190" y="244" width="18" height="18" rx="2" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1"/><rect x="212" y="244" width="18" height="18" rx="2" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1"/><rect x="234" y="244" width="18" height="18" rx="2" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1"/><rect x="256" y="244" width="18" height="18" rx="2" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1"/><rect x="278" y="244" width="18" height="18" rx="2" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1"/><rect x="300" y="244" width="18" height="18" rx="2" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1"/><rect x="322" y="244" width="18" height="18" rx="2" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1"/><rect x="344" y="244" width="18" height="18" rx="2" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1"/><rect x="366" y="244" width="18" height="18" rx="2" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1"/><rect x="388" y="244" width="18" height="18" rx="2" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1"/><rect x="410" y="244" width="18" height="18" rx="2" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1"/><rect x="432" y="244" width="18" height="18" rx="2" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1"/><rect x="454" y="244" width="18" height="18" rx="2" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1"/><rect x="476" y="244" width="18" height="18" rx="2" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1"/><rect x="498" y="244" width="18" height="18" rx="2" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1"/><rect x="520" y="244" width="18" height="18" rx="2" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1"/><text x="16" y="44" text-anchor="start" font-size="12.5" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">自回归</text><text x="16" y="62" text-anchor="start" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">一次前向一个 token</text><text x="397" y="30" text-anchor="middle" font-size="10" font-weight="600" fill="#2B57C9" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">新</text><text x="560" y="50" text-anchor="start" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">主干七年来几乎没变（Raschka）</text><text x="16" y="118" text-anchor="start" font-size="12.5" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">NCP-ArchPreview</text><text x="16" y="136" text-anchor="start" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">token 之外再预测概念</text><text x="496" y="110" text-anchor="middle" font-size="9.5" font-weight="600" fill="#B83560" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">下一个概念</text><text x="560" y="106" text-anchor="start" font-size="10.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">从隐藏状态构造离散概念词表，联合训练下一 token 与下一概念预测，</text><text x="560" y="121.225" text-anchor="start" font-size="10.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">再把概念反馈给生成。改的是训练目标和表示。</text><text x="16" y="196" text-anchor="start" font-size="12.5" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">DiffusionGemma</text><text x="16" y="214" text-anchor="start" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">整块并行细化</text><text x="182" y="197" text-anchor="end" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">第 1 步</text><text x="182" y="227" text-anchor="end" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">第 2 步</text><text x="182" y="257" text-anchor="end" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">最后</text><text x="366" y="286" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">一个块（报告中为 256 个 token）</text><text x="560" y="190" text-anchor="start" font-size="10.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">从自回归模型出发，经监督去噪、强化学习和采样器蒸馏转换而来。</text><text x="560" y="205.225" text-anchor="start" font-size="10.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">改的是生成过程的并行组织方式。</text><text x="560" y="246" text-anchor="start" font-size="10.5" font-weight="400" fill="#5B45B0" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">报告：平均每次前向约生成 20 个 token，单张 H100 上约每秒</text><text x="560" y="261.225" text-anchor="start" font-size="10.5" font-weight="400" fill="#5B45B0" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">1500 个输出 token。</text><text x="16" y="330" text-anchor="start" font-size="12" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">两种口径别混用</text><text x="16" y="354" text-anchor="start" font-size="10.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">NCP：用 OLMo-3-7B 总训练 token 的 51.3% 达到它最终的预训练损失（比的是数据量）；</text><text x="16" y="374" text-anchor="start" font-size="10.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">用 85% 的标准计算量接近严格参数匹配的 8.9B 基线的训练损失（比的是计算，“接近”不能改写成相同）。</text><text x="16" y="400" text-anchor="start" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">DiffusionGemma 的速度要连同块大小、首字等待、任务质量和设备一起读；长输出上的高吞吐推不出交互式工具调用会更灵敏。</text></svg>
