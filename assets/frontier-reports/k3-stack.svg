troke="#26805A" stroke-width="1.5"/><text x="16" y="24" text-anchor="start" font-size="12" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">结构上同时照顾两个方向的信息传递（示意）</text><text x="56" y="249" text-anchor="end" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">第 1 层</text><text x="56" y="191" text-anchor="end" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">第 2 层</text><text x="56" y="133" text-anchor="end" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">第 3 层</text><text x="56" y="75" text-anchor="end" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">更深</text><text x="209" y="298" text-anchor="middle" font-size="10.5" font-weight="600" fill="#5B45B0" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">序列方向：Kimi Delta Attention 组织长历史</text><text x="432" y="110" text-anchor="start" font-size="10.5" font-weight="600" fill="#B86E00" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">深度方向：</text><text x="432" y="126" text-anchor="start" font-size="10.5" font-weight="600" fill="#B86E00" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Attention Residuals</text><text x="432" y="142" text-anchor="start" font-size="10.5" font-weight="400" fill="#B86E00" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">改变跨层信息汇合的方式</text><text x="572" y="62" text-anchor="start" font-size="12" font-weight="700" fill="#5B45B0" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">结构</text><text x="572" y="84" text-anchor="start" font-size="10" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">2.8T 总参数的专家混合，每 token 激活 104B</text><text x="572" y="101" text-anchor="start" font-size="10" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Stable LatentMoE：896 个路由专家激活 16 个</text><text x="572" y="118" text-anchor="start" font-size="10" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">原生视觉，百万 token 上下文</text><text x="572" y="166" text-anchor="start" font-size="12" font-weight="700" fill="#B86E00" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">后训练</text><text x="572" y="188" text-anchor="start" font-size="10" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">监督微调、强化学习、多教师在策略蒸馏</text><text x="572" y="205" text-anchor="start" font-size="10" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">通用、编码、Agent 三类任务混合训练</text><text x="572" y="222" text-anchor="start" font-size="10" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">多档推理强度同时参与训练和评价</text><text x="572" y="270" text-anchor="start" font-size="12" font-weight="700" fill="#26805A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">基础设施</text><text x="572" y="292" text-anchor="start" font-size="10" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">百万 token 的 Agent 强化学习，</text><text x="572" y="309" text-anchor="start" font-size="10" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">rollout 与沙箱状态持续保存</text><text x="572" y="326" text-anchor="start" font-size="10" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">推理侧：前缀缓存与请求调度</text><text x="16" y="372" text-anchor="start" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">报告称相对 K2 约有 2.5 倍的整体扩展效率。Lambert 提醒：训练算力、数据和推理需求外界几乎测不到，这类效率说法更适合当作作者的自述。</text><text x="16" y="392" text-anchor="start" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">左图只画出两种信息流的方向，层数、token 数和连接方式都是示意。</text></svg>
