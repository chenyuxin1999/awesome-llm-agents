60" width="13" height="13" rx="2" fill="#F6F7F9" stroke="#9AA3B2" stroke-width="1"/><rect x="232" y="360" width="13" height="13" rx="2" fill="#F6F7F9" stroke="#9AA3B2" stroke-width="1"/><rect x="248" y="360" width="13" height="13" rx="2" fill="#F6F7F9" stroke="#9AA3B2" stroke-width="1"/><rect x="264" y="360" width="13" height="13" rx="2" fill="#F6F7F9" stroke="#9AA3B2" stroke-width="1"/><rect x="280" y="360" width="13" height="13" rx="2" fill="#F6F7F9" stroke="#9AA3B2" stroke-width="1"/><rect x="296" y="360" width="13" height="13" rx="2" fill="#F6F7F9" stroke="#9AA3B2" stroke-width="1"/><rect x="312" y="360" width="13" height="13" rx="2" fill="#F6F7F9" stroke="#9AA3B2" stroke-width="1"/><rect x="328" y="360" width="13" height="13" rx="2" fill="#F6F7F9" stroke="#9AA3B2" stroke-width="1"/><rect x="344" y="360" width="13" height="13" rx="2" fill="#F6F7F9" stroke="#9AA3B2" stroke-width="1"/><rect x="360" y="360" width="13" height="13" rx="2" fill="#F6F7F9" stroke="#9AA3B2" stroke-width="1"/><rect x="376" y="360" width="13" height="13" rx="2" fill="#F6F7F9" stroke="#9AA3B2" stroke-width="1"/><rect x="392" y="360" width="13" height="13" rx="2" fill="#F6F7F9" stroke="#9AA3B2" stroke-width="1"/><rect x="408" y="360" width="13" height="13" rx="2" fill="#F6F7F9" stroke="#9AA3B2" stroke-width="1"/><rect x="424" y="360" width="13" height="13" rx="2" fill="#F6F7F9" stroke="#9AA3B2" stroke-width="1"/><rect x="440" y="360" width="13" height="13" rx="2" fill="#F6F7F9" stroke="#9AA3B2" stroke-width="1"/><rect x="456" y="360" width="13" height="13" rx="2" fill="#F6F7F9" stroke="#9AA3B2" stroke-width="1"/><rect x="472" y="360" width="13" height="13" rx="2" fill="#F6F7F9" stroke="#9AA3B2" stroke-width="1"/><rect x="488" y="360" width="13" height="13" rx="2" fill="#F6F7F9" stroke="#9AA3B2" stroke-width="1"/><rect x="504" y="360" width="13" height="13" rx="2" fill="#F6F7F9" stroke="#9AA3B2" stroke-width="1"/><rect x="520" y="360" width="13" height="13" rx="2" fill="#F6F7F9" stroke="#9AA3B2" stroke-width="1"/><rect x="536" y="360" width="13" height="13" rx="2" fill="#F6F7F9" stroke="#9AA3B2" stroke-width="1"/><rect x="556" y="356" width="34" height="22" rx="3" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="598" y="360" width="13" height="13" rx="2" fill="#E3EBFF" stroke="#2B57C9" stroke-width="1.5"/><text x="16" y="24" text-anchor="start" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">每生成一个新 token（蓝），注意力都要回看前面 token 的键和值；这些键值存在缓存里，长度越长缓存越大</text><text x="16" y="66" text-anchor="start" font-size="12" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">全注意力</text><text x="16" y="84" text-anchor="start" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">缓存随长度一直增长</text><text x="622" y="66" text-anchor="start" font-size="10.5" font-weight="400" fill="#C2501A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">长度 1M 时，存与读都很贵</text><text x="16" y="132" text-anchor="start" font-size="12" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">压缩表示</text><text x="16" y="150" text-anchor="start" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">每份状态变小</text><text x="622" y="126" text-anchor="start" font-size="10.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">MLA、DeepSeek-V4 的 KV 压缩、FP4 低精度存储</text><text x="622" y="144" text-anchor="start" font-size="10.5" font-weight="400" fill="#C2501A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">代价：使用时多一步投影或解压计算</text><text x="16" y="212" text-anchor="start" font-size="12" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">只留窗口</text><text x="16" y="230" text-anchor="start" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">多数层只看最近一段</text><text x="622" y="206" text-anchor="start" font-size="10.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Gemma 3、Inkling、Beam（窗口 512 token）</text><text x="622" y="224" text-anchor="start" font-size="10.5" font-weight="400" fill="#C2501A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">代价：远处信息只能经由少数全局层传递</text><text x="16" y="292" text-anchor="start" font-size="12" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">先挑再算</text><text x="16" y="310" text-anchor="start" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">索引器挑出 top-k</text><text x="622" y="286" text-anchor="start" font-size="10.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">DeepSeek 稀疏注意力、GLM-5.2 IndexShare</text><text x="622" y="304" text-anchor="start" font-size="10.5" font-weight="400" fill="#C2501A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">代价：索引器本身要计算，挑漏了就丢信息</text><text x="16" y="372" text-anchor="start" font-size="12" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">定长状态</text><text x="16" y="390" text-anchor="start" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">不再逐个存键值</text><text x="573" y="371" text-anchor="middle" font-size="10" font-weight="600" fill="#5B45B0" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">状态</text><text x="200" y="398" text-anchor="start" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">历史压进一个大小固定的状态，每来一个 token 更新一次</text><text x="622" y="366" text-anchor="start" font-size="10.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Qwen3-Next、Kimi Linear、Kimi K3 的 KDA</text><text x="622" y="384" text-anchor="start" font-size="10.5" font-weight="400" fill="#C2501A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">代价：定长状态是压缩过的，所以混合保留部分全注意力</text><text x="622" y="399" text-anchor="start" font-size="10.5" font-weight="400" fill="#C2501A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">层</text><text x="200" y="112" text-anchor="start" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">灰色：不参与这一步计算或不再保存</text><text x="16" y="456" text-anchor="start" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">示意图：方块数量只表示相对大小。2026 年的报告多是混合使用，例如 Beam 用 43 层滑窗配 9 层全局，Qwen3.8 用 Gated DeltaNet 配全局注意力。</text></svg>
