<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 370" width="900" height="370" role="img" aria-label="长任务的成本由哪些环节决定"><defs><marker id="ah-longtaskcost" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6577"/></marker></defs><rect x="0" y="0" width="900" height="370" fill="#ffffff"/><path d="M83,176 L83,204 L450,204 L450,226" fill="none" stroke="#9AA3B2" stroke-width="1.4" marker-end="url(#ah-longtaskcost)"/><path d="M229,176 L229,204 L450,204 L450,226" fill="none" stroke="#9AA3B2" stroke-width="1.4" marker-end="url(#ah-longtaskcost)"/><path d="M375,176 L375,204 L450,204 L450,226" fill="none" stroke="#9AA3B2" stroke-width="1.4" marker-end="url(#ah-longtaskcost)"/><path d="M521,176 L521,204 L450,204 L450,226" fill="none" stroke="#9AA3B2" stroke-width="1.4" marker-end="url(#ah-longtaskcost)"/><path d="M667,176 L667,204 L450,204 L450,226" fill="none" stroke="#9AA3B2" stroke-width="1.4" marker-end="url(#ah-longtaskcost)"/><path d="M813,176 L813,204 L450,204 L450,226" fill="none" stroke="#9AA3B2" stroke-width="1.4" marker-end="url(#ah-longtaskcost)"/><rect x="16" y="120" width="134" height="56" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="162" y="120" width="134" height="56" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="308" y="120" width="134" height="56" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="454" y="120" width="134" height="56" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="600" y="120" width="134" height="56" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="746" y="120" width="134" height="56" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="250" y="228" width="400" height="50" rx="5" fill="#E3EBFF" stroke="#2B57C9" stroke-width="1.5"/><rect x="16" y="44" width="420" height="52" rx="5" fill="#DCEFF1" stroke="#0E6E7E" stroke-width="1.5"/><rect x="464" y="44" width="420" height="52" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><rect x="16" y="112" width="134" height="5" rx="2" fill="#B83560"/><rect x="162" y="112" width="134" height="5" rx="2" fill="#B83560"/><rect x="308" y="112" width="134" height="5" rx="2" fill="#0E6E7E"/><rect x="454" y="112" width="65" height="5" rx="2" fill="#0E6E7E"/><rect x="522" y="112" width="65" height="5" rx="2" fill="#B83560"/><rect x="600" y="112" width="134" height="5" rx="2" fill="#B83560"/><text x="16" y="24" text-anchor="start" font-size="12" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">长程 Agent 的成本由几个环节一起决定，单价只是其中之一</text><text x="83" y="144.665" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">服务计算</text><text x="83" y="159.035" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">单次调用多贵</text><text x="229" y="144.665" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">任务用的 token 数</text><text x="229" y="159.035" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">行动路径多长</text><text x="375" y="144.665" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">预填充</text><text x="375" y="159.035" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">反复读上下文</text><text x="521" y="144.665" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">缓存读取</text><text x="521" y="159.035" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">存与取多贵</text><text x="667" y="144.665" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">生成速度</text><text x="667" y="159.035" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">等多久</text><text x="813" y="144.665" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">重做次数</text><text x="813" y="159.035" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">不断返工就占不到便宜</text><text x="450" y="249.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">完整任务的总投入</text><text x="450" y="264.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">比较时保留任务质量和完成率：最快的输出未必是最好的表现</text><text x="226" y="66.32" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">开放路线：DeepSeek-V4.1</text><text x="226" y="81.19" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">从缓存和预填充入手（4.1.4）</text><text x="674" y="66.32" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">闭源路线：Claude Opus 5.5</text><text x="674" y="81.19" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">从服务和行动路径入手；材料同时讨论缓存读取与生成速度</text><text x="16" y="306" text-anchor="start" font-size="10.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">两条路线在“让长任务用得起”这件事上走到了一起。更短、更有效的行动路径，还能把模型侧的节省进一步放大。</text><text x="16" y="328" text-anchor="start" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Opus 5.5 的材料还把更清楚的沟通当作协作能力：重要信息前置、长任务进展更容易跟踪，直接影响人检查的成本。</text><text x="16" y="350" text-anchor="start" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">方框上沿的色条表示两条路线各自讨论或着力的环节，按本章正文归纳，示意。</text></svg>
