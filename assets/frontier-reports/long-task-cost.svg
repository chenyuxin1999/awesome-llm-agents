<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="900" height="440" role="img" aria-label="长任务的成本由哪些环节决定"><defs><marker id="ah-longtaskcost" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6577"/></marker></defs><rect x="0" y="0" width="900" height="440" fill="#ffffff"/><path d="M83,228 L83,250 L450,250 L450,270" fill="none" stroke="#9AA3B2" stroke-width="1.4" marker-end="url(#ah-longtaskcost)"/><path d="M229,228 L229,250 L450,250 L450,270" fill="none" stroke="#9AA3B2" stroke-width="1.4" marker-end="url(#ah-longtaskcost)"/><path d="M375,228 L375,250 L450,250 L450,270" fill="none" stroke="#9AA3B2" stroke-width="1.4" marker-end="url(#ah-longtaskcost)"/><path d="M521,228 L521,250 L450,250 L450,270" fill="none" stroke="#9AA3B2" stroke-width="1.4" marker-end="url(#ah-longtaskcost)"/><path d="M667,228 L667,250 L450,250 L450,270" fill="none" stroke="#9AA3B2" stroke-width="1.4" marker-end="url(#ah-longtaskcost)"/><path d="M813,228 L813,250 L450,250 L450,270" fill="none" stroke="#9AA3B2" stroke-width="1.4" marker-end="url(#ah-longtaskcost)"/><rect x="16" y="120" width="134" height="56" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="16" y="184" width="134" height="44" rx="4" fill="#FFFFFF" stroke="#9AA6B8" stroke-width="1" stroke-dasharray="3 3"/><rect x="162" y="120" width="134" height="56" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="162" y="184" width="134" height="44" rx="4" fill="#FFFFFF" stroke="#9AA6B8" stroke-width="1" stroke-dasharray="3 3"/><rect x="308" y="120" width="134" height="56" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="308" y="184" width="134" height="44" rx="4" fill="#FFFFFF" stroke="#9AA6B8" stroke-width="1" stroke-dasharray="3 3"/><rect x="454" y="120" width="134" height="56" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="454" y="184" width="134" height="44" rx="4" fill="#FFFFFF" stroke="#9AA6B8" stroke-width="1" stroke-dasharray="3 3"/><rect x="600" y="120" width="134" height="56" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="600" y="184" width="134" height="44" rx="4" fill="#FFFFFF" stroke="#9AA6B8" stroke-width="1" stroke-dasharray="3 3"/><rect x="746" y="120" width="134" height="56" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="746" y="184" width="134" height="44" rx="4" fill="#FFFFFF" stroke="#9AA6B8" stroke-width="1" stroke-dasharray="3 3"/><rect x="230" y="272" width="440" height="62" rx="5" fill="#E3EBFF" stroke="#2B57C9" stroke-width="1.5"/><rect x="16" y="44" width="420" height="52" rx="5" fill="#DCEFF1" stroke="#0E6E7E" stroke-width="1.5"/><rect x="464" y="44" width="420" height="52" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><rect x="16" y="112" width="134" height="5" rx="2" fill="#B83560"/><rect x="162" y="112" width="134" height="5" rx="2" fill="#B83560"/><rect x="308" y="112" width="134" height="5" rx="2" fill="#0E6E7E"/><rect x="454" y="112" width="65" height="5" rx="2" fill="#0E6E7E"/><rect x="522" y="112" width="65" height="5" rx="2" fill="#B83560"/><rect x="600" y="112" width="134" height="5" rx="2" fill="#B83560"/><text x="16" y="24" text-anchor="start" font-size="12" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">长程 Agent 的成本由几个环节一起决定，单价只是其中之一（例：修一个仓库里的 bug，数字都是示意）</text><text x="83" y="144.665" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">服务计算</text><text x="83" y="159.035" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">单次调用多贵</text><text x="22" y="197" text-anchor="start" font-size="9" font-weight="700" fill="#0E6E7E" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">例</text><text x="89" y="203.5" text-anchor="middle" font-size="9.6" font-weight="500" fill="#1F2937" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">输入每百万</text><text x="89" y="216.5" text-anchor="middle" font-size="9.6" font-weight="500" fill="#1F2937" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">token 3 美元</text><text x="229" y="144.665" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">任务用的 token 数</text><text x="229" y="159.035" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">行动路径多长</text><text x="168" y="197" text-anchor="start" font-size="9" font-weight="700" fill="#0E6E7E" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">例</text><text x="235" y="203.5" text-anchor="middle" font-size="9.6" font-weight="500" fill="#1F2937" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">50 轮，共读</text><text x="235" y="216.5" text-anchor="middle" font-size="9.6" font-weight="500" fill="#1F2937" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">150 万、写 3 万</text><text x="375" y="144.665" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">预填充</text><text x="375" y="159.035" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">反复读上下文</text><text x="314" y="197" text-anchor="start" font-size="9" font-weight="700" fill="#0E6E7E" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">例</text><text x="381" y="203.5" text-anchor="middle" font-size="9.6" font-weight="500" fill="#1F2937" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">每轮重读</text><text x="381" y="216.5" text-anchor="middle" font-size="9.6" font-weight="500" fill="#1F2937" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">3 万 token</text><text x="521" y="144.665" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">缓存读取</text><text x="521" y="159.035" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">存与取多贵</text><text x="460" y="197" text-anchor="start" font-size="9" font-weight="700" fill="#0E6E7E" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">例</text><text x="527" y="203.5" text-anchor="middle" font-size="9.6" font-weight="500" fill="#1F2937" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">九成命中，</text><text x="527" y="216.5" text-anchor="middle" font-size="9.6" font-weight="500" fill="#1F2937" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">价钱打一折</text><text x="667" y="144.665" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">生成速度</text><text x="667" y="159.035" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">等多久</text><text x="606" y="197" text-anchor="start" font-size="9" font-weight="700" fill="#0E6E7E" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">例</text><text x="673" y="203.5" text-anchor="middle" font-size="9.6" font-weight="500" fill="#1F2937" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">每秒 60 token，</text><text x="673" y="216.5" text-anchor="middle" font-size="9.6" font-weight="500" fill="#1F2937" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">写完等 9 分钟</text><text x="813" y="144.665" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">重做次数</text><text x="813" y="159.035" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">不断返工就占不到便宜</text><text x="752" y="197" text-anchor="start" font-size="9" font-weight="700" fill="#0E6E7E" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">例</text><text x="819" y="203.5" text-anchor="middle" font-size="9.6" font-weight="500" fill="#1F2937" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">测试没过重跑</text><text x="819" y="216.5" text-anchor="middle" font-size="9.6" font-weight="500" fill="#1F2937" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">1 次，全部翻倍</text><text x="450" y="292.92" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">完整任务的总投入</text><text x="450" y="307.48" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">比较时保留任务质量和完成率：最快的输出未必是最好的表现</text><text x="450" y="321.28" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">例：一次约 1.3 美元、9 分钟；重跑一次后约 2.7 美元、18 分钟，测试通过</text><text x="226" y="66.32" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">开放路线：DeepSeek-V4.1</text><text x="226" y="81.19" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">从缓存和预填充入手（4.1.4）</text><text x="674" y="66.32" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">闭源路线：Claude Opus 5.5</text><text x="674" y="81.19" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">从服务和行动路径入手；材料同时讨论缓存读取与生成速度</text><text x="16" y="362" text-anchor="start" font-size="10.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">两条路线在“让长任务用得起”这件事上走到了一起。更短、更有效的行动路径，还能把模型侧的节省进一步放大。</text><text x="16" y="384" text-anchor="start" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Opus 5.5 的材料还把更清楚的沟通当作协作能力：重要信息前置、长任务进展更容易跟踪，直接影响人检查的成本。</text><text x="16" y="406" text-anchor="start" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">方框上沿的色条表示两条路线各自讨论或着力的环节，按本章正文归纳，示意。</text><text x="16" y="428" text-anchor="start" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">例子的算法：150 万输入里 135 万走缓存（0.3 美元/百万）、15 万不走（3 美元/百万），3 万输出按 15 美元/百万计，一次约 1.3 美元。</text></svg>
