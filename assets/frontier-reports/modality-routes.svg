<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 416" width="900" height="416" role="img" aria-label="技术报告文体向专门领域扩散"><defs><marker id="ah-modalityroutes" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6577"/></marker></defs><rect x="0" y="0" width="900" height="416" fill="#ffffff"/><path d="M316,87 L344,87" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-modalityroutes)"/><path d="M730,87 L762,87" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-modalityroutes)"/><path d="M316,141 L344,141" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-modalityroutes)"/><path d="M730,141 L762,141" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-modalityroutes)"/><path d="M316,195 L344,195" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-modalityroutes)"/><path d="M730,195 L762,195" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-modalityroutes)"/><path d="M316,249 L344,249" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-modalityroutes)"/><path d="M730,249 L762,249" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-modalityroutes)"/><path d="M316,303 L344,303" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-modalityroutes)"/><path d="M730,303 L762,303" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-modalityroutes)"/><path d="M316,357 L344,357" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-modalityroutes)"/><path d="M730,357 L762,357" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-modalityroutes)"/><rect x="16" y="64" width="300" height="46" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="346" y="64" width="384" height="46" rx="5" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1"/><rect x="772.4" y="75" width="35.2" height="24" rx="12" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1"/><rect x="16" y="118" width="300" height="46" rx="5" fill="#E3EBFF" stroke="#2B57C9" stroke-width="1.5"/><rect x="346" y="118" width="384" height="46" rx="5" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1"/><rect x="772.4" y="129" width="35.2" height="24" rx="12" fill="#E3EBFF" stroke="#2B57C9" stroke-width="1"/><rect x="16" y="172" width="300" height="46" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="346" y="172" width="384" height="46" rx="5" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1"/><rect x="772.4" y="183" width="35.2" height="24" rx="12" fill="#DDF3E8" stroke="#26805A" stroke-width="1"/><rect x="16" y="226" width="300" height="46" rx="5" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.5"/><rect x="346" y="226" width="384" height="46" rx="5" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1"/><rect x="772.4" y="237" width="35.2" height="24" rx="12" fill="#FFF1DC" stroke="#B86E00" stroke-width="1"/><rect x="16" y="280" width="300" height="46" rx="5" fill="#E9EDF3" stroke="#47546A" stroke-width="1.5"/><rect x="346" y="280" width="384" height="46" rx="5" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1"/><rect x="772.4" y="291" width="35.2" height="24" rx="12" fill="#E9EDF3" stroke="#47546A" stroke-width="1"/><rect x="16" y="334" width="300" height="46" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><rect x="346" y="334" width="384" height="46" rx="5" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1"/><rect x="772.4" y="345" width="35.2" height="24" rx="12" fill="#FCE4EC" stroke="#B83560" stroke-width="1"/><text x="16" y="24" text-anchor="start" font-size="12" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">每个专门领域都有自己的经典起点和自己的新约束；读报告要回到相应的技术路线上</text><text x="170" y="52" text-anchor="middle" font-size="11" font-weight="600" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">经典起点</text><text x="470" y="52" text-anchor="middle" font-size="11" font-weight="600" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">今天多出来的约束</text><text x="790" y="52" text-anchor="middle" font-size="11" font-weight="600" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">本章分支</text><text x="166" y="83.51" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Raschka 列出的实验性替代路线</text><text x="166" y="97.69" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">文本生成单位</text><text x="358" y="84" text-anchor="start" font-size="10.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">一 token 接一 token 之外，能不能换一个生成单位</text><text x="790" y="91.32" text-anchor="middle" font-size="12" font-weight="700" fill="#5B45B0" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">4.2</text><text x="166" y="137.51" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Flamingo（2022）</text><text x="166" y="151.69" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">视觉接到语言生成</text><text x="358" y="138" text-anchor="start" font-size="10.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">该保留哪些细节：笔画版面、对象语义，还是可比较的向量</text><text x="790" y="145.32" text-anchor="middle" font-size="12" font-weight="700" fill="#2B57C9" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">4.3</text><text x="166" y="191.51" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">wav2vec 2.0（2020）</text><text x="166" y="205.69" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">自监督语音表示</text><text x="358" y="192" text-anchor="start" font-size="10.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">输入持续到达，证据不完整时就要决定要不要回应</text><text x="790" y="199.32" text-anchor="middle" font-size="12" font-weight="700" fill="#26805A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">4.4</text><text x="166" y="245.51" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">High Fidelity Neural Audio Compression（2022）</text><text x="166" y="259.69" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">神经音频编码</text><text x="358" y="246" text-anchor="start" font-size="10.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">离散 token 还是连续表示；音质、时长、可编辑性</text><text x="790" y="253.32" text-anchor="middle" font-size="12" font-weight="700" fill="#B86E00" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">4.5</text><text x="166" y="299.51" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">TabPFN（2022）</text><text x="166" y="313.69" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">小型表格上的上下文学习</text><text x="358" y="300" text-anchor="start" font-size="10.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">复杂特征、回归、长上下文、更多推理模式；传统基线很强</text><text x="790" y="307.32" text-anchor="middle" font-size="12" font-weight="700" fill="#47546A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">4.6</text><text x="166" y="353.51" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Meta System Cards（2022）</text><text x="166" y="367.69" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">系统由多个模型与非 AI 组件组成</text><text x="358" y="354" text-anchor="start" font-size="10.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">流量分配、实验周期、在线反馈</text><text x="790" y="361.32" text-anchor="middle" font-size="12" font-weight="700" fill="#B83560" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">4.7</text><text x="16" y="404" text-anchor="start" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">“前沿”的含义比参数变大要宽：把某类任务的状态、时序或工程约束真正纳入模型，同样是前沿。</text></svg>
