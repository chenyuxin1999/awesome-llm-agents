2.5 段，一段一组编号</text><text x="750" y="124.025" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">（StepAudio 3 Gen 的设定）</text><text x="750" y="205.399" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">生成时怎么用</text><text x="750" y="220.259" text-anchor="middle" font-size="10.3" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">主干沿时间方向一段段预测第 1 层编号；</text><text x="750" y="234.473" text-anchor="middle" font-size="10.3" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">一个轻量 Transformer 补齐其余 15 层；</text><text x="750" y="248.687" text-anchor="middle" font-size="10.3" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">编号再还原成声音</text><text x="750" y="322" text-anchor="middle" font-size="10.3" font-weight="600" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">编码只是查表找最近，这一步不训练</text><text x="750" y="374" text-anchor="middle" font-size="10.3" font-weight="700" fill="#B86E00" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">推断：主干的训练信号</text><text x="750" y="392" text-anchor="middle" font-size="10.3" font-weight="500" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">真实音频编出的编号就是答案，</text><text x="750" y="410" text-anchor="middle" font-size="10.3" font-weight="500" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">目标是猜对下一段的第 1 层编号</text><text x="750" y="428" text-anchor="middle" font-size="10.3" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">（摘要没写损失）</text></svg>
