<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" role="img" aria-label="Qwen3.8：开放权重与托管服务要分开看"><defs><marker id="ah-qwenweightsservice" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6577"/></marker></defs><rect x="0" y="0" width="900" height="330" fill="#ffffff"/><path d="M396,92 L452,92" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-qwenweightsservice)"/><line x1="16" y1="240" x2="884" y2="240" stroke="#E2E6EC" stroke-width="1"/><rect x="16" y="20" width="380" height="200" rx="6" fill="#F1FAFB" stroke="#0E6E7E" stroke-width="1.5"/><rect x="30" y="60" width="112" height="64" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="150" y="60" width="112" height="64" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="270" y="60" width="112" height="64" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="454" y="20" width="430" height="200" rx="6" fill="#FFF7FA" stroke="#B83560" stroke-width="1.5"/><rect x="468" y="60" width="120" height="40" rx="5" fill="#DCEFF1" stroke="#0E6E7E" stroke-width="1.5"/><rect x="600" y="60" width="130" height="40" rx="5" fill="#F6F7F9" stroke="#9AA3B2" stroke-width="1.5" stroke-dasharray="4 3"/><rect x="740" y="60" width="130" height="40" rx="5" fill="#F6F7F9" stroke="#9AA3B2" stroke-width="1.5" stroke-dasharray="4 3"/><rect x="600" y="108" width="130" height="40" rx="5" fill="#F6F7F9" stroke="#9AA3B2" stroke-width="1.5" stroke-dasharray="4 3"/><rect x="740" y="108" width="130" height="40" rx="5" fill="#F6F7F9" stroke="#9AA3B2" stroke-width="1.5" stroke-dasharray="4 3"/><text x="30" y="44" text-anchor="start" font-size="12" font-weight="700" fill="#0E6E7E" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">开放权重：Qwen3.8-2.4T-A95B</text><text x="86" y="88.51" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Gated DeltaNet</text><text x="86" y="102.69" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">序列信息更新</text><text x="206" y="88.51" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">全局注意力</text><text x="206" y="102.69" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">跨位置交互</text><text x="326" y="88.51" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">稀疏专家</text><text x="326" y="102.69" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">只让部分参数参与</text><text x="30" y="150" text-anchor="start" font-size="10.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">容量与计算组织一起扩展：长序列和大容量不必依赖每一步都执行全部参数。</text><text x="30" y="165.225" text-anchor="start" font-size="10.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">这是“专家混合 ＋ 高效注意力”收敛路线的又一个例子。</text><text x="468" y="44" text-anchor="start" font-size="12" font-weight="700" fill="#B83560" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Qwen3.8-Max 托管服务</text><text x="528" y="83.41" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">开放模型</text><text x="665" y="83.41" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">视觉输入</text><text x="805" y="83.41" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">非思考模式</text><text x="665" y="131.41" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">默认长上下文</text><text x="805" y="131.41" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">内置工具</text><text x="468" y="176" text-anchor="start" font-size="10.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">服务基于开放模型；虚线框是服务额外提供的配置，下载权重之后未必自动具备同一套</text><text x="468" y="191.225" text-anchor="start" font-size="10.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">接口。</text><text x="16" y="264" text-anchor="start" font-size="12" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">系列接口：推理投入可调，历史轮次的推理上下文可以保留</text><text x="16" y="288" text-anchor="start" font-size="10.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">好处：计算预算和任务阶段相匹配，简单步骤不必总用最高投入，复杂阶段可以沿已有进度继续。</text><text x="16" y="308" text-anchor="start" font-size="10.5" font-weight="400" fill="#C2501A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">代价：保留更多历史，也要管理已经失效的假设和过时的约束；历史越长，状态未必越准确。</text></svg>
