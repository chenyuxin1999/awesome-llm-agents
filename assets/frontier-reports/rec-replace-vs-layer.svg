stroke-width="1.5"/><rect x="710" y="44" width="104" height="36" rx="5" fill="#E9EDF3" stroke="#47546A" stroke-width="1.5"/><rect x="840" y="44" width="44" height="36" rx="5" fill="#E3EBFF" stroke="#2B57C9" stroke-width="1.5"/><rect x="16" y="100" width="426" height="150" rx="6" fill="#F7F5FE" stroke="#5B45B0" stroke-width="1.5"/><rect x="30" y="136" width="190" height="46" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="236" y="136" width="192" height="46" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="236" y="194" width="192" height="40" rx="5" fill="#F6F7F9" stroke="#9AA3B2" stroke-width="1.5" stroke-dasharray="4 3"/><rect x="458" y="100" width="426" height="150" rx="6" fill="#FFF7FA" stroke="#B83560" stroke-width="1.5"/><rect x="472" y="136" width="92" height="40" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><rect x="574" y="136" width="92" height="40" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><rect x="676" y="136" width="92" height="40" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><rect x="778" y="136" width="92" height="40" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><rect x="16" y="266" width="426" height="132" rx="6" fill="#FFFAF1" stroke="#B86E00" stroke-width="1.5"/><rect x="458" y="266" width="426" height="132" rx="6" fill="#F3FBF7" stroke="#26805A" stroke-width="1.5"/><rect x="472" y="302" width="120" height="34" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="604" y="302" width="120" height="34" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="736" y="302" width="120" height="34" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="466" y="296" width="404" height="46" rx="6" fill="none" stroke="#47546A" stroke-width="1.2" stroke-dasharray="4 3"/><text x="16" y="24" text-anchor="start" font-size="12" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">线上推荐从来不是一个模型：召回、排序、过滤、缓存和业务规则一起工作</text><text x="282" y="65.565" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">召回</text><text x="402" y="65.565" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">粗排</text><text x="522" y="65.565" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">精排</text><text x="642" y="65.565" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">重排与过滤</text><text x="762" y="65.565" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">业务规则</text><text x="16" y="66" text-anchor="start" font-size="11.5" font-weight="700" fill="#47546A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">原有级联链路</text><text x="862" y="65.41" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">用户</text><text x="30" y="122" text-anchor="start" font-size="12" font-weight="700" fill="#5B45B0" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Sona：用一个模型替换</text><text x="125" y="155.51" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">共享的用户表示</text><text x="125" y="169.69" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">编码用户的行为序列</text><text x="332" y="155.51" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">候选生成 ＋ 排序</text><text x="332" y="169.69" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">同一个模型两个出口</text><text x="332" y="210.7" text-anchor="middle" font-size="10.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">教师排序模型</text><text x="332" y="224.19" text-anchor="middle" font-size="9.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">只在训练时提供目标</text><text x="30" y="206" text-anchor="start" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">服务时不再保留教师</text><text x="472" y="122" text-anchor="start" font-size="12" font-weight="700" fill="#B83560" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">DREAM：保留链路，上面加控制层</text><text x="518" y="159.41" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">意图感知</text><text x="620" y="159.41" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">策略推理</text><text x="722" y="159.41" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">参数下发</text><text x="824" y="159.41" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">反馈</text><text x="472" y="210" text-anchor="start" font-size="10.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">可以审计的策略层；参数经统一出口下发到原有排序与重排，不替换链路里的模型。</text><text x="30" y="288" text-anchor="start" font-size="12" font-weight="700" fill="#B86E00" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">RecGPT-V3：让语言模型理解用户</text><text x="30" y="312" text-anchor="start" font-size="10.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">记忆枢纽：不必每次重读完整的用户历史</text><text x="30" y="334" text-anchor="start" font-size="10.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">文本标签与语义 ID 联合表示：减少标签到物品的信息损失</text><text x="30" y="356" text-anchor="start" font-size="10.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">潜在意图推理：把冗长的推理压成可学习的潜在 token</text><text x="472" y="288" text-anchor="start" font-size="12" font-weight="700" fill="#26805A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">PILOT：管理在线的树状实验</text><text x="532" y="322.41" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">实验管理</text><text x="664" y="322.41" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">搜索规划</text><text x="796" y="322.41" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">记忆整理</text><text x="472" y="362" text-anchor="start" font-size="10.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">外围的确定性服务限定合法命令、统计边界和权限：安全边界写在模型之外。</text><text x="16" y="424" text-anchor="start" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">比较时看增量收益和维护成本；完整替换和附加控制的指标不能直接相减。</text><text x="16" y="444" text-anchor="start" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">这些在线结果绑定在具体的产品、流量和业务指标上，不能当成任何平台都能拿到的通用提升幅度。</text></svg>
