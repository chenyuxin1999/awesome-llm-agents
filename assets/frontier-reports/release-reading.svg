serif">系统卡</text><text x="620" y="63.5" text-anchor="start" font-size="10.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">攻击场景、对手能力、失败判据、部署措施对正常任务</text><text x="620" y="78.5" text-anchor="start" font-size="10.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">的影响</text><text x="199.368" y="127.78" text-anchor="middle" font-size="10.5" font-weight="500" fill="#B83560" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">GPT-5.6</text><text x="277.653" y="127.78" text-anchor="middle" font-size="10.5" font-weight="500" fill="#B83560" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Laguna S 2.1</text><text x="374.365" y="127.78" text-anchor="middle" font-size="10.5" font-weight="500" fill="#B83560" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Muse Spark 1.1</text><text x="499.532" y="127.78" text-anchor="middle" font-size="10.5" font-weight="500" fill="#B83560" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Fable 5.1 与 Mythos 5.1</text><text x="200.102" y="153.78" text-anchor="middle" font-size="10.5" font-weight="500" fill="#B83560" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Opus 5.5</text><text x="284.793" y="153.78" text-anchor="middle" font-size="10.5" font-weight="500" fill="#B83560" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Gemini 4 Argon</text><text x="86" y="143" text-anchor="middle" font-size="12" font-weight="700" fill="#B83560" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">版本入口</text><text x="620" y="135.5" text-anchor="start" font-size="10.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">先定面向的任务和调用方式，再追后续报告里的结构、</text><text x="620" y="150.5" text-anchor="start" font-size="10.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">训练与评测</text><text x="217.06" y="205.78" text-anchor="middle" font-size="10.5" font-weight="500" fill="#0E6E7E" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">GLM-5.3-Flash</text><text x="307.998" y="205.78" text-anchor="middle" font-size="10.5" font-weight="500" fill="#0E6E7E" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">K2 Horizon</text><text x="86" y="215" text-anchor="middle" font-size="12" font-weight="700" fill="#0E6E7E" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">成本与开放</text><text x="620" y="207.5" text-anchor="start" font-size="10.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">任务质量、运行成本、可获取的组件和许可条件放在一</text><text x="620" y="222.5" text-anchor="start" font-size="10.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">起</text><text x="205.3" y="271.78" text-anchor="middle" font-size="10.5" font-weight="500" fill="#2B57C9" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Pangram 4</text><text x="279.07" y="271.78" text-anchor="middle" font-size="10.5" font-weight="500" fill="#2B57C9" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">SWE-1.7</text><text x="361.765" y="271.78" text-anchor="middle" font-size="10.5" font-weight="500" fill="#2B57C9" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Muse Glimmer</text><text x="86" y="281" text-anchor="middle" font-size="12" font-weight="700" fill="#2B57C9" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">专门任务与端侧</text><text x="620" y="273.5" text-anchor="start" font-size="10.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">先弄清任务、运行环境和可检查的产物，再找能对照的</text><text x="620" y="288.5" text-anchor="start" font-size="10.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">报告</text><text x="244.57" y="337.78" text-anchor="middle" font-size="10.5" font-weight="500" fill="#26805A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">MiMo-V2.5 全流程推理优化</text><text x="385.173" y="337.78" text-anchor="middle" font-size="10.5" font-weight="500" fill="#26805A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">ABot-C0 四足机器人</text><text x="86" y="347" text-anchor="middle" font-size="12" font-weight="700" fill="#26805A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">部署与非语言报告</text><text x="620" y="347" text-anchor="start" font-size="10.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">逐项区分数据生成、模型设计、真实运行三类证据</text><text x="16" y="398" text-anchor="start" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">通用模型的发布沿两条线比较：版本演进（同一系列在能力、效率和交互方式上的变化）与任务定位（通用、专门、端侧）。</text><text x="16" y="418" text-anchor="start" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">系统卡的名字本身不代表通过了某种独立的安全认证；它适合用来检查作者披露了哪些评价和风险边界。</text></svg>
