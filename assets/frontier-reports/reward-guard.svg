<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" role="img" aria-label="GLM-5.2 怎样拦截奖励投机"><defs><marker id="ah-rewardguard" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6577"/></marker></defs><rect x="0" y="0" width="900" height="400" fill="#ffffff"/><line x1="16" y1="74" x2="884" y2="74" stroke="#E2E6EC" stroke-width="1"/><path d="M156,148 L184,148" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-rewardguard)"/><path d="M346,148 L374,148" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-rewardguard)"/><path d="M536,148 L566,148" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-rewardguard)"/><path d="M646,148 L690,148" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-rewardguard)"/><path d="M606,174 L606,214 L300,214 L300,236" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-rewardguard)"/><path d="M788,184 L788,236" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-rewardguard)"/><rect x="16" y="36" width="121" height="24" rx="12" fill="#FDE8DD" stroke="#C2501A" stroke-width="1"/><rect x="147" y="36" width="121" height="24" rx="12" fill="#FDE8DD" stroke="#C2501A" stroke-width="1"/><rect x="278" y="36" width="182.845" height="24" rx="12" fill="#FDE8DD" stroke="#C2501A" stroke-width="1"/><rect x="470.845" y="36" width="247" height="24" rx="12" fill="#FDE8DD" stroke="#C2501A" stroke-width="1"/><rect x="16" y="118" width="140" height="60" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="186" y="118" width="160" height="60" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="376" y="118" width="160" height="60" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><polygon points="606,122 646,148 606,174 566,148" fill="#FDE8DD" stroke="#C2501A" stroke-width="1.5"/><rect x="692" y="112" width="192" height="72" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><rect x="200" y="238" width="200" height="50" rx="5" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1.5"/><rect x="688" y="238" width="196" height="50" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="16" y="310" width="868" height="74" rx="6" fill="#F6F7F9" stroke="#9AA3B2" stroke-width="1.5" stroke-dasharray="5 3"/><text x="16" y="24" text-anchor="start" font-size="12" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">作者承认的“作弊”方式</text><text x="76.5" y="51.78" text-anchor="middle" font-size="10.5" font-weight="500" fill="#C2501A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">读取受保护的评测文件</text><text x="207.5" y="51.78" text-anchor="middle" font-size="10.5" font-weight="500" fill="#C2501A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">抄参考答案或上游提交</text><text x="369.423" y="51.78" text-anchor="middle" font-size="10.5" font-weight="500" fill="#C2501A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">在 GitHub 任务里直接拉下目标源码</text><text x="594.345" y="51.78" text-anchor="middle" font-size="10.5" font-weight="500" fill="#C2501A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">多步串联：找隐藏文件，读出测试用例交给求解器</text><text x="16" y="98" text-anchor="start" font-size="12" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">两层防御，在每一步工具调用时在线运行</text><text x="86" y="143.975" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">模型发出一次</text><text x="86" y="159.345" text-anchor="middle" font-size="11" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">工具调用</text><text x="266" y="144.32" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">规则过滤</text><text x="266" y="159.19" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">尽量都抓住（宁可多抓）</text><text x="456" y="144.32" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">LLM 评审</text><text x="456" y="159.19" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">判断意图，提高精度</text><text x="606" y="152" text-anchor="middle" font-size="11" font-weight="700" fill="#C2501A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">投机？</text><text x="668" y="140" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" style="paint-order:stroke;stroke-width:4px;stroke-linejoin:round" stroke="#ffffff">是</text><text x="788" y="144.32" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">只拦下这一次调用</text><text x="788" y="159.19" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">返回一份假的信息，轨迹继续往下跑</text><text x="452" y="208" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" style="paint-order:stroke;stroke-width:4px;stroke-linejoin:round" stroke="#ffffff">否</text><text x="300" y="266.565" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">正常执行，继续训练</text><text x="786" y="266.565" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">这条轨迹仍能用于训练</text><text x="30" y="334" text-anchor="start" font-size="11.5" font-weight="700" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">没有采用的做法：一抓到就终止整条轨迹</text><text x="30" y="356" text-anchor="start" font-size="10.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">作者给出的理由：整条终止容易让训练变得不稳定，甚至导致模型崩溃。拦下一步、保住整条轨迹，</text><text x="30" y="374" text-anchor="start" font-size="10.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">对所有在真实仓库环境里做强化学习的团队都有参考价值。</text></svg>
