<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-label="同一个底层模型，两种部署"><defs><marker id="ah-samebase" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6577"/></marker></defs><rect x="0" y="0" width="900" height="300" fill="#ffffff"/><path d="M186,120 L226,70" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-samebase)"/><path d="M186,150 L226,200" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-samebase)"/><path d="M448,70 L488,120" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-samebase)"/><path d="M448,200 L488,150" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-samebase)"/><path d="M670,135 L700,135" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-samebase)"/><rect x="16" y="100" width="170" height="70" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="228" y="40" width="220" height="60" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><rect x="228" y="170" width="220" height="60" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><rect x="490" y="100" width="180" height="70" rx="5" fill="#E3EBFF" stroke="#2B57C9" stroke-width="1.5"/><rect x="702" y="86" width="182" height="98" rx="5" fill="#FDE8DD" stroke="#C2501A" stroke-width="1.5"/><text x="101" y="131.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">同一个底层模型</text><text x="101" y="146.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Fable 5.1 与 Mythos 5.1 共用</text><text x="338" y="66.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Claude Fable 5.1</text><text x="338" y="81.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">一套安全措施与访问方式</text><text x="338" y="196.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Claude Mythos 5.1</text><text x="338" y="211.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">另一套安全措施与访问方式</text><text x="580" y="131.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">同一类测试</text><text x="580" y="146.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">两者之间出现差距</text><text x="793" y="116.985" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">差距可能包含</text><text x="793" y="132.045" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">安全干预的影响；</text><text x="793" y="146.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">直接读成两套架构的</text><text x="793" y="161.025" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">智力差距就错了</text><text x="16" y="262" text-anchor="start" font-size="10.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">这正呼应 Meta 当年提出系统卡的理由：底层能力相同，部署策略仍可能改变模型在任务中的实际行为。</text><text x="16" y="284" text-anchor="start" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Fable 5.1 的比较方式：同一模型在不同推理强度下运行，既看最高设置下的结果，也看较低投入时相对上一代的能力。</text></svg>
