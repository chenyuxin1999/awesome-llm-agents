<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380" role="img" aria-label="边听边判断的语音系统"><defs><marker id="ah-speechstreaming" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6577"/></marker></defs><rect x="0" y="0" width="900" height="380" fill="#ffffff"/><line x1="16" y1="200" x2="884" y2="200" stroke="#E2E6EC" stroke-width="1"/><rect x="110" y="52" width="62" height="22" rx="3" fill="#DDF3E8" stroke="#26805A" stroke-width="1"/><path d="M115,63 l6,-6 l6,10 l6,-8 l6,6 l6,-4 l6,5 l6,-6 l6,4" fill="none" stroke="#26805A" stroke-width="1"/><rect x="176" y="52" width="62" height="22" rx="3" fill="#DDF3E8" stroke="#26805A" stroke-width="1"/><path d="M181,63 l6,-6 l6,10 l6,-8 l6,6 l6,-4 l6,5 l6,-6 l6,4" fill="none" stroke="#26805A" stroke-width="1"/><rect x="242" y="52" width="62" height="22" rx="3" fill="#DDF3E8" stroke="#26805A" stroke-width="1"/><path d="M247,63 l6,-6 l6,10 l6,-8 l6,6 l6,-4 l6,5 l6,-6 l6,4" fill="none" stroke="#26805A" stroke-width="1"/><rect x="308" y="52" width="62" height="22" rx="3" fill="#DDF3E8" stroke="#26805A" stroke-width="1"/><path d="M313,63 l6,-6 l6,10 l6,-8 l6,6 l6,-4 l6,5 l6,-6 l6,4" fill="none" stroke="#26805A" stroke-width="1"/><rect x="374" y="52" width="62" height="22" rx="3" fill="#DDF3E8" stroke="#26805A" stroke-width="1"/><path d="M379,63 l6,-6 l6,10 l6,-8 l6,6 l6,-4 l6,5 l6,-6 l6,4" fill="none" stroke="#26805A" stroke-width="1"/><rect x="440" y="52" width="62" height="22" rx="3" fill="#DDF3E8" stroke="#26805A" stroke-width="1"/><path d="M445,63 l6,-6 l6,10 l6,-8 l6,6 l6,-4 l6,5 l6,-6 l6,4" fill="none" stroke="#26805A" stroke-width="1"/><rect x="506" y="52" width="62" height="22" rx="3" fill="#FFF1DC" stroke="#B86E00" stroke-width="1"/><path d="M511,63 l6,-6 l6,10 l6,-8 l6,6 l6,-4 l6,5 l6,-6 l6,4" fill="none" stroke="#B86E00" stroke-width="1"/><rect x="572" y="52" width="62" height="22" rx="3" fill="#F6F7F9" stroke="#9AA3B2" stroke-width="1"/><path d="M577,63 l6,-6 l6,10 l6,-8 l6,6 l6,-4 l6,5 l6,-6 l6,4" fill="none" stroke="#9AA3B2" stroke-width="1"/><rect x="638" y="52" width="62" height="22" rx="3" fill="#F6F7F9" stroke="#9AA3B2" stroke-width="1"/><path d="M643,63 l6,-6 l6,10 l6,-8 l6,6 l6,-4 l6,5 l6,-6 l6,4" fill="none" stroke="#9AA3B2" stroke-width="1"/><rect x="704" y="52" width="62" height="22" rx="3" fill="#F6F7F9" stroke="#9AA3B2" stroke-width="1"/><path d="M709,63 l6,-6 l6,10 l6,-8 l6,6 l6,-4 l6,5 l6,-6 l6,4" fill="none" stroke="#9AA3B2" stroke-width="1"/><line x1="504" y1="44" x2="504" y2="100" stroke="#C2501A" stroke-width="1.6" stroke-dasharray="4 3"/><rect x="110" y="126" width="128" height="26" rx="5" fill="#E3EBFF" stroke="#2B57C9" stroke-width="1.5"/><rect x="242" y="126" width="128" height="26" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="374" y="126" width="128" height="26" rx="5" fill="#E3EBFF" stroke="#2B57C9" stroke-width="1.5"/><rect x="16" y="214" width="278" height="152" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="309" y="214" width="278" height="152" rx="5" fill="#E3EBFF" stroke="#2B57C9" stroke-width="1.5"/><rect x="602" y="214" width="278" height="152" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><text x="16" y="24" text-anchor="start" font-size="12" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">流式识别：音频一块块到达，模型在证据不完整时就要给出“谁说了什么”（VibeVoice-ASR-Streaming）</text><text x="16" y="66" text-anchor="start" font-size="11" font-weight="600" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">音频</text><text x="537" y="92" text-anchor="middle" font-size="10" font-weight="600" fill="#B86E00" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">少量前瞻</text><text x="669" y="92" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">尚未到达</text><text x="500" y="112" text-anchor="end" font-size="10" font-weight="600" fill="#C2501A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">现在</text><text x="16" y="140" text-anchor="start" font-size="11" font-weight="600" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">文字</text><text x="174" y="142.255" text-anchor="middle" font-size="10.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">A：我们先看一下</text><text x="306" y="142.255" text-anchor="middle" font-size="10.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">B：好，那第二页</text><text x="438" y="142.255" text-anchor="middle" font-size="10.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">A：这里的数字</text><text x="514" y="144" text-anchor="start" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">与之前生成的文字交错输入，不再单独做说话人分离</text><text x="16" y="182" text-anchor="start" font-size="10.5" font-weight="400" fill="#C2501A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">代价：实时性取决于块大小和前瞻长度；错误率低也可能是多等未来音频换来的，延迟和正确率要一起报告。</text><text x="28" y="236" text-anchor="start" font-size="12" font-weight="700" fill="#26805A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Xiaomi-CocktailASR-1</text><text x="282" y="236" text-anchor="end" font-size="10.5" font-weight="600" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">目标说话人</text><text x="28" y="262" text-anchor="start" font-size="10.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">一段参考语音当作提示</text><text x="28" y="282" text-anchor="start" font-size="10.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">只转录这个人说的内容</text><text x="28" y="302" text-anchor="start" font-size="10.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">目标缺席时输出空文本</text><text x="28" y="338" text-anchor="start" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">拒绝输出本身就是一种成功</text><text x="321" y="236" text-anchor="start" font-size="12" font-weight="700" fill="#2B57C9" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Qwen-Audio-3.0-ASR</text><text x="575" y="236" text-anchor="end" font-size="10.5" font-weight="600" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">覆盖面</text><text x="321" y="262" text-anchor="start" font-size="10.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">方言、热词、长上下文、自然口语</text><text x="321" y="282" text-anchor="start" font-size="10.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">放进统一的指令框架</text><text x="321" y="302" text-anchor="start" font-size="10.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">另有流式变体</text><text x="321" y="338" text-anchor="start" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">错误分母和任务目标都不同，别用一个识别率排序</text><text x="614" y="236" text-anchor="start" font-size="12" font-weight="700" fill="#5B45B0" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">StepAudio 3 Realtime</text><text x="868" y="236" text-anchor="end" font-size="10.5" font-weight="600" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">完整的语音智能体</text><text x="614" y="262" text-anchor="start" font-size="10.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">听、对话、思考、行动连成循环</text><text x="614" y="282" text-anchor="start" font-size="10.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">全双工处理停顿与打断</text><text x="614" y="302" text-anchor="start" font-size="10.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">边说边思考，异步调用工具</text><text x="614" y="338" text-anchor="start" font-size="10.5" font-weight="400" fill="#C2501A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">要检查：打断后旧计划是否取消，工具结果怎样改变正</text><text x="614" y="353" text-anchor="start" font-size="10.5" font-weight="400" fill="#C2501A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">在说的话</text></svg>
