e="#D5DBE4" stroke-width="1"/><rect x="66" y="270" width="22" height="18" rx="2" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1"/><rect x="92" y="270" width="22" height="18" rx="2" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1"/><rect x="118" y="270" width="22" height="18" rx="2" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1"/><rect x="144" y="270" width="22" height="18" rx="2" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1"/><rect x="40" y="292" width="22" height="18" rx="2" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1"/><rect x="66" y="292" width="22" height="18" rx="2" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1"/><rect x="92" y="292" width="22" height="18" rx="2" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1"/><rect x="118" y="292" width="22" height="18" rx="2" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1"/><rect x="144" y="292" width="22" height="18" rx="2" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1"/><rect x="37" y="245" width="132" height="24" rx="4" fill="none" stroke="#5B45B0" stroke-width="1.6"/><rect x="89" y="223" width="28" height="90" rx="4" fill="none" stroke="#26805A" stroke-width="1.6"/><rect x="470" y="200" width="414" height="52" rx="5" fill="#E9EDF3" stroke="#47546A" stroke-width="1.5"/><rect x="470" y="260" width="414" height="52" rx="5" fill="#E9EDF3" stroke="#47546A" stroke-width="1.5"/><rect x="470" y="320" width="414" height="52" rx="5" fill="#E9EDF3" stroke="#47546A" stroke-width="1.5"/><text x="16" y="24" text-anchor="start" font-size="12" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">预训练只用合成数据；遇到新表时不做梯度训练，把带标签的行当作上下文，一次前向给出预测</text><text x="106" y="79.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">合成先验</text><text x="106" y="94.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">结构因果模型生成大量小表</text><text x="211" y="104" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">预训练</text><text x="313" y="79.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">表格 Transformer</text><text x="313" y="94.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">学会“看上下文做预测”</text><text x="470" y="50" text-anchor="start" font-size="11" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">一张新表</text><text x="505" y="72" text-anchor="middle" font-size="10" font-weight="600" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">特征 1</text><text x="575" y="72" text-anchor="middle" font-size="10" font-weight="600" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">特征 2</text><text x="645" y="72" text-anchor="middle" font-size="10" font-weight="600" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">特征 3</text><text x="715" y="72" text-anchor="middle" font-size="10" font-weight="600" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">标签</text><text x="715" y="91" text-anchor="middle" font-size="9.5" font-weight="600" fill="#26805A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">已知</text><text x="715" y="109" text-anchor="middle" font-size="9.5" font-weight="600" fill="#26805A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">已知</text><text x="715" y="127" text-anchor="middle" font-size="9.5" font-weight="600" fill="#26805A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">已知</text><text x="715" y="145" text-anchor="middle" font-size="9.5" font-weight="600" fill="#B83560" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">?</text><text x="715" y="163" text-anchor="middle" font-size="9.5" font-weight="600" fill="#B83560" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">?</text><text x="760" y="106" text-anchor="start" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">训练行</text><text x="760" y="160" text-anchor="start" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">测试行</text><text x="432" y="74" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" style="paint-order:stroke;stroke-width:4px;stroke-linejoin:round" stroke="#ffffff">整表输入</text><text x="16" y="210" text-anchor="start" font-size="12" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">EXAONE Tabular：每一层都交错两种注意力</text><text x="182" y="262" text-anchor="start" font-size="10.5" font-weight="600" fill="#5B45B0" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">行内：特征轴上的注意力</text><text x="182" y="296" text-anchor="start" font-size="10.5" font-weight="600" fill="#26805A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">列内：样本轴上的注意力，</text><text x="182" y="312" text-anchor="start" font-size="10.5" font-weight="600" fill="#26805A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">让上下文里的标签参与预测</text><text x="677" y="222.665" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Mitra-v2</text><text x="677" y="237.035" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">同样只用合成数据，扩大任务分布，调整二维 Transformer 的结构与优化</text><text x="677" y="282.665" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Xiaomi-TabLDM</text><text x="677" y="297.035" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">特征分组、上下文利用、稀疏专家，测试时可加算力</text><text x="677" y="342.665" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">TabPFN-3.5</text><text x="677" y="357.035" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">按时间或分组切分、复杂类别、多模态表格；Fast、Plus、Thinking 几种变体</text><text x="16" y="352" text-anchor="start" font-size="11" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">要点</text><text x="16" y="374" text-anchor="start" font-size="10.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">合成先验可以支撑预测；估计真实数据里的因果效应，还需要额外的假设和实验设计。</text><text x="16" y="394" text-anchor="start" font-size="10.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">传统基线往往很强，调参预算影响很大；看类别数、缺失值、特征数量、切分方式和是否额外微调。</text><text x="16" y="414" text-anchor="start" font-size="10.5" font-weight="400" fill="#C2501A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">TabPFN-3.5 含专有推理优化：可检查程度按组件分别标注；快速变体的速度和高计算变体的精度不能拼成一个配置。</text></svg>
