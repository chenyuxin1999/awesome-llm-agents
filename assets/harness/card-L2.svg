<text x="280" y="162" text-anchor="middle" font-size="10.5" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">一段文字分析比一个分数信息多，需要试跑的次数比强化学习少得多</text>
