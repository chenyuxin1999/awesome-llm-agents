<text x="211.25" y="80.795" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">模型自评，或环境给出</text>
<text x="211.25" y="94.595" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">的报错</text>
<path d="M132.5,77 L151.5,77" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah_card_S3)"/>
<rect x="291" y="38" width="115.5" height="78" rx="5" fill="#E3EBFF" stroke="#2B57C9" stroke-width="1.5"/>
<text x="348.75" y="66.374" text-anchor="middle" font-size="11.5" font-weight="500" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">写成一段反思</text>
<text x="348.75" y="80.795" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">用文字说清错在哪、下</text>
<text x="348.75" y="94.595" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">次怎么改</text>
