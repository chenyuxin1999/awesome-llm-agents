<text x="281" y="113.136" text-anchor="middle" font-size="11" font-weight="500" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">子 agent B</text>
<text x="281" y="127.35" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">带着干净上下文做另一块</text>
<path d="M156,91 L204,117" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah_card_S5)"/>
