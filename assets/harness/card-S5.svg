<text x="86" y="94.795" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">把子任务交出去，像调一个</text>
<text x="86" y="108.595" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">工具</text>
<rect x="206" y="40" width="150" height="46" rx="5" fill="#F6F3FD" stroke="#5B45B0" stroke-width="1.5"/>
<text x="281" y="59.136" text-anchor="middle" font-size="11" font-weight="500" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">子 agent A</text>
<text x="281" y="73.35" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">带着干净上下文做一块</text>
<path d="M156,91 L204,63" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah_card_S5)"/>
<path d="M356,63 L402,91" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah_card_S5)"/>
