<text x="101" y="83.795" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">窗口有限，像内存</text>
<text x="101" y="97.595" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">长对话和大量文档放不下</text>
<rect x="374" y="44" width="170" height="72" rx="5" fill="#E9EDF3" stroke="#47546A" stroke-width="1.5"/>
<text x="459" y="69.374" text-anchor="middle" font-size="11.5" font-weight="500" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">外部存储</text>
<text x="459" y="83.795" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">容量大，像磁盘</text>
<text x="459" y="97.595" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">放不下的内容先存在这里</text>
<path d="M188,64 L372,64" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah_card_S7)"/>
<text x="280" y="58" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" style="paint-order:stroke;stroke-width:4px;stroke-linejoin:round" stroke="#ffffff">模型发出“写出”：放不下的存档</text>
<path d="M372,98 L188,98" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah_card_S7)"/>
<text x="280" y="92" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" style="paint-order:stroke;stroke-width:4px;stroke-linejoin:round" stroke="#ffffff">模型发出“调入”：取回要用的片段</text>
<text x="280" y="146" text-anchor="middle" font-size="10.5" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">由模型自己决定调入什么，有限的窗口就能处理远超其容量的信息</text>
