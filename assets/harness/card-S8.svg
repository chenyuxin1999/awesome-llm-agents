<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 142" width="560" height="142" role="img" aria-label="S8 可编程上下文结构图" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif"><rect x="0" y="0" width="560" height="142" fill="#ffffff"/><defs><marker id="ah_card_S8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6577"/></marker></defs>
<text x="16" y="24" text-anchor="start" font-size="12" font-weight="700" fill="#0E6E7E" font-family="JetBrains Mono, Menlo, Consolas, monospace">S8</text>
<text x="48" y="24" text-anchor="start" font-size="12.5" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">可编程上下文（RLM）</text>
<text x="544" y="24" text-anchor="end" font-size="11" font-weight="400" fill="#5A6577" font-family="JetBrains Mono, Menlo, Consolas, monospace">2025</text>
<rect x="16" y="38" width="115.5" height="78" rx="5" fill="#E9EDF3" stroke="#47546A" stroke-width="1.5"/>
<text x="73.75" y="66.374" text-anchor="middle" font-size="11.5" font-weight="500" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">长输入存成变量</text>
<text x="73.75" y="80.795" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">整本书留在 REPL 里，</text>
<text x="73.75" y="94.595" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">不进窗口</text>
<rect x="153.5" y="38" width="115.5" height="78" rx="5" fill="#FDE8DD" stroke="#C2501A" stroke-width="1.5"/>
<text x="211.25" y="66.374" text-anchor="middle" font-size="11.5" font-weight="500" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">写代码查看、切分</text>
<text x="211.25" y="80.795" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">打印开头，按章切开，</text>
<text x="211.25" y="94.595" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">搜关键词</text>
<path d="M132.5,77 L151.5,77" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah_card_S8)"/>
<rect x="291" y="38" width="115.5" height="78" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/>
<text x="348.75" y="66.374" text-anchor="middle" font-size="11.5" font-weight="500" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">片段交给子模型</text>
<text x="348.75" y="80.795" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">每段调用 sub_RLM，</text>
<text x="348.75" y="94.595" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">返回一句摘要</text>
<path d="M270,77 L289,77" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah_card_S8)"/>
<rect x="428.5" y="38" width="115.5" height="78" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/>
<text x="486.25" y="66.374" text-anchor="middle" font-size="11.5" font-weight="500" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">答案写进 Final</text>
<text x="486.25" y="80.795" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">这个变量一设置，迭代</text>
<text x="486.25" y="94.595" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">就停</text>
<path d="M407.5,77 L426.5,77" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah_card_S8)"/>
<text x="280" y="132" text-anchor="middle" font-size="10.5" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">正文始终留在变量里，模型只看代码和简短输出，输入长度不再受窗口限制</text>
</svg>
