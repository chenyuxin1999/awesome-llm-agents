<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 340" width="860" height="340" role="img" aria-label="LongHorizon-Harness 的管理、执行、审计循环" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif"><rect x="0" y="0" width="860" height="340" fill="#ffffff"/><defs><marker id="ah_fig_b2_mea" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6577"/></marker></defs>
<rect x="300" y="22" width="260" height="66" rx="5" fill="#E9EDF3" stroke="#47546A" stroke-width="2"/>
<text x="430" y="51.067" text-anchor="middle" font-size="12" font-weight="500" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">任务状态（放在执行之外）</text>
<text x="430" y="66.178" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">已完成什么、还剩什么、哪些事实已核实</text>
