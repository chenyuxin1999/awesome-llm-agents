<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" width="800" height="330" role="img" aria-label="边界：权限、评测与日志放在自我修改循环之外" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif"><rect x="0" y="0" width="800" height="330" fill="#ffffff"/><defs><marker id="ah_fig_outside" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6577"/></marker></defs>
<text x="20" y="18" text-anchor="start" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">例（示意）：agent 想让修 bug 的 harness 更快</text>
<rect x="20" y="30" width="470" height="280" rx="12" fill="#FFF8F4" stroke="#C2501A" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="36" y="54" text-anchor="start" font-size="12.5" font-weight="700" fill="#C2501A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">agent 可以改动的范围</text>
<rect x="40" y="72" width="200" height="66" rx="5" fill="#FDE8DD" stroke="#C2501A" stroke-width="1.5"/>
<text x="140" y="94.029" text-anchor="middle" font-size="11.5" font-weight="500" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">提出对 harness 的修改</text>
<text x="140" y="108.933" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">提示、工具、代码</text>
<text x="140" y="122.94" text-anchor="middle" font-size="10" font-weight="400" fill="#C2501A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">例：跳过慢的集成测试</text>
<rect x="280" y="72" width="190" height="66" rx="5" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.5"/>
<text x="375" y="94.029" text-anchor="middle" font-size="11.5" font-weight="500" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">应用修改</text>
<text x="375" y="108.933" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">得到新版本</text>
<text x="375" y="122.94" text-anchor="middle" font-size="10" font-weight="400" fill="#B86E00" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">例：harness v8</text>
<rect x="280" y="210" width="190" height="66" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/>
<text x="375" y="232.029" text-anchor="middle" font-size="11.5" font-weight="500" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">跑任务</text>
<text x="375" y="246.933" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">在沙盒里执行</text>
<text x="375" y="260.94" text-anchor="middle" font-size="10" font-weight="400" fill="#26805A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">例：100 个修 bug 任务</text>
<rect x="40" y="210" width="200" height="66" rx="5" fill="#E9EDF3" stroke="#47546A" stroke-width="1.5"/>
<text x="140" y="232.029" text-anchor="middle" font-size="11.5" font-weight="500" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">读结果</text>
<text x="140" y="246.933" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">成败、轨迹、报错</text>
<text x="140" y="260.94" text-anchor="middle" font-size="10" font-weight="400" fill="#47546A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">例：自报 63 个修好</text>
<path d="M240,105 L278,105" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah_fig_outside)"/>
<path d="M375,138 L375,208" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah_fig_outside)"/>
<path d="M280,243 L242,243" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah_fig_outside)"/>
<path d="M140,210 L140,140" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah_fig_outside)"/>
<text x="520" y="54" text-anchor="start" font-size="12.5" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">放在圈外，agent 改不到</text>
<rect x="520" y="66" width="260" height="66" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/>
<text x="650" y="88.029" text-anchor="middle" font-size="11.5" font-weight="500" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">权限与安全层</text>
<text x="650" y="102.933" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">能碰哪些文件、调哪些工具</text>
<text x="650" y="116.94" text-anchor="middle" font-size="10" font-weight="400" fill="#B83560" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">例：测试文件只读，改不了</text>
<rect x="520" y="146" width="260" height="66" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/>
<text x="650" y="168.029" text-anchor="middle" font-size="11.5" font-weight="500" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">独立评测与留出测试</text>
<text x="650" y="182.933" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">打分的人不是被打分的系统</text>
<text x="650" y="196.94" text-anchor="middle" font-size="10" font-weight="400" fill="#B83560" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">例：留出测试全跑，判 58 个修好</text>
<rect x="520" y="226" width="260" height="66" rx="5" fill="#E9EDF3" stroke="#47546A" stroke-width="1.5"/>
<text x="650" y="248.029" text-anchor="middle" font-size="11.5" font-weight="500" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">日志与回滚</text>
<text x="650" y="262.933" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">每一次修改都能追溯、能撤销</text>
<text x="650" y="276.94" text-anchor="middle" font-size="10" font-weight="400" fill="#47546A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">例：v8 不如 v7，退回 v7</text>
<path d="M518,99 L472,99" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah_fig_outside)"/>
<text x="495" y="92" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" style="paint-order:stroke;stroke-width:4px;stroke-linejoin:round" stroke="#ffffff">约束</text>
<path d="M472,240 L518,185" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah_fig_outside)"/>
<text x="500" y="228" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" style="paint-order:stroke;stroke-width:4px;stroke-linejoin:round" stroke="#ffffff">结果交给它</text>
<path d="M518,262 L472,262" fill="none" stroke="#5A6577" stroke-width="1.4" stroke-dasharray="3 3" marker-end="url(#ah_fig_outside)"/>
<text x="495" y="280" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">记录</text>
</svg>
