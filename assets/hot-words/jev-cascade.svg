<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380" role="img" aria-label="JEV 的有限决策与升级"><defs><marker id="ah-jevcascade" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6577"/></marker></defs><rect x="0" y="0" width="900" height="380" fill="#ffffff"/><path d="M186,110 L217,110" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-jevcascade)"/><path d="M470,110 L503,110" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-jevcascade)"/><path d="M626,100 L650,100 L650,74 L677,74" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-jevcascade)"/><path d="M626,120 L650,120 L650,154 L677,154" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-jevcascade)"/><path d="M101,156 L101,183" fill="none" stroke="#5A6577" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#ah-jevcascade)"/><rect x="220" y="206" width="664" height="156" rx="5" fill="#F3F5F8" stroke="#D5DBE4" stroke-width="1.5"/><rect x="16" y="64" width="170" height="92" rx="5" fill="#E3EBFF" stroke="#2B57C9" stroke-width="1.5"/><rect x="220" y="48" width="250" height="124" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="232" y="84" width="72" height="46" rx="5" fill="#FFFFFF" stroke="#5B45B0" stroke-width="1.5"/><rect x="310" y="84" width="72" height="46" rx="5" fill="#FFFFFF" stroke="#5B45B0" stroke-width="1.5"/><rect x="388" y="84" width="72" height="46" rx="5" fill="#FFFFFF" stroke="#5B45B0" stroke-width="1.5"/><rect x="506" y="84" width="120" height="52" rx="5" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1.5"/><rect x="680" y="46" width="204" height="56" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="680" y="126" width="204" height="56" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><rect x="16" y="186" width="170" height="52" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="236" y="244" width="300" height="56" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="566" y="244" width="300" height="56" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><text x="16" y="22" text-anchor="start" font-size="12" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">程序先规定输出空间，JEV 返回概率；有把握就接受，没把握或需要生成内容时再升级（示意）</text><text x="101" y="99.23" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">程序规定输出空间</text><text x="101" y="114.29" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">候选列表、准则、评分尺度；条</text><text x="101" y="128.78" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">件用自然语言写下</text><text x="345" y="70" text-anchor="middle" font-size="12.5" font-weight="700" fill="#5B45B0" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">JEV（System One Model）</text><text x="268" y="103" text-anchor="middle" font-size="11.5" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Choice</text><text x="268" y="121" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">候选选择</text><text x="346" y="103" text-anchor="middle" font-size="11.5" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Noul</text><text x="346" y="121" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">二元判断</text><text x="424" y="103" text-anchor="middle" font-size="11.5" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Score</text><text x="424" y="121" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">有序评分</text><text x="345" y="156" text-anchor="middle" font-size="10.5" font-weight="500" fill="#5B45B0" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">都返回概率信息（RLCD 训练）</text><text x="566" y="113.72" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">置信度够吗？</text><text x="782" y="70.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">直接接受</text><text x="782" y="85.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">工具路由、质量检查、停止判断</text><text x="782" y="150.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">升级到强模型</text><text x="782" y="165.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">推理裁判、内容生成</text><text x="640" y="86" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" style="paint-order:stroke;stroke-width:4px;stroke-linejoin:round" stroke="#ffffff">够</text><text x="612" y="168" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" style="paint-order:stroke;stroke-width:4px;stroke-linejoin:round" stroke="#ffffff">不够或需生成</text><text x="101" y="208.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">确定性代码</text><text x="101" y="223.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">精确计算、日期比较</text><text x="16" y="254" text-anchor="start" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">jev-1.13 局限说明：建议把精确计算留给代码</text><text x="236" y="230" text-anchor="start" font-size="12.5" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">级联要起作用，两个条件缺一不可</text><text x="386" y="268.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">前级能识别出自己的困难</text><text x="386" y="283.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">校准只说明置信度与实际正确率大体对应</text><text x="716" y="268.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">后级擅长解决这些困难</text><text x="716" y="283.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">两级在同一批样本上犯错，升级就帮不上忙</text><text x="236" y="324" text-anchor="start" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">类型合法和语义正确是两回事：模型照样可能在所有合法答案里选错一个；把复杂任务改写成选择题，问题并不会因此解决。</text></svg>
