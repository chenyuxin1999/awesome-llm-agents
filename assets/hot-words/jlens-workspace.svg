<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" role="img" aria-label="J-space 作为全局工作空间"><defs><marker id="ah-jlensworkspace" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6577"/></marker></defs><rect x="0" y="0" width="900" height="420" fill="#ffffff"/><rect x="16" y="40" width="540" height="316" rx="5" fill="#F3F5F8" stroke="#D5DBE4" stroke-width="1.5"/><path d="M142,91 L193,116" fill="none" stroke="#B7C0CC" stroke-width="1.4" marker-end="url(#ah-jlensworkspace)"/><path d="M142,129 L193,132" fill="none" stroke="#B7C0CC" stroke-width="1.4" marker-end="url(#ah-jlensworkspace)"/><path d="M142,167 L193,148" fill="none" stroke="#B7C0CC" stroke-width="1.4" marker-end="url(#ah-jlensworkspace)"/><path d="M142,205 L193,164" fill="none" stroke="#B7C0CC" stroke-width="1.4" marker-end="url(#ah-jlensworkspace)"/><path d="M366,152 L395,104" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-jlensworkspace)"/><path d="M366,152 L395,150" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-jlensworkspace)"/><path d="M366,152 L395,196" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-jlensworkspace)"/><rect x="572" y="40" width="312" height="316" rx="5" fill="#FDE8DD" stroke="#C2501A" stroke-width="1.5"/><rect x="32" y="76" width="110" height="30" rx="5" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1.5"/><rect x="32" y="114" width="110" height="30" rx="5" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1.5"/><rect x="32" y="152" width="110" height="30" rx="5" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1.5"/><rect x="32" y="190" width="110" height="30" rx="5" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1.5"/><rect x="196" y="92" width="170" height="120" rx="5" fill="#DCEFF1" stroke="#0E6E7E" stroke-width="1.5"/><rect x="398" y="86" width="146" height="36" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="398" y="132" width="146" height="36" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="398" y="178" width="146" height="36" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><circle cx="36" cy="264" r="3" fill="#DCEFF1" stroke="#0E6E7E" stroke-width="1.5"/><circle cx="36" cy="285.225" r="3" fill="#DCEFF1" stroke="#0E6E7E" stroke-width="1.5"/><circle cx="36" cy="306.45" r="3" fill="#DCEFF1" stroke="#0E6E7E" stroke-width="1.5"/><rect x="650" y="136" width="120.7" height="18" rx="3" fill="#E9EDF3" stroke="#47546A" stroke-width="1"/><rect x="650" y="162" width="5.1" height="18" rx="3" fill="#FDE8DD" stroke="#C2501A" stroke-width="1"/><rect x="650" y="224" width="2" height="18" rx="3" fill="#E9EDF3" stroke="#47546A" stroke-width="1"/><rect x="650" y="250" width="73.6667" height="18" rx="3" fill="#FDE8DD" stroke="#C2501A" stroke-width="1"/><text x="16" y="22" text-anchor="start" font-size="12" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">左：借用全局工作空间理论的示意与论文证据；右：被转述最多的对齐审计实验（数字取自论文）</text><text x="30" y="62" text-anchor="start" font-size="12.5" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">中间层里的分工（示意）</text><text x="87" y="94.255" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">各自的处理 1</text><text x="87" y="132.255" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">各自的处理 2</text><text x="87" y="170.255" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">各自的处理 3</text><text x="87" y="208.255" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">各自的处理 4</text><text x="281" y="127.05" text-anchor="middle" font-size="13" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">J-space</text><text x="281" y="142.49" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">容量有限</text><text x="281" y="156.98" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">约 25 个同时活跃的</text><text x="281" y="171.47" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">J-lens 向量</text><text x="281" y="185.96" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">通常不到一成激活方差</text><text x="471" y="107.565" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">可被报告</text><text x="471" y="153.565" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">可被保持</text><text x="471" y="199.565" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">可用于后续推理</text><text x="30" y="246" text-anchor="start" font-size="12" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">论文的证据</text><text x="46" y="268" text-anchor="start" font-size="10.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">注入 J-space 的概念，模型能说出来；注入到别处的大多说不出来</text><text x="46" y="289.225" text-anchor="start" font-size="10.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">两跳推理的中间概念在这里依次出现，替换其中一个，下游答案跟着变</text><text x="46" y="310.45" text-anchor="start" font-size="10.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">也有任务完全绕过这块空间，作者类比为不经思考的快速反应</text><text x="586" y="62" text-anchor="start" font-size="12.5" font-weight="700" fill="#C2501A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">对齐审计：勒索测试场景</text><text x="586" y="84" text-anchor="start" font-size="10.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">消融与“意识到自己正在被评测”相关的方向之后：</text><text x="586" y="124" text-anchor="start" font-size="11" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">口头说出“这是测试”的比例</text><text x="642" y="149" text-anchor="end" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">消融前</text><text x="776.7" y="149" text-anchor="start" font-size="10.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">71%</text><text x="642" y="175" text-anchor="end" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">消融后</text><text x="661.1" y="175" text-anchor="start" font-size="10.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">3%</text><text x="586" y="212" text-anchor="start" font-size="11" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">实际选择勒索的次数</text><text x="642" y="237" text-anchor="end" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">消融前</text><text x="658" y="237" text-anchor="start" font-size="10.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">0/180</text><text x="642" y="263" text-anchor="end" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">消融后</text><text x="729.667" y="263" text-anchor="start" font-size="10.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">13/180</text><text x="586" y="300" text-anchor="start" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">模型知道自己在被考，这件事本身就在影响它的表现，而这个</text><text x="586" y="315.225" text-anchor="start" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">“知道”在 J-space 里看得见</text><text x="16" y="382" text-anchor="start" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">争议：J-lens 向量按定义就是对输出影响最大的方向，“有因果作用”部分是定义出来的；</text><text x="16" y="402" text-anchor="start" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">论文说明的是可报告性这种功能性质，对模型是否有主观体验不持立场。</text></svg>
