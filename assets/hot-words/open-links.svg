" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-openlinks)"/><path d="M778,224 L778,241" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-openlinks)"/><rect x="16" y="44" width="92" height="44" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="128" y="44" width="92" height="44" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><rect x="16" y="108" width="204" height="116" rx="5" fill="#F3F5F8" stroke="#D5DBE4" stroke-width="1.5"/><rect x="236" y="44" width="92" height="44" rx="5" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.5"/><rect x="348" y="44" width="92" height="44" rx="5" fill="#E9EDF3" stroke="#47546A" stroke-width="1.5"/><rect x="236" y="108" width="204" height="116" rx="5" fill="#F3F5F8" stroke="#D5DBE4" stroke-width="1.5"/><rect x="456" y="44" width="92" height="44" rx="5" fill="#E3EBFF" stroke="#2B57C9" stroke-width="1.5"/><rect x="568" y="44" width="92" height="44" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="456" y="108" width="204" height="116" rx="5" fill="#F3F5F8" stroke="#D5DBE4" stroke-width="1.5"/><rect x="676" y="44" width="92" height="44" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><rect x="788" y="44" width="92" height="44" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="676" y="108" width="204" height="116" rx="5" fill="#F3F5F8" stroke="#D5DBE4" stroke-width="1.5"/><rect x="16" y="244" width="868" height="40" rx="5" fill="#E3EBFF" stroke="#2B57C9" stroke-width="1.5"/><text x="16" y="22" text-anchor="start" font-size="12" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">每个研究机会都连接两样东西，最终都要放回完整任务里检验</text><text x="62" y="69.565" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">快决策</text><text x="174" y="69.565" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">慢推理</text><text x="118" y="132" text-anchor="middle" font-size="12" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">1 互补的决策系统</text><text x="118" y="172" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">让后级修复前级容易犯的那类错误</text><text x="282" y="69.565" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">经验</text><text x="394" y="69.565" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">可复用能力</text><text x="338" y="132" text-anchor="middle" font-size="12" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">2 可积累的记忆与技能</text><text x="338" y="172" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">发现结构、提炼前置条件、识别过时经</text><text x="338" y="187.225" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">验</text><text x="502" y="69.565" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">目标</text><text x="614" y="69.565" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">可测任务</text><text x="558" y="132" text-anchor="middle" font-size="12" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">3 把能力变成 benchmark</text><text x="558" y="172" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">更长的依赖链、更宽的领域、明确的完</text><text x="558" y="187.225" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">成条件</text><text x="722" y="69.565" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">自动改进</text><text x="834" y="69.565" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">新任务分布</text><text x="778" y="132" text-anchor="middle" font-size="12" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">4 跨越固定任务分布</text><text x="778" y="172" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">分开选择任务、迁移任务和未来的改进</text><text x="778" y="187.225" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">任务</text><text x="450" y="269" text-anchor="middle" font-size="12" font-weight="600" fill="#2B57C9" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">完整任务：每一个局部组件的改进，都在这里接受检验</text></svg>
