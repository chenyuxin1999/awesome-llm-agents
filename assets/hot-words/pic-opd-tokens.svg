<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300" role="img" aria-label="OPD 让教师给学生自己写出的每个 token 打分"><defs><marker id="ah-picopdtokens" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6577"/></marker></defs><rect x="0" y="0" width="880" height="300" fill="#ffffff"/><rect x="130" y="48" width="54" height="28" fill="#E3EBFF" stroke="#FFFFFF" stroke-width="1"/><rect x="130" y="98" width="54" height="28" fill="#DDF3E8" stroke="#FFFFFF" stroke-width="1"/><rect x="190" y="48" width="54" height="28" fill="#E3EBFF" stroke="#FFFFFF" stroke-width="1"/><rect x="190" y="98" width="54" height="28" fill="#DDF3E8" stroke="#FFFFFF" stroke-width="1"/><rect x="250" y="48" width="54" height="28" fill="#E3EBFF" stroke="#FFFFFF" stroke-width="1"/><rect x="250" y="98" width="54" height="28" fill="#DDF3E8" stroke="#FFFFFF" stroke-width="1"/><rect x="310" y="48" width="54" height="28" fill="#E3EBFF" stroke="#FFFFFF" stroke-width="1"/><rect x="310" y="98" width="54" height="28" fill="#DDF3E8" stroke="#FFFFFF" stroke-width="1"/><rect x="370" y="48" width="54" height="28" fill="#E3EBFF" stroke="#FFFFFF" stroke-width="1"/><rect x="370" y="98" width="54" height="28" fill="#DDF3E8" stroke="#FFFFFF" stroke-width="1"/><rect x="430" y="48" width="54" height="28" fill="#E3EBFF" stroke="#FFFFFF" stroke-width="1"/><rect x="430" y="98" width="54" height="28" fill="#DDF3E8" stroke="#FFFFFF" stroke-width="1"/><rect x="490" y="48" width="54" height="28" fill="#E3EBFF" stroke="#FFFFFF" stroke-width="1"/><rect x="490" y="98" width="54" height="28" fill="#DDF3E8" stroke="#FFFFFF" stroke-width="1"/><rect x="550" y="48" width="54" height="28" fill="#E3EBFF" stroke="#FFFFFF" stroke-width="1"/><rect x="550" y="98" width="54" height="28" fill="#FDE8DD" stroke="#FFFFFF" stroke-width="1"/><rect x="610" y="48" width="54" height="28" fill="#E3EBFF" stroke="#FFFFFF" stroke-width="1"/><rect x="610" y="98" width="54" height="28" fill="#DDF3E8" stroke="#FFFFFF" stroke-width="1"/><rect x="670" y="48" width="54" height="28" fill="#E3EBFF" stroke="#FFFFFF" stroke-width="1"/><rect x="670" y="98" width="54" height="28" fill="#DDF3E8" stroke="#FFFFFF" stroke-width="1"/><rect x="730" y="48" width="54" height="28" fill="#E3EBFF" stroke="#FFFFFF" stroke-width="1"/><rect x="730" y="98" width="54" height="28" fill="#FDE8DD" stroke="#FFFFFF" stroke-width="1"/><rect x="130" y="168" width="654" height="28" rx="2" fill="#F3F5F8" stroke="#D5DBE4" stroke-width="1.5"/><text x="20" y="26" text-anchor="start" font-size="12" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">题目：3 盒笔，每盒 12 支，又买了 7 支，一共几支？　学生自己写出的答案：</text><text x="120" y="66" text-anchor="end" font-size="11" font-weight="700" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">学生的 token</text><text x="120" y="116" text-anchor="end" font-size="11" font-weight="700" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">OPD：教师逐个打分</text><text x="120" y="186" text-anchor="end" font-size="11" font-weight="700" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">强化学习：只看结果</text><text x="157" y="67" text-anchor="middle" font-size="13" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">3</text><text x="157" y="117" text-anchor="middle" font-size="11" font-weight="400" fill="#26805A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">-0.1</text><text x="217" y="67" text-anchor="middle" font-size="13" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">×</text><text x="217" y="117" text-anchor="middle" font-size="11" font-weight="400" fill="#26805A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">-0.2</text><text x="277" y="67" text-anchor="middle" font-size="13" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">12</text><text x="277" y="117" text-anchor="middle" font-size="11" font-weight="400" fill="#26805A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">-0.1</text><text x="337" y="67" text-anchor="middle" font-size="13" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">=</text><text x="337" y="117" text-anchor="middle" font-size="11" font-weight="400" fill="#26805A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">-0.1</text><text x="397" y="67" text-anchor="middle" font-size="13" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">36</text><text x="397" y="117" text-anchor="middle" font-size="11" font-weight="400" fill="#26805A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">-0.2</text><text x="457" y="67" text-anchor="middle" font-size="13" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">，</text><text x="457" y="117" text-anchor="middle" font-size="11" font-weight="400" fill="#26805A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">-0.3</text><text x="517" y="67" text-anchor="middle" font-size="13" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">36</text><text x="517" y="117" text-anchor="middle" font-size="11" font-weight="400" fill="#26805A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">-0.2</text><text x="577" y="67" text-anchor="middle" font-size="13" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">−</text><text x="577" y="117" text-anchor="middle" font-size="11" font-weight="700" fill="#C2501A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">-2.9</text><text x="637" y="67" text-anchor="middle" font-size="13" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">7</text><text x="637" y="117" text-anchor="middle" font-size="11" font-weight="400" fill="#26805A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">-0.4</text><text x="697" y="67" text-anchor="middle" font-size="13" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">=</text><text x="697" y="117" text-anchor="middle" font-size="11" font-weight="400" fill="#26805A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">-0.2</text><text x="757" y="67" text-anchor="middle" font-size="13" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">29</text><text x="757" y="117" text-anchor="middle" font-size="11" font-weight="700" fill="#C2501A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">-1.8</text><text x="577" y="146" text-anchor="middle" font-size="10.5" font-weight="600" fill="#C2501A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">教师在这里会写“+”</text><text x="457" y="187" text-anchor="middle" font-size="11" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">整条答案只得一个奖励：答案 29 不对，记 0。哪一步错了，信号里看不出来</text><text x="20" y="230" text-anchor="start" font-size="11" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">每个格子是教师对这个 token 的对数概率减去学生自己的对数概率（逐 token 的反向 KL 取负），越负说明教师越不会这样写。</text><text x="20" y="252" text-anchor="start" font-size="11" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">学生走偏的那一步（把“又买了”算成减法）得到最低的分，训练就知道该改哪里；轨迹是学生自己写的，所以学的正是它会走偏的地方。</text><text x="440" y="290" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">示意：题目和数字是虚构的</text></svg>
