<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 316" width="900" height="316" role="img" aria-label="记忆的存储载体光谱"><defs><marker id="ah-b5carriers" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6577"/></marker></defs><rect x="0" y="0" width="900" height="316" fill="#ffffff"/><path d="M152,102 L163.6,102" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-b5carriers)"/><path d="M297.6,102 L309.2,102" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-b5carriers)"/><path d="M443.2,102 L454.8,102" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-b5carriers)"/><path d="M588.8,102 L600.4,102" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-b5carriers)"/><path d="M734.4,102 L746,102" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-b5carriers)"/><path d="M860,188 L40,188" fill="none" stroke="#26805A" stroke-width="1.6" marker-end="url(#ah-b5carriers)"/><path d="M40,222 L860,222" fill="none" stroke="#B83560" stroke-width="1.6" marker-end="url(#ah-b5carriers)"/><rect x="20" y="50" width="132" height="104" rx="5" fill="#E9EDF3" stroke="#47546A" stroke-width="1.5"/><rect x="165.6" y="50" width="132" height="104" rx="5" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.5"/><rect x="311.2" y="50" width="132" height="104" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><rect x="456.8" y="50" width="132" height="104" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="602.4" y="50" width="132" height="104" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="748" y="50" width="132" height="104" rx="5" fill="#FDE8DD" stroke="#C2501A" stroke-width="1.5"/><rect x="20" y="240" width="860" height="60" rx="5" fill="#F3F5F8" stroke="#D5DBE4" stroke-width="1"/><text x="20" y="24" text-anchor="start" font-size="12" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">从左到右，记忆离可读的外部文字越来越远，离模型内部的计算越来越近</text><text x="86" y="74" text-anchor="middle" font-size="12" font-weight="700" fill="#47546A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">外部文字</text><text x="30" y="98" text-anchor="start" font-size="10.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">文件、数据库（三.1 至</text><text x="30" y="113.225" text-anchor="start" font-size="10.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">三.4）</text><text x="231.6" y="74" text-anchor="middle" font-size="12" font-weight="700" fill="#B86E00" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Co-LMLM</text><text x="175.6" y="98" text-anchor="start" font-size="10.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">预训练中就把事实外部</text><text x="175.6" y="113.225" text-anchor="start" font-size="10.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">化，查询键连续、文本</text><text x="175.6" y="128.45" text-anchor="start" font-size="10.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">值可读</text><text x="377.2" y="74" text-anchor="middle" font-size="12" font-weight="700" fill="#B83560" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">测试时训练</text><text x="321.2" y="98" text-anchor="start" font-size="10.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">先挑相关片段，再用它</text><text x="321.2" y="113.225" text-anchor="start" font-size="10.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">们临时更新参数</text><text x="522.8" y="74" text-anchor="middle" font-size="12" font-weight="700" fill="#5B45B0" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Memory Decoder</text><text x="466.8" y="98" text-anchor="start" font-size="10.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">与推理模型分开扩展的</text><text x="466.8" y="113.225" text-anchor="start" font-size="10.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">参数化记忆模块</text><text x="668.4" y="74" text-anchor="middle" font-size="12" font-weight="700" fill="#5B45B0" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Metis</text><text x="612.4" y="98" text-anchor="start" font-size="10.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">原生记忆：持续演化的</text><text x="612.4" y="113.225" text-anchor="start" font-size="10.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">内部状态，模型自己读</text><text x="612.4" y="128.45" text-anchor="start" font-size="10.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">写</text><text x="814" y="74" text-anchor="middle" font-size="12" font-weight="700" fill="#C2501A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">计算结构</text><text x="758" y="98" text-anchor="start" font-size="10.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Memory Attention ·</text><text x="758" y="113.225" text-anchor="start" font-size="10.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">快权重 · SketchSSM</text><text x="450" y="182" text-anchor="middle" font-size="11" font-weight="500" fill="#26805A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" style="paint-order:stroke;stroke-width:4px;stroke-linejoin:round" stroke="#ffffff">越往左：越容易逐条查看、纠正、删除和归因</text><text x="450" y="216" text-anchor="middle" font-size="11" font-weight="500" fill="#B83560" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" style="paint-order:stroke;stroke-width:4px;stroke-linejoin:round" stroke="#ffffff">越往右：越能参与端到端优化，也更依赖模型改造与训练</text><text x="36" y="262" text-anchor="start" font-size="11" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">比较时先拆成三个环节：知识怎样保存、查询接口是什么、生成时怎样使用；再看归因、删除和迁移。</text><text x="36" y="282" text-anchor="start" font-size="11" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">同样叫“记忆”，Memory Attention 复用的是 token 表征，和“保存用户经历”处在不同层次。</text></svg>
