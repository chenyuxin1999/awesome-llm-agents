tart" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">视频帧、音频、应用会话</text><text x="32" y="128" text-anchor="start" font-size="12" font-weight="700" fill="#47546A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">LightMem-Ego</text><text x="32" y="146" text-anchor="start" font-size="10.2" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">第一人称视觉与音频对齐到同一条时间线，记忆分当前、短期、长期三层，按查询选层检索</text><text x="848.5" y="136" text-anchor="middle" font-size="10.5" font-weight="500" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">长期</text><text x="801.5" y="136" text-anchor="middle" font-size="10.5" font-weight="500" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">短期</text><text x="754.5" y="136" text-anchor="middle" font-size="10.5" font-weight="500" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">当前</text><text x="32" y="184" text-anchor="start" font-size="12" font-weight="700" fill="#5B45B0" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">StreamTTT</text><text x="32" y="202" text-anchor="start" font-size="10.2" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">在线更新的快权重保存久远的视频历史，较短的 KV 窗口留给当前画面</text><text x="840.1" y="192" text-anchor="middle" font-size="10.5" font-weight="500" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">KV 窗口</text><text x="753.2" y="192" text-anchor="middle" font-size="10.5" font-weight="500" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">快权重：久远历史</text><text x="32" y="240" text-anchor="start" font-size="12" font-weight="700" fill="#B86E00" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">OneStreamer</text><text x="32" y="258" text-anchor="start" font-size="10.2" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">学习生成带时间戳的局部描述和事件摘要，并学习何时从等待转为主动回应</text><text x="838" y="248" text-anchor="middle" font-size="10.5" font-weight="500" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">主动回应</text><text x="770" y="248" text-anchor="middle" font-size="10.5" font-weight="500" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">事件摘要</text><text x="696.75" y="248" text-anchor="middle" font-size="10.5" font-weight="500" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">时间戳描述</text><text x="32" y="296" text-anchor="start" font-size="12" font-weight="700" fill="#B83560" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">VoiceMem</text><text x="32" y="314" text-anchor="start" font-size="10.2" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">语音交互里分信息和情感两条通路，流式读写，满足实时时延</text><text x="838" y="304" text-anchor="middle" font-size="10.5" font-weight="500" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">情感通路</text><text x="770" y="304" text-anchor="middle" font-size="10.5" font-weight="500" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">信息通路</text><text x="32" y="352" text-anchor="start" font-size="12" font-weight="700" fill="#26805A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">GraphMemix</text><text x="32" y="370" text-anchor="start" font-size="10.2" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">按查询组织“证据森林”，在预算内挑选支持当前问题的片段和关系</text><text x="838" y="360" text-anchor="middle" font-size="10.5" font-weight="500" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">证据子图</text><text x="780.5" y="360" text-anchor="middle" font-size="10.5" font-weight="500" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">查询</text><text x="36" y="412" text-anchor="start" font-size="10.5" font-weight="500" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">MobileMem：一年的手机经历测知识更新、时间推理和隐式偏好；看过的未必该永久保留，检索得到的也未必允许用于任何任务</text></svg>
