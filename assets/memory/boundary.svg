<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380" role="img" aria-label="边界：记得多和记得对"><defs><marker id="ah-boundary" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6577"/></marker></defs><rect x="0" y="0" width="900" height="380" fill="#ffffff"/><path d="M200,238 L237,238" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-boundary)"/><path d="M420,238 L457,238" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-boundary)"/><path d="M640,238 L677,238" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-boundary)"/><rect x="20" y="68" width="102" height="40" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="132" y="68" width="102" height="40" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="244" y="68" width="102" height="40" rx="5" fill="#FDE8DD" stroke="#C2501A" stroke-width="1.5"/><rect x="356" y="68" width="102" height="40" rx="5" fill="#FDE8DD" stroke="#C2501A" stroke-width="1.5"/><rect x="468" y="68" width="102" height="40" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="600" y="44" width="280" height="118" rx="6" fill="#F3F5F8" stroke="#D5DBE4" stroke-width="1"/><rect x="20" y="212" width="180" height="52" rx="5" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.5"/><rect x="240" y="212" width="180" height="52" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><rect x="460" y="212" width="180" height="52" rx="5" fill="#E9EDF3" stroke="#47546A" stroke-width="1.5"/><rect x="680" y="212" width="180" height="52" rx="5" fill="#E9EDF3" stroke="#47546A" stroke-width="1.5"/><rect x="20" y="304" width="860" height="60" rx="5" fill="#FDE8DD" stroke="#C2501A" stroke-width="1"/><text x="20" y="24" text-anchor="start" font-size="12" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">能存、能取，离“能正确地更新”和“能真正忘掉”还有很长的距离</text><text x="20" y="56" text-anchor="start" font-size="12" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">LongMemEval（2024）的五种能力</text><text x="71" y="91.565" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">信息抽取</text><text x="183" y="91.565" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">跨会话推理</text><text x="295" y="91.565" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">时间推理</text><text x="407" y="91.565" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">知识更新</text><text x="519" y="91.565" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">拒答</text><text x="20" y="130" text-anchor="start" font-size="10.5" font-weight="500" fill="#C2501A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">橙色两项尤其难：系统要知道“哪条信息现在仍然有效”</text><text x="20" y="148" text-anchor="start" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">跨越持续交互时，商业助手和长上下文模型准确率下降约 30%</text><text x="614" y="66" text-anchor="start" font-size="12" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">2026：问题搬进真实环境</text><text x="614" y="88" text-anchor="start" font-size="10.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Agent-Native Memory：存储、抽取、</text><text x="614" y="106" text-anchor="start" font-size="10.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">检索路由、维护四方面拆解</text><text x="614" y="128" text-anchor="start" font-size="10.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">LongMemEval-V2：网页与企业环境，</text><text x="614" y="146" text-anchor="start" font-size="10.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">工作经验、环境陷阱、前提识别</text><text x="20" y="196" text-anchor="start" font-size="12" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">怎样真正忘掉：删掉原始记录，派生出来的东西还在</text><text x="110" y="234.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">原始记录</text><text x="110" y="249.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">v2 那组数据</text><text x="330" y="234.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">摘要</text><text x="330" y="249.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">“结果在 v2”</text><text x="220" y="230" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" style="paint-order:stroke;stroke-width:4px;stroke-linejoin:round" stroke="#ffffff">派生</text><text x="550" y="234.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">图关系</text><text x="550" y="249.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">实验 → v2</text><text x="440" y="230" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" style="paint-order:stroke;stroke-width:4px;stroke-linejoin:round" stroke="#ffffff">派生</text><text x="770" y="234.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">权重</text><text x="770" y="249.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">蒸馏进参数</text><text x="660" y="230" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" style="paint-order:stroke;stroke-width:4px;stroke-linejoin:round" stroke="#ffffff">派生</text><text x="110" y="286" text-anchor="middle" font-size="11" font-weight="700" fill="#26805A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">删除 ✓</text><text x="330" y="286" text-anchor="middle" font-size="11" font-weight="700" fill="#C2501A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">影响仍在？</text><text x="550" y="286" text-anchor="middle" font-size="11" font-weight="700" fill="#C2501A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">影响仍在？</text><text x="770" y="286" text-anchor="middle" font-size="11" font-weight="700" fill="#C2501A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">影响仍在？</text><text x="36" y="326" text-anchor="start" font-size="11" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">“可恢复”和“可删除”常常互相拉扯：Manus 和 Anthropic 要求压缩可恢复，Letta 说 token 空间里删掉 token 就是遗忘，</text><text x="36" y="346" text-anchor="start" font-size="11" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">可一旦记忆被摘要、被派生成图关系、被蒸馏进权重，删除一条原始记录就未必能消除它的全部影响。</text></svg>
