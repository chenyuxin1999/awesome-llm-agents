<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="880" height="430" role="img" aria-label="书桌、档案柜和参数：记忆放在哪里"><defs><marker id="ah-overviewdesk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6577"/></marker></defs><rect x="0" y="0" width="880" height="430" fill="#ffffff"/><path d="M140,128 L177,128" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-overviewdesk)"/><path d="M345,246 L345,285" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-overviewdesk)"/><path d="M440,314 L560,314 L560,250 L513,200" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-overviewdesk)"/><path d="M597,110 L513,110" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-overviewdesk)"/><path d="M513,150 L597,150" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-overviewdesk)"/><path d="M160,369 L300,342" fill="none" stroke="#5A6577" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#ah-overviewdesk)"/><path d="M450,369 L380,343" fill="none" stroke="#5A6577" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#ah-overviewdesk)"/><path d="M731,369 L731,301" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-overviewdesk)"/><rect x="20" y="96" width="120" height="64" rx="5" fill="#E3EBFF" stroke="#2B57C9" stroke-width="1.5"/><rect x="180" y="50" width="330" height="196" rx="5" fill="#DCEFF1" stroke="#0E6E7E" stroke-width="1.5"/><rect x="196" y="84" width="298" height="34" rx="5" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1.5"/><rect x="196" y="124" width="298" height="34" rx="5" fill="#E9EDF3" stroke="#47546A" stroke-width="1.5"/><rect x="196" y="164" width="298" height="34" rx="5" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.5"/><rect x="196" y="204" width="298" height="30" rx="5" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1.5"/><rect x="250" y="288" width="190" height="52" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="600" y="50" width="262" height="248" rx="5" fill="#E9EDF3" stroke="#47546A" stroke-width="1.5"/><rect x="614" y="86" width="234" height="42" rx="4" fill="#FFFFFF" stroke="#47546A" stroke-width="1"/><rect x="614" y="136" width="234" height="42" rx="4" fill="#FFFFFF" stroke="#47546A" stroke-width="1"/><rect x="614" y="186" width="234" height="42" rx="4" fill="#FFFFFF" stroke="#47546A" stroke-width="1"/><rect x="614" y="236" width="234" height="42" rx="4" fill="#FFFFFF" stroke="#47546A" stroke-width="1"/><rect x="20" y="372" width="280" height="48" rx="5" fill="#E9EDF3" stroke="#47546A" stroke-width="1.5"/><rect x="320" y="372" width="260" height="48" rx="5" fill="#F3F5F8" stroke="#D5DBE4" stroke-width="1.5"/><rect x="600" y="372" width="262" height="48" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><text x="20" y="24" text-anchor="start" font-size="12" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">模型这一次能直接看到的只有桌面；其余的记忆要么在档案柜里等着被搬回来，要么已经长进了参数和推理状态里</text><text x="80" y="117.23" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">当前请求</text><text x="80" y="132.29" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">“帮我重画</text><text x="80" y="146.78" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">第四章的图”</text><text x="345" y="72" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0E6E7E" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">上下文窗口（桌面）</text><text x="345" y="104.41" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">系统指令与预加载的规则文件</text><text x="345" y="144.41" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">可改写的记忆块</text><text x="345" y="184.41" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">最近的消息与工具输出</text><text x="345" y="222.41" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">这一次取回的资料</text><text x="345" y="310.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">模型推理</text><text x="345" y="325.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">只读桌面，参数不变</text><text x="560" y="330" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" style="paint-order:stroke;stroke-width:4px;stroke-linejoin:round" stroke="#ffffff">回答、行动</text><text x="731" y="72" text-anchor="middle" font-size="12.5" font-weight="700" fill="#47546A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">外部记忆（档案柜）</text><text x="626" y="104" text-anchor="start" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">完整对话历史</text><text x="626" y="120" text-anchor="start" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">可按需搜索</text><text x="626" y="154" text-anchor="start" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">文件与笔记</text><text x="626" y="170" text-anchor="start" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">agent 自己读写</text><text x="626" y="204" text-anchor="start" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">摘要与事件</text><text x="626" y="220" text-anchor="start" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">加工过的记录</text><text x="626" y="254" text-anchor="start" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">向量库 / 图数据库</text><text x="626" y="270" text-anchor="start" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">按相似度或关系检索</text><text x="555" y="100" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" style="paint-order:stroke;stroke-width:4px;stroke-linejoin:round" stroke="#ffffff">检索：搬回桌面</text><text x="555" y="142" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" style="paint-order:stroke;stroke-width:4px;stroke-linejoin:round" stroke="#ffffff">写入：存出去</text><text x="160" y="392.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">参数记忆</text><text x="160" y="407.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">训练形成的熟练度，不能逐条改写</text><text x="450" y="392.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">推理中间状态</text><text x="450" y="407.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">KV 缓存、循环状态、快权重</text><text x="30" y="356" text-anchor="start" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">训练才会改变</text><text x="462" y="356" text-anchor="start" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">随输入变化，未必能还原成文字</text><text x="731" y="392.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">维护</text><text x="731" y="407.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">修改、合并、过期、删除</text></svg>
