<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" width="880" height="360" role="img" aria-label="记忆读写的五个环节"><defs><marker id="ah-rwcycle" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6577"/></marker></defs><rect x="0" y="0" width="880" height="360" fill="#ffffff"/><line x1="93" y1="128" x2="93" y2="168" stroke="#C2501A" stroke-width="1" stroke-dasharray="3 3"/><path d="M166,99 L187,99" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-rwcycle)"/><line x1="263" y1="128" x2="263" y2="168" stroke="#C2501A" stroke-width="1" stroke-dasharray="3 3"/><path d="M336,99 L357,99" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-rwcycle)"/><line x1="433" y1="128" x2="433" y2="168" stroke="#C2501A" stroke-width="1" stroke-dasharray="3 3"/><path d="M506,99 L527,99" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-rwcycle)"/><line x1="603" y1="128" x2="603" y2="168" stroke="#C2501A" stroke-width="1" stroke-dasharray="3 3"/><path d="M676,99 L697,99" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-rwcycle)"/><line x1="773" y1="128" x2="773" y2="168" stroke="#C2501A" stroke-width="1" stroke-dasharray="3 3"/><path d="M773,70 L773,50 L93,50 L93,67" fill="none" stroke="#5A6577" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#ah-rwcycle)"/><rect x="20" y="70" width="146" height="58" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><rect x="20" y="168" width="146" height="54" rx="4" fill="#FDE8DD" stroke="#C2501A" stroke-width="1"/><rect x="190" y="70" width="146" height="58" rx="5" fill="#E9EDF3" stroke="#47546A" stroke-width="1.5"/><rect x="190" y="168" width="146" height="54" rx="4" fill="#FDE8DD" stroke="#C2501A" stroke-width="1"/><rect x="360" y="70" width="146" height="58" rx="5" fill="#E3EBFF" stroke="#2B57C9" stroke-width="1.5"/><rect x="360" y="168" width="146" height="54" rx="4" fill="#FDE8DD" stroke="#C2501A" stroke-width="1"/><rect x="530" y="70" width="146" height="58" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="530" y="168" width="146" height="54" rx="4" fill="#FDE8DD" stroke="#C2501A" stroke-width="1"/><rect x="700" y="70" width="146" height="58" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><rect x="700" y="168" width="146" height="54" rx="4" fill="#FDE8DD" stroke="#C2501A" stroke-width="1"/><rect x="20" y="246" width="840" height="98" rx="6" fill="#F3F5F8" stroke="#D5DBE4" stroke-width="1"/><text x="20" y="24" text-anchor="start" font-size="12" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">目标：被问到“结果放在哪”时答出 results_v3。答错时，病根可能落在五个环节中的任何一个</text><text x="93" y="95.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">写入</text><text x="93" y="110.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">该不该记下“改放 v3”</text><text x="93" y="186" text-anchor="middle" font-size="10.5" font-weight="600" fill="#C2501A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">这里出错</text><text x="93" y="203" text-anchor="middle" font-size="10.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">“改放 v3”这句压根没存</text><text x="263" y="95.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">组织</text><text x="263" y="110.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">v3 这条要不要连到 v2 上</text><text x="263" y="186" text-anchor="middle" font-size="10.5" font-weight="600" fill="#C2501A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">这里出错</text><text x="263" y="203" text-anchor="middle" font-size="10.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">v3 与 v2 两条互不知道对方</text><text x="433" y="95.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">检索</text><text x="433" y="110.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">被问起时取回哪一条</text><text x="433" y="186" text-anchor="middle" font-size="10.5" font-weight="600" fill="#C2501A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">这里出错</text><text x="433" y="203" text-anchor="middle" font-size="10.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">取回的恰好是第一周的 v2</text><text x="603" y="95.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">应用</text><text x="603" y="110.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">取回的 v3 用不用来作答</text><text x="603" y="186" text-anchor="middle" font-size="10.5" font-weight="600" fill="#C2501A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">这里出错</text><text x="603" y="203" text-anchor="middle" font-size="10.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">取回了 v3，却被旧规则压过</text><text x="773" y="95.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">维护</text><text x="773" y="110.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">把 v2 标作废或删掉</text><text x="773" y="186" text-anchor="middle" font-size="10.5" font-weight="600" fill="#C2501A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">这里出错</text><text x="773" y="203" text-anchor="middle" font-size="10.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">v2 作废后没有标记失效</text><text x="433" y="45" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" style="paint-order:stroke;stroke-width:4px;stroke-linejoin:round" stroke="#ffffff">维护后的内容进入下一次写入与检索</text><text x="36" y="270" text-anchor="start" font-size="12" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">同一个错误答案，病根不同，药方也不同</text><text x="36" y="294" text-anchor="start" font-size="11" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">写入漏了：要改写入规则；检索偏了：要改查询或索引；应用错了：要让模型看到来源和时间；</text><text x="36" y="314" text-anchor="start" font-size="11" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">维护缺位：要能标出“哪条已被替代”。换一个更快的向量数据库，只能治其中检索这一种。</text></svg>
