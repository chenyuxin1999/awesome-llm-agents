<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 270" width="880" height="270" role="img" aria-label="检索增强生成（RAG）"><defs><marker id="ah-s1rag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6577"/></marker></defs><rect x="0" y="0" width="880" height="270" fill="#ffffff"/><path d="M130,98 L167,98" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-s1rag)"/><path d="M320,98 L367,98" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-s1rag)"/><path d="M540,98 L587,98" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-s1rag)"/><path d="M710,98 L747,98" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-s1rag)"/><path d="M805,134 L805,169" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-s1rag)"/><path d="M455,180 L455,149" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-s1rag)"/><rect x="20" y="70" width="110" height="56" rx="5" fill="#E3EBFF" stroke="#2B57C9" stroke-width="1.5"/><rect x="170" y="62" width="150" height="72" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="370" y="50" width="170" height="96" rx="5" fill="#E9EDF3" stroke="#47546A" stroke-width="1.5"/><rect x="590" y="62" width="120" height="72" rx="5" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.5"/><rect x="750" y="62" width="110" height="72" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="750" y="172" width="110" height="44" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="370" y="180" width="170" height="50" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><rect x="20" y="172" width="320" height="72" rx="5" fill="#F3F5F8" stroke="#D5DBE4" stroke-width="1"/><text x="20" y="24" text-anchor="start" font-size="12" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">RAG（2020）：先从外部索引里找相关段落，再让生成模型据此作答；知识不必全部压进参数</text><text x="75" y="94.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">问题</text><text x="75" y="109.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">模型没见过的事实</text><text x="245" y="87.23" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">检索器</text><text x="245" y="102.29" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">把问题编码成向量</text><text x="245" y="116.78" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">（预训练的神经检索器）</text><text x="455" y="79.985" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">外部索引</text><text x="455" y="95.045" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">维基百科的稠密向量索引</text><text x="455" y="109.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">= 非参数记忆</text><text x="455" y="124.025" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">近似最近邻：HNSW、FAISS…</text><text x="650" y="94.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">前 k 个段落</text><text x="650" y="109.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">相关的原文片段</text><text x="805" y="87.23" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">生成模型</text><text x="805" y="102.29" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">seq2seq</text><text x="805" y="116.78" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">= 参数记忆</text><text x="344" y="90" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" style="paint-order:stroke;stroke-width:4px;stroke-linejoin:round" stroke="#ffffff">查询</text><text x="805" y="197.72" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">答案</text><text x="455" y="201.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">更新知识</text><text x="455" y="216.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">只需更新索引，模型不动</text><text x="32" y="194" text-anchor="start" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">两种用法（论文对比了两者）</text><text x="32" y="214" text-anchor="start" font-size="11" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">整段回答共用同一批段落</text><text x="32" y="232" text-anchor="start" font-size="11" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">每生成一个 token 都可以换用不同段落</text><text x="590" y="236" text-anchor="start" font-size="10.5" font-weight="500" fill="#C2501A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">查的是别人写好的静态资料，还没碰到 agent 自己的经历</text></svg>
