<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" width="900" height="450" role="img" aria-label="在 token 空间里持续学习"><defs><marker id="ah-s5tokenlearning" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6577"/></marker></defs><rect x="0" y="0" width="900" height="450" fill="#ffffff"/><path d="M110,252 L180,271" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-s5tokenlearning)"/><path d="M330,252 L262,271" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-s5tokenlearning)"/><path d="M520,248 L520,259" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-s5tokenlearning)"/><path d="M608,248 L608,259" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-s5tokenlearning)"/><path d="M554,277 L571,277" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-s5tokenlearning)"/><path d="M696,248 L696,259" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-s5tokenlearning)"/><path d="M642,277 L659,277" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-s5tokenlearning)"/><rect x="20" y="46" width="250" height="112" rx="5" fill="#F3F5F8" stroke="#D5DBE4" stroke-width="1.5"/><rect x="34" y="82" width="106" height="64" rx="5" fill="#E9EDF3" stroke="#47546A" stroke-width="1.5"/><rect x="150" y="82" width="106" height="64" rx="5" fill="#DCEFF1" stroke="#0E6E7E" stroke-width="1.5"/><rect x="290" y="46" width="290" height="112" rx="5" fill="#FDE8DD" stroke="#C2501A" stroke-width="1"/><rect x="600" y="46" width="280" height="112" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1"/><rect x="20" y="202" width="180" height="50" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="240" y="202" width="180" height="50" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><rect x="130" y="274" width="180" height="46" rx="5" fill="#E9EDF3" stroke="#47546A" stroke-width="1.5"/><rect x="470" y="202" width="410" height="140" rx="6" fill="#F3F5F8" stroke="#D5DBE4" stroke-width="1"/><rect x="486" y="214" width="68" height="34" rx="5" fill="#E3EBFF" stroke="#2B57C9" stroke-width="1.5"/><rect x="486" y="262" width="68" height="30" rx="5" fill="#E9EDF3" stroke="#47546A" stroke-width="1.5"/><rect x="574" y="214" width="68" height="34" rx="5" fill="#E3EBFF" stroke="#2B57C9" stroke-width="1.5"/><rect x="574" y="262" width="68" height="30" rx="5" fill="#E9EDF3" stroke="#47546A" stroke-width="1.5"/><rect x="662" y="214" width="68" height="34" rx="5" fill="#E3EBFF" stroke="#2B57C9" stroke-width="1.5"/><rect x="662" y="262" width="68" height="30" rx="5" fill="#E9EDF3" stroke="#47546A" stroke-width="1.5"/><rect x="486" y="302" width="380" height="30" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><rect x="20" y="378" width="860" height="56" rx="5" fill="#F3F5F8" stroke="#D5DBE4" stroke-width="1"/><text x="20" y="24" text-anchor="start" font-size="12" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Letta 的判断：agent 由权重和上下文两部分组成，从经验中学习的主要途径应当是更新学到的上下文</text><text x="145" y="68" text-anchor="middle" font-size="12.5" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">agent = 权重 + 上下文</text><text x="87" y="106" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">权重</text><text x="87" y="126" text-anchor="middle" font-size="10.5" font-weight="400" fill="#C2501A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">持续学习难</text><text x="203" y="106" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">学到的上下文</text><text x="203" y="126" text-anchor="middle" font-size="10.5" font-weight="400" fill="#26805A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">本阶段的重点</text><text x="304" y="68" text-anchor="start" font-size="11.5" font-weight="700" fill="#C2501A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">在权重上学，绕不开的老问题</text><text x="304" y="90" text-anchor="start" font-size="10.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">· 灾难性遗忘</text><text x="304" y="108" text-anchor="start" font-size="10.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">· 难以替代精心设计的训练流程</text><text x="304" y="126" text-anchor="start" font-size="10.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">· 用户数据混进共享权重的隐私风险</text><text x="304" y="144" text-anchor="start" font-size="10.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">· 强化学习奖励稀疏</text><text x="614" y="68" text-anchor="start" font-size="11.5" font-weight="700" fill="#26805A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">写成 token 的好处</text><text x="614" y="90" text-anchor="start" font-size="10.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">· 人读得懂</text><text x="614" y="108" text-anchor="start" font-size="10.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">· 可以随模型升级迁移</text><text x="614" y="126" text-anchor="start" font-size="10.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">· 遗忘只需删除 token</text><text x="614" y="144" text-anchor="start" font-size="10.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">· 能版本化和回滚</text><text x="20" y="190" text-anchor="start" font-size="12" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Sleep-time：整理放到后台</text><text x="110" y="223.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">前台 agent</text><text x="110" y="238.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">和用户对话、做任务</text><text x="330" y="223.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">sleep-time 智能体</text><text x="330" y="238.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">空闲时推理、整理记忆</text><text x="220" y="300.72" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">共享的记忆块</text><text x="330" y="268" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" style="paint-order:stroke;stroke-width:4px;stroke-linejoin:round" stroke="#ffffff">异步改写</text><text x="220" y="342" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">问题来时少算、快答（Sleep-time Compute）</text><text x="470" y="190" text-anchor="start" font-size="12" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">记忆模型：token 空间里的元学习（2026，立场文章）</text><text x="520" y="234.41" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">任务 1</text><text x="520" y="280.255" text-anchor="middle" font-size="10.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">记忆</text><text x="608" y="234.41" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">任务 2</text><text x="608" y="280.255" text-anchor="middle" font-size="10.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">记忆</text><text x="696" y="234.41" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">任务 3</text><text x="696" y="280.255" text-anchor="middle" font-size="10.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">记忆</text><text x="760" y="228" text-anchor="start" font-size="11" font-weight="700" fill="#5B45B0" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">内循环</text><text x="760" y="248" text-anchor="start" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">带着记忆依次做任务</text><text x="760" y="266" text-anchor="start" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">边做边更新记忆</text><text x="676" y="320.255" text-anchor="middle" font-size="10.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">外循环：根据下游奖励用强化学习更新记忆模型本身</text><text x="780" y="360" text-anchor="middle" font-size="10.5" font-weight="400" fill="#C2501A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">文中尚无实验数字</text><text x="36" y="400" text-anchor="start" font-size="11" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">也不否定权重：两者互补，参数记忆效率更高，积累在 token 空间的记忆也可以通过合成数据蒸馏进权重。</text><text x="36" y="420" text-anchor="start" font-size="11" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Letta 的说法是“权重是暂时的，学到的上下文才会留下来”。</text></svg>
