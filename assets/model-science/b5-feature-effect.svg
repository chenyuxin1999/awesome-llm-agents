ill="#C2501A"/><circle cx="427.333" cy="98.2871" r="2.6" fill="#C2501A"/><circle cx="426.772" cy="134.03" r="2.6" fill="#C2501A"/><circle cx="432.797" cy="124.027" r="2.6" fill="#C2501A"/><circle cx="436.006" cy="157.947" r="2.6" fill="#C2501A"/><circle cx="356.573" cy="98.3308" r="2.6" fill="#C2501A"/><circle cx="432.418" cy="177.771" r="2.6" fill="#C2501A"/><circle cx="383.13" cy="133.155" r="2.6" fill="#C2501A"/><circle cx="422.75" cy="121.162" r="2.6" fill="#C2501A"/><circle cx="396.219" cy="120.515" r="2.6" fill="#C2501A"/><circle cx="396.822" cy="145.415" r="2.6" fill="#C2501A"/><rect x="520" y="80" width="110" height="40" rx="5" fill="#E3EBFF" stroke="#2B57C9" stroke-width="1.5"/><rect x="520" y="136" width="110" height="40" rx="5" fill="#E3EBFF" stroke="#2B57C9" stroke-width="1.5"/><rect x="660" y="104" width="90" height="48" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="776" y="104" width="96" height="48" rx="5" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.5"/><text x="20" y="24" text-anchor="start" font-size="12" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">看得懂一个特征，和朝它的方向推就能可靠地改变行为，是两回事</text><text x="26" y="64" text-anchor="start" font-size="12.5" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">移除同一个 SAE 特征</text><text x="93" y="100.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">同一个特征</text><text x="93" y="115.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">在不同语境里移除</text><text x="336" y="64" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">输出 logit 的变化云</text><text x="260" y="212" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0E6E7E" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">值类特征</text><text x="260" y="230" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">事实属性等静态信息</text><text x="260" y="248" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">效应更有结构，常跨几个方向</text><text x="412" y="212" text-anchor="middle" font-size="11.5" font-weight="700" fill="#C2501A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">指针类特征</text><text x="412" y="230" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">随语境变化的操作</text><text x="412" y="248" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">效应弥散</text><text x="252" y="284" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">一致的一维效应很少见：能当可复用方向的特征不多</text><text x="252" y="304" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Sparse Autoencoders Encode Both Concepts and Functions</text><text x="518" y="64" text-anchor="start" font-size="12.5" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">两段文本流混在一起输入</text><text x="575" y="103.72" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">文本流 A</text><text x="575" y="159.72" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">文本流 B</text><text x="705" y="124.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">同一次</text><text x="705" y="139.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">前向计算</text><text x="824" y="124.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">输出分布</text><text x="824" y="139.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">约等于两者平均</text><text x="696" y="212" text-anchor="middle" font-size="10.8" font-weight="500" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">这里的叠加是输入输出实验，</text><text x="696" y="230" text-anchor="middle" font-size="10.8" font-weight="500" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">和玩具模型里的特征叠加是两个概念</text><text x="696" y="258" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">预训练越往后，线性越弱；轻量微调能恢复</text><text x="696" y="276" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">引导解码可从一次前向得到两段连贯续写</text><text x="696" y="304" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Your Transformer Can Hold Two Thoughts at Once</text></svg>
