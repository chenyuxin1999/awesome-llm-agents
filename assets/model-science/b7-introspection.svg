<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350" width="900" height="350" role="img" aria-label="内省检测的两类注意力头与知道和会用的差距"><defs><marker id="ah-b7introspection" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6577"/></marker></defs><rect x="0" y="0" width="900" height="350" fill="#ffffff"/><rect x="12" y="40" width="480" height="296" rx="6" fill="#F3F5F8" stroke="#D5DBE4" stroke-width="1"/><path d="M230,194 L267,194" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-b7introspection)"/><path d="M370,220 L300,239" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-b7introspection)"/><rect x="504" y="40" width="384" height="296" rx="6" fill="#F3F5F8" stroke="#D5DBE4" stroke-width="1"/><path d="M670,104 L709,104" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-b7introspection)"/><path d="M792,128 L792,165" fill="none" stroke="#C2501A" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#ah-b7introspection)"/><path d="M712,192 L673,192" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-b7introspection)"/><rect x="28" y="96" width="38" height="28" rx="4" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1.2"/><rect x="72" y="96" width="38" height="28" rx="4" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1.2"/><rect x="116" y="96" width="38" height="28" rx="4" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1.2"/><rect x="160" y="96" width="38" height="28" rx="4" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1.2"/><rect x="204" y="96" width="38" height="28" rx="4" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1.2"/><rect x="248" y="96" width="38" height="28" rx="4" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1.2"/><rect x="292" y="96" width="38" height="28" rx="4" fill="#FCE4EC" stroke="#B83560" stroke-width="1.2"/><rect x="336" y="96" width="38" height="28" rx="4" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1.2"/><rect x="380" y="96" width="38" height="28" rx="4" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1.2"/><rect x="424" y="96" width="38" height="28" rx="4" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1.2"/><rect x="40" y="168" width="190" height="52" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="270" y="168" width="200" height="52" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="150" y="242" width="210" height="40" rx="5" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.5"/><rect x="520" y="80" width="150" height="48" rx="5" fill="#E3EBFF" stroke="#2B57C9" stroke-width="1.5"/><rect x="712" y="80" width="160" height="48" rx="5" fill="#E9EDF3" stroke="#47546A" stroke-width="1.5"/><rect x="712" y="168" width="160" height="48" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="520" y="168" width="150" height="48" rx="5" fill="#FDE8DD" stroke="#C2501A" stroke-width="1.5"/><rect x="520" y="244" width="352" height="40" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><text x="20" y="24" text-anchor="start" font-size="12" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">把“能察觉”拆成可检验的部件；把“记住了”和“用得上”分开测</text><text x="26" y="64" text-anchor="start" font-size="12.5" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">受控内省任务</text><text x="28" y="84" text-anchor="start" font-size="10.8" font-weight="500" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">输入文字固定，十个位置中的一个注入概念向量，或者不注入</text><text x="47" y="115" text-anchor="middle" font-size="10.5" font-weight="500" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">1</text><text x="91" y="115" text-anchor="middle" font-size="10.5" font-weight="500" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">2</text><text x="135" y="115" text-anchor="middle" font-size="10.5" font-weight="500" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">3</text><text x="179" y="115" text-anchor="middle" font-size="10.5" font-weight="500" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">4</text><text x="223" y="115" text-anchor="middle" font-size="10.5" font-weight="500" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">5</text><text x="267" y="115" text-anchor="middle" font-size="10.5" font-weight="500" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">6</text><text x="311" y="115" text-anchor="middle" font-size="10.5" font-weight="500" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">7</text><text x="355" y="115" text-anchor="middle" font-size="10.5" font-weight="500" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">8</text><text x="399" y="115" text-anchor="middle" font-size="10.5" font-weight="500" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">9</text><text x="443" y="115" text-anchor="middle" font-size="10.5" font-weight="500" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">10</text><text x="311" y="142" text-anchor="middle" font-size="10" font-weight="600" fill="#B83560" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">注入</text><text x="135" y="190.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">中层的门控头</text><text x="135" y="205.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">决定报不报告“有变化”</text><text x="370" y="190.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">较后层的路由头</text><text x="370" y="205.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">选出要报告的位置</text><text x="255" y="265.72" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">报告：第 7 个位置 / 没有干预</text><text x="252" y="306" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">干预门控头，即使路由头有位置信息，也能压住报告</text><text x="252" y="324" text-anchor="middle" font-size="10.5" font-weight="600" fill="#26805A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">要补测：无干预时的误报、未见概念、不同扰动幅度</text><text x="518" y="64" text-anchor="start" font-size="12.5" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">知道和会用之间的差距</text><text x="595" y="107.72" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">微调注入新知识</text><text x="792" y="100.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">已经记住</text><text x="792" y="115.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">表示存在较晚的层</text><text x="792" y="188.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">中间层</text><text x="792" y="203.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">真正做计算的地方</text><text x="784" y="150" text-anchor="end" font-size="10" font-weight="600" fill="#C2501A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">没被路由过去</text><text x="595" y="195.72" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">多跳推理用不上</text><text x="696" y="267.72" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">表示自蒸馏：把晚层的表示对齐到中间层</text><text x="696" y="306" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">作者报告：Qwen 上多跳串联准确率接近翻倍，记忆保持不变</text><text x="696" y="324" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Knowing-Using Gap</text></svg>
