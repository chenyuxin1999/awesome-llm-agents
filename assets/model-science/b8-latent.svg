<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" role="img" aria-label="测试时潜在推理与该分开记录的量"><defs><marker id="ah-b8latent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6577"/></marker></defs><rect x="0" y="0" width="900" height="330" fill="#ffffff"/><rect x="12" y="40" width="876" height="168" rx="6" fill="#F3F5F8" stroke="#D5DBE4" stroke-width="1"/><path d="M178,100 L209,100" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-b8latent)"/><path d="M362,100 L393,100" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-b8latent)"/><path d="M566,100 L597,100" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-b8latent)"/><path d="M730,100 L761,100" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-b8latent)"/><path d="M818,126 L818,168 L287,168 L287,129" fill="none" stroke="#B83560" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#ah-b8latent)"/><rect x="28" y="74" width="150" height="52" rx="5" fill="#E3EBFF" stroke="#2B57C9" stroke-width="1.5"/><rect x="212" y="74" width="150" height="52" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><rect x="396" y="74" width="170" height="52" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="600" y="74" width="130" height="52" rx="5" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.5"/><rect x="764" y="74" width="108" height="52" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="20" y="252" width="206" height="40" rx="5" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.5"/><rect x="238" y="252" width="206" height="40" rx="5" fill="#E3EBFF" stroke="#2B57C9" stroke-width="1.5"/><rect x="456" y="252" width="206" height="40" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><rect x="674" y="252" width="206" height="40" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><text x="20" y="24" text-anchor="start" font-size="12" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">GradCuit：在选定层插入可优化的潜在状态，整段续写的奖励沿可微路径回传给它，模型权重全程冻结</text><text x="103" y="103.72" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">提示的隐藏状态</text><text x="287" y="96.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">可优化的潜在状态</text><text x="287" y="111.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">插在选定的层</text><text x="481" y="96.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">其余 Transformer 层</text><text x="481" y="111.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">权重冻结</text><text x="665" y="103.72" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">续写的每个词元</text><text x="818" y="103.72" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">结果奖励</text><text x="552" y="162" text-anchor="middle" font-size="10.8" font-weight="600" fill="#B83560" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" style="paint-order:stroke;stroke-width:4px;stroke-linejoin:round" stroke="#ffffff">奖励加权的梯度直接分配给潜在状态</text><text x="450" y="196" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">以往方法只能经由解码出的文本间接联系潜在状态</text><text x="20" y="236" text-anchor="start" font-size="12.5" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">评价潜在推理时，分开记下这几样</text><text x="123" y="275.41" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">可见 token 有没有减少</text><text x="341" y="275.41" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">实际延迟有没有减少</text><text x="559" y="275.41" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">测试时梯度计算花了多少</text><text x="777" y="275.41" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">潜在状态的学习信号从哪来</text><text x="450" y="318" text-anchor="middle" font-size="10.8" font-weight="500" fill="#C2501A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">看不见的中间表示，不会自动对应更深或更可靠的思考</text></svg>
