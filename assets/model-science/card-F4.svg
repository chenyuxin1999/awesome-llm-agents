<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 176" width="560" height="176" role="img" aria-label="Scaling Monosemanticity 结构"><defs><marker id="ah-cardf4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6577"/></marker></defs><rect x="0" y="0" width="560" height="176" fill="#ffffff"/><path d="M127.5,55 L150.5,55" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-cardf4)"/><path d="M267,55 L290,55" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-cardf4)"/><path d="M406.5,55 L429.5,55" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-cardf4)"/><rect x="14" y="106" width="532" height="44" rx="4" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.2" stroke-dasharray="4 3"/><rect x="14" y="16" width="113.5" height="78" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="153.5" y="16" width="113.5" height="78" rx="5" fill="#DCEFF1" stroke="#0E6E7E" stroke-width="1.5"/><rect x="293" y="16" width="113.5" height="78" rx="5" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.5"/><rect x="432.5" y="16" width="113.5" height="78" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><text x="26" y="123" text-anchor="start" font-size="10.2" font-weight="500" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">训练信号：激活自己：大量文本跑过 Claude 3 Sonnet 时收集来，要求重构回去</text><text x="26" y="141" text-anchor="start" font-size="10.2" font-weight="500" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">训练目标：重构得准，同时每次亮的特征尽量少</text><text x="70.75" y="43.73" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">取 Claude 3</text><text x="70.75" y="59.6" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Sonnet 的激活</text><text x="70.75" y="73.97" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">生产级模型的中间层</text><text x="210.25" y="44.765" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">训练大字典</text><text x="210.25" y="59.135" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">最多约 3400 万个特</text><text x="210.25" y="72.935" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">征</text><text x="349.75" y="44.765" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">找到可命名的特征</text><text x="349.75" y="59.135" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">金门大桥、不安全代</text><text x="349.75" y="72.935" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">码、谄媚</text><text x="489.25" y="51.665" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">钳制一个特征</text><text x="489.25" y="66.035" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">调到最大激活的 10 倍</text><text x="280" y="166" text-anchor="middle" font-size="10.5" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">钳住金门大桥特征，模型自称是金门大桥；约 65% 的特征几乎从不激活</text></svg>
