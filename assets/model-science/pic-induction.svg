<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-label="诱导头在一串真实 token 上做什么"><rect x="0" y="0" width="900" height="300" fill="#ffffff"/><defs><marker id="ar-ms-ind" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6577"/></marker></defs><text x="20" y="28" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="14" fill="#18202C" text-anchor="start" font-weight="bold">诱导头怎样续写：前面出现过 “Harry Potter”，后来又遇到 “Harry”（示意）</text><rect x="22" y="120" width="54" height="30" rx="3" fill="#E3EBFF" stroke="#2B57C9" stroke-width="1.2"/><text x="49.0" y="140" font-family="Menlo, Consolas, PingFang SC, Noto Sans CJK SC, monospace" font-size="12" fill="#2B57C9" text-anchor="middle" font-weight="normal">The</text><rect x="82" y="120" width="54" height="30" rx="3" fill="#E3EBFF" stroke="#2B57C9" stroke-width="1.2"/><text x="109.0" y="140" font-family="Menlo, Consolas, PingFang SC, Noto Sans CJK SC, monospace" font-size="12" fill="#2B57C9" text-anchor="middle" font-weight="normal">boy</text><rect x="142" y="120" width="54" height="30" rx="3" fill="#E3EBFF" stroke="#2B57C9" stroke-width="1.2"/><text x="169.0" y="140" font-family="Menlo, Consolas, PingFang SC, Noto Sans CJK SC, monospace" font-size="12" fill="#2B57C9" text-anchor="middle" font-weight="normal">named</text><rect x="202" y="120" width="54" height="30" rx="3" fill="#E3EBFF" stroke="#2B57C9" stroke-width="1.2"/><text x="229.0" y="140" font-family="Menlo, Consolas, PingFang SC, Noto Sans CJK SC, monospace" font-size="12" fill="#2B57C9" text-anchor="middle" font-weight="normal">Harry</text><rect x="262" y="120" width="54" height="30" rx="3" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.2"/><text x="289.0" y="140" font-family="Menlo, Consolas, PingFang SC, Noto Sans CJK SC, monospace" font-size="12" fill="#B86E00" text-anchor="middle" font-weight="normal">Potter</text><rect x="322" y="120" width="54" height="30" rx="3" fill="#E3EBFF" stroke="#2B57C9" stroke-width="1.2"/><text x="349.0" y="140" font-family="Menlo, Consolas, PingFang SC, Noto Sans CJK SC, monospace" font-size="12" fill="#2B57C9" text-anchor="middle" font-weight="normal">lived</text><rect x="382" y="120" width="54" height="30" rx="3" fill="#E3EBFF" stroke="#2B57C9" stroke-width="1.2"/><text x="409.0" y="140" font-family="Menlo, Consolas, PingFang SC, Noto Sans CJK SC, monospace" font-size="12" fill="#2B57C9" text-anchor="middle" font-weight="normal">under</text><rect x="442" y="120" width="54" height="30" rx="3" fill="#E3EBFF" stroke="#2B57C9" stroke-width="1.2"/><text x="469.0" y="140" font-family="Menlo, Consolas, PingFang SC, Noto Sans CJK SC, monospace" font-size="12" fill="#2B57C9" text-anchor="middle" font-weight="normal">the</text><rect x="502" y="120" width="54" height="30" rx="3" fill="#E3EBFF" stroke="#2B57C9" stroke-width="1.2"/><text x="529.0" y="140" font-family="Menlo, Consolas, PingFang SC, Noto Sans CJK SC, monospace" font-size="12" fill="#2B57C9" text-anchor="middle" font-weight="normal">stairs</text><rect x="562" y="120" width="54" height="30" rx="3" fill="#E3EBFF" stroke="#2B57C9" stroke-width="1.2"/><text x="589.0" y="140" font-family="Menlo, Consolas, PingFang SC, Noto Sans CJK SC, monospace" font-size="12" fill="#2B57C9" text-anchor="middle" font-weight="normal">.</text><rect x="622" y="120" width="54" height="30" rx="3" fill="#E3EBFF" stroke="#2B57C9" stroke-width="1.2"/><text x="649.0" y="140" font-family="Menlo, Consolas, PingFang SC, Noto Sans CJK SC, monospace" font-size="12" fill="#2B57C9" text-anchor="middle" font-weight="normal">One</text><rect x="682" y="120" width="54" height="30" rx="3" fill="#E3EBFF" stroke="#2B57C9" stroke-width="1.2"/><text x="709.0" y="140" font-family="Menlo, Consolas, PingFang SC, Noto Sans CJK SC, monospace" font-size="12" fill="#2B57C9" text-anchor="middle" font-weight="normal">day</text><rect x="742" y="120" width="54" height="30" rx="3" fill="#E3EBFF" stroke="#2B57C9" stroke-width="1.2"/><text x="769.0" y="140" font-family="Menlo, Consolas, PingFang SC, Noto Sans CJK SC, monospace" font-size="12" fill="#2B57C9" text-anchor="middle" font-weight="normal">,</text><rect x="802" y="120" width="54" height="30" rx="3" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.2"/><text x="829.0" y="140" font-family="Menlo, Consolas, PingFang SC, Noto Sans CJK SC, monospace" font-size="12" fill="#5B45B0" text-anchor="middle" font-weight="normal">Harry</text><path d="M290.0,120 C290.0,80 230.0,80 230.0,116" fill="none" stroke="#B86E00" stroke-width="1.6" marker-end="url(#ar-ms-ind)"/><text x="260.0" y="74" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="12" fill="#B86E00" text-anchor="start" font-weight="normal">① 前一层的头：在 Potter 这个位置记下“我前面是 Harry”</text><path d="M830.0,150 C830.0,210 290.0,210 290.0,154" fill="none" stroke="#5B45B0" stroke-width="1.6" marker-end="url(#ar-ms-ind)"/><text x="330" y="220" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="12" fill="#5B45B0" text-anchor="start" font-weight="normal">② 诱导头：当前是 Harry，就去找“前面是 Harry”的位置，找到 Potter</text><rect x="866" y="120" width="0" height="0" rx="4" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1.2"/><text x="20" y="260" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="12.5" fill="#18202C" text-anchor="start" font-weight="normal">③ 把那个位置的 token 复制过来，作为下一个 token 的预测：</text><rect x="430" y="244" width="110" height="30" rx="3" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.2"/><text x="485" y="264" font-family="Menlo, Consolas, PingFang SC, Noto Sans CJK SC, monospace" font-size="13" fill="#5B45B0" text-anchor="middle" font-weight="normal">Potter</text><text x="560" y="264" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="12" fill="#5A6577" text-anchor="start" font-weight="normal">不更新任何参数，照着上文“学会”了这个搭配</text></svg>
