<rect x="16" y="292" width="868" height="96" rx="5" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.2" stroke-dasharray="4 3"/><text x="30" y="316" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="12.5" fill="#B86E00" text-anchor="start" font-weight="bold">更新信号从哪来：这一步每个专家实际分到了多少 token，由路由统计直接数出来</text><text x="30" y="340" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="12" fill="#18202C" text-anchor="start" font-weight="normal">怎么改：分多了就把它的偏置减一个固定值，分少了就加一个（DeepSeek 的做法，相当于固定步长的积分控制）</text><text x="30" y="364" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="12" fill="#18202C" text-anchor="start" font-weight="normal">目标：各专家分到的 token 差不多；ID Balancing 在此之外加一项看失衡变化速度的修正，只在失衡变坏时启用</text></svg>
