t="normal">2.38</text><text x="598.0" y="297.5908445978692" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="11.5" fill="#C2501A" text-anchor="start" font-weight="normal">2.28</text><circle cx="666" cy="80" r="6" fill="#2B57C9" stroke="none" stroke-width="1"/><text x="680" y="85" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="12" fill="#18202C" text-anchor="start" font-weight="normal">四个小规模训练的实测损失</text><line x1="660" y1="110" x2="674" y2="110" stroke="#26805A" stroke-width="2"/><text x="680" y="115" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="12" fill="#18202C" text-anchor="start" font-weight="normal">形式一：损失 = 下限 + 幂律项</text><line x1="660" y1="140" x2="674" y2="140" stroke="#C2501A" stroke-width="2" stroke-dasharray="6 4"/><text x="680" y="145" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="12" fill="#18202C" text-anchor="start" font-weight="normal">形式二：纯幂律，没有下限</text><circle cx="666" cy="170" r="7" fill="#ffffff" stroke="#B86E00" stroke-width="2.5"/><text x="680" y="175" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="12" fill="#18202C" text-anchor="start" font-weight="normal">没参与拟合的规模上实测一次</text><text x="660" y="215" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="12" fill="#18202C" text-anchor="start" font-weight="normal">在灰色范围里两条曲线都贴着四个点，</text><text x="660" y="237" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="12" fill="#18202C" text-anchor="start" font-weight="normal">拟合得一样好；</text><text x="660" y="259" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="12" fill="#18202C" text-anchor="start" font-weight="normal">到 10²² 和 10²³，两种形式给出不同的预测。</text><text x="660" y="289" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="12" fill="#B86E00" text-