<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360" role="img" aria-label="5 个特征挤进 2 个神经元"><rect x="0" y="0" width="900" height="360" fill="#ffffff"/><defs><marker id="ar-ms-sup" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6577"/></marker></defs><text x="20" y="28" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="14" fill="#18202C" text-anchor="start" font-weight="bold">叠加：5 个特征挤进 2 个神经元，每个特征是平面上的一个方向（玩具模型里的五边形，特征名为示意）</text><line x1="50" y1="200" x2="350" y2="200" stroke="#D5DBE4" stroke-width="1"/><line x1="200" y1="350" x2="200" y2="50" stroke="#D5DBE4" stroke-width="1"/><text x="352" y="204" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="11" fill="#5A6577" text-anchor="start" font-weight="normal">神经元 1</text><text x="206" y="346" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="11" fill="#5A6577" text-anchor="start" font-weight="normal">神经元 2（竖轴）</text><line x1="200" y1="200" x2="314.12678195541844" y2="162.91796067500633" stroke="#B86E00" stroke-width="2.2" marker-end="url(#ar-ms-sup)"/><text x="327.4415731835506" y="162.59172275375704" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="12.5" fill="#B86E00" text-anchor="start" font-weight="bold">猫</text><line x1="200" y1="200" x2="200.0" y2="80.0" stroke="#5B45B0" stroke-width="2.2" marker-end="url(#ar-ms-sup)"/><text x="200.0" y="70.0" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="12.5" fill="#5B45B0" text-anchor="middle" font-weight="bold">某种字体</text><line x1="200" y1="200" x2="85.87321804458158" y2="162.9179606750063" stroke="#2B57C9" stroke-width="2.2" marker-end="url(#ar-ms-sup)"/><text x="72.55842681644943" y="162.59172275375704" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="12.5" fill="#2B57C9" text-anchor="end" font-weight="bold">法语</text><line x1="200" y1="200" x2="129.46576972490323" y2="297.0820393249937" stroke="#26805A" stroke-width="2.2" marker-end="url(#ar-ms-sup)"/><text x="121.23677619280859" y="312.40827724624296" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="12.5" fill="#26805A" text-anchor="end" font-weight="bold">代码</text><line x1="200" y1="200" x2="270.5342302750968" y2="297.08203932499373" stroke="#B83560" stroke-width="2.2" marker-end="url(#ar-ms-sup)"/><text x="278.76322380719137" y="312.40827724624296" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="12.5" fill="#B83560" text-anchor="start" font-weight="bold">金额</text><path d="M238.04226065180615,187.6393202250021 A40,40 0 0,0 200,160" fill="none" stroke="#5A6577" stroke-width="1"/><text x="230" y="154" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="11" fill="#5A6577" text-anchor="start" font-weight="normal">72°</text><text x="430" y="70" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="13" fill="#18202C" text-anchor="start" font-weight="bold">某个特征单独出现时，两个神经元的读数</text><text x="430" y="96" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="12" fill="#5A6577" text-anchor="start" font-weight="normal">特征</text><text x="560" y="96" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="12" fill="#5A6577" text-anchor="start" font-weight="normal">神经元 1</text><text x="660" y="96" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="12" fill="#5A6577" text-anchor="start" font-weight="normal">神经元 2</text><text x="430" y="124" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="12.5" fill="#B86E00" text-anchor="start" font-weight="bold">猫</text><rect x="550" y="107" width="80" height="24" rx="3" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.2"/><text x="590" y="124" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="12" fill="#B86E00" text-anchor="middle" font-weight="normal">+0.95</text><rect x="650" y="107" width="80" height="24" rx="3" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.2"/><text x="690" y="124" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="12" fill="#B86E00" text-anchor="middle" font-weight="normal">+0.31</text><text x="430" y="152" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="12.5" fill="#5B45B0" text-anchor="start" font-weight="bold">某种字体</text><rect x="550" y="135" width="80" height="24" rx="3" fill="#F3F5F8" stroke="#D5DBE4" stroke-width="1.2"/><text x="590" y="152" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="12" fill="#5A6577" text-anchor="middle" font-weight="normal">+0.00</text><rect x="650" y="135" width="80" height="24" rx="3" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.2"/><text x="690" y="152" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="12" fill="#B86E00" text-anchor="middle" font-weight="normal">+1.00</text><text x="430" y="180" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="12.5" fill="#2B57C9" text-anchor="start" font-weight="bold">法语</text><rect x="550" y="163" width="80" height="24" rx="3" fill="#F3F5F8" stroke="#D5DBE4" stroke-width="1.2"/><text x="590" y="180" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="12" fill="#5A6577" text-anchor="middle" font-weight="normal">-0.95</text><rect x="650" y="163" width="80" height="24" rx="3" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.2"/><text x="690" y="180" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="12" fill="#B86E00" text-anchor="middle" font-weight="normal">+0.31</text><text x="430" y="208" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="12.5" fill="#26805A" text-anchor="start" font-weight="bold">代码</text><rect x="550" y="191" width="80" height="24" rx="3" fill="#F3F5F8" stroke="#D5DBE4" stroke-width="1.2"/><text x="590" y="208" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="12" fill="#5A6577" text-anchor="middle" font-weight="normal">-0.59</text><rect x="650" y="191" width="80" height="24" rx="3" fill="#F3F5F8" stroke="#D5DBE4" stroke-width="1.2"/><text x="690" y="208" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="12" fill="#5A6577" text-anchor="middle" font-weight="normal">-0.81</text><text x="430" y="236" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="12.5" fill="#B83560" text-anchor="start" font-weight="bold">金额</text><rect x="550" y="219" width="80" height="24" rx="3" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.2"/><text x="590" y="236" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="12" fill="#B86E00" text-anchor="middle" font-weight="normal">+0.59</text><rect x="650" y="219" width="80" height="24" rx="3" fill="#F3F5F8" stroke="#D5DBE4" stroke-width="1.2"/><text x="690" y="236" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="12" fill="#5A6577" text-anchor="middle" font-weight="normal">-0.81</text><text x="430" y="282" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="12.5" fill="#C2501A" text-anchor="start" font-weight="normal">神经元 2 对猫、字体、法语都亮：没法给它起一个名字。</text><text x="430" y="306" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="12.5" fill="#18202C" text-anchor="start" font-weight="normal">这 5 个特征很少同时出现，所以互相的串扰（比如 0.31）</text><text x="430" y="328" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="12.5" fill="#18202C" text-anchor="start" font-weight="normal">大多时候可以容忍，网络就用 2 维装下了 5 个特征。</text></svg>
