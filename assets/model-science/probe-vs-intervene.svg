x="754" y="82" width="110" height="44" rx="5" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.5"/><rect x="638" y="162" width="216" height="24" rx="4" fill="#DDF3E8" stroke="#26805A" stroke-width="1"/><rect x="638" y="192" width="216" height="24" rx="4" fill="#DDF3E8" stroke="#26805A" stroke-width="1"/><rect x="638" y="222" width="216" height="24" rx="4" fill="#DDF3E8" stroke="#26805A" stroke-width="1"/><text x="20" y="24" text-anchor="start" font-size="12" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">三种做法问的问题不同：观察问“一起变吗”，探针问“读得出吗”，干预问“改了它，输出会跟着变吗”</text><text x="30" y="64" text-anchor="start" font-size="13" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">观察</text><text x="326" y="64" text-anchor="start" font-size="13" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">探针</text><text x="622" y="64" text-anchor="start" font-size="13" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">干预</text><text x="91" y="100.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">输入</text><text x="91" y="115.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">“法国的首都是”</text><text x="217" y="100.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">某层某个方向</text><text x="217" y="115.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">亮度</text><text x="154" y="185.72" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">输出“巴黎”</text><text x="154" y="236" text-anchor="middle" font-size="10.8" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">记录：说巴黎时这个方向总是很亮</text><text x="154" y="256" text-anchor="middle" font-size="11" font-weight="600" fill="#B86E00" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">证据：统计关联</text><text x="387" y="100.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">隐藏状态</text><text x="387" y="115.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">原模型不动</text><text x="513" y="100.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">简单分类器</text><text x="513" y="115.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">训练来读标签</text><text x="450" y="76" text-anchor="middle" font-size="10.5" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">读取</text><text x="513" y="178.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">未见样本</text><text x="513" y="193.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">预测得准吗</text><text x="450" y="236" text-anchor="middle" font-size="10.8" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">能说明：信息可以从表示里读出</text><text x="450" y="256" text-anchor="middle" font-size="10.8" font-weight="600" fill="#C2501A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">说明不了：模型也沿这条路在用它</text><text x="683" y="100.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">沿方向加扰动</text><text x="683" y="115.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">强度逐渐加大</text><text x="809" y="107.72" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">答案怎样移动</text><text x="746" y="152" text-anchor="middle" font-size="11" font-weight="600" fill="#26805A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">对照（固定输入、层和位置）</text><text x="746" y="178" text-anchor="middle" font-size="10.8" font-weight="500" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">无干预基线</text><text x="746" y="208" text-anchor="middle" font-size="10.8" font-weight="500" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">同等强度的随机方向</text><text x="746" y="238" text-anchor="middle" font-size="10.8" font-weight="500" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">其他任务有没有被顺带破坏</text><text x="746" y="274" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">很多无关方向都能造成类似变化：</text><text x="746" y="292" text-anchor="middle" font-size="10.5" font-weight="600" fill="#C2501A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">多半是一般性损伤</text><text x="746" y="320" text-anchor="middle" font-size="11" font-weight="600" fill="#B83560" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">证据：可控干预</text></svg>
