<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" role="img" aria-label="缩放律研究的四步，用一族小模型演示"><rect x="0" y="0" width="900" height="520" fill="#ffffff"/><defs><marker id="ar-s1-scaling-real" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6577"/></marker></defs><text x="16" y="24" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="13.5" fill="#18202C" text-anchor="start" font-weight="bold">示意：缩放律研究的四步，跟着同一族小模型走一遍；下半部分是固定预算下三份配比结论（损失与拟合式为示意）</text><rect x="16" y="40" width="206" height="200" rx="6" fill="#E3EBFF" stroke="#2B57C9" stroke-width="1.2"/><text x="28" y="62" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="12.5" fill="#2B57C9" text-anchor="start" font-weight="bold">① 选定验证任务</text><rect x="238" y="40" width="206" height="200" rx="6" fill="#E3EBFF" stroke="#2B57C9" stroke-width="1.2"/><text x="250" y="62" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="12.5" fill="#2B57C9" text-anchor="start" font-weight="bold">② 多规模训练</text><line x1="224" y1="140" x2="236" y2="140" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ar-s1-scaling-real)"/><rect x="460" y="40" width="206" height="200" rx="6" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.2"/><text x="472" y="62" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="12.5" fill="#B86E00" text-anchor="start" font-weight="bold">③ 拟合趋势</text><line x1="446" y1="140" x2="458" y2="140" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ar-s1-scaling-real)"/><rect x="682" y="40" width="206" height="200" rx="6" fill="#DDF3E8" stroke="#26805A" stroke-width="1.2"/><text x="694" y="62" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="12.5" fill="#26805A" text-anchor="start" font-weight="bold">④ 留出点检验</text><line x1="668" y1="140" x2="680" y2="140" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ar-s1-scaling-real)"/><text x="28" y="90" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#18202C" text-anchor="start" font-weight="normal">在一份没参与训练的文本上</text><text x="28" y="108" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#18202C" text-anchor="start" font-weight="normal">测交叉熵损失：</text><text x="28" y="126" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#18202C" text-anchor="start" font-weight="normal">模型给正确的下一个 token</text><text x="28" y="144" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#18202C" text-anchor="start" font-weight="normal">分到的概率越高，损失越低</text><rect x="28" y="172" width="182" height="52" rx="3" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1.2"/><text x="36" y="192" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="10" fill="#18202C" text-anchor="start" font-weight="normal">“今天天气很 __”</text><text x="36" y="210" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="10" fill="#18202C" text-anchor="start" font-weight="normal">猜“好”的概率 0.4 → 损失 0.92</text><text x="250" y="90" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#18202C" text-anchor="start" font-weight="normal">每个规模训一个模型：</text><rect x="250" y="100" width="182" height="22" rx="2" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1.2"/><text x="258" y="116" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#18202C" text-anchor="start" font-weight="normal">1000万 参数</text><text x="424" y="116" font-family="Menlo, Consolas, PingFang SC, Noto Sans CJK SC, monospace" font-size="10.5" fill="#18202C" text-anchor="end" font-weight="normal">2.87</text><rect x="250" y="126" width="182" height="22" rx="2" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1.2"/><text x="258" y="142" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#18202C" text-anchor="start" font-weight="normal">3000万 参数</text><text x="424" y="142" font-family="Menlo, Consolas, PingFang SC, Noto Sans CJK SC, monospace" font-size="10.5" fill="#18202C" text-anchor="end" font-weight="normal">2.61</text><rect x="250" y="152" width="182" height="22" rx="2" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1.2"/><text x="258" y="168" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#18202C" text-anchor="start" font-weight="normal">1亿 参数</text><text x="424" y="168" font-family="Menlo, Consolas, PingFang SC, Noto Sans CJK SC, monospace" font-size="10.5" fill="#18202C" text-anchor="end" font-weight="normal">2.40</text><rect x="250" y="178" width="182" height="22" rx="2" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1.2"/><text x="258" y="194" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#18202C" text-anchor="start" font-weight="normal">3亿 参数</text><text x="424" y="194" font-family="Menlo, Consolas, PingFang SC, Noto Sans CJK SC, monospace" font-size="10.5" fill="#18202C" text-anchor="end" font-weight="normal">2.26</text><text x="250" y="226" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="10" fill="#5A6577" text-anchor="start" font-weight="normal">数据量随规模同步加大</text><line x1="478" y1="190" x2="658" y2="190" stroke="#5A6577" stroke-width="1"/><line x1="478" y1="80" x2="478" y2="190" stroke="#5A6577" stroke-width="1"/><path d="M478.0,94.6 L482.5,98.0 L487.0,101.2 L491.5,104.3 L496.0,107.4 L500.5,110.4 L505.0,113.2 L509.5,116.1 L514.0,118.8 L518.5,121.4 L523.0,124.0 L527.5,126.5 L532.0,128.9 L536.5,131.3 L541.0,133.6 L545.5,135.8 L550.0,137.9 L554.5,140.0 L559.0,142.1 L563.5,144.1 L568.0,146.0 L572.5,147.9 L577.0,149.7 L581.5,151.5 L586.0,153.2 L590.5,154.8 L595.0,156.5 L599.5,158.0 L604.0,159.6 L608.5,161.1 L613.0,162.5 L617.5,163.9 L622.0,165.3 L626.5,166.6 L631.0,167.9 L635.5,169.1 L640.0,170.4 L644.5,171.5 L649.0,172.7 L653.5,173.8 L658.0,174.9" fill="none" stroke="#B86E00" stroke-width="1.4" stroke-dasharray="4 3"/><circle cx="478.0" cy="94.63355893743109" r="4" fill="#B86E00" stroke="none" stroke-width="1"/><circle cx="520.9409129247697" cy="122.8207897827357" r="4" fill="#B86E00" stroke="none" stroke-width="1"/><circle cx="568.0" cy="146.0" r="4" fill="#B86E00" stroke="none" stroke-width="1"/><circle cx="610.9409129247697" cy="161.85084474699488" r="4" fill="#B86E00" stroke="none" stroke-width="1"/><text x="472" y="212" font-family="Menlo, Consolas, PingFang SC, Noto Sans CJK SC, monospace" font-size="10.5" fill="#B86E00" text-anchor="start" font-weight="normal">L = 1.8 + 60 · N^(-0.25)</text><text x="472" y="230" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="10" fill="#5A6577" text-anchor="start" font-weight="normal">四个点拟合出的幂律</text><line x1="700" y1="170" x2="870" y2="170" stroke="#5A6577" stroke-width="1"/><line x1="700" y1="80" x2="700" y2="170" stroke="#5A6577" stroke-width="1"/><path d="M700.0,92.0 L704.2,94.7 L708.5,97.3 L712.8,99.9 L717.0,102.4 L721.2,104.8 L725.5,107.2 L729.8,109.5 L734.0,111.7 L738.2,113.9 L742.5,116.0 L746.8,118.0 L751.0,120.0 L755.2,121.9 L759.5,123.8 L763.8,125.6 L768.0,127.4 L772.2,129.1 L776.5,130.8 L780.8,132.4 L785.0,134.0 L789.2,135.5 L793.5,137.0 L797.8,138.5 L802.0,139.9 L806.2,141.2 L810.5,142.6 L814.8,143.9 L819.0,145.1 L823.2,146.3 L827.5,147.5 L831.8,148.7 L836.0,149.8 L840.2,150.9 L844.5,151.9 L848.8,152.9 L853.0,153.9 L857.2,154.9 L861.5,155.8 L865.8,156.7 L870.0,157.6" fill="none" stroke="#B86E00" stroke-width="1.4" stroke-dasharray="4 3"/><circle cx="700.0" cy="91.97291185789817" r="4" fill="#B86E00" stroke="none" stroke-width="1"/><circle cx="740.5553066511713" cy="115.03519164042012" r="4" fill="#B86E00" stroke="none" stroke-width="1"/><circle cx="785.0" cy="134.0" r="4" fill="#B86E00" stroke="none" stroke-width="1"/><circle cx="825.5553066511713" cy="146.968872974814" r="4" fill="#B86E00" stroke="none" stroke-width="1"/><circle cx="870.0" cy="155.6" r="4.5" fill="#ffffff" stroke="#26805A" stroke-width="2"/><text x="694" y="190" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#18202C" text-anchor="start" font-weight="normal">预测 10 亿参数：2.14</text><text x="694" y="207" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#18202C" text-anchor="start" font-weight="normal">实际训出来：2.16</text><text x="694" y="228" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="10" fill="#26805A" text-anchor="start" font-weight="bold">没参与拟合的点也对得上</text><rect x="16" y="256" width="868" height="170" rx="6" fill="#F3F5F8" stroke="#D5DBE4" stroke-width="1.2"/><text x="30" y="280" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="12.5" fill="#18202C" text-anchor="start" font-weight="bold">固定总计算预算时，参数量和数据量在抢同一份资源（计算 ≈ 6 × 参数 × token）</text><rect x="30" y="294" width="268" height="116" rx="5" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.2"/><text x="164" y="316" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="12" fill="#B86E00" text-anchor="middle" font-weight="bold">Kaplan 等 2020</text><text x="164" y="342" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#18202C" text-anchor="middle" font-weight="normal">训练很大的模型、只喂适量数据，</text><text x="164" y="360" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#18202C" text-anchor="middle" font-weight="normal">远未收敛就停下</text><text x="164" y="396" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#5A6577" text-anchor="middle" font-weight="normal">大模型样本效率更高</text><rect x="314" y="294" width="268" height="116" rx="5" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.2"/><text x="448" y="316" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="12" fill="#B86E00" text-anchor="middle" font-weight="bold">Chinchilla 2022</text><text x="448" y="342" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#18202C" text-anchor="middle" font-weight="normal">模型规模和数据规模</text><text x="448" y="360" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#18202C" text-anchor="middle" font-weight="normal">大致同比例增长</text><text x="448" y="396" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#5A6577" text-anchor="middle" font-weight="normal">此前很多大模型训练不足</text><rect x="598" y="294" width="268" height="116" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.2"/><text x="732" y="316" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="12" fill="#26805A" text-anchor="middle" font-weight="bold">复现 2024</text><text x="732" y="342" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#18202C" text-anchor="middle" font-weight="normal">从原图重建数据，重拟第三种方法，</text><text x="732" y="360" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#18202C" text-anchor="middle" font-weight="normal">结果和前两种方法一致</text><text x="732" y="396" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#5A6577" text-anchor="middle" font-weight="normal">原文置信区间窄得不合理</text><text x="16" y="452" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="11" fill="#5A6577" text-anchor="start" font-weight="normal">两份建议的差别藏在实验范围、训练日程和拟合形式里；注意力和嵌入的开销、MoE 只激活部分参数、数据重复，</text><text x="16" y="472" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="11" fill="#5A6577" text-anchor="start" font-weight="normal">都会改变成本估计和观察到的趋势。这一步本身不训练新东西：拟合只是把一条曲线对上这几个点。</text><text x="16" y="500" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="11" fill="#5A6577" text-anchor="start" font-weight="normal">上半部分的模型规模、损失和拟合式都是示意；下半部分三份结论取自原论文。</text></svg>
