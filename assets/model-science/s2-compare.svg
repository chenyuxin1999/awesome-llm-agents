<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 410" width="920" height="410" role="img" aria-label="第二阶段四种做法的对比"><defs><marker id="ah-s2compare" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6577"/></marker></defs><rect x="0" y="0" width="920" height="410" fill="#ffffff"/><rect x="16" y="78" width="110" height="54" rx="4" fill="#F3F5F8" stroke="#D5DBE4" stroke-width="1"/><rect x="136" y="78" width="184.5" height="54" rx="4" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1"/><rect x="330.5" y="78" width="184.5" height="54" rx="4" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1"/><rect x="525" y="78" width="184.5" height="54" rx="4" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1"/><rect x="719.5" y="78" width="184.5" height="54" rx="4" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1"/><rect x="16" y="140" width="110" height="70" rx="4" fill="#F3F5F8" stroke="#D5DBE4" stroke-width="1"/><rect x="136" y="140" width="184.5" height="70" rx="4" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1"/><rect x="330.5" y="140" width="184.5" height="70" rx="4" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1"/><rect x="525" y="140" width="184.5" height="70" rx="4" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1"/><rect x="719.5" y="140" width="184.5" height="70" rx="4" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1"/><rect x="16" y="218" width="110" height="70" rx="4" fill="#F3F5F8" stroke="#D5DBE4" stroke-width="1"/><rect x="136" y="218" width="184.5" height="70" rx="4" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1"/><rect x="330.5" y="218" width="184.5" height="70" rx="4" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1"/><rect x="525" y="218" width="184.5" height="70" rx="4" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1"/><rect x="719.5" y="218" width="184.5" height="70" rx="4" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1"/><rect x="16" y="296" width="110" height="70" rx="4" fill="#F3F5F8" stroke="#D5DBE4" stroke-width="1"/><rect x="136" y="296" width="184.5" height="70" rx="4" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1"/><rect x="330.5" y="296" width="184.5" height="70" rx="4" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1"/><rect x="525" y="296" width="184.5" height="70" rx="4" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1"/><rect x="719.5" y="296" width="184.5" height="70" rx="4" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1"/><rect x="136" y="40" width="184.5" height="30" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><rect x="330.5" y="40" width="184.5" height="30" rx="5" fill="#E3EBFF" stroke="#2B57C9" stroke-width="1.5"/><rect x="525" y="40" width="184.5" height="30" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="719.5" y="40" width="184.5" height="30" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><text x="20" y="26" text-anchor="start" font-size="12.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">一步更新怎样算出来：四种做法拿到的是同一个梯度，差别在怎样把它变成一步</text><text x="228.25" y="60" text-anchor="middle" font-size="11.5" font-weight="700" fill="#B83560" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">逐元素：Adam · AdamW</text><text x="422.75" y="60" text-anchor="middle" font-size="11.5" font-weight="700" fill="#2B57C9" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">改参数化：μP</text><text x="617.25" y="60" text-anchor="middle" font-size="11.5" font-weight="700" fill="#5B45B0" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">当成矩阵：Shampoo · Muon</text><text x="811.75" y="60" text-anchor="middle" font-size="11.5" font-weight="700" fill="#26805A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">约束权重：流形</text><text x="71" y="109" text-anchor="middle" font-size="11" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">每一步决定什么</text><text x="228.25" y="101" text-anchor="middle" font-size="10" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">给每个参数定步长；</text><text x="228.25" y="117" text-anchor="middle" font-size="10" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">AdamW 另外按比例缩小参数</text><text x="422.75" y="101" text-anchor="middle" font-size="10" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">初始化、学习率和输出缩放</text><text x="422.75" y="117" text-anchor="middle" font-size="10" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">随宽度怎样调</text><text x="617.25" y="101" text-anchor="middle" font-size="10" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">把梯度当成矩阵，</text><text x="617.25" y="117" text-anchor="middle" font-size="10" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">按行和列的结构调整</text><text x="811.75" y="101" text-anchor="middle" font-size="10" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">权重本身被约束住，</text><text x="811.75" y="117" text-anchor="middle" font-size="10" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">比如奇异值始终为 1</text><text x="71" y="179" text-anchor="middle" font-size="11" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">训练信号从哪来</text><text x="228.25" y="163" text-anchor="middle" font-size="10" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">这一批数据上的梯度，</text><text x="228.25" y="179" text-anchor="middle" font-size="10" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">加上记下的梯度平均方向</text><text x="228.25" y="195" text-anchor="middle" font-size="10" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">和平均大小</text><text x="422.75" y="163" text-anchor="middle" font-size="10" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">梯度照旧；超参数取自</text><text x="422.75" y="179" text-anchor="middle" font-size="10" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">4000 万参数代理模型上</text><text x="422.75" y="195" text-anchor="middle" font-size="10" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">调出的最优值</text><text x="617.25" y="163" text-anchor="middle" font-size="10" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">梯度矩阵；Shampoo 另积累</text><text x="617.25" y="179" text-anchor="middle" font-size="10" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">左右两份统计，</text><text x="617.25" y="195" text-anchor="middle" font-size="10" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Muon 用动量矩阵</text><text x="811.75" y="179" text-anchor="middle" font-size="10" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">梯度投到流形的切向上</text><text x="71" y="257" text-anchor="middle" font-size="11" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">怎么用</text><text x="228.25" y="257" text-anchor="middle" font-size="10" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">常大的少走，常小的多走</text><text x="422.75" y="249" text-anchor="middle" font-size="10" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">超参数原样搬到</text><text x="422.75" y="265" text-anchor="middle" font-size="10" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">67 亿参数的模型</text><text x="617.25" y="241" text-anchor="middle" font-size="10" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Muon 把奇异值都拉到 1，</text><text x="617.25" y="257" text-anchor="middle" font-size="10" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">相当于谱范数下</text><text x="617.25" y="273" text-anchor="middle" font-size="10" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">走最陡的一步</text><text x="811.75" y="249" text-anchor="middle" font-size="10" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">沿切向走一步再拉回，</text><text x="811.75" y="265" text-anchor="middle" font-size="10" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">学习率直接对应真实步长</text><text x="71" y="335" text-anchor="middle" font-size="11" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">代价</text><text x="228.25" y="319" text-anchor="middle" font-size="10" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">每个参数多存两份状态；</text><text x="228.25" y="335" text-anchor="middle" font-size="10" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">名义学习率相同，</text><text x="228.25" y="351" text-anchor="middle" font-size="10" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">实际步长可能差很远</text><text x="422.75" y="327" text-anchor="middle" font-size="10" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">主要管宽度方向，深度、</text><text x="422.75" y="343" text-anchor="middle" font-size="10" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">批大小和日程要另行检验</text><text x="617.25" y="327" text-anchor="middle" font-size="10" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">预条件矩阵的开销与</text><text x="617.25" y="343" text-anchor="middle" font-size="10" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">数值稳定；收益随调参变</text><text x="811.75" y="319" text-anchor="middle" font-size="10" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">实验只是一个小规模</text><text x="811.75" y="335" text-anchor="middle" font-size="10" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">CIFAR-10 多层感知机；</text><text x="811.75" y="351" text-anchor="middle" font-size="10" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">每一步多出时间开销</text><text x="460" y="392" text-anchor="middle" font-size="11" font-weight="600" fill="#B83560" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">训练信号都是这一批数据上的梯度，所以比较优化器时，先要排除只是有效步长不同</text></svg>
