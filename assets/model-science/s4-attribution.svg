icrosoft YaHei, sans-serif">解释不了的那部分计算</text><text x="686" y="150" text-anchor="start" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">大约四分之一的提示上能给出满意解释</text><text x="686" y="168" text-anchor="start" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">没扩展到约一百个 token 以上的提示</text><text x="686" y="186" text-anchor="start" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">注意力模式怎样算出来，解释不了</text><text x="20" y="222" text-anchor="start" font-size="12.5" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">显微镜看的对象从零件走向功能</text><text x="32" y="258" text-anchor="start" font-size="11.5" font-weight="700" fill="#0E6E7E" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">2025-03 归因图</text><text x="200" y="258" text-anchor="start" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">特征连成回路</text><text x="370" y="258" text-anchor="start" font-size="10.8" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Claude 3.5 Haiku：多步推理、押韵前先想好词、算术、幻觉、拒答</text><text x="32" y="298" text-anchor="start" font-size="11.5" font-weight="700" fill="#B83560" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">2025-10 内省</text><text x="200" y="298" text-anchor="start" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">能否觉察注入的概念</text><text x="370" y="298" text-anchor="start" font-size="10.8" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Claude Opus 4.1 与 4 在合适层和强度下约 20% 的时候能察觉</text><text x="32" y="338" text-anchor="start" font-size="11.5" font