<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" width="880" height="320" role="img" aria-label="诱导头在损失曲线上留下的鼓包"><defs><marker id="ah-startinduction" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6577"/></marker></defs><rect x="0" y="0" width="880" height="320" fill="#ffffff"/><rect x="226" y="60" width="64" height="196" fill="#DCEFF1" opacity="0.6"/><rect x="540" y="44" width="324" height="226" rx="6" fill="#F3F5F8" stroke="#D5DBE4" stroke-width="1"/><path d="M780,130 L780,150 L680,150 L680,129" fill="none" stroke="#5A6577" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#ah-startinduction)"/><path d="M810,126 L810,205 L807,205" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-startinduction)"/><path d="M60,50 L60,260 L500,260" stroke="#5A6577" stroke-width="1.2" fill="none"/><path d="M70,70 C120,110 160,140 200,150 C230,158 245,150 262,168 C280,188 300,200 330,206 C390,218 440,224 495,228" stroke="#B86E00" stroke-width="2.4" fill="none"/><rect x="560" y="92" width="40" height="34" rx="5" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1.5"/><rect x="610" y="92" width="40" height="34" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="660" y="92" width="40" height="34" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="710" y="92" width="40" height="34" rx="5" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1.5"/><rect x="760" y="92" width="40" height="34" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="810" y="92" width="40" height="34" rx="5" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.5"/><rect x="600" y="186" width="204" height="40" rx="5" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.5"/><text x="20" y="24" text-anchor="start" font-size="12" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">示意：一个微观回路在宏观曲线上留下了指纹（曲线形状只作示意，不对应具体数值）</text><text x="500" y="280" text-anchor="end" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">训练步数</text><text x="52" y="54" text-anchor="end" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">损失</text><text x="258" y="80" text-anchor="middle" font-size="11" font-weight="700" fill="#0E6E7E" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">鼓包</text><text x="258" y="98" text-anchor="middle" font-size="10.5" font-weight="500" fill="#0E6E7E" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">诱导头形成</text><text x="380" y="160" text-anchor="middle" font-size="10.5" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">上下文学习能力</text><text x="380" y="176" text-anchor="middle" font-size="10.5" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">同时出现一次跃升</text><text x="556" y="68" text-anchor="start" font-size="12.5" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">诱导头在做什么</text><text x="580" y="112.72" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">…</text><text x="630" y="112.72" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">A</text><text x="680" y="112.72" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">B</text><text x="730" y="112.72" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">…</text><text x="780" y="112.72" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">A</text><text x="830" y="112.72" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">?</text><text x="705" y="166" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">找到上次 A 出现的位置，看它后面跟着什么</text><text x="702" y="202.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">预测 ? = B</text><text x="702" y="217.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">把前文的模式复制过来</text><text x="702" y="254" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">两层注意力组合才能形成</text><text x="20" y="304" text-anchor="start" font-size="10.8" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">In-context Learning and Induction Heads（2022）：小的纯注意力模型上有因果证据，带 MLP 的大模型上是相关证据</text></svg>
