<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 128" width="560" height="128" role="img" aria-label="检测框特征加融合 Transformer 结构"><defs><marker id="u09ah-cardr1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6577"/></marker></defs><rect x="0" y="0" width="560" height="128" fill="#ffffff"/><path d="M127.5,55 L150.5,55" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#u09ah-cardr1)"/><path d="M267,55 L290,55" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#u09ah-cardr1)"/><path d="M406.5,55 L429.5,55" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#u09ah-cardr1)"/><rect x="14" y="16" width="113.5" height="78" rx="5" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.5"/><rect x="153.5" y="16" width="113.5" height="78" rx="5" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.5"/><rect x="293" y="16" width="113.5" height="78" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="432.5" y="16" width="113.5" height="78" rx="5" fill="#E9EDF3" stroke="#47546A" stroke-width="1.5"/><text x="70.75" y="44.765" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">框出物体</text><text x="70.75" y="59.135" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">检测器在图上框出几</text><text x="70.75" y="72.935" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">十个物体</text><text x="210.25" y="44.765" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">每框一个向量</text><text x="210.25" y="59.135" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">只认得检测器学过的</text><text x="210.25" y="72.935" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">几百类</text><text x="349.75" y="37.865" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">框和词一起读</text><text x="349.75" y="52.235" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">BERT 式</text><text x="349.75" y="66.035" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Transformer 同时读</text><text x="349.75" y="79.835" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">框和文字</text><text x="489.25" y="51.665" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">每个任务单独微调</text><text x="489.25" y="66.035" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">问答、指代各练一遍</text><text x="280" y="118" text-anchor="middle" font-size="10.5" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">词能和具体的框对上，但模型只看得到检测器认识的东西</text></svg>
