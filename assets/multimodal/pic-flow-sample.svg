<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="900" height="340" role="img" aria-label="流匹配的一条训练样本" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">
<rect x="0" y="0" width="900" height="340" fill="#ffffff"/>
<defs><marker id="fmsa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6577"/></marker><marker id="fmsr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C2501A"/></marker><marker id="fmsg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#26805A"/></marker><marker id="fmsp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5B45B0"/></marker></defs>
<text x="20" y="26" font-size="14" fill="#18202C" text-anchor="start" font-weight="700">流匹配的一条训练样本：把一张 3×3 的小“照片”和一份噪声混起来，让网络猜速度（数字为示意）</text>
