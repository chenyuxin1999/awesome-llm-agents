<text x="200" y="146" font-size="20" fill="#5A6577" text-anchor="middle">+</text>
<line x1="360" y1="140" x2="455" y2="140" stroke="#5A6577" stroke-width="1.4" marker-end="url(#fmsa)"/>
<text x="408" y="128" font-size="11" fill="#5A6577" text-anchor="middle">三成照片</text>
<text x="408" y="160" font-size="11" fill="#5A6577" text-anchor="middle">加七成噪声</text>
<line x1="610" y1="140" x2="676" y2="140" stroke="#26805A" stroke-width="1.4" marker-end="url(#fmsg)"/>
<text x="643" y="128" font-size="11" fill="#26805A" text-anchor="middle">答案</text>
<text x="643" y="160" font-size="11" fill="#26805A" text-anchor="middle">现成的</text>
<text x="470" y="228" font-size="11" fill="#5A6577" text-anchor="start">左上角这一格：0.3 × 0.9 + 0.7 ×（−1.2）= −0.57</text>
<text x="690" y="246" font-size="11" fill="#5A6577" text-anchor="start">左上角：0.9 −（−1.2）= 2.10</text>
<rect x="20" y="262" width="860" height="66" fill="#F6F7F9" stroke="#E2E6EC" stroke-width="1" rx="8"/>
<text x="36" y="286" font-size="12.5" fill="#18202C" text-anchor="start">网络看到的是第三张小图、时间 t = 0.3 和文字“一只猫”，它要输出一张同样大小的“速度”图，和第四张越接近越好。</text>
<text x="36" y="310" font-size="12.5" fill="#5A6577" text-anchor="start">从噪声沿直线走到照片，每一格每单位时间该变多少，正好就是照片减噪声；这个答案由我们自己构造，用不着人工标注。</text>
</svg>