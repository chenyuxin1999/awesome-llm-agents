<text x="580.0" y="188.0" font-size="10.5" fill="#18202C" text-anchor="middle">−0.21</text>
<text x="690" y="62" font-size="12" fill="#26805A" text-anchor="start" font-weight="700">⑥ 标签：照片减噪声</text>
<rect x="690" y="74" width="44" height="44" fill="#ff8741" stroke="#ffffff" stroke-width="1.5"/>
<text x="712.0" y="100.0" font-size="10.5" fill="#18202C" text-anchor="middle">2.10</text>
<rect x="734" y="74" width="44" height="44" fill="#ffe7d9" stroke="#ffffff" stroke-width="1.5"/>
<text x="756.0" y="100.0" font-size="10.5" fill="#18202C" text-anchor="middle">0.40</text>
<rect x="778" y="74" width="44" height="44" fill="#b9d5ff" stroke="#ffffff" stroke-width="1.5"/>
