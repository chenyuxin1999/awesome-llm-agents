<text x="800.0" y="144.0" font-size="10.5" fill="#18202C" text-anchor="middle">−1.40</text>
<rect x="690" y="162" width="44" height="44" fill="#ffcfb3" stroke="#ffffff" stroke-width="1.5"/>
<text x="712.0" y="188.0" font-size="10.5" fill="#18202C" text-anchor="middle">0.80</text>
<rect x="734" y="162" width="44" height="44" fill="#a5c9ff" stroke="#ffffff" stroke-width="1.5"/>
<text x="756.0" y="188.0" font-size="10.5" fill="#18202C" text-anchor="middle">−0.90</text>
<rect x="778" y="162" width="44" height="44" fill="#ffede2" stroke="#ffffff" stroke-width="1.5"/>
