<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="900" height="440" role="img" aria-label="一次报销的四步轨迹" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">
