<text x="720" y="63" font-size="9.5" fill="#5A6577" text-anchor="start">报销系统 · 结果</text>
<rect x="692" y="80" width="166" height="26" fill="#E3F4EA" stroke="#26805A" stroke-width="1" rx="3"/>
<text x="775" y="97" font-size="11" fill="#26805A" text-anchor="middle" font-weight="700">提交成功</text>
<text x="692" y="126" font-size="10" fill="#5A6577" text-anchor="start">单号 R-0731</text>
<text x="20" y="218" font-size="11.5" fill="#5B45B0" text-anchor="start" font-weight="700">第 1 步</text>
<text x="20" y="238" font-size="11" fill="#C2501A" text-anchor="start" font-family="Menlo, Consolas, monospace">click(84, 63)</text>
<line x1="213" y1="120" x2="237" y2="120" stroke="#5A6577" stroke-width="1.4" marker-end="url(#trja)"/>
<text x="240" y="218" font-size="11.5" fill="#5B45B0" text-anchor="start" font-weight="700">第 2 步</text>
<text x="240" y="238" font-size="11" fill="#C2501A" text-anchor="start" font-family="Menlo, Consolas, monospace">click(60, 78)</text>
<text x="240" y="255" font-size="11" fill="#C2501A" text-anchor="start" font-family="Menlo, Consolas, monospace">type(&quot;1280.00&quot;)</text>
<line x1="433" y1="120" x2="457" y2="120" stroke="#5A6577" stroke-width="1.4" marker-end="url(#trja)"/>
<text x="460" y="218" font-size="11.5" fill="#5B45B0" text-anchor="start" font-weight="700">第 3 步</text>
<text x="460" y="238" font-size="11" fill="#C2501A" text-anchor="start" font-family="Menlo, Consolas, monospace">upload(&quot;hotel.pdf&quot;)</text>
<text x="460" y="255" font-size="11" fill="#C2501A" text-anchor="start" font-family="Menlo, Consolas, monospace">click(170, 111)</text>
<line x1="653" y1="120" x2="677" y2="120" stroke="#5A6577" stroke-width="1.4" marker-end="url(#trja)"/>
<text x="680" y="218" font-size="11.5" fill="#5B45B0" text-anchor="start" font-weight="700">第 4 步</text>
<text x="680" y="238" font-size="11" fill="#26805A" text-anchor="start">读真实记录核对</text>
<text x="20" y="300" font-size="11" fill="#5A6577" text-anchor="start">相邻两张截图之间：电脑执行上一步的动作，再返回一张新截图。</text>
<rect x="680" y="330" width="200" height="50" fill="#E3F4EA" stroke="#26805A" stroke-width="1" rx="6"/>
<text x="690" y="350" font-size="10.5" fill="#26805A" text-anchor="start">R-0731：总额 1280.00，</text>
<text x="690" y="368" font-size="10.5" fill="#26805A" text-anchor="start">附件 1 个，状态 已提交 ✓</text>
<line x1="780" y1="250" x2="780" y2="326" stroke="#26805A" stroke-width="1.4" marker-end="url(#trjg)"/>
<rect x="20" y="330" width="640" height="96" fill="#F6F7F9" stroke="#E2E6EC" stroke-width="1" rx="8"/>
<text x="34" y="352" font-size="12" fill="#18202C" text-anchor="start" font-weight="700">三个容易出错的地方，各挂在一步上：</text>
<text x="34" y="374" font-size="11.5" fill="#B83280" text-anchor="start">看：第 4 步的“提交成功”也可能是上一张旧页面的残影，截图只是软件状态的一个快照。</text>
<text x="34" y="394" font-size="11.5" fill="#B83280" text-anchor="start">点：第 2 步认出了“总额”两个字，还要把点击落在它下面那个输入框里，坐标偏一点就点到了标签上。</text>
<text x="34" y="414" font-size="11.5" fill="#B83280" text-anchor="start">判：“做完了没有”最好去读报销单的真实记录，助手自己说一句“已完成”最不可靠。</text>
</svg>