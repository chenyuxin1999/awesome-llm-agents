le><text x="433.59999999999997" y="50" font-size="12.5" text-anchor="middle" fill="rgb(24, 32, 44)" stroke="none" stop-color="rgb(0, 0, 0)" color="rgb(24, 32, 44)" opacity="1" fill-opacity="1" stroke-opacity="1" font-family="PingFang SC, Noto Sans SC, Microsoft YaHei, sans-serif">统一 tokenizer</text><text x="433.59999999999997" y="66" font-size="12.5" text-anchor="middle" fill="rgb(24, 32, 44)" stroke="none" stop-color="rgb(0, 0, 0)" color="rgb(24, 32, 44)" opacity="1" fill-opacity="1" stroke-opacity="1" font-family="PingFang SC, Noto Sans SC, Microsoft YaHei, sans-serif">（研究中）</text><circle cx="581.2" cy="91" r="7" stroke-width="1.8" fill="rgb(255, 255, 255)" stroke="rgb(24, 32, 44)" stop-color="rgb(0, 0, 0)" color="rgb(24, 32, 44)" opacity="1" fill-opacity="1" stroke-opacity="1"></circle><text x="581.2" y="122" font-size="12.5" text-anchor="middle" fill="rgb(24, 32, 44)" stroke="none" stop-color="rgb(0, 0, 0)" color="rgb(24, 32, 44)" opacity="1" fill-opacity="1" stroke-opacity="1" font-family="PingFang SC, Noto Sans SC, Microsoft YaHei, sans-serif">VQGAN 码本</text><circle cx="712.4" cy="91" r="7" stroke-width="1.8" fill="rgb(255, 255, 255)" stroke="rgb(24, 32, 44)" stop-color="rgb(0, 0, 0)" color="rgb(24, 32, 44)" opacity="1" fill-opacity="1" stroke-opacity="1"></circle><text x="712.4" y="66" font-size="12.5" text-anchor="middle" fill="rgb(24, 32, 44)" stroke="none" stop-color="rgb(0, 0, 0)" color="rgb(24, 32, 44)" opacity="1" fill-opacity="1" stroke-opacity="1" font-family="PingFang SC, Noto Sans SC, Microsoft YaHei, sans-serif">VQ-VAE</text><circle cx="819" cy="91" r="7" stroke-width="1.8" fill="rgb(255, 255, 255)" stroke="rgb(24, 32, 44)" stop-color="rgb(0, 0, 0)" color="rgb(24, 32, 44)" opacity="1" fill-opacity="1" stroke-opacity="1"></circle><text x="819" y="122" font-size="12.5" text-anchor="middle" fill="rgb(24, 32, 44)" stroke="none" stop-color="rgb(0, 0, 0)" color="rgb(24, 32, 44)" opacity="1" fill-opacity="1" stroke-opacity="1" font-family="PingFang SC, No