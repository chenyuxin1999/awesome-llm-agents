22" rx="2" fill="#E9EDF3" stroke="#47546A" stroke-width="1.5"/><rect x="700" y="178" width="24" height="22" rx="2" fill="#E9EDF3" stroke="#47546A" stroke-width="1.5"/><rect x="734" y="178" width="24" height="22" rx="2" fill="#E9EDF3" stroke="#47546A" stroke-width="1.5"/><rect x="768" y="178" width="24" height="22" rx="2" fill="#E9EDF3" stroke="#47546A" stroke-width="1.5"/><text x="22" y="32" text-anchor="start" font-size="12" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">解码顺序：整页逐 token 还是分块并行</text><text x="448" y="32" text-anchor="start" font-size="12" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">缓存大小：随长度增长还是保持恒定</text><text x="24" y="62" text-anchor="start" font-size="11" font-weight="600" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">整页逐 token</text><text x="24" y="112" text-anchor="start" font-size="10.5" font-weight="500" fill="#C2501A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">一页越长，生成步数越多，顺序越慢</text><text x="24" y="142" text-anchor="start" font-size="11" font-weight="600" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">HPD-Parsing</text><text x="70" y="181.41" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">主版面分支</text><text x="272" y="172" text-anchor="start" font-size="10.5" font-weight="500" fill="#26805A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">三个区块同时解码</text><text x="24" y="232" text-anchor="start" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">版面全局分析，区块内容并行；块内再用多 token 预测减少步数</text><text x="450" y="62" text-anchor="start" font-size="11" font-weight="600" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">普通注意力</text><text x="450" y="124" text-anchor="start" font-size="10.5" font-weight="500" fill="#C2501A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">转写的页越多，要缓存的 key 和 value 越多</text><text x="450" y="152" text-anchor="start" font-size="11" font-weight="600" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Unlimited OCR</text><text x="450" y="222" text-anchor="start" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">语言模型的注意力层全换成参考滑动窗口注意力，缓存恒定</text><text x="450" y="240" text-anchor="start" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">编码器沿用 DeepSeek-OCR 的高压缩编码器</text><text x="530" y="44" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif"></text></svg>
