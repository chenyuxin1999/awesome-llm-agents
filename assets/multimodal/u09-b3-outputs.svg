<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350" width="900" height="350" role="img" aria-label="定位的输出粒度与补空间能力的三条路"><defs><marker id="u09ah-u09b3outputs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6577"/></marker></defs><rect x="0" y="0" width="900" height="350" fill="#ffffff"/><rect x="10" y="10" width="880" height="150" rx="6" fill="#F3F5F8" stroke="#D5DBE4" stroke-width="1.5"/><path d="M205,85 L241,85" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#u09ah-u09b3outputs)"/><path d="M420,85 L456,85" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#u09ah-u09b3outputs)"/><path d="M635,85 L671,85" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#u09ah-u09b3outputs)"/><rect x="30" y="50" width="175" height="70" rx="5" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1.5"/><circle cx="70" cy="85" r="5" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.5"/><rect x="245" y="50" width="175" height="70" rx="5" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1.5"/><rect x="263" y="67" width="44" height="36" rx="5" fill="#FFFFFF" stroke="#B86E00" stroke-width="1.5" stroke-dasharray="4 2"/><rect x="460" y="50" width="175" height="70" rx="5" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1.5"/><path d="M486,81 q14,-24 30,-6 q14,10 2,26 q-18,12 -32,0 q-12,-10 0,-20 z" fill="#B86E00" fill-opacity="0.55" stroke="#B86E00" stroke-width="1.2"/><rect x="675" y="50" width="175" height="70" rx="5" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1.5"/><path d="M701,81 q14,-24 30,-6 q14,10 2,26 q-18,12 -32,0 q-12,-10 0,-20 z" fill="#B86E00" fill-opacity="0.25" stroke="#B86E00" stroke-width="3" stroke-opacity="0.35"/><rect x="14" y="202" width="282" height="46" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="14" y="280" width="282" height="26" rx="5" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1.5"/><rect x="14" y="312" width="282" height="26" rx="5" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1.5"/><rect x="308" y="202" width="282" height="46" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="308" y="280" width="282" height="26" rx="5" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1.5"/><rect x="308" y="312" width="282" height="26" rx="5" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1.5"/><rect x="602" y="202" width="282" height="46" rx="5" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.5"/><rect x="602" y="280" width="282" height="26" rx="5" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1.5"/><rect x="602" y="312" width="282" height="26" rx="5" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1.5"/><text x="22" y="32" text-anchor="start" font-size="12" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">一个模型里的输出粒度：从点到透明度蒙版（WeVisOne-VL）</text><text x="150" y="80" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">点</text><text x="150" y="100" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">指出在哪</text><text x="365" y="80" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">框</text><text x="365" y="100" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">检测、指代、计数</text><text x="580" y="80" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">掩码</text><text x="580" y="100" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">逐像素的区域</text><text x="795" y="80" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">透明度蒙版</text><text x="795" y="100" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">抠图，边缘渐变</text><text x="100" y="140" text-anchor="start" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">像素级输出靠一个通过 &lt;OBJ&gt; token 接上的轻量像素解码器；图里没有的物体会拒答</text><text x="876" y="32" text-anchor="end" font-size="11" font-weight="600" fill="#0E6E7E" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">从左到右：粗 → 细</text><text x="14" y="190" text-anchor="start" font-size="12" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">补空间能力的三条路</text><text x="155" y="221.665" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">部署时接额外模块</text><text x="155" y="236.035" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">几何先验、三维结构</text><text x="155" y="268" text-anchor="middle" font-size="10.5" font-weight="500" fill="#C2501A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">信息更精确；部署时多一个组件</text><text x="155" y="297" text-anchor="middle" font-size="10" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">ViPS：多种视觉先验按上下文动态融合</text><text x="155" y="329" text-anchor="middle" font-size="10" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">VLM-IE3D：只用 RGB 视频，给出隐式与显式三维 token</text><text x="449" y="221.665" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">训练时补几何，部署时不加</text><text x="449" y="236.035" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">伪深度、相机、多视角关系</text><text x="449" y="268" text-anchor="middle" font-size="10.5" font-weight="500" fill="#C2501A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">部署简单；受伪标签质量与任务分布限制</text><text x="449" y="297" text-anchor="middle" font-size="10" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">SpatioLM：参数高效的空间模块</text><text x="449" y="329" text-anchor="middle" font-size="10" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">多视角关系蒸馏：只蒸馏块与块的相似关系</text><text x="743" y="221.665" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">从视频和第一人称经验造监督</text><text x="743" y="236.035" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">自动构造空间问答</text><text x="743" y="268" text-anchor="middle" font-size="10.5" font-weight="500" fill="#26805A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">数据从人的录像里自动整理出来</text><text x="743" y="297" text-anchor="middle" font-size="10" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Holi-World：约 100 个场景、约 8 万条问答、4B 模型</text><text x="743" y="329" text-anchor="middle" font-size="10" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">GST-Bench：最强零样本 42.68，人类 79.08</text></svg>
