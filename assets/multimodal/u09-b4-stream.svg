<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" width="860" height="300" role="img" aria-label="离线视频理解与流式视频理解"><defs><marker id="u09ah-u09b4stream" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6577"/></marker></defs><rect x="0" y="0" width="860" height="300" fill="#ffffff"/><line x1="64" y1="40" x2="64" y2="66" stroke="#E0B77A" stroke-width="1"/><line x1="114" y1="40" x2="114" y2="66" stroke="#E0B77A" stroke-width="1"/><line x1="164" y1="40" x2="164" y2="66" stroke="#E0B77A" stroke-width="1"/><line x1="214" y1="40" x2="214" y2="66" stroke="#E0B77A" stroke-width="1"/><line x1="264" y1="40" x2="264" y2="66" stroke="#E0B77A" stroke-width="1"/><line x1="314" y1="40" x2="314" y2="66" stroke="#E0B77A" stroke-width="1"/><line x1="364" y1="40" x2="364" y2="66" stroke="#E0B77A" stroke-width="1"/><line x1="414" y1="40" x2="414" y2="66" stroke="#E0B77A" stroke-width="1"/><line x1="464" y1="40" x2="464" y2="66" stroke="#E0B77A" stroke-width="1"/><line x1="514" y1="40" x2="514" y2="66" stroke="#E0B77A" stroke-width="1"/><line x1="564" y1="40" x2="564" y2="66" stroke="#E0B77A" stroke-width="1"/><line x1="614" y1="40" x2="614" y2="66" stroke="#E0B77A" stroke-width="1"/><line x1="664" y1="40" x2="664" y2="66" stroke="#E0B77A" stroke-width="1"/><path d="M560,82 L200,82" fill="none" stroke="#5A6577" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#u09ah-u09b4stream)"/><line x1="64" y1="148" x2="64" y2="174" stroke="#E0B77A" stroke-width="1"/><line x1="114" y1="148" x2="114" y2="174" stroke="#E0B77A" stroke-width="1"/><line x1="164" y1="148" x2="164" y2="174" stroke="#E0B77A" stroke-width="1"/><line x1="214" y1="148" x2="214" y2="174" stroke="#E0B77A" stroke-width="1"/><line x1="264" y1="148" x2="264" y2="174" stroke="#E0B77A" stroke-width="1"/><line x1="314" y1="148" x2="314" y2="174" stroke="#E0B77A" stroke-width="1"/><line x1="364" y1="148" x2="364" y2="174" stroke="#E0B77A" stroke-width="1"/><line x1="414" y1="148" x2="414" y2="174" stroke="#E0B77A" stroke-width="1"/><line x1="464" y1="148" x2="464" y2="174" stroke="#E0B77A" stroke-width="1"/><line x1="474" y1="140" x2="474" y2="184" stroke="#C2501A" stroke-width="2"/><path d="M244,176 L244,203" fill="none" stroke="#5A6577" stroke-width="1.4" stroke-dasharray="3 3" marker-end="url(#u09ah-u09b4stream)"/><rect x="14" y="40" width="700" height="26" rx="5" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.5"/><rect x="730" y="38" width="116" height="30" rx="5" fill="#E3EBFF" stroke="#2B57C9" stroke-width="1.5"/><rect x="14" y="148" width="460" height="26" rx="5" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.5"/><rect x="474" y="148" width="240" height="26" rx="5" fill="#F3F5F8" stroke="#D5DBE4" stroke-width="1.5" stroke-dasharray="4 3"/><rect x="730" y="146" width="116" height="30" rx="5" fill="#E3EBFF" stroke="#2B57C9" stroke-width="1.5"/><rect x="14" y="206" width="460" height="40" rx="5" fill="#E9EDF3" stroke="#47546A" stroke-width="1.5"/><rect x="14" y="258" width="106" height="28" rx="5" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1.5"/><rect x="132" y="258" width="106" height="28" rx="5" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1.5"/><rect x="250" y="258" width="106" height="28" rx="5" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1.5"/><rect x="368" y="258" width="106" height="28" rx="5" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1.5"/><text x="14" y="28" text-anchor="start" font-size="12" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">离线：整段视频都在手上</text><text x="788" y="56.41" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">看完再问</text><text x="380" y="98" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" style="paint-order:stroke;stroke-width:4px;stroke-linejoin:round" stroke="#ffffff">可以回头翻任何一段</text><text x="14" y="136" text-anchor="start" font-size="12" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">流式：只看得到此刻之前</text><text x="594" y="166" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">还没发生，看不到</text><text x="474" y="136" text-anchor="middle" font-size="10.5" font-weight="700" fill="#C2501A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">现在</text><text x="788" y="164.41" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">边看边问</text><text x="244" y="229.565" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">有限的记忆：把过去存在哪里</text><text x="67" y="275.255" text-anchor="middle" font-size="10.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">S1 后台模块</text><text x="185" y="275.255" text-anchor="middle" font-size="10.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">S2 视觉潜表示</text><text x="303" y="275.255" text-anchor="middle" font-size="10.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">S3 快权重</text><text x="421" y="275.255" text-anchor="middle" font-size="10.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">S4 文字记录</text><text x="600" y="222" text-anchor="middle" font-size="10.5" font-weight="500" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">两种设定都要在 token 预算里取舍：</text><text x="600" y="240" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">帧多则装不下，只存文字摘要</text><text x="600" y="258" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">又会永久丢掉小字、表情和位置</text></svg>
