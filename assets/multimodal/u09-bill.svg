<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 318" width="820" height="318" role="img" aria-label="读账单和看录像各要过几道关"><defs><marker id="u09ah-u09bill" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6577"/></marker></defs><rect x="0" y="0" width="820" height="318" fill="#ffffff"/><path d="M128,68 L147,68" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#u09ah-u09bill)"/><path d="M262,68 L281,68" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#u09ah-u09bill)"/><path d="M396,68 L415,68" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#u09ah-u09bill)"/><path d="M530,68 L549,68" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#u09ah-u09bill)"/><path d="M664,68 L683,68" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#u09ah-u09bill)"/><path d="M128,204 L147,204" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#u09ah-u09bill)"/><path d="M262,204 L281,204" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#u09ah-u09bill)"/><path d="M396,204 L415,204" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#u09ah-u09bill)"/><path d="M530,204 L549,204" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#u09ah-u09bill)"/><path d="M664,204 L683,204" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#u09ah-u09bill)"/><rect x="16" y="42" width="112" height="52" rx="5" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.5"/><rect x="150" y="42" width="112" height="52" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="284" y="42" width="112" height="52" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="418" y="42" width="112" height="52" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="552" y="42" width="112" height="52" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="686" y="42" width="112" height="52" rx="5" fill="#E9EDF3" stroke="#47546A" stroke-width="1.5"/><rect x="16" y="178" width="112" height="52" rx="5" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.5"/><rect x="150" y="178" width="112" height="52" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="284" y="178" width="112" height="52" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="418" y="178" width="112" height="52" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="552" y="178" width="112" height="52" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="686" y="178" width="112" height="52" rx="5" fill="#E9EDF3" stroke="#47546A" stroke-width="1.5"/><text x="16" y="26" text-anchor="start" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">例一：一张拍歪、反光的电费账单，问“这个月比上个月多交了多少”</text><text x="72" y="64.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">账单照片</text><text x="72" y="79.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">几百万像素</text><text x="206" y="64.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">① 找到那张表</text><text x="206" y="79.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">历史用量表</text><text x="340" y="64.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">② 认清小字</text><text x="340" y="79.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">两个金额</text><text x="474" y="64.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">③ 对上月份</text><text x="474" y="79.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">哪行是上月</text><text x="608" y="64.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">④ 做减法</text><text x="608" y="79.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">语言推理</text><text x="742" y="64.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">答案</text><text x="742" y="79.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">多交了多少</text><text x="206" y="114" text-anchor="middle" font-size="10.5" font-weight="500" fill="#C2501A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">表藏在一大片像素里</text><text x="340" y="114" text-anchor="middle" font-size="10.5" font-weight="500" fill="#C2501A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">数字小，还有反光</text><text x="474" y="114" text-anchor="middle" font-size="10.5" font-weight="500" fill="#C2501A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">看错行，金额全错</text><text x="608" y="114" text-anchor="middle" font-size="10.5" font-weight="500" fill="#C2501A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">前面错，这里白算</text><text x="16" y="162" text-anchor="start" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">例二：四十分钟的组会录像，问“导师第几分钟提到我的实验、屏幕上是哪张图”</text><text x="72" y="200.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">组会录像</text><text x="72" y="215.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">一秒几十帧</text><text x="206" y="207.72" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">① 挑着看、压着看</text><text x="340" y="200.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">② 标出时间</text><text x="340" y="215.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">每帧在第几秒</text><text x="474" y="200.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">③ 只用此前的</text><text x="474" y="215.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">边开会边问</text><text x="608" y="200.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">④ 对上声音</text><text x="608" y="215.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">导师说的那句话</text><text x="742" y="200.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">答案</text><text x="742" y="215.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">第几分钟、哪张图</text><text x="206" y="250" text-anchor="middle" font-size="10.5" font-weight="500" fill="#C2501A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">上下文装不下所有帧</text><text x="340" y="250" text-anchor="middle" font-size="10.5" font-weight="500" fill="#C2501A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">问的是“什么时候”</text><text x="474" y="250" text-anchor="middle" font-size="10.5" font-weight="500" fill="#C2501A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">不能回头翻、往后看</text><text x="608" y="250" text-anchor="middle" font-size="10.5" font-weight="500" fill="#C2501A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">话在声音里，图在画面里</text><text x="410" y="300" text-anchor="middle" font-size="11" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">橙色是这一步最容易丢掉证据的地方；任何一步看错，后面的推理再漂亮也是在错误的证据上展开</text></svg>
