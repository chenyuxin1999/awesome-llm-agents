<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 384" width="780" height="384" role="img" aria-label="LLaVA 式两阶段训练：每一阶段的训练信号与目标"><defs><marker id="u09ah-u09llavatrain" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6577"/></marker></defs><rect x="0" y="0" width="780" height="384" fill="#ffffff"/><rect x="12" y="34" width="370" height="300" rx="6" fill="#F3F5F8" stroke="#D5DBE4" stroke-width="1.5"/><path d="M76,92 L91,92" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#u09ah-u09llavatrain)"/><path d="M178,92 L193,92" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#u09ah-u09llavatrain)"/><path d="M266,92 L281,92" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#u09ah-u09llavatrain)"/><rect x="398" y="34" width="370" height="300" rx="6" fill="#F3F5F8" stroke="#D5DBE4" stroke-width="1.5"/><path d="M462,92 L477,92" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#u09ah-u09llavatrain)"/><path d="M564,92 L579,92" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#u09ah-u09llavatrain)"/><path d="M652,92 L667,92" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#u09ah-u09llavatrain)"/><rect x="24" y="70" width="52" height="44" rx="5" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.5"/><rect x="94" y="70" width="84" height="44" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="196" y="70" width="70" height="44" rx="5" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.5"/><rect x="284" y="70" width="84" height="44" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="114" y="122" width="44" height="22" rx="5" fill="#E9EDF3" stroke="#47546A" stroke-width="1.5"/><rect x="209" y="122" width="44" height="22" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><rect x="304" y="122" width="44" height="22" rx="5" fill="#E9EDF3" stroke="#47546A" stroke-width="1.5"/><rect x="26" y="178" width="342" height="70" rx="4" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.4" stroke-dasharray="4 3"/><rect x="26" y="258" width="342" height="32" rx="4" fill="#FFFFFF" stroke="#18202C" stroke-width="1.2"/><rect x="410" y="70" width="52" height="44" rx="5" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.5"/><rect x="480" y="70" width="84" height="44" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="582" y="70" width="70" height="44" rx="5" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.5"/><rect x="670" y="70" width="84" height="44" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="500" y="122" width="44" height="22" rx="5" fill="#E9EDF3" stroke="#47546A" stroke-width="1.5"/><rect x="595" y="122" width="44" height="22" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><rect x="690" y="122" width="44" height="22" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><rect x="412" y="178" width="342" height="70" rx="4" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.4" stroke-dasharray="4 3"/><rect x="412" y="258" width="342" height="32" rx="4" fill="#FFFFFF" stroke="#18202C" stroke-width="1.2"/><text x="14" y="22" text-anchor="start" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">LLaVA 要的是一个能按提问回答图片问题的模型：先让语言模型读得懂图像 token，再教它听指令</text><text x="26" y="56" text-anchor="start" font-size="12.5" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">阶段一：对齐，只训练投影层</text><text x="50" y="95.565" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">图像</text><text x="136" y="95.565" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">视觉编码器</text><text x="231" y="95.565" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">投影层</text><text x="326" y="95.565" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">语言模型</text><text x="136" y="136.255" text-anchor="middle" font-size="10.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">冻结</text><text x="231" y="136.255" text-anchor="middle" font-size="10.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">训练</text><text x="326" y="136.255" text-anchor="middle" font-size="10.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">冻结</text><text x="197" y="166" text-anchor="middle" font-size="10.5" font-weight="500" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">数据：从 CC3M 筛出的约 59.5 万对图文</text><text x="197" y="197" text-anchor="middle" font-size="11" font-weight="700" fill="#B86E00" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">训练信号从哪来</text><text x="197" y="215" text-anchor="middle" font-size="10.3" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">答案就是这张图原本配的那句说明，</text><text x="197" y="231" text-anchor="middle" font-size="10.3" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">语言模型逐字说出它，说错多少就改多少</text><text x="197" y="279" text-anchor="middle" font-size="11" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">目标：看着图像 token 说对这句说明</text><text x="197" y="316" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">视觉编码器两个阶段都不训练</text><text x="412" y="56" text-anchor="start" font-size="12.5" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">阶段二：指令微调，放开语言模型</text><text x="436" y="95.565" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">图像</text><text x="522" y="95.565" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">视觉编码器</text><text x="617" y="95.565" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">投影层</text><text x="712" y="95.565" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">语言模型</text><text x="522" y="136.255" text-anchor="middle" font-size="10.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">冻结</text><text x="617" y="136.255" text-anchor="middle" font-size="10.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">训练</text><text x="712" y="136.255" text-anchor="middle" font-size="10.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">训练</text><text x="583" y="166" text-anchor="middle" font-size="10.5" font-weight="500" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">数据：GPT-4 生成的 15.8 万条指令对话</text><text x="583" y="197" text-anchor="middle" font-size="11" font-weight="700" fill="#B86E00" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">训练信号从哪来</text><text x="583" y="215" text-anchor="middle" font-size="10.3" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">答案是数据里助手的那段回答，</text><text x="583" y="231" text-anchor="middle" font-size="10.3" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">只按这部分文字计算对错</text><text x="583" y="279" text-anchor="middle" font-size="11" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">目标：按提问说出正确的回答</text><text x="583" y="316" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">视觉编码器两个阶段都不训练</text><text x="390" y="354" text-anchor="middle" font-size="11" font-weight="500" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">LLaVA-1.5：336×336 的图按 14×14 切块，每块投影成一个视觉 token，一张图 576 个，和文字 token 排在一起</text><text x="390" y="374" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">粉色标签是这一阶段被训练的部件，灰色标签是冻住不动的部件</text></svg>
