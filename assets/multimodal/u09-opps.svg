<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" width="900" height="250" role="img" aria-label="三个研究机会对应证据流水线上的三处"><defs><marker id="u09ah-u09opps" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6577"/></marker></defs><rect x="0" y="0" width="900" height="250" fill="#ffffff"/><path d="M155,106.5 L155,118.5" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#u09ah-u09opps)"/><path d="M155,147 L155,159" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#u09ah-u09opps)"/><path d="M449,106.5 L449,118.5" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#u09ah-u09opps)"/><path d="M449,147 L449,159" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#u09ah-u09opps)"/><path d="M743,106.5 L743,118.5" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#u09ah-u09opps)"/><path d="M743,147 L743,159" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#u09ah-u09opps)"/><rect x="14" y="14" width="282" height="50" rx="5" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.5"/><rect x="14" y="80" width="282" height="26.5" rx="5" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1.5"/><rect x="14" y="120.5" width="282" height="26.5" rx="5" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1.5"/><rect x="14" y="161" width="282" height="26.5" rx="5" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1.5"/><rect x="308" y="14" width="282" height="50" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="308" y="80" width="282" height="26.5" rx="5" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1.5"/><rect x="308" y="120.5" width="282" height="26.5" rx="5" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1.5"/><rect x="308" y="161" width="282" height="26.5" rx="5" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1.5"/><rect x="602" y="14" width="282" height="50" rx="5" fill="#E9EDF3" stroke="#47546A" stroke-width="1.5"/><rect x="602" y="80" width="282" height="26.5" rx="5" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1.5"/><rect x="602" y="120.5" width="282" height="26.5" rx="5" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1.5"/><rect x="602" y="161" width="282" height="26.5" rx="5" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1.5"/><text x="155" y="35.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">1 证据在哪一步丢的</text><text x="155" y="50.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">诊断协议</text><text x="155" y="97.45" text-anchor="middle" font-size="10.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">同一张账单做出不同分辨率、反光、裁剪的版本</text><text x="155" y="137.95" text-anchor="middle" font-size="10.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">配合探针与注意力头分析</text><text x="155" y="178.45" text-anchor="middle" font-size="10.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">每次失败归到编码、压缩或读出中的一步</text><text x="449" y="35.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">2 观察按需分配</text><text x="449" y="50.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">分辨率与帧预算</text><text x="449" y="97.45" text-anchor="middle" font-size="10.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">扫首页用低分辨率，读小表再放大</text><text x="449" y="137.95" text-anchor="middle" font-size="10.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">静止的幻灯片少看，换页和说话时多看</text><text x="449" y="178.45" text-anchor="middle" font-size="10.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">按当前不确定性决定在哪里多花 token</text><text x="743" y="35.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">3 记忆又省又可核对</text><text x="743" y="50.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">长视频记忆</text><text x="743" y="97.45" text-anchor="middle" font-size="10.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">文字记录省，却丢小字和位置</text><text x="743" y="137.95" text-anchor="middle" font-size="10.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">潜表示保真，却难以检查</text><text x="743" y="178.45" text-anchor="middle" font-size="10.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">需要时能回到原始画面核对</text><text x="450" y="236" text-anchor="middle" font-size="11" font-weight="500" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">评测时专门安排不显眼、时间上隔得远、要声音和画面一起才能回答的事件</text></svg>
