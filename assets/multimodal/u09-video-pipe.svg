ans CJK SC, Microsoft YaHei, sans-serif">一秒几十帧</text><text x="224" y="43.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">抽帧</text><text x="224" y="58.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">每秒一两帧</text><text x="372" y="43.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">每帧切块编码</text><text x="372" y="58.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">和图片一样</text><text x="520" y="43.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">时空压缩</text><text x="520" y="58.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">削减 token</text><text x="668" y="43.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">加上时间位置</text><text x="668" y="58.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">第几帧、第几秒</text><text x="816" y="43.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">语言模型</text><text x="816" y="58.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">和问题一起推理</text><text x="14" y="92" text-anchor="start" font-size="10" font-weight="600" fill="#0E6E7E" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">组会录像（示意）</text><text x="76" y="124" text-anchor="middle" font-size="9.5" font-weight="500" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">40 分钟组会录像</text><text x="224" y="116" text-anchor="middle" font-size="9.5" font-weight="500" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">每秒 2 帧，</text><text x="224" y="130" text-anchor="middle" font-size="9.5" font-weight="500" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">共 4800 帧</text><text x="372" y="116" text-anchor="middle" font-size="9.5" font-weight="500" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">每帧约 256 个 token，</text><text x="372" y="130" text-anchor="middle" font-size="9.5" font-weight="500" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">共约 123 万</text><text x="520" y="116" text-anchor="middle" font-size="9.5" font-weight="500" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">相邻两帧合一组，</text><text x="520" y="130" text-anchor="middle" font-size="9.5" font-weight="500" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">约 61 万</text><text x="668" y="116" text-anchor="middle" font-size="9.5" font-weight="500" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">第 1503 帧</text><text x="668" y="130" text-anchor="middle" font-size="9.5" font-weight="500" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">标成 12:31.5</text><text x="816" y="116" text-anchor="middle" font-size="9.5" font-weight="500" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">问：几分钟提到小王？</text><text x="816" y="130" text-anchor="middle" font-size="9.5" font-weight="500" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">答：12:31 前后</text><text x="224" y="192" text-anchor="middle" font-size="10.5" font-weight="500" fill="#C2501A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">一秒只看两帧，</text><text x="224" y="209" text-anchor="middle" font-size="10.5" font-weight="500" fill="#C2501A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">快速动作容易漏掉</text><text x="372" y="192" text-anchor="middle" font-size="10.5" font-weight="500" fill="#C2501A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">一分钟 120 帧，</text><text x="372" y="209" text-anchor="middle" font-size="10.5" font-weight="500" fill="#C2501A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">每帧两三百个 token，</text><text x="372" y="226" text-anchor="middle" font-size="10.5" font-weight="500" fill="#C2501A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">加起来好几万</text><text x="526" y="192" text-anchor="middle" font-size="10" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">相邻块合并</text><text x="526" y="209" text-anchor="middle" font-size="10" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">相邻两帧合成一组（Qwen2-VL）</text><text x="526" y="226" text-anchor="middle" font-size="10" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Conv3D 融合成 tubelet（Nemotron）</text><text x="526" y="243" text-anchor="middle" font-size="10" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">按冗余删帧（LongVU）</text><text x="526" y="260" text-anchor="middle" font-size="10" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">只留有变化的 token（EVS）</text><text x="710" y="192" text-anchor="middle" font-size="10" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">M-RoPE 的时间维（Qwen2-VL）</text><text x="710" y="209" text-anchor="middle" font-size="10" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">对齐绝对时间（Qwen2.5-VL）</text><text x="710" y="226" text-anchor="middle" font-size="10" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">时间戳与帧交错（Gemma 3）</text><text x="450" y="310" text-anchor="middle" font-size="11" font-weight="500" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">大部分功夫花在压缩上；2026 年的发布模型已把“相邻帧合并”和“按变化删 token”做成默认流水线</text><text x="450" y="332" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">离线设定能回头翻整段视频；边看边问的流式设定只能用此刻之前的内容，见三.4</text><text x="450" y="354" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">抽帧率与 token 数是图谱和正文里给出的量级；录像一行按正文的组会例子算，示意</text></svg>
