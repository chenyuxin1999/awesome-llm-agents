<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" role="img" aria-label="视频理解的流水线：抽帧、编码、压缩、标时间"><defs><marker id="u09ah-u09videopipe" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6577"/></marker></defs><rect x="0" y="0" width="900" height="330" fill="#ffffff"/><path d="M138,47 L159,47" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#u09ah-u09videopipe)"/><path d="M286,47 L307,47" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#u09ah-u09videopipe)"/><path d="M434,47 L455,47" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#u09ah-u09videopipe)"/><path d="M582,47 L603,47" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#u09ah-u09videopipe)"/><path d="M730,47 L751,47" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#u09ah-u09videopipe)"/><path d="M224,74 L224,105" fill="none" stroke="#5A6577" stroke-width="1.4" stroke-dasharray="3 3" marker-end="url(#u09ah-u09videopipe)"/><path d="M372,74 L372,105" fill="none" stroke="#5A6577" stroke-width="1.4" stroke-dasharray="3 3" marker-end="url(#u09ah-u09videopipe)"/><path d="M520,74 L520,105" fill="none" stroke="#5A6577" stroke-width="1.4" stroke-dasharray="3 3" marker-end="url(#u09ah-u09videopipe)"/><path d="M668,74 L668,105" fill="none" stroke="#5A6577" stroke-width="1.4" stroke-dasharray="3 3" marker-end="url(#u09ah-u09videopipe)"/><rect x="14" y="20" width="124" height="54" rx="5" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.5"/><rect x="162" y="20" width="124" height="54" rx="5" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.5"/><rect x="310" y="20" width="124" height="54" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="458" y="20" width="124" height="54" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="606" y="20" width="124" height="54" rx="5" fill="#E9EDF3" stroke="#47546A" stroke-width="1.5"/><rect x="754" y="20" width="124" height="54" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="162" y="108" width="124" height="60" rx="5" fill="#FDE8DD" stroke="#C2501A" stroke-width="1.5"/><rect x="310" y="108" width="124" height="77" rx="5" fill="#FDE8DD" stroke="#C2501A" stroke-width="1.5"/><rect x="438" y="108" width="176" height="111" rx="5" fill="#F3F5F8" stroke="#D5DBE4" stroke-width="1.5" stroke-dasharray="4 3"/><rect x="622" y="108" width="176" height="77" rx="5" fill="#F3F5F8" stroke="#D5DBE4" stroke-width="1.5" stroke-dasharray="4 3"/><text x="76" y="43.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">视频</text><text x="76" y="58.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">一秒几十帧</text><text x="224" y="43.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">抽帧</text><text x="224" y="58.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">每秒一两帧</text><text x="372" y="43.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">每帧切块编码</text><text x="372" y="58.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">和图片一样</text><text x="520" y="43.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">时空压缩</text><text x="520" y="58.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">削减 token</text><text x="668" y="43.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">加上时间位置</text><text x="668" y="58.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">第几帧、第几秒</text><text x="816" y="43.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">语言模型</text><text x="816" y="58.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">和问题一起推理</text><text x="224" y="132" text-anchor="middle" font-size="10.5" font-weight="500" fill="#C2501A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">一秒只看两帧，</text><text x="224" y="149" text-anchor="middle" font-size="10.5" font-weight="500" fill="#C2501A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">快速动作容易漏掉</text><text x="372" y="132" text-anchor="middle" font-size="10.5" font-weight="500" fill="#C2501A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">一分钟 120 帧，</text><text x="372" y="149" text-anchor="middle" font-size="10.5" font-weight="500" fill="#C2501A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">每帧两三百个 token，</text><text x="372" y="166" text-anchor="middle" font-size="10.5" font-weight="500" fill="#C2501A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">加起来好几万</text><text x="526" y="132" text-anchor="middle" font-size="10" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">相邻块合并</text><text x="526" y="149" text-anchor="middle" font-size="10" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">相邻两帧合成一组（Qwen2-VL）</text><text x="526" y="166" text-anchor="middle" font-size="10" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Conv3D 融合成 tubelet（Nemotron）</text><text x="526" y="183" text-anchor="middle" font-size="10" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">按冗余删帧（LongVU）</text><text x="526" y="200" text-anchor="middle" font-size="10" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">只留有变化的 token（EVS）</text><text x="710" y="132" text-anchor="middle" font-size="10" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">M-RoPE 的时间维（Qwen2-VL）</text><text x="710" y="149" text-anchor="middle" font-size="10" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">对齐绝对时间（Qwen2.5-VL）</text><text x="710" y="166" text-anchor="middle" font-size="10" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">时间戳与帧交错（Gemma 3）</text><text x="450" y="270" text-anchor="middle" font-size="11" font-weight="500" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">大部分功夫花在压缩上；2026 年的发布模型已把“相邻帧合并”和“按变化删 token”做成默认流水线</text><text x="450" y="292" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">离线设定能回头翻整段视频；边看边问的流式设定只能用此刻之前的内容，见三.4</text><text x="450" y="314" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">抽帧率与 token 数是图谱和正文里给出的量级，示意</text></svg>
