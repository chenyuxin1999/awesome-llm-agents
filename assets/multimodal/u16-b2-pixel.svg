<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380" role="img" aria-label="像素扩散与流分支：去掉压缩器之后的几笔账"><defs><marker id="ah-u16b2pixel" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6577"/></marker></defs><rect x="0" y="0" width="900" height="380" fill="#ffffff"/><path d="M260,57 L287,57" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-u16b2pixel)"/><path d="M430,57 L457,57" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-u16b2pixel)"/><path d="M600,57 L627,57" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-u16b2pixel)"/><path d="M260,128 L327,128" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-u16b2pixel)"/><path d="M570,128 L637,128" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-u16b2pixel)"/><path d="M98,200 L360,159" fill="none" stroke="#9AA6B8" stroke-width="1.4" stroke-dasharray="3 3" marker-end="url(#ah-u16b2pixel)"/><path d="M274,200 L360,159" fill="none" stroke="#9AA6B8" stroke-width="1.4" stroke-dasharray="3 3" marker-end="url(#ah-u16b2pixel)"/><path d="M450,200 L450,159" fill="none" stroke="#9AA6B8" stroke-width="1.4" stroke-dasharray="3 3" marker-end="url(#ah-u16b2pixel)"/><path d="M626,200 L540,159" fill="none" stroke="#9AA6B8" stroke-width="1.4" stroke-dasharray="3 3" marker-end="url(#ah-u16b2pixel)"/><path d="M802,200 L540,159" fill="none" stroke="#9AA6B8" stroke-width="1.4" stroke-dasharray="3 3" marker-end="url(#ah-u16b2pixel)"/><rect x="120" y="40" width="140" height="34" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><rect x="290" y="40" width="140" height="34" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="460" y="40" width="140" height="34" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><rect x="630" y="40" width="250" height="34" rx="5" fill="#FDE8DD" stroke="#C2501A" stroke-width="1.5"/><rect x="120" y="108" width="140" height="40" rx="5" fill="#E9EDF3" stroke="#47546A" stroke-width="1.5"/><rect x="330" y="100" width="240" height="56" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="640" y="108" width="140" height="40" rx="5" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.5"/><rect x="20" y="200" width="156" height="66" rx="5" fill="#FFFFFF" stroke="#5B45B0" stroke-width="1.2"/><rect x="196" y="200" width="156" height="66" rx="5" fill="#FFFFFF" stroke="#5B45B0" stroke-width="1.2"/><rect x="372" y="200" width="156" height="66" rx="5" fill="#FFFFFF" stroke="#26805A" stroke-width="1.2"/><rect x="548" y="200" width="156" height="66" rx="5" fill="#FFFFFF" stroke="#B83560" stroke-width="1.2"/><rect x="724" y="200" width="156" height="66" rx="5" fill="#FFFFFF" stroke="#B86E00" stroke-width="1.2"/><rect x="20" y="290" width="860" height="70" rx="5" fill="#FDE8DD" stroke="#C2501A" stroke-width="1.5"/><text x="20" y="24" text-anchor="start" font-size="12" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">上面是熟悉的潜空间路线；下面去掉编码器和解码器，几篇论文分别处理频率、尺度、损失、训练匹配和复用</text><text x="20" y="58" text-anchor="start" font-size="11.5" font-weight="700" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">潜空间路线</text><text x="190" y="60.72" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">VAE 编码</text><text x="360" y="60.72" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">潜空间生成</text><text x="530" y="60.72" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">VAE 解码</text><text x="755" y="60.72" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">小字、细节在压缩时丢掉</text><text x="20" y="128" text-anchor="start" font-size="11.5" font-weight="700" fill="#5B45B0" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">像素路线</text><text x="190" y="131.72" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">像素上的噪声</text><text x="450" y="124.82" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">像素空间生成器</text><text x="450" y="139.38" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Pixel-Space DiT 综述把这里的选择画成地图</text><text x="710" y="131.72" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">图像</text><text x="30" y="218" text-anchor="start" font-size="11" font-weight="700" fill="#5B45B0" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">频率：WaiT</text><text x="30" y="235" text-anchor="start" font-size="10.2" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">小波把信号拆成高低频</text><text x="30" y="250" text-anchor="start" font-size="10.2" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">两边各用一套噪声过程</text><text x="206" y="218" text-anchor="start" font-size="11" font-weight="700" fill="#5B45B0" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">尺度：观察算子</text><text x="206" y="235" text-anchor="start" font-size="10.2" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">随时间变化的观察算子</text><text x="206" y="250" text-anchor="start" font-size="10.2" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">加尺度感知的解码</text><text x="382" y="218" text-anchor="start" font-size="11" font-weight="700" fill="#26805A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">损失：LILIE</text><text x="382" y="235" text-anchor="start" font-size="10.2" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">语言告诉像素损失什么重要</text><text x="382" y="250" text-anchor="start" font-size="10.2" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">gFD 66.84 → 53.01（自报）</text><text x="558" y="218" text-anchor="start" font-size="11" font-weight="700" fill="#B83560" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">匹配：Explorative</text><text x="558" y="235" text-anchor="start" font-size="10.2" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">训练时探索多个候选对应</text><text x="558" y="250" text-anchor="start" font-size="10.2" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">减少把多种模式平均掉</text><text x="734" y="218" text-anchor="start" font-size="11" font-weight="700" fill="#B86E00" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">复用：Empirical Study</text><text x="734" y="235" text-anchor="start" font-size="10.2" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">从已有潜空间模型适配</text><text x="734" y="250" text-anchor="start" font-size="10.2" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">比较复用与重训的成本</text><text x="450" y="314.644" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">总账：没有编码器本身算不上优势</text><text x="450" y="329.404" text-anchor="middle" font-size="10.2" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">要在同样的输出分辨率、训练预算和采样步数下比较；Explorative 的候选匹配要计入额外训练计算，和像素表示属于不同层次，可以组合，组合后要同时检验尺度一致性、细节、覆盖和</text><text x="450" y="343.48" text-anchor="middle" font-size="10.2" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">总成本</text></svg>
