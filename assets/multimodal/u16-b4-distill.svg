chor="start" font-size="11" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">双向教师</text><text x="137" y="160" text-anchor="middle" font-size="10.5" font-weight="500" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">块 1</text><text x="199" y="160" text-anchor="middle" font-size="10.5" font-weight="500" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">块 2</text><text x="261" y="160" text-anchor="middle" font-size="10.5" font-weight="500" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">当前</text><text x="323" y="160" text-anchor="middle" font-size="10.5" font-weight="500" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">未来</text><text x="385" y="160" text-anchor="middle" font-size="10.5" font-weight="500" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">未来</text><text x="36" y="214" text-anchor="start" font-size="11" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">因果教师</text><text x="137" y="216" text-anchor="middle" font-size="10.5" font-weight="500" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">学生写</text><text x="199" y="216" text-anchor="middle" font-size="10.5" font-weight="500" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">学生写</text><text x="261" y="216" text-anchor="middle" font-size="10.5" font-weight="500" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">当前</text><text x="323" y="216" text-anchor="middle" font-size="10.5" font-weight="500" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif"></text><text x="385" y="216" text-anchor="middle" font-size="10.5" font-weight="500" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif"></text><text x="235" y="256" text-anchor="middle" font-size="10.2" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">教师和学生看同样的因果范围，用学生实际写出的前缀打分，</text><text x="235" y="274" text-anchor="middle" font-size="10.2" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">并专门处理早期不可靠的前缀</text><text x="472" y="62" text-anchor="start" font-size="12.5" font-weight="700" fill="#C2501A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">隐患二：多样性在第一块就坍缩</text><text x="472" y="80" text-anchor="start" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Uncertainty DMD 处理这一条</text><text x="476" y="112" text-anchor="start" font-size="10.5" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">种子 1</text><text x="557" y="112" text-anchor="middle" font-size="10.5" font-weight="500" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">首块</text><text x="476" y="156" text-anchor="start" font-size="10.5" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">种子 2</text><text x="557" y="156" text-anchor="middle" font-size="10.5" font-weight="500" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">首块</text><text x="476" y="200" text-anchor="start" font-size="10.5" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">种子 3</text><text x="557" y="200" text-anchor="middle" font-size="10.5" font-weight="500" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">首块</text><text x="670" y="236" text-anchor="middle" font-size="10.2" font-weight="500" fill="#C2501A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">几乎一样的首块 + 确定性的缓存，把相似一路传下去</text><text x="670" y="256" text-anchor="middle" font-size="10.2" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">办法：在首块的时间步和后续缓存写入里</text><text x="670" y="274" text-anchor="middle" font-size="10.2" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">分别引入随机性</text><text x="30" y="322" text-anchor="start" font-size="11" font-weight="700" fill="#26805A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">OPSD-V</text><text x="30" y="339" text-anchor="start" font-size="10.2" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">学生沿部署时的自回归缓存</text><text x="30" y="354" text-anchor="start" font-size="10.2" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">轨迹生成；教师在同一状态</text><text x="30" y="369" text-anchor="start" font-size="10.2" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">借更干净的上下文纠正</text><text x="252" y="322" text-anchor="start" font-size="11" font-weight="700" fill="#5B45B0" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Are We Overthinking</text><text x="252" y="339" text-anchor="start" font-size="10.2" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">先做重建训练，再做分布层</text><text x="252" y="354" text-anchor="start" font-size="10.2" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">面的后训练；ImageNet 256</text><text x="252" y="369" text-anchor="start" font-size="10.2" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">一步 FID 1.19，计算约十分之一</text><text x="252" y="384" text-anchor="start" font-size="10.2" font-weight=