 Sans CJK SC, Microsoft YaHei, sans-serif">VideoGen-Agent</text><text x="474" y="337" text-anchor="start" font-size="10.2" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">多任务 agent 强化学习，</text><text x="474" y="352" text-anchor="start" font-size="10.2" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">协调视频生成工具应对</text><text x="474" y="367" text-anchor="start" font-size="10.2" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">身份、知识、事件顺序</text><text x="684" y="320" text-anchor="start" font-size="11" font-weight="700" fill="#B86E00" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">MOSS-Image</text><text x="684" y="337" text-anchor="start" font-size="10.2" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">agent 式提示增强先写清内容</text><text x="684" y="352" text-anchor="start" font-size="10.2" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">和版式规格；中英文长文本</text><text x="684" y="367" text-anchor="start" font-size="10.2" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">渲染，平均文字覆盖率</text><text x="684" y="382" text-anchor="start" font-size="10.2" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">96.3%（作者自报）</text></svg>
