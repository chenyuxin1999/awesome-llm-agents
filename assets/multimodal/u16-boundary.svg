9EDF3" stroke="#47546A" stroke-width="1.1"/><rect x="20" y="256" width="860" height="52" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><text x="20" y="24" text-anchor="start" font-size="12" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">每一阶段解决了上一阶段的麻烦，也各自留下了新的缺口；下面八个分支就在这些缺口里展开</text><text x="76" y="72.82" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">压缩</text><text x="76" y="87.38" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">第 1、2 阶段</text><text x="76" y="161.01" text-anchor="middle" font-size="10.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">小字和精确几何脆弱</text><text x="76" y="175.5" text-anchor="middle" font-size="10.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">可建模性缺少公认度量</text><text x="76" y="227.78" text-anchor="middle" font-size="10.5" font-weight="500" fill="#47546A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">三.1</text><text x="200" y="72.82" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">重回像素</text><text x="200" y="87.38" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">第 2 阶段</text><text x="200" y="161.01" text-anchor="middle" font-size="10.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">高维噪声</text><text x="200" y="175.5" text-anchor="middle" font-size="10.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">计算量巨大</text><text x="200" y="227.78" text-anchor="middle" font-size="10.5" font-weight="500" fill="#47546A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">三.2</text><text x="324" y="72.82" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">少步采样</text><text x="324" y="87.38" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">第 3 阶段</text><text x="324" y="161.01" text-anchor="middle" font-size="10.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">多样性下降</text><text x="324" y="175.5" text-anchor="middle" font-size="10.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Krea 的模式坍缩</text><text x="324" y="227.78" text-anchor="middle" font-size="10.5" font-weight="500" fill="#47546A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">三.4</text><text x="448" y="72.82" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">自回归视频</text><text x="448" y="87.38" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">第 4 阶段</text><text x="448" y="161.01" text-anchor="middle" font-size="10.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">误差累积</text><text x="448" y="175.5" text-anchor="middle" font-size="10.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">长程记忆</text><text x="448" y="227.78" text-anchor="middle" font-size="10.5" font-weight="500" fill="#47546A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">三.4 三.5</text><text x="572" y="72.82" text-anchor="middle" fon