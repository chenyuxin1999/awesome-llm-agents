<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 128" width="560" height="128" role="img" aria-label="像素空间扩散与流结构"><defs><marker id="ah-u16cardp3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6577"/></marker></defs><rect x="0" y="0" width="560" height="128" fill="#ffffff"/><path d="M174,55 L197,55" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-u16cardp3)"/><path d="M360,55 L383,55" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-u16cardp3)"/><rect x="14" y="16" width="160" height="78" rx="5" fill="#E9EDF3" stroke="#47546A" stroke-width="1.5"/><rect x="200" y="16" width="160" height="78" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="386" y="16" width="160" height="78" rx="5" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.5"/><text x="94" y="51.665" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">像素上的噪声</text><text x="94" y="66.035" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">和输出图一样大小</text><text x="280" y="51.665" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">直接在像素上生成</text><text x="280" y="66.035" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">编码器和解码器都不要了</text><text x="466" y="44.765" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">出图</text><text x="466" y="59.135" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">小字和精确几何不再被压缩器卡</text><text x="466" y="72.935" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">住</text><text x="280" y="118" text-anchor="middle" font-size="10.5" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">高维噪声、尺度和计算量要重新算账，Dieleman 判断目前在成本上还太早</text></svg>
