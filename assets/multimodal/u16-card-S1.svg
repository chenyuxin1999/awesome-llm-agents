<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 128" width="560" height="128" role="img" aria-label="无分类器引导结构"><defs><marker id="ah-u16cards1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6577"/></marker></defs><rect x="0" y="0" width="560" height="128" fill="#ffffff"/><path d="M127.5,55 L150.5,55" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-u16cards1)"/><path d="M267,55 L290,55" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-u16cards1)"/><path d="M406.5,55 L429.5,55" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-u16cards1)"/><rect x="14" y="16" width="113.5" height="78" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="153.5" y="16" width="113.5" height="78" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="293" y="16" width="113.5" height="78" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="432.5" y="16" width="113.5" height="78" rx="5" fill="#E9EDF3" stroke="#47546A" stroke-width="1.5"/><text x="70.75" y="36.83" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">带“一只猫”跑一</text><text x="70.75" y="52.7" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">次</text><text x="70.75" y="67.07" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">有条件的预测，示例</text><text x="70.75" y="80.87" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">中这一格是 0.60</text><text x="210.25" y="44.765" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">空条件再跑一次</text><text x="210.25" y="59.135" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">无条件的预测，这一</text><text x="210.25" y="72.935" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">格是 0.30</text><text x="349.75" y="44.765" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">差值放大 3 倍</text><text x="349.75" y="59.135" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">0.30 + 3 × 0.30 =</text><text x="349.75" y="72.935" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">1.20</text><text x="489.25" y="36.83" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">按放大后的预测走</text><text x="489.25" y="52.7" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">一步</text><text x="489.25" y="67.07" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">这一格更明显地往“</text><text x="489.25" y="80.87" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">猫”修</text><text x="280" y="118" text-anchor="middle" font-size="10.5" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">一个系数换来更强的条件遵循，代价是每一步都多跑一次网络</text></svg>
