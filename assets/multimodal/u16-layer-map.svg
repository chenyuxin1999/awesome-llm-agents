<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" height="430" role="img" aria-label="七条路线各自改动哪一层"><defs><marker id="ah-u16layermap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6577"/></marker></defs><rect x="0" y="0" width="900" height="430" fill="#ffffff"/><path d="M196,48 L874,48" fill="none" stroke="#9AA6B8" stroke-width="1.4" marker-end="url(#ah-u16layermap)"/><line x1="190" y1="82" x2="190" y2="398" stroke="#E3E7ED" stroke-width="1"/><line x1="305" y1="82" x2="305" y2="398" stroke="#E3E7ED" stroke-width="1"/><line x1="420" y1="82" x2="420" y2="398" stroke="#E3E7ED" stroke-width="1"/><line x1="535" y1="82" x2="535" y2="398" stroke="#E3E7ED" stroke-width="1"/><line x1="650" y1="82" x2="650" y2="398" stroke="#E3E7ED" stroke-width="1"/><line x1="765" y1="82" x2="765" y2="398" stroke="#E3E7ED" stroke-width="1"/><line x1="880" y1="82" x2="880" y2="398" stroke="#E3E7ED" stroke-width="1"/><line x1="301" y1="284" x2="539" y2="284" stroke="#2B57C9" stroke-width="1.3" stroke-dasharray="4 3"/><rect x="194" y="92" width="107" height="32" rx="4" fill="#FCE4EC" stroke="#B83560" stroke-width="1.3"/><rect x="194" y="136" width="107" height="32" rx="4" fill="#FCE4EC" stroke="#B83560" stroke-width="1.3"/><rect x="309" y="180" width="107" height="32" rx="4" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.3"/><rect x="424" y="224" width="107" height="32" rx="4" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.3"/><rect x="194" y="268" width="107" height="32" rx="4" fill="#E3EBFF" stroke="#2B57C9" stroke-width="1.3"/><rect x="539" y="268" width="107" height="32" rx="4" fill="#E3EBFF" stroke="#2B57C9" stroke-width="1.3"/><rect x="654" y="312" width="107" height="32" rx="4" fill="#E9EDF3" stroke="#47546A" stroke-width="1.3"/><rect x="769" y="356" width="107" height="32" rx="4" fill="#DCEFF1" stroke="#0E6E7E" stroke-width="1.3"/><text x="20" y="24" text-anchor="start" font-size="12" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">从模型内部到外部工作流，七条路线各占一层；真实系统通常同时用好几条</text><text x="196" y="42" text-anchor="start" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">模型内部</text><text x="874" y="42" text-anchor="end" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">外部工作流</text><text x="247.5" y="72" text-anchor="middle" font-size="12" font-weight="700" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">表示</text><text x="362.5" y="72" text-anchor="middle" font-size="12" font-weight="700" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">学习目标</text><text x="477.5" y="72" text-anchor="middle" font-size="12" font-weight="700" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">时间计算</text><text x="592.5" y="72" text-anchor="middle" font-size="12" font-weight="700" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">任务接口</text><text x="707.5" y="72" text-anchor="middle" font-size="12" font-weight="700" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">输出结构</text><text x="822.5" y="72" text-anchor="middle" font-size="12" font-weight="700" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">外部流程</text><text x="20" y="110" text-anchor="start" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">VAE / 表示自编码器</text><text x="247.5" y="105" text-anchor="middle" font-size="10.2" font-weight="600" fill="#26805A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">降计算</text><text x="247.5" y="119" text-anchor="middle" font-size="10.2" font-weight="500" fill="#C2501A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">细节损失</text><text x="20" y="154" text-anchor="start" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">像素空间生成</text><text x="247.5" y="149" text-anchor="middle" font-size="10.2" font-weight="600" fill="#26805A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">去掉 tokenizer 瓶颈</text><text x="247.5" y="163" text-anchor="middle" font-size="10.2" font-weight="500" fill="#C2501A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">高维、计算重</text><text x="20" y="198" text-anchor="start" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">扩散与流参数化</text><text x="362.5" y="193" text-anchor="middle" font-size="10.2" font-weight="600" fill="#26805A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">优化与采样效率</text><text x="362.5" y="207" text-anchor="middle" font-size="10.2" font-weight="500" fill="#C2501A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">目标未必通用</text><text x="20" y="242" text-anchor="start" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">因果蒸馏与记忆</text><text x="477.5" y="237" text-anchor="middle" font-size="10.2" font-weight="600" fill="#26805A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">低延迟、长时</text><text x="477.5" y="251" text-anchor="middle" font-size="10.2" font-weight="500" fill="#C2501A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">信息泄漏、坍缩</text><text x="20" y="286" text-anchor="start" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">统一理解生成</text><text x="247.5" y="288" text-anchor="middle" font-size="10.2" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">共享表示</text><text x="592.5" y="281" text-anchor="middle" font-size="10.2" font-weight="600" fill="#26805A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">中间视觉推理</text><text x="592.5" y="295" text-anchor="middle" font-size="10.2" font-weight="500" fill="#C2501A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">梯度冲突</text><text x="20" y="330" text-anchor="start" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">符号或图层生成</text><text x="707.5" y="325" text-anchor="middle" font-size="10.2" font-weight="600" fill="#26805A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">可编辑</text><text x="707.5" y="339" text-anchor="middle" font-size="10.2" font-weight="500" fill="#C2501A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">结构歧义</text><text x="20" y="374" text-anchor="start" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Agent 工具编排</text><text x="822.5" y="369" text-anchor="middle" font-size="10.2" font-weight="600" fill="#26805A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">检索、规划、验收</text><text x="822.5" y="383" text-anchor="middle" font-size="10.2" font-weight="500" fill="#C2501A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">可靠性、成本</text><text x="20" y="418" text-anchor="start" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">每个色块上行是“能解决什么”，下行是“主要边界”，与第四节的表格逐行对应</text></svg>
