<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 390" width="900" height="390" role="img" aria-label="第 2 阶段：回头审视潜空间的三种做法"><defs><marker id="ah-u16s2latent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6577"/></marker></defs><rect x="0" y="0" width="900" height="390" fill="#ffffff"/><rect x="20" y="40" width="280" height="330" rx="5" fill="#F3F5F8" stroke="#D5DBE4" stroke-width="1"/><path d="M94,136 L94,157" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-u16s2latent)"/><path d="M226,136 L226,157" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-u16s2latent)"/><path d="M154,188 L163,188" fill="none" stroke="#5A6577" stroke-width="1.4" stroke-dasharray="3 2"/><path d="M94,216 L120,233" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-u16s2latent)"/><path d="M226,216 L200,233" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-u16s2latent)"/><rect x="310" y="40" width="280" height="330" rx="5" fill="#F3F5F8" stroke="#D5DBE4" stroke-width="1"/><path d="M450,134 L450,145" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-u16s2latent)"/><path d="M450,190 L450,201" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-u16s2latent)"/><path d="M450,246 L450,257" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-u16s2latent)"/><rect x="600" y="40" width="280" height="330" rx="5" fill="#F3F5F8" stroke="#D5DBE4" stroke-width="1"/><path d="M740,136 L740,157" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-u16s2latent)"/><path d="M740,210 L740,231" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-u16s2latent)"/><rect x="34" y="92" width="120" height="44" rx="5" fill="#E9EDF3" stroke="#47546A" stroke-width="1.5"/><rect x="34" y="160" width="120" height="56" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="166" y="92" width="120" height="44" rx="5" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.5"/><rect x="166" y="160" width="120" height="56" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><rect x="60" y="236" width="200" height="40" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="360" y="92" width="180" height="42" rx="5" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.5"/><rect x="360" y="148" width="180" height="42" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><rect x="360" y="204" width="180" height="42" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="360" y="260" width="180" height="42" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><rect x="650" y="92" width="180" height="44" rx="5" fill="#E9EDF3" stroke="#47546A" stroke-width="1.5"/><rect x="650" y="160" width="180" height="50" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="650" y="234" width="180" height="44" rx="5" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.5"/><text x="20" y="24" text-anchor="start" font-size="12" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">两阶段配方站稳以后，三种回应：给生成器补上语义，把语义表示直接当潜空间，或者干脆不要压缩器</text><text x="32" y="62" text-anchor="start" font-size="12.5" font-weight="700" fill="#B83560" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">对齐：REPA（2024）</text><text x="32" y="80" text-anchor="start" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">训练时多一项对齐损失</text><text x="94" y="117.72" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">加噪潜变量</text><text x="94" y="184.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">DiT 中间层</text><text x="94" y="199.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">去噪网络的特征</text><text x="226" y="117.72" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">干净图像</text><text x="226" y="184.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">冻结语义编码器</text><text x="226" y="199.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">如 DINOv2</text><text x="160" y="259.72" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">对齐损失：两组特征靠近</text><text x="160" y="304" text-anchor="middle" font-size="10.5" font-weight="500" fill="#26805A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">作者报告 SiT 训练提速 17.5 倍以上</text><text x="160" y="324" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">生成器仍在 VAE 潜空间里工作</text><text x="160" y="344" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">改的是训练信号，没换表示</text><text x="322" y="62" text-anchor="start" font-size="12.5" font-weight="700" fill="#B83560" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">换潜空间：RAE（2025）</text><text x="322" y="80" text-anchor="start" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">语义编码器 + 训练好的解码器</text><text x="450" y="116.72" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">图像</text><text x="450" y="165.82" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">冻结语义编码器</text><text x="450" y="180.38" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">DINO / SigLIP / MAE</text><text x="450" y="221.82" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">高维语义潜空间</text><text x="450" y="236.38" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">DiT 在这里生成</text><text x="450" y="277.82" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">训练好的解码器</text><text x="450" y="292.38" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">语义 → 像素</text><text x="450" y="344" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">要解决高维潜空间里的扩散难题</text><text x="450" y="326" text-anchor="middle" font-size="10.5" font-weight="500" fill="#26805A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">表示学习反过来为生成服务</text><text x="612" y="62" text-anchor="start" font-size="12.5" font-weight="700" fill="#C2501A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">重回像素：单阶段模型</text><text x="612" y="80" text-anchor="start" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Dieleman：走得通，“现在还太早”</text><text x="740" y="117.72" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">像素上的噪声</text><text x="740" y="181.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">像素空间生成器</text><text x="740" y="196.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">没有编码器和解码器</text><text x="740" y="259.72" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">图像</text><text x="740" y="306" text-anchor="middle" font-size="10.2" font-weight="500" fill="#26805A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">省掉压缩损失，小字和细节不再被编码器卡住</text><text x="740" y="326" text-anchor="middle" font-size="10.5" font-weight="400" fill="#C2501A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">要重新面对高维噪声、尺度和计算量</text><text x="740" y="346" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">三.2 在算这笔账</text></svg>
