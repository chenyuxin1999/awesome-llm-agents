" stroke-dasharray="4 3" marker-end="url(#ah-u16s3flowmap)"/><path d="M332.87,143.1 L419,160.866" fill="none" stroke="#5B45B0" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#ah-u16s3flowmap)"/><path d="M377.53,142.64 L419,160.838" fill="none" stroke="#5B45B0" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#ah-u16s3flowmap)"/><rect x="454" y="40" width="207" height="280" rx="5" fill="#F3F5F8" stroke="#D5DBE4" stroke-width="1"/><path d="M468,230 Q526.45,96 643,162" fill="none" stroke="#B9C2CF" stroke-width="2"/><path d="M468,230 L540.975,146" fill="none" stroke="#5B45B0" stroke-width="1.8" marker-end="url(#ah-u16s3flowmap)"/><path d="M540.975,146 L637,162" fill="none" stroke="#5B45B0" stroke-width="1.8" marker-end="url(#ah-u16s3flowmap)"/><rect x="671" y="40" width="207" height="280" rx="5" fill="#F3F5F8" stroke="#D5DBE4" stroke-width="1"/><path d="M685,230 Q743.45,96 860,162" fill="none" stroke="#B9C2CF" stroke-width="2"/><path d="M710.704,184.4 L805.356,141.5" fill="none" stroke="#5B45B0" stroke-width="1.8" marker-end="url(#ah-u16s3flowmap)"/><circle cx="34" cy="230" r="6" fill="#E9EDF3" stroke="#47546A" stroke-width="1.6"/><circle cx="209" cy="162" r="6" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.6"/><circle cx="251" cy="230" r="6" fill="#E9EDF3" stroke="#47546A" stroke-width="1.6"/><circle cx="426" cy="162" r="6" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.6"/><circle cx="251" cy="230" r="3" fill="#5B45B0"/><circle cx="291.299" cy="167.6" r="3" fill="#5B45B0"/><circle cx="332.87" cy="143.1" r="3" fill="#5B45B0"/><circle cx="377.53" cy="142.64" r="3" fill="#5B45B0"/><circle cx="468" cy="230" r="6" fill="#E9EDF3" stroke="#47546A" stroke-width="1.6"/><circle cx="643" cy="162" r="6" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.6"/><circle cx="500.856" cy="175.5" r="2.5" fill="#B9C2CF"/><circle cx="540.975" cy="146" r="2.5" fill="#B9C2CF"/><circle cx="588.356" cy="141.5" r="2.5" fill="#B9C2CF"/><circle cx="685" cy="230" r="6" fill="#E9EDF3" stroke="#47546A" stroke-width="1.6"/><circle cx="860" cy="162" r="6" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.6"/><circle cx="710.704" cy="184.4" r="2.5" fill="#B9C2CF"/><circle cx="733.032" cy="160.7" r="2.5" fill="#B9C2CF"/><circle cx="757.975" cy="146" r="2.5" fill="#B9C2CF"/><circle cx="779.812" cy="140.72" r="2.5" fill="#B9C2CF"/><circle cx="805.356" cy="141.5" r="2.5" fill="#B9C2CF"/><rect x="20" y="330" width="860" height="56" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><text x="20" y="24" text-anchor="start" font-size="12" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">示意：同一条从噪声走到数据的路径，四种方法学的东西不一样。灰点是噪声端，琥珀点是数据端</text><text x="30" y="60" text-anchor="start" font-size="12.5" font-weight="700" fill="#5B45B0" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">扩散 / 流</text><text x="30" y="78" text-anchor="start" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">只学每一点的局部方向</text><text x="123.5" y="272" text-anchor="middle" font-size="10.5" font-weight="500" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">推算定位：小步走很多次</text><text x="34" y="246" text-anchor="start" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">噪声</text><text x="215" y="186.5" text-anchor="end" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">数据</text><text x="247" y="60" text-anchor="start" font-size="12.5" font-weight="700" fill="#5B45B0" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">一致性模型</text><text x="247" y="78" text-anchor="start" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">任意一点都跳到终点</text><text x="340.5" y="272" text-anchor="middle" font-size="10.5" font-weight="500" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">只瞄准终点的部分 flow map</text><text x="251" y="246" text-anchor="start" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">噪声</text><text x="432" y="186.5" text-anchor="end" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">数据</text><text x="464" y="60" text-anchor="start" font-size="12.5" font-weight="700" fill="#5B45B0" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">渐进蒸馏 / shortcut</text><text x="464" y="78" text-anchor="start" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">两小步拼成一大步</text><text x="557.5" y="272" text-anchor="middle" font-size="10.5" font-weight="500" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">靠步长加倍组合长跳</text><text x="468" y="246" text-anchor="start" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">噪声</text><text x="649" y="186.5" text-anchor="end" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">数据</text><text x="681" y="60" text-anchor="start" font-size="12.5" font-weight="700" fill="#5B45B0" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">MeanFlow</text><text x="681" y="78" text-anchor="start" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">学一段时间的平均速度</text><text x="764.03" y="186.95" text-anchor="middle" font-size="10.5" font-weight="500" fill="#5B45B0" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">平均速度</text><text x="774.5" y="272" text-anchor="middle" font-size="10.5" font-weight="500" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">可以从零训练一步生成</text><text x="685" y="246" text-anchor="start" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">噪声</text><text x="866" y="186.5" text-anchor="end" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">数据</text><text x="774.5" y="292" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">无需预训练和蒸馏（作者报告）</text><text x="450" y="354.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">flow map：从路径上任意一点跳到任意另一点，相当于把扩散模型的积分学下来</text><text x="450" y="369.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">后三种都能放进这个框架里理解；Dieleman 的判断：采样变便宜，训练明显更复杂，通常还要依赖一个预训练扩散模型，引导和蒸馏也很难结合</text></svg>
