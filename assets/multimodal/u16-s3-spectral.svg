<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" width="880" height="320" role="img" aria-label="扩散是频域上的自回归（示意）"><defs><marker id="ah-u16s3spectral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6577"/></marker></defs><rect x="0" y="0" width="880" height="320" fill="#ffffff"/><line x1="70" y1="270" x2="430" y2="270" stroke="#5A6577" stroke-width="1.3"/><line x1="70" y1="50" x2="70" y2="270" stroke="#5A6577" stroke-width="1.3"/><line x1="74" y1="208.4" x2="426" y2="208.4" stroke="#47546A" stroke-width="1.4" stroke-dasharray="5 4"/><line x1="74" y1="149" x2="426" y2="149" stroke="#47546A" stroke-width="1.4" stroke-dasharray="5 4"/><line x1="74" y1="94" x2="426" y2="94" stroke="#47546A" stroke-width="1.4" stroke-dasharray="5 4"/><path d="M620,106 L647,106" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-u16s3spectral)"/><path d="M620,168 L647,168" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-u16s3spectral)"/><path d="M755,128 L755,143" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-u16s3spectral)"/><path d="M620,230 L647,230" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-u16s3spectral)"/><path d="M755,190 L755,205" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-u16s3spectral)"/><line x1="76" y1="60" x2="424" y2="256" stroke="#B86E00" stroke-width="2.4"/><circle cx="339.486" cy="208.4" r="4" fill="#C2501A"/><circle cx="234.02" cy="149" r="4" fill="#C2501A"/><circle cx="136.367" cy="94" r="4" fill="#C2501A"/><rect x="520" y="84" width="100" height="44" rx="5" fill="#E9EDF3" stroke="#47546A" stroke-width="1.5"/><rect x="650" y="84" width="210" height="44" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="520" y="146" width="100" height="44" rx="5" fill="#E9EDF3" stroke="#47546A" stroke-width="1.5"/><rect x="650" y="146" width="210" height="44" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="520" y="208" width="100" height="44" rx="5" fill="#E9EDF3" stroke="#47546A" stroke-width="1.5"/><rect x="650" y="208" width="210" height="44" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><text x="20" y="24" text-anchor="start" font-size="12" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">示意：Dieleman《Diffusion is spectral autoregression》的直观解释，只在许多图像平均的意义上成立</text><text x="250" y="298" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">空间频率（对数）：左边是大轮廓，右边是细纹理</text><text x="58" y="152" text-anchor="end" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">能量</text><text x="58" y="168" text-anchor="end" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">（对数）</text><text x="140" y="66" text-anchor="start" font-size="10.5" font-weight="600" fill="#B86E00" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">自然图像：幂律直线</text><text x="434" y="212.4" text-anchor="start" font-size="10.5" font-weight="500" fill="#47546A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">小噪声</text><text x="434" y="153" text-anchor="start" font-size="10.5" font-weight="500" fill="#47546A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">中噪声</text><text x="434" y="98" text-anchor="start" font-size="10.5" font-weight="500" fill="#47546A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">大噪声</text><text x="84" y="240" text-anchor="start" font-size="10.5" font-weight="500" fill="#47546A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">灰色虚线：噪声的功率谱是平的</text><text x="84" y="258" text-anchor="start" font-size="10.5" font-weight="600" fill="#C2501A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">红点：交点 = 截止频率</text><text x="520" y="64" text-anchor="start" font-size="12" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">去噪的顺序：近似在频域上做自回归</text><text x="570" y="109.72" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">大噪声</text><text x="755" y="109.72" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">先定下低频大轮廓</text><text x="570" y="171.72" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">中噪声</text><text x="755" y="171.72" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">补上中间层次的结构</text><text x="570" y="233.72" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">小噪声</text><text x="755" y="233.72" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">最后补高频细纹理</text><text x="520" y="290" text-anchor="start" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">少走几步 = 让一步补好几层细节，所以掉质量；</text><text x="520" y="308" text-anchor="start" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">音频波形上基本失效，换到梅尔频谱才近似成立</text></svg>
