<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" role="img" aria-label="暴露偏差与 Self Forcing"><defs><marker id="ah-u16s4selfforcing" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6577"/></marker></defs><rect x="0" y="0" width="900" height="400" fill="#ffffff"/><rect x="20" y="40" width="860" height="150" rx="5" fill="#F3F5F8" stroke="#D5DBE4" stroke-width="1"/><path d="M176,91 L193,91" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-u16s4selfforcing)"/><path d="M292,91 L309,91" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-u16s4selfforcing)"/><path d="M176,155 L193,155" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-u16s4selfforcing)"/><path d="M292,155 L309,155" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-u16s4selfforcing)"/><rect x="20" y="200" width="860" height="186" rx="5" fill="#F3F5F8" stroke="#D5DBE4" stroke-width="1"/><path d="M200,262 L227,262" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-u16s4selfforcing)"/><path d="M350,262 L377,262" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-u16s4selfforcing)"/><path d="M290,284 L290,303" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-u16s4selfforcing)"/><path d="M80,326 L54,326 L54,262 L77,262" fill="none" stroke="#5A6577" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#ah-u16s4selfforcing)"/><rect x="80" y="72" width="96" height="38" rx="5" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.5"/><rect x="196" y="72" width="96" height="38" rx="5" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.5"/><rect x="312" y="72" width="110" height="38" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="80" y="136" width="96" height="38" rx="5" fill="#E9EDF3" stroke="#47546A" stroke-width="1.5"/><rect x="196" y="136" width="96" height="38" rx="5" fill="#FDE8DD" stroke="#C2501A" stroke-width="1.5"/><rect x="312" y="136" width="110" height="38" rx="5" fill="#FDE8DD" stroke="#C2501A" stroke-width="1.5"/><rect x="470" y="80" width="390" height="90" rx="5" fill="#FDE8DD" stroke="#C2501A" stroke-width="1.5"/><rect x="80" y="240" width="120" height="44" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="230" y="240" width="120" height="44" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="380" y="240" width="120" height="44" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="80" y="306" width="420" height="40" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="540" y="236" width="320" height="110" rx="5" fill="#DCEFF1" stroke="#0E6E7E" stroke-width="1.5"/><text x="20" y="24" text-anchor="start" font-size="12" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">把双向视频模型改成一块接一块往下写之后，训练时看到的历史和推理时看到的历史对不上</text><text x="32" y="62" text-anchor="start" font-size="12.5" font-weight="700" fill="#C2501A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">以往：训练看真实历史，推理接着自己的输出写</text><text x="36" y="92" text-anchor="start" font-size="11.5" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">训练</text><text x="128" y="94.72" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">真实帧 1</text><text x="244" y="94.72" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">真实帧 2</text><text x="367" y="94.72" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">预测帧 3</text><text x="36" y="156" text-anchor="start" font-size="11.5" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">推理</text><text x="128" y="158.72" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">生成帧 1</text><text x="244" y="158.72" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">帧 2 带瑕疵</text><text x="367" y="158.72" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">帧 3 错得更多</text><text x="665" y="114.23" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">误差越滚越大</text><text x="665" y="129.29" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">一帧里的小错误被当作下一帧的输入；模型训练时从没见过自己的瑕疵，不知道</text><text x="665" y="143.78" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">怎么接住它们（Krea 博客称之为暴露偏差）</text><text x="32" y="222" text-anchor="start" font-size="12.5" font-weight="700" fill="#26805A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Self Forcing（2025）：训练时就按推理的方式自回归展开</text><text x="140" y="258.82" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">生成块 1</text><text x="140" y="273.38" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">少步扩散</text><text x="290" y="258.82" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">生成块 2</text><text x="290" y="273.38" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">少步扩散</text><text x="215" y="254" text-anchor="middle" font-size="9.5" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" style="paint-order:stroke;stroke-width:4px;stroke-linejoin:round" stroke="#ffffff">KV</text><text x="440" y="258.82" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">生成块 3</text><text x="440" y="273.38" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">少步扩散</text><text x="365" y="254" text-anchor="middle" font-size="9.5" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" style="paint-order:stroke;stroke-width:4px;stroke-linejoin:round" stroke="#ffffff">KV</text><text x="290" y="329.72" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">整段视频级的损失（分布匹配）</text><text x="40" y="300" text-anchor="end" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" style="paint-order:stroke;stroke-width:4px;stroke-linejoin:round" stroke="#ffffff">回传</text><text x="290" y="370" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">随机截断梯度控制训练成本；推理用滚动 KV 缓存往后外推</text><text x="700" y="265.74" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Krea Realtime 14B（2025-10）</text><text x="700" y="280.8" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Wan 2.1 14B 用 Self Forcing 蒸馏成自回归模型</text><text x="700" y="295.29" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">单张 B200、4 步采样约 11 fps</text><text x="700" y="309.78" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">首帧延迟约 1 秒（官方报告）</text><text x="700" y="324.27" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">局限：反向 KL 带来模式坍缩，多样性下降</text></svg>
