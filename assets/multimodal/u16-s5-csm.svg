<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" width="880" height="330" role="img" aria-label="Sesame CSM 的结构与它留下的差距"><defs><marker id="ah-u16s5csm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6577"/></marker></defs><rect x="0" y="0" width="880" height="330" fill="#ffffff"/><path d="M130,85 L157,85" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-u16s5csm)"/><path d="M310,85 L337,85" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-u16s5csm)"/><path d="M486,85 L517,85" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-u16s5csm)"/><path d="M670,85 L697,85" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-u16s5csm)"/><path d="M780,118 L780,140 L100,140 L100,112" fill="none" stroke="#5A6577" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#ah-u16s5csm)"/><path d="M280,242 L297,242" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-u16s5csm)"/><path d="M560,242 L577,242" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-u16s5csm)"/><rect x="20" y="60" width="110" height="50" rx="5" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.5"/><rect x="160" y="52" width="150" height="66" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><rect x="340" y="62" width="20" height="46" rx="3" fill="#E3EBFF" stroke="#2B57C9" stroke-width="1.2"/><rect x="364" y="62" width="20" height="46" rx="3" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.2"/><rect x="388" y="62" width="20" height="46" rx="3" fill="#E3EBFF" stroke="#2B57C9" stroke-width="1.2"/><rect x="412" y="62" width="20" height="46" rx="3" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.2"/><rect x="436" y="62" width="20" height="46" rx="3" fill="#E3EBFF" stroke="#2B57C9" stroke-width="1.2"/><rect x="460" y="62" width="20" height="46" rx="3" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.2"/><rect x="520" y="52" width="150" height="66" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="700" y="52" width="160" height="66" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="20" y="210" width="260" height="64" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="300" y="210" width="260" height="64" rx="5" fill="#FDE8DD" stroke="#C2501A" stroke-width="1.5"/><rect x="580" y="210" width="280" height="64" rx="5" fill="#FDE8DD" stroke="#C2501A" stroke-width="1.5"/><text x="20" y="24" text-anchor="start" font-size="12" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">语音也走两阶段：先把声音量化成多层离散 token，再让 Transformer 往下写</text><text x="75" y="81.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">对话音频</text><text x="75" y="96.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">前文的几轮</text><text x="235" y="74.92" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">残差向量量化</text><text x="235" y="89.48" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">每一帧音频变成</text><text x="235" y="103.28" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">多层码本 token</text><text x="410" y="50" text-anchor="middle" font-size="10.5" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">交错排列的文字与音频 token</text><text x="595" y="81.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">较大的主干网络</text><text x="595" y="96.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">预测第 1 层码本</text><text x="780" y="81.82" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">较小的补层网络</text><text x="780" y="96.38" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">补齐其余各层，压低延迟</text><text x="440" y="156" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">解码成音频，下一帧继续</text><text x="20" y="196" text-anchor="start" font-size="12" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">听感评测（作者报告）</text><text x="150" y="231.23" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">不给上下文</text><text x="150" y="246.29" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">字错率、说话人相似度接近人类；听者分不出模型和</text><text x="150" y="260.78" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">真人</text><text x="430" y="238.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">给出前面的对话</text><text x="430" y="253.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">听者稳定地偏好真人录音</text><text x="720" y="231.23" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">差在韵律</text><text x="720" y="246.29" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">语气和停顿取决于前面聊了什么；轮次交替还不会，下一</text><text x="720" y="260.78" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">步做全双工</text><text x="20" y="304" text-anchor="start" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">文中区分了两种 token：语义 token 紧凑、与说话人无关；声学 token 保留音色和身份</text></svg>
