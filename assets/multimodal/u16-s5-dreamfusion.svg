<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 280" width="880" height="280" role="img" aria-label="DreamFusion：用二维扩散先验优化三维表示"><defs><marker id="ah-u16s5dreamfusion" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6577"/></marker></defs><rect x="0" y="0" width="880" height="280" fill="#ffffff"/><path d="M180,90 L207,90" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-u16s5dreamfusion)"/><path d="M370,90 L397,90" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-u16s5dreamfusion)"/><path d="M490,90 L517,90" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-u16s5dreamfusion)"/><path d="M780,90 L753,90" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-u16s5dreamfusion)"/><path d="M635,120 L635,157" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-u16s5dreamfusion)"/><path d="M400,185 L100,185 L100,123" fill="none" stroke="#5A6577" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#ah-u16s5dreamfusion)"/><rect x="20" y="60" width="160" height="60" rx="5" fill="#E9EDF3" stroke="#47546A" stroke-width="1.5"/><rect x="210" y="60" width="160" height="60" rx="5" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.5"/><rect x="400" y="60" width="90" height="60" rx="5" fill="#E9EDF3" stroke="#47546A" stroke-width="1.5"/><rect x="520" y="60" width="230" height="60" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="780" y="60" width="80" height="60" rx="5" fill="#E3EBFF" stroke="#2B57C9" stroke-width="1.5"/><rect x="400" y="160" width="350" height="50" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><text x="20" y="24" text-anchor="start" font-size="12" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">不需要三维训练数据，也不改动图像扩散模型：让三维物体从任意角度渲染出来的图，在二维模型看来都合理</text><text x="100" y="86.82" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">三维表示</text><text x="100" y="101.38" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">NeRF，随机初始化</text><text x="290" y="86.82" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">随机选一个视角</text><text x="290" y="101.38" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">渲染出一张二维图</text><text x="445" y="93.72" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">加噪</text><text x="635" y="86.82" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">冻结的文生图扩散模型</text><text x="635" y="101.38" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">读文字提示，判断这张图该往哪修</text><text x="820" y="93.72" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">文字提示</text><text x="575" y="181.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">概率密度蒸馏损失</text><text x="575" y="196.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">渲染图在扩散模型看来有多合理</text><text x="250" y="178" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" style="paint-order:stroke;stroke-width:4px;stroke-linejoin:round" stroke="#ffffff">梯度只更新三维表示</text><text x="20" y="250" text-anchor="start" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">换很多个视角反复做，三维物体就被二维先验“雕”出来；不同视角怎样对应同一个物体，是这条路从一开始就要处理的问题</text></svg>
