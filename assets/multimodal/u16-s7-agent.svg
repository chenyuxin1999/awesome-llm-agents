<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" role="img" aria-label="从一次采样到可交付的产物（示意）"><defs><marker id="ah-u16s7agent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6577"/></marker></defs><rect x="0" y="0" width="900" height="420" fill="#ffffff"/><rect x="20" y="40" width="860" height="132" rx="5" fill="#F3F5F8" stroke="#D5DBE4" stroke-width="1"/><path d="M190,96 L217,96" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-u16s7agent)"/><path d="M370,96 L397,96" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-u16s7agent)"/><rect x="20" y="182" width="860" height="226" rx="5" fill="#F3F5F8" stroke="#D5DBE4" stroke-width="1"/><path d="M170,243 L209,243" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-u16s7agent)"/><path d="M342,243 L381,243" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-u16s7agent)"/><path d="M514,243 L553,243" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-u16s7agent)"/><path d="M686,243 L725,243" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-u16s7agent)"/><path d="M621,322 L621,338 L449,338 L449,325" fill="none" stroke="#5A6577" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#ah-u16s7agent)"/><rect x="40" y="74" width="150" height="44" rx="5" fill="#E3EBFF" stroke="#2B57C9" stroke-width="1.5"/><rect x="220" y="74" width="150" height="44" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="400" y="74" width="460" height="44" rx="5" fill="#FDE8DD" stroke="#C2501A" stroke-width="1.5"/><rect x="40" y="124" width="150" height="40" rx="4" fill="#FFFFFF" stroke="#9AA6B8" stroke-width="1" stroke-dasharray="3 3"/><rect x="220" y="124" width="150" height="40" rx="4" fill="#FFFFFF" stroke="#9AA6B8" stroke-width="1" stroke-dasharray="3 3"/><rect x="400" y="124" width="460" height="40" rx="4" fill="#FFFFFF" stroke="#9AA6B8" stroke-width="1" stroke-dasharray="3 3"/><rect x="40" y="214" width="130" height="58" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="40" y="278" width="130" height="44" rx="4" fill="#FFFFFF" stroke="#9AA6B8" stroke-width="1" stroke-dasharray="3 3"/><rect x="212" y="214" width="130" height="58" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="212" y="278" width="130" height="44" rx="4" fill="#FFFFFF" stroke="#9AA6B8" stroke-width="1" stroke-dasharray="3 3"/><rect x="384" y="214" width="130" height="58" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><rect x="384" y="278" width="130" height="44" rx="4" fill="#FFFFFF" stroke="#9AA6B8" stroke-width="1" stroke-dasharray="3 3"/><rect x="556" y="214" width="130" height="58" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="556" y="278" width="130" height="44" rx="4" fill="#FFFFFF" stroke="#9AA6B8" stroke-width="1" stroke-dasharray="3 3"/><rect x="728" y="214" width="130" height="58" rx="5" fill="#E9EDF3" stroke="#47546A" stroke-width="1.5"/><rect x="728" y="278" width="130" height="44" rx="4" fill="#FFFFFF" stroke="#9AA6B8" stroke-width="1" stroke-dasharray="3 3"/><text x="20" y="24" text-anchor="start" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">目标：把猫换成白猫，其他都别动（示意：两种系统的反应，数字为示意）</text><text x="32" y="62" text-anchor="start" font-size="12.5" font-weight="700" fill="#C2501A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">只会一次性出图</text><text x="115" y="99.72" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">改写提示词</text><text x="295" y="99.72" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">整张重新生成</text><text x="630" y="99.72" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">猫变白了，构图、光影、其他物体也跟着变</text><text x="46" y="137" text-anchor="start" font-size="9" font-weight="700" fill="#0E6E7E" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">例</text><text x="121" y="148" text-anchor="middle" font-size="9.5" font-weight="500" fill="#1F2937" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">“一只白猫把杯子推下桌”</text><text x="226" y="137" text-anchor="start" font-size="9" font-weight="700" fill="#0E6E7E" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">例</text><text x="301" y="141.5" text-anchor="middle" font-size="9.5" font-weight="500" fill="#1F2937" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">同一句话，换一个</text><text x="301" y="154.5" text-anchor="middle" font-size="9.5" font-weight="500" fill="#1F2937" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">随机种子再画一张</text><text x="406" y="137" text-anchor="start" font-size="9" font-weight="700" fill="#0E6E7E" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">例</text><text x="636" y="148" text-anchor="middle" font-size="9.5" font-weight="500" fill="#1F2937" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">桌面从木色变成大理石，杯子从左边挪到右边，窗外的光也换了方向</text><text x="32" y="204" text-anchor="start" font-size="12.5" font-weight="700" fill="#26805A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">会调用工具、保留结构的 agent</text><text x="105" y="239.82" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">理解指令</text><text x="105" y="254.38" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">要改：猫；要保：其他</text><text x="46" y="291" text-anchor="start" font-size="9" font-weight="700" fill="#0E6E7E" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">例</text><text x="111" y="297.5" text-anchor="middle" font-size="9.3" font-weight="500" fill="#1F2937" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">猫约占画面 18%；</text><text x="111" y="310.5" text-anchor="middle" font-size="9.3" font-weight="500" fill="#1F2937" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">桌子、杯子、窗都要保</text><text x="277" y="232.92" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">分割出猫</text><text x="277" y="247.48" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">调用分割工具，抠出猫的</text><text x="277" y="261.28" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">轮廓</text><text x="218" y="291" text-anchor="start" font-size="9" font-weight="700" fill="#0E6E7E" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">例</text><text x="283" y="297.5" text-anchor="middle" font-size="9.3" font-weight="500" fill="#1F2937" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">一张 210×180</text><text x="283" y="310.5" text-anchor="middle" font-size="9.3" font-weight="500" fill="#1F2937" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">像素的猫轮廓</text><text x="191" y="237" text-anchor="middle" font-size="9.5" font-weight="500" fill="#0E6E7E" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" style="paint-order:stroke;stroke-width:4px;stroke-linejoin:round" stroke="#ffffff">改哪里</text><text x="449" y="239.82" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">只改这一层</text><text x="449" y="254.38" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">只在轮廓里把猫画成白色</text><text x="390" y="291" text-anchor="start" font-size="9" font-weight="700" fill="#0E6E7E" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">例</text><text x="455" y="297.5" text-anchor="middle" font-size="9.3" font-weight="500" fill="#1F2937" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">轮廓里重画成白猫，</text><text x="455" y="310.5" text-anchor="middle" font-size="9.3" font-weight="500" fill="#1F2937" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">轮廓外一个像素不动</text><text x="363" y="237" text-anchor="middle" font-size="9.5" font-weight="500" fill="#0E6E7E" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" style="paint-order:stroke;stroke-width:4px;stroke-linejoin:round" stroke="#ffffff">轮廓</text><text x="621" y="239.82" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">检查</text><text x="621" y="254.38" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">猫以外的地方没变才算过</text><text x="562" y="291" text-anchor="start" font-size="9" font-weight="700" fill="#0E6E7E" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">例</text><text x="627" y="297.5" text-anchor="middle" font-size="9.3" font-weight="500" fill="#1F2937" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">轮廓外逐像素比对：</text><text x="627" y="310.5" text-anchor="middle" font-size="9.3" font-weight="500" fill="#1F2937" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">0 处变化，通过</text><text x="535" y="237" text-anchor="middle" font-size="9.5" font-weight="500" fill="#0E6E7E" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" style="paint-order:stroke;stroke-width:4px;stroke-linejoin:round" stroke="#ffffff">新图</text><text x="793" y="239.82" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">存成新版本</text><text x="793" y="254.38" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">v1 仍可回退</text><text x="734" y="291" text-anchor="start" font-size="9" font-weight="700" fill="#0E6E7E" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">例</text><text x="799" y="297.5" text-anchor="middle" font-size="9.3" font-weight="500" fill="#1F2937" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">cat_white_v2，</text><text x="799" y="310.5" text-anchor="middle" font-size="9.3" font-weight="500" fill="#1F2937" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">v1 留着</text><text x="707" y="237" text-anchor="middle" font-size="9.5" font-weight="500" fill="#0E6E7E" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" style="paint-order:stroke;stroke-width:4px;stroke-linejoin:round" stroke="#ffffff">合格</text><text x="535" y="352" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">别处变了：回到这一层重改</text><text x="40" y="376" text-anchor="start" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">视频也一样：单段只有几秒到十几秒，完整短片要先规划镜头，再逐段生成、检查、拼接。</text><text x="40" y="394" text-anchor="start" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">前几个阶段决定素材的上限，这一圈流程决定作品能不能按要求交付</text></svg>
