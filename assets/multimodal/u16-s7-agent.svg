<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="900" height="340" role="img" aria-label="从一次采样到可交付的产物（示意）"><defs><marker id="ah-u16s7agent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6577"/></marker></defs><rect x="0" y="0" width="900" height="340" fill="#ffffff"/><rect x="20" y="40" width="860" height="92" rx="5" fill="#F3F5F8" stroke="#D5DBE4" stroke-width="1"/><path d="M190,96 L217,96" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-u16s7agent)"/><path d="M370,96 L397,96" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-u16s7agent)"/><rect x="20" y="142" width="860" height="184" rx="5" fill="#F3F5F8" stroke="#D5DBE4" stroke-width="1"/><path d="M190,203 L209,203" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-u16s7agent)"/><path d="M362,203 L381,203" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-u16s7agent)"/><path d="M534,203 L553,203" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-u16s7agent)"/><path d="M706,203 L725,203" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-u16s7agent)"/><path d="M631,228 L631,246 L459,246 L459,231" fill="none" stroke="#5A6577" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#ah-u16s7agent)"/><rect x="40" y="74" width="150" height="44" rx="5" fill="#E3EBFF" stroke="#2B57C9" stroke-width="1.5"/><rect x="220" y="74" width="150" height="44" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="400" y="74" width="460" height="44" rx="5" fill="#FDE8DD" stroke="#C2501A" stroke-width="1.5"/><rect x="40" y="178" width="150" height="50" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="212" y="178" width="150" height="50" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="384" y="178" width="150" height="50" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><rect x="556" y="178" width="150" height="50" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="728" y="178" width="150" height="50" rx="5" fill="#E9EDF3" stroke="#47546A" stroke-width="1.5"/><text x="20" y="24" text-anchor="start" font-size="12" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">示意：导师说“把猫换成白猫，其他都别动”，两种系统的反应</text><text x="32" y="62" text-anchor="start" font-size="12.5" font-weight="700" fill="#C2501A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">只会一次性出图</text><text x="115" y="99.72" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">改写提示词</text><text x="295" y="99.72" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">整张重新生成</text><text x="630" y="99.72" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">猫变白了，构图、光影、其他物体也跟着变</text><text x="32" y="164" text-anchor="start" font-size="12.5" font-weight="700" fill="#26805A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">会调用工具、保留结构的 agent</text><text x="115" y="199.82" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">理解指令</text><text x="115" y="214.38" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">要改：猫；要保：其他</text><text x="287" y="199.82" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">分割出猫</text><text x="287" y="214.38" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">工具调用</text><text x="459" y="199.82" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">只改这一层</text><text x="459" y="214.38" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">局部编辑</text><text x="631" y="199.82" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">检查</text><text x="631" y="214.38" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">其余区域没变</text><text x="803" y="199.82" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">存成新版本</text><text x="803" y="214.38" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">v1 仍可回退</text><text x="545" y="260" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">没通过就再改</text><text x="40" y="290" text-anchor="start" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">视频也一样：单段只有几秒到十几秒，完整短片要先规划镜头，再逐段生成、检查、拼接。</text><text x="40" y="308" text-anchor="start" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">前几个阶段决定素材的上限，这一圈流程决定作品能不能按要求交付</text></svg>
