<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 470" width="920" height="470" role="img" aria-label="语音的三步演进：同一句迟疑的问话"><defs><marker id="ah-u16speechreal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6577"/></marker></defs><rect x="0" y="0" width="920" height="470" fill="#ffffff"/><path d="M124,92 L137,92" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-u16speechreal)"/><path d="M240,92 L255,92" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-u16speechreal)"/><path d="M426,92 L441,92" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-u16speechreal)"/><path d="M534,92 L549,92" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-u16speechreal)"/><path d="M722,92 L737,92" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-u16speechreal)"/><path d="M124,238 L137,238" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-u16speechreal)"/><path d="M304,238 L325,238" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-u16speechreal)"/><path d="M558,238 L577,238" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-u16speechreal)"/><path d="M744,238 L765,238" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-u16speechreal)"/><line x1="70" y1="353" x2="896" y2="353" stroke="#D5DBE4" stroke-width="1"/><line x1="70" y1="397" x2="896" y2="397" stroke="#D5DBE4" stroke-width="1"/><polyline points="24,102.945 29,102.748 34,81.3572 39,82.0369 44,100.052 49,97.6633 54,96.0735 59,87.3953 64,94.5427 69,94.5632 74,93.9489 79,83.8012 84,90.3361 89,89.4448 94,97.3523 99,103.876 104,102.785 109,93.0602 114,90.6765 119,86.4378" fill="none" stroke="#2B57C9" stroke-width="1.3"/><rect x="140" y="70" width="100" height="44" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="258" y="70" width="168" height="44" rx="5" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1.5"/><rect x="444" y="70" width="90" height="44" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="552" y="70" width="170" height="44" rx="5" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1.5"/><rect x="740" y="70" width="90" height="44" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><polyline points="846,87.7768 851,85.6507 856,90.3369 861,86.4796 866,85.0642 871,90.4255 876,98.6873 881,96.8072 886,96.2426 891,87.5509" fill="none" stroke="#2B57C9" stroke-width="1.3"/><polyline points="24,248.945 29,248.748 34,227.357 39,228.037 44,246.052 49,243.663 54,242.074 59,233.395 64,240.543 69,240.563 74,239.949 79,229.801 84,236.336 89,235.445 94,243.352 99,249.876 104,248.785 109,239.06 114,236.677 119,232.438" fill="none" stroke="#2B57C9" stroke-width="1.3"/><rect x="140" y="228" width="40" height="20" fill="#FCE4EC" stroke="#B83560" stroke-width="1"/><rect x="181" y="228" width="40" height="20" fill="#FCE4EC" stroke="#B83560" stroke-width="1"/><rect x="222" y="228" width="40" height="20" fill="#FCE4EC" stroke="#B83560" stroke-width="1"/><rect x="263" y="228" width="40" height="20" fill="#FCE4EC" stroke="#B83560" stroke-width="1"/><rect x="328" y="214" width="230" height="48" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="580" y="228" width="40" height="20" fill="#FCE4EC" stroke="#B83560" stroke-width="1"/><rect x="621" y="228" width="40" height="20" fill="#FCE4EC" stroke="#B83560" stroke-width="1"/><rect x="662" y="228" width="40" height="20" fill="#FCE4EC" stroke="#B83560" stroke-width="1"/><rect x="703" y="228" width="40" height="20" fill="#FCE4EC" stroke="#B83560" stroke-width="1"/><polyline points="768,242.693 773,243.151 778,237.761 783,234.186 788,230.007 793,240.605 798,237.524 803,242.156 808,235.971 813,242.322 818,234.363 823,242.831 828,241.677 833,236.624 838,238.613 843,240.913 848,233.088 853,238.858" fill="none" stroke="#2B57C9" stroke-width="1.3"/><rect x="110" y="342" width="250" height="22" rx="5" fill="#E3EBFF" stroke="#2B57C9" stroke-width="1.5"/><rect x="470" y="342" width="170" height="22" rx="5" fill="#E3EBFF" stroke="#2B57C9" stroke-width="1.5"/><rect x="300" y="386" width="36" height="22" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><rect x="386" y="386" width="82" height="22" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><rect x="660" y="386" width="190" height="22" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><line x1="470" y1="330" x2="470" y2="420" stroke="#C2501A" stroke-width="1.2" stroke-dasharray="3 3"/><text x="24" y="26" text-anchor="start" font-size="12.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">示意：同一句带着迟疑和笑声的问话“呃……明天要不要带伞？”，在三种语音系统里怎么走</text><text x="24" y="56" text-anchor="start" font-size="11.5" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">级联：三段接力</text><text x="24" y="200" text-anchor="start" font-size="11.5" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">端到端：一个模型直接听、直接说</text><text x="24" y="320" text-anchor="start" font-size="11.5" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">全双工：每一刻都在同时听和说（Moshi）</text><text x="74" y="118" text-anchor="middle" font-size="9.5" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">迟疑 + 背景笑声</text><text x="190" y="95.41" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">语音识别</text><text x="342" y="95.348" text-anchor="middle" font-size="10.8" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">“明天要不要带伞”</text><text x="342" y="128" text-anchor="middle" font-size="9.8" font-weight="600" fill="#C2501A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">迟疑和笑声在第一棒就丢了</text><text x="489" y="95.41" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">语言模型</text><text x="637" y="95.255" text-anchor="middle" font-size="10.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">“明天有雨，记得带伞。”</text><text x="785" y="95.41" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">语音合成</text><text x="700" y="160" text-anchor="middle" font-size="10" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">三段的延迟相加，往往好几秒；说到一半也没法打断</text><text x="160" y="242" text-anchor="middle" font-size="9.5" font-weight="500" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">812</text><text x="201" y="242" text-anchor="middle" font-size="9.5" font-weight="500" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">77</text><text x="242" y="242" text-anchor="middle" font-size="9.5" font-weight="500" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">4051</text><text x="283" y="242" text-anchor="middle" font-size="9.5" font-weight="500" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">…</text><text x="222" y="268" text-anchor="middle" font-size="9.8" font-weight="600" fill="#B83560" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">音频 token：迟疑和笑声都还在里面</text><text x="443" y="234.648" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">一个模型</text><text x="443" y="248.628" text-anchor="middle" font-size="9.8" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">例如 Qwen2.5-Omni：Thinker 想、Talker 说</text><text x="600" y="242" text-anchor="middle" font-size="9.5" font-weight="500" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">3310</text><text x="641" y="242" text-anchor="middle" font-size="9.5" font-weight="500" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">96</text><text x="682" y="242" text-anchor="middle" font-size="9.5" font-weight="500" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">1287</text><text x="723" y="242" text-anchor="middle" font-size="9.5" font-weight="500" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">…</text><text x="812" y="268" text-anchor="middle" font-size="9.8" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">GPT-4o 平均约 320 毫秒</text><text x="60" y="358" text-anchor="end" font-size="10.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">你</text><text x="235" y="355.976" text-anchor="middle" font-size="9.6" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">呃……明天要不要带……</text><text x="555" y="355.976" text-anchor="middle" font-size="9.6" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">算了，后天呢？</text><text x="60" y="402" text-anchor="end" font-size="10.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">模型</text><text x="318" y="399.976" text-anchor="middle" font-size="9.6" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">嗯</text><text x="427" y="399.976" text-anchor="middle" font-size="9.6" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">明天有雨</text><text x="755" y="399.976" text-anchor="middle" font-size="9.6" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">后天晴，不用带。</text><text x="470" y="440" text-anchor="middle" font-size="10" font-weight="600" fill="#C2501A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">你一插话，它马上停下，听完再接</text><text x="318" y="440" text-anchor="middle" font-size="10" font-weight="600" fill="#B83560" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">边听边“嗯”</text></svg>
