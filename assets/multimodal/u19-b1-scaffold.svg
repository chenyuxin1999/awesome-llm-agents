<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-label="保留调用文字、替换返回图像的对照"><defs><marker id="ah-u19b1scaffold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6577"/></marker></defs><rect x="0" y="0" width="900" height="300" fill="#ffffff"/><path d="M238,69 L261,69" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-u19b1scaffold)"/><path d="M372,69 L395,69" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-u19b1scaffold)"/><path d="M506,69 L529,69" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-u19b1scaffold)"/><path d="M238,135 L261,135" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-u19b1scaffold)"/><path d="M372,135 L395,135" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-u19b1scaffold)"/><path d="M506,135 L529,135" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-u19b1scaffold)"/><path d="M232,201 L255,201" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-u19b1scaffold)"/><rect x="130" y="46" width="108" height="46" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="264" y="46" width="108" height="46" rx="5" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.5"/><rect x="398" y="46" width="108" height="46" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="532" y="46" width="108" height="46" rx="5" fill="#E9EDF3" stroke="#47546A" stroke-width="1.5"/><rect x="130" y="112" width="108" height="46" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="264" y="112" width="108" height="46" rx="5" fill="#F3F5F8" stroke="#D5DBE4" stroke-width="1.5" stroke-dasharray="4 3"/><rect x="398" y="112" width="108" height="46" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="532" y="112" width="108" height="46" rx="5" fill="#E9EDF3" stroke="#47546A" stroke-width="1.5"/><rect x="130" y="178" width="102" height="46" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="258" y="178" width="102" height="46" rx="5" fill="#E9EDF3" stroke="#47546A" stroke-width="1.5"/><rect x="668" y="46" width="218" height="112" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="668" y="168" width="218" height="66" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><text x="16" y="28" text-anchor="start" font-size="12" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">同一道题、同一张原图，只改动工具返回的东西（示意）</text><text x="16" y="74" text-anchor="start" font-size="11.5" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">① 完整工具链</text><text x="184" y="65.82" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">调用文字</text><text x="184" y="80.38" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">目标、坐标、意图</text><text x="318" y="65.82" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">返回图像</text><text x="318" y="80.38" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">裁剪放大后的新图</text><text x="452" y="72.72" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">后续推理</text><text x="586" y="72.72" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">答案</text><text x="16" y="140" text-anchor="start" font-size="11.5" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">② 只留结构</text><text x="184" y="131.82" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">调用文字</text><text x="184" y="146.38" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">原样保留</text><text x="318" y="131.82" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">占位文本</text><text x="318" y="146.38" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">替代返回的图片</text><text x="452" y="138.72" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">后续推理</text><text x="586" y="138.72" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">答案</text><text x="16" y="206" text-anchor="start" font-size="11.5" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">③ 不用工具</text><text x="181" y="204.72" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">直接推理</text><text x="309" y="204.72" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">答案</text><text x="777" y="98.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">① 对 ②</text><text x="777" y="113.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">差出来的部分，才是返回像素带来的新证据</text><text x="777" y="197.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">② 对 ③</text><text x="777" y="212.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">调用文字本身帮模型组织了问题</text><text x="450" y="278" text-anchor="middle" font-size="10.5" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Thinking With Tools, Not With Pixels 在所测的数据分布上，返回图片的必要性受到了挑战；</text><text x="450" y="294" text-anchor="middle" font-size="10.5" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">这说明一些基准允许结构化文字携带主要信息，图像在别的任务上依然可能不可或缺。</text></svg>
