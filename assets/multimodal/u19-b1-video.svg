ight="50" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="396" y="132" width="164" height="50" rx="5" fill="#E9EDF3" stroke="#47546A" stroke-width="1.5"/><rect x="586" y="128" width="298" height="58" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><rect x="16" y="228" width="126.5" height="40" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="168.5" y="228" width="126.5" height="40" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="321" y="228" width="126.5" height="40" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="473.5" y="228" width="126.5" height="40" rx="5" fill="#E9EDF3" stroke="#47546A" stroke-width="1.5"/><rect x="620" y="224" width="264" height="48" rx="5" fill="#E9EDF3" stroke="#47546A" stroke-width="1.5"/><text x="16" y="28" text-anchor="start" font-size="12" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">OmniReasoner：先便宜地看全局，再决定在哪里放大</text><text x="114.75" y="66.72" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">长音视频</text><text x="338.25" y="66.72" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">低成本全局预览</text><text x="561.75" y="59.82" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">要不要、在哪里放大</text><text x="561.75" y="74.38" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">SFT + RL 学出来</text><text x="785.25" y="66.72" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">相关时间段高保真处理</text><text x="16" y="120" text-anchor="start" font-size="12" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Video-DeepResearch：分阶段解锁工具，先看后查</text><text x="98" y="153.82" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">阶段一：只开视觉工具</text><text x="98" y="168.38" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">跨帧视觉定位</text><text x="288" y="153.82" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">阶段二：解锁网页检索</text><text x="288" y="168.38" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">带着定位结果去查</text><text x="478" y="153.82" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">答案</text><text x="478" y="168.38" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">200 题多跳视频问答 64.0%</text><text x="735" y="153.51" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">初步评测抓到的两个毛病</text><text x="735" y="167.69" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">绕开视觉工具直接文字搜索；用参数记忆假装查过</text><text x="16" y="214" text-anchor="start" font-size="12" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">AdaVDR：按任务和自身能力挑工具，只在中间结果不可靠时回退</text><text x="79.25" y="251.72" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">挑工具</text><text x="231.75" y="251.72" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">执行</text><text x="384.25" y="251.72" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">中间结果可靠吗</text><text x="536.75" y="251.72" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">继续</text><text x="231.75" y="280" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" style="paint-order:stroke;stroke-width:4px;stroke-linejoin:round" stroke="#ffffff">不可靠：反思、换工具</text><text x="752" y="244.01" text-anchor="middle" font-size="10.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">VDR-EE 比基座高 15.20 个点</text><text x="752" y="258.5" text-anchor="middle" font-size="10.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">VideoDR 比基座高 29.00 个点</text></svg>
