" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">截图那一刻坐标下是“提交”，执行那一刻可能被弹窗遮</text><text x="752" y="202.935" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">住、页面已滚动</text><text x="752" y="256.51" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">AgentVQA：22 个模型最好 58.5%</text><text x="752" y="270.69" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">主要失败来自视觉定位与状态追踪</text><text x="450" y="318" text-anchor="middle" font-size="10.5" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">静态截图上的定位精度和交互中的落点正确率是两个不同的量。</text></svg>
