<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 260" width="880" height="260" role="img" aria-label="开环的两种做法：HuggingGPT 与视觉程序"><defs><marker id="ah-u19opentworoutes" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6577"/></marker></defs><rect x="0" y="0" width="880" height="260" fill="#ffffff"/><path d="M206.5,75 L233.5,75" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-u19opentworoutes)"/><path d="M425,75 L452,75" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-u19opentworoutes)"/><path d="M643.5,75 L670.5,75" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-u19opentworoutes)"/><path d="M206.5,188 L233.5,188" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-u19opentworoutes)"/><path d="M425,188 L452,188" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-u19opentworoutes)"/><path d="M643.5,188 L670.5,188" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-u19opentworoutes)"/><rect x="18" y="44" width="188.5" height="62" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="236.5" y="44" width="188.5" height="62" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="455" y="44" width="188.5" height="62" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="673.5" y="44" width="188.5" height="62" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="18" y="160" width="188.5" height="56" rx="5" fill="#E3EBFF" stroke="#2B57C9" stroke-width="1.5"/><rect x="236.5" y="160" width="188.5" height="56" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="455" y="160" width="188.5" height="56" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="673.5" y="160" width="188.5" height="56" rx="5" fill="#E9EDF3" stroke="#47546A" stroke-width="1.5"/><text x="18" y="30" text-anchor="start" font-size="12.5" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">HuggingGPT：语言模型当调度员（四个阶段）</text><text x="112.25" y="71.82" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">任务规划</text><text x="112.25" y="86.38" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">LLM 把请求拆成子任务</text><text x="330.75" y="71.82" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">模型选择</text><text x="330.75" y="86.38" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">按 Hugging Face 上的功能描述挑</text><text x="549.25" y="71.82" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">任务执行</text><text x="549.25" y="86.38" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">检测、分割、生图、修图模型各做一件</text><text x="767.75" y="71.82" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">回复生成</text><text x="767.75" y="86.38" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">LLM 汇总执行结果</text><text x="658.5" y="40" text-anchor="middle" font-size="10" font-weight="400" fill="#B83560" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" style="paint-order:stroke;stroke-width:4px;stroke-linejoin:round" stroke="#ffffff">结果以文字回来</text><text x="18" y="146" text-anchor="start" font-size="12.5" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">VisProg / ViperGPT：语言模型写一段视觉程序</text><text x="112.25" y="191.72" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">问题 + 图</text><text x="330.75" y="184.82" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">LLM 写程序</text><text x="330.75" y="199.38" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">写的时候同样看不见图</text><text x="549.25" y="184.82" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">执行程序</text><text x="549.25" y="199.38" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">找物体、裁剪、计数、比较大小</text><text x="767.75" y="184.82" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">答案</text><text x="767.75" y="199.38" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">每一步可以逐行检查</text><text x="440" y="248" text-anchor="middle" font-size="10.5" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">两种做法都不训练任何东西；共同的短板是语言模型看不到工具真正画出、找出的东西。</text></svg>
