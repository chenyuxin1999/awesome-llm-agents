<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340" role="img" aria-label="一次电脑操作的闭环与三个追问"><defs><marker id="ah-u19overviewloop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6577"/></marker></defs><rect x="0" y="0" width="880" height="340" fill="#ffffff"/><path d="M162,163 L193,163" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-u19overviewloop)"/><path d="M336,163 L367,163" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-u19overviewloop)"/><path d="M510,163 L541,163" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-u19overviewloop)"/><path d="M684,163 L715,163" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-u19overviewloop)"/><path d="M614,198 L614,236 L92,236 L92,201" fill="none" stroke="#5A6577" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#ah-u19overviewloop)"/><path d="M92,72 L92,125" fill="none" stroke="#B83560" stroke-width="1.4" stroke-dasharray="3 3" marker-end="url(#ah-u19overviewloop)"/><path d="M440,72 L440,125" fill="none" stroke="#B83560" stroke-width="1.4" stroke-dasharray="3 3" marker-end="url(#ah-u19overviewloop)"/><path d="M788,72 L788,125" fill="none" stroke="#B83560" stroke-width="1.4" stroke-dasharray="3 3" marker-end="url(#ah-u19overviewloop)"/><rect x="22" y="128" width="140" height="70" rx="5" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.5"/><rect x="196" y="128" width="140" height="70" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="370" y="128" width="140" height="70" rx="5" fill="#FDE8DD" stroke="#C2501A" stroke-width="1.5"/><rect x="544" y="128" width="140" height="70" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="718" y="128" width="140" height="70" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="8" y="18" width="210" height="54" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><rect x="335" y="18" width="210" height="54" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><rect x="662" y="18" width="210" height="54" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><rect x="22" y="262" width="836" height="58" rx="5" fill="#F3F5F8" stroke="#D5DBE4" stroke-width="1.5"/><text x="92" y="159.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">观察</text><text x="92" y="174.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">截图、DOM、无障碍树</text><text x="266" y="159.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">状态估计</text><text x="266" y="174.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">所见、做过的、授权范围</text><text x="440" y="159.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">动作</text><text x="440" y="174.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">坐标、元素或命令行</text><text x="614" y="159.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">执行</text><text x="614" y="174.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">电脑或浏览器真的变了</text><text x="788" y="159.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">验证</text><text x="788" y="174.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">读文件、数据库、应用状态</text><text x="353" y="230" text-anchor="middle" font-size="11" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" style="paint-order:stroke;stroke-width:4px;stroke-linejoin:round" stroke="#ffffff">执行之后，电脑返回一张新截图，下一轮从这里开始</text><text x="113" y="41.665" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">① 看到的是真实的证据吗？</text><text x="113" y="56.035" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">可能不完整、过时，甚至被伪造</text><text x="440" y="41.665" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">② 动作落在正确的位置了吗？</text><text x="440" y="56.035" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">认对了字，未必点对了框</text><text x="767" y="41.665" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">③ 谁、依据什么判定完成？</text><text x="767" y="56.035" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">页面上的“成功”也许是残影</text><text x="440" y="287.32" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">最可靠的验收去读真实状态</text><text x="440" y="302.19" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">助手自己说一句“已完成”，是所有证据里最弱的一种；第三节的分支分别补这条环上的某一环</text></svg>
