到工具交回的一行文字</text><text x="78" y="124" text-anchor="middle" font-size="9.8" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">用户的图：两只灰猫、一只棕狗</text><text x="78" y="153.648" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">用户请求</text><text x="78" y="167.628" text-anchor="middle" font-size="9.8" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">“图里有几只猫？”</text><text x="249" y="77.765" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">语言模型调度</text><text x="249" y="92.135" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">没看过图；决定调用</text><text x="249" y="105.935" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">detect(图, “猫”)</text><text x="457" y="78.317" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">现成的检测模型</text><text x="457" y="92.287" text-anchor="middle" font-size="9.6" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">在图上画框；作者事先训练好，</text><text x="457" y="105.535" text-anchor="middle" font-size="9.6" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">这里不再训练</text><text x="351.5" y="84" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" style="paint-order:stroke;stroke-width:4px;stroke-linejoin:round" stroke="#ffffff">调用</text><text x="634" y="116" text-anchor="middle" font-size="9.8" font-weight="600" fill="#C2501A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">工具画出的框：狗也被框成了猫</text><text x="818" y="72" text-anchor="middle" font-size="10.5" font-weight="700" fill="#B86E00" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">交回的一行文字</text><text x="818" y="92" text-anchor="middle" font-size="10.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">cat × 3</text><text x="818" y="110" text-anchor="middle" font-size="9.8" font-weight="500" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">(9,9) (45,9) (81,9)</text><text x="600" y="192" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" style="paint-order:stroke;stroke-width:4px;stroke-linejoin:round" stroke="#ffffff">只有这行字回到语言模型</text><text x="249" y="202.32" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">语言模型汇总</text><text x="249" y="217.19" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">“图里有 3 只猫。”</text><text x="234" y="290.351" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">开环：错在哪一步，它不知道</text><text x="234" y="305.021" text-anchor="middle" font-size="10.3" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">语言模型从头到尾只读到“cat × 3”这行字，</text><text x="234" y="319.235" text-anchor="middle" font-size="10.3" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">看不见第三个框里其实是狗，只能照单全收</text><text x="682" y="284" text-anchor="middle" font-size="11" font-weight="700" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">这一套不训练任何东西</text><text x="682" y="304" text-anchor="middle" font-size="10.3" font-weight="500" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">语言模型和检测模型都是现成的；</text><text x="682" y="322" text-anchor="middle" font-size="10.3" font-weight="500" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">框画得对不对，没有任何一环去回头核对</text></svg>
