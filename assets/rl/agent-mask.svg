<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" width="880" height="330" role="img" aria-label="agent 轨迹里哪些 token 计入损失"><defs><marker id="ah-agentmask" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6577"/></marker></defs><rect x="0" y="0" width="880" height="330" fill="#ffffff"/><path d="M30,176 L730,176" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-agentmask)"/><line x1="362" y1="200" x2="362" y2="312" stroke="#C2501A" stroke-width="2.5" stroke-dasharray="6 4"/><rect x="24" y="62" width="92" height="44" rx="5" fill="#E3EBFF" stroke="#2B57C9" stroke-width="1.5"/><rect x="122" y="62" width="132" height="44" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="130" y="118" width="116" height="26" rx="13" fill="#FCE4EC" stroke="#B83560" stroke-width="1.2"/><rect x="260" y="62" width="104" height="44" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="268" y="118" width="88" height="26" rx="13" fill="#F3F5F8" stroke="#D5DBE4" stroke-width="1.2" stroke-dasharray="3 3"/><rect x="370" y="62" width="120" height="44" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="378" y="118" width="104" height="26" rx="13" fill="#FCE4EC" stroke="#B83560" stroke-width="1.2"/><rect x="496" y="62" width="96" height="44" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="504" y="118" width="80" height="26" rx="13" fill="#F3F5F8" stroke="#D5DBE4" stroke-width="1.2" stroke-dasharray="3 3"/><rect x="598" y="62" width="136" height="44" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="606" y="118" width="120" height="26" rx="13" fill="#FCE4EC" stroke="#B83560" stroke-width="1.2"/><rect x="24" y="206" width="300" height="100" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="400" y="206" width="300" height="100" rx="5" fill="#E9EDF3" stroke="#47546A" stroke-width="1.5"/><rect x="724" y="206" width="140" height="100" rx="5" fill="#F3F5F8" stroke="#D5DBE4" stroke-width="1.5"/><text x="24" y="26" text-anchor="start" font-size="12" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">一条多轮轨迹：只有模型自己生成的动作计入损失，环境返回的观察进入上下文却被遮掉</text><text x="70" y="89" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">任务说明</text><text x="188" y="89" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">思考 + 工具调用</text><text x="188" y="136" text-anchor="middle" font-size="10.5" font-weight="600" fill="#B83560" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">计入损失</text><text x="312" y="89" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">环境观察</text><text x="312" y="136" text-anchor="middle" font-size="10.5" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">遮掉</text><text x="430" y="89" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">思考 + 改文件</text><text x="430" y="136" text-anchor="middle" font-size="10.5" font-weight="600" fill="#B83560" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">计入损失</text><text x="544" y="89" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">测试报错</text><text x="544" y="136" text-anchor="middle" font-size="10.5" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">遮掉</text><text x="666" y="89" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">思考 + 最终回答</text><text x="666" y="136" text-anchor="middle" font-size="10.5" font-weight="600" fill="#B83560" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">计入损失</text><text x="379" y="166" text-anchor="middle" font-size="10.5" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">策略在每一步只看得到它左边那段可见历史</text><text x="174" y="237.985" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">策略的输入</text><text x="174" y="253.045" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">只有当时实际看到的上下文</text><text x="174" y="267.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">不能偷看未来的结果</text><text x="174" y="282.025" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">不能用事后分析者才知道的信息</text><text x="550" y="245.23" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">critic 或教师的额外信息</text><text x="550" y="260.29" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">参考答案、评分标准、完整解答</text><text x="550" y="274.78" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">可以用来估值或打分</text><text x="362" y="196" text-anchor="middle" font-size="10.5" font-weight="600" fill="#C2501A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" style="paint-order:stroke;stroke-width:4px;stroke-linejoin:round" stroke="#ffffff">隔开</text><text x="794" y="232.12" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">损失怎样平均</text><text x="794" y="246.68" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">全批 token 一起平均：</text><text x="794" y="260.48" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">长序列占更大权重</text><text x="794" y="274.28" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">先回合内平均再汇总：</text><text x="794" y="288.08" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">长短贡献随之改变</text></svg>
