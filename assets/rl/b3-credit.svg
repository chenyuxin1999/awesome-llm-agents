<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" role="img" aria-label="长时程信用的三种来源"><defs><marker id="ah-b3credit" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6577"/></marker></defs><rect x="0" y="0" width="900" height="420" fill="#ffffff"/><path d="M142,72 L159,72" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-b3credit)"/><path d="M280,72 L297,72" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-b3credit)"/><path d="M418,72 L435,72" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-b3credit)"/><path d="M556,72 L573,72" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-b3credit)"/><path d="M694,72 L711,72" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-b3credit)"/><rect x="24" y="362" width="852" height="46" rx="5" fill="#FDE8DD" stroke="#C2501A" stroke-width="1.5"/><rect x="24" y="50" width="118" height="44" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="162" y="50" width="118" height="44" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="300" y="50" width="118" height="44" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="438" y="50" width="118" height="44" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="576" y="50" width="118" height="44" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="714" y="50" width="162" height="44" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="24" y="116" width="150" height="68" rx="5" fill="#E9EDF3" stroke="#47546A" stroke-width="1.5"/><rect x="194" y="116" width="331" height="68" rx="5" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1.2"/><rect x="545" y="116" width="331" height="68" rx="5" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1.2"/><rect x="24" y="196" width="150" height="68" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><rect x="194" y="196" width="682" height="68" rx="5" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1.2"/><rect x="24" y="276" width="150" height="68" rx="5" fill="#DCEFF1" stroke="#0E6E7E" stroke-width="1.5"/><rect x="194" y="276" width="682" height="68" rx="5" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1.2"/><text x="24" y="26" text-anchor="start" font-size="12" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">一条多轮工具轨迹只在结尾拿到一个结果；三条路线分别从价值模型、目标改写和参考模型那里要中间信号</text><text x="83" y="68.82" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">回合 1</text><text x="83" y="83.38" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">工具调用</text><text x="221" y="68.82" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">回合 2</text><text x="221" y="83.38" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">工具调用</text><text x="359" y="68.82" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">回合 3</text><text x="359" y="83.38" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">工具调用</text><text x="497" y="68.82" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">回合 4</text><text x="497" y="83.38" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">工具调用</text><text x="635" y="68.82" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">回合 5</text><text x="635" y="83.38" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">最终回答</text><text x="795" y="68.82" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">结果奖励</text><text x="795" y="83.38" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">只有一个分数</text><text x="99" y="146.82" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">价值模型</text><text x="99" y="161.38" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">critic 为每个中间状态估值</text><text x="359.5" y="146.665" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">SP3O</text><text x="359.5" y="161.035" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">只监督每个回答里少数几个间隔开的状态，缓解价值扁平化</text><text x="710.5" y="146.665" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">BPCO</text><text x="710.5" y="161.035" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">一整套 critic 配方；训练期的 critic 可以看策略看不到的参考答案</text><text x="99" y="226.82" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">改写目标</text><text x="99" y="241.38" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">绕开中间状态的价值</text><text x="535" y="226.665" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Bellman Policy Optimization</text><text x="535" y="241.035" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">用 Bellman 关系把策略镜像下降改写成轨迹层面的目标，不估中间状态价值</text><text x="99" y="306.82" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">参考模型</text><text x="99" y="321.38" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">用概率变化分配信用</text><text x="535" y="306.665" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">TRACE</text><text x="535" y="321.035" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">冻结参考模型在每个工具回合边界给出正确答案的对数概率，相邻回合的差就是这一回合的奖励</text><text x="450" y="382" text-anchor="middle" font-size="11" font-weight="600" fill="#C2501A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">没有绕开验证器的捷径：奖励只认“测试全绿”时，分配得越细，越可能把删测试这类行为也高效地奖励下去</text><text x="450" y="400" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">所以先检查奖励本身怎样定义，再讨论分配的颗粒度</text></svg>
