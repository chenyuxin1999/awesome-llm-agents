<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" role="img" aria-label="教师可靠性的三种判断粒度"><defs><marker id="ah-b6gate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6577"/></marker></defs><rect x="0" y="0" width="900" height="420" fill="#ffffff"/><rect x="16" y="44" width="282" height="236" rx="5" fill="#F3F5F8" stroke="#D5DBE4" stroke-width="1.5"/><rect x="309" y="44" width="282" height="236" rx="5" fill="#F3F5F8" stroke="#D5DBE4" stroke-width="1.5"/><rect x="602" y="44" width="282" height="236" rx="5" fill="#F3F5F8" stroke="#D5DBE4" stroke-width="1.5"/><path d="M157,128 L157,148" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-b6gate)"/><path d="M87,170 L50,170 L50,207" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-b6gate)"/><path d="M227,170 L264,170 L264,207" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-b6gate)"/><path d="M450,140 L450,156" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-b6gate)"/><path d="M450,214 L450,228" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-b6gate)"/><path d="M743,136 L743,152" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-b6gate)"/><path d="M743,204 L743,218" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-b6gate)"/><rect x="30" y="84" width="254" height="44" rx="5" fill="#DCEFF1" stroke="#0E6E7E" stroke-width="1.5"/><rect x="87" y="150" width="140" height="40" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="30" y="210" width="120" height="56" rx="5" fill="#DCEFF1" stroke="#0E6E7E" stroke-width="1.5"/><rect x="164" y="210" width="120" height="56" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="323" y="84" width="254" height="56" rx="5" fill="#DCEFF1" stroke="#0E6E7E" stroke-width="1.5"/><rect x="323" y="158" width="254" height="56" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><rect x="323" y="230" width="254" height="38" rx="5" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1.2"/><rect x="616" y="84" width="254" height="52" rx="5" fill="#FDE8DD" stroke="#C2501A" stroke-width="1.5"/><rect x="616" y="154" width="254" height="50" rx="5" fill="#DCEFF1" stroke="#0E6E7E" stroke-width="1.5"/><rect x="616" y="220" width="254" height="50" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="16" y="296" width="420" height="108" rx="5" fill="#E9EDF3" stroke="#47546A" stroke-width="1.5"/><rect x="452" y="296" width="432" height="108" rx="5" fill="#E9EDF3" stroke="#47546A" stroke-width="1.5"/><text x="24" y="26" text-anchor="start" font-size="12" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">从粗到细：先决定这道题用不用教师，再决定哪些 token 的信号可信，最后在具体状态上看指导的后果</text><text x="30" y="68" text-anchor="start" font-size="12.5" font-weight="700" fill="#2B57C9" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">按题目</text><text x="284" y="68" text-anchor="end" font-size="10.5" font-weight="600" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Verify Before You Distill</text><text x="323" y="68" text-anchor="start" font-size="12.5" font-weight="700" fill="#B83560" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">按 token</text><text x="577" y="68" text-anchor="end" font-size="10.5" font-weight="600" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">When Teachers Mislead</text><text x="616" y="68" text-anchor="start" font-size="12.5" font-weight="700" fill="#0E6E7E" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">按状态</text><text x="870" y="68" text-anchor="end" font-size="10.5" font-weight="600" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Look Ahead Before You Distill</text><text x="157" y="102.82" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">教师先试做几次</text><text x="157" y="117.38" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">验证器给这几次打分</text><text x="157" y="173.72" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">可靠吗？</text><text x="90" y="234.82" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">密集 OPD</text><text x="90" y="249.38" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">通过</text><text x="224" y="234.82" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">结果奖励 GRPO</text><text x="224" y="249.38" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">未通过</text><text x="450" y="115.72" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">教师给每个 token 的信号</text><text x="450" y="175.92" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">两个条件同时满足才过滤</text><text x="450" y="190.48" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">对输入依赖很弱（格式、套路）</text><text x="450" y="204.28" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">且散度极端、影响大</text><text x="450" y="252.72" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">其余信号照常使用</text><text x="743" y="106.82" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">师生分歧大的状态</text><text x="743" y="121.38" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">多轮任务里偏差会累积</text><text x="743" y="175.82" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">教师接手走一小段</text><text x="743" y="190.38" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">所谓 bridge</text><text x="743" y="241.82" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">看学生后续轨迹</text><text x="743" y="256.38" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">正向蒸馏信号是否变多</text><text x="226" y="333.02" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">教师更弱时：Weak-to-Strong OPD</text><text x="226" y="347.58" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">两个比学生小的模型做成一对（如 RL 后对 RL 前），</text><text x="226" y="361.38" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">它们的 logit 差取出能力方向，</text><text x="226" y="375.18" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">加到学生自己的基础模型上当代理教师</text><text x="668" y="326.12" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">特权信息到底加了什么</text><text x="668" y="340.68" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Rethinking Privileged Information：正确、无关、缺失三种参考对照，</text><text x="668" y="354.48" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">正确参考并不稳定带来收益；</text><text x="668" y="368.28" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">What Does Privileged Information Add?：</text><text x="668" y="382.08" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">同一答案的六种推理视图，与无参考蒸馏逐一比较</text></svg>
