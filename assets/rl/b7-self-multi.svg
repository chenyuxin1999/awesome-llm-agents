<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" height="430" role="img" aria-label="自蒸馏与多教师整合"><defs><marker id="ah-b7selfmulti" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6577"/></marker></defs><rect x="0" y="0" width="900" height="430" fill="#ffffff"/><rect x="16" y="44" width="420" height="372" rx="5" fill="#F3F5F8" stroke="#D5DBE4" stroke-width="1.5"/><path d="M150,108 L167,108" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-b7selfmulti)"/><path d="M290,108 L307,108" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-b7selfmulti)"/><path d="M366,134 L366,153" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-b7selfmulti)"/><rect x="452" y="44" width="432" height="372" rx="5" fill="#F3F5F8" stroke="#D5DBE4" stroke-width="1.5"/><path d="M530,122 L668,137" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-b7selfmulti)"/><path d="M668,122 L668,137" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-b7selfmulti)"/><path d="M806,122 L668,137" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-b7selfmulti)"/><rect x="30" y="82" width="120" height="52" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="170" y="82" width="120" height="52" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="310" y="82" width="112" height="52" rx="5" fill="#DCEFF1" stroke="#0E6E7E" stroke-width="1.5"/><rect x="30" y="156" width="392" height="52" rx="5" fill="#DCEFF1" stroke="#0E6E7E" stroke-width="1.5"/><rect x="30" y="224" width="190" height="64" rx="5" fill="#DCEFF1" stroke="#0E6E7E" stroke-width="1.5"/><rect x="232" y="224" width="190" height="64" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="30" y="304" width="392" height="98" rx="5" fill="#FDE8DD" stroke="#C2501A" stroke-width="1.5"/><rect x="466" y="82" width="128" height="40" rx="5" fill="#DCEFF1" stroke="#0E6E7E" stroke-width="1.5"/><rect x="604" y="82" width="128" height="40" rx="5" fill="#DCEFF1" stroke="#0E6E7E" stroke-width="1.5"/><rect x="742" y="82" width="128" height="40" rx="5" fill="#DCEFF1" stroke="#0E6E7E" stroke-width="1.5"/><rect x="568" y="140" width="200" height="40" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="466" y="196" width="96" height="62" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><rect x="572" y="196" width="300" height="62" rx="5" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1.2"/><rect x="466" y="268" width="96" height="62" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><rect x="572" y="268" width="300" height="62" rx="5" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1.2"/><rect x="466" y="340" width="96" height="62" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><rect x="572" y="340" width="300" height="62" rx="5" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1.2"/><text x="24" y="26" text-anchor="start" font-size="12" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">左边没有更强的老师，信号是多次回答多数投票选出的伪解；右边每位教师逐 token 评价学生，难点在谁来教、教多重、预算怎么分</text><text x="30" y="68" text-anchor="start" font-size="12.5" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">自蒸馏：从自己的一致性里找信号</text><text x="90" y="104.82" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">多次采样</text><text x="90" y="119.38" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">同一道题</text><text x="230" y="104.82" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">多数投票</text><text x="230" y="119.38" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">达到一致性阈值</text><text x="366" y="104.82" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">伪解</text><text x="366" y="119.38" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">当作参考</text><text x="226" y="178.82" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">U-OPSD：以伪解为条件的自己当教师</text><text x="226" y="193.38" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">只在和伪解不一致的回答上蒸馏</text><text x="125" y="252.82" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">TTPO：同意伪标签</text><text x="125" y="267.38" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">这些回答走 OPSD 蒸馏</text><text x="327" y="252.82" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">TTPO：不同意伪标签</text><text x="327" y="267.38" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">这些回答用组 RL 惩罚</text><text x="226" y="329.12" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">要防的事</text><text x="226" y="343.68" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">模型稳定地犯同一种错，多数票只会放大它；</text><text x="226" y="357.48" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Thinking Collapse：教师梯度压掉学生的中间推理，</text><text x="226" y="371.28" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">AD-OPSD 用冻结基础模型做锚；</text><text x="226" y="385.08" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">PCSD：按教师支持的持续程度加权，并结合环境奖励</text><text x="466" y="68" text-anchor="start" font-size="12.5" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">多教师：把几位专家合进一个学生</text><text x="530" y="105.41" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">数学教师</text><text x="668" y="105.41" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">代码教师</text><text x="806" y="105.41" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">指令遵循教师</text><text x="668" y="163.72" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">一个学生</text><text x="514" y="230.565" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">谁来教</text><text x="722" y="223.2" text-anchor="middle" font-size="10" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">MOPD-Router：每个 token 都在整个教师池里路由，不要领域</text><text x="722" y="237" text-anchor="middle" font-size="10" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">标签</text><text x="514" y="302.565" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">教多重</text><text x="722" y="295.2" text-anchor="middle" font-size="10" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Domain-Normalized MOPD：指令遵循信号比数学分散数倍，按</text><text x="722" y="309" text-anchor="middle" font-size="10" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">各领域的分散度缩放</text><text x="514" y="374.565" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">预算怎么分</text><text x="722" y="367.2" text-anchor="middle" font-size="10" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Open-MOPD：标准做法只拿到 35.6% 的可提升空间；平衡</text><text x="722" y="381" text-anchor="middle" font-size="10" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">token 份额等之后到 83.4%</text></svg>
