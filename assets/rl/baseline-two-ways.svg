<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" width="860" height="330" role="img" aria-label="优势的两种参照"><defs><marker id="ah-baselinetwoways" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6577"/></marker></defs><rect x="0" y="0" width="860" height="330" fill="#ffffff"/><rect x="16" y="44" width="404" height="270" rx="5" fill="#F3F5F8" stroke="#D5DBE4" stroke-width="1.5"/><path d="M130,116 L157,116" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-baselinetwoways)"/><path d="M220,148 L220,187" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-baselinetwoways)"/><path d="M352,148 L352,170 L300,187" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-baselinetwoways)"/><rect x="440" y="44" width="404" height="270" rx="5" fill="#F3F5F8" stroke="#D5DBE4" stroke-width="1.5"/><path d="M544,116 L565,116" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-baselinetwoways)"/><path d="M700,148 L700,187" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-baselinetwoways)"/><rect x="30" y="90" width="100" height="52" rx="5" fill="#E3EBFF" stroke="#2B57C9" stroke-width="1.5"/><rect x="160" y="84" width="120" height="64" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="300" y="84" width="104" height="64" rx="5" fill="#E9EDF3" stroke="#47546A" stroke-width="1.5"/><rect x="110" y="190" width="220" height="56" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><rect x="454" y="90" width="90" height="52" rx="5" fill="#E3EBFF" stroke="#2B57C9" stroke-width="1.5"/><rect x="568" y="84" width="46" height="64" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="622" y="84" width="46" height="64" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="676" y="84" width="46" height="64" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="730" y="84" width="46" height="64" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="784" y="84" width="46" height="64" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="520" y="190" width="254" height="56" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><text x="24" y="26" text-anchor="start" font-size="12" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">优势 = 这个回答比参照水平好多少。参照可以由价值模型估出来，也可以由同一道题的几次回答平均出来（数字为示意）</text><text x="30" y="68" text-anchor="start" font-size="12.5" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">用价值模型（critic）做参照：PPO 的做法</text><text x="80" y="119.72" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">题目</text><text x="220" y="106.61" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">一次回答</text><text x="220" y="120.67" text-anchor="middle" font-size="9.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">得到回报 1</text><text x="220" y="133.78" text-anchor="middle" font-size="9.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">（奖励模型打的分）</text><text x="352" y="105.23" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">critic</text><text x="352" y="120.29" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">估计这里往下约</text><text x="352" y="134.78" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">0.6</text><text x="220" y="214.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">优势 ≈ 1 − 0.6 = +0.4</text><text x="220" y="229.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">比预期好，提高这次动作的概率</text><text x="218" y="276" text-anchor="middle" font-size="10.5" font-weight="500" fill="#26805A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">更精细：每个中间状态都能估</text><text x="218" y="296" text-anchor="middle" font-size="10.5" font-weight="500" fill="#C2501A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">critic 也要训练：信号是往后实际拿到的分，估错会带偏策略</text><text x="454" y="68" text-anchor="start" font-size="12.5" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">用同题多答的组平均做参照：GRPO 的做法</text><text x="499" y="119.72" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">同一题</text><text x="591" y="108" text-anchor="middle" font-size="10.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">答 1</text><text x="591" y="132" text-anchor="middle" font-size="11" font-weight="600" fill="#26805A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">分 1</text><text x="645" y="108" text-anchor="middle" font-size="10.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">答 2</text><text x="645" y="132" text-anchor="middle" font-size="11" font-weight="600" fill="#26805A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">分 0</text><text x="699" y="108" text-anchor="middle" font-size="10.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">答 3</text><text x="699" y="132" text-anchor="middle" font-size="11" font-weight="600" fill="#26805A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">分 0</text><text x="753" y="108" text-anchor="middle" font-size="10.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">答 4</text><text x="753" y="132" text-anchor="middle" font-size="11" font-weight="600" fill="#26805A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">分 1</text><text x="807" y="108" text-anchor="middle" font-size="10.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">答 5</text><text x="807" y="132" text-anchor="middle" font-size="11" font-weight="600" fill="#26805A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">分 0</text><text x="647" y="214.32" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">组平均 0.4，答对的 +0.6，答错的 −0.4</text><text x="647" y="229.19" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">再按组内标准差缩放</text><text x="642" y="276" text-anchor="middle" font-size="10.5" font-weight="500" fill="#26805A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">省掉一个模型</text><text x="642" y="296" text-anchor="middle" font-size="10.5" font-weight="500" fill="#C2501A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">代价是每道题要多采几次样</text></svg>
