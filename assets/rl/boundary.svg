<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" role="img" aria-label="主线的边界：三张示意"><defs><marker id="ah-boundary" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6577"/></marker></defs><rect x="0" y="0" width="900" height="330" fill="#ffffff"/><rect x="16" y="44" width="280" height="270" rx="5" fill="#F3F5F8" stroke="#D5DBE4" stroke-width="1.5"/><line x1="40" y1="250" x2="280" y2="250" stroke="#5A6577" stroke-width="1"/><line x1="40" y1="250" x2="40" y2="90" stroke="#5A6577" stroke-width="1"/><rect x="310" y="44" width="280" height="270" rx="5" fill="#F3F5F8" stroke="#D5DBE4" stroke-width="1.5"/><line x1="334" y1="250" x2="574" y2="250" stroke="#5A6577" stroke-width="1"/><line x1="334" y1="250" x2="334" y2="90" stroke="#5A6577" stroke-width="1"/><rect x="604" y="44" width="280" height="270" rx="5" fill="#F3F5F8" stroke="#D5DBE4" stroke-width="1.5"/><path d="M734,106 L761,106" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-boundary)"/><path d="M819,128 L819,165" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-boundary)"/><path d="M700,212 L700,237" fill="none" stroke="#5A6577" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#ah-boundary)"/><path d="M40,240 C120,180 200,120 275,100" fill="none" stroke="#26805A" stroke-width="2.2"/><path d="M40,240 C110,150 180,160 275,230" fill="none" stroke="#C2501A" stroke-width="2.2"/><path d="M334,160 C394,120 484,110 569,108" fill="none" stroke="#B83560" stroke-width="2.2"/><path d="M334,210 C414,150 484,100 569,85" fill="none" stroke="#47546A" stroke-width="2.2"/><rect x="624" y="84" width="110" height="44" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="764" y="84" width="110" height="44" rx="5" fill="#E9EDF3" stroke="#47546A" stroke-width="1.5"/><rect x="624" y="168" width="250" height="44" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="624" y="240" width="250" height="52" rx="5" fill="#FDE8DD" stroke="#C2501A" stroke-width="1.5"/><text x="24" y="26" text-anchor="start" font-size="12" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">三件挥之不去的事：代理分数涨了真目标却掉头，pass@k 曲线交叉，监控一进奖励作弊就藏起来（均为示意）</text><text x="28" y="66" text-anchor="start" font-size="12.5" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">奖励模型过度优化</text><text x="240" y="88" text-anchor="middle" font-size="10.5" font-weight="600" fill="#26805A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">代理分数</text><text x="240" y="206" text-anchor="middle" font-size="10.5" font-weight="600" fill="#C2501A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">真实目标</text><text x="160" y="268" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">对奖励模型优化得越狠 →</text><text x="156" y="300" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Gao 等 2022 的实验刻画</text><text x="322" y="66" text-anchor="start" font-size="12.5" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">pass@k 曲线交叉</text><text x="404" y="116" text-anchor="middle" font-size="10.5" font-weight="600" fill="#B83560" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">RLVR 后</text><text x="530" y="74" text-anchor="middle" font-size="10.5" font-weight="600" fill="#47546A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">基础模型</text><text x="454" y="268" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">采样次数 k 越来越多 →</text><text x="450" y="300" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">k 小时 RLVR 胜，k 大时基础模型解出更多</text><text x="616" y="66" text-anchor="start" font-size="12.5" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">思维链监控进入奖励</text><text x="679" y="102.82" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">策略</text><text x="679" y="117.38" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">写思维链</text><text x="819" y="102.82" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">监控模型</text><text x="819" y="117.38" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">读思维链</text><text x="749" y="186.82" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">只用来发现作弊</text><text x="749" y="201.38" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">能抓到编程 agent 的作弊</text><text x="749" y="262.82" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">把监控判断加进训练奖励</text><text x="749" y="277.38" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">模型学会把作弊意图藏起来</text></svg>
