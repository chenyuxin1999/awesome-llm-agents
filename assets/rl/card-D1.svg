<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 206" width="560" height="206" role="img" aria-label="知识蒸馏结构"><defs><marker id="ah-cardd1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6577"/></marker></defs><rect x="0" y="0" width="560" height="206" fill="#ffffff"/><path d="M174,77 L197,77" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-cardd1)"/><path d="M360,77 L383,77" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-cardd1)"/><path d="M94,116 L94,126" fill="none" stroke="#5A6577" stroke-width="1.4" stroke-dasharray="2 2"/><path d="M280,116 L280,126" fill="none" stroke="#5A6577" stroke-width="1.4" stroke-dasharray="2 2"/><path d="M466,116 L466,126" fill="none" stroke="#5A6577" stroke-width="1.4" stroke-dasharray="2 2"/><rect x="14" y="38" width="160" height="78" rx="5" fill="#DCEFF1" stroke="#0E6E7E" stroke-width="1.5"/><rect x="200" y="38" width="160" height="78" rx="5" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.5"/><rect x="386" y="38" width="160" height="78" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="14" y="126" width="160" height="54.5" rx="5" fill="#F3F5F8" stroke="#D5DBE4" stroke-width="1.1" stroke-dasharray="4 3"/><rect x="200" y="126" width="160" height="54.5" rx="5" fill="#F3F5F8" stroke="#D5DBE4" stroke-width="1.1" stroke-dasharray="4 3"/><rect x="386" y="126" width="160" height="54.5" rx="5" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.1" stroke-dasharray="4 3"/><text x="280" y="22" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">目标：把教师在所有候选上的判断教给学生</text><text x="94" y="66.765" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">教师给概率</text><text x="94" y="81.135" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">每个位置上所有候选的概率；例：</text><text x="94" y="94.935" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">猫 0.6、狗 0.3、车 0.1</text><text x="280" y="73.665" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">用固定数据</text><text x="280" y="88.035" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">样本事先备好，学生不自己生成</text><text x="466" y="73.665" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">学生模仿分布</text><text x="466" y="88.035" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">把自己的概率拉向教师的概率</text><text x="94" y="149.75" text-anchor="middle" font-size="10" font-weight="600" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">这一步不训练</text><text x="94" y="163.25" text-anchor="middle" font-size="9.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">教师已训练好</text><text x="280" y="149.75" text-anchor="middle" font-size="10" font-weight="600" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">这一步不训练</text><text x="280" y="163.25" text-anchor="middle" font-size="9.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">样本事先备好</text><text x="466" y="143" text-anchor="middle" font-size="9.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">信号：教师在固定样本每个位置给</text><text x="466" y="156.5" text-anchor="middle" font-size="9.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">出的全部候选概率</text><text x="466" y="170" text-anchor="middle" font-size="9.5" font-weight="700" fill="#B86E00" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">目标：学生的分布贴近教师</text><text x="280" y="196.5" text-anchor="middle" font-size="10.5" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">比单个标签信息多，可学生一旦走出固定数据，就没人教（例子为示意）。</text></svg>
