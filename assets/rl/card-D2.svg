68" rx="5" fill="#F3F5F8" stroke="#D5DBE4" stroke-width="1.1" stroke-dasharray="4 3"/><rect x="432.5" y="126" width="113.5" height="68" rx="5" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.1" stroke-dasharray="4 3"/><text x="280" y="22" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">目标：让专家的指导落在学生自己走到的状态上</text><text x="70.75" y="73.665" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">学生自己走</text><text x="70.75" y="88.035" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">按当前策略执行一遍</text><text x="210.25" y="66.765" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">记下走到的状态</text><text x="210.25" y="81.135" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">包括专家从没去过的</text><text x="210.25" y="94.935" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">地方</text><text x="349.75" y="66.765" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">专家标注</text><text x="349.75" y="81.135" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">为每个状态写出该怎</text><text x="349.75" y="94.935" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">么做</text><text x="489.25" y="73.665" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC,