C, Noto Sans CJK SC, Microsoft YaHei, sans-serif">出专家的动作</text><text x="280" y="211" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" style="paint-order:stroke;stroke-width:4px;stroke-linejoin:round" stroke="#ffffff">下一轮让新学生再走</text><text x="280" y="240" text-anchor="middle" font-size="10.5" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">学生偏离之后也有人教，错误不再一步步累积。</text></svg>
