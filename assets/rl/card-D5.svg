<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 250" width="560" height="250" role="img" aria-label="Thinking Machines OPD 结构"><defs><marker id="ah-cardd5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6577"/></marker></defs><rect x="0" y="0" width="560" height="250" fill="#ffffff"/><path d="M127.5,77 L150.5,77" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-cardd5)"/><path d="M267,77 L290,77" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-cardd5)"/><path d="M406.5,77 L429.5,77" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-cardd5)"/><path d="M70.75,116 L70.75,126" fill="none" stroke="#5A6577" stroke-width="1.4" stroke-dasharray="2 2"/><path d="M210.25,116 L210.25,126" fill="none" stroke="#5A6577" stroke-width="1.4" stroke-dasharray="2 2"/><path d="M349.75,116 L349.75,126" fill="none" stroke="#5A6577" stroke-width="1.4" stroke-dasharray="2 2"/><path d="M489.25,116 L489.25,126" fill="none" stroke="#5A6577" stroke-width="1.4" stroke-dasharray="2 2"/><path d="M489.25,194 L489.25,216 L70.75,216 L70.75,197" fill="none" stroke="#5A6577" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#ah-cardd5)"/><rect x="14" y="38" width="113.5" height="78" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="153.5" y="38" width="113.5" height="78" rx="5" fill="#DCEFF1" stroke="#0E6E7E" stroke-width="1.5"/><rect x="293" y="38" width="113.5" height="78" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><rect x="432.5" y="38" width="113.5" height="78" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><rect x="14" y="126" width="113.5" height="68" rx="5" fill="#F3F5F8" stroke="#D5DBE4" stroke-width="1.1" stroke-dasharray="4 3"/><rect x="153.5" y="126" width="113.5" height="68" rx="5" fill="#F3F5F8" stroke="#D5DBE4" stroke-width="1.1" stroke-dasharray="4 3"/><rect x="293" y="126" width="113.5" height="68" rx="5" fill="#F3F5F8" stroke="#D5DBE4" stroke-width="1.1" stroke-dasharray="4 3"/><rect x="432.5" y="126" width="113.5" height="68" rx="5" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.1" stroke-dasharray="4 3"/><text x="280" y="22" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">目标：学生每写一个 token，都知道教师认不认可</text><text x="70.75" y="73.665" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">学生写回答</text><text x="70.75" y="88.035" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">自己采样一段</text><text x="210.25" y="66.765" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">教师算概率</text><text x="210.25" y="81.135" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">对学生这段回答做一</text><text x="210.25" y="94.935" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">次前向计算</text><text x="349.75" y="58.83" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">算每个 token 的优</text><text x="349.75" y="74.7" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">势</text><text x="349.75" y="89.07" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">学生对数概率减教师</text><text x="349.75" y="102.87" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">对数概率，再取负</text><text x="489.25" y="66.765" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">按 RL 规则更新</text><text x="489.25" y="81.135" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">每个 token 只为自己</text><text x="489.25" y="94.935" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">负责</text><text x="70.75" y="156.5" text-anchor="middle" font-size="10" font-weight="600" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">这一步不训练</text><text x="70.75" y="170" text-anchor="middle" font-size="9.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">只采样</text><text x="210.25" y="156.5" text-anchor="middle" font-size="10" font-weight="600" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">这一步不训练</text><text x="210.25" y="170" text-anchor="middle" font-size="9.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">教师只做前向计算</text><text x="349.75" y="156.5" text-anchor="middle" font-size="10" font-weight="600" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">这一步不训练</text><text x="349.75" y="170" text-anchor="middle" font-size="9.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">只计算优势</text><text x="489.25" y="143" text-anchor="middle" font-size="9.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">信号：每个 token 的负</text><text x="489.25" y="156.5" text-anchor="middle" font-size="9.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">反向 KL</text><text x="489.25" y="170" text-anchor="middle" font-size="9.5" font-weight="700" fill="#B86E00" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">目标：教师认可的</text><text x="489.25" y="183.5" text-anchor="middle" font-size="9.5" font-weight="700" fill="#B86E00" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">token 更常出现</text><text x="280" y="211" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" style="paint-order:stroke;stroke-width:4px;stroke-linejoin:round" stroke="#ffffff">再写下一批</text><text x="280" y="240" text-anchor="middle" font-size="10.5" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">约 150 步把 AIME&#x27;24 带到 70% 左右，算力约为继续监督微调的九分之一。</text></svg>
