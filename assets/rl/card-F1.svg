<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 142" width="560" height="142" role="img" aria-label="Dr. GRPO 结构"><defs><marker id="ah-cardf1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6577"/></marker></defs><rect x="0" y="0" width="560" height="142" fill="#ffffff"/><path d="M127.5,77 L150.5,77" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-cardf1)"/><path d="M267,77 L290,77" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-cardf1)"/><path d="M406.5,77 L429.5,77" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-cardf1)"/><rect x="14" y="38" width="113.5" height="78" rx="5" fill="#E3EBFF" stroke="#2B57C9" stroke-width="1.5"/><rect x="153.5" y="38" width="113.5" height="78" rx="5" fill="#FDE8DD" stroke="#C2501A" stroke-width="1.5"/><rect x="293" y="38" width="113.5" height="78" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><rect x="432.5" y="38" width="113.5" height="78" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><text x="280" y="22" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">目标：训练信号仍是对错分，改的是它怎样分到每个 token 上</text><text x="70.75" y="66.765" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">两条答错的回答</text><text x="70.75" y="81.135" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">一短一长，优势都是</text><text x="70.75" y="94.935" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">−1</text><text x="210.25" y="66.765" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">原版按长度平均</text><text x="210.25" y="81.135" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">长回答的每个 token</text><text x="210.25" y="94.935" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">分到的惩罚更小</text><text x="349.75" y="66.765" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">去掉长度平均</text><text x="349.75" y="81.135" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">长短回答的每个</text><text x="349.75" y="94.935" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">token 罚得一样重</text><text x="489.25" y="66.765" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">不再除以标准差</text><text x="489.25" y="81.135" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">分数很集中的题不再</text><text x="489.25" y="94.935" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">权重过大</text><text x="280" y="132" text-anchor="middle" font-size="10.5" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">去掉这两步归一化，模型不再偏向又长又错的回答。</text></svg>
