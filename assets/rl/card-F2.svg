<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 142" width="560" height="142" role="img" aria-label="DAPO 结构"><defs><marker id="ah-cardf2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6577"/></marker></defs><rect x="0" y="0" width="560" height="142" fill="#ffffff"/><path d="M127.5,77 L150.5,77" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-cardf2)"/><path d="M267,77 L290,77" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-cardf2)"/><path d="M406.5,77 L429.5,77" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-cardf2)"/><rect x="14" y="38" width="113.5" height="78" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><rect x="153.5" y="38" width="113.5" height="78" rx="5" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.5"/><rect x="293" y="38" width="113.5" height="78" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><rect x="432.5" y="38" width="113.5" height="78" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><text x="280" y="22" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">目标：训练信号仍是对错分，改的是采样、裁剪和算损失的方式</text><text x="70.75" y="59.865" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">放宽裁剪上限</text><text x="70.75" y="74.235" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">概率上升的一侧多留</text><text x="70.75" y="88.035" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">空间；例：上限 1.2</text><text x="70.75" y="101.835" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">放宽到 1.28</text><text x="210.25" y="59.865" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">动态采样</text><text x="210.25" y="74.235" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">剔除全对或全错的题；</text><text x="210.25" y="88.035" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">例：8 遍全对，这题</text><text x="210.25" y="101.835" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">跳过</text><text x="349.75" y="59.865" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">按 token 算损失</text><text x="349.75" y="74.235" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">长短回答的 token 一</text><text x="349.75" y="88.035" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">样重；例：长回答不</text><text x="349.75" y="101.835" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">再被摊薄</text><text x="489.25" y="59.865" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">过长惩罚</text><text x="489.25" y="74.235" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">回答过长就扣分；例：</text><text x="489.25" y="88.035" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">超出上限越多扣得越</text><text x="489.25" y="101.835" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">多</text><text x="280" y="132" text-anchor="middle" font-size="10.5" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">把 R1 之后各团队踩到的坑，整理成一套公开的大规模强化学习配方（例子为示意）。</text></svg>
