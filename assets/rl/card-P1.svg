<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 236" width="560" height="236" role="img" aria-label="REINFORCE 结构"><defs><marker id="ah-cardp1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6577"/></marker></defs><rect x="0" y="0" width="560" height="236" fill="#ffffff"/><path d="M174,77 L197,77" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-cardp1)"/><path d="M360,77 L383,77" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-cardp1)"/><path d="M94,116 L94,126" fill="none" stroke="#5A6577" stroke-width="1.4" stroke-dasharray="2 2"/><path d="M280,116 L280,126" fill="none" stroke="#5A6577" stroke-width="1.4" stroke-dasharray="2 2"/><path d="M466,116 L466,126" fill="none" stroke="#5A6577" stroke-width="1.4" stroke-dasharray="2 2"/><path d="M466,180.5 L466,202.5 L94,202.5 L94,183.5" fill="none" stroke="#5A6577" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#ah-cardp1)"/><rect x="14" y="38" width="160" height="78" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="200" y="38" width="160" height="78" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="386" y="38" width="160" height="78" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><rect x="14" y="126" width="160" height="54.5" rx="5" fill="#F3F5F8" stroke="#D5DBE4" stroke-width="1.1" stroke-dasharray="4 3"/><rect x="200" y="126" width="160" height="54.5" rx="5" fill="#F3F5F8" stroke="#D5DBE4" stroke-width="1.1" stroke-dasharray="4 3"/><rect x="386" y="126" width="160" height="54.5" rx="5" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.1" stroke-dasharray="4 3"/><text x="280" y="22" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">目标：让带来好结果的写法以后更常出现</text><text x="94" y="73.665" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">写一遍答案</text><text x="94" y="88.035" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">策略按当前概率写出一串 token</text><text x="280" y="73.665" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">看结果</text><text x="280" y="88.035" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">这一遍答对拿 1，答错拿 0</text><text x="466" y="66.765" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">改概率</text><text x="466" y="81.135" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">答对就调高这一遍各 token 的概</text><text x="466" y="94.935" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">率，答错就调低</text><text x="94" y="149.75" text-anchor="middle" font-size="10" font-weight="600" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">这一步不训练</text><text x="94" y="163.25" text-anchor="middle" font-size="9.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">只按当前概率采样</text><text x="280" y="149.75" text-anchor="middle" font-size="10" font-weight="600" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">这一步不训练</text><text x="280" y="163.25" text-anchor="middle" font-size="9.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">答对 1、答错 0，按规则判</text><text x="466" y="143" text-anchor="middle" font-size="9.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">信号：这一遍拿到的分数，给这一</text><text x="466" y="156.5" text-anchor="middle" font-size="9.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">遍写下的每个 token 加权</text><text x="466" y="170" text-anchor="middle" font-size="9.5" font-weight="700" fill="#B86E00" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">目标：得分高的写法概率变大</text><text x="280" y="197.5" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" style="paint-order:stroke;stroke-width:4px;stroke-linejoin:round" stroke="#ffffff">用改过的概率再写下一遍</text><text x="280" y="226.5" text-anchor="middle" font-size="10.5" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">同一道题这次碰巧对、下次又错，直接拿结果更新，参数会被来回拉扯。</text></svg>
