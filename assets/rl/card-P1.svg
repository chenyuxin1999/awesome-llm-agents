<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 136" width="560" height="136" role="img" aria-label="REINFORCE 结构"><defs><marker id="ah-cardp1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6577"/></marker></defs><rect x="0" y="0" width="560" height="136" fill="#ffffff"/><path d="M174,58 L197,58" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-cardp1)"/><path d="M360,58 L383,58" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-cardp1)"/><path d="M466,82 L466,104 L94,104 L94,85" fill="none" stroke="#5A6577" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#ah-cardp1)"/><rect x="14" y="34" width="160" height="48" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="200" y="34" width="160" height="48" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="386" y="34" width="160" height="48" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><text x="94" y="54.665" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">按策略采样</text><text x="94" y="69.035" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">做出一串动作</text><text x="280" y="54.665" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">拿到回报</text><text x="280" y="69.035" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">这次结果好不好</text><text x="466" y="54.665" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">调整概率</text><text x="466" y="69.035" text-anchor="middle" font-size="10" font-