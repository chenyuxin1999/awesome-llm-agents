<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 410" width="900" height="410" role="img" aria-label="后训练的基本循环"><defs><marker id="ah-overviewloop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6577"/></marker></defs><rect x="0" y="0" width="900" height="410" fill="#ffffff"/><path d="M136,104 L183,104" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-overviewloop)"/><path d="M354,104 L401,104" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-overviewloop)"/><path d="M554,104 L600,104 L600,175 L637,175" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-overviewloop)"/><path d="M600,175 L600,269 L637,269" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-overviewloop)"/><line x1="860" y1="81" x2="880" y2="81" stroke="#5A6577" stroke-width="1.4"/><line x1="860" y1="175" x2="880" y2="175" stroke="#5A6577" stroke-width="1.4"/><line x1="860" y1="269" x2="880" y2="269" stroke="#5A6577" stroke-width="1.4"/><path d="M880,81 L880,356 L733,356" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-overviewloop)"/><path d="M430,346 L300,346 L300,149" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-overviewloop)"/><path d="M124,284 L124,372 L427,372" fill="none" stroke="#5A6577" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#ah-overviewloop)"/><rect x="24" y="74" width="112" height="60" rx="5" fill="#E3EBFF" stroke="#2B57C9" stroke-width="1.5"/><rect x="186" y="62" width="168" height="84" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="404" y="74" width="150" height="60" rx="5" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.5"/><rect x="640" y="46" width="220" height="70" rx="5" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.5"/><rect x="640" y="140" width="220" height="70" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="640" y="234" width="220" height="70" rx="5" fill="#DCEFF1" stroke="#0E6E7E" stroke-width="1.5"/><rect x="430" y="326" width="300" height="60" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><rect x="24" y="214" width="216" height="76" rx="5" fill="#E9EDF3" stroke="#47546A" stroke-width="1.5"/><text x="24" y="26" text-anchor="start" font-size="13" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">目标：让得到好反馈的那些 token 以后更容易被写出来（例子：小模型修 test_week53 这个 bug，数字为示意）</text><text x="160" y="97" text-anchor="middle" font-size="9.5" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">一道题</text><text x="378" y="97" text-anchor="middle" font-size="9.5" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">写出</text><text x="586" y="97" text-anchor="middle" font-size="9.5" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">整条轨迹</text><text x="872" y="326" text-anchor="end" font-size="9.5" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">分数或示范 token</text><text x="80" y="94.61" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">提示 / 任务</text><text x="80" y="108.67" text-anchor="middle" font-size="9.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">例：issue #318</text><text x="80" y="121.78" text-anchor="middle" font-size="9.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">test_week53 失败</text><text x="270" y="87.02" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">策略（学生）</text><text x="270" y="101.58" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">正在训练的模型</text><text x="270" y="115.38" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">例：7B 小模型</text><text x="270" y="129.18" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">自己生成轨迹</text><text x="479" y="94.61" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">学生的轨迹</text><text x="479" y="108.67" text-anchor="middle" font-size="9.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">例：$ pytest tests/</text><text x="479" y="121.78" text-anchor="middle" font-size="9.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">edit dates.py:47</text><text x="750" y="71.61" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">示范（离策略）</text><text x="750" y="85.67" text-anchor="middle" font-size="9.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">老师的记录，每个 token 当标准答案</text><text x="750" y="98.78" text-anchor="middle" font-size="9.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">例：if week &gt; 53:</text><text x="750" y="165.61" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">结果奖励（在策略、稀疏）</text><text x="750" y="179.67" text-anchor="middle" font-size="9.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">测试程序直接判，或用人类比较训出的奖励模型</text><text x="750" y="192.78" text-anchor="middle" font-size="9.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">例：128 passed，整条轨迹得 1</text><text x="750" y="259.61" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">教师打分（在策略、密集）</text><text x="750" y="273.67" text-anchor="middle" font-size="9.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">更强的模型，已训好、不再更新</text><text x="750" y="286.78" text-anchor="middle" font-size="9.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">例：第③步 cat time.py 不认可</text><text x="594" y="214" text-anchor="end" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">给学生的</text><text x="594" y="228" text-anchor="end" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">轨迹打分</text><text x="750" y="132" text-anchor="middle" font-size="9.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">示范是老师的轨迹，学生的轨迹不经过这里</text><text x="580" y="346.61" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">优势与损失</text><text x="580" y="360.67" text-anchor="middle" font-size="9.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">比参照好多少；哪些 token 计入</text><text x="580" y="373.78" text-anchor="middle" font-size="9.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">例：得 1 分，参照 0.4，优势 +0.6</text><text x="310" y="250" text-anchor="start" font-size="11" font-weight="600" fill="#B83560" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" style="paint-order:stroke;stroke-width:4px;stroke-linejoin:round" stroke="#ffffff">按每个 token 的权重改参数</text><text x="132" y="236.055" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">辅助模型</text><text x="132" y="250.115" text-anchor="middle" font-size="9.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">参考模型：训练开始时的冻结拷贝</text><text x="132" y="263.225" text-anchor="middle" font-size="9.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">价值模型：学自之后实际拿到的分</text><text x="132" y="276.335" text-anchor="middle" font-size="9.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">例：价值模型估这里约 0.4</text><text x="290" y="364" text-anchor="middle" font-size="9.5" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">参照值与漂移惩罚</text></svg>
