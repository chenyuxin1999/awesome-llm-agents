<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 410" width="900" height="410" role="img" aria-label="后训练的基本循环"><defs><marker id="ah-overviewloop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6577"/></marker></defs><rect x="0" y="0" width="900" height="410" fill="#ffffff"/><path d="M136,104 L183,104" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-overviewloop)"/><path d="M354,104 L401,104" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-overviewloop)"/><path d="M554,104 L600,104 L600,175 L637,175" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-overviewloop)"/><path d="M600,175 L600,269 L637,269" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-overviewloop)"/><line x1="860" y1="81" x2="880" y2="81" stroke="#5A6577" stroke-width="1.4"/><line x1="860" y1="175" x2="880" y2="175" stroke="#5A6577" stroke-width="1.4"/><line x1="860" y1="269" x2="880" y2="269" stroke="#5A6577" stroke-width="1.4"/><path d="M880,81 L880,356 L733,356" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-overviewloop)"/><path d="M430,346 L300,346 L300,149" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-overviewloop)"/><path d="M124,284 L124,372 L427,372" fill="none" stroke="#5A6577" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#ah-overviewloop)"/><rect x="24" y="74" width="112" height="60" rx="5" fill="#E3EBFF" stroke="#2B57C9" stroke-width="1.5"/><rect x="186" y="62" width="168" height="84" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="404" y="74" width="150" height="60" rx="5" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.5"/><rect x="640" y="46" width="220" height="70" rx="5" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.5"/><rect x="640" y="140" width="220" height="70" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="640" y="234" width="220" height="70" rx="5" fill="#DCEFF1" stroke="#0E6E7E" stroke-width="1.5"/><rect x="430" y="326" width="300" height="60" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><rect x="24" y="220" width="200" height="64" rx="5" fill="#E9EDF3" stroke="#47546A" stroke-width="1.5"/><text x="24" y="26" text-anchor="start" font-size="12" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">模型产生（或拿到）轨迹，信号给轨迹打分，打分变成优势与损失，损失改动参数，新参数产生下一批轨迹</text><text x="80" y="100.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">提示 / 任务</text><text x="80" y="115.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">一道题、一个仓库</text><text x="270" y="93.23" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">策略（学生）</text><text x="270" y="108.29" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">正在训练的模型</text><text x="270" y="122.78" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">自己生成轨迹</text><text x="479" y="100.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">学生的轨迹</text><text x="479" y="115.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">动作、工具调用、回答</text><text x="750" y="70.23" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">示范（离策略）</text><text x="750" y="85.29" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">老师走过的轨迹，逐 token 模仿</text><text x="750" y="99.78" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">SFT、离策略蒸馏</text><text x="750" y="164.23" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">结果奖励（在策略、稀疏）</text><text x="750" y="179.29" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">验证器、测试、奖励模型</text><text x="750" y="193.78" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">一条轨迹换一个分数</text><text x="750" y="258.23" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">教师打分（在策略、密集）</text><text x="750" y="273.29" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">教师对学生轨迹逐 token 打分</text><text x="750" y="287.78" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">在策略蒸馏</text><text x="594" y="214" text-anchor="end" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">给学生的</text><text x="594" y="228" text-anchor="end" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">轨迹打分</text><text x="750" y="132" text-anchor="middle" font-size="9.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">示范是老师的轨迹，学生的轨迹不经过这里</text><text x="580" y="352.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">优势与损失</text><text x="580" y="367.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">比参照好多少；哪些 token 计入</text><text x="310" y="250" text-anchor="start" font-size="11" font-weight="600" fill="#B83560" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" style="paint-order:stroke;stroke-width:4px;stroke-linejoin:round" stroke="#ffffff">参数更新</text><text x="124" y="241.92" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">辅助模型</text><text x="124" y="256.48" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">参考模型：限制漂移</text><text x="124" y="270.28" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">价值模型：估计参照</text></svg>
