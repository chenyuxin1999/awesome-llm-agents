<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340" role="img" aria-label="采样器用旧参数、训练器用新参数时怎样给旧数据重新加权"><rect x="0" y="0" width="880" height="340" fill="#ffffff"/><defs><marker id="ar-p05c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5a6577"/></marker></defs><text x="30.0" y="32.0" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="15" fill="#0e6e7e" font-weight="bold" text-anchor="start" style="white-space:pre">采样器还在用旧参数，训练器已经更新：按概率之比给旧数据重新加权（示意）</text><rect x="30.0" y="52.0" width="200.0" height="54.0" rx="6" fill="#e3eefb" stroke="#78b4eb" stroke-width="1.2"/><text x="130.0" y="75.0" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="13" fill="#18202c" font-weight="bold" text-anchor="middle" style="white-space:pre">采样器（推理引擎）</text><text x="130.0" y="95.0" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="12" fill="#5a6577" font-weight="normal" text-anchor="middle" style="white-space:pre">参数还是第 7 版</text><rect x="30.0" y="124.0" width="200.0" height="54.0" rx="6" fill="#ece8fa" stroke="#6a4fc4" stroke-width="1.2"/><text x="130.0" y="147.0" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="13" fill="#18202c" font-weight="bold" text-anchor="middle" style="white-space:pre">训练器</text><text x="130.0" y="167.0" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="12" fill="#5a6577" font-weight="normal" text-anchor="middle" style="white-space:pre">参数已经是第 9 版</text><text x="358.0" y="72.0" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="12" fill="#5a6577" font-weight="normal" text-anchor="end" style="white-space:pre">采到的 token</text><text x="358.0" y="112.0" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="12" fill="#5a6577" font-weight="normal" text-anchor="end" style="white-space:pre">第 7 版给的概率</text><text x="358.0" y="148.0" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="12" fill="#5a6577" font-weight="normal" text-anchor="end" style="white-space:pre">第 9 版给的概率</text><text x="358.0" y="188.0" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="12" fill="#5a6577" font-weight="normal" text-anchor="end" style="white-space:pre">比值 = 新 ÷ 旧</text><text x="358.0" y="232.0" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="12" fill="#5a6577" font-weight="normal" text-anchor="end" style="white-space:pre">截断到 2 以内</text><rect x="370.0" y="52.0" width="80.0" height="30.0" rx="2" fill="#fff1dc" stroke="#b86e00" stroke-width="1"/><text x="410.0" y="72.4" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="15" fill="#18202c" font-weight="bold" text-anchor="middle" style="white-space:pre">先</text><text x="410.0" y="112.0" font-family="Menlo, Consolas, DejaVu Sans Mono, Noto Sans CJK SC, monospace" font-size="14" fill="#78b4eb" font-weight="normal" text-anchor="middle" style="white-space:pre">0.40</text><text x="410.0" y="148.0" font-family="Menlo, Consolas, DejaVu Sans Mono, Noto Sans CJK SC, monospace" font-size="14" fill="#6a4fc4" font-weight="normal" text-anchor="middle" style="white-space:pre">0.42</text><rect x="378.0" y="168.0" width="64.0" height="28.0" rx="2" fill="#f2f4f7" stroke="#d5dbe4" stroke-width="1"/><text x="410.0" y="187.0" font-family="Menlo, Consolas, DejaVu Sans Mono, Noto Sans CJK SC, monospace" font-size="14" fill="#18202c" font-weight="normal" text-anchor="middle" style="white-space:pre">1.05</text><rect x="378.0" y="212.0" width="64.0" height="28.0" rx="2" fill="#e3f2e1" stroke="#5aa555" stroke-width="1"/><text x="410.0" y="231.0" font-family="Menlo, Consolas, DejaVu Sans Mono, Noto Sans CJK SC, monospace" font-size="14" fill="#5aa555" font-weight="normal" text-anchor="middle" style="white-space:pre">1.05</text><rect x="470.0" y="52.0" width="80.0" height="30.0" rx="2" fill="#fff1dc" stroke="#b86e00" stroke-width="1"/><text x="510.0" y="72.4" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="15" fill="#18202c" font-weight="bold" text-anchor="middle" style="white-space:pre">设</text><text x="510.0" y="112.0" font-family="Menlo, Consolas, DejaVu Sans Mono, Noto Sans CJK SC, monospace" font-size="14" fill="#78b4eb" font-weight="normal" text-anchor="middle" style="white-space:pre">0.30</text><text x="510.0" y="148.0" font-family="Menlo, Consolas, DejaVu Sans Mono, Noto Sans CJK SC, monospace" font-size="14" fill="#6a4fc4" font-weight="normal" text-anchor="middle" style="white-space:pre">0.33</text><rect x="478.0" y="168.0" width="64.0" height="28.0" rx="2" fill="#f2f4f7" stroke="#d5dbe4" stroke-width="1"/><text x="510.0" y="187.0" font-family="Menlo, Consolas, DejaVu Sans Mono, Noto Sans CJK SC, monospace" font-size="14" fill="#18202c" font-weight="normal" text-anchor="middle" style="white-space:pre">1.10</text><rect x="478.0" y="212.0" width="64.0" height="28.0" rx="2" fill="#e3f2e1" stroke="#5aa555" stroke-width="1"/><text x="510.0" y="231.0" font-family="Menlo, Consolas, DejaVu Sans Mono, Noto Sans CJK SC, monospace" font-size="14" fill="#5aa555" font-weight="normal" text-anchor="middle" style="white-space:pre">1.10</text><rect x="570.0" y="52.0" width="80.0" height="30.0" rx="2" fill="#fff1dc" stroke="#b86e00" stroke-width="1"/><text x="610.0" y="72.4" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="15" fill="#18202c" font-weight="bold" text-anchor="middle" style="white-space:pre">x</text><text x="610.0" y="112.0" font-family="Menlo, Consolas, DejaVu Sans Mono, Noto Sans CJK SC, monospace" font-size="14" fill="#78b4eb" font-weight="normal" text-anchor="middle" style="white-space:pre">0.90</text><text x="610.0" y="148.0" font-family="Menlo, Consolas, DejaVu Sans Mono, Noto Sans CJK SC, monospace" font-size="14" fill="#6a4fc4" font-weight="normal" text-anchor="middle" style="white-space:pre">0.90</text><rect x="578.0" y="168.0" width="64.0" height="28.0" rx="2" fill="#f2f4f7" stroke="#d5dbe4" stroke-width="1"/><text x="610.0" y="187.0" font-family="Menlo, Consolas, DejaVu Sans Mono, Noto Sans CJK SC, monospace" font-size="14" fill="#18202c" font-weight="normal" text-anchor="middle" style="white-space:pre">1.00</text><rect x="578.0" y="212.0" width="64.0" height="28.0" rx="2" fill="#e3f2e1" stroke="#5aa555" stroke-width="1"/><text x="610.0" y="231.0" font-family="Menlo, Consolas, DejaVu Sans Mono, Noto Sans CJK SC, monospace" font-size="14" fill="#5aa555" font-weight="normal" text-anchor="middle" style="white-space:pre">1.00</text><rect x="670.0" y="52.0" width="80.0" height="30.0" rx="2" fill="#fff1dc" stroke="#b86e00" stroke-width="1"/><text x="710.0" y="72.4" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="15" fill="#18202c" font-weight="bold" text-anchor="middle" style="white-space:pre">=</text><text x="710.0" y="112.0" font-family="Menlo, Consolas, DejaVu Sans Mono, Noto Sans CJK SC, monospace" font-size="14" fill="#78b4eb" font-weight="normal" text-anchor="middle" style="white-space:pre">0.95</text><text x="710.0" y="148.0" font-family="Menlo, Consolas, DejaVu Sans Mono, Noto Sans CJK SC, monospace" font-size="14" fill="#6a4fc4" font-weight="normal" text-anchor="middle" style="white-space:pre">0.96</text><rect x="678.0" y="168.0" width="64.0" height="28.0" rx="2" fill="#f2f4f7" stroke="#d5dbe4" stroke-width="1"/><text x="710.0" y="187.0" font-family="Menlo, Consolas, DejaVu Sans Mono, Noto Sans CJK SC, monospace" font-size="14" fill="#18202c" font-weight="normal" text-anchor="middle" style="white-space:pre">1.01</text><rect x="678.0" y="212.0" width="64.0" height="28.0" rx="2" fill="#e3f2e1" stroke="#5aa555" stroke-width="1"/><text x="710.0" y="231.0" font-family="Menlo, Consolas, DejaVu Sans Mono, Noto Sans CJK SC, monospace" font-size="14" fill="#5aa555" font-weight="normal" text-anchor="middle" style="white-space:pre">1.01</text><rect x="770.0" y="52.0" width="80.0" height="30.0" rx="2" fill="#fff1dc" stroke="#b86e00" stroke-width="1"/><text x="810.0" y="72.4" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="15" fill="#18202c" font-weight="bold" text-anchor="middle" style="white-space:pre">3</text><text x="810.0" y="112.0" font-family="Menlo, Consolas, DejaVu Sans Mono, Noto Sans CJK SC, monospace" font-size="14" fill="#78b4eb" font-weight="normal" text-anchor="middle" style="white-space:pre">0.02</text><text x="810.0" y="148.0" font-family="Menlo, Consolas, DejaVu Sans Mono, Noto Sans CJK SC, monospace" font-size="14" fill="#6a4fc4" font-weight="normal" text-anchor="middle" style="white-space:pre">0.40</text><rect x="778.0" y="168.0" width="64.0" height="28.0" rx="2" fill="#fde8dc" stroke="#e8590c" stroke-width="1"/><text x="810.0" y="187.0" font-family="Menlo, Consolas, DejaVu Sans Mono, Noto Sans CJK SC, monospace" font-size="14" fill="#e8590c" font-weight="normal" text-anchor="middle" style="white-space:pre">20.0</text><rect x="778.0" y="212.0" width="64.0" height="28.0" rx="2" fill="#e3f2e1" stroke="#5aa555" stroke-width="1"/><text x="810.0" y="231.0" font-family="Menlo, Consolas, DejaVu Sans Mono, Noto Sans CJK SC, monospace" font-size="14" fill="#5aa555" font-weight="normal" text-anchor="middle" style="white-space:pre">2.00</text><text x="30.0" y="284.0" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="13" fill="#18202c" font-weight="normal" text-anchor="start" style="white-space:pre">前四个 token 新旧两版的看法差不多，比值都在 1 附近，旧数据几乎照原样使用。</text><text x="30.0" y="308.0" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="13" fill="#18202c" font-weight="normal" text-anchor="start" style="white-space:pre">最后一个 token 旧版几乎不会写、新版却很想写，比值到了 20，不截断，这一个 token 就会主导整次更新。</text></svg>
