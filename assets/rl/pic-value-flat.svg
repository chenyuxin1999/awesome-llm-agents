<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" role="img" aria-label="价值扁平化与只挑三个位置的改法"><rect x="0" y="0" width="900" height="420" fill="#ffffff"/><defs><marker id="ar-p05e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5a6577"/></marker></defs><text x="30.0" y="32.0" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="15" fill="#0e6e7e" font-weight="bold" text-anchor="start" style="white-space:pre">示意：critic 的预测被抹平，以及每个回答只挑三个位置来训的改法</text><rect x="30.0" y="46.0" width="840.0" height="30.0" rx="2" fill="#ffffff" stroke="#b86e00" stroke-width="1" stroke-dasharray="4 3"/><text x="450.0" y="66.0" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="12" fill="#b86e00" font-weight="bold" text-anchor="middle" style="white-space:pre">critic 的训练信号：从这个位置往后多续写几次，实际拿到的平均分（灰线）；目标：预测（紫线）贴近灰线</text><rect x="30.0" y="88.0" width="410.0" height="320.0" rx="6" fill="#f2f4f7" stroke="#d5dbe4" stroke-width="1"/><text x="235.0" y="112.0" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="13" fill="#6a4fc4" font-weight="bold" text-anchor="middle" style="white-space:pre">原来：每个位置都拿来训练</text><line x1="80.0" y1="310.0" x2="420.0" y2="310.0" stroke="#5a6577" stroke-width="1"/><line x1="80.0" y1="140.0" x2="80.0" y2="310.0" stroke="#5a6577" stroke-width="1"/><text x="74.0" y="146.0" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="11" fill="#5a6577" font-weight="normal" text-anchor="end" style="white-space:pre">1</text><text x="74.0" y="314.0" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="11" fill="#5a6577" font-weight="normal" text-anchor="end" style="white-space:pre">0</text><text x="420.0" y="328.0" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="11" fill="#5a6577" font-weight="normal" text-anchor="end" style="white-space:pre">回答里的位置 →</text><text x="84.0" y="132.0" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="11" fill="#5a6577" font-weight="normal" text-anchor="start" style="white-space:pre">往后能拿的分</text><path d="M88.0,250.5 L104.2,248.8 L120.4,245.4 L136.6,204.6 L152.8,208.0 L169.0,211.4 L185.2,259.0 L201.4,262.4 L217.6,259.0 L233.8,257.3 L250.0,184.2 L266.2,180.8 L282.4,182.5 L298.6,225.0 L314.8,228.4 L331.0,160.4 L347.2,157.0 L363.4,155.3 L379.6,150.2 L395.8,145.1 L412.0,140.0" stroke="#9aa3b2" stroke-width="2.2" fill="none"/><path d="M88.0,221.6 L104.2,220.6 L120.4,219.6 L136.6,218.5 L152.8,217.5 L169.0,216.5 L185.2,215.5 L201.4,214.5 L217.6,213.4 L233.8,212.4 L250.0,211.4 L266.2,210.4 L282.4,209.4 L298.6,208.3 L314.8,207.3 L331.0,206.3 L347.2,205.3 L363.4,204.3 L379.6,203.2 L395.8,202.2 L412.0,201.2" stroke="#6a4fc4" stroke-width="2.4" fill="none"/><circle cx="88.0" cy="250.5" r="2.6" fill="#b86e00" stroke="none" stroke-width="1.2"/><circle cx="104.2" cy="248.8" r="2.6" fill="#b86e00" stroke="none" stroke-width="1.2"/><circle cx="120.4" cy="245.4" r="2.6" fill="#b86e00" stroke="none" stroke-width="1.2"/><circle cx="136.6" cy="204.6" r="2.6" fill="#b86e00" stroke="none" stroke-width="1.2"/><circle cx="152.8" cy="208.0" r="2.6" fill="#b86e00" stroke="none" stroke-width="1.2"/><circle cx="169.0" cy="211.4" r="2.6" fill="#b86e00" stroke="none" stroke-width="1.2"/><circle cx="185.2" cy="259.0" r="2.6" fill="#b86e00" stroke="none" stroke-width="1.2"/><circle cx="201.4" cy="262.4" r="2.6" fill="#b86e00" stroke="none" stroke-width="1.2"/><circle cx="217.6" cy="259.0" r="2.6" fill="#b86e00" stroke="none" stroke-width="1.2"/><circle cx="233.8" cy="257.3" r="2.6" fill="#b86e00" stroke="none" stroke-width="1.2"/><circle cx="250.0" cy="184.2" r="2.6" fill="#b86e00" stroke="none" stroke-width="1.2"/><circle cx="266.2" cy="180.8" r="2.6" fill="#b86e00" stroke="none" stroke-width="1.2"/><circle cx="282.4" cy="182.5" r="2.6" fill="#b86e00" stroke="none" stroke-width="1.2"/><circle cx="298.6" cy="225.0" r="2.6" fill="#b86e00" stroke="none" stroke-width="1.2"/><circle cx="314.8" cy="228.4" r="2.6" fill="#b86e00" stroke="none" stroke-width="1.2"/><circle cx="331.0" cy="160.4" r="2.6" fill="#b86e00" stroke="none" stroke-width="1.2"/><circle cx="347.2" cy="157.0" r="2.6" fill="#b86e00" stroke="none" stroke-width="1.2"/><circle cx="363.4" cy="155.3" r="2.6" fill="#b86e00" stroke="none" stroke-width="1.2"/><circle cx="379.6" cy="150.2" r="2.6" fill="#b86e00" stroke="none" stroke-width="1.2"/><circle cx="395.8" cy="145.1" r="2.6" fill="#b86e00" stroke="none" stroke-width="1.2"/><circle cx="412.0" cy="140.0" r="2.6" fill="#b86e00" stroke="none" stroke-width="1.2"/><text x="235.0" y="348.0" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="12" fill="#18202c" font-weight="normal" text-anchor="middle" style="white-space:pre">相邻位置的状态很像，大量几乎</text><text x="235.0" y="368.0" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="12" fill="#18202c" font-weight="normal" text-anchor="middle" style="white-space:pre">重复的更新把预测抹平了</text><text x="235.0" y="394.0" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="11" fill="#b86e00" font-weight="normal" text-anchor="middle" style="white-space:pre">橙点：用来训练 critic 的位置</text><rect x="460.0" y="88.0" width="410.0" height="320.0" rx="6" fill="#f2f4f7" stroke="#d5dbe4" stroke-width="1"/><text x="665.0" y="112.0" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="13" fill="#0e6e7e" font-weight="bold" text-anchor="middle" style="white-space:pre">改法：每个回答只挑三个相隔较远的位置</text><line x1="510.0" y1="310.0" x2="850.0" y2="310.0" stroke="#5a6577" stroke-width="1"/><line x1="510.0" y1="140.0" x2="510.0" y2="310.0" stroke="#5a6577" stroke-width="1"/><text x="504.0" y="146.0" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="11" fill="#5a6577" font-weight="normal" text-anchor="end" style="white-space:pre">1</text><text x="504.0" y="314.0" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="11" fill="#5a6577" font-weight="normal" text-anchor="end" style="white-space:pre">0</text><text x="850.0" y="328.0" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="11" fill="#5a6577" font-weight="normal" text-anchor="end" style="white-space:pre">回答里的位置 →</text><text x="514.0" y="132.0" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="11" fill="#5a6577" font-weight="normal" text-anchor="start" style="white-space:pre">往后能拿的分</text><path d="M518.0,250.5 L534.2,248.8 L550.4,245.4 L566.6,204.6 L582.8,208.0 L599.0,211.4 L615.2,259.0 L631.4,262.4 L647.6,259.0 L663.8,257.3 L680.0,184.2 L696.2,180.8 L712.4,182.5 L728.6,225.0 L744.8,228.4 L761.0,160.4 L777.2,157.0 L793.4,155.3 L809.6,150.2 L825.8,145.1 L842.0,140.0" stroke="#9aa3b2" stroke-width="2.2" fill="none"/><path d="M518.0,242.6 L534.2,241.3 L550.4,229.6 L566.6,219.1 L582.8,210.4 L599.0,223.7 L615.2,237.1 L631.4,248.7 L647.6,248.0 L663.8,228.2 L680.0,208.4 L696.2,189.5 L712.4,199.4 L728.6,211.1 L744.8,205.3 L761.0,188.0 L777.2,169.5 L793.4,166.7 L809.6,163.5 L825.8,159.4 L842.0,157.2" stroke="#6a4fc4" stroke-width="2.4" fill="none"/><circle cx="566.6" cy="204.6" r="6" fill="#fff1dc" stroke="#b86e00" stroke-width="2"/><circle cx="680.0" cy="184.2" r="6" fill="#fff1dc" stroke="#b86e00" stroke-width="2"/><circle cx="793.4" cy="155.3" r="6" fill="#fff1dc" stroke="#b86e00" stroke-width="2"/><text x="665.0" y="348.0" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="12" fill="#18202c" font-weight="normal" text-anchor="middle" style="white-space:pre">训练位置少了，预测反而</text><text x="665.0" y="368.0" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="12" fill="#18202c" font-weight="normal" text-anchor="middle" style="white-space:pre">跟上了起伏（论文报告扁平化缓解）</text><text x="665.0" y="394.0" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="11" fill="#b86e00" font-weight="normal" text-anchor="middle" style="white-space:pre">橙点：用来训练 critic 的位置</text></svg>
