<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360" role="img" aria-label="InstructGPT 的三步与 PPO 的四个模型"><defs><marker id="ah-s1rlhf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6577"/></marker></defs><rect x="0" y="0" width="900" height="360" fill="#ffffff"/><rect x="16" y="44" width="250" height="160" rx="5" fill="#F3F5F8" stroke="#D5DBE4" stroke-width="1.5"/><path d="M132,108 L149,108" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-s1rlhf)"/><rect x="282" y="44" width="300" height="160" rx="5" fill="#F3F5F8" stroke="#D5DBE4" stroke-width="1.5"/><path d="M380,114 L393,114" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-s1rlhf)"/><path d="M476,114 L489,114" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-s1rlhf)"/><rect x="598" y="44" width="286" height="160" rx="5" fill="#F3F5F8" stroke="#D5DBE4" stroke-width="1.5"/><path d="M732,108 L745,108" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-s1rlhf)"/><path d="M809,134 L809,160 L672,160 L672,137" fill="none" stroke="#5A6577" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#ah-s1rlhf)"/><rect x="32" y="82" width="100" height="52" rx="5" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.5"/><rect x="152" y="82" width="100" height="52" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="296" y="82" width="84" height="64" rx="5" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.5"/><rect x="396" y="82" width="80" height="64" rx="5" fill="#E3EBFF" stroke="#2B57C9" stroke-width="1.5"/><rect x="492" y="82" width="80" height="64" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="612" y="82" width="120" height="52" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="748" y="82" width="122" height="52" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><rect x="24" y="252" width="204" height="60" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="240" y="252" width="204" height="60" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="456" y="252" width="204" height="60" rx="5" fill="#E9EDF3" stroke="#47546A" stroke-width="1.5"/><rect x="672" y="252" width="204" height="60" rx="5" fill="#E9EDF3" stroke="#47546A" stroke-width="1.5"/><text x="24" y="26" text-anchor="start" font-size="12" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">InstructGPT 把三步拼成标准流程：示范打底，人类比较训练奖励模型，再用 PPO 按奖励模型的打分改进策略</text><text x="28" y="66" text-anchor="start" font-size="12.5" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">步骤 1：监督微调</text><text x="82" y="111.565" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">人写的示范</text><text x="202" y="104.82" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">SFT 模型</text><text x="202" y="119.38" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">建立基本行为</text><text x="142" y="168" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">很多任务写不出唯一正确答案</text><text x="142" y="186" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">人却一眼能比出高下</text><text x="294" y="66" text-anchor="start" font-size="12.5" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">步骤 2：用人类比较训练奖励模型</text><text x="338" y="110.82" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">多个回答</text><text x="338" y="125.38" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">同一提示</text><text x="436" y="110.82" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">人来比较</text><text x="436" y="125.38" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">哪个更好</text><text x="532" y="110.82" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">奖励模型</text><text x="532" y="125.38" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">预测偏好</text><text x="432" y="176" text-anchor="middle" font-size="10.5" font-weight="400" fill="#C2501A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">奖励模型预测的是人类偏好，只是目标的近似</text><text x="610" y="66" text-anchor="start" font-size="12.5" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">步骤 3：PPO 强化学习</text><text x="672" y="111.565" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">策略生成回答</text><text x="809" y="104.82" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">裁剪后的更新</text><text x="809" y="119.38" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">一步别走太远</text><text x="740" y="176" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">反复：采样、打分、估优势、更新</text><text x="24" y="236" text-anchor="start" font-size="12.5" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">步骤 3 里同时在跑的四个模型（Raschka 数过这笔账）</text><text x="126" y="278.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">策略</text><text x="126" y="293.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">正在训练，生成回答</text><text x="342" y="278.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">奖励模型</text><text x="342" y="293.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">给整段回答打分</text><text x="558" y="278.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">critic（价值模型）</text><text x="558" y="293.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">配合 GAE 估计优势</text><text x="774" y="278.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">参考模型</text><text x="774" y="293.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">防止策略漂得太远</text><text x="450" y="340" text-anchor="middle" font-size="11" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">每一个都要占显存、要训练或推理，也都可能出错；后面几个阶段就是在一个个拿掉它们</text></svg>
