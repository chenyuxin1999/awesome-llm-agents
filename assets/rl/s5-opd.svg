<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" role="img" aria-label="在策略蒸馏的一步"><defs><marker id="ah-s5opd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6577"/></marker></defs><rect x="0" y="0" width="900" height="400" fill="#ffffff"/><path d="M144,80 L173,80" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-s5opd)"/><path d="M326,80 L357,80" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-s5opd)"/><path d="M251,108 L251,147" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-s5opd)"/><line x1="354" y1="260" x2="860" y2="260" stroke="#5A6577" stroke-width="1"/><path d="M326,182 L357,200" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-s5opd)"/><path d="M251,214 L251,237" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-s5opd)"/><path d="M176,268 L110,268 L110,111" fill="none" stroke="#5A6577" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#ah-s5opd)"/><rect x="24" y="312" width="852" height="78" rx="5" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.1" stroke-dasharray="4 3"/><rect x="24" y="52" width="120" height="56" rx="5" fill="#E3EBFF" stroke="#2B57C9" stroke-width="1.5"/><rect x="176" y="52" width="150" height="56" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="360" y="52" width="44" height="56" rx="5" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.5"/><rect x="410" y="52" width="44" height="56" rx="5" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.5"/><rect x="460" y="52" width="44" height="56" rx="5" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.5"/><rect x="510" y="52" width="44" height="56" rx="5" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.5"/><rect x="560" y="52" width="44" height="56" rx="5" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.5"/><rect x="610" y="52" width="44" height="56" rx="5" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.5"/><rect x="660" y="52" width="44" height="56" rx="5" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.5"/><rect x="710" y="52" width="44" height="56" rx="5" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.5"/><rect x="760" y="52" width="44" height="56" rx="5" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.5"/><rect x="810" y="52" width="44" height="56" rx="5" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.5"/><rect x="176" y="150" width="150" height="64" rx="5" fill="#DCEFF1" stroke="#0E6E7E" stroke-width="1.5"/><rect x="370" y="256" width="24" height="4" rx="2" fill="#DCEFF1" stroke="#0E6E7E" stroke-width="1.2"/><rect x="420" y="256" width="24" height="4" rx="2" fill="#DCEFF1" stroke="#0E6E7E" stroke-width="1.2"/><rect x="470" y="252" width="24" height="8" rx="2" fill="#DCEFF1" stroke="#0E6E7E" stroke-width="1.2"/><rect x="520" y="256" width="24" height="4" rx="2" fill="#DCEFF1" stroke="#0E6E7E" stroke-width="1.2"/><rect x="570" y="196" width="24" height="64" rx="2" fill="#FDE8DD" stroke="#C2501A" stroke-width="1.2"/><rect x="620" y="248" width="24" height="12" rx="2" fill="#DCEFF1" stroke="#0E6E7E" stroke-width="1.2"/><rect x="670" y="256" width="24" height="4" rx="2" fill="#DCEFF1" stroke="#0E6E7E" stroke-width="1.2"/><rect x="720" y="252" width="24" height="8" rx="2" fill="#DCEFF1" stroke="#0E6E7E" stroke-width="1.2"/><rect x="770" y="244" width="24" height="16" rx="2" fill="#DCEFF1" stroke="#0E6E7E" stroke-width="1.2"/><rect x="820" y="172" width="24" height="88" rx="2" fill="#FDE8DD" stroke="#C2501A" stroke-width="1.2"/><rect x="176" y="240" width="150" height="56" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><text x="24" y="20" text-anchor="start" font-size="13" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">目标：学生在自己会走到的状态上，每个 token 都拿到教师的反馈</text><text x="24" y="40" text-anchor="start" font-size="10.5" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">学生自己采样，教师在同一条序列上给每个 token 打分，打分当作逐 token 的优势，再走强化学习的更新</text><text x="84" y="76.82" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">提示</text><text x="84" y="91.38" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">一道数学题</text><text x="251" y="76.82" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">① 学生采样</text><text x="251" y="91.38" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">生成自己的回答</text><text x="382" y="85" text-anchor="middle" font-size="13" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">先</text><text x="432" y="85" text-anchor="middle" font-size="13" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">设</text><text x="482" y="85" text-anchor="middle" font-size="13" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">x</text><text x="532" y="85" text-anchor="middle" font-size="13" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">=</text><text x="582" y="85" text-anchor="middle" font-size="13" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">3</text><text x="632" y="85" text-anchor="middle" font-size="13" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">，</text><text x="682" y="85" text-anchor="middle" font-size="13" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">代</text><text x="732" y="85" text-anchor="middle" font-size="13" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">入</text><text x="782" y="85" text-anchor="middle" font-size="13" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">得</text><text x="832" y="85" text-anchor="middle" font-size="13" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">7</text><text x="610" y="128" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">学生的序列（示意）</text><text x="251" y="171.92" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">② 教师打分</text><text x="251" y="186.48" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">对同一序列算</text><text x="251" y="200.28" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">每个位置的概率</text><text x="610" y="152" text-anchor="middle" font-size="10.5" font-weight="600" fill="#B83560" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">③ 每个 token：学生对数概率减教师对数概率（逐 token 的反向 KL）</text><text x="610" y="278" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">柱越高，教师越不认可这个 token；优势取它的负值</text><text x="251" y="264.82" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">④ 按 RL 规则更新</text><text x="251" y="279.38" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">折扣因子取 0</text><text x="100" y="190" text-anchor="end" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">下一步</text><text x="251" y="128" text-anchor="middle" font-size="9.5" font-weight="600" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" style="paint-order:stroke;stroke-width:4px;stroke-linejoin:round" stroke="#ffffff">①② 不训练：学生只采样，教师冻结</text><text x="40" y="333" text-anchor="start" font-size="11" font-weight="700" fill="#B86E00" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">④ 是唯一训练的一步。信号：教师在学生序列上逐 token 给出的概率，与学生概率之差；目标：教师认可的 token 以后更容易写出来。</text><text x="40" y="355" text-anchor="start" font-size="11" font-weight="500" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">改代码只要两处：带 KL 正则的 RL 代码里，把参考模型换成教师；把每个 token 的优势设为负的反向 KL。</text><text x="40" y="377" text-anchor="start" font-size="11" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">低 KL 在教师看来就对应理想行为，所以很难被钻空子；序列可以只采一部分，节省算力。</text></svg>
