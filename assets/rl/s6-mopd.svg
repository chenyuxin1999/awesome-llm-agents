<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360" role="img" aria-label="多教师在策略蒸馏的配方"><defs><marker id="ah-s6mopd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6577"/></marker></defs><rect x="0" y="0" width="900" height="360" fill="#ffffff"/><path d="M134,160 L160,160 L160,74 L187,74" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-s6mopd)"/><path d="M134,160 L160,160 L160,130 L187,130" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-s6mopd)"/><path d="M134,160 L160,160 L160,186 L187,186" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-s6mopd)"/><path d="M134,160 L160,160 L160,242 L187,242" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-s6mopd)"/><path d="M340,74 L380,74 L380,106 L758,106 L758,117" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-s6mopd)"/><path d="M340,130 L380,130 L380,106 L758,106 L758,117" fill="none" stroke="#5A6577" stroke-width="1.4"/><path d="M340,186 L380,186 L380,106 L758,106 L758,117" fill="none" stroke="#5A6577" stroke-width="1.4"/><path d="M590,160 L637,160" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-s6mopd)"/><path d="M758,200 L758,230 L505,230 L505,203" fill="none" stroke="#5A6577" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#ah-s6mopd)"/><rect x="420" y="270" width="456" height="78" rx="5" fill="#FDE8DD" stroke="#C2501A" stroke-width="1.5"/><rect x="24" y="130" width="110" height="60" rx="5" fill="#E9EDF3" stroke="#47546A" stroke-width="1.5"/><rect x="190" y="52" width="150" height="44" rx="5" fill="#DCEFF1" stroke="#0E6E7E" stroke-width="1.5"/><rect x="190" y="108" width="150" height="44" rx="5" fill="#DCEFF1" stroke="#0E6E7E" stroke-width="1.5"/><rect x="190" y="164" width="150" height="44" rx="5" fill="#DCEFF1" stroke="#0E6E7E" stroke-width="1.5"/><rect x="190" y="220" width="150" height="44" rx="5" fill="#F3F5F8" stroke="#D5DBE4" stroke-width="1.5"/><rect x="420" y="120" width="170" height="80" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="640" y="120" width="236" height="80" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><text x="24" y="26" text-anchor="start" font-size="12" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">2026 年的新形状：强化学习在各领域把能力推上去，蒸馏把它们巩固回一个学生（专家个数为示意）</text><text x="79" y="163.72" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">基础模型</text><text x="265" y="71.165" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">数学专家</text><text x="265" y="85.225" text-anchor="middle" font-size="9.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">SFT + RL</text><text x="265" y="127.165" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">代码专家</text><text x="265" y="141.225" text-anchor="middle" font-size="9.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">SFT + RL</text><text x="265" y="183.165" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">agent 专家</text><text x="265" y="197.225" text-anchor="middle" font-size="9.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">SFT + RL</text><text x="265" y="239.165" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">……</text><text x="265" y="253.225" text-anchor="middle" font-size="9.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">可以十个以上</text><text x="265" y="286" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">各领域分开训，可以并行开发</text><text x="505" y="149.23" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">通用学生</text><text x="505" y="164.29" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">在自己的 rollout 上</text><text x="505" y="178.78" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">生成回答</text><text x="758" y="149.92" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">逐 token 最小化反向 KL</text><text x="758" y="164.48" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">每道题交给对应领域的教师</text><text x="758" y="178.28" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">教师给学生的每个 token 打分</text><text x="560" y="98" text-anchor="middle" font-size="10.5" font-weight="600" fill="#0E6E7E" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" style="paint-order:stroke;stroke-width:4px;stroke-linejoin:round" stroke="#ffffff">教师信号</text><text x="632" y="246" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">更新后继续采样</text><text x="434" y="292" text-anchor="start" font-size="11.5" font-weight="700" fill="#C2501A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">保留意见（访谈原话的意思）</text><text x="434" y="312" text-anchor="start" font-size="10.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">MAI、Kimi、GLM 等实验室没有用这套配方；</text><text x="434" y="330" text-anchor="start" font-size="10.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">流水线差别很大的教师难以合并；相对直接蒸馏推理轨迹再 SFT 好多少还说不清</text><text x="24" y="330" text-anchor="start" font-size="10.5" font-weight="500" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">为什么这么做：混在一次训练里，</text><text x="24" y="346" text-anchor="start" font-size="10.5" font-weight="500" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">数学、代码、agent 能力会互相拉扯</text></svg>
