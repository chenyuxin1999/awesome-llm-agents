<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 436" width="900" height="436" role="img" aria-label="每个阶段训练里要维护几个模型"><defs><marker id="ah-subtractadd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6577"/></marker></defs><rect x="0" y="0" width="900" height="436" fill="#ffffff"/><rect x="24" y="54" width="196" height="326" rx="5" fill="#F3F5F8" stroke="#D5DBE4" stroke-width="1.5"/><path d="M220,216 L240,216" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-subtractadd)"/><rect x="242" y="54" width="196" height="326" rx="5" fill="#F3F5F8" stroke="#D5DBE4" stroke-width="1.5"/><path d="M438,216 L458,216" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-subtractadd)"/><rect x="460" y="54" width="196" height="326" rx="5" fill="#F3F5F8" stroke="#D5DBE4" stroke-width="1.5"/><path d="M656,216 L676,216" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-subtractadd)"/><rect x="678" y="54" width="196" height="326" rx="5" fill="#F3F5F8" stroke="#D5DBE4" stroke-width="1.5"/><path d="M30,420 L650,420" fill="none" stroke="#C2501A" stroke-width="1.6" marker-end="url(#ah-subtractadd)"/><path d="M670,420 L870,420" fill="none" stroke="#0E6E7E" stroke-width="1.6" marker-end="url(#ah-subtractadd)"/><rect x="36" y="108" width="172" height="56" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="36" y="174" width="172" height="56" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="36" y="240" width="172" height="56" rx="5" fill="#E9EDF3" stroke="#47546A" stroke-width="1.5"/><rect x="36" y="306" width="172" height="56" rx="5" fill="#E9EDF3" stroke="#47546A" stroke-width="1.5"/><rect x="254" y="108" width="172" height="56" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="254" y="174" width="172" height="56" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="254" y="240" width="172" height="56" rx="5" fill="#FFFFFF" stroke="#B7C0CD" stroke-width="1.5" stroke-dasharray="4 3"/><rect x="254" y="306" width="172" height="56" rx="5" fill="#E9EDF3" stroke="#47546A" stroke-width="1.5"/><rect x="472" y="108" width="172" height="56" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="472" y="174" width="172" height="56" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5" stroke-dasharray="5 3"/><rect x="472" y="240" width="172" height="56" rx="5" fill="#FFFFFF" stroke="#B7C0CD" stroke-width="1.5" stroke-dasharray="4 3"/><rect x="472" y="306" width="172" height="56" rx="5" fill="#E9EDF3" stroke="#47546A" stroke-width="1.5"/><rect x="690" y="108" width="172" height="56" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="690" y="174" width="172" height="56" rx="5" fill="#FFFFFF" stroke="#B7C0CD" stroke-width="1.5" stroke-dasharray="4 3"/><rect x="690" y="240" width="172" height="56" rx="5" fill="#FFFFFF" stroke="#B7C0CD" stroke-width="1.5" stroke-dasharray="4 3"/><rect x="690" y="306" width="172" height="56" rx="5" fill="#DCEFF1" stroke="#0E6E7E" stroke-width="1.5"/><text x="24" y="22" text-anchor="start" font-size="12" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">前三个阶段一次拿掉一个模型，流程越来越简单；第 5 阶段把参考模型的位置让给教师，密集信号回来了</text><text x="24" y="42" text-anchor="start" font-size="11.5" font-weight="700" fill="#B86E00" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">例：同一道题“3x + 5 = 26，求 x”，每个框里写着它这一步实际给出什么（数字为示意）</text><text x="122" y="76" text-anchor="middle" font-size="12" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">第 1 阶段：PPO 版 RLHF</text><text x="122" y="96" text-anchor="middle" font-size="11" font-weight="600" fill="#B83560" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">4 个模型</text><text x="122" y="132" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">策略</text><text x="122" y="152" text-anchor="middle" font-size="9.8" font-weight="500" fill="#B86E00" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">写出：x = 7</text><text x="122" y="198" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">奖励模型</text><text x="122" y="218" text-anchor="middle" font-size="9.8" font-weight="500" fill="#B86E00" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">给这个回答打 0.82</text><text x="122" y="264" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">critic</text><text x="122" y="284" text-anchor="middle" font-size="9.8" font-weight="500" fill="#B86E00" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">估写到一半时约 0.6</text><text x="122" y="330" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">参考模型</text><text x="122" y="350" text-anchor="middle" font-size="9.8" font-weight="500" fill="#B86E00" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">偏离多少：KL 0.05</text><text x="340" y="76" text-anchor="middle" font-size="12" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">第 2 阶段：GRPO</text><text x="340" y="96" text-anchor="middle" font-size="11" font-weight="600" fill="#B83560" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">3 个模型</text><text x="340" y="132" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">策略</text><text x="340" y="152" text-anchor="middle" font-size="9.8" font-weight="500" fill="#B86E00" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">答 4 遍：7、7、6、7</text><text x="340" y="198" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">奖励模型</text><text x="340" y="218" text-anchor="middle" font-size="9.8" font-weight="500" fill="#B86E00" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">0.82、0.80、0.21、0.79</text><text x="340" y="264" text-anchor="middle" font-size="11" font-weight="400" fill="#8A94A6" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">critic（去掉）</text><text x="340" y="284" text-anchor="middle" font-size="9.8" font-weight="500" fill="#B86E00" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">参照改用组平均 0.66</text><text x="340" y="330" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">参考模型</text><text x="340" y="350" text-anchor="middle" font-size="9.8" font-weight="500" fill="#B86E00" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">偏离多少：KL 0.05</text><text x="558" y="76" text-anchor="middle" font-size="12" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">第 3 阶段：RLVR</text><text x="558" y="96" text-anchor="middle" font-size="11" font-weight="600" fill="#B83560" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">2 个模型 + 检查程序</text><text x="558" y="132" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">策略</text><text x="558" y="152" text-anchor="middle" font-size="9.8" font-weight="500" fill="#B86E00" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">答 4 遍：7、7、6、7</text><text x="558" y="198" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">规则检查器（程序）</text><text x="558" y="218" text-anchor="middle" font-size="9.8" font-weight="500" fill="#B86E00" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">对标准答案：1、1、0、1</text><text x="558" y="264" text-anchor="middle" font-size="11" font-weight="400" fill="#8A94A6" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">critic（去掉）</text><text x="558" y="284" text-anchor="middle" font-size="9.8" font-weight="500" fill="#B86E00" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">参照改用组平均 0.75</text><text x="558" y="330" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">参考模型</text><text x="558" y="350" text-anchor="middle" font-size="9.8" font-weight="500" fill="#B86E00" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">偏离多少：KL 0.05</text><text x="776" y="76" text-anchor="middle" font-size="12" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">第 5 阶段：在策略蒸馏</text><text x="776" y="96" text-anchor="middle" font-size="11" font-weight="600" fill="#0E6E7E" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">学生 + 教师</text><text x="776" y="132" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">学生（策略）</text><text x="776" y="152" text-anchor="middle" font-size="9.8" font-weight="500" fill="#B86E00" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">写出：3x = 20，x = 6.7</text><text x="776" y="207" text-anchor="middle" font-size="11" font-weight="400" fill="#8A94A6" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">不需要奖励</text><text x="776" y="273" text-anchor="middle" font-size="11" font-weight="400" fill="#8A94A6" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">critic（去掉）</text><text x="776" y="330" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">教师（占参考模型的位置）</text><text x="776" y="350" text-anchor="middle" font-size="9.8" font-weight="500" fill="#B86E00" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">逐 token：“20” 处不认可</text><text x="340" y="414" text-anchor="middle" font-size="11" font-weight="600" fill="#C2501A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" style="paint-order:stroke;stroke-width:4px;stroke-linejoin:round" stroke="#ffffff">流程更简单，每个回合的信号也更稀疏</text><text x="770" y="414" text-anchor="middle" font-size="11" font-weight="600" fill="#0E6E7E" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" style="paint-order:stroke;stroke-width:4px;stroke-linejoin:round" stroke="#ffffff">把密集信号加回来</text></svg>
