="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">奖励模型</text><text x="122" y="225" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">critic</text><text x="122" y="275" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">参考模型</text><text x="340" y="66" text-anchor="middle" font-size="12" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">第 2 阶段：GRPO</text><text x="340" y="86" text-anchor="middle" font-size="11" font-weight="600" fill="#B83560" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">3 个模型</text><text x="340" y="125" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">策略</text><text x="340" y="175" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">奖励模型</text><text x="340" y="225" text-anchor="middle" font-size="11" font-weight="400" fill="#8A94A6" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">critic（去掉）</text><text x="340" y="275" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">参考模型</text><text x="558" y="66" text-anchor="middle" font-size="12" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">第 3 阶段：RLVR</text><text x="558" y="86" text-anchor="middle" font-size="11" font-weight="600" fill="#B83560" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">2 个模型 + 检查程序</text><text x="558" y="125" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">策略</text><text x="558" y="175" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">规则检查器（程序）</text><text x="558" y="225" text-anchor="middle" font-size="11" font-weight="400" fill="#8A94A6" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">critic（去掉）</text><text x="558" y="275" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">参考模型</text><text x="776" y="66" text-anchor="middle" font-size="12" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">第 5 阶段：在策略蒸馏</text><text x="776" y="86" text-anchor="middle" font-size="11" font-weight="600" fill="#0E6E7E" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">学生 + 教师</text><text x="776" y="125" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">学生（策略）</text><text x="776" y="175" text-anchor="middle" font-size="11" font-weight="400" fill="#8A94A6" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">不需要奖励</text><text x="776" y="225" text-anchor="middle" font-size="11" font-weight="400" fill="#8A94A6" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">critic（去掉）</text><text x="776" y="275" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">教师（占参考模型的位置）</text><text x="340" y="324" text-anchor="middle" font-size="11" font-weight="600" fill="#C2501A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" style="paint-order:stroke;stroke-width:4px;stroke-linejoin:round" stroke="#ffffff">流程更简单，每个回合的信号也更稀疏</text><text x="770" y="324" text-anchor="middle" font-size="11" font-weight="600" 