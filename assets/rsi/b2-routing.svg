<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 370" width="900" height="370" role="img" aria-label="技能选择与何时不用"><defs><marker id="ah-b2routing" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6577"/></marker></defs><rect x="0" y="0" width="900" height="370" fill="#ffffff"/><path d="M606,91 L613,91" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-b2routing)"/><path d="M746,91 L753,91" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-b2routing)"/><path d="M114,91 L131,91" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-b2routing)"/><path d="M284,91 L301,91" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-b2routing)"/><path d="M454,91 L473,91" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-b2routing)"/><path d="M379,128 L379,160" fill="none" stroke="#5A6577" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#ah-b2routing)"/><rect x="14" y="60" width="100" height="62" rx="5" fill="#E3EBFF" stroke="#2B57C9" stroke-width="1.5"/><rect x="134" y="54" width="150" height="74" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="304" y="54" width="150" height="74" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><rect x="476" y="60" width="130" height="62" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="616" y="60" width="130" height="62" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="756" y="60" width="130" height="62" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="304" y="162" width="150" height="50" rx="5" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1.5"/><rect x="14" y="286" width="210" height="72" rx="5" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.5"/><rect x="234" y="286" width="210" height="72" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="454" y="286" width="210" height="72" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><rect x="674" y="286" width="210" height="72" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><text x="14" y="22" text-anchor="start" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">例（示意）：请求是“把这份 PDF 里的表格转成 Excel”，技能库里有 40 个技能</text><text x="64" y="80.92" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">请求</text><text x="64" y="95.48" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">PDF 表格</text><text x="64" y="109.28" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">转 Excel</text><text x="209" y="75.055" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">估计任务范围</text><text x="209" y="89.115" text-anchor="middle" font-size="9.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">先走最小可行路径，</text><text x="209" y="102.225" text-anchor="middle" font-size="9.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">验证失败再扩大</text><text x="209" y="115.335" text-anchor="middle" font-size="9.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">例：先只转第 1 页</text><text x="379" y="75.055" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">路由</text><text x="379" y="89.115" text-anchor="middle" font-size="9.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">在技能库里挑，</text><text x="379" y="102.225" text-anchor="middle" font-size="9.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">也可以拒绝</text><text x="379" y="115.335" text-anchor="middle" font-size="9.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">例：挑中 pdf-table</text><text x="541" y="81.61" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">选中</text><text x="541" y="95.67" text-anchor="middle" font-size="9.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">挑对了没有</text><text x="541" y="108.78" text-anchor="middle" font-size="9.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">例：挑对了 ✓</text><text x="681" y="81.61" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">读懂</text><text x="681" y="95.67" text-anchor="middle" font-size="9.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">理解了没有</text><text x="681" y="108.78" text-anchor="middle" font-size="9.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">例：知道先识别表格 ✓</text><text x="821" y="81.61" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">执行</text><text x="821" y="95.67" text-anchor="middle" font-size="9.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">照着做了没有</text><text x="821" y="108.78" text-anchor="middle" font-size="9.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">例：跳过合并单元格 ✗</text><text x="680" y="44" text-anchor="middle" font-size="10.5" font-weight="500" fill="#5B45B0" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Demystifying Agent Skills：三种能力分开记录</text><text x="379" y="184.01" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">不用技能</text><text x="379" y="197.88" text-anchor="middle" font-size="9.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">例：只问“这页有几张表”</text><text x="379" y="230" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">库越大，误用代价越该算进去</text><text x="209" y="150" text-anchor="middle" font-size="9.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Do AI Agents Know When</text><text x="209" y="163" text-anchor="middle" font-size="9.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">a Task Is Simple?（E3）</text><text x="680" y="150" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">例子里的 ✓ ✗ 是示意</text><text x="14" y="274" text-anchor="start" font-size="12" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">路由信号放在哪里</text><text x="119" y="312.455" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">渐进展开</text><text x="119" y="326.325" text-anchor="middle" font-size="9.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">上下文只放名字和简介，用到才展开；一层就</text><text x="119" y="339.435" text-anchor="middle" font-size="9.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">够，第二层没帮上忙</text><text x="339" y="312.455" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">The Router Within</text><text x="339" y="326.325" text-anchor="middle" font-size="9.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">不放技能文本，读冻结模型中间层状态粗筛，</text><text x="339" y="339.435" text-anchor="middle" font-size="9.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">再逐个判定</text><text x="559" y="312.455" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">COBRA-Skills</text><text x="559" y="326.325" text-anchor="middle" font-size="9.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">优化阶段用上下文老虎机把评估预算分给有希</text><text x="559" y="339.435" text-anchor="middle" font-size="9.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">望的候选</text><text x="779" y="319.01" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Remember When It Matters</text><text x="779" y="332.88" text-anchor="middle" font-size="9.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">独立记忆 agent 决定提醒还是保持沉默</text></svg>
