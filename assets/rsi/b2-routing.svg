<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="900" height="340" role="img" aria-label="技能选择与何时不用"><defs><marker id="ah-b2routing" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6577"/></marker></defs><rect x="0" y="0" width="900" height="340" fill="#ffffff"/><path d="M592,85 L613,85" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-b2routing)"/><path d="M732,85 L753,85" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-b2routing)"/><path d="M114,85 L137,85" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-b2routing)"/><path d="M280,85 L303,85" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-b2routing)"/><path d="M446,85 L473,85" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-b2routing)"/><path d="M376,116 L376,150" fill="none" stroke="#5A6577" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#ah-b2routing)"/><rect x="14" y="60" width="100" height="50" rx="5" fill="#E3EBFF" stroke="#2B57C9" stroke-width="1.5"/><rect x="140" y="54" width="140" height="62" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="306" y="54" width="140" height="62" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><rect x="476" y="60" width="116" height="50" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="616" y="60" width="116" height="50" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="756" y="60" width="116" height="50" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="316" y="152" width="120" height="40" rx="5" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1.5"/><rect x="14" y="256" width="210" height="72" rx="5" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.5"/><rect x="234" y="256" width="210" height="72" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="454" y="256" width="210" height="72" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><rect x="674" y="256" width="210" height="72" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><text x="64" y="88.72" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">请求</text><text x="210" y="75.61" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">估计任务范围</text><text x="210" y="89.67" text-anchor="middle" font-size="9.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">先走最小可行路径，验证失败</text><text x="210" y="102.78" text-anchor="middle" font-size="9.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">再扩大</text><text x="376" y="81.82" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">路由</text><text x="376" y="96.38" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">在技能库里挑，也可以拒绝</text><text x="534" y="81.82" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">选中</text><text x="534" y="96.38" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">挑对了没有</text><text x="674" y="81.82" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">读懂</text><text x="674" y="96.38" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">理解了没有</text><text x="814" y="81.82" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">执行</text><text x="814" y="96.38" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">照着做了没有</text><text x="650" y="36" text-anchor="middle" font-size="10.5" font-weight="500" fill="#5B45B0" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Demystifying Agent Skills：三种能力分开记录</text><text x="376" y="175.565" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">不用技能</text><text x="376" y="210" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">库越大，误用代价越该算进去</text><text x="210" y="138" text-anchor="middle" font-size="9.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Do AI Agents Know When</text><text x="210" y="151" text-anchor="middle" font-size="9.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">a Task Is Simple?（E3）</text><text x="14" y="244" text-anchor="start" font-size="12" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">路由信号放在哪里</text><text x="119" y="282.455" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">渐进展开</text><text x="119" y="296.325" text-anchor="middle" font-size="9.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">上下文只放名字和简介，用到才展开；一层就</text><text x="119" y="309.435" text-anchor="middle" font-size="9.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">够，第二层没帮上忙</text><text x="339" y="282.455" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">The Router Within</text><text x="339" y="296.325" text-anchor="middle" font-size="9.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">不放技能文本，读冻结模型中间层状态粗筛，</text><text x="339" y="309.435" text-anchor="middle" font-size="9.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">再逐个判定</text><text x="559" y="282.455" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">COBRA-Skills</text><text x="559" y="296.325" text-anchor="middle" font-size="9.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">优化阶段用上下文老虎机把评估预算分给有希</text><text x="559" y="309.435" text-anchor="middle" font-size="9.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">望的候选</text><text x="779" y="289.01" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Remember When It Matters</text><text x="779" y="302.88" text-anchor="middle" font-size="9.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">独立记忆 agent 决定提醒还是保持沉默</text></svg>
