" stroke-width="1.5"/><rect x="314" y="46" width="128" height="60" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="464" y="46" width="128" height="60" rx="5" fill="#FDE8DD" stroke="#C2501A" stroke-width="1.5"/><rect x="14" y="120" width="128" height="64" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="164" y="120" width="128" height="64" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><rect x="314" y="120" width="128" height="64" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="464" y="120" width="128" height="64" rx="5" fill="#E9EDF3" stroke="#47546A" stroke-width="1.5"/><rect x="14" y="262" width="154" height="62" rx="5" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.5"/><rect x="190" y="262" width="154" height="62" rx="5" fill="#E9EDF3" stroke="#47546A" stroke-width="1.5"/><rect x="366" y="262" width="154" height="62" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="542" y="262" width="154" height="62" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="718" y="262" width="154" height="62" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><text x="14" y="14" text-anchor="start" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">例（示意）：技能“算平均分”，用同一批 20 张事先算好答案的成绩表来量</text><text x="700" y="80" text-anchor="start" font-size="12.5" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">SkillProx</text><text x="700" y="98" text-anchor="start" font-size="11" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">前向改、后向删</text><text x="78" y="66.455" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">诊断</text><text x="78" y="80.325" text-anchor="middle" font-size="9.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">失败原因</text><text x="78" y="93.435" text-anchor="middle" font-size="9.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">例：缺考记成 0 分</text><text x="228" y="66.455" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">修改技能</text><text x="228" y="80.325" text-anchor="middle" font-size="9.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">例：加一步</text><text x="228" y="93.435" text-anchor="middle" font-size="9.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">缺考留空</text><text x="378" y="66.455" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">同一批任务重放</text><text x="378" y="80.325" text-anchor="middle" font-size="9.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">例：20 张表</text><text x="378" y="93.435" text-anchor="middle" font-size="9.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">17 → 19 张算对</text><text x="528" y="66.455" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">退化就回滚</text><text x="528" y="80.325" text-anchor="middle" font-size="9.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">例：若掉到 16</text><text x="528" y="93.435" text-anchor="middle" font-size="9.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">就撤回这次修改</text><text x="300" y="32" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" style="paint-order:stroke;stroke-width:4px;stroke-linejoin:round" stroke="#ffffff">量到的结果喂给下一轮诊断</text><text x="690" y="118" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" style="paint-order:stroke;stroke-width:4px;stroke-linejoin:round" stroke="#ffffff">前向做完</text><text x="78" y="142.3" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">验证门</text><text x="78" y="155.98" text-anchor="middle" font-size="9.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">过了才生效</text><text x="78" y="169.09" text-anchor="middle" font-size="9.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">例：仍是 19 张 ✓</text><text x="228" y="142.3" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">合并 / 降级 / 删除</text><text x="228" y="155.98" text-anchor="middle" font-size="9.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">例：删掉</text><text x="228" y="169.09" text-anchor="middle" font-size="9.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">“读第三列”</text><text x="378" y="135.745" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">留一审计</text><text x="378" y="149.425" text-anchor="middle" font-size="9.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">拿掉它效用变多少</text><text x="378" y="162.535" text-anchor="middle" font-size="9.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">例：删“读第三列”</text><text x="378" y="175.645" text-anchor="middle" font-size="9.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">仍是 19 张</text><text x="528" y="142.3" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">拆成知识单元</text><text x="528" y="155.98" text-anchor="middle" font-size="9.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">例：技能里</text><text x="528" y="169.09" text-anchor="middle" font-size="9.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">共 6 条规则</text><text x="14" y="206" text-anchor="start" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">删除成了一套单独的机制；代价是逐单元审计很贵，罕见场景里的规则可能被误删。分数来自对照事先算好的答案，这把尺子不学习</text><text x="14" y="248" text-anchor="start" font-size="12.5" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">SkillCommit：先在一个病例上见效，再慢慢推广</text><text x="91" y="283.455" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">实例补丁</text><text x="91" y="297.325" text-anchor="middle" font-size="9.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">只管这一次</text><text x="91" y="310.435" text-anchor="middle" font-size="9.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">例：这张表缺考留空</text><text x="267" y="283.455" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">检索相关技能</text><text x="267" y="297.325" text-anchor="middle" font-size="9.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">向量相似找候选</text><text x="267" y="310.435" text-anchor="middle" font-size="9.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">例：算最高分、及格率</text><text x="443" y="283.455" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">跨实例重放</text><text x="443" y="297.325" text-anchor="middle" font-size="9.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">换个案例还管用吗</text><text x="443" y="310.435" text-anchor="middle" font-size="9.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">例：另 5 张表都对</text><text x="619" y="283.455" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">机制检查</text><text x="619" y="297.325" text-anchor="middle" font-size="9.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">背后是同一机制吗</text><text x="619" y="310.435" text-anchor="middle" font-size="9.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">例：都是缺考处理</text><text x="795" y="283.455" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">提交上层技能</text><text x="795" y="297.325" text-anchor="middle" font-size="9.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">不破坏每个成员</text><text x="795" y="310.435" text-anchor="middle" font-size="9.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">例：统计前先处理缺考</text><text x="14" y="352" text-anchor="start" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">SkillGLoW 把局部技能聚成共享解题程序的“家族”；GraphSkillEvo 把技能写成节点加条件转移的图再做演化。</text><text x="14" y="374" text-anchor="start" font-size="10.5" font-weight="600" fill="#B83560" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">共同立场：两段文字读起来相似，不足以成为合并的理由。</text></svg>
