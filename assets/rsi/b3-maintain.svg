<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350" width="900" height="350" role="img" aria-label="技能维护：改、删、扩"><defs><marker id="ah-b3maintain" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6577"/></marker></defs><rect x="0" y="0" width="900" height="350" fill="#ffffff"/><path d="M142,64 L161,64" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-b3maintain)"/><path d="M292,64 L311,64" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-b3maintain)"/><path d="M442,64 L461,64" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-b3maintain)"/><path d="M526,40 L526,30 L78,30 L78,37" fill="none" stroke="#5A6577" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#ah-b3maintain)"/><path d="M606,64 L640,64 L640,124 L606,124" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-b3maintain)"/><path d="M161,124 L145,124" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-b3maintain)"/><path d="M311,124 L295,124" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-b3maintain)"/><path d="M461,124 L445,124" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-b3maintain)"/><line x1="14" y1="188" x2="886" y2="188" stroke="#D5DBE4" stroke-width="1"/><path d="M168,254 L187,254" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-b3maintain)"/><path d="M344,254 L363,254" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-b3maintain)"/><path d="M520,254 L539,254" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-b3maintain)"/><path d="M696,254 L715,254" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-b3maintain)"/><rect x="14" y="40" width="128" height="48" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><rect x="164" y="40" width="128" height="48" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><rect x="314" y="40" width="128" height="48" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="464" y="40" width="128" height="48" rx="5" fill="#FDE8DD" stroke="#C2501A" stroke-width="1.5"/><rect x="14" y="100" width="128" height="48" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="164" y="100" width="128" height="48" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><rect x="314" y="100" width="128" height="48" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="464" y="100" width="128" height="48" rx="5" fill="#E9EDF3" stroke="#47546A" stroke-width="1.5"/><rect x="14" y="228" width="154" height="52" rx="5" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.5"/><rect x="190" y="228" width="154" height="52" rx="5" fill="#E9EDF3" stroke="#47546A" stroke-width="1.5"/><rect x="366" y="228" width="154" height="52" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="542" y="228" width="154" height="52" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="718" y="228" width="154" height="52" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><text x="700" y="60" text-anchor="start" font-size="12.5" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">SkillProx</text><text x="700" y="78" text-anchor="start" font-size="11" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">前向改、后向删</text><text x="78" y="60.665" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">诊断</text><text x="78" y="75.035" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">失败原因</text><text x="228" y="67.565" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">修改技能</text><text x="378" y="67.565" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">同一批任务重放</text><text x="528" y="67.565" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">退化就回滚</text><text x="300" y="26" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" style="paint-order:stroke;stroke-width:4px;stroke-linejoin:round" stroke="#ffffff">量到的结果喂给下一轮诊断</text><text x="690" y="98" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" style="paint-order:stroke;stroke-width:4px;stroke-linejoin:round" stroke="#ffffff">前向做完</text><text x="78" y="120.51" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">验证门</text><text x="78" y="134.69" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">过了才生效</text><text x="228" y="127.41" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">合并 / 降级 / 删除</text><text x="378" y="120.51" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">留一审计</text><text x="378" y="134.69" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">拿掉它效用变多少</text><text x="528" y="127.41" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">拆成知识单元</text><text x="14" y="172" text-anchor="start" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">删除成了一套单独的机制；代价是逐单元审计很贵，罕见场景里的规则可能被误删</text><text x="14" y="214" text-anchor="start" font-size="12.5" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">SkillCommit：先在一个病例上见效，再慢慢推广</text><text x="91" y="250.665" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">实例补丁</text><text x="91" y="265.035" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">只管这一次</text><text x="267" y="250.665" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">检索相关技能</text><text x="267" y="265.035" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">向量相似找候选</text><text x="443" y="250.665" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">跨实例重放</text><text x="443" y="265.035" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">换个案例还管用吗</text><text x="619" y="250.665" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">机制检查</text><text x="619" y="265.035" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">背后是同一机制吗</text><text x="795" y="250.665" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">提交上层技能</text><text x="795" y="265.035" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">不破坏每个成员</text><text x="14" y="310" text-anchor="start" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">SkillGLoW 把局部技能聚成共享解题程序的“家族”；GraphSkillEvo 把技能写成节点加条件转移的图再做演化。</text><text x="14" y="330" text-anchor="start" font-size="10.5" font-weight="600" fill="#B83560" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">共同立场：两段文字读起来相似，不足以成为合并的理由。</text></svg>
