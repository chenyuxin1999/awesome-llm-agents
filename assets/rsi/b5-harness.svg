erif">RRSI：限制每个候选能打包的修改数，预算随时间收紧，再批判与剪枝</text><text x="46" y="349.5" text-anchor="middle" font-size="9.5" font-weight="600" fill="#B83560" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">提议修改</text><text x="88" y="350" text-anchor="start" font-size="10.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">DREvo：先核对旧经验对当前版本是否还成立，再提炼成搜索方向</text><text x="46" y="368.5" text-anchor="middle" font-size="9.5" font-weight="600" fill="#26805A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">验证</text><text x="88" y="369" text-anchor="start" font-size="10.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">TTHE：测试时用执行衍生的代理信号挑版本，不需要标签</text><text x="46" y="387.5" text-anchor="middle" font-size="9.5" font-weight="600" fill="#47546A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">提交</text><text x="88" y="388" text-anchor="start" font-size="10.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Procedural Graphs：留出集上不变差才提交，被拒的修改也记下来</text></svg>
