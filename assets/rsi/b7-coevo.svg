ke-width="1.5"/><rect x="680" y="42" width="150" height="72" rx="6" fill="#F3F5F8" stroke="#D5DBE4" stroke-width="1"/><rect x="690" y="50" width="130" height="26" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="690" y="82" width="130" height="26" rx="5" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1.5"/><rect x="14" y="238" width="150" height="50" rx="5" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.5"/><rect x="194" y="238" width="250" height="50" rx="5" fill="#FDE8DD" stroke="#C2501A" stroke-width="1.5"/><rect x="470" y="238" width="130" height="50" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="624" y="238" width="120" height="50" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="768" y="238" width="118" height="50" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><text x="14" y="26" text-anchor="start" font-size="12.5" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">WHALE：交替优化两侧</text><text x="89" y="66.41" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">模型 m1</text><text x="89" y="98.41" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">harness h1</text><text x="311" y="66.41" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">模型 m2</text><text x="311" y="98.41" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">harness h1</text><text x="200" y="132" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">在当前 harness 下训模型</text><text x="200" y="146" text-anchor="middle" font-size="10" font-weight="600" fill="#B83560" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">信号：自己做对的轨迹</text><text x="200" y="160" text-anchor="middle" font-size="10" font-weight="600" fill="#B83560" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">目标：更常做对</text><text x="533" y="66.41" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">模型 m2</text><text x="533" y="98.41" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">harness h2</text><text x="422" y="132" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">为新模型搜 harness</text><text x="422" y="146" text-anchor="middle" font-size="10" font-weight="600" fill="#B83560" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">这一步不训练</text><text x="422" y="160" text-anchor="middle" font-size="10" font-weight="600" fill="#B83560" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Meta-Harness 搜代码</text><text x="755" y="66.41" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">模型 m3</text><text x="755" y="98.41" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">harness h2</text><text x="644" y="132" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">再训模型</text><text x="644" y="146" text-anchor="middle" font-size="10" font-weight="600" fill="#B83560" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">信号同第一步</text><text x="14" y="182" text-anchor="start" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">何时切换：固定时长，或按训练信号的自适应耐心规则；小步交替比先训完再搜更好</text><text x="14" y="224" text-anchor="start" font-size="12.5" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Co-Evolving Harnesses and Models：同样请强模型帮忙，两种帮法</text><text x="89" y="259.82" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">模仿专家</text><text x="89" y="274.38" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">信号：专家完整轨迹当标签</text><text x="319" y="259.51" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">弱模型学了规划却执行不了</text><text x="319" y="273.69" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">和为它演化的 harness 不再匹配</text><text x="319" y="308" text-anchor="middle" font-size="10.5" font-weight="600" fill="#C2501A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">七个企业任务全部退化 4 到 30 分</text><text x="535" y="259.82" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">弱模型自己的轨迹</text><text x="535" y="274.38" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">这一步不训练</text><text x="684" y="259.82" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">定位出错回合</text><text x="684" y="274.38" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">这一步不训练</text><text x="827" y="259.855" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">专家只改这一回合</text><text x="827" y="273.535" text-anchor="middle" font-size="9.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">改过的轨迹当标签微调</text><text x="678" y="308" text-anchor="middle" font-size="10.5" font-weight="600" fill="#26805A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">保留弱模型原有的规划风格，两边的收益叠起来</text><text x="450" y="350" text-anchor="middle" font-size="11" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">教师更强，不代表教师的整套方法更适合学生：模型和 harness 的相容性要单独测量</text></svg>
