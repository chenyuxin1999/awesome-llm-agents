<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350" width="900" height="350" role="img" aria-label="递归改进的三块边界"><defs><marker id="ah-b8control" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6577"/></marker></defs><rect x="0" y="0" width="900" height="350" fill="#ffffff"/><rect x="14" y="36" width="560" height="300" rx="6" fill="#F3F5F8" stroke="#D5DBE4" stroke-width="1.2" stroke-dasharray="5 4"/><rect x="30" y="72" width="250" height="160" rx="5" fill="#E3EBFF" stroke="#2B57C9" stroke-width="1.5"/><rect x="310" y="72" width="250" height="160" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><path d="M330,136 L263,128" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-b8control)"/><path d="M560,284 L631,284" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-b8control)"/><rect x="50" y="108" width="210" height="40" rx="5" fill="#E9EDF3" stroke="#47546A" stroke-width="1.5"/><rect x="50" y="168" width="210" height="46" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="330" y="108" width="210" height="56" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><rect x="30" y="252" width="530" height="64" rx="5" fill="#E9EDF3" stroke="#47546A" stroke-width="1.5"/><rect x="614" y="36" width="272" height="300" rx="6" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="634" y="76" width="232" height="50" rx="5" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1.5"/><rect x="634" y="138" width="232" height="50" rx="5" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1.5"/><rect x="634" y="200" width="232" height="50" rx="5" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1.5"/><rect x="634" y="262" width="232" height="50" rx="5" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1.5"/><text x="26" y="58" text-anchor="start" font-size="12" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">系统可以改的范围</text><text x="155" y="94" text-anchor="middle" font-size="12" font-weight="700" fill="#2B57C9" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">任务执行</text><text x="155" y="124.82" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">任务技能</text><text x="155" y="139.38" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">快时间尺度更新</text><text x="155" y="187.82" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">冻结的共享模型</text><text x="155" y="202.38" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">五个流水线角色共用</text><text x="435" y="94" text-anchor="middle" font-size="12" font-weight="700" fill="#B83560" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">改进生成</text><text x="435" y="126.61" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">元技能</text><text x="435" y="140.67" text-anchor="middle" font-size="9.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">分析、检索、分配、提议、演化</text><text x="435" y="153.78" text-anchor="middle" font-size="9.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">慢时间尺度更新</text><text x="435" y="190" text-anchor="middle" font-size="10.5" font-weight="600" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">MetaSkill-Evolve：</text><text x="435" y="206" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">同一条流水线用在自己身上</text><text x="296" y="124" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" style="paint-order:stroke;stroke-width:4px;stroke-linejoin:round" stroke="#ffffff">改</text><text x="295" y="280.82" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">只在副本里改</text><text x="295" y="295.38" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">保留每次差异，在隔离环境里测试；SafeEvolve 的修改也做成有边界、可审计、可回滚</text><text x="750" y="58" text-anchor="middle" font-size="12" font-weight="700" fill="#26805A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">独立验收（系统写不进来）</text><text x="750" y="97.82" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">评分器</text><text x="750" y="112.38" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">谁掌握评分标准</text><text x="750" y="159.82" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">审计日志</text><text x="750" y="174.38" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">由 agent 之外的机制记录</text><text x="750" y="221.82" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">权限</text><text x="750" y="236.38" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">能动什么、不能动什么</text><text x="750" y="283.82" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">回滚</text><text x="750" y="298.38" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">出了问题能退回</text><text x="596" y="276" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" style="paint-order:stroke;stroke-width:4px;stroke-linejoin:round" stroke="#ffffff">提交</text><text x="750" y="330" text-anchor="middle" font-size="9.5" font-weight="500" fill="#C2501A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">LLM Agents Can Easily Tamper With Their Own Traces</text><text x="14" y="24" text-anchor="start" font-size="11.5" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">考生不该同时保管自己的答卷和阅卷记录</text></svg>
