<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360" role="img" aria-label="自我改进循环在哪里断掉"><defs><marker id="ah-boundary" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6577"/></marker></defs><rect x="0" y="0" width="900" height="360" fill="#ffffff"/><path d="M170,165 L257,165" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-boundary)"/><path d="M390,165 L477,165" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-boundary)"/><path d="M610,165 L697,165" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-boundary)"/><path d="M780,190 L780,222 L105,222 L105,193" fill="none" stroke="#5A6577" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#ah-boundary)"/><path d="M325,104 L325,137" fill="none" stroke="#C2501A" stroke-width="1.4" stroke-dasharray="3 3" marker-end="url(#ah-boundary)"/><path d="M590,104 L360,137" fill="none" stroke="#C2501A" stroke-width="1.4" stroke-dasharray="3 3" marker-end="url(#ah-boundary)"/><path d="M545,250 L545,193" fill="none" stroke="#C2501A" stroke-width="1.4" stroke-dasharray="3 3" marker-end="url(#ah-boundary)"/><path d="M830,250 L830,193" fill="none" stroke="#C2501A" stroke-width="1.4" stroke-dasharray="3 3" marker-end="url(#ah-boundary)"/><path d="M104,104 L104,137" fill="none" stroke="#C2501A" stroke-width="1.4" stroke-dasharray="3 3" marker-end="url(#ah-boundary)"/><rect x="40" y="140" width="130" height="50" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="260" y="140" width="130" height="50" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="480" y="140" width="130" height="50" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><rect x="700" y="140" width="160" height="50" rx="5" fill="#E9EDF3" stroke="#47546A" stroke-width="1.5"/><rect x="200" y="30" width="250" height="74" rx="5" fill="#FDE8DD" stroke="#C2501A" stroke-width="1.5"/><rect x="470" y="30" width="240" height="74" rx="5" fill="#FDE8DD" stroke="#C2501A" stroke-width="1.5"/><rect x="350" y="250" width="270" height="74" rx="5" fill="#FDE8DD" stroke="#C2501A" stroke-width="1.5"/><rect x="640" y="250" width="250" height="74" rx="5" fill="#FDE8DD" stroke="#C2501A" stroke-width="1.5"/><rect x="20" y="30" width="168" height="74" rx="5" fill="#FDE8DD" stroke="#C2501A" stroke-width="1.5"/><rect x="20" y="250" width="320" height="74" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><text x="105" y="161.82" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">生成</text><text x="105" y="176.38" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">答案、代码、数据</text><text x="325" y="161.82" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">自己检查</text><text x="325" y="176.38" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">没有外部反馈</text><text x="545" y="161.82" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">修改 / 训练</text><text x="545" y="176.38" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">写回自身</text><text x="780" y="161.82" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">下一代系统</text><text x="780" y="176.38" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">记忆、工具、流程、权重</text><text x="440" y="216" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" style="paint-order:stroke;stroke-width:4px;stroke-linejoin:round" stroke="#ffffff">循环</text><text x="325" y="63.51" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Cannot Self-Correct（2023）</text><text x="325" y="77.69" text-anchor="middle" font-size="10" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">无外部反馈时，自我纠错后推理准确率常常不升反降</text><text x="590" y="63.51" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Mind the Gap（2024）</text><text x="590" y="77.69" text-anchor="middle" font-size="10" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">验证比生成强多少，决定自我改进最多能走多远</text><text x="485" y="283.51" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">The Curse of Recursion（2023）</text><text x="485" y="297.69" text-anchor="middle" font-size="10" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">反复用自己生成的数据训练，分布尾部消失，模型坍缩</text><text x="765" y="283.51" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Your Agent May Misevolve（2025）</text><text x="765" y="297.69" text-anchor="middle" font-size="10" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">积累记忆、造工具、改流程时，安全悄悄退化</text><text x="104" y="63.51" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">RE-Bench（2024）</text><text x="104" y="77.69" text-anchor="middle" font-size="10" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">预算一拉长，人类专家后来居上</text><text x="180" y="276.61" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Lilian Weng 的处方</text><text x="180" y="290.79" text-anchor="middle" font-size="10" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">评价器和权限放在循环之外，由独立的一方掌握；人不退出，往上走</text><text x="180" y="304.59" text-anchor="middle" font-size="10" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">一层去设目标、做最终判断</text></svg>
