<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 136" width="560" height="136" role="img" aria-label="PostTrainBench 结构"><defs><marker id="ah-cardr3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6577"/></marker></defs><rect x="0" y="0" width="560" height="136" fill="#ffffff"/><path d="M174,58 L197,58" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-cardr3)"/><path d="M360,58 L383,58" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-cardr3)"/><rect x="14" y="34" width="160" height="48" rx="5" fill="#E3EBFF" stroke="#2B57C9" stroke-width="1.5"/><rect x="200" y="34" width="160" height="48" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="386" y="34" width="160" height="48" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><text x="94" y="54.665" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">基座模型 + 目标基准</text><text x="94" y="69.035" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">10 小时单卡 H100</text><text x="280" y="54.665" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">agent 自主后训练</text><text x="280" y="69.035" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">搜资料、造数据、做实验</text><text x="466" y="54.665" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">测分</text><text x="466" y="69.035" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">和官方指令模型比</text><text x="280" y="126" text-anchor="middle" font-size="10.5" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">测 agent 能不能独立完成后训练；也记录到拿测试集训练等违规</text></svg>
