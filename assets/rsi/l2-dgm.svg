<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" role="img" aria-label="Darwin Gödel Machine 的一轮"><defs><marker id="ah-l2dgm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6577"/></marker></defs><rect x="0" y="0" width="900" height="330" fill="#ffffff"/><rect x="10" y="40" width="230" height="250" rx="5" fill="#E9EDF3" stroke="#47546A" stroke-width="1.5"/><line x1="125" y1="100" x2="70" y2="160" stroke="#47546A" stroke-width="1.2"/><line x1="125" y1="100" x2="180" y2="160" stroke="#47546A" stroke-width="1.2"/><line x1="70" y1="160" x2="45" y2="225" stroke="#47546A" stroke-width="1.2"/><line x1="180" y1="160" x2="110" y2="225" stroke="#47546A" stroke-width="1.2"/><line x1="180" y1="160" x2="180" y2="225" stroke="#47546A" stroke-width="1.2"/><path d="M240,78 L277,78" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-l2dgm)"/><path d="M470,78 L507,78" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-l2dgm)"/><path d="M700,78 L737,78" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-l2dgm)"/><path d="M815,106 L815,147" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-l2dgm)"/><path d="M740,178 L703,178" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-l2dgm)"/><path d="M510,178 L473,178" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-l2dgm)"/><path d="M280,178 L243,178" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-l2dgm)"/><path d="M605,206 L605,236" fill="none" stroke="#5A6577" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#ah-l2dgm)"/><circle cx="125" cy="100" r="16" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1.5"/><circle cx="70" cy="160" r="16" fill="#FDE8DD" stroke="#C2501A" stroke-width="1.5"/><circle cx="180" cy="160" r="16" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1.5"/><circle cx="45" cy="225" r="16" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1.5"/><circle cx="110" cy="225" r="16" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1.5"/><circle cx="180" cy="225" r="16" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="280" y="50" width="190" height="56" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><rect x="510" y="50" width="190" height="56" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="740" y="50" width="150" height="56" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><rect x="740" y="150" width="150" height="56" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="510" y="150" width="190" height="56" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="280" y="150" width="190" height="56" rx="5" fill="#E9EDF3" stroke="#47546A" stroke-width="1.5"/><rect x="280" y="270" width="610" height="44" rx="5" fill="#F3F5F8" stroke="#D5DBE4" stroke-width="1"/><text x="125" y="62" text-anchor="middle" font-size="12" font-weight="700" fill="#47546A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">档案库：所有版本都留着</text><text x="125" y="104" text-anchor="middle" font-size="10" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">v0</text><text x="70" y="164" text-anchor="middle" font-size="10" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">v1</text><text x="180" y="164" text-anchor="middle" font-size="10" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">v2</text><text x="45" y="229" text-anchor="middle" font-size="10" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">v3</text><text x="110" y="229" text-anchor="middle" font-size="10" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">v4</text><text x="180" y="229" text-anchor="middle" font-size="10" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">v5</text><text x="70" y="136" text-anchor="middle" font-size="9.5" font-weight="400" fill="#C2501A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">分数低</text><text x="120" y="262" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">低分版本的后代也可能更强</text><text x="375" y="74.82" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">选一个父代</text><text x="375" y="89.38" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">分数越高、子代越少越容易被选</text><text x="605" y="74.82" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">读自己的评测日志</text><text x="605" y="89.38" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">提出下一项要实现的改进</text><text x="815" y="74.82" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">改自己的代码</text><text x="815" y="89.38" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">例如更细的编辑工具</text><text x="815" y="174.82" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">编程基准评测</text><text x="815" y="189.38" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">SWE-bench、Polyglot</text><text x="605" y="173.975" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">能编译，并且</text><text x="605" y="189.345" text-anchor="middle" font-size="11" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">仍然会改代码吗？</text><text x="375" y="174.82" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">入档</text><text x="375" y="189.38" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">分数暂时更低也保留</text><text x="491" y="170" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" style="paint-order:stroke;stroke-width:4px;stroke-linejoin:round" stroke="#ffffff">是</text><text x="605" y="252" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">否：丢弃</text><text x="300" y="297" text-anchor="start" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">论文报告：SWE-bench 20.0% → 50.0%，Polyglot 14.2% → 30.7%</text><text x="280" y="26" text-anchor="start" font-size="12" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">不只盯着当前最优：开放式档案让暂时落后的分支也有机会长出好后代</text></svg>
