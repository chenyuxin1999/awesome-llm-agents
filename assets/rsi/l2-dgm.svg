="45" cy="225" r="16" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1.5"/><circle cx="110" cy="225" r="16" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1.5"/><circle cx="180" cy="225" r="16" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="280" y="44" width="190" height="68" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><rect x="510" y="44" width="190" height="68" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="740" y="44" width="150" height="68" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><rect x="740" y="146" width="150" height="68" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="510" y="146" width="190" height="68" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="280" y="146" width="190" height="68" rx="5" fill="#E9EDF3" stroke="#47546A" stroke-width="1.5"/><rect x="280" y="272" width="610" height="56" rx="5" fill="#F3F5F8" stroke="#D5DBE4" stroke-width="1"/><text x="125" y="62" text-anchor="middle" font-size="12" font-weight="700" fill="#47546A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">档案库：所有版本都留着</text><text x="125" y="104" text-anchor="middle" font-size="10" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">v0</text><text x="70" y="164" text-anchor="middle" font-size="10" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">v1</text><text x="180" y="164" text-anchor="middle" font-size="10" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">v2</text><text x="45" y="229" text-anchor="middle" font-size="10" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">v3</text><text x="110" y="229" text-anchor="middle" font-size="10" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">v4</text><text x="180" y="229" text-anchor="middle" font-size="10" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">v5</text><text x="70" y="136" text-anchor="middle" font-size="9.5" font-weight="400" fill="#C2501A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">分数低</text><text x="120" y="262" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">低分版本的后代也可能更强</text><text x="375" y="67.92" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">选一个父代</text><text x="375" y="82.48" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">例：选中 v2</text><text x="375" y="96.28" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">（0.31 分，只有 2 个子代）</text><text x="605" y="74.82" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">读自己的评测日志</text><text x="605" y="89.38" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">例：“改大文件时常把整段覆盖掉”</text><text x="815" y="67.92" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">改自己的代码</text><text x="815" y="82.48" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">例：加一个按行号</text><text x="815" y="96.28" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">替换的编辑工具</text><text x="815" y="169.92" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">编程基准评测</text><text x="815" y="184.48" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">测试脚本判对错：</text><text x="815" y="198.28" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">0.31 → 0.35</text><text x="605" y="176.51" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">能编译，并且仍然会改代码吗？</text><text x="605" y="190.69" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">例：能编译 ✓ 还能提交补丁 ✓</text><text x="375" y="176.82" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">入档</text><text x="375" y="191.38" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">存为 v6，挂在 v2 下；分数低也保留</text><text x="491" y="172" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" style="paint-order:stroke;stroke-width:4px;stroke-linejoin:round" stroke="#ffffff">是</text><text x="605" y="256" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">否：丢弃</text><text x="300" y="294" text-anchor="start" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">论文报告：SWE-bench 20.0% → 50.0%，Polyglot 14.2% → 30.7%</text><text x="300" y="316" text-anchor="start" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">图中 v2、v6 和 0.31、0.35 这些例子是示意；分数由基准自带的测试脚本判定</text><text x="280" y="26" text-anchor="start" font-size="12" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">不只盯着当前最优：开放式档案让暂时落后的分支也有机会长出好后代</text></svg>
