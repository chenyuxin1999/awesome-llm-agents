<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300" role="img" aria-label="STOP：把改进器交给它自己改"><defs><marker id="ah-l3stop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6577"/></marker></defs><rect x="0" y="0" width="880" height="300" fill="#ffffff"/><path d="M170,72 L217,72" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-l3stop)"/><path d="M350,72 L397,72" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-l3stop)"/><path d="M530,72 L617,72" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-l3stop)"/><path d="M170,184 L217,184" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-l3stop)"/><path d="M350,184 L397,184" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-l3stop)"/><path d="M530,184 L617,184" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-l3stop)"/><path d="M695,156 L695,104" fill="none" stroke="#5A6577" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#ah-l3stop)"/><rect x="20" y="44" width="150" height="56" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><rect x="220" y="44" width="130" height="56" rx="5" fill="#E9EDF3" stroke="#47546A" stroke-width="1.5"/><rect x="400" y="44" width="130" height="56" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="620" y="44" width="150" height="56" rx="5" fill="#E9EDF3" stroke="#47546A" stroke-width="1.5"/><rect x="20" y="156" width="150" height="56" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><rect x="220" y="156" width="130" height="56" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><rect x="400" y="156" width="130" height="56" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="620" y="156" width="150" height="56" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><rect x="20" y="236" width="845" height="52" rx="5" fill="#F3F5F8" stroke="#D5DBE4" stroke-width="1"/><text x="16" y="28" text-anchor="start" font-size="12.5" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">第一步：改进器改进任意程序</text><text x="95" y="68.82" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">改进器 I</text><text x="95" y="83.38" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">一段调用语言模型的程序</text><text x="285" y="75.72" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">待改程序 P</text><text x="465" y="68.82" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">效用函数 u</text><text x="465" y="83.38" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">给程序打分</text><text x="695" y="75.72" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">更好的 P′</text><text x="574" y="92" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" style="paint-order:stroke;stroke-width:4px;stroke-linejoin:round" stroke="#ffffff">多次询问 LM，留最好的</text><text x="16" y="140" text-anchor="start" font-size="12.5" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">第二步：把改进器自己当作待改程序</text><text x="95" y="187.72" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">改进器 I</text><text x="285" y="187.565" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">待改程序 = I</text><text x="465" y="181.165" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">元效用</text><text x="465" y="195.225" text-anchor="middle" font-size="9.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">改进器在下游任务上的表现</text><text x="695" y="180.82" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">改进器 I′</text><text x="695" y="195.38" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">改别的程序改得更好</text><text x="745" y="134" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" style="paint-order:stroke;stroke-width:4px;stroke-linejoin:round" stroke="#ffffff">I′ 再去改程序</text><text x="34" y="257" text-anchor="start" font-size="11" font-weight="500" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">GPT-4 自己写出了束搜索、遗传算法、模拟退火等策略；换成较弱的模型，这个循环转不起来。</text><text x="34" y="277" text-anchor="start" font-size="11" font-weight="500" fill="#C2501A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">语言模型参数始终没变，作者明说这不是完整的递归自我改进；模型偶尔还会试图关掉沙盒限制。</text></svg>
