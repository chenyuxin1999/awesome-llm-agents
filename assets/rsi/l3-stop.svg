<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 352" width="880" height="352" role="img" aria-label="STOP：把改进器交给它自己改"><defs><marker id="ah-l3stop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6577"/></marker></defs><rect x="0" y="0" width="880" height="352" fill="#ffffff"/><path d="M190,100 L237,100" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-l3stop)"/><path d="M390,100 L437,100" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-l3stop)"/><path d="M590,100 L637,100" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-l3stop)"/><path d="M190,224 L237,224" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-l3stop)"/><path d="M390,224 L437,224" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-l3stop)"/><path d="M590,224 L637,224" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-l3stop)"/><path d="M725,188 L725,140" fill="none" stroke="#5A6577" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#ah-l3stop)"/><rect x="20" y="64" width="170" height="72" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><rect x="240" y="64" width="150" height="72" rx="5" fill="#E9EDF3" stroke="#47546A" stroke-width="1.5"/><rect x="440" y="64" width="150" height="72" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="640" y="64" width="170" height="72" rx="5" fill="#E9EDF3" stroke="#47546A" stroke-width="1.5"/><rect x="20" y="188" width="170" height="72" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><rect x="240" y="188" width="150" height="72" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><rect x="440" y="188" width="150" height="72" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="640" y="188" width="170" height="72" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><rect x="20" y="280" width="845" height="60" rx="5" fill="#F3F5F8" stroke="#D5DBE4" stroke-width="1"/><text x="16" y="24" text-anchor="start" font-size="12.5" font-weight="700" fill="#B83560" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">目标：让负责改程序的那段程序，也能把自己改得更会改程序</text><text x="16" y="52" text-anchor="start" font-size="12" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">第一步：改进器去改一个普通程序（例：一段解题程序，示意）</text><text x="105" y="89.92" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">改进器</text><text x="105" y="104.48" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">一段程序：多次向</text><text x="105" y="118.28" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">语言模型要改写版本</text><text x="315" y="96.82" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">拿到几个改写版本</text><text x="315" y="111.38" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">例：解题程序的 4 种新写法</text><text x="515" y="89.92" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">逐个打分</text><text x="515" y="104.48" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">人给的打分函数：</text><text x="515" y="118.28" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">20 道题上的平均得分</text><text x="725" y="96.82" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">留下分最高的</text><text x="725" y="111.38" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">例：0.62 → 0.71</text><text x="16" y="176" text-anchor="start" font-size="12" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">第二步：把改进器自己当作待改程序</text><text x="105" y="220.82" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">改进器</text><text x="105" y="235.38" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">这次要改的程序就是它自己</text><text x="315" y="220.82" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">拿到改进器的新写法</text><text x="315" y="235.38" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">例：改成束搜索，每轮留 3 个</text><text x="515" y="213.92" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">看它改别的程序改得多好</text><text x="515" y="228.48" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">分数：拿它去改几个</text><text x="515" y="242.28" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">下游程序，看平均提升</text><text x="725" y="220.82" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">留下更好的改进器</text><text x="725" y="235.38" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">再拿去改别的程序</text><text x="800" y="166" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" style="paint-order:stroke;stroke-width:4px;stroke-linejoin:round" stroke="#ffffff">新改进器回到第一步</text><text x="34" y="302" text-anchor="start" font-size="11" font-weight="500" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">GPT-4 自己写出了束搜索、遗传算法、模拟退火等策略；换成较弱的模型，这个循环转不起来。</text><text x="34" y="324" text-anchor="start" font-size="11" font-weight="500" fill="#C2501A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">语言模型参数始终没变，作者明说这不是完整的递归自我改进；模型偶尔还会试图关掉沙盒限制。</text></svg>
