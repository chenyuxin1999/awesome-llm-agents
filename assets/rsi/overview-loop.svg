<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 392" width="860" height="392" role="img" aria-label="自我改进的基本循环"><defs><marker id="ah-overviewloop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6577"/></marker></defs><rect x="0" y="0" width="860" height="392" fill="#ffffff"/><path d="M160,94 L217,94" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-overviewloop)"/><path d="M410,94 L477,94" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-overviewloop)"/><path d="M650,94 L755,94 L755,173" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-overviewloop)"/><path d="M755,248 L755,314 L653,314" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-overviewloop)"/><path d="M460,314 L423,314" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-overviewloop)"/><path d="M295,246 L295,139" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-overviewloop)"/><path d="M555,350 L555,376" fill="none" stroke="#5A6577" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#ah-overviewloop)"/><rect x="30" y="62" width="130" height="64" rx="5" fill="#E3EBFF" stroke="#2B57C9" stroke-width="1.5"/><rect x="220" y="52" width="190" height="84" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="480" y="62" width="170" height="64" rx="5" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.5"/><rect x="670" y="176" width="170" height="72" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><rect x="460" y="278" width="190" height="72" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="170" y="246" width="250" height="118" rx="5" fill="#E9EDF3" stroke="#47546A" stroke-width="1.5"/><rect x="182" y="282" width="72" height="26" rx="13" fill="#FFFFFF" stroke="#47546A" stroke-width="1.2"/><rect x="260" y="282" width="72" height="26" rx="13" fill="#FFFFFF" stroke="#47546A" stroke-width="1.2"/><rect x="338" y="282" width="72" height="26" rx="13" fill="#FFFFFF" stroke="#47546A" stroke-width="1.2"/><rect x="182" y="316" width="72" height="26" rx="13" fill="#FFFFFF" stroke="#47546A" stroke-width="1.2"/><rect x="260" y="316" width="72" height="26" rx="13" fill="#FFFFFF" stroke="#47546A" stroke-width="1.2"/><rect x="338" y="316" width="72" height="26" rx="13" fill="#FFFFFF" stroke="#47546A" stroke-width="1.2"/><text x="95" y="83.23" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">接到任务</text><text x="95" y="98.29" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">例：算出这份成绩表的平</text><text x="95" y="112.78" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">均分</text><text x="315" y="83.23" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">模型和 harness 去做</text><text x="315" y="98.29" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">read() → 找成绩列 → mean()</text><text x="315" y="112.78" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">提示、工具、记忆一起起作用</text><text x="565" y="83.23" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">留下轨迹和反馈</text><text x="565" y="98.29" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">例：没找到“成绩”列，用户说</text><text x="565" y="112.78" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">算错了</text><text x="755" y="193.985" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">提出一个修改</text><text x="755" y="209.045" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">例：写一条规则“找不到成绩列</text><text x="755" y="223.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">先问用户”，也可以是一次搜索</text><text x="755" y="238.025" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">或训练</text><text x="555" y="303.23" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">检验这个修改</text><text x="555" y="318.29" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">在另外 3 份表格上重跑，都算对才留</text><text x="555" y="332.78" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">下（示意）</text><text x="295" y="268" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">被修改的“自身”（持久保存）</text><text x="218" y="299" text-anchor="middle" font-size="11" font-weight="500" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">参数</text><text x="296" y="299" text-anchor="middle" font-size="11" font-weight="500" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">上下文</text><text x="374" y="299" text-anchor="middle" font-size="11" font-weight="500" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">记忆</text><text x="218" y="333" text-anchor="middle" font-size="11" font-weight="500" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">技能</text><text x="296" y="333" text-anchor="middle" font-size="10" font-weight="500" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">harness 代码</text><text x="374" y="333" text-anchor="middle" font-size="11" font-weight="500" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">改进器本身</text><text x="189" y="86" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" style="paint-order:stroke;stroke-width:4px;stroke-linejoin:round" stroke="#ffffff">任务描述</text><text x="444" y="84" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" style="paint-order:stroke;stroke-width:4px;stroke-linejoin:round" stroke="#ffffff">动作和结果</text><text x="720" y="86" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" style="paint-order:stroke;stroke-width:4px;stroke-linejoin:round" stroke="#ffffff">成败、分数、报错、评语</text><text x="790" y="290" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" style="paint-order:stroke;stroke-width:4px;stroke-linejoin:round" stroke="#ffffff">一条候选修改</text><text x="442" y="306" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" style="paint-order:stroke;stroke-width:4px;stroke-linejoin:round" stroke="#ffffff">写回</text><text x="360" y="196" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" style="paint-order:stroke;stroke-width:4px;stroke-linejoin:round" stroke="#ffffff">下一次任务带上</text><text x="570" y="380" text-anchor="start" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">没通过的修改丢弃</text><text x="30" y="24" text-anchor="start" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">目标：agent 用自己产生的轨迹和反馈修改自身某个持久的部分，修改要经过检验，并参与以后的任务</text></svg>
