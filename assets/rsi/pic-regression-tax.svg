C, Noto Sans CJK SC, Microsoft YaHei, sans-serif">✓</text><text x="615" y="103" text-anchor="middle" font-size="14" font-weight="700" fill="#C2501A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">✗</text><text x="615" y="142" text-anchor="middle" font-size="11.5" font-weight="700" fill="#C2501A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">退化</text><text x="677" y="28" text-anchor="middle" font-size="11" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">任务 9</text><text x="677" y="61" text-anchor="middle" font-size="14" font-weight="700" fill="#C2501A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">✗</text><text x="677" y="103" text-anchor="middle" font-size="14" font-weight="700" fill="#26805A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">✓</text><text x="677" y="142" text-anchor="middle" font-size="11.5" font-weight="700" fill="#26805A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">新增</text><text x="739" y="28" text-anchor="middle" font-size="11" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">任务 10</text><text x="739" y="61" text-anchor="middle" font-size="14" font-weight="700" fill="#26805A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">✓</text><text x="739" y="103" text-anchor="middle" font-size="14" font-weight="700" fill="#26805A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">✓</text><text x="739" y="142" text-anchor="middle" font-size="11.5" font-weight="700" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">保持</text><text x="30" y="196" text-anchor="start" font-size="12.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">只看平均：60% → 70%，净涨 1 个任务。</text><text x="30" y="222" text-anchor="start" font-size="12" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">逐个任务数：新增 3 个（任务 3、5、9），退化 2 个（任务 2、8），残余失败 1 个（任务 6）。</text><text x="30" y="248" text-anchor="start" font-size="12" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">退化是原来会做、加了技能反而做错；残余失败是两种设置下都做不出来。两者性质不同，补救办法也不同。</text><text x="30" y="274" text-anchor="start" font-size="12" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">净收益 +1 把 3 个新增和 2 个退化相互抵消，看不出技能帮了谁、害了谁。</text><text x="440" y="316" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">示意：十个任务的成败是虚构的，四个类别取自 The Regression Tax 的划分</text></svg>
