<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" width="880" height="380" role="img" aria-label="STaR 怎样用标准答案筛选模型自己写的推理过程"><defs><marker id="ah-picstarfilter" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6577"/></marker></defs><rect x="0" y="0" width="880" height="380" fill="#ffffff"/><path d="M440,114 L476,114" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-picstarfilter)"/><path d="M440,148 L476,148" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-picstarfilter)"/><path d="M440,182 L476,182" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-picstarfilter)"/><path d="M440,216 L476,216" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-picstarfilter)"/><path d="M440,297 L476,297" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-picstarfilter)"/><path d="M640,160 L678,190" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-picstarfilter)"/><path d="M640,297 L678,240" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-picstarfilter)"/><rect x="20" y="20" width="840" height="40" rx="5" fill="#E3EBFF" stroke="#2B57C9" stroke-width="1.5"/><rect x="20" y="100" width="420" height="28" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="20" y="134" width="420" height="28" rx="5" fill="#F3F5F8" stroke="#D5DBE4" stroke-width="1.5"/><rect x="20" y="168" width="420" height="28" rx="5" fill="#F3F5F8" stroke="#D5DBE4" stroke-width="1.5"/><rect x="20" y="202" width="420" height="28" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="20" y="274" width="420" height="46" rx="5" fill="#F3F5F8" stroke="#D5DBE4" stroke-width="1.5"/><rect x="680" y="150" width="180" height="120" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><text x="440" y="43.875" text-anchor="middle" font-size="12.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">题目：小明有 3 盒笔，每盒 12 支，送出 7 支，还剩几支？　　标准答案：29</text><text x="20" y="86" text-anchor="start" font-size="12.5" font-weight="700" fill="#5B45B0" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">第一步：模型自己写几遍推理</text><text x="32" y="119" text-anchor="start" font-size="11.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">3×12=36，36−7=29，答案 29</text><text x="490" y="119" text-anchor="middle" font-size="13" font-weight="700" fill="#26805A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">✓</text><text x="506" y="119" text-anchor="start" font-size="11" font-weight="400" fill="#26805A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">和标准答案一致，留下</text><text x="32" y="153" text-anchor="start" font-size="11.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">3+12=15，15−7=8，答案 8</text><text x="490" y="153" text-anchor="middle" font-size="13" font-weight="700" fill="#C2501A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">✗</text><text x="506" y="153" text-anchor="start" font-size="11" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">答案不对，丢掉</text><text x="32" y="187" text-anchor="start" font-size="11.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">12−7=5，5×3=15，答案 15</text><text x="490" y="187" text-anchor="middle" font-size="13" font-weight="700" fill="#C2501A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">✗</text><text x="506" y="187" text-anchor="start" font-size="11" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">答案不对，丢掉</text><text x="32" y="221" text-anchor="start" font-size="11.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">每盒 12 支共 36 支，送出 7 支剩 29，答案 29</text><text x="490" y="221" text-anchor="middle" font-size="13" font-weight="700" fill="#26805A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">✓</text><text x="506" y="221" text-anchor="start" font-size="11" font-weight="400" fill="#26805A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">和标准答案一致，留下</text><text x="20" y="262" text-anchor="start" font-size="12.5" font-weight="700" fill="#B83560" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">第二步：几遍都错的题，把答案作提示再推一遍</text><text x="32" y="293" text-anchor="start" font-size="11.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">提示：答案是 29。请写出得到它的推理。</text><text x="32" y="312" text-anchor="start" font-size="11.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">→ 3×12=36，36−7=29</text><text x="490" y="302" text-anchor="middle" font-size="13" font-weight="700" fill="#26805A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">✓</text><text x="506" y="302" text-anchor="start" font-size="11" font-weight="400" fill="#26805A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">推理能得出答案，也留下</text><text x="770" y="199.23" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">用留下的推理微调</text><text x="770" y="214.29" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">微调后的模型去做下一轮题，再筛</text><text x="770" y="228.78" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">一遍</text><text x="440" y="366" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">示意：题目和推理是虚构的；提示重推这一步论文叫 rationalization</text></svg>
