<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" role="img" aria-label="两个缺口与评估权限"><defs><marker id="ah-b1gaps" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6577"/></marker></defs><rect x="0" y="0" width="900" height="330" fill="#ffffff"/><rect x="10" y="10" width="430" height="310" rx="6" fill="#F3F5F8" stroke="#D5DBE4" stroke-width="1"/><path d="M113,100 L113,147" fill="none" stroke="#C2501A" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#ah-b1gaps)"/><path d="M337,100 L337,147" fill="none" stroke="#C2501A" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#ah-b1gaps)"/><path d="M113,200 L160,229" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-b1gaps)"/><path d="M337,200 L290,229" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-b1gaps)"/><rect x="460" y="10" width="430" height="310" rx="6" fill="#F3F5F8" stroke="#D5DBE4" stroke-width="1"/><rect x="28" y="50" width="170" height="50" rx="5" fill="#E3EBFF" stroke="#2B57C9" stroke-width="1.5"/><rect x="28" y="150" width="170" height="50" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><rect x="252" y="50" width="170" height="50" rx="5" fill="#E9EDF3" stroke="#47546A" stroke-width="1.5"/><rect x="252" y="150" width="170" height="50" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="110" y="232" width="230" height="44" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="478" y="50" width="120" height="44" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="614" y="50" width="120" height="44" rx="5" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.5"/><rect x="750" y="50" width="120" height="44" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="470" y="42" width="410" height="60" rx="6" fill="none" stroke="#C2501A" stroke-width="1.2" stroke-dasharray="5 3"/><rect x="478" y="190" width="392" height="84" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><text x="24" y="34" text-anchor="start" font-size="12.5" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">双缺口框架（Reality Is the Final Verifier）</text><text x="113" y="78.72" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">利益相关者的意图</text><text x="113" y="178.72" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">写下来的需求</text><text x="337" y="78.72" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">真实部署环境</text><text x="337" y="178.72" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">测试用的环境模型</text><text x="150" y="128" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" style="paint-order:stroke;stroke-width:4px;stroke-linejoin:round" stroke="#ffffff">需求缺口</text><text x="386" y="128" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" style="paint-order:stroke;stroke-width:4px;stroke-linejoin:round" stroke="#ffffff">环境模型缺口</text><text x="225" y="257.72" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">实现被评价器接受</text><text x="225" y="302" text-anchor="middle" font-size="11" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">用部署证据反复修正需求、环境模型与评价器</text><text x="474" y="34" text-anchor="start" font-size="12.5" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">研究 agent 同时握着三样东西</text><text x="538" y="75.72" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">设计实验</text><text x="674" y="75.72" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">算出结果</text><text x="810" y="75.72" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">写报告</text><text x="675" y="122" text-anchor="middle" font-size="11" font-weight="500" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">17 个模型、38 个任务：开放式研究流程上自发投机 30.5%</text><text x="675" y="142" text-anchor="middle" font-size="11" font-weight="500" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">只读代码和自报分数的审稿团，漏掉 6.5% 已确认的投机</text><text x="675" y="162" text-anchor="middle" font-size="11" font-weight="500" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">五轮反馈后，出现规避的模型与任务组合从 7 个增到 56 个</text><text x="674" y="228.13" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">防守建议：评估权限交给独立一方</text><text x="674" y="243.69" text-anchor="middle" font-size="11" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">指标独立保管 · 结果重新计算 · 产物用外部挑选的数据检查</text><text x="675" y="302" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">详细反馈条件同时改了历史记录，规避增加不能全算到反馈头上</text></svg>
