<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" width="900" height="250" role="img" aria-label="训练各阶段的安全干预"><defs><marker id="ah-b2timing" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6577"/></marker></defs><rect x="0" y="0" width="900" height="250" fill="#ffffff"/><path d="M230,60 L239,60" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-b2timing)"/><path d="M450,60 L459,60" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-b2timing)"/><path d="M670,60 L679,60" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-b2timing)"/><rect x="20" y="44" width="210" height="32" rx="16" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><rect x="240" y="44" width="210" height="32" rx="16" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><rect x="460" y="44" width="210" height="32" rx="16" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><rect x="680" y="44" width="210" height="32" rx="16" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="20" y="92" width="210" height="140" rx="5" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1.2"/><rect x="30" y="184" width="190" height="36" rx="4" fill="#FDE8DD" stroke="#C2501A" stroke-width="1"/><rect x="240" y="92" width="210" height="140" rx="5" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1.2"/><rect x="250" y="184" width="190" height="36" rx="4" fill="#FDE8DD" stroke="#C2501A" stroke-width="1"/><rect x="460" y="92" width="210" height="140" rx="5" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1.2"/><rect x="470" y="184" width="190" height="36" rx="4" fill="#FDE8DD" stroke="#C2501A" stroke-width="1"/><rect x="680" y="92" width="210" height="140" rx="5" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1.2"/><rect x="690" y="184" width="190" height="36" rx="4" fill="#FDE8DD" stroke="#C2501A" stroke-width="1"/><text x="20" y="24" text-anchor="start" font-size="12" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">干预可以放在训练的不同时刻：越早越深入，越晚越贴近部署</text><text x="125" y="65" text-anchor="middle" font-size="12" font-weight="700" fill="#B83560" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">预训练</text><text x="345" y="65" text-anchor="middle" font-size="12" font-weight="700" fill="#B83560" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">中期训练</text><text x="565" y="65" text-anchor="middle" font-size="12" font-weight="700" fill="#B83560" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">后训练</text><text x="785" y="65" text-anchor="middle" font-size="12" font-weight="700" fill="#26805A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">部署经验回流</text><text x="125" y="116" text-anchor="middle" font-size="11.5" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Synthetic Persona Pretraining</text><text x="125" y="144" text-anchor="middle" font-size="10.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">给预训练文档配上价值反思</text><text x="125" y="158.7" text-anchor="middle" font-size="10.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">后训练把这个角色绑定到助手</text><text x="125" y="206" text-anchor="middle" font-size="10" font-weight="500" fill="#C2501A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">最多 3B 参数、500B token</text><text x="345" y="116" text-anchor="middle" font-size="11.5" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Inoculation Midtraining</text><text x="345" y="144" text-anchor="middle" font-size="10.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">用一个新造的词标出</text><text x="345" y="158.7" text-anchor="middle" font-size="10.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">“不安全行为属于这个语境”</text><text x="345" y="206" text-anchor="middle" font-size="10" font-weight="500" fill="#C2501A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">边界会漏，附近线索能重新激活</text><text x="565" y="116" text-anchor="middle" font-size="11.5" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Rubric Dropout · 辩论训练</text><text x="565" y="144" text-anchor="middle" font-size="10.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">改变奖励怎样算</text><text x="565" y="158.7" text-anchor="middle" font-size="10.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">改变反馈怎样生成</text><text x="565" y="206" text-anchor="middle" font-size="10" font-weight="500" fill="#C2501A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">压低特定投机，替代不了权限</text><text x="785" y="116" text-anchor="middle" font-size="11.5" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">SafeEvolve</text><text x="785" y="144" text-anchor="middle" font-size="10.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">轨迹里的安全经验同时更新</text><text x="785" y="158.7" text-anchor="middle" font-size="10.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">harness 组件与策略（SFT 后 RL）</text><text x="785" y="206" text-anchor="middle" font-size="10" font-weight="500" fill="#C2501A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">效果要放回训练与评测协议看</text></svg>
