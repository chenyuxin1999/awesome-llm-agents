<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 416" width="920" height="416" role="img" aria-label="Rubric Dropout 与辩论训练的范式对比"><defs><marker id="ah-b2train" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6577"/></marker></defs><rect x="0" y="0" width="920" height="416" fill="#ffffff"/><rect x="24" y="82" width="108" height="53.62" rx="4" fill="#F3F5F8" stroke="#D5DBE4" stroke-width="1"/><rect x="142" y="82" width="244.667" height="53.62" rx="4" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1"/><rect x="396.667" y="82" width="244.667" height="53.62" rx="4" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1"/><rect x="651.333" y="82" width="244.667" height="53.62" rx="4" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1"/><rect x="24" y="143.62" width="108" height="53.62" rx="4" fill="#F3F5F8" stroke="#D5DBE4" stroke-width="1"/><rect x="142" y="143.62" width="244.667" height="53.62" rx="4" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1"/><rect x="396.667" y="143.62" width="244.667" height="53.62" rx="4" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1"/><rect x="651.333" y="143.62" width="244.667" height="53.62" rx="4" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1"/><rect x="24" y="205.24" width="108" height="100" rx="4" fill="#F3F5F8" stroke="#D5DBE4" stroke-width="1"/><rect x="142" y="205.24" width="244.667" height="100" rx="4" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1"/><rect x="396.667" y="205.24" width="244.667" height="100" rx="4" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1"/><rect x="651.333" y="205.24" width="244.667" height="100" rx="4" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1"/><rect x="24" y="313.24" width="108" height="53.62" rx="4" fill="#F3F5F8" stroke="#D5DBE4" stroke-width="1"/><rect x="142" y="313.24" width="244.667" height="53.62" rx="4" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1"/><rect x="396.667" y="313.24" width="244.667" height="53.62" rx="4" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1"/><rect x="651.333" y="313.24" width="244.667" height="53.62" rx="4" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1"/><rect x="142" y="40" width="244.667" height="32" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><rect x="396.667" y="40" width="244.667" height="32" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="651.333" y="40" width="244.667" height="32" rx="5" fill="#FDE8DD" stroke="#C2501A" stroke-width="1.5"/><rect x="454.667" y="217.24" width="26" height="18" rx="3" fill="#FFFFFF" stroke="#5A6577" stroke-width="1" stroke-dasharray="3 2"/><rect x="483.667" y="217.24" width="26" height="18" rx="3" fill="#FCE4EC" stroke="#B83560" stroke-width="1"/><rect x="512.667" y="217.24" width="26" height="18" rx="3" fill="#FCE4EC" stroke="#B83560" stroke-width="1"/><rect x="541.667" y="217.24" width="26" height="18" rx="3" fill="#FFFFFF" stroke="#5A6577" stroke-width="1" stroke-dasharray="3 2"/><rect x="570.667" y="217.24" width="26" height="18" rx="3" fill="#FCE4EC" stroke="#B83560" stroke-width="1"/><rect x="599.667" y="217.24" width="26" height="18" rx="3" fill="#FCE4EC" stroke="#B83560" stroke-width="1"/><rect x="454.667" y="241.24" width="26" height="18" rx="3" fill="#FCE4EC" stroke="#B83560" stroke-width="1"/><rect x="483.667" y="241.24" width="26" height="18" rx="3" fill="#FFFFFF" stroke="#5A6577" stroke-width="1" stroke-dasharray="3 2"/><rect x="512.667" y="241.24" width="26" height="18" rx="3" fill="#FCE4EC" stroke="#B83560" stroke-width="1"/><rect x="541.667" y="241.24" width="26" height="18" rx="3" fill="#FCE4EC" stroke="#B83560" stroke-width="1"/><rect x="570.667" y="241.24" width="26" height="18" rx="3" fill="#FFFFFF" stroke="#5A6577" stroke-width="1" stroke-dasharray="3 2"/><rect x="599.667" y="241.24" width="26" height="18" rx="3" fill="#FCE4EC" stroke="#B83560" stroke-width="1"/><rect x="454.667" y="265.24" width="26" height="18" rx="3" fill="#FCE4EC" stroke="#B83560" stroke-width="1"/><rect x="483.667" y="265.24" width="26" height="18" rx="3" fill="#FCE4EC" stroke="#B83560" stroke-width="1"/><rect x="512.667" y="265.24" width="26" height="18" rx="3" fill="#FFFFFF" stroke="#5A6577" stroke-width="1" stroke-dasharray="3 2"/><rect x="541.667" y="265.24" width="26" height="18" rx="3" fill="#FCE4EC" stroke="#B83560" stroke-width="1"/><rect x="570.667" y="265.24" width="26" height="18" rx="3" fill="#FCE4EC" stroke="#B83560" stroke-width="1"/><rect x="599.667" y="265.24" width="26" height="18" rx="3" fill="#FFFFFF" stroke="#5A6577" stroke-width="1" stroke-dasharray="3 2"/><text x="24" y="26" text-anchor="start" font-size="12.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">后训练里用模型裁判当奖励时，三种做法的差别在奖励怎样产生</text><text x="264.333" y="61" text-anchor="middle" font-size="11.5" font-weight="700" fill="#B83560" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">基线：裁判直接打分</text><text x="519" y="61" text-anchor="middle" font-size="11.5" font-weight="700" fill="#26805A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Rubric Dropout</text><text x="773.667" y="61" text-anchor="middle" font-size="11.5" font-weight="700" fill="#C2501A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">辩论训练</text><text x="78" y="112.81" text-anchor="middle" font-size="11" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">谁在输出什么</text><text x="264.333" y="111.615" text-anchor="middle" font-size="10.2" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">策略写回答</text><text x="519" y="103.71" text-anchor="middle" font-size="10.2" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">策略写回答；GRPO 的同一组回答共享同一个准则</text><text x="519" y="119.52" text-anchor="middle" font-size="10.2" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">子集</text><text x="773.667" y="111.615" text-anchor="middle" font-size="10.2" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">生成者（被训练的策略）写回答，批评者找它的错</text><text x="78" y="174.43" text-anchor="middle" font-size="11" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">训练信号从哪来</text><text x="264.333" y="165.33" text-anchor="middle" font-size="10.2" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">模型裁判按评分准则逐条打分；单人 RLAIF 里是</text><text x="264.333" y="181.14" text-anchor="middle" font-size="10.2" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">一个较弱的裁判直接判</text><text x="519" y="173.235" text-anchor="middle" font-size="10.2" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">同一个裁判，只按这一步随机留下的准则打分</text><text x="773.667" y="173.235" text-anchor="middle" font-size="10.2" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">较弱的裁判读完回答和批评者的论证后给出判断</text><text x="78" y="259.24" text-anchor="middle" font-size="11" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">怎么用</text><text x="264.333" y="258.045" text-anchor="middle" font-size="10.2" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">裁判的分当奖励</text><text x="426.667" y="231.24" text-anchor="middle" font-size="9.5" font-weight="600" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">第 1 步</text><text x="467.667" y="230.24" text-anchor="middle" font-size="9.5" font-weight="400" fill="#9AA6B8" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">1</text><text x="496.667" y="230.24" text-anchor="middle" font-size="9.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">2</text><text x="525.667" y="230.24" text-anchor="middle" font-size="9.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">3</text><text x="554.667" y="230.24" text-anchor="middle" font-size="9.5" font-weight="400" fill="#9AA6B8" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">4</text><text x="583.667" y="230.24" text-anchor="middle" font-size="9.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">5</text><text x="612.667" y="230.24" text-anchor="middle" font-size="9.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">6</text><text x="426.667" y="255.24" text-anchor="middle" font-size="9.5" font-weight="600" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">第 2 步</text><text x="467.667" y="254.24" text-anchor="middle" font-size="9.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">1</text><text x="496.667" y="254.24" text-anchor="middle" font-size="9.5" font-weight="400" fill="#9AA6B8" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">2</text><text x="525.667" y="254.24" text-anchor="middle" font-size="9.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">3</text><text x="554.667" y="254.24" text-anchor="middle" font-size="9.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">4</text><text x="583.667" y="254.24" text-anchor="middle" font-size="9.5" font-weight="400" fill="#9AA6B8" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">5</text><text x="612.667" y="254.24" text-anchor="middle" font-size="9.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">6</text><text x="426.667" y="279.24" text-anchor="middle" font-size="9.5" font-weight="600" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">第 3 步</text><text x="467.667" y="278.24" text-anchor="middle" font-size="9.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">1</text><text x="496.667" y="278.24" text-anchor="middle" font-size="9.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">2</text><text x="525.667" y="278.24" text-anchor="middle" font-size="9.5" font-weight="400" fill="#9AA6B8" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">3</text><text x="554.667" y="278.24" text-anchor="middle" font-size="9.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">4</text><text x="583.667" y="278.24" text-anchor="middle" font-size="9.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">5</text><text x="612.667" y="278.24" text-anchor="middle" font-size="9.5" font-weight="400" fill="#9AA6B8" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">6</text><text x="519" y="295.24" text-anchor="middle" font-size="9.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">虚线：这一步藏起来的准则</text><text x="773.667" y="258.045" text-anchor="middle" font-size="10.2" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">裁判的判断就是生成者的奖励</text><text x="78" y="344.05" text-anchor="middle" font-size="11" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">代价</text><text x="264.333" y="334.95" text-anchor="middle" font-size="10.2" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">训练裁判的分一路涨，更强的 gold 裁判先升后降，</text><text x="264.333" y="350.76" text-anchor="middle" font-size="10.2" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">ResearchQA 上回落 22 分</text><text x="519" y="334.95" text-anchor="middle" font-size="10.2" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">准则仍来自同一份不完整的清单，没写进去的约束</text><text x="519" y="350.76" text-anchor="middle" font-size="10.2" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">变不出来</text><text x="773.667" y="334.95" text-anchor="middle" font-size="10.2" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">批评者可能转去操纵裁判；限制发言长度又会损失</text><text x="773.667" y="350.76" text-anchor="middle" font-size="10.2" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">论证的清晰度</text><text x="460" y="394.86" text-anchor="middle" font-size="11" font-weight="600" fill="#26805A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">评测时 Rubric Dropout 仍用全部准则；辩论选在有标准答案的数学题上，好分清质量提升和说服力提升</text></svg>
