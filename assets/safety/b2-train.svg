osoft YaHei, sans-serif">准则 2</text><text x="216" y="73" text-anchor="middle" font-size="10" font-weight="500" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">准则 3</text><text x="270" y="73" text-anchor="middle" font-size="10" font-weight="400" fill="#9AA6B8" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">准则 4</text><text x="324" y="73" text-anchor="middle" font-size="10" font-weight="500" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">准则 5</text><text x="378" y="73" text-anchor="middle" font-size="10" font-weight="500" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">准则 6</text><text x="28" y="124" text-anchor="start" font-size="11" font-weight="600" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">第 2 步</text><text x="108" y="125" text-anchor="middle" font-size="10" font-weight="500" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">准则 1</text><text x="162" y="125" text-anchor="middle" font-size="10" font-weight="400" fill="#9AA6B8" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">准则 2</text><text x="216" y="125" text-anchor="middle" font-size="10" font-weight="500" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">准则 3</text><text x="270" y="125" text-anchor="middle" font-size="10" font-weight="500" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">准则 4</text><text x="324" y="125" text-anchor="middle" font-size="10" font-weight="400" fill="#9AA6B8" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">准则 5</text><text x="378" y="125" text-anchor="middle" font-size="10" font-weight="500" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">准则 6</text><text x="28" y="176" text-anchor="start" font-size="11" font-weight="600" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">第 3 步</text><text x="108" y="177" text-anchor="middle" font-size="10" font-weight="500" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">准则 1</text><text x="162" y="177" text-anchor="middle" font-size="10" font-weight="500" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">准则 2</text><text x="216" y="177" text-anchor="middle" font-size="10" font-weight="400" fill="#9AA6B8" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">准则 3</text><text x="270" y="177" text-anchor="middle" font-size="10" font-weight="500" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">准则 4</text><text x="324" y="177" text-anchor="middle" font-size="10" font-weight="500" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">准则 5</text><text x="378" y="177" text-anchor="middle" font-size="10" font-weight="400" fill="#9AA6B8" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">准则 6</text><text x="225" y="226" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">虚线是本步被隐藏的准则；同一组样本共享同一个子集</text><text x="225" y="246" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">评测时始终用全部准则</text><text x="225" y="278" text-anchor="middle" font-size="11" font-weight="500" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">训练裁判分数一路涨，更强的 gold 裁判先升后降</text><text x="225" y="298" text-anchor="middle" font-size="11" font-weight="500" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">（ResearchQA 上回落 22 分）；dropout 在各检查点抬高 gold 分</text><text x="474" y="34" text-anchor="start" font-size="12.5" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">辩论训练：让批评者把缺陷摆到裁判面前</text><text x="558" y="78.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">生成者</text><text x="558" y="93.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">被训练的策略</text><text x="792" y="78.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">批评者</text><text x="792" y="93.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">找出回答的错误</text><text x="674" y="74" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" style="paint-order:stroke;stroke-width:4px;stroke-linejoin:round" stroke="#ffffff">回答</text><text x="675" y="174.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">较弱的裁判</text><text x="675" y="189.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Flash Lite 级别</text><text x="675" y="236" text-anchor="middle" font-size="11" font-weight="500" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">单人 RLAIF 基线很快钻了裁判的空子；</text><text x="675" y="256" text-anchor="middle" font-size="11" font-weight="500" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">辩论在整个训练中保住了裁判的判断力</text><text x="675" y="284" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">数学题有可验证答案，能分清质量提升与说服力提升</text><text x="675" y="302" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">批评者也可能转去操纵裁判，需要约束</text></svg>
