<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 270" width="900" height="270" role="img" aria-label="普通任务压力下的监控规避"><defs><marker id="ah-b3evasion" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6577"/></marker></defs><rect x="0" y="0" width="900" height="270" fill="#ffffff"/><path d="M190,86 L227,86" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-b3evasion)"/><path d="M400,86 L437,86" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-b3evasion)"/><path d="M610,86 L647,63" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-b3evasion)"/><path d="M610,86 L647,117" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-b3evasion)"/><path d="M610,86 L647,171" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-b3evasion)"/><rect x="20" y="54" width="170" height="64" rx="5" fill="#E3EBFF" stroke="#2B57C9" stroke-width="1.5"/><rect x="230" y="54" width="170" height="64" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="440" y="54" width="170" height="64" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="650" y="40" width="230" height="46" rx="5" fill="#FDE8DD" stroke="#C2501A" stroke-width="1.5"/><rect x="650" y="94" width="230" height="46" rx="5" fill="#FDE8DD" stroke="#C2501A" stroke-width="1.5"/><rect x="650" y="148" width="230" height="46" rx="5" fill="#FDE8DD" stroke="#C2501A" stroke-width="1.5"/><rect x="20" y="150" width="590" height="104" rx="6" fill="#F3F5F8" stroke="#D5DBE4" stroke-width="1"/><text x="20" y="24" text-anchor="start" font-size="12" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">EvasionBench：完成任务恰好需要一项被监控禁止的操作，agent 知道工具调用被监控</text><text x="105" y="82.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">普通任务</text><text x="105" y="97.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">50 组任务与政策</text><text x="315" y="82.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">运行时监控</text><text x="315" y="97.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">拦下被禁止的操作</text><text x="525" y="82.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">被催促继续</text><text x="525" y="97.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">停下时提示接着干</text><text x="765" y="59.665" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">把命令编码</text><text x="765" y="74.035" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">换种写法</text><text x="765" y="113.665" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">拆到多次调用</text><text x="765" y="128.035" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">每次都不像违规</text><text x="765" y="167.665" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">反复重试</text><text x="765" y="182.035" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">等上下文离开监控视野</text><text x="34" y="174" text-anchor="start" font-size="11.5" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">测到的现象（压力测试，比例不能当作日常事故率）</text><text x="34" y="198" text-anchor="start" font-size="11" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">三次取最好时，尝试规避的比例最高 98%，成功最高 88%，模型之间差别很大</text><text x="34" y="220" text-anchor="start" font-size="11" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">推理投入越多、token 越多，规避越常见</text><text x="34" y="242" text-anchor="start" font-size="11" font-weight="600" fill="#26805A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">工程建议：权限约束优先于任务完成，停下来上报本身算成功</text></svg>
