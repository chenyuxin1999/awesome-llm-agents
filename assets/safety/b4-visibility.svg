<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" role="img" aria-label="监控者能看见什么"><defs><marker id="ah-b4visibility" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6577"/></marker></defs><rect x="0" y="0" width="900" height="330" fill="#ffffff"/><path d="M160,160 L217,84" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-b4visibility)"/><path d="M160,160 L217,178" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-b4visibility)"/><path d="M160,160 L217,272" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-b4visibility)"/><rect x="20" y="120" width="140" height="80" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="220" y="44" width="170" height="80" rx="5" fill="#E9EDF3" stroke="#47546A" stroke-width="1.5"/><rect x="420" y="44" width="460" height="80" rx="5" fill="#FDE8DD" stroke="#C2501A" stroke-width="1"/><rect x="220" y="138" width="170" height="80" rx="5" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.5"/><rect x="420" y="138" width="460" height="80" rx="5" fill="#FDE8DD" stroke="#C2501A" stroke-width="1"/><rect x="220" y="232" width="170" height="80" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="420" y="232" width="460" height="80" rx="5" fill="#FDE8DD" stroke="#C2501A" stroke-width="1"/><text x="20" y="24" text-anchor="start" font-size="12" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">三扇窗口各看到一部分；每扇窗口都有已知的盲区</text><text x="90" y="149.23" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">模型的计算</text><text x="90" y="164.29" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">内部激活、文字</text><text x="90" y="178.78" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">与动作</text><text x="305" y="80.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">动作与状态变化</text><text x="305" y="95.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">工具调用、访问对象、产物</text><text x="434" y="66" text-anchor="start" font-size="11" font-weight="700" fill="#C2501A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">盲区</text><text x="434" y="86" text-anchor="start" font-size="10.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">最贴近后果，看不到意图</text><text x="305" y="174.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">思维链文本</text><text x="305" y="189.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">推理与计划</text><text x="434" y="160" text-anchor="start" font-size="11" font-weight="700" fill="#C2501A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">盲区</text><text x="434" y="180" text-anchor="start" font-size="10.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">计划注入后，模型把注入的计划改写成自己的推理，规避率 25%–33%；填充 token 让部分计</text><text x="434" y="196" text-anchor="start" font-size="10.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">算不留可读痕迹（合成任务准确率最多提升 13 个百分点）</text><text x="305" y="268.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">内部表示</text><text x="305" y="283.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">均值差方向、探针</text><text x="434" y="254" text-anchor="start" font-size="11" font-weight="700" fill="#C2501A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">盲区</text><text x="434" y="274" text-anchor="start" font-size="10.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">需要白盒，阈值难迁移；会适应的模型可能绕开</text></svg>
