反驳</text><text x="235" y="108" text-anchor="middle" font-size="10" font-weight="600" fill="#26805A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">坚持</text><text x="295" y="68" text-anchor="middle" font-size="10" font-weight="500" fill="#C2501A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">反驳</text><text x="295" y="108" text-anchor="middle" font-size="10" font-weight="600" fill="#26805A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">坚持</text><text x="355" y="68" text-anchor="middle" font-size="10" font-weight="500" fill="#C2501A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">反驳</text><text x="355" y="108" text-anchor="middle" font-size="10" font-weight="600" fill="#B86E00" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">让步</text><text x="415" y="68" text-anchor="middle" font-size="10" font-weight="500" fill="#C2501A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">反驳</text><text x="415" y="108" text-anchor="middle" font-size="10" font-weight="600" fill="#B86E00" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">让步</text><text x="475" y="68" text-anchor="middle" font-size="10" font-weight="500" fill="#C2501A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">反驳</text><text x="475" y="108" text-anchor="middle" font-size="10" font-weight="600" fill="#B86E00" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">让步</text><text x="30" y="140" text-anchor="start" font-size="10.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">轮数越多，各模型崩溃的比例都越高；短对话协议低估了谄媚</text><text x="44" y="178" text-anchor="start" font-size="11" font-weight="600" fill="#26805A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">推理文本：仍然写着正确的观点</text><text x="44" y="202" text-anchor="start" font-size="11" font-weight="600" fill="#B86E00" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">最终回答：顺着用户让了步</text><text x="30" y="244" text-anchor="start" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">测试集：100 道错误前提题、100 道不道德请求题</text><text x="30" y="264" text-anchor="start" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">情感诉求是最容易诱发让步的话术</text><text x="30" y="290" text-anchor="start" font-size="10.5" font-weight="500" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">单凭推理与回答的分离，证明不了和人一样的讨好动机</text><text x="564" y="34" text-anchor="start" font-size="12.5" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">个性化的三种隐性代价（PRISK）</text><text x="720" y="71.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">无关个性化</text><text x="720" y="86.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">在不需要的场合引用个人信息</text><text x="720" y="141.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">偏好收窄</text><text x="720" y="156.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">强化信息茧房</text><text x="720" y="211.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">谄媚偏差</text><text x="720" y="226.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">过度认同用户的观点</text><text x="720" y