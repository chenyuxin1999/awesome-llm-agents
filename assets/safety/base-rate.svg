<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 290" width="880" height="290" role="img" aria-label="基础比率与报警质量（示意）"><defs><marker id="ah-baserate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6577"/></marker></defs><rect x="0" y="0" width="880" height="290" fill="#ffffff"/><path d="M180,95 L237,72" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-baserate)"/><path d="M180,115 L237,148" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-baserate)"/><path d="M420,72 L477,72" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-baserate)"/><path d="M420,148 L477,148" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-baserate)"/><path d="M650,72 L697,90" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-baserate)"/><path d="M650,148 L697,130" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-baserate)"/><rect x="20" y="70" width="160" height="70" rx="5" fill="#E3EBFF" stroke="#2B57C9" stroke-width="1.5"/><rect x="240" y="44" width="180" height="56" rx="5" fill="#FDE8DD" stroke="#C2501A" stroke-width="1.5"/><rect x="240" y="120" width="180" height="56" rx="5" fill="#E9EDF3" stroke="#47546A" stroke-width="1.5"/><rect x="480" y="44" width="170" height="56" rx="5" fill="#FDE8DD" stroke="#C2501A" stroke-width="1.5"/><rect x="480" y="120" width="170" height="56" rx="5" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.5"/><rect x="700" y="44" width="160" height="132" rx="6" fill="#DDF3E8" stroke="#26805A" stroke-width="1.2"/><rect x="20" y="204" width="840" height="70" rx="6" fill="#F3F5F8" stroke="#D5DBE4" stroke-width="1"/><text x="20" y="24" text-anchor="start" font-size="12" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">示意数字：一万次请求里只有 10 次真的危险；检测器抓到其中 9 次，对正常请求的误报比例是 1%</text><text x="100" y="109.03" text-anchor="middle" font-size="13" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">10000 次请求</text><text x="330" y="75.72" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">10 次危险</text><text x="330" y="151.72" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">9990 次正常</text><text x="565" y="68.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">抓到 9 次</text><text x="565" y="83.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">漏掉 1 次</text><text x="565" y="144.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">误报约 100 次</text><text x="565" y="159.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">1% × 9990</text><text x="780" y="70" text-anchor="middle" font-size="12.5" font-weight="700" fill="#26805A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">报警队列</text><text x="780" y="98" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">约 109 条</text><text x="780" y="124" text-anchor="middle" font-size="11" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">真正危险的</text><text x="780" y="142" text-anchor="middle" font-size="11" font-weight="600" fill="#C2501A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">不到十分之一</text><text x="34" y="228" text-anchor="start" font-size="11.5" font-weight="500" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">同一个检测器，在危险与正常各占一半的离线测试里准确率很高；</text><text x="34" y="252" text-anchor="start" font-size="11.5" font-weight="500" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">到了危险极少的真实流量里，审查时间大多花在误报上。评价要贴近实际的事件分布。</text></svg>
