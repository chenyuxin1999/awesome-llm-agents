<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 206" width="560" height="206" role="img" aria-label="Sleeper Agents"><defs><marker id="ah-cardb1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6577"/></marker></defs><rect x="0" y="0" width="560" height="206" fill="#ffffff"/><path d="M174,77 L197,77" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-cardb1)"/><path d="M360,77 L383,77" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-cardb1)"/><path d="M94,116 L94,126" fill="none" stroke="#5A6577" stroke-width="1.4" stroke-dasharray="2 2"/><path d="M280,116 L280,126" fill="none" stroke="#5A6577" stroke-width="1.4" stroke-dasharray="2 2"/><path d="M466,116 L466,126" fill="none" stroke="#5A6577" stroke-width="1.4" stroke-dasharray="2 2"/><rect x="14" y="38" width="160" height="78" rx="5" fill="#FDE8DD" stroke="#C2501A" stroke-width="1.5"/><rect x="200" y="38" width="160" height="78" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><rect x="386" y="38" width="160" height="78" rx="5" fill="#FDE8DD" stroke="#C2501A" stroke-width="1.5"/><rect x="14" y="126" width="160" height="54.5" rx="5" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.1" stroke-dasharray="4 3"/><rect x="200" y="126" width="160" height="54.5" rx="5" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.1" stroke-dasharray="4 3"/><rect x="386" y="126" width="160" height="54.5" rx="5" fill="#F3F5F8" stroke="#D5DBE4" stroke-width="1.1" stroke-dasharray="4 3"/><text x="280" y="22" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">目标：看常规安全训练能不能消掉人为植入的后门</text><text x="94" y="66.765" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">植入后门</text><text x="94" y="81.135" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">提示写 2023 年写安全代码，写</text><text x="94" y="94.935" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">2024 年插漏洞</text><text x="280" y="73.665" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">常规安全训练</text><text x="280" y="88.035" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">监督微调、强化学习、对抗训练</text><text x="466" y="73.665" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">后门仍在</text><text x="466" y="88.035" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">写 2024 年时照样插漏洞</text><text x="94" y="149.75" text-anchor="middle" font-size="9.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">信号：演示这种切换行为的样本</text><text x="94" y="163.25" text-anchor="middle" font-size="9.5" font-weight="700" fill="#B86E00" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">目标：按年份切换行为</text><text x="280" y="143" text-anchor="middle" font-size="9.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">信号：安全示范、偏好无害回答的</text><text x="280" y="156.5" text-anchor="middle" font-size="9.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">奖励模型、红队诱出的坏回答</text><text x="280" y="170" text-anchor="middle" font-size="9.5" font-weight="700" fill="#B86E00" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">目标：去掉不安全行为</text><text x="466" y="149.75" text-anchor="middle" font-size="10" font-weight="600" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">这一步不训练</text><text x="466" y="163.25" text-anchor="middle" font-size="9.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">只测试</text><text x="280" y="196.5" text-anchor="middle" font-size="10.5" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">对抗训练反而让模型更会识别触发条件，把行为藏得更好。</text></svg>
