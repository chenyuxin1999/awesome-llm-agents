<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 136" width="560" height="136" role="img" aria-label="六种设计模式"><defs><marker id="ah-cardp2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6577"/></marker></defs><rect x="0" y="0" width="560" height="136" fill="#ffffff"/><rect x="14" y="10" width="170" height="46" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="194" y="10" width="170" height="46" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="374" y="10" width="170" height="46" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="14" y="64" width="170" height="46" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="194" y="64" width="170" height="46" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="374" y="64" width="170" height="46" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><text x="99" y="29.51" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Action-Selector</text><text x="99" y="43.69" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">只选预定义动作</text><text x="279" y="29.51" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Plan-Then-Execute</text><text x="279" y="43.69" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">先定计划再读数据</text><text x="459" y="29.51" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">LLM Map-Reduce</text><text x="459" y="43.69" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">隔离处理每条数据</text><text x="99" y="83.51" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Dual LLM</text><text x="99" y="97.69" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">特权模型 + 隔离模型</text><text x="279" y="83.51" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Code-Then-Execute</text><text x="279" y="97.69" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">写程序处理数据</text><text x="459" y="83.51" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Context-Minimization</text><text x="459" y="97.69" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">用完即删请求</text><text x="280" y="128" text-anchor="middle" font-size="10.5" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">共同原则：读进不可信输入以后，让它触发不了有后果的动作</text></svg>
