<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 136" width="560" height="136" role="img" aria-label="Agents Rule of Two"><defs><marker id="ah-cardp5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6577"/></marker></defs><rect x="0" y="0" width="560" height="136" fill="#ffffff"/><path d="M350,54 L393,54" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-cardp5)"/><rect x="14" y="22" width="100" height="64" rx="5" fill="#FDE8DD" stroke="#C2501A" stroke-width="1.5"/><rect x="130" y="22" width="100" height="64" rx="5" fill="#E9EDF3" stroke="#47546A" stroke-width="1.5"/><rect x="246" y="22" width="100" height="64" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><rect x="396" y="22" width="150" height="64" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><text x="64" y="50.665" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">不可信输入</text><text x="64" y="65.035" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">比如陌生人的邮件</text><text x="180" y="50.665" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">私密数据</text><text x="180" y="65.035" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">比如网盘里的合同</text><text x="296" y="43.765" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">对外行动</text><text x="296" y="58.135" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">比如发邮件、改文</text><text x="296" y="71.935" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">件</text><text x="122" y="58" text-anchor="middle" font-size="14" font-weight="700" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">+</text><text x="238" y="58" text-anchor="middle" font-size="14" font-weight="700" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">+</text><text x="371" y="46" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" style="paint-order:stroke;stroke-width:4px;stroke-linejoin:round" stroke="#ffffff">三件都要</text><text x="471" y="50.665" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">交给人批准</text><text x="471" y="65.035" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">只占两件时可以自己运行</text><text x="280" y="126" text-anchor="middle" font-size="10.5" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">一次会话里，这三件事最多同时具备两件。</text></svg>
