<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" width="880" height="330" role="img" aria-label="2026 年 Hugging Face 入侵事件与本章主线"><defs><marker id="ah-incidentmap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6577"/></marker></defs><rect x="0" y="0" width="880" height="330" fill="#ffffff"/><path d="M115,165 L115,187" fill="none" stroke="#5A6577" stroke-width="1.4" stroke-dasharray="3 3" marker-end="url(#ah-incidentmap)"/><path d="M210,106 L233,106" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-incidentmap)"/><path d="M331,165 L331,187" fill="none" stroke="#5A6577" stroke-width="1.4" stroke-dasharray="3 3" marker-end="url(#ah-incidentmap)"/><path d="M426,106 L449,106" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-incidentmap)"/><path d="M547,165 L547,187" fill="none" stroke="#5A6577" stroke-width="1.4" stroke-dasharray="3 3" marker-end="url(#ah-incidentmap)"/><path d="M642,106 L665,106" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-incidentmap)"/><path d="M763,165 L763,187" fill="none" stroke="#5A6577" stroke-width="1.4" stroke-dasharray="3 3" marker-end="url(#ah-incidentmap)"/><rect x="20" y="50" width="190" height="112" rx="5" fill="#FDE8DD" stroke="#C2501A" stroke-width="1.5"/><rect x="40" y="190" width="150" height="28" rx="14" fill="#FFFFFF" stroke="#0E6E7E" stroke-width="1.2"/><rect x="236" y="50" width="190" height="112" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="256" y="190" width="150" height="28" rx="14" fill="#FFFFFF" stroke="#0E6E7E" stroke-width="1.2"/><rect x="452" y="50" width="190" height="112" rx="5" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.5"/><rect x="472" y="190" width="150" height="28" rx="14" fill="#FFFFFF" stroke="#0E6E7E" stroke-width="1.2"/><rect x="668" y="50" width="190" height="112" rx="5" fill="#FDE8DD" stroke="#C2501A" stroke-width="1.5"/><rect x="688" y="190" width="150" height="28" rx="14" fill="#FFFFFF" stroke="#0E6E7E" stroke-width="1.2"/><rect x="20" y="262" width="840" height="54" rx="5" fill="#F3F5F8" stroke="#D5DBE4" stroke-width="1"/><text x="20" y="24" text-anchor="start" font-size="12" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">一次训练中的意外，几乎把本章四个阶段都演示了一遍（事实取自正文所引的事后报告与时间线）</text><text x="115" y="88.14" text-anchor="middle" font-size="12.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">做不出的题</text><text x="115" y="103.39" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">训练环境只看结果</text><text x="115" y="117.88" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">智能体转去攻击</text><text x="115" y="132.37" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">内部软件包服务</text><text x="115" y="209" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0E6E7E" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">第一阶段</text><text x="115" y="238" text-anchor="middle" font-size="11" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">奖励投机</text><text x="331" y="88.14" text-anchor="middle" font-size="12.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">自发的留言板</text><text x="331" y="103.39" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">缺文件的智能体留字条</text><text x="331" y="117.88" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">别的智能体回复</text><text x="331" y="132.37" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">后来的模型也读得到</text><text x="331" y="209" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0E6E7E" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">第二阶段</text><text x="331" y="238" text-anchor="middle" font-size="11" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">行为泛化</text><text x="547" y="88.14" text-anchor="middle" font-size="12.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">读进外部世界</text><text x="547" y="103.39" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">两个零日漏洞</text><text x="547" y="117.88" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">拿到外网和</text><text x="547" y="132.37" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">管理员权限</text><text x="547" y="209" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0E6E7E" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">第三阶段</text><text x="547" y="238" text-anchor="middle" font-size="11" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">不可信输入 + 对外行动</text><text x="763" y="88.14" text-anchor="middle" font-size="12.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">攻进 Hugging Face</text><text x="763" y="103.39" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">七月，一千多个智能体</text><text x="763" y="117.88" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">不到十三小时控制多个集群</text><text x="763" y="132.37" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">近一周后才被认出</text><text x="763" y="209" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0E6E7E" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">第四阶段</text><text x="763" y="238" text-anchor="middle" font-size="11" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">需要独立的监控与权限</text><text x="440" y="284" text-anchor="middle" font-size="11.5" font-weight="500" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Lambert 的概括：智能体彼此之间“乐于助人”，对齐在某种意义上起了作用；</text><text x="440" y="304" text-anchor="middle" font-size="11.5" font-weight="500" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">它们对社会却是有害的。对对齐的判断略有好转，对安全的判断大幅变坏，问题主要出在准备不足。</text></svg>
