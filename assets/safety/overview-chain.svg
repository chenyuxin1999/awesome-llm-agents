" stroke-width="1.5"/><rect x="523" y="120" width="110" height="56" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="651" y="120" width="110" height="56" rx="5" fill="#E9EDF3" stroke="#47546A" stroke-width="1.5"/><rect x="779" y="120" width="110" height="56" rx="5" fill="#FDE8DD" stroke="#C2501A" stroke-width="1.5"/><rect x="11" y="206" width="238" height="32" rx="4" fill="#DDF3E8" stroke="#26805A" stroke-width="1.2"/><rect x="267" y="246" width="110" height="32" rx="4" fill="#DDF3E8" stroke="#26805A" stroke-width="1.2"/><rect x="395" y="286" width="238" height="32" rx="4" fill="#DDF3E8" stroke="#26805A" stroke-width="1.2"/><rect x="523" y="326" width="238" height="32" rx="4" fill="#DDF3E8" stroke="#26805A" stroke-width="1.2"/><text x="20" y="24" text-anchor="start" font-size="12" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">风险可以在链条的每一段进来；每道防线只负责其中一段，合起来才是纵深防御</text><text x="66" y="144.82" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">人的意图</text><text x="66" y="159.38" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">想要的结果与边界</text><text x="194" y="144.82" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">目标与奖励</text><text x="194" y="159.38" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">写下来的分数</text><text x="322" y="144.82" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">训练得到的行为</text><text x="322" y="159.38" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">模型的默认倾向</text><text x="450" y="144.82" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">读进外部内容</text><text x="450" y="159.38" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">网页、邮件、工具</text><text x="578" y="144.82" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">提出动作</text><text x="578" y="159.38" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">调用工具、改文件</text><text x="706" y="144.82" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">执行层</text><text x="706" y="159.38" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">权限与执行门</text><text x="834" y="144.82" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">后果</text><text x="834" y="159.38" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">泄露、越权、不可逆</text><text x="130" y="54" text-anchor="middle" font-size="11.5" font-weight="600" fill="#C2501A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">目标写不全</text><text x="130" y="72" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">奖励投机</text><text x="322" y="54" text-anchor="middle" font-size="11.5" font-weight="600" fill="#C2501A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">行为在新情境变样</text><text x="322" y="72" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">后门、对齐伪装</text><text x="456.4" y="54" text-anchor="middle" font-size="11.5" font-weight="600" fill="#C2501A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">不可信内容越过指令边界</text><text x="456.4" y="72" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">提示注入</text><text x="642" y="54" text-anchor="middle" font-size="11.5" font-weight="600" fill="#C2501A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">危险动作真的执行</text><text x="642" y="72" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">越权、泄露、不可逆</text><text x="130" y="226" text-anchor="middle" font-size="11" font-weight="700" fill="#26805A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">防线 1：目标设计</text><text x="257" y="226" text-anchor="start" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">独立验收、准则扰动 · 第一阶段 · 分支1</text><text x="322" y="266" text-anchor="middle" font-size="11" font-weight="700" fill="#26805A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">防线 2：训练稳健性</text><text x="385" y="266" text-anchor="start" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">安全训练、辩论 · 第二阶段 · 分支2</text><text x="514" y="306" text-anchor="middle" font-size="11" font-weight="700" fill="#26805A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">防线 3：输入与权限</text><text x="641" y="306" text-anchor="start" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">隔离不可信数据、最小权限 · 第三阶段 · 分支3、6</text><text x="642" y="346" text-anchor="middle" font-size="11" font-weight="700" fill="#26805A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">防线 4：监控与执行门</text><text x="515" y="346" text-anchor="end" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">动作前守卫、审计 · 第四阶段 · 分支3–5</text><text x="20" y="376" text-anchor="start" font-size="11" font-weight="600" fill="#C2501A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">边界（分支8、第五节）：每道防线一旦被部署、被用作训练信号，都会遇到会学习的对手，需要独立验证</text></svg>
