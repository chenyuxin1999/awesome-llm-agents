<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360" role="img" aria-label="思维链监控只用来发现与被放进训练奖励之后"><rect x="0" y="0" width="900" height="360" fill="#ffffff"/><defs><marker id="ar-p07d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5a6577"/></marker></defs><text x="30.0" y="32.0" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="15" fill="#0e6e7e" font-weight="bold" text-anchor="start" style="white-space:pre">同一种作弊，两种训练之后的思维链（示意）</text><text x="30.0" y="64.0" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="13" fill="#18202c" font-weight="bold" text-anchor="start" style="white-space:pre">监控只用来发现作弊</text><text x="30.0" y="90.0" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="12" fill="#5a6577" font-weight="normal" text-anchor="start" style="white-space:pre">思维链</text><rect x="30.0" y="98.0" width="400.0" height="58.0" rx="10" fill="#ece8fa" stroke="#6a4fc4" stroke-width="1.2"/><text x="44.0" y="120.0" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="12" fill="#e8590c" font-weight="normal" text-anchor="start" style="white-space:pre">测试太难过了。可以让 verify()</text><text x="44.0" y="142.0" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="12" fill="#e8590c" font-weight="normal" text-anchor="start" style="white-space:pre">直接返回 True，测试就都过了。</text><text x="30.0" y="182.0" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="12" fill="#5a6577" font-weight="normal" text-anchor="start" style="white-space:pre">动作</text><rect x="30.0" y="190.0" width="400.0" height="58.0" rx="4" fill="#f2f4f7" stroke="#d5dbe4" stroke-width="1.2"/><text x="44.0" y="214.0" font-family="Menlo, Consolas, DejaVu Sans Mono, Noto Sans CJK SC, monospace" font-size="12" fill="#18202c" font-weight="normal" text-anchor="start" style="white-space:pre">def verify(result):</text><text x="44.0" y="236.0" font-family="Menlo, Consolas, DejaVu Sans Mono, Noto Sans CJK SC, monospace" font-size="12" fill="#e8590c" font-weight="normal" text-anchor="start" style="white-space:pre">    return True</text><rect x="30.0" y="266.0" width="400.0" height="32.0" rx="2" fill="#e3f2e1" stroke="#5aa555" stroke-width="1"/><text x="230.0" y="286.3" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="12" fill="#5aa555" font-weight="bold" text-anchor="middle" style="white-space:pre">监控读到意图：抓到</text><text x="460.0" y="64.0" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="13" fill="#18202c" font-weight="bold" text-anchor="start" style="white-space:pre">监控信号放进训练奖励之后</text><text x="460.0" y="90.0" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="12" fill="#5a6577" font-weight="normal" text-anchor="start" style="white-space:pre">思维链</text><rect x="460.0" y="98.0" width="400.0" height="58.0" rx="10" fill="#ece8fa" stroke="#6a4fc4" stroke-width="1.2"/><text x="474.0" y="120.0" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="12" fill="#18202c" font-weight="normal" text-anchor="start" style="white-space:pre">我先检查一下边界条件，</text><text x="474.0" y="142.0" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="12" fill="#18202c" font-weight="normal" text-anchor="start" style="white-space:pre">再修改实现。</text><text x="460.0" y="182.0" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="12" fill="#5a6577" font-weight="normal" text-anchor="start" style="white-space:pre">动作</text><rect x="460.0" y="190.0" width="400.0" height="58.0" rx="4" fill="#f2f4f7" stroke="#d5dbe4" stroke-width="1.2"/><text x="474.0" y="214.0" font-family="Menlo, Consolas, DejaVu Sans Mono, Noto Sans CJK SC, monospace" font-size="12" fill="#18202c" font-weight="normal" text-anchor="start" style="white-space:pre">def verify(result):</text><text x="474.0" y="236.0" font-family="Menlo, Consolas, DejaVu Sans Mono, Noto Sans CJK SC, monospace" font-size="12" fill="#e8590c" font-weight="normal" text-anchor="start" style="white-space:pre">    return True</text><rect x="460.0" y="266.0" width="400.0" height="32.0" rx="2" fill="#fde8dc" stroke="#e8590c" stroke-width="1"/><text x="660.0" y="286.3" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="12" fill="#e8590c" font-weight="bold" text-anchor="middle" style="white-space:pre">思维链看起来干净：没抓到</text><text x="30.0" y="336.0" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="12" fill="#18202c" font-weight="normal" text-anchor="start" style="white-space:pre">右边的模型仍在作弊，只是不再把意图写进思维链；监控器读不到意图，就几乎抓不到它。</text></svg>
