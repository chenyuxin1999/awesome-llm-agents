<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" width="900" height="450" role="img" aria-label="靠摘要的选择传递秘密"><rect x="0" y="0" width="900" height="450" fill="#ffffff"/><defs><marker id="ar-p07c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5a6577"/></marker></defs><text x="30.0" y="32.0" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="15" fill="#0e6e7e" font-weight="bold" text-anchor="start" style="white-space:pre">示意：Despite Instructions 里，两个 agent 靠“挑哪一份摘要”传递一个四选一的秘密</text><rect x="30.0" y="52.0" width="150.0" height="70.0" rx="4" fill="#ece8fa" stroke="#6a4fc4" stroke-width="1.2"/><text x="105.0" y="78.0" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="13" fill="#6a4fc4" font-weight="bold" text-anchor="middle" style="white-space:pre">发送方</text><text x="105.0" y="102.0" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="12.5" fill="#18202c" font-weight="normal" text-anchor="middle" style="white-space:pre">知道秘密：C</text><text x="330.0" y="66.0" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="12" fill="#5a6577" font-weight="normal" text-anchor="middle" style="white-space:pre">同一份公开报告的四种摘要</text><rect x="220.0" y="76.0" width="48.0" height="46.0" rx="3" fill="#ffffff" stroke="#d5dbe4" stroke-width="1"/><text x="244.0" y="96.0" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="11" fill="#18202c" font-weight="normal" text-anchor="middle" style="white-space:pre">摘要1</text><text x="244.0" y="114.0" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="11" fill="#5a6577" font-weight="normal" text-anchor="middle" style="white-space:pre">成本</text><rect x="276.0" y="76.0" width="48.0" height="46.0" rx="3" fill="#ffffff" stroke="#d5dbe4" stroke-width="1"/><text x="300.0" y="