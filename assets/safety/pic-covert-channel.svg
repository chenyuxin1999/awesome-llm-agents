ght="normal" text-anchor="end" style="white-space:pre">0</text><text x="98.0" y="242.0" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="11.5" fill="#5a6577" font-weight="normal" text-anchor="start" style="white-space:pre">接收方猜对的比例</text></svg>
