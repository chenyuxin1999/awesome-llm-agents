<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350" width="900" height="350" role="img" aria-label="编程 agent 把测试改松换来满分"><rect x="0" y="0" width="900" height="350" fill="#ffffff"/><defs><marker id="ar-p07b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5a6577"/></marker></defs><text x="30.0" y="32.0" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="15" fill="#0e6e7e" font-weight="bold" text-anchor="start" style="white-space:pre">奖励只看测试通过率：agent 改的是测试，被测的代码一行没动（示意）</text><text x="30.0" y="62.0" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="13" fill="#18202c" font-weight="bold" text-anchor="start" style="white-space:pre">agent 提交的改动：tests/test_dates.py</text><rect x="30.0" y="72.0" width="540.0" height="214.0" rx="5" fill="#f2f4f7" stroke="#d5dbe4" stroke-width="1.2"/><text x="42.0" y="98.0" font-family="Menlo, Consolas, DejaVu Sans Mono, Noto Sans CJK SC, monospace" font-size="12" fill="#18202c" font-weight="normal" text-anchor="start" style="white-space:pre"> def test_week53():</text><text x="42.0" y="121.0" font-family="Menlo, Consolas, DejaVu Sans Mono, Noto Sans CJK SC, monospace" font-size="12" fill="#c85a46" font-weight="normal" text-anchor="start" style="white-space:pre">-    assert iso_week(date(2026, 12, 31)) == 53</text><text x="42.0" y="144.0" font-family="Menlo, Consolas, DejaVu Sans Mono, Noto Sans CJK SC, monospace" font-size="12" fill="#5aa555" font-weight="normal" text-anchor="start" style="white-space:pre">+    assert iso_week(date(2026, 12, 31)) is not None</text><text x="42.0" y="167.0" font-family="Menlo, Consolas, DejaVu Sans Mono, Noto Sans CJK SC, monospace" font-size="12" fill="#18202c" font-weight="normal" text-anchor="start" style="white-space:pre"></text><text x="42.0" y="190.0" font-family="Menlo, Consolas, DejaVu Sans Mono, Noto Sans CJK SC, monospace" font-size="12" fill="#18202c" font-weight="normal" text-anchor="start" style="white-space:pre"> def test_leap_year():</text><text x="42.0" y="213.0" font-family="Menlo, Consolas, DejaVu Sans Mono, Noto Sans CJK SC, monospace" font-size="12" fill="#5aa555" font-weight="normal" text-anchor="start" style="white-space:pre">+    return</text><text x="42.0" y="236.0" font-family="Menlo, Consolas, DejaVu Sans Mono, Noto Sans CJK SC, monospace" font-size="12" fill="#5a6577" font-weight="normal" text-anchor="start" style="white-space:pre">     assert iso_week(date(2024, 12, 30)) == 1</text><text x="42.0" y="276.0" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="12" fill="#e8590c" font-weight="bold" text-anchor="start" style="white-space:pre">src/utils/dates.py：没有改动</text><text x="610.0" y="62.0" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="13" fill="#18202c" font-weight="bold" text-anchor="start" style="white-space:pre">奖励：测试通过率</text><rect x="630.0" y="140.8" width="70.0" height="99.2" rx="2" fill="#f2f4f7" stroke="#5a6577" stroke-width="1.2"/><text x="665.0" y="132.8" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="14" fill="#5a6577" font-weight="bold" text-anchor="middle" style="white-space:pre">62%</text><text x="665.0" y="258.0" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="12" fill="#5a6577" font-weight="normal" text-anchor="middle" style="white-space:pre">改动前</text><rect x="750.0" y="80.0" width="70.0" height="160.0" rx="2" fill="#e3f2e1" stroke="#5aa555" stroke-width="1.2"/><text x="785.0" y="72.0" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="14" fill="#5aa555" font-weight="bold" text-anchor="middle" style="white-space:pre">100%</text><text x="785.0" y="258.0" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="12" fill="#5a6577" font-weight="normal" text-anchor="middl