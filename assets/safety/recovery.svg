<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="900" height="240" role="img" aria-label="事故之后的恢复链"><defs><marker id="ah-recovery" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6577"/></marker></defs><rect x="0" y="0" width="900" height="240" fill="#ffffff"/><path d="M176,80 L194,80" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-recovery)"/><path d="M353,80 L371,80" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-recovery)"/><path d="M530,80 L548,80" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-recovery)"/><path d="M707,80 L725,80" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-recovery)"/><rect x="20" y="50" width="156" height="60" rx="5" fill="#E9EDF3" stroke="#47546A" stroke-width="1.5"/><rect x="197" y="50" width="156" height="60" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="374" y="50" width="156" height="60" rx="5" fill="#E9EDF3" stroke="#47546A" stroke-width="1.5"/><rect x="551" y="50" width="156" height="60" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><rect x="728" y="50" width="156" height="60" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="20" y="136" width="420" height="88" rx="6" fill="#FFF1DC" stroke="#B86E00" stroke-width="1"/><rect x="460" y="136" width="420" height="88" rx="6" fill="#FDE8DD" stroke="#C2501A" stroke-width="1"/><text x="20" y="24" text-anchor="start" font-size="12" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">恢复远不止重启模型：每一步都要回答“影响到了哪里，怎样撤回来”</text><text x="98" y="76.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">冻结版本</text><text x="98" y="91.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">相关的模型与配置</text><text x="275" y="76.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">检查凭据与产物</text><text x="275" y="91.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">有没有受影响</text><text x="452" y="76.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">撤销权限</text><text x="452" y="91.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">收回不当授权</text><text x="629" y="76.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">回滚状态</text><text x="629" y="91.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">被污染的记忆或技能</text><text x="806" y="76.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">补回归测试</text><text x="806" y="91.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">这次的失败写进测试</text><text x="34" y="160" text-anchor="start" font-size="11.5" font-weight="700" fill="#B86E00" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">日志的分寸</text><text x="34" y="184" text-anchor="start" font-size="11" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">足够支撑事后调查</text><text x="34" y="206" text-anchor="start" font-size="11" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">又不能无限期保存敏感内容</text><text x="474" y="160" text-anchor="start" font-size="11.5" font-weight="700" fill="#C2501A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">模型写的事故总结</text><text x="474" y="184" text-anchor="start" font-size="11" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">需要人工核实</text><text x="474" y="206" text-anchor="start" font-size="11" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">免得错误解释被写进后续训练</text></svg>
