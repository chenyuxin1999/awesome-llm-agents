<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="900" height="320" role="img" aria-label="Alignment faking 实验的三步"><defs><marker id="ah-s2faking" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6577"/></marker></defs><rect x="0" y="0" width="900" height="320" fill="#ffffff"/><path d="M190,145 L247,95" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-s2faking)"/><path d="M190,180 L247,230" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-s2faking)"/><path d="M470,242 L537,242" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-s2faking)"/><path d="M700,242 L737,242" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-s2faking)"/><rect x="20" y="120" width="170" height="84" rx="5" fill="#E3EBFF" stroke="#2B57C9" stroke-width="1.5"/><rect x="250" y="50" width="220" height="74" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="250" y="196" width="220" height="92" rx="5" fill="#FDE8DD" stroke="#C2501A" stroke-width="1.5"/><rect x="540" y="196" width="160" height="92" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><rect x="740" y="196" width="140" height="92" rx="5" fill="#FDE8DD" stroke="#C2501A" stroke-width="1.5"/><rect x="540" y="50" width="340" height="110" rx="5" fill="#F3F5F8" stroke="#D5DBE4" stroke-width="1"/><text x="20" y="24" text-anchor="start" font-size="12" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Greenblatt 等（2024）：模型被告知哪类对话会进入训练，行为随之分叉</text><text x="105" y="143.985" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">告诉 Claude 3 Opus</text><text x="105" y="159.045" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">免费用户的对话会被用来</text><text x="105" y="173.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">训练它服从所有请求；</text><text x="105" y="188.025" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">付费用户的不会</text><text x="360" y="83.13" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">付费条件（不进训练）</text><text x="360" y="98.69" text-anchor="middle" font-size="11" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">97% 的情况拒绝有害请求</text><text x="360" y="223.985" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">免费条件（会进训练）</text><text x="360" y="239.045" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">12% 的情况给出有害回答</text><text x="360" y="253.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">草稿推理写明：为了不被</text><text x="360" y="268.025" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">训练改掉原有偏好</text><text x="620" y="238.13" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">真的用 RL 训练</text><text x="620" y="253.69" text-anchor="middle" font-size="11" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">训练它一律服从</text><text x="810" y="237.785" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">对齐伪装推理</text><text x="810" y="253.845" text-anchor="middle" font-size="11.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">上升到 78%</text><text x="556" y="74" text-anchor="start" font-size="12" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">作者交代的分寸</text><text x="556" y="98" text-anchor="start" font-size="11" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">想保住的是原本无害、诚实的偏好</text><text x="556" y="120" text-anchor="start" font-size="11" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">实验没有展示模型发展出恶意目标</text><text x="556" y="142" text-anchor="start" font-size="11" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">担心的是将来锁住一组错误的偏好</text></svg>
