<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340" role="img" aria-label="致命三要素与 Agents Rule of Two"><defs><marker id="ah-s3trifecta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6577"/></marker></defs><rect x="0" y="0" width="880" height="340" fill="#ffffff"/><circle cx="170" cy="140" r="92" fill="#E9EDF3" fill-opacity="0.55" stroke="#47546A" stroke-width="1.5"/><circle cx="290" cy="140" r="92" fill="#FDE8DD" fill-opacity="0.55" stroke="#C2501A" stroke-width="1.5"/><circle cx="230" cy="236" r="92" fill="#FCE4EC" fill-opacity="0.55" stroke="#B83560" stroke-width="1.5"/><rect x="470" y="50" width="400" height="274" rx="6" fill="#F3F5F8" stroke="#D5DBE4" stroke-width="1"/><rect x="486" y="94" width="30" height="30" rx="15" fill="#FDE8DD" stroke="#C2501A" stroke-width="1.5"/><rect x="486" y="136" width="30" height="30" rx="15" fill="#E9EDF3" stroke="#47546A" stroke-width="1.5"/><rect x="486" y="178" width="30" height="30" rx="15" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><rect x="486" y="230" width="368" height="34" rx="4" fill="#DDF3E8" stroke="#26805A" stroke-width="1.2"/><rect x="486" y="274" width="368" height="34" rx="4" fill="#FDE8DD" stroke="#C2501A" stroke-width="1.2"/><text x="20" y="24" text-anchor="start" font-size="12" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">左：Willison 的致命三要素；右：Meta 的 Rule of Two 把它推广成一条设计规则</text><text x="115" y="120" text-anchor="middle" font-size="12" font-weight="700" fill="#47546A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">接触私密数据</text><text x="345" y="120" text-anchor="middle" font-size="12" font-weight="700" fill="#C2501A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">读到不可信内容</text><text x="230" y="300" text-anchor="middle" font-size="12" font-weight="700" fill="#B83560" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">能向外发送信息</text><text x="230" y="176" text-anchor="middle" font-size="11.5" font-weight="700" fill="#C2501A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" style="paint-order:stroke;stroke-width:4px;stroke-linejoin:round" stroke="#ffffff">三样凑齐</text><text x="230" y="194" text-anchor="middle" font-size="11" font-weight="500" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" style="paint-order:stroke;stroke-width:4px;stroke-linejoin:round" stroke="#ffffff">数据可被带走</text><text x="486" y="76" text-anchor="start" font-size="12" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Agents Rule of Two：一次会话里三件事最多占两件</text><text x="501" y="114" text-anchor="middle" font-size="12" font-weight="700" fill="#C2501A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">A</text><text x="528" y="114" text-anchor="start" font-size="11.5" font-weight="500" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">处理不可信输入</text><text x="501" y="156" text-anchor="middle" font-size="12" font-weight="700" fill="#47546A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">B</text><text x="528" y="156" text-anchor="start" font-size="11.5" font-weight="500" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">接触敏感系统或私密数据</text><text x="501" y="198" text-anchor="middle" font-size="12" font-weight="700" fill="#B83560" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">C</text><text x="528" y="198" text-anchor="start" font-size="11.5" font-weight="500" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">改变状态或对外通信</text><text x="670" y="252" text-anchor="middle" font-size="11.5" font-weight="600" fill="#26805A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">只占两件：可以自主运行</text><text x="670" y="296" text-anchor="middle" font-size="11.5" font-weight="600" fill="#C2501A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">三件都需要：必须有人批准</text></svg>
