CJK SC, Microsoft YaHei, sans-serif">编程题</text><text x="95" y="113.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">一连串任务</text><text x="295" y="91.23" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">不可信强模型</text><text x="295" y="106.29" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">GPT-4 写代码</text><text x="295" y="120.78" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">可能故意藏后门</text><text x="505" y="98.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">可信弱模型</text><text x="505" y="113.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">GPT-3.5 打可疑分</text><text x="765" y="68.72" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">可疑分低：直接提交</text><text x="765" y="130.72" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">可疑分高：可信模型改写</text><text x="765" y="192.72" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">最可疑的少数：交给人审计</text><text x="36" y="260" text-anchor="start" font-size="12.5" font-weight="700" fill="#C2501A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">怎样估计安全性：红队扮演最坏情况的模型</text><text x="36" y="284" text-anchor="start" font-size="11" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">红队为不可信模型设计攻击策略，去找能突破协议的办法；安全性就用这些策略的成功概率来估计。</text><text x="36" y="306" text-anchor="start" font-size="11" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">把模型“人赃并获”地抓住一次，本身就算防守方的胜利；评估测的是协议稳不稳，不去证明模型可信。</text></svg>
