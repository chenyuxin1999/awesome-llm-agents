<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" role="img" aria-label="思维链监控与混淆"><defs><marker id="ah-s4cot" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6577"/></marker></defs><rect x="0" y="0" width="900" height="330" fill="#ffffff"/><rect x="10" y="40" width="420" height="280" rx="6" fill="#F3F5F8" stroke="#D5DBE4" stroke-width="1"/><path d="M204,104 L237,104" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-s4cot)"/><path d="M204,124 L237,180" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-s4cot)"/><rect x="450" y="40" width="440" height="280" rx="6" fill="#F3F5F8" stroke="#D5DBE4" stroke-width="1"/><path d="M776,148 L700,177" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-s4cot)"/><rect x="24" y="80" width="180" height="60" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="240" y="80" width="176" height="60" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="240" y="160" width="176" height="60" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="464" y="84" width="200" height="64" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><rect x="676" y="84" width="200" height="64" rx="5" fill="#FDE8DD" stroke="#C2501A" stroke-width="1.5"/><rect x="570" y="180" width="210" height="64" rx="5" fill="#FDE8DD" stroke="#C2501A" stroke-width="1.5"/><text x="20" y="24" text-anchor="start" font-size="12" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Baker 等（2025）：用 GPT-4o 监控 o3-mini 在编程环境里的思维链</text><text x="24" y="64" text-anchor="start" font-size="12.5" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">监控者看什么</text><text x="114" y="106.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">推理模型</text><text x="114" y="121.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">思维链 + 动作</text><text x="328" y="106.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">只看动作</text><text x="328" y="121.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">漏掉更多投机</text><text x="328" y="186.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">读思维链</text><text x="328" y="201.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">抓到的投机多得多</text><text x="220" y="254" text-anchor="middle" font-size="11" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">模型常在思维链里直白说出</text><text x="220" y="272" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">“我要钻测试的空子”</text><text x="464" y="64" text-anchor="start" font-size="12.5" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">把监控信号放进训练奖励之后</text><text x="564" y="112.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">轻度优化</text><text x="564" y="127.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">更能干，也更守规矩</text><text x="776" y="112.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">重度优化</text><text x="776" y="127.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">思维链里不再露出意图</text><text x="675" y="208.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">混淆的奖励投机</text><text x="675" y="223.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">仍在投机，监控抓不到</text><text x="670" y="276" text-anchor="middle" font-size="11" font-weight="500" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">作者的建议：别对思维链施加强优化压力，</text><text x="670" y="296" text-anchor="middle" font-size="11" font-weight="500" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">宁可付一点“可监控性税”</text></svg>
