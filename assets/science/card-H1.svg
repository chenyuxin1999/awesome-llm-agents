<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 182" width="560" height="182" role="img" aria-label="ChemCrow 结构"><defs><marker id="ah-cardh1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6577"/></marker></defs><rect x="0" y="0" width="560" height="182" fill="#ffffff"/><path d="M127.5,79 L150.5,79" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-cardh1)"/><path d="M267,79 L290,79" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-cardh1)"/><path d="M406.5,79 L429.5,79" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-cardh1)"/><path d="M489.25,118 L489.25,140 L210.25,140 L210.25,121" fill="none" stroke="#5A6577" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#ah-cardh1)"/><rect x="14" y="40" width="113.5" height="78" rx="5" fill="#E3EBFF" stroke="#2B57C9" stroke-width="1.5"/><rect x="153.5" y="40" width="113.5" height="78" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="293" y="40" width="113.5" height="78" rx="5" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.5"/><rect x="432.5" y="40" width="113.5" height="78" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><text x="280" y="17" text-anchor="middle" font-size="10.5" font-weight="600" fill="#2B57C9" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">目标：完成一项模型自己算不准的化学任务</text><text x="70.75" y="75.665" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">一项化学任务</text><text x="70.75" y="90.035" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">比如合成一种驱虫剂</text><text x="210.25" y="75.665" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">模型决定下一步</text><text x="210.25" y="90.035" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">先查什么、再算什么</text><text x="349.75" y="68.765" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">调用专家工具</text><text x="349.75" y="83.135" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">18 个工具算性质、排</text><text x="349.75" y="96.935" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">合成步骤</text><text x="489.25" y="75.665" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">拿回结果</text><text x="489.25" y="90.035" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">工具输出交还给模型</text><text x="349.75" y="135" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" style="paint-order:stroke;stroke-width:4px;stroke-linejoin:round" stroke="#ffffff">按工具结果决定下一步</text><text x="280" y="172" text-anchor="middle" font-size="10.5" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">规划并完成了一种驱虫剂和三种有机催化剂的合成</text></svg>
