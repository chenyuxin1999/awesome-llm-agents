<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" role="img" aria-label="内核只检查交上去的形式命题"><rect x="0" y="0" width="900" height="330" fill="#ffffff"/><defs><marker id="ar-sci-lean" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6577"/></marker></defs><text x="20" y="28" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="14" fill="#18202C" text-anchor="start" font-weight="bold">同一句数学话，两种翻译，Lean 内核只核对交上去的那一种（示意）</text><rect x="20" y="48" width="860" height="44" rx="6" fill="#E3EBFF" stroke="#2B57C9" stroke-width="1.2"/><text x="36" y="76" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="13.5" fill="#2B57C9" text-anchor="start" font-weight="normal">原题：存在无穷多个素数 p，使 p + 2 也是素数。（孪生素数猜想，至今没有人证出来）</text><line x1="250" y1="92" x2="250" y2="118" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ar-sci-lean)"/><line x1="650" y1="92" x2="650" y2="118" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ar-sci-lean)"/><rect x="20" y="122" width="430" height="96" rx="6" fill="#DDF3E8" stroke="#26805A" stroke-width="1.2"/><text x="36" y="146" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="13" fill="#26805A" text-anchor="start" font-weight="bold">忠实的翻译</text><text x="36" y="172" font-family="Menlo, Consolas, PingFang SC, Noto Sans CJK SC, monospace" font-size="13" fill="#18202C" text-anchor="start" font-weight="normal">∀ N : ℕ, ∃ p ≥ N,</text><text x="36" y="194" font-family="Menlo, Consolas, PingFang SC, Noto Sans CJK SC, monospace" font-size="13" fill="#18202C" text-anchor="start" font-weight="normal">  p.Prime ∧ (p + 2).Prime</text><rect x="450" y="122" width="0" height="0" rx="4" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1.2"/><rect x="470" y="122" width="410" height="96" rx="6" fill="#FDE8DD" stroke="#C2501A" stroke-width="1.2"/><text x="486" y="146" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="13" fill="#C2501A" text-anchor="start" font-weight="bold">漏了“无穷多个”的翻译</text><text x="486" y="172" font-family="Menlo, Consolas, PingFang SC, Noto Sans CJK SC, monospace" font-size="13" fill="#18202C" text-anchor="start" font-weight="normal">∃ p : ℕ, p.Prime ∧ (p + 2).Prime</text><text x="486" y="194" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="12.5" fill="#18202C" text-anchor="start" font-weight="normal">证明：取 p = 3，3 和 5 都是素数</text><rect x="20" y="232" width="430" height="40" rx="6" fill="#F3F5F8" stroke="#D5DBE4" stroke-width="1.2"/><text x="36" y="257" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="12.5" fill="#5A6577" text-anchor="start" font-weight="normal">没有人能交出证明，内核无从检查</text><rect x="470" y="232" width="410" height="40" rx="6" fill="#DDF3E8" stroke="#26805A" stroke-width="1.2"/><text x="486" y="257" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="13" fill="#26805A" text-anchor="start" font-weight="bold">Lean 内核：✓ 通过</text><text x="20" y="302" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="13" fill="#C2501A" text-anchor="start" font-weight="normal">内核核对得一点没错，可它证明的是一道小学生都会做的题；翻译这一步只能靠人回头去审。</text></svg>
