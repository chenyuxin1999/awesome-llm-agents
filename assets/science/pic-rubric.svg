<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 390" width="900" height="390" role="img" aria-label="PaperBench 式的分层评分细则"><rect x="0" y="0" width="900" height="390" fill="#ffffff"/><defs><marker id="ar-sci-rubric" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6577"/></marker></defs><text x="20" y="28" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="14" fill="#18202C" text-anchor="start" font-weight="bold">一次复现怎样被拆成可以逐项打分的细则（细则内容、权重与对错都是示意）</text><rect x="330" y="46" width="240" height="40" rx="6" fill="#E3EBFF" stroke="#2B57C9" stroke-width="1.2"/><text x="450" y="71" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="13.5" fill="#2B57C9" text-anchor="middle" font-weight="bold">复现论文：得分 45.8%</text><line x1="450" y1="86" x2="160" y2="128" stroke="#D5DBE4" stroke-width="1.4"/><rect x="40" y="128" width="240" height="46" rx="6" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.2"/><text x="160" y="148" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="12.5" fill="#5B45B0" text-anchor="middle" font-weight="bold">实现方法（权重 2）</text><text x="160" y="166" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="11.5" fill="#5B45B0" text-anchor="middle" font-weight="normal">子项得分 67%</text><line x1="160" y1="174" x2="77.33333333333334" y2="212" stroke="#D5DBE4" stroke-width="1.2"/><rect x="40.0" y="212" width="74.66666666666667" height="54" rx="4" fill="#DDF3E8" stroke="#26805A" stroke-width="1.2"/><text x="77.33333333333334" y="234" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="15" fill="#26805A" text-anchor="middle" font-weight="bold">✓</text><text x="77.33333333333334" y="254" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#26805A" text-anchor="middle" font-weight="normal">实现损失函数</text><line x1="160" y1="174" x2="160.0" y2="212" stroke="#D5DBE4" stroke-width="1.2"/><rect x="122.66666666666667" y="212" width="74.66666666666667" height="54" rx="4" fill="#DDF3E8" stroke="#26805A" stroke-width="1.2"/><text x="160.0" y="234" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="15" fill="#26805A" text-anchor="middle" font-weight="bold">✓</text><text x="160.0" y="254" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="11.5" fill="#26805A" text-anchor="middle" font-weight="normal">实现采样器</text><line x1="160" y1="174" x2="242.66666666666669" y2="212" stroke="#D5DBE4" stroke-width="1.2"/><rect x="205.33333333333334" y="212" width="74.66666666666667" height="54" rx="4" fill="#FDE8DD" stroke="#C2501A" stroke-width="1.2"/><text x="242.66666666666669" y="234" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="15" fill="#C2501A" text-anchor="middle" font-weight="bold">✗</text><text x="242.66666666666669" y="254" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#C2501A" text-anchor="middle" font-weight="normal">实现评估脚本</text><line x1="450" y1="86" x2="460" y2="128" stroke="#D5DBE4" stroke-width="1.4"/><rect x="340" y="128" width="240" height="46" rx="6" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.2"/><text x="460" y="148" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="12.5" fill="#5B45B0" text-anchor="middle" font-weight="bold">跑通实验（权重 1）</text><text x="460" y="166" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="11.5" fill="#5B45B0" text-anchor="middle" font-weight="normal">子项得分 50%</text><line x1="460" y1="174" x2="398.0" y2="212" stroke="#D5DBE4" stroke-width="1.2"/><rect x="340.0" y="212" width="116.0" height="54" rx="4" fill="#DDF3E8" stroke="#26805A" stroke-width="1.2"/><text x="398.0" y="234" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="15" fill="#26805A" text-anchor="middle" font-weight="bold">✓</text><text x="398.0" y="254" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="11.5" fill="#26805A" text-anchor="middle" font-weight="normal">训练跑完</text><line x1="460" y1="174" x2="522.0" y2="212" stroke="#D5DBE4" stroke-width="1.2"/><rect x="464.0" y="212" width="116.0" height="54" rx="4" fill="#FDE8DD" stroke="#C2501A" stroke-width="1.2"/><text x="522.0" y="234" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="15" fill="#C2501A" text-anchor="middle" font-weight="bold">✗</text><text x="522.0" y="254" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#C2501A" text-anchor="middle" font-weight="normal">生成表 2 的数据</text><line x1="450" y1="86" x2="740" y2="128" stroke="#D5DBE4" stroke-width="1.4"/><rect x="620" y="128" width="240" height="46" rx="6" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.2"/><text x="740" y="148" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="12.5" fill="#5B45B0" text-anchor="middle" font-weight="bold">结果对上（权重 1）</text><text x="740" y="166" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="11.5" fill="#5B45B0" text-anchor="middle" font-weight="normal">子项得分 0%</text><line x1="740" y1="174" x2="678.0" y2="212" stroke="#D5DBE4" stroke-width="1.2"/><rect x="620.0" y="212" width="116.0" height="54" rx="4" fill="#FDE8DD" stroke="#C2501A" stroke-width="1.2"/><text x="678.0" y="234" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="15" fill="#C2501A" text-anchor="middle" font-weight="bold">✗</text><text x="678.0" y="254" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#C2501A" text-anchor="middle" font-weight="normal">表 2 趋势一致</text><line x1="740" y1="174" x2="802.0" y2="212" stroke="#D5DBE4" stroke-width="1.2"/><rect x="744.0" y="212" width="116.0" height="54" rx="4" fill="#FDE8DD" stroke="#C2501A" stroke-width="1.2"/><text x="802.0" y="234" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="15" fill="#C2501A" text-anchor="middle" font-weight="bold">✗</text><text x="802.0" y="254" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#C2501A" text-anchor="middle" font-weight="normal">图 3 在误差内</text><text x="20" y="298" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="12.5" fill="#18202C" text-anchor="start" font-weight="normal">叶子由 LLM 裁判逐项判对错；每个父节点的分数是孩子的加权平均：</text><text x="20" y="322" font-family="Menlo, Consolas, PingFang SC, Noto Sans CJK SC, monospace" font-size="13" fill="#2B57C9" text-anchor="start" font-weight="normal">（2 × 67% + 1 × 50% + 1 × 0%）÷ 4 ≈ 45.8%</text><text x="20" y="352" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="12.5" fill="#5A6577" text-anchor="start" font-weight="normal">没复现出结果，也能拿到部分分数；PaperBench 和原作者一起把 20 篇论文拆成了 8,316 个这样的叶子。</text></svg>
