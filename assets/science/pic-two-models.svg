<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350" width="900" height="350" role="img" aria-label="两个模型拟合同一批观察，对新干预的预测不同"><rect x="0" y="0" width="900" height="350" fill="#ffffff"/><defs><marker id="ar-pic-two-models" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6577"/></marker></defs><text x="20" y="28" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="13.5" fill="#18202C" text-anchor="start" font-weight="bold">小球从坡上滚下：两个模型把五次观察拟合得一样好，坡度加倍之后却给出不同的预测（数字为示意）</text><line x1="60" y1="290" x2="420" y2="290" stroke="#18202C" stroke-width="1"/><line x1="60" y1="290" x2="60" y2="70" stroke="#18202C" stroke-width="1"/><text x="240.0" y="320" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="11.5" fill="#5A6577" text-anchor="middle" font-weight="normal">时间 t（秒）</text><text x="52" y="62" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="11.5" fill="#5A6577" text-anchor="start" font-weight="normal">滚过的距离（米）</text><text x="120.0" y="306" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#5A6577" text-anchor="middle" font-weight="normal">1</text><text x="180.0" y="306" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#5A6577" text-anchor="middle" font-weight="normal">2</text><text x="240.0" y="306" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#5A6577" text-anchor="middle" font-weight="normal">3</text><text x="300.0" y="306" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#5A6577" text-anchor="middle" font-weight="normal">4</text><text x="360.0" y="306" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#5A6577" text-anchor="middle" font-weight="normal">5</text><text x="420.0" y="306" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#5A6577" text-anchor="middle" font-weight="normal">6</text><text x="54" y="245.11111111111111" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#5A6577" text-anchor="end" font-weight="normal">10</text><text x="54" y="196.22222222222223" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#5A6577" text-anchor="end" font-weight="normal">20</text><text x="54" y="147.33333333333334" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#5A6577" text-anchor="end" font-weight="normal">30</text><text x="54" y="98.44444444444446" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#5A6577" text-anchor="end" font-weight="normal">40</text><path d="M60.0,290.0 L66.0,290.0 L72.0,289.8 L78.0,289.6 L84.0,289.3 L90.0,289.0 L96.0,288.5 L102.0,288.0 L108.0,287.3 L114.0,286.6 L120.0,285.8 L126.0,285.0 L132.0,284.0 L138.0,283.0 L144.0,281.9 L150.0,280.6 L156.0,279.4 L162.0,278.0 L168.0,276.5 L174.0,275.0 L180.0,273.4 L186.0,271.7 L192.0,269.9 L198.0,268.0 L204.0,266.1 L210.0,264.0 L216.0,261.9 L222.0,259.7 L228.0,257.4 L234.0,255.1 L240.0,252.6 L246.0,250.1 L252.0,247.4 L258.0,244.7 L264.0,242.0 L270.0,239.1 L276.0,236.1 L282.0,233.1 L288.0,230.0 L294.0,226.8 L300.0,223.5 L306.0,220.1 L312.0,216.7 L318.0,213.2 L324.0,209.5 L330.0,205.9 L336.0,202.1 L342.0,198.2 L348.0,194.3 L354.0,190.2 L360.0,186.1 L366.0,181.9 L372.0,177.6 L378.0,173.3 L384.0,168.8 L390.0,164.3 L396.0,159.7 L402.0,155.0 L408.0,150.2 L414.0,145.3 L420.0,140.4" fill="none" stroke="#2B57C9" stroke-width="2"/><path d="M60.0,290.0 L66.0,289.9 L72.0,289.7 L78.0,289.3 L84.0,288.7 L90.0,287.9 L96.0,287.0 L102.0,286.0 L108.0,284.7 L114.0,283.3 L120.0,281.8 L126.0,280.1 L132.0,278.2 L138.0,276.1 L144.0,273.9 L150.0,271.5 L156.0,269.0 L162.0,266.3 L168.0,263.4 L174.0,260.3 L180.0,257.1 L186.0,253.8 L192.0,250.2 L198.0,246.6 L204.0,242.7 L210.0,238.7 L216.0,234.5 L222.0,230.1 L228.0,225.6 L234.0,220.9 L240.0,216.1 L246.0,211.1 L252.0,205.9 L258.0,200.6 L264.0,195.1 L270.0,189.4 L276.0,183.6 L282.0,177.6 L288.0,171.4 L294.0,165.1 L300.0,158.6 L306.0,151.9 L312.0,145.1 L318.0,138.1 L324.0,131.0 L330.0,123.7 L336.0,116.2 L342.0,108.6 L348.0,100.8 L354.0,92.8 L360.0,84.7 L366.0,76.4" fill="none" stroke="#26805A" stroke-width="2" stroke-dasharray="6 4"/><circle cx="120.0" cy="285.84444444444443" r="5" fill="#B86E00" stroke="none" stroke-width="1"/><circle cx="180.0" cy="273.3777777777778" r="5" fill="#B86E00" stroke="none" stroke-width="1"/><circle cx="240.0" cy="252.60000000000002" r="5" fill="#B86E00" stroke="none" stroke-width="1"/><circle cx="300.0" cy="223.51111111111112" r="5" fill="#B86E00" stroke="none" stroke-width="1"/><circle cx="360.0" cy="186.11111111111111" r="5" fill="#B86E00" stroke="none" stroke-width="1"/><circle cx="83.0" cy="90.44444444444446" r="5" fill="#B86E00" stroke="none" stroke-width="1"/><text x="97.0" y="94.44444444444446" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="11" fill="#B86E00" text-anchor="start" font-weight="normal">五次观察（米）：0.85, 3.4, 7.7, 13.6, 21.3</text><line x1="75.0" y1="112.44444444444446" x2="91.0" y2="112.44444444444446" stroke="#2B57C9" stroke-width="2"/><text x="97.0" y="116.44444444444446" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="11" fill="#2B57C9" text-anchor="start" font-weight="normal">模型 A：坡度加倍后仍预测 0.85 × t²</text><line x1="75.0" y1="134.44444444444446" x2="91.0" y2="134.44444444444446" stroke="#26805A" stroke-width="2" stroke-dasharray="5 3"/><text x="97.0" y="138.44444444444446" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="11" fill="#26805A" text-anchor="start" font-weight="normal">模型 B：坡度加倍后预测 1.68 × t²</text><rect x="470" y="60" width="414" height="74" rx="4" fill="#E3EBFF" stroke="#2B57C9" stroke-width="1.2"/><text x="486" y="84" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="12.5" fill="#2B57C9" text-anchor="start" font-weight="bold">模型 A：只记下数据的样子</text><text x="486" y="104" font-family="Menlo, Consolas, PingFang SC, Noto Sans CJK SC, monospace" font-size="12" fill="#18202C" text-anchor="start" font-weight="normal">距离 = 0.85 × t²</text><text x="486" y="124" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="11.5" fill="#5A6577" text-anchor="start" font-weight="normal">式子里没有坡度，坡度变了它也不会变</text><rect x="470" y="146" width="414" height="74" rx="4" fill="#DDF3E8" stroke="#26805A" stroke-width="1.2"/><text x="486" y="170" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="12.5" fill="#26805A" text-anchor="start" font-weight="bold">模型 B：写出机制</text><text x="486" y="190" font-family="Menlo, Consolas, PingFang SC, Noto Sans CJK SC, monospace" font-size="12" fill="#18202C" text-anchor="start" font-weight="normal">距离 = ½ × 9.8 × sin(坡度) × t²</text><text x="486" y="210" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="11.5" fill="#5A6577" text-anchor="start" font-weight="normal">坡度 10° 时正好也是 0.85 × t²</text><rect x="470" y="232" width="414" height="84" rx="4" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.2"/><text x="486" y="256" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="12.5" fill="#B86E00" text-anchor="start" font-weight="bold">能分出高下的是一次新实验</text><text x="486" y="278" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="11.5" fill="#18202C" text-anchor="start" font-weight="normal">把坡度加到 20°：A 说 1 秒滚 0.85 米，</text><text x="486" y="298" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="11.5" fill="#18202C" text-anchor="start" font-weight="normal">B 说 1.68 米，量一次就知道</text></svg>
