ont-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">矩阵乘法张量</text><text x="734" y="129.665" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">强化学习智能体</text><text x="734" y="144.035" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">把找算法变成游戏</text><text x="734" y="195.665" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">张量分解</text><text x="734" y="210.035" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">每个分解就是一个算法</text><text x="734" y="268.565" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">分解可直接核对</text><text x="148" y="316" text-anchor="middle" font-size="10" font-weight="500" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">训练信号：蛋白质数据库里实验测出的已知结构</text><text x="148" y="336" text-anchor="middle" font-size="10" font-weight="500" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">训练目标：预测的原子位置贴近实测结构</text><text x="441" y="316" text-anchor="middle" font-size="10" font-weight="500" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">训练信号：Mizar 证明里实际用到的前提当正例</text><text x="441" y="336" text-anchor="middle" font-size="10" font-weight="500" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">训练目标：把真正有用的前提排到前面</text><text x="734" y="316" text-anchor="middle" font-size="10" font-weight="500" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">训练信号：每多用一次乘法就扣分，没拆干净再重扣</text><text x="734" y="336" text-anchor="middl