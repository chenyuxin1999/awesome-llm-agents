<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" height="430" role="img" aria-label="AlphaEvolve 一轮演化的具体样子"><rect x="0" y="0" width="900" height="430" fill="#ffffff"/><defs><marker id="ar-s1-alphaevolve-real" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6577"/></marker></defs><text x="16" y="24" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="13.5" fill="#18202C" text-anchor="start" font-weight="bold">示意：AlphaEvolve 的一轮，用“正方形里放 6 个点，让最近两点尽量远”当例子（程序、分数为示意）</text><rect x="16" y="40" width="200" height="226" rx="6" fill="#E9EDF3" stroke="#47546A" stroke-width="1.4"/><text x="28" y="62" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="13" fill="#47546A" text-anchor="start" font-weight="bold">① 程序库</text><text x="28" y="82" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#5A6577" text-anchor="start" font-weight="normal">存着打过分的程序</text><rect x="28" y="90" width="176" height="26" rx="3" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1"/><text x="36" y="108" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="11" fill="#18202C" text-anchor="start" font-weight="normal">#12 网格 2×3</text><text x="196" y="108" font-family="Menlo, Consolas, PingFang SC, Noto Sans CJK SC, monospace" font-size="11" fill="#18202C" text-anchor="end" font-weight="normal">0.500</text><rect x="28" y="122" width="176" height="26" rx="3" fill="#FFFFFF" stroke="#26805A" stroke-width="1.6"/><text x="36" y="140" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="11" fill="#18202C" text-anchor="start" font-weight="normal">#17 中间两点拉开</text><text x="196" y="140" font-family="Menlo, Consolas, PingFang SC, Noto Sans CJK SC, monospace" font-size="11" fill="#18202C" text-anchor="end" font-weight="normal">0.539</text><rect x="28" y="154" width="176" height="26" rx="3" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1"/><text x="36" y="172" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="11" fill="#18202C" text-anchor="start" font-weight="normal">#20 随机放</text><text x="196" y="172" font-family="Menlo, Consolas, PingFang SC, Noto Sans CJK SC, monospace" font-size="11" fill="#18202C" text-anchor="end" font-weight="normal">0.412</text><text x="28" y="202" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="11" fill="#26805A" text-anchor="start" font-weight="bold">挑出 #17 当种子</text><rect x="32" y="212" width="44" height="44" rx="0" fill="#FFFFFF" stroke="#9AA5B5" stroke-width="1"/><circle cx="32" cy="256" r="3.6" fill="#5A6577" stroke="none" stroke-width="1"/><circle cx="54.0" cy="256" r="3.6" fill="#5A6577" stroke="none" stroke-width="1"/><circle cx="76" cy="256" r="3.6" fill="#5A6577" stroke="none" stroke-width="1"/><circle cx="32" cy="212" r="3.6" fill="#5A6577" stroke="none" stroke-width="1"/><circle cx="54.0" cy="212" r="3.6" fill="#5A6577" stroke="none" stroke-width="1"/><circle cx="76" cy="212" r="3.6" fill="#5A6577" stroke="none" stroke-width="1"/><text x="88" y="226" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#5A6577" text-anchor="start" font-weight="normal">#12：2×3 网格</text><text x="88" y="244" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#5A6577" text-anchor="start" font-weight="normal">最近距离 0.5</text><rect x="236" y="40" width="200" height="226" rx="6" fill="#E3EBFF" stroke="#2B57C9" stroke-width="1.4"/><text x="248" y="62" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="13" fill="#2B57C9" text-anchor="start" font-weight="bold">② 拼进提示</text><text x="248" y="84" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="11" fill="#18202C" text-anchor="start" font-weight="normal">“下面是得分 0.539 的程序：</text><text x="248" y="104" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="11" fill="#18202C" text-anchor="start" font-weight="normal">  def place(): ...</text><text x="248" y="124" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="11" fill="#18202C" text-anchor="start" font-weight="normal">分数越高越好，</text><text x="248" y="144" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="11" fill="#18202C" text-anchor="start" font-weight="normal">请改出一个更好的版本。”</text><text x="248" y="170" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#5A6577" text-anchor="start" font-weight="normal">把高分程序当参考</text><rect x="456" y="40" width="200" height="226" rx="6" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.4"/><text x="468" y="62" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="13" fill="#5B45B0" text-anchor="start" font-weight="bold">③ Gemini 写修改</text><text x="468" y="84" font-family="Menlo, Consolas, PingFang SC, Noto Sans CJK SC, monospace" font-size="10.5" fill="#18202C" text-anchor="start" font-weight="normal">- 中间两点放在 x=0.5</text><text x="468" y="104" font-family="Menlo, Consolas, PingFang SC, Noto Sans CJK SC, monospace" font-size="10.5" fill="#18202C" text-anchor="start" font-weight="normal">+ 两侧的点上移到 0.67，</text><text x="468" y="124" font-family="Menlo, Consolas, PingFang SC, Noto Sans CJK SC, monospace" font-size="10.5" fill="#18202C" text-anchor="start" font-weight="normal">+ 中间点改到 (0.5,0.33)</text><text x="468" y="154" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#5A6577" text-anchor="start" font-weight="normal">Flash 多出点子，Pro 改得更深</text><rect x="466" y="170" width="180" height="84" rx="4" fill="#F3F5F8" stroke="#D5DBE4" stroke-width="1.2" stroke-dasharray="4 3"/><text x="476" y="190" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#18202C" text-anchor="start" font-weight="normal">这一步不训练：</text><text x="476" y="208" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#18202C" text-anchor="start" font-weight="normal">模型权重不变，进步全靠</text><text x="476" y="226" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#18202C" text-anchor="start" font-weight="normal">程序库里越来越好的参考</text><rect x="676" y="40" width="208" height="226" rx="6" fill="#DDF3E8" stroke="#26805A" stroke-width="1.4"/><text x="688" y="62" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="13" fill="#26805A" text-anchor="start" font-weight="bold">④ 评估器打分</text><text x="688" y="84" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="11" fill="#18202C" text-anchor="start" font-weight="normal">运行新程序 → 6 个点</text><text x="688" y="104" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="11" fill="#18202C" text-anchor="start" font-weight="normal">算 15 对距离，取最小</text><rect x="700" y="118" width="58" height="58" rx="0" fill="#FFFFFF" stroke="#9AA5B5" stroke-width="1"/><circle cx="729.0" cy="118" r="3.6" fill="#26805A" stroke="none" stroke-width="1"/><circle cx="700" cy="137.14" r="3.6" fill="#26805A" stroke="none" stroke-width="1"/><circle cx="758" cy="137.14" r="3.6" fill="#26805A" stroke="none" stroke-width="1"/><circle cx="700" cy="176" r="3.6" fill="#26805A" stroke="none" stroke-width="1"/><circle cx="729.0" cy="156.86" r="3.6" fill="#26805A" stroke="none" stroke-width="1"/><circle cx="758" cy="176" r="3.6" fill="#26805A" stroke="none" stroke-width="1"/><rect x="688" y="184" width="184" height="30" rx="4" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1.2"/><text x="780" y="204" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="12" fill="#26805A" text-anchor="middle" font-weight="bold">#21 得分 0.599</text><text x="688" y="232" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#5A6577" text-anchor="start" font-weight="normal">打分程序由人写好，</text><text x="688" y="248" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#5A6577" text-anchor="start" font-weight="normal">不会学习，也不会变</text><line x1="218" y1="150" x2="234" y2="150" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ar-s1-alphaevolve-real)"/><line x1="438" y1="150" x2="454" y2="150" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ar-s1-alphaevolve-real)"/><line x1="658" y1="150" x2="674" y2="150" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ar-s1-alphaevolve-real)"/><path d="M780,268 L780,290 L116,290 L116,270" fill="none" stroke="#5A6577" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#ar-s1-alphaevolve-real)"/><text x="448" y="284" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="11" fill="#5A6577" text-anchor="middle" font-weight="normal">#21 写回程序库，下一轮可能被挑中当种子</text><rect x="16" y="312" width="868" height="100" rx="6" fill="#FDE8DD" stroke="#C2501A" stroke-width="1.2" stroke-dasharray="4 3"/><text x="30" y="336" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="12.5" fill="#C2501A" text-anchor="start" font-weight="bold">Tao 等人看到的漏洞与修法（第 1 阶段正文）</text><text x="30" y="362" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="11.5" fill="#18202C" text-anchor="start" font-weight="normal">漏洞：评估器把差小于 10⁻⁶ 的两个距离算作相等，搜索就找到“把几个点挤在一起”的候选，得分虚高。</text><text x="30" y="384" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="11.5" fill="#18202C" text-anchor="start" font-weight="normal">修法：改用精确算术判断，或由人写死检查条件；分数只对打分程序真正检查过的那几件事负责。</text></svg>
