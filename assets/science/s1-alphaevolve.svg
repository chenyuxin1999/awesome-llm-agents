<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360" role="img" aria-label="AlphaEvolve 的一轮演化"><defs><marker id="ah-s1alphaevolve" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6577"/></marker></defs><rect x="0" y="0" width="900" height="360" fill="#ffffff"/><path d="M170,146 L211,146" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-s1alphaevolve)"/><path d="M364,146 L407,146" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-s1alphaevolve)"/><path d="M620,146 L665,146" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-s1alphaevolve)"/><path d="M768,182 L768,250 L95,250 L95,185" fill="none" stroke="#5A6577" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#ah-s1alphaevolve)"/><path d="M420,309 L467,309" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-s1alphaevolve)"/><rect x="20" y="110" width="150" height="72" rx="5" fill="#E9EDF3" stroke="#47546A" stroke-width="1.5"/><rect x="214" y="110" width="150" height="72" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><rect x="410" y="70" width="210" height="152" rx="5" fill="#F3F5F8" stroke="#D5DBE4" stroke-width="1.5" stroke-dasharray="4 3"/><rect x="424" y="100" width="182" height="50" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="424" y="160" width="182" height="50" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="668" y="110" width="200" height="72" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="20" y="278" width="400" height="62" rx="5" fill="#FDE8DD" stroke="#C2501A" stroke-width="1.5"/><rect x="470" y="278" width="400" height="62" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><text x="95" y="142.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">程序数据库</text><text x="95" y="157.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">演化算法挑种子</text><text x="289" y="142.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">提示采样器</text><text x="289" y="157.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">把种子程序拼进提示</text><text x="515" y="88" text-anchor="middle" font-size="11.5" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">大模型集合</text><text x="515" y="121.665" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Gemini Flash</text><text x="515" y="136.035" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">尽量扩大点子的覆盖面</text><text x="515" y="181.665" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Gemini Pro</text><text x="515" y="196.035" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">提供有深度的修改建议</text><text x="768" y="142.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">自动评估器</text><text x="768" y="157.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">运行、验证、给每个程序打分</text><text x="643" y="138" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" style="paint-order:stroke;stroke-width:4px;stroke-linejoin:round" stroke="#ffffff">新程序</text><text x="430" y="244" text-anchor="middle" font-size="10.5" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" style="paint-order:stroke;stroke-width:4px;stroke-linejoin:round" stroke="#ffffff">打分后写回数据库，决定下一轮提示用谁当种子</text><text x="450" y="40" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">演化的对象是整个代码库；只适合进展能被客观、自动度量的问题</text><text x="220" y="305.32" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Tao 等的实测：验证器会被钻空子</text><text x="220" y="320.19" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">浮点容差、宽松的打分都会被利用，高分未必是真进展</text><text x="670" y="305.32" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">修法：把验证器做严</text><text x="670" y="320.19" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">改用精确或区间算术、保守的界；需要相当多的人力</text></svg>
