<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" role="img" aria-label="交互式形式证明的一步，用一个小定理演示"><rect x="0" y="0" width="900" height="420" fill="#ffffff"/><defs><marker id="ar-s1-formal-real" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6577"/></marker></defs><text x="16" y="24" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="13.5" fill="#18202C" text-anchor="start" font-weight="bold">示意：LeanDojo 式的一步证明，定理是“任何自然数 n 加 0 还等于 n”</text><rect x="16" y="40" width="200" height="170" rx="6" fill="#E3EBFF" stroke="#2B57C9" stroke-width="1.4"/><text x="28" y="62" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="13" fill="#2B57C9" text-anchor="start" font-weight="bold">① 当前证明状态</text><text x="28" y="90" font-family="Menlo, Consolas, PingFang SC, Noto Sans CJK SC, monospace" font-size="13" fill="#18202C" text-anchor="start" font-weight="normal">n : ℕ</text><text x="28" y="114" font-family="Menlo, Consolas, PingFang SC, Noto Sans CJK SC, monospace" font-size="13" fill="#18202C" text-anchor="start" font-weight="normal">⊢ n + 0 = n</text><text x="28" y="190" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#5A6577" text-anchor="start" font-weight="normal">还剩 1 个目标</text><rect x="236" y="40" width="200" height="170" rx="6" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.4"/><text x="248" y="62" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="13" fill="#B86E00" text-anchor="start" font-weight="bold">② 检索前提</text><text x="248" y="82" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#5A6577" text-anchor="start" font-weight="normal">从数学库约十万条引理里</text><text x="248" y="98" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#5A6577" text-anchor="start" font-weight="normal">挑出最相关的几条：</text><rect x="248" y="116" width="176" height="24" rx="3" fill="#FFFFFF" stroke="#26805A" stroke-width="1.2"/><text x="256" y="133" font-family="Menlo, Consolas, PingFang SC, Noto Sans CJK SC, monospace" font-size="11" fill="#18202C" text-anchor="start" font-weight="normal">Nat.add_zero</text><rect x="248" y="144" width="176" height="24" rx="3" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1.2"/><text x="256" y="161" font-family="Menlo, Consolas, PingFang SC, Noto Sans CJK SC, monospace" font-size="11" fill="#18202C" text-anchor="start" font-weight="normal">Nat.zero_add</text><rect x="248" y="172" width="176" height="24" rx="3" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1.2"/><text x="256" y="189" font-family="Menlo, Consolas, PingFang SC, Noto Sans CJK SC, monospace" font-size="11" fill="#18202C" text-anchor="start" font-weight="normal">Nat.add_comm</text><rect x="456" y="40" width="200" height="170" rx="6" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.4"/><text x="468" y="62" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="13" fill="#5B45B0" text-anchor="start" font-weight="bold">③ 证明器写下一步</text><rect x="468" y="84" width="176" height="30" rx="4" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1.2"/><text x="476" y="104" font-family="Menlo, Consolas, PingFang SC, Noto Sans CJK SC, monospace" font-size="12" fill="#5B45B0" text-anchor="start" font-weight="bold">rw [Nat.add_zero]</text><text x="468" y="138" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#5A6577" text-anchor="start" font-weight="normal">备选：rw [Nat.zero_add]</text><rect x="676" y="40" width="208" height="170" rx="6" fill="#DDF3E8" stroke="#26805A" stroke-width="1.4"/><text x="688" y="62" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="13" fill="#26805A" text-anchor="start" font-weight="bold">④ Lean 执行</text><rect x="688" y="80" width="184" height="30" rx="4" fill="#DDF3E8" stroke="#26805A" stroke-width="1.2"/><text x="780" y="100" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="12" fill="#26805A" text-anchor="middle" font-weight="bold">no goals ✓ 证明完成</text><text x="688" y="134" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#C2501A" text-anchor="start" font-weight="normal">如果用的是备选那条：</text><text x="688" y="151" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#C2501A" text-anchor="start" font-weight="normal">报错“找不到 0 + ?n 的形式”，</text><text x="688" y="168" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#C2501A" text-anchor="start" font-weight="normal">回到 ③ 换一条</text><line x1="218" y1="125" x2="234" y2="125" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ar-s1-formal-real)"/><line x1="438" y1="125" x2="454" y2="125" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ar-s1-formal-real)"/><line x1="658" y1="125" x2="674" y2="125" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ar-s1-formal-real)"/><rect x="16" y="222" width="868" height="50" rx="6" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.2" stroke-dasharray="4 3"/><text x="28" y="242" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="11" fill="#18202C" text-anchor="start" font-weight="normal">训练信号：数学库里人写好的证明，拆成“状态 → 下一步指令”的配对，并标出每一步实际用了哪些引理（检索的正例）</text><text x="28" y="262" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="11" fill="#18202C" text-anchor="start" font-weight="normal">训练目标：检索器把用到的引理排在前面；证明器在给定状态和检索结果时写出人写的那一步。Lean 内核只判对错，它不学习。</text><text x="16" y="300" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="12.5" fill="#18202C" text-anchor="start" font-weight="bold">一个例子：Tao 报告里的有限域 Kakeya 构造，三个系统各管一种正确</text><rect x="16" y="314" width="200" height="56" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.2"/><text x="116" y="336" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="12.5" fill="#B83560" text-anchor="middle" font-weight="bold">AlphaEvolve</text><text x="116" y="356" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="11" fill="#18202C" text-anchor="middle" font-weight="normal">找到一个构造</text><rect x="238" y="314" width="200" height="56" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.2"/><text x="338" y="336" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="12.5" fill="#5B45B0" text-anchor="middle" font-weight="bold">Deep Think</text><text x="338" y="356" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="11" fill="#18202C" text-anchor="middle" font-weight="normal">用自然语言写出证明</text><line x1="218" y1="342" x2="235" y2="342" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ar-s1-formal-real)"/><rect x="460" y="314" width="200" height="56" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.2"/><text x="560" y="336" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="12.5" fill="#5B45B0" text-anchor="middle" font-weight="bold">AlphaProof</text><text x="560" y="356" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="11" fill="#18202C" text-anchor="middle" font-weight="normal">把证明写成 Lean 文件</text><line x1="440" y1="342" x2="457" y2="342" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ar-s1-formal-real)"/><rect x="682" y="314" width="200" height="56" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.2"/><text x="782" y="336" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="12.5" fill="#26805A" text-anchor="middle" font-weight="bold">Lean 内核</text><text x="782" y="356" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="11" fill="#18202C" text-anchor="middle" font-weight="normal">逐步检查，通过</text><line x1="662" y1="342" x2="679" y2="342" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ar-s1-formal-real)"/><text x="16" y="398" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="11" fill="#5A6577" text-anchor="start" font-weight="normal">定理、引理清单和报错文字为示意；训练数据的来源取自 LeanDojo 论文。</text></svg>
