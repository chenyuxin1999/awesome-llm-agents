<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 370" width="900" height="370" role="img" aria-label="AI co-scientist 的假设打磨循环"><defs><marker id="ah-s2coscientist" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6577"/></marker></defs><rect x="0" y="0" width="900" height="370" fill="#ffffff"/><path d="M180,92 L211,92" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-s2coscientist)"/><path d="M630,84 L661,84" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-s2coscientist)"/><path d="M764,112 L764,147" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-s2coscientist)"/><path d="M664,178 L633,178" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-s2coscientist)"/><path d="M530,150 L530,115" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-s2coscientist)"/><path d="M374,92 L427,84" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-s2coscientist)"/><line x1="764" y1="206" x2="764" y2="244" stroke="#C2501A" stroke-width="1.2" stroke-dasharray="3 3"/><path d="M470,206 L470,228 L309,228 L309,247" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-s2coscientist)"/><path d="M214,280 L183,280" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-s2coscientist)"/><rect x="20" y="50" width="160" height="84" rx="5" fill="#DCEFF1" stroke="#0E6E7E" stroke-width="1.5"/><rect x="214" y="56" width="160" height="72" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><rect x="410" y="20" width="470" height="210" rx="5" fill="#F3F5F8" stroke="#D5DBE4" stroke-width="1.5" stroke-dasharray="4 3"/><rect x="430" y="56" width="200" height="56" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="664" y="56" width="200" height="56" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="664" y="150" width="200" height="56" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><rect x="430" y="150" width="200" height="56" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><rect x="664" y="244" width="216" height="50" rx="5" fill="#FDE8DD" stroke="#C2501A" stroke-width="1.5"/><rect x="214" y="250" width="190" height="60" rx="5" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.5"/><rect x="20" y="250" width="160" height="100" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><text x="100" y="73.985" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">科学家</text><text x="100" y="89.045" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">给出研究目标</text><text x="100" y="103.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">可附种子想法</text><text x="100" y="118.025" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">随时用自然语言反馈</text><text x="294" y="81.23" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">监督智能体</text><text x="294" y="96.29" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">拆成研究计划</text><text x="294" y="110.78" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">分配任务与资源</text><text x="645" y="40" text-anchor="middle" font-size="10.5" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">专门智能体在工作队列里循环（生成、反思、排序、演化，另有邻近与元评审）</text><text x="530" y="80.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">生成</text><text x="530" y="95.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">提出新假设</text><text x="764" y="80.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">反思</text><text x="764" y="95.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">像审稿人一样挑毛病</text><text x="764" y="174.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">排序</text><text x="764" y="189.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">两两辩论、打锦标赛，算 Elo</text><text x="530" y="174.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">演化</text><text x="530" y="189.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">把好的假设改得更好</text><text x="772" y="265.01" text-anchor="middle" font-size="10.5" font-weight="400" fill="#C2501A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Elo 是自评：与正确率正相关</text><text x="772" y="279.5" text-anchor="middle" font-size="10.5" font-weight="400" fill="#C2501A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">不能当作独立的真值</text><text x="309" y="276.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">输出</text><text x="309" y="291.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">新假设、研究概览、实验方案</text><text x="100" y="281.985" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">湿实验验收</text><text x="100" y="297.045" text-anchor="middle" font-size="10.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">药物重定位</text><text x="100" y="311.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">新的治疗靶点</text><text x="100" y="326.025" text-anchor="middle" font-size="10.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">抗性机制（cf-PICI）</text><text x="450" y="350" text-anchor="middle" font-size="11" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">没有外部评估器时，用模型之间的比赛产生排序，最后由实验室给出真正的判决</text></svg>
