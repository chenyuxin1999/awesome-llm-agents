<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" role="img" aria-label="长程任务的三个层次与三个子问题"><defs><marker id="ah-lhlevels" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6577"/></marker></defs><rect x="0" y="0" width="900" height="400" fill="#ffffff"/><path d="M294,86 L306,86" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-lhlevels)"/><path d="M586,86 L598,86" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-lhlevels)"/><path d="M212,329 L234,329" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-lhlevels)"/><path d="M432,329 L454,329" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-lhlevels)"/><path d="M652,329 L674,329" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-lhlevels)"/><rect x="16" y="40" width="276" height="92" rx="5" fill="#E3EBFF" stroke="#2B57C9" stroke-width="1.5"/><rect x="104" y="98" width="100" height="26" rx="13" fill="#FFFFFF" stroke="#2B57C9" stroke-width="1.2"/><rect x="308" y="40" width="276" height="92" rx="5" fill="#E9EDF3" stroke="#47546A" stroke-width="1.5"/><rect x="396" y="98" width="100" height="26" rx="13" fill="#FFFFFF" stroke="#47546A" stroke-width="1.2"/><rect x="600" y="40" width="276" height="92" rx="5" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.5"/><rect x="688" y="98" width="100" height="26" rx="13" fill="#FFFFFF" stroke="#B86E00" stroke-width="1.2"/><rect x="16" y="174" width="276" height="58" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="308" y="174" width="276" height="58" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="600" y="174" width="276" height="58" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="16" y="302" width="196" height="54" rx="5" fill="#E3EBFF" stroke="#2B57C9" stroke-width="1.5"/><rect x="236" y="302" width="196" height="54" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="456" y="302" width="196" height="54" rx="5" fill="#E9EDF3" stroke="#47546A" stroke-width="1.5"/><rect x="676" y="302" width="196" height="54" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><text x="16" y="22" text-anchor="start" font-size="12" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">上：Long-Horizon 综述区分的三个层次，各自对应一种能力要求；中：要分开研究的三个子问题；下：本节建议的阅读顺序</text><text x="154" y="64" text-anchor="middle" font-size="12.5" font-weight="700" fill="#2B57C9" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">单个上下文内的多步依赖</text><text x="154" y="86" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">前面读到的条件影响后面的决策</text><text x="154" y="116" text-anchor="middle" font-size="11" font-weight="600" fill="#2B57C9" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">要求：执行</text><text x="446" y="64" text-anchor="middle" font-size="12.5" font-weight="700" fill="#47546A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">跨上下文的状态延续</text><text x="446" y="86" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">任务中断、换窗口后还能接上</text><text x="446" y="116" text-anchor="middle" font-size="11" font-weight="600" fill="#47546A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">要求：恢复</text><text x="738" y="64" text-anchor="middle" font-size="12.5" font-weight="700" fill="#B86E00" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">跨任务的经验积累</text><text x="738" y="86" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">这一次学到的东西留给下一次</text><text x="738" y="116" text-anchor="middle" font-size="11" font-weight="600" fill="#B86E00" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">要求：持续改进</text><text x="16" y="162" text-anchor="start" font-size="12.5" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">三个子问题</text><text x="154" y="199.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">状态保持</text><text x="154" y="214.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">下一步时还记不记得目标、约束和已完成的工作</text><text x="446" y="199.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">长期控制</text><text x="446" y="214.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">环境变化以后动作序列能不能重新规划</text><text x="738" y="199.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">结果验证</text><text x="738" y="214.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">有没有独立证据说明最终目标真的完成了</text><text x="450" y="254" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">记忆能解决第一部分，也能帮上后两部分；比较方法时要固定任务的依赖结构、环境重置规则和总预算</text><text x="16" y="290" text-anchor="start" font-size="12.5" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">阅读顺序</text><text x="114" y="325.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">长程任务总览</text><text x="114" y="340.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Long-Horizon Agents</text><text x="334" y="325.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">系统框架</text><text x="334" y="340.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Agent System &amp; Harness</text><text x="554" y="325.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">长程记忆</text><text x="554" y="340.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Memory: Second Half</text><text x="774" y="325.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">独立验证</text><text x="774" y="340.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Eval &amp; Benchmarking</text><text x="450" y="382" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">总览提供统一坐标，专题综述补上具体机制与测量方法</text></svg>
