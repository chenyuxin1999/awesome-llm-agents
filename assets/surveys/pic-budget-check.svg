<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300" role="img" aria-label="多加一轮自我检查后涨分，要和同样预算的另一种花法比"><defs><marker id="ah-picbudgetcheck" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6577"/></marker></defs><rect x="0" y="0" width="880" height="300" fill="#ffffff"/><rect x="90" y="54" width="110" height="32" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="560" y="56" width="160" height="28" rx="2" fill="#F3F5F8" stroke="#D5DBE4" stroke-width="1.5"/><rect x="90" y="116" width="110" height="32" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="208" y="116" width="110" height="32" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="560" y="118" width="256" height="28" rx="2" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="90" y="178" width="110" height="32" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="208" y="178" width="110" height="32" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="326" y="178" width="60" height="32" rx="5" fill="#E9EDF3" stroke="#47546A" stroke-width="1.5"/><rect x="560" y="180" width="240" height="28" rx="2" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1.5"/><text x="20" y="26" text-anchor="start" font-size="12.5" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">同一个模型、同一批 100 道题</text><text x="560" y="26" text-anchor="start" font-size="11" font-weight="700" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">答对的题数</text><text x="20" y="74" text-anchor="start" font-size="12" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">系统 A</text><text x="145" y="73.41" text-anchor="middle" font-size="11" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">生成</text><text x="430" y="75" text-anchor="start" font-size="11" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">每题调用 1 次</text><text x="726" y="75" text-anchor="start" font-size="12" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">60</text><text x="20" y="136" text-anchor="start" font-size="12" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">系统 B</text><text x="145" y="135.41" text-anchor="middle" font-size="11" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">生成</text><text x="263" y="135.41" text-anchor="middle" font-size="11" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">自我检查并修改</text><text x="430" y="137" text-anchor="start" font-size="11" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">每题调用 2 次</text><text x="822" y="137" text-anchor="start" font-size="12" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">66</text><text x="20" y="198" text-anchor="start" font-size="12" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">系统 C</text><text x="145" y="197.41" text-anchor="middle" font-size="11" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">生成</text><text x="263" y="197.41" text-anchor="middle" font-size="11" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">再生成一个</text><text x="356" y="197.41" text-anchor="middle" font-size="11" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">挑一个</text><text x="430" y="199" text-anchor="start" font-size="11" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">每题调用 2 次</text><text x="806" y="199" text-anchor="start" font-size="12" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">65</text><text x="440" y="248" text-anchor="middle" font-size="11.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">B 比 A 多答对 6 题，看起来是检查有用；可 C 不做任何检查，只把多出的那次调用拿去再生成一个答案，也多答对 5 题。</text><text x="440" y="270" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">把预算对齐以后，真正该归给“检查”的只有 1 题。</text><text x="440" y="292" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">示意：数字是虚构的</text></svg>
