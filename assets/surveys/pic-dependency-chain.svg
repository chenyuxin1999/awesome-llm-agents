<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 302" width="880" height="302" role="img" aria-label="长程任务里一条跨越会话的依赖"><defs><marker id="ah-picdependencychain" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6577"/></marker></defs><rect x="0" y="0" width="880" height="302" fill="#ffffff"/><path d="M82,108 L82,172 L680,172 L680,108" fill="none" stroke="#C2501A" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#ah-picdependencychain)"/><rect x="20" y="50" width="270" height="104" rx="5" fill="#F3F5F8" stroke="#D5DBE4" stroke-width="1.5" stroke-dasharray="5 3"/><rect x="30" y="80" width="18.8333" height="24" fill="#E3EBFF" stroke="#FFFFFF" stroke-width="1"/><rect x="50.8333" y="80" width="18.8333" height="24" fill="#E3EBFF" stroke="#FFFFFF" stroke-width="1"/><rect x="71.6667" y="80" width="18.8333" height="24" fill="#FFF8C4" stroke="#FFFFFF" stroke-width="1"/><rect x="92.5" y="80" width="18.8333" height="24" fill="#E3EBFF" stroke="#FFFFFF" stroke-width="1"/><rect x="113.333" y="80" width="18.8333" height="24" fill="#E3EBFF" stroke="#FFFFFF" stroke-width="1"/><rect x="134.167" y="80" width="18.8333" height="24" fill="#E3EBFF" stroke="#FFFFFF" stroke-width="1"/><rect x="155" y="80" width="18.8333" height="24" fill="#E3EBFF" stroke="#FFFFFF" stroke-width="1"/><rect x="175.833" y="80" width="18.8333" height="24" fill="#E3EBFF" stroke="#FFFFFF" stroke-width="1"/><rect x="196.667" y="80" width="18.8333" height="24" fill="#E3EBFF" stroke="#FFFFFF" stroke-width="1"/><rect x="217.5" y="80" width="18.8333" height="24" fill="#E3EBFF" stroke="#FFFFFF" stroke-width="1"/><rect x="238.333" y="80" width="18.8333" height="24" fill="#E3EBFF" stroke="#FFFFFF" stroke-width="1"/><rect x="259.167" y="80" width="18.8333" height="24" fill="#E3EBFF" stroke="#FFFFFF" stroke-width="1"/><rect x="306" y="50" width="270" height="104" rx="5" fill="#F3F5F8" stroke="#D5DBE4" stroke-width="1.5" stroke-dasharray="5 3"/><rect x="316" y="80" width="18.8333" height="24" fill="#E3EBFF" stroke="#FFFFFF" stroke-width="1"/><rect x="336.833" y="80" width="18.8333" height="24" fill="#E3EBFF" stroke="#FFFFFF" stroke-width="1"/><rect x="357.667" y="80" width="18.8333" height="24" fill="#E3EBFF" stroke="#FFFFFF" stroke-width="1"/><rect x="378.5" y="80" width="18.8333" height="24" fill="#E3EBFF" stroke="#FFFFFF" stroke-width="1"/><rect x="399.333" y="80" width="18.8333" height="24" fill="#E3EBFF" stroke="#FFFFFF" stroke-width="1"/><rect x="420.167" y="80" width="18.8333" height="24" fill="#E3EBFF" stroke="#FFFFFF" stroke-width="1"/><rect x="441" y="80" width="18.8333" height="24" fill="#E3EBFF" stroke="#FFFFFF" stroke-width="1"/><rect x="461.833" y="80" width="18.8333" height="24" fill="#E3EBFF" stroke="#FFFFFF" stroke-width="1"/><rect x="482.667" y="80" width="18.8333" height="24" fill="#E3EBFF" stroke="#FFFFFF" stroke-width="1"/><rect x="503.5" y="80" width="18.8333" height="24" fill="#E3EBFF" stroke="#FFFFFF" stroke-width="1"/><rect x="524.333" y="80" width="18.8333" height="24" fill="#E3EBFF" stroke="#FFFFFF" stroke-width="1"/><rect x="545.167" y="80" width="18.8333" height="24" fill="#E3EBFF" stroke="#FFFFFF" stroke-width="1"/><rect x="592" y="50" width="270" height="104" rx="5" fill="#F3F5F8" stroke="#D5DBE4" stroke-width="1.5" stroke-dasharray="5 3"/><rect x="602" y="80" width="29.25" height="24" fill="#E3EBFF" stroke="#FFFFFF" stroke-width="1"/><rect x="633.25" y="80" width="29.25" height="24" fill="#E3EBFF" stroke="#FFFFFF" stroke-width="1"/><rect x="664.5" y="80" width="29.25" height="24" fill="#FDE8DD" stroke="#FFFFFF" stroke-width="1"/><rect x="695.75" y="80" width="29.25" height="24" fill="#E3EBFF" stroke="#FFFFFF" stroke-width="1"/><rect x="727" y="80" width="29.25" height="24" fill="#E3EBFF" stroke="#FFFFFF" stroke-width="1"/><rect x="758.25" y="80" width="29.25" height="24" fill="#E3EBFF" stroke="#FFFFFF" stroke-width="1"/><rect x="789.5" y="80" width="29.25" height="24" fill="#E3EBFF" stroke="#FFFFFF" stroke-width="1"/><rect x="820.75" y="80" width="29.25" height="24" fill="#FDE8DD" stroke="#FFFFFF" stroke-width="1"/><text x="20" y="26" text-anchor="start" font-size="12.5" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">任务：给一个库加缓存功能，要求“不能改公共接口 parse() 的参数”</text><text x="28" y="66" text-anchor="start" font-size="10.5" font-weight="700" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">会话 1（第 1 到 12 步）</text><text x="81.0833" y="97" text-anchor="middle" font-size="10" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">3</text><text x="303" y="98" text-anchor="middle" font-size="14" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">⇢</text><text x="314" y="66" text-anchor="start" font-size="10.5" font-weight="700" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">会话 2（第 13 到 24 步）</text><text x="589" y="98" text-anchor="middle" font-size="14" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">⇢</text><text x="600" y="66" text-anchor="start" font-size="10.5" font-weight="700" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">会话 3（第 25 到 32 步）</text><text x="679.125" y="97" text-anchor="middle" font-size="10" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">27</text><text x="835.375" y="97" text-anchor="middle" font-size="10" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">32</text><text x="160" y="124" text-anchor="middle" font-size="11" font-weight="600" fill="#B86E00" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">第 3 步读到约束</text><text x="600" y="124" text-anchor="start" font-size="11" font-weight="600" fill="#C2501A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">第 27 步改了 parse() 的参数</text><text x="856" y="140" text-anchor="end" font-size="11" font-weight="600" fill="#C2501A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">第 32 步测试才失败</text><text x="370" y="190" text-anchor="middle" font-size="11.5" font-weight="600" fill="#C2501A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" style="paint-order:stroke;stroke-width:4px;stroke-linejoin:round" stroke="#ffffff">这条依赖跨了 24 步和两次会话切换</text><text x="20" y="222" text-anchor="start" font-size="11.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">会话之间上下文被清空：第 3 步读到的约束，只有被写进外部的状态，第 27 步才看得到。</text><text x="20" y="246" text-anchor="start" font-size="11.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">错误在第 27 步就埋下了，到第 32 步才暴露：要回头找原因，系统得记得每一步改了什么。</text><text x="20" y="270" text-anchor="start" font-size="11.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">同样 32 步，如果每一步都彼此独立，难度就小得多；长程任务难在这种跨很远的依赖，步数本身说明不了难度。</text><text x="440" y="294" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">示意：任务和步数是虚构的</text></svg>
