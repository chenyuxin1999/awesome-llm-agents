<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" role="img" aria-label="三个研究机会落在哪里"><defs><marker id="ah-researchgaps" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6577"/></marker></defs><rect x="0" y="0" width="900" height="330" fill="#ffffff"/><path d="M480,108 L480,123" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-researchgaps)"/><path d="M420,126 L420,111" fill="none" stroke="#5A6577" stroke-width="1.4" stroke-dasharray="3 3" marker-end="url(#ah-researchgaps)"/><path d="M480,190 L480,205" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-researchgaps)"/><path d="M420,208 L420,193" fill="none" stroke="#5A6577" stroke-width="1.4" stroke-dasharray="3 3" marker-end="url(#ah-researchgaps)"/><line x1="298" y1="52" x2="298" y2="264" stroke="#5A6577" stroke-width="1.2"/><line x1="298" y1="52" x2="306" y2="52" stroke="#5A6577" stroke-width="1.2"/><line x1="298" y1="264" x2="306" y2="264" stroke="#5A6577" stroke-width="1.2"/><path d="M276,158 L296,158" fill="none" stroke="#5A6577" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#ah-researchgaps)"/><path d="M584,76 L617,76" fill="none" stroke="#5A6577" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#ah-researchgaps)"/><path d="M584,240 L617,240" fill="none" stroke="#5A6577" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#ah-researchgaps)"/><rect x="316" y="44" width="268" height="64" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><rect x="316" y="126" width="268" height="64" rx="5" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.5"/><rect x="316" y="208" width="268" height="64" rx="5" fill="#E3EBFF" stroke="#2B57C9" stroke-width="1.5"/><rect x="16" y="104" width="260" height="110" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="620" y="36" width="264" height="110" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><rect x="620" y="168" width="264" height="110" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><text x="16" y="22" text-anchor="start" font-size="12" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">中间是三层研究对象；左边的机会落在层与层的连接上，右边两个分别落在改进机制和外部评价上（示意）</text><text x="450" y="72.63" text-anchor="middle" font-size="12.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">改进机制</text><text x="450" y="87.88" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">提出、筛选、验证修改的过程</text><text x="450" y="154.63" text-anchor="middle" font-size="12.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">经验状态</text><text x="450" y="169.88" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">记忆、技能、配置、参数</text><text x="450" y="236.63" text-anchor="middle" font-size="12.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">任务系统</text><text x="450" y="251.88" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">持续执行：观察、动作、状态、验证</text><text x="30" y="128" text-anchor="start" font-size="12.5" font-weight="700" fill="#5B45B0" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">1  统一研究对象</text><text x="30" y="150" text-anchor="start" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">三层分别建模，定义怎样传递信息、怎样相互更新，</text><text x="30" y="165.225" text-anchor="start" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">辨认哪一层发生了可迁移的变化</text><text x="634" y="60" text-anchor="start" font-size="12.5" font-weight="700" fill="#B83560" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">2  识别递归改进</text><text x="634" y="82" text-anchor="start" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">构造必须逐步改变候选生成、数据获取或验证策略</text><text x="634" y="97.225" text-anchor="start" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">才能解决的任务族，和规则固定的系统对照</text><text x="634" y="192" text-anchor="start" font-size="12.5" font-weight="700" fill="#26805A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">3  稳定的外部评价</text><text x="634" y="214" text-anchor="start" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">固定参照与动态挑战结合，写明哪些约束系统不许</text><text x="634" y="229.225" text-anchor="start" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">自己改，新能力由新增测试覆盖</text><text x="450" y="312" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Shunyu Yao 说下半场的重心在于定义问题和设计评测；Lilian Weng 主张把评价器和权限控制放在循环之外</text></svg>
