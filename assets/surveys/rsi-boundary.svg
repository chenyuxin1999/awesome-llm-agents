<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380" role="img" aria-label="持续优化与递归改进的边界"><defs><marker id="ah-rsiboundary" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6577"/></marker></defs><rect x="0" y="0" width="900" height="380" fill="#ffffff"/><rect x="16" y="40" width="420" height="200" rx="5" fill="#F3F5F8" stroke="#D5DBE4" stroke-width="1.5"/><path d="M190,108 L259,108" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-rsiboundary)"/><path d="M337,140 L337,176 L115,176 L115,143" fill="none" stroke="#5A6577" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#ah-rsiboundary)"/><rect x="464" y="40" width="420" height="200" rx="5" fill="#F3F5F8" stroke="#D5DBE4" stroke-width="1.5"/><path d="M638,108 L707,108" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-rsiboundary)"/><path d="M785,140 L785,163" fill="none" stroke="#5A6577" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#ah-rsiboundary)"/><path d="M600,184 L563,184 L563,143" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-rsiboundary)"/><rect x="40" y="90" width="150" height="50" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><rect x="262" y="90" width="150" height="50" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="488" y="90" width="150" height="50" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><rect x="710" y="90" width="150" height="50" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="600" y="166" width="230" height="36" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><rect x="16" y="280" width="208" height="70" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><rect x="238" y="280" width="208" height="70" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="460" y="280" width="208" height="70" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="682" y="280" width="208" height="70" rx="5" fill="#FDE8DD" stroke="#C2501A" stroke-width="1.5"/><text x="16" y="22" text-anchor="start" font-size="12" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">左边改进规则从头到尾没变；右边新版本还会改变下一轮提出、筛选、验证改进的过程，并真正用上</text><text x="30" y="62" text-anchor="start" font-size="12.5" font-weight="700" fill="#5B45B0" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">固定优化器：持续产生更好的候选</text><text x="115" y="111.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">优化器</text><text x="115" y="126.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">规则固定</text><text x="337" y="118.565" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">任务策略 v1, v2, …</text><text x="225" y="100" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" style="paint-order:stroke;stroke-width:4px;stroke-linejoin:round" stroke="#ffffff">修改</text><text x="226" y="170" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" style="paint-order:stroke;stroke-width:4px;stroke-linejoin:round" stroke="#ffffff">分数回传</text><text x="226" y="218" text-anchor="middle" font-size="11" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">优化器本身从头到尾没变</text><text x="478" y="62" text-anchor="start" font-size="12.5" font-weight="700" fill="#B83560" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">递归：改进机制本身被更新并用于下一轮</text><text x="563" y="111.32" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">改进器（当前版本）</text><text x="563" y="126.19" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">提出、筛选、验证</text><text x="785" y="111.32" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">被改进的系统</text><text x="785" y="126.19" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">包括改进器自己</text><text x="673" y="100" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" style="paint-order:stroke;stroke-width:4px;stroke-linejoin:round" stroke="#ffffff">修改</text><text x="715" y="187.565" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">新版改进器参与下一轮</text><text x="530" y="196" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" style="paint-order:stroke;stroke-width:4px;stroke-linejoin:round" stroke="#ffffff">真正用上</text><text x="876" y="226" text-anchor="end" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">对应 DAIR.AI 的“改进改进器”、Weng 阶梯的优化器代码一级</text><text x="16" y="268" text-anchor="start" font-size="12.5" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">在这片区域做研究要分开的四个问题</text><text x="120" y="311.82" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">递归对象</text><text x="120" y="326.38" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">改提示、技能、模型，分别改变了什么能力</text><text x="342" y="311.82" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">递归生效</text><text x="342" y="326.38" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">新版本有没有真正参与产生下一轮</text><text x="564" y="311.82" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">收益归因</text><text x="564" y="326.38" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">同样总预算、没见过的任务上是否依然成立</text><text x="786" y="304.92" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">控制边界</text><text x="786" y="319.48" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">修改者能否篡改评分器、删失败记录、缩小</text><text x="786" y="333.28" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">测试范围</text><text x="450" y="370" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">对照时至少放两个基线：改进规则固定的改进器，以及只加大搜索预算的系统</text></svg>
