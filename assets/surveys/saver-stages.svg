<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360" role="img" aria-label="SAVER 框架与五个阅读阶段"><defs><marker id="ah-saverstages" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6577"/></marker></defs><rect x="0" y="0" width="900" height="360" fill="#ffffff"/><path d="M176,74 L191,74" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-saverstages)"/><path d="M353,74 L368,74" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-saverstages)"/><path d="M530,74 L545,74" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-saverstages)"/><path d="M707,74 L722,74" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-saverstages)"/><line x1="40" y1="196" x2="860" y2="196" stroke="#5A6577" stroke-width="1.4"/><path d="M460,236 L460,206" fill="none" stroke="#5A6577" stroke-width="1.4" stroke-dasharray="3 3" marker-end="url(#ah-saverstages)"/><path d="M650,236 L650,206" fill="none" stroke="#5A6577" stroke-width="1.4" stroke-dasharray="3 3" marker-end="url(#ah-saverstages)"/><path d="M820,236 L820,206" fill="none" stroke="#5A6577" stroke-width="1.4" stroke-dasharray="3 3" marker-end="url(#ah-saverstages)"/><rect x="16" y="44" width="160" height="60" rx="5" fill="#E9EDF3" stroke="#47546A" stroke-width="1.5"/><rect x="193" y="44" width="160" height="60" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><rect x="370" y="44" width="160" height="60" rx="5" fill="#FDE8DD" stroke="#C2501A" stroke-width="1.5"/><rect x="547" y="44" width="160" height="60" rx="5" fill="#E3EBFF" stroke="#2B57C9" stroke-width="1.5"/><rect x="724" y="44" width="160" height="60" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><circle cx="80" cy="196" r="7" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><circle cx="270" cy="196" r="7" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><circle cx="460" cy="196" r="7" fill="#FDE8DD" stroke="#C2501A" stroke-width="1.5"/><circle cx="650" cy="196" r="7" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><circle cx="820" cy="196" r="7" fill="#FDE8DD" stroke="#C2501A" stroke-width="1.5"/><rect x="200" y="236" width="300" height="56" rx="5" fill="#FDE8DD" stroke="#C2501A" stroke-width="1.5"/><rect x="540" y="236" width="340" height="56" rx="5" fill="#FDE8DD" stroke="#C2501A" stroke-width="1.5"/><text x="16" y="22" text-anchor="start" font-size="12" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">上：Safety in Self-Evolving Agents 用 SAVER 把五个要素连在一起；下：读这个方向的实验时可用的五个阶段</text><text x="96" y="70.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">影响载体</text><text x="96" y="85.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">记忆、技能等被写入的地方</text><text x="273" y="70.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">适应方式</text><text x="273" y="85.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">系统怎样学进去</text><text x="450" y="70.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">安全属性的破坏</text><text x="450" y="85.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">哪条约束被打破</text><text x="627" y="70.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">暴露位置</text><text x="627" y="85.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">风险在哪里显现</text><text x="804" y="70.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">响应措施</text><text x="804" y="85.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">检查、追溯、撤销</text><text x="450" y="128" text-anchor="middle" font-size="10.5" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">以状态转变为中心：一次无害的输入，被复用时未必依然安全</text><text x="80" y="178" text-anchor="middle" font-size="12" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">接纳前</text><text x="270" y="178" text-anchor="middle" font-size="12" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">接纳后</text><text x="460" y="178" text-anchor="middle" font-size="12" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">传播后</text><text x="650" y="178" text-anchor="middle" font-size="12" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">修复后</text><text x="820" y="178" text-anchor="middle" font-size="12" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">恢复演化后</text><text x="350" y="260.665" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">传播</text><text x="350" y="275.035" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">测试环境的经验进了长期记忆；合法技能组合后权限越界</text><text x="710" y="260.665" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">修复之后</text><text x="710" y="275.035" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">删掉源头条目，未必清除已派生的技能和记忆，学习恢复后要重新验证</text><text x="450" y="318" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">阅读工具，并不要求每项研究覆盖完整链条；要紧的是讲清自己验证了哪些阶段，</text><text x="450" y="336" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">别把局部的阻断说成长期风险已经解除</text></svg>
