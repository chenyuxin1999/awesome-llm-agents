<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" role="img" aria-label="自演化的两个时间尺度"><defs><marker id="ah-setimescales" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6577"/></marker></defs><rect x="0" y="0" width="900" height="330" fill="#ffffff"/><rect x="16" y="40" width="420" height="160" rx="5" fill="#F3F5F8" stroke="#D5DBE4" stroke-width="1.5"/><path d="M144,106 L173,106" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-setimescales)"/><path d="M286,106 L315,106" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-setimescales)"/><rect x="464" y="40" width="420" height="160" rx="5" fill="#F3F5F8" stroke="#D5DBE4" stroke-width="1.5"/><path d="M590,106 L619,106" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-setimescales)"/><path d="M732,106 L761,106" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-setimescales)"/><rect x="34" y="84" width="110" height="44" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="176" y="84" width="110" height="44" rx="5" fill="#FDE8DD" stroke="#C2501A" stroke-width="1.5"/><rect x="318" y="84" width="104" height="44" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="480" y="84" width="110" height="44" rx="5" fill="#FDE8DD" stroke="#C2501A" stroke-width="1.5"/><rect x="622" y="84" width="110" height="44" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><rect x="764" y="84" width="104" height="44" rx="5" fill="#E9EDF3" stroke="#47546A" stroke-width="1.5"/><rect x="16" y="240" width="204" height="56" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><rect x="236" y="240" width="204" height="56" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="456" y="240" width="204" height="56" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="676" y="240" width="204" height="56" rx="5" fill="#E9EDF3" stroke="#47546A" stroke-width="1.5"/><text x="16" y="22" text-anchor="start" font-size="12" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">先画两个时间尺度，再在图上标出四个量；只有跨任务留下、下次还会被调用的变化，才算积累</text><text x="30" y="62" text-anchor="start" font-size="12.5" font-weight="700" fill="#2B57C9" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">任务内部：交互中的调整</text><text x="89" y="109.72" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">搜索</text><text x="231" y="109.72" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">失败</text><text x="370" y="109.41" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">换关键词再搜</text><text x="30" y="156" text-anchor="start" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">这一次的结果变好了，任务结束后什么也没留下</text><text x="30" y="184" text-anchor="start" font-size="10.5" font-weight="500" fill="#2B57C9" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">对应：多花预算换当前这一题的更好结果</text><text x="478" y="62" text-anchor="start" font-size="12.5" font-weight="700" fill="#B86E00" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">任务之间：可复用状态的更新</text><text x="535" y="109.72" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">失败原因</text><text x="677" y="109.72" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">存成规则</text><text x="816" y="109.72" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">下次调用</text><text x="478" y="156" text-anchor="start" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">修改的是系统某个持久的部分，经过检验才保留</text><text x="478" y="184" text-anchor="start" font-size="10.5" font-weight="500" fill="#B86E00" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">对应：DAIR.AI 合集给自我改进下的定义</text><text x="16" y="228" text-anchor="start" font-size="12.5" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">在图上标出的四个量</text><text x="118" y="264.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">更新目标</text><text x="118" y="279.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">模型、记忆、工具、工作流</text><text x="338" y="264.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">反馈来源</text><text x="338" y="279.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">环境、测试、评语、自评</text><text x="558" y="264.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">接纳规则</text><text x="558" y="279.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">什么样的修改被留下</text><text x="778" y="264.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">保留期限</text><text x="778" y="279.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">留多久，怎样回滚</text><text x="450" y="318" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">不标这四个量，“重试后成绩提高”“参数学到技能”“技能库变大”会被同一个标签盖住</text></svg>
