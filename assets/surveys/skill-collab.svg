<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" role="img" aria-label="技能生命周期与协作失败归因"><defs><marker id="ah-skillcollab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6577"/></marker></defs><rect x="0" y="0" width="900" height="420" fill="#ffffff"/><path d="M128,84 L139,84" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-skillcollab)"/><path d="M253,84 L264,84" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-skillcollab)"/><path d="M378,84 L389,84" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-skillcollab)"/><path d="M503,84 L514,84" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-skillcollab)"/><path d="M628,84 L639,84" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-skillcollab)"/><path d="M753,84 L764,84" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-skillcollab)"/><path d="M822,104 L822,122 L572,122 L572,107" fill="none" stroke="#5A6577" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#ah-skillcollab)"/><path d="M206,298 L240,298" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-skillcollab)"/><path d="M432,298 L466,298" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-skillcollab)"/><path d="M658,298 L692,298" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-skillcollab)"/><path d="M789,320 L789,352 L337,352 L337,323" fill="none" stroke="#5A6577" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#ah-skillcollab)"/><rect x="16" y="64" width="112" height="40" rx="5" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.5"/><rect x="141" y="64" width="112" height="40" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><rect x="266" y="64" width="112" height="40" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="391" y="64" width="112" height="40" rx="5" fill="#E9EDF3" stroke="#47546A" stroke-width="1.5"/><rect x="516" y="64" width="112" height="40" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="641" y="64" width="112" height="40" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><rect x="766" y="64" width="112" height="40" rx="5" fill="#E9EDF3" stroke="#47546A" stroke-width="1.5"/><rect x="16" y="184" width="100" height="36" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="126" y="184" width="100" height="36" rx="5" fill="#E9EDF3" stroke="#47546A" stroke-width="1.5"/><rect x="236" y="184" width="100" height="36" rx="5" fill="#FDE8DD" stroke="#C2501A" stroke-width="1.5"/><rect x="16" y="276" width="190" height="44" rx="5" fill="#E3EBFF" stroke="#2B57C9" stroke-width="1.5"/><rect x="242" y="276" width="190" height="44" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="468" y="276" width="190" height="44" rx="5" fill="#FDE8DD" stroke="#C2501A" stroke-width="1.5"/><rect x="694" y="276" width="190" height="44" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><text x="16" y="22" text-anchor="start" font-size="12" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">上：沿着一个技能一路追踪下去；下：协作失败怎样变成结构改进的输入</text><text x="16" y="52" text-anchor="start" font-size="12" font-weight="700" fill="#47546A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Dynamic Agent Skills（2026-07）的生命周期</text><text x="72" y="87.565" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">证据获取</text><text x="197" y="87.565" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">候选提出</text><text x="322" y="87.565" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">验证接纳</text><text x="447" y="87.565" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">存储</text><text x="572" y="87.565" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">检索组合</text><text x="697" y="87.565" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">维护</text><text x="822" y="87.565" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">可迁移化与治理</text><text x="697" y="137" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" style="paint-order:stroke;stroke-width:4px;stroke-linejoin:round" stroke="#ffffff">失效时回滚、修订</text><text x="16" y="132" text-anchor="start" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">追问：它从哪里来，凭什么入库，什么时候失效，怎样回滚</text><text x="16" y="172" text-anchor="start" font-size="12" font-weight="700" fill="#5B45B0" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">A Systematic Survey of Agentic Skills（2026-08）</text><text x="66" y="205.565" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">架构</text><text x="176" y="205.565" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">生命周期</text><text x="286" y="205.565" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">安全</text><text x="360" y="198" text-anchor="start" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">加上注册、分发与实际执行：能下载并调用，只说明接口可用；</text><text x="360" y="214" text-anchor="start" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">来源、权限、环境兼容、执行检查要一件件单独解决</text><text x="16" y="262" text-anchor="start" font-size="12" font-weight="700" fill="#2B57C9" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Beyond Individual Intelligence：多智能体综述（2026-05）</text><text x="111" y="301.72" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">能力基础</text><text x="337" y="301.72" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">协作集成</text><text x="563" y="301.72" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">失败归因</text><text x="789" y="301.72" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">自演化</text><text x="563" y="347" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" style="paint-order:stroke;stroke-width:4px;stroke-linejoin:round" stroke="#ffffff">结构修改回到分工与交接</text><text x="16" y="384" text-anchor="start" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">失败出现在最后的回答里，原因可能埋在早期分工、遗漏的信息或不可靠的交接中；</text><text x="16" y="402" text-anchor="start" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">是否真的找到因果根源，要回到具体论文看干预、替换或重放的证据</text></svg>
