ill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">越往右，被改变的东西离“产生改进的机制”越近，验证也越难</text><text x="16" y="466" text-anchor="start" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">同一篇综述常常覆盖多层，这里只标它在本章被用来回答的主要问题所在的那一层</text></svg>
