<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360" role="img" aria-label="四篇工作在数据管线上的位置"><defs><marker id="ah-b2selection" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6577"/></marker></defs><rect x="0" y="0" width="900" height="360" fill="#ffffff"/><path d="M218.5,64 L237.5,64" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-b2selection)"/><path d="M439,64 L458,64" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-b2selection)"/><path d="M659.5,64 L678.5,64" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-b2selection)"/><path d="M122,120 L321.75,87" fill="none" stroke="#5A6577" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#ah-b2selection)"/><path d="M340,120 L333.75,87" fill="none" stroke="#5A6577" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#ah-b2selection)"/><path d="M558,120 L566.25,87" fill="none" stroke="#5A6577" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#ah-b2selection)"/><path d="M776,120 L578.25,87" fill="none" stroke="#5A6577" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#ah-b2selection)"/><rect x="20" y="44" width="198.5" height="40" rx="5" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.5"/><rect x="240.5" y="44" width="198.5" height="40" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><rect x="461" y="44" width="198.5" height="40" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="681.5" y="44" width="198.5" height="40" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="20" y="120" width="204" height="112" rx="5" fill="#FDE8DD" stroke="#C2501A" stroke-width="1.5"/><rect x="238" y="120" width="204" height="112" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><rect x="456" y="120" width="204" height="112" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="674" y="120" width="204" height="112" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="20" y="256" width="860" height="46" rx="5" fill="#E9EDF3" stroke="#47546A" stroke-width="1.5"/><text x="20" y="24" text-anchor="start" font-size="12" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">同一条管线上，四篇工作分别处理生成过程、改写、选择和“什么值得学”</text><text x="119.25" y="67.72" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">已有语料与题目</text><text x="339.75" y="67.72" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">生成或改写</text><text x="560.25" y="67.72" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">筛选</text><text x="780.75" y="67.72" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">训练</text><text x="122" y="142" text-anchor="middle" font-size="12" font-weight="700" fill="#C2501A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">答案条件 CoT</text><text x="122" y="164" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">看着答案写推理链，</text><text x="122" y="181" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">朝已知答案“合理化”</text><text x="122" y="198" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">只看最终答案的过滤</text><text x="122" y="215" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">看不出这类过程毛病</text><text x="340" y="142" text-anchor="middle" font-size="12" font-weight="700" fill="#B83560" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">UltraX</text><text x="340" y="164" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">编辑写成插入、删除、</text><text x="340" y="181" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">修改三种程序操作，</text><text x="340" y="198" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">从原文与改写的对应</text><text x="340" y="215" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">构造监督，执行后校验</text><text x="558" y="142" text-anchor="middle" font-size="12" font-weight="700" fill="#26805A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">AutoData</text><text x="558" y="164" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">智能体搜索打分和抽样</text><text x="558" y="181" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">的程序，用代理模型的</text><text x="558" y="198" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">验证反馈反复修改；</text><text x="558" y="215" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">比只调领域权重更丰富</text><text x="776" y="142" text-anchor="middle" font-size="12" font-weight="700" fill="#26805A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Epiplexity</text><text x="776" y="164" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">估计有限算力的学习者</text><text x="776" y="181" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">能提取的结构信息，</text><text x="776" y="198" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">用它定领域采样权重，</text><text x="776" y="215" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">也当生成器的奖励</text><text x="450" y="275.32" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">稳妥的顺序：先排除明显的错误，再比较选择规则</text><text x="450" y="290.19" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">这样收益来自哪里容易定位，也不会把没核对过的材料大规模复制出去</text><text x="450" y="330" text-anchor="middle" font-size="11" font-weight="500" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">四篇的结论都绑定在各自的设置里：小代理模型上找到的规则，未必原样迁移到更大的模型</text></svg>
