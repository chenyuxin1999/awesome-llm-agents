<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" role="img" aria-label="让题目随学生变强"><defs><marker id="ah-b3curriculum" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6577"/></marker></defs><rect x="0" y="0" width="900" height="420" fill="#ffffff"/><path d="M177.6,90 L192.6,90" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-b3curriculum)"/><path d="M353.2,90 L368.2,90" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-b3curriculum)"/><path d="M528.8,90 L543.8,90" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-b3curriculum)"/><path d="M704.4,90 L719.4,90" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-b3curriculum)"/><path d="M250,195 L327,195" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-b3curriculum)"/><path d="M530,195 L607,195" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-b3curriculum)"/><path d="M745,232 L745,252 L135,252 L135,235" fill="none" stroke="#5A6577" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#ah-b3curriculum)"/><path d="M215.5,342 L238.5,342" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-b3curriculum)"/><path d="M437,342 L460,342" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-b3curriculum)"/><path d="M658.5,342 L681.5,342" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-b3curriculum)"/><path d="M782.25,366 L782.25,384 L117.75,384 L117.75,369" fill="none" stroke="#5A6577" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#ah-b3curriculum)"/><rect x="20" y="64" width="157.6" height="52" rx="5" fill="#E3EBFF" stroke="#2B57C9" stroke-width="1.5"/><rect x="195.6" y="64" width="157.6" height="52" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="371.2" y="64" width="157.6" height="52" rx="5" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.5"/><rect x="546.8" y="64" width="157.6" height="52" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><rect x="722.4" y="64" width="157.6" height="52" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="20" y="158" width="230" height="74" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><rect x="330" y="158" width="200" height="74" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="610" y="158" width="270" height="74" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="20" y="318" width="195.5" height="48" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><rect x="241.5" y="318" width="195.5" height="48" rx="5" fill="#DCEFF1" stroke="#0E6E7E" stroke-width="1.5"/><rect x="463" y="318" width="195.5" height="48" rx="5" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.5"/><rect x="684.5" y="318" width="195.5" height="48" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><text x="20" y="24" text-anchor="start" font-size="12" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">三种自适应做法：老师帮一把就撤、出题人和学生一起成长、从零开始生成预训练数据</text><text x="20" y="54" text-anchor="start" font-size="12" font-weight="700" fill="#5B45B0" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">TREK：在学生够不着的地方请老师帮一把</text><text x="98.8" y="87.01" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">通过率很低的题</text><text x="98.8" y="100.88" text-anchor="middle" font-size="9.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">学生采样不到正确解</text><text x="274.4" y="87.01" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">找来候选解</text><text x="274.4" y="100.88" text-anchor="middle" font-size="9.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">外部或同一模型，需验证</text><text x="450" y="87.01" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">按学生似然排序</text><text x="450" y="100.88" text-anchor="middle" font-size="9.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">只留前几个</text><text x="625.6" y="87.01" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">短暂蒸馏</text><text x="625.6" y="100.88" text-anchor="middle" font-size="9.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">前向 KL，拉进探索范围</text><text x="801.2" y="87.01" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">回到在策略 RL</text><text x="801.2" y="100.88" text-anchor="middle" font-size="9.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">GRPO 继续精修</text><text x="20" y="146" text-anchor="start" font-size="12" font-weight="700" fill="#B83560" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">SPADE：同一个模型扮演出题人和学生</text><text x="135" y="184.92" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">环境设计者</text><text x="135" y="199.48" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">写成可执行代码：状态转移、</text><text x="135" y="213.28" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">奖励、验证，Gym 式接口</text><text x="430" y="184.92" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">推理智能体</text><text x="430" y="199.48" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">在环境里行动，</text><text x="430" y="213.28" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">有提示和无提示各做一次</text><text x="745" y="184.92" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">收益差 = 离能力边缘多近</text><text x="745" y="199.48" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">有提示比无提示多拿的奖励，</text><text x="745" y="213.28" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">用来训练设计者</text><text x="288" y="187" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" style="paint-order:stroke;stroke-width:4px;stroke-linejoin:round" stroke="#ffffff">新环境</text><text x="440" y="248" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" style="paint-order:stroke;stroke-width:4px;stroke-linejoin:round" stroke="#ffffff">设计者学会把环境放在学生能力的边缘，同时保持可解</text><text x="20" y="272" text-anchor="start" font-size="10.5" font-weight="500" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">约束生成：从预训练语料里抽文档做 grounding，再加上累积的环境记忆</text><text x="20" y="306" text-anchor="start" font-size="12" font-weight="700" fill="#B86E00" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">零数据自博弈：一个概念验证，探索预训练结构从哪里来</text><text x="117.75" y="338.665" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">生成器</text><text x="117.75" y="353.035" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">提出程序</text><text x="339.25" y="338.665" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">通用图灵机</text><text x="339.25" y="353.035" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">解释程序</text><text x="560.75" y="345.565" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">字节序列</text><text x="782.25" y="338.665" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">学习者</text><text x="782.25" y="353.035" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">逐字节预测</text><text x="450" y="380" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" style="paint-order:stroke;stroke-width:4px;stroke-linejoin:round" stroke="#ffffff">生成器按学习者的能力边缘得到强化学习反馈；检验看对自然数据的迁移</text><text x="450" y="410" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">比较时先问：奖励针对的是任务完成、学习进步，还是序列里可预测的结构？</text></svg>
