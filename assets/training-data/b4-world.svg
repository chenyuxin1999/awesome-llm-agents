<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" role="img" aria-label="先写一道题，还是先搭一个世界"><defs><marker id="ah-b4world" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6577"/></marker></defs><rect x="0" y="0" width="900" height="400" fill="#ffffff"/><rect x="10" y="40" width="300" height="236" rx="6" fill="#F3F5F8" stroke="#D5DBE4" stroke-width="1"/><path d="M160,120 L160,143" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-b4world)"/><rect x="320" y="40" width="570" height="236" rx="6" fill="#F3F5F8" stroke="#D5DBE4" stroke-width="1"/><path d="M398,176 L398,205" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-b4world)"/><path d="M534,176 L534,205" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-b4world)"/><path d="M670,176 L670,205" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-b4world)"/><path d="M806,176 L806,205" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-b4world)"/><rect x="30" y="76" width="260" height="44" rx="5" fill="#E3EBFF" stroke="#2B57C9" stroke-width="1.5"/><rect x="30" y="146" width="260" height="58" rx="5" fill="#DCEFF1" stroke="#0E6E7E" stroke-width="1.5"/><rect x="30" y="222" width="260" height="40" rx="5" fill="#FDE8DD" stroke="#C2501A" stroke-width="1.5"/><rect x="336" y="76" width="124" height="48" rx="5" fill="#DCEFF1" stroke="#0E6E7E" stroke-width="1.5"/><rect x="472" y="76" width="124" height="48" rx="5" fill="#DCEFF1" stroke="#0E6E7E" stroke-width="1.5"/><rect x="608" y="76" width="124" height="48" rx="5" fill="#DCEFF1" stroke="#0E6E7E" stroke-width="1.5"/><rect x="744" y="76" width="124" height="48" rx="5" fill="#DCEFF1" stroke="#0E6E7E" stroke-width="1.5"/><rect x="336" y="136" width="532" height="40" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="336" y="208" width="124" height="40" rx="5" fill="#E3EBFF" stroke="#2B57C9" stroke-width="1.5"/><rect x="472" y="208" width="124" height="40" rx="5" fill="#E3EBFF" stroke="#2B57C9" stroke-width="1.5"/><rect x="608" y="208" width="124" height="40" rx="5" fill="#E3EBFF" stroke="#2B57C9" stroke-width="1.5"/><rect x="744" y="208" width="124" height="40" rx="5" fill="#E3EBFF" stroke="#2B57C9" stroke-width="1.5"/><rect x="20" y="292" width="270" height="70" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><rect x="310" y="292" width="270" height="70" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><rect x="600" y="292" width="280" height="70" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><text x="20" y="24" text-anchor="start" font-size="12" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">左：围绕一道题搭的小环境；右：AgentMercury 先实例化一个业务世界，题目从世界里产生（退款例子为示意）</text><text x="22" y="62" text-anchor="start" font-size="12.5" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">以任务为中心</text><text x="160" y="101.565" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">给订单 1024 退款</text><text x="160" y="171.82" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">只为这道题搭的小环境</text><text x="160" y="186.38" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">只有这张订单、这一个接口</text><text x="160" y="245.255" text-anchor="middle" font-size="10.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">检查方便，换一道题就得重搭</text><text x="332" y="62" text-anchor="start" font-size="12.5" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">先搭世界，再出题（AgentMercury）</text><text x="398" y="96.82" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">实体</text><text x="398" y="111.38" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">订单、顾客</text><text x="534" y="96.82" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">服务</text><text x="534" y="111.38" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">支付、库存</text><text x="670" y="96.82" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">工具</text><text x="670" y="111.38" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">调用接口</text><text x="806" y="96.82" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">持久状态</text><text x="806" y="111.38" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">跨任务保留</text><text x="602" y="159.565" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">跨服务不变量：退款后账单余额必须一致</text><text x="398" y="231.41" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">退款</text><text x="534" y="231.41" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">部分退货</text><text x="670" y="231.41" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">查物流</text><text x="806" y="231.41" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">过期退货</text><text x="605" y="266" text-anchor="middle" font-size="10.5" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">多种任务和轨迹从同一个世界里自然产生，共享状态</text><text x="155" y="316.765" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">ReAgent</text><text x="155" y="331.135" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">约束冲突、不可执行的请求</text><text x="155" y="344.935" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">纳入场景：替代方案或拒绝</text><text x="445" y="316.765" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Skill2Env</text><text x="445" y="331.135" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">从实践者的工作流里</text><text x="445" y="344.935" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">构造可验证的环境</text><text x="740" y="316.765" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">评价也算上不变量</text><text x="740" y="331.135" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">没有重复记录、余额没被破坏、</text><text x="740" y="344.935" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">没有漏掉授权</text><text x="450" y="388" text-anchor="middle" font-size="10.5" font-weight="500" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">DeepSearch-World 则把确定性的搜索与读页环境和“生成、过滤、混合、微调”的自蒸馏循环绑在一起</text></svg>
