<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 410" width="900" height="410" role="img" aria-label="控制难度与区分记忆"><defs><marker id="ah-b6difficulty" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6577"/></marker></defs><rect x="0" y="0" width="900" height="410" fill="#ffffff"/><path d="M176,85 L193,85" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-b6difficulty)"/><path d="M352,85 L369,85" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-b6difficulty)"/><path d="M528,85 L545,85" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-b6difficulty)"/><path d="M704,85 L721,85" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-b6difficulty)"/><path d="M802,108 L802,124 L98,124 L98,111" fill="none" stroke="#5A6577" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#ah-b6difficulty)"/><rect x="20" y="62" width="156" height="46" rx="5" fill="#E9EDF3" stroke="#47546A" stroke-width="1.5"/><rect x="196" y="62" width="156" height="46" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><rect x="372" y="62" width="156" height="46" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><rect x="548" y="62" width="156" height="46" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="724" y="62" width="156" height="46" rx="5" fill="#E9EDF3" stroke="#47546A" stroke-width="1.5"/><rect x="150" y="156" width="104" height="30" rx="5" fill="#E3EBFF" stroke="#2B57C9" stroke-width="1.5"/><rect x="270" y="156" width="104" height="30" rx="5" fill="#E3EBFF" stroke="#2B57C9" stroke-width="1.5"/><rect x="390" y="156" width="104" height="30" rx="5" fill="#E3EBFF" stroke="#2B57C9" stroke-width="1.5"/><rect x="510" y="156" width="104" height="30" rx="5" fill="#E3EBFF" stroke="#2B57C9" stroke-width="1.5"/><rect x="20" y="204" width="420" height="140" rx="5" fill="#F3F5F8" stroke="#D5DBE4" stroke-width="1.5"/><rect x="460" y="204" width="420" height="140" rx="5" fill="#F3F5F8" stroke="#D5DBE4" stroke-width="1.5"/><text x="20" y="24" text-anchor="start" font-size="12" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">上：递归合成长任务；中：按变化来源设计留出条件；下：两种隔离“记住答案”的办法</text><text x="20" y="52" text-anchor="start" font-size="12" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Recursive Synthesis（RST）的一轮</text><text x="98" y="88.565" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">验证过的种子</text><text x="274" y="88.565" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">扩展参考解</text><text x="450" y="81.665" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">重新对齐</text><text x="450" y="96.035" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">指令与验证器</text><text x="626" y="88.565" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">新沙箱中检验</text><text x="802" y="88.565" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">成为下一轮种子</text><text x="450" y="140" text-anchor="middle" font-size="10.5" font-weight="500" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">作者报告 15 轮后参考解的中位行数从 67 增到 374；流程变长，决策复杂度未必跟着增加</text><text x="20" y="172" text-anchor="start" font-size="12" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">留出条件按什么切</text><text x="202" y="174.41" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">实体</text><text x="322" y="174.41" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">模板</text><text x="442" y="174.41" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">工具组合</text><text x="562" y="174.41" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">环境版本</text><text x="640" y="176" text-anchor="start" font-size="10.5" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">报告是哪种变化让表现下降</text><text x="34" y="226" text-anchor="start" font-size="12" font-weight="700" fill="#B86E00" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">LittleLearner：控制过去接触过什么</text><text x="34" y="250" text-anchor="start" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">预训练语料限定在美国小学材料，</text><text x="34" y="269" text-anchor="start" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">排除五年级以上的概念、事实和词汇</text><text x="34" y="288" text-anchor="start" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">后训练注入知识：更会用已有知识，</text><text x="34" y="307" text-anchor="start" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">越界的能力没有普遍提高</text><text x="474" y="226" text-anchor="start" font-size="12" font-weight="700" fill="#0E6E7E" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">ExplorationBench：改变当下的规律</text><text x="474" y="250" text-anchor="start" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">规则与常识冲突、可以执行验证的“外星世界”</text><text x="474" y="269" text-anchor="start" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">（AlienCode、AlienLogic）</text><text x="474" y="288" text-anchor="start" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">模型带着有缺陷的手册去做实验、摸规律，</text><text x="474" y="307" text-anchor="start" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">再解留出的任务</text><text x="450" y="376" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">两者提供不同角度的因果证据；单凭一个总分，还宣布不了开放式科学发现的能力</text></svg>
