<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="900" height="320" role="img" aria-label="行为克隆与 DAgger"><defs><marker id="ah-bcvsdagger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6577"/></marker></defs><rect x="0" y="0" width="900" height="320" fill="#ffffff"/><rect x="10" y="40" width="380" height="270" rx="6" fill="#F3F5F8" stroke="#D5DBE4" stroke-width="1"/><path d="M50,230 L120,200 L190,175 L260,150 L340,120" fill="none" stroke="#26805A" stroke-width="2" marker-end="url(#ah-bcvsdagger)"/><path d="M120,200 L175,215 L235,250 L300,268" fill="none" stroke="#5B45B0" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#ah-bcvsdagger)"/><rect x="400" y="40" width="490" height="270" rx="6" fill="#F3F5F8" stroke="#D5DBE4" stroke-width="1"/><path d="M560,108 L587,108" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-bcvsdagger)"/><path d="M720,108 L737,108" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-bcvsdagger)"/><path d="M808,140 L808,193" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-bcvsdagger)"/><path d="M740,228 L678,228" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-bcvsdagger)"/><path d="M505,228 L490,228 L490,143" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-bcvsdagger)"/><circle cx="50" cy="230" r="6" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><circle cx="120" cy="200" r="6" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><circle cx="190" cy="175" r="6" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><circle cx="260" cy="150" r="6" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><circle cx="175" cy="215" r="6" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><circle cx="235" cy="250" r="6" fill="#FDE8DD" stroke="#C2501A" stroke-width="1.5"/><circle cx="300" cy="268" r="6" fill="#FDE8DD" stroke="#C2501A" stroke-width="1.5"/><rect x="420" y="76" width="140" height="64" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="590" y="76" width="130" height="64" rx="5" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.5"/><rect x="740" y="76" width="136" height="64" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="740" y="196" width="136" height="64" rx="5" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.5"/><rect x="505" y="196" width="170" height="64" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><text x="20" y="24" text-anchor="start" font-size="12" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">左：只模仿专家，学生一偏离就无所适从；右：DAgger 让专家在学生自己走到的状态上给答案；琥珀色小字是退款工单的例子（示意）</text><text x="22" y="62" text-anchor="start" font-size="12.5" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">行为克隆</text><text x="300" y="108" text-anchor="middle" font-size="10.5" font-weight="600" fill="#26805A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">专家走过的路</text><text x="172" y="238" text-anchor="end" font-size="10.5" font-weight="600" fill="#5B45B0" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">一步出错</text><text x="250" y="290" text-anchor="middle" font-size="10.5" font-weight="500" fill="#C2501A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">进入专家几乎没到过的状态，错误越滚越大</text><text x="200" y="88" text-anchor="middle" font-size="11" font-weight="500" fill="#B86E00" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">信号：专家每步的动作，可状态只来自专家走过的路</text><text x="412" y="62" text-anchor="start" font-size="12.5" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">DAgger 的一轮</text><text x="490" y="97.92" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">① 用当前策略去跑</text><text x="490" y="112.48" text-anchor="middle" font-size="10" font-weight="400" fill="#8A5300" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">学生处理订单 3301</text><text x="490" y="126.28" text-anchor="middle" font-size="10" font-weight="400" fill="#8A5300" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">第 2 步就要退款</text><text x="655" y="97.92" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">② 记下到达的状态</text><text x="655" y="112.48" text-anchor="middle" font-size="10" font-weight="400" fill="#8A5300" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">“已查订单，</text><text x="655" y="126.28" text-anchor="middle" font-size="10" font-weight="400" fill="#8A5300" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">还没查下单天数”</text><text x="808" y="97.92" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">③ 专家给出动作</text><text x="808" y="112.48" text-anchor="middle" font-size="10" font-weight="400" fill="#8A5300" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">人工客服：</text><text x="808" y="126.28" text-anchor="middle" font-size="10" font-weight="400" fill="#8A5300" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">先查下单天数</text><text x="808" y="217.92" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">④ 并入数据集</text><text x="808" y="232.48" text-anchor="middle" font-size="10" font-weight="400" fill="#8A5300" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">（这个状态，</text><text x="808" y="246.28" text-anchor="middle" font-size="10" font-weight="400" fill="#8A5300" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">查下单天数）</text><text x="590" y="217.92" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">⑤ 在全部数据上重训</text><text x="590" y="232.48" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">信号：③ 里专家给的动作</text><text x="590" y="246.28" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">目标：学生照着做</text><text x="645" y="290" text-anchor="middle" font-size="10.5" font-weight="500" fill="#C2501A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">代价：每一轮都要专家在线指导</text><text x="645" y="164" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">数据分布跟着学生走</text><text x="645" y="182" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">①到④不训练，只收集和标注数据</text></svg>
