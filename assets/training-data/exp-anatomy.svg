<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380" role="img" aria-label="一个强化学习环境由什么组成"><defs><marker id="ah-expanatomy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6577"/></marker></defs><rect x="0" y="0" width="900" height="380" fill="#ffffff"/><path d="M180,112 L207,112" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-expanatomy)"/><path d="M350,112 L377,112" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-expanatomy)"/><path d="M450,140 L450,157" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-expanatomy)"/><path d="M196,308 L217,308" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-expanatomy)"/><path d="M576,308 L597,308" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-expanatomy)"/><rect x="20" y="44" width="520" height="190" rx="6" fill="#DCEFF1" stroke="#0E6E7E" stroke-width="1.5"/><rect x="40" y="84" width="140" height="56" rx="5" fill="#E3EBFF" stroke="#2B57C9" stroke-width="1.5"/><rect x="210" y="84" width="140" height="56" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="380" y="84" width="140" height="56" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="40" y="160" width="480" height="56" rx="5" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.5"/><rect x="570" y="44" width="310" height="190" rx="5" fill="#E9EDF3" stroke="#47546A" stroke-width="1.5"/><rect x="586" y="84" width="278" height="28" rx="4" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1"/><rect x="586" y="118" width="278" height="28" rx="4" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1"/><rect x="586" y="152" width="278" height="28" rx="4" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1"/><rect x="586" y="186" width="278" height="28" rx="4" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1"/><rect x="20" y="280" width="176" height="56" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="220" y="280" width="356" height="56" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="600" y="280" width="280" height="56" rx="5" fill="#DCEFF1" stroke="#0E6E7E" stroke-width="1.5"/><text x="20" y="24" text-anchor="start" font-size="12" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Epoch 访谈里的现场：任务、环境、评分器，以及这门生意的先后顺序和价钱</text><text x="34" y="66" text-anchor="start" font-size="11.5" font-weight="700" fill="#0E6E7E" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">环境：动作空间 + 周围的上下文（常常是一个 Docker 容器）</text><text x="110" y="108.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">任务</text><text x="110" y="123.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">一段提示</text><text x="280" y="108.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">被训练的模型</text><text x="280" y="123.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">多次尝试</text><text x="450" y="108.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">评分器</text><text x="450" y="123.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">判对错、打分</text><text x="280" y="184.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">通过率</text><text x="280" y="199.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">不能是零也不能是百分之百；接近七成的任务可以退役</text><text x="725" y="66" text-anchor="middle" font-size="12" font-weight="700" fill="#47546A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Epoch 记录的价钱</text><text x="596" y="103" text-anchor="start" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">一个网站复刻品</text><text x="854" y="103" text-anchor="end" font-size="11" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">约 2 万美元</text><text x="596" y="137" text-anchor="start" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">高保真 Slack 复刻</text><text x="854" y="137" text-anchor="end" font-size="11" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">约 30 万美元</text><text x="596" y="171" text-anchor="start" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">单个任务</text><text x="854" y="171" text-anchor="end" font-size="11" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">200 到 2,000 美元</text><text x="596" y="205" text-anchor="start" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">每个任务的训练算力</text><text x="854" y="205" text-anchor="end" font-size="11" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">约 2,400 美元</text><text x="725" y="226" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">最后一项是 Mechanize 的估算</text><text x="20" y="266" text-anchor="start" font-size="12" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">领域的先后顺序</text><text x="108" y="304.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">数学</text><text x="108" y="319.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">答案好验证、题目好造</text><text x="398" y="304.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">代码</text><text x="398" y="319.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">从 SWE-bench 修 bug，到接入 GitHub、Linear</text><text x="740" y="304.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">企业工作流</text><text x="740" y="319.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">报销、透视表、客户管理：增长最快</text><text x="450" y="364" text-anchor="middle" font-size="11" font-weight="600" fill="#C2501A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">从业者最在意的质量问题：第一是奖励作弊，其次是难度校准</text></svg>
