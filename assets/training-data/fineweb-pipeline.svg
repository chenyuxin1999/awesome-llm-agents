<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360" role="img" aria-label="FineWeb 的数据处理与消融"><defs><marker id="ah-finewebpipeline" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6577"/></marker></defs><rect x="0" y="0" width="900" height="360" fill="#ffffff"/><path d="M190,75 L211,75" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-finewebpipeline)"/><path d="M336,75 L357,75" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-finewebpipeline)"/><path d="M482,75 L503,75" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-finewebpipeline)"/><path d="M628,75 L687,75" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-finewebpipeline)"/><path d="M275,140 L275,105" fill="none" stroke="#5A6577" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#ah-finewebpipeline)"/><path d="M421,140 L421,105" fill="none" stroke="#5A6577" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#ah-finewebpipeline)"/><path d="M567,140 L567,105" fill="none" stroke="#5A6577" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#ah-finewebpipeline)"/><line x1="20" y1="214" x2="880" y2="214" stroke="#D5DBE4" stroke-width="1"/><path d="M216,277 L237,277" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-finewebpipeline)"/><path d="M436,277 L457,277" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-finewebpipeline)"/><path d="M656,277 L677,277" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-finewebpipeline)"/><rect x="20" y="48" width="170" height="54" rx="5" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.5"/><rect x="214" y="48" width="122" height="54" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><rect x="360" y="48" width="122" height="54" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><rect x="506" y="48" width="122" height="54" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><rect x="690" y="48" width="190" height="54" rx="5" fill="#E9EDF3" stroke="#47546A" stroke-width="1.5"/><rect x="214" y="140" width="414" height="50" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="650" y="132" width="230" height="66" rx="5" fill="#FDE8DD" stroke="#C2501A" stroke-width="1.5"/><rect x="20" y="250" width="196" height="54" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="240" y="250" width="196" height="54" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><rect x="460" y="250" width="196" height="54" rx="5" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.5"/><rect x="680" y="250" width="196" height="54" rx="5" fill="#E9EDF3" stroke="#47546A" stroke-width="1.5"/><text x="20" y="24" text-anchor="start" font-size="12" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">每一个处理步骤都用小模型消融来决定去留；下排是用大模型打分筛出 FineWeb-Edu 的支线</text><text x="105" y="78.72" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">96 个 CommonCrawl 快照</text><text x="275" y="78.72" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">正文抽取</text><text x="421" y="78.72" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">过滤规则</text><text x="567" y="78.72" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">逐快照去重</text><text x="785" y="71.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">FineWeb</text><text x="785" y="86.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">约 15 万亿 token 英文</text><text x="421" y="161.32" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">每一步都做消融</text><text x="421" y="176.19" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">两份数据只差这一步 → 各训一个 18 亿参数小模型 → 比下游表现 → 留或不留</text><text x="765" y="154.61" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">全局去重几乎没变好</text><text x="765" y="168.79" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">留下的多是广告、关键词列表</text><text x="765" y="182.59" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">逐快照去重反而更好</text><text x="20" y="236" text-anchor="start" font-size="12" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">FineWeb-Edu 支线</text><text x="118" y="273.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Llama-3-70B-Instruct</text><text x="118" y="288.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">给 50 万篇网页打 0–5 分</text><text x="338" y="273.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">训练小分类器</text><text x="338" y="288.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">学会这个打分</text><text x="558" y="273.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">筛全部语料</text><text x="558" y="288.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">阈值取 3</text><text x="778" y="273.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">FineWeb-Edu</text><text x="778" y="288.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">约 1.3 万亿 token</text><text x="450" y="336" text-anchor="middle" font-size="11" font-weight="500" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">MMLU 这类知识密集的基准上，用比 C4、Dolma 少约十倍的 token 达到相近成绩</text></svg>
