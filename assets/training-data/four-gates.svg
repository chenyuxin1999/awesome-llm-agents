<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" width="900" height="250" role="img" aria-label="退款客服要过的四道关"><defs><marker id="ah-fourgates" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6577"/></marker></defs><rect x="0" y="0" width="900" height="250" fill="#ffffff"/><path d="M133,105 L147,105" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-fourgates)"/><path d="M319,105 L333,105" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-fourgates)"/><path d="M505,105 L519,105" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-fourgates)"/><path d="M691,105 L705,105" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-fourgates)"/><rect x="20" y="70" width="110" height="70" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="150" y="56" width="172" height="98" rx="5" fill="#DCEFF1" stroke="#0E6E7E" stroke-width="1.5"/><rect x="336" y="56" width="172" height="98" rx="5" fill="#E3EBFF" stroke="#2B57C9" stroke-width="1.5"/><rect x="522" y="56" width="172" height="98" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="708" y="56" width="172" height="98" rx="5" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.5"/><text x="20" y="24" text-anchor="start" font-size="12" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">回到开头的网店客服：四道关口依次对应下面四个开放问题</text><text x="75" y="108.72" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">客服模型</text><text x="236" y="101.665" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">① 像样的练习场</text><text x="236" y="116.035" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">订单、支付、库存、政策彼此一致</text><text x="236" y="176" text-anchor="middle" font-size="10.5" font-weight="600" fill="#0E6E7E" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">第四阶段</text><text x="422" y="101.665" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">② 题目在能力边缘</text><text x="422" y="116.035" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">全会的和全不会的都没用</text><text x="422" y="176" text-anchor="middle" font-size="10.5" font-weight="600" fill="#2B57C9" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">课程与难度</text><text x="608" y="101.665" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">③ 学到规则，没钻漏洞</text><text x="608" y="116.035" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">退款后余额必须对得上</text><text x="608" y="176" text-anchor="middle" font-size="10.5" font-weight="600" fill="#26805A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">边界：验证</text><text x="794" y="101.665" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">④ 经验安全回流</text><text x="794" y="116.035" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">经验流回训练，隐私不跟进来</text><text x="794" y="176" text-anchor="middle" font-size="10.5" font-weight="600" fill="#B86E00" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">真实反馈</text><text x="450" y="222" text-anchor="middle" font-size="11" font-weight="500" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">四道关口上各有大片空白，适合作为选题的起点</text></svg>
