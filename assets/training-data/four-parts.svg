<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 350" width="880" height="350" role="img" aria-label="任务、环境、轨迹、验证器"><defs><marker id="ah-fourparts" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6577"/></marker></defs><rect x="0" y="0" width="880" height="350" fill="#ffffff"/><path d="M190,87 L237,87" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-fourparts)"/><path d="M390,78 L447,78" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-fourparts)"/><path d="M450,98 L393,98" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-fourparts)"/><path d="M650,87 L697,87" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-fourparts)"/><path d="M315,124 L315,157" fill="none" stroke="#5A6577" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#ah-fourparts)"/><path d="M560,124 L560,157" fill="none" stroke="#5A6577" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#ah-fourparts)"/><path d="M650,185 L780,185 L780,127" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-fourparts)"/><rect x="20" y="50" width="170" height="74" rx="5" fill="#E3EBFF" stroke="#2B57C9" stroke-width="1.5"/><rect x="240" y="50" width="150" height="74" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="450" y="50" width="200" height="74" rx="5" fill="#DCEFF1" stroke="#0E6E7E" stroke-width="1.5"/><rect x="700" y="50" width="160" height="74" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="240" y="160" width="410" height="50" rx="5" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.5"/><rect x="20" y="262" width="410" height="64" rx="5" fill="#FDE8DD" stroke="#C2501A" stroke-width="1.5"/><rect x="450" y="262" width="410" height="64" rx="5" fill="#FDE8DD" stroke="#C2501A" stroke-width="1.5"/><text x="20" y="24" text-anchor="start" font-size="12" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">以开头的退款客服为例：四样东西缺一样，数据看上去完整，也撑不起有效的学习（示意）</text><text x="105" y="76.23" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">任务</text><text x="105" y="91.29" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">给订单 1024 办理退款，</text><text x="105" y="105.78" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">金额不得超过实付</text><text x="315" y="76.23" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">智能体</text><text x="315" y="91.29" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">查订单、调接口、</text><text x="315" y="105.78" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">决定下一步</text><text x="550" y="76.23" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">环境</text><text x="550" y="91.29" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">接收动作，返回状态变化：</text><text x="550" y="105.78" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">真的去改订单库那一行</text><text x="780" y="76.23" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">验证器</text><text x="780" y="91.29" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">余额、库存</text><text x="780" y="105.78" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">对得上吗？</text><text x="418" y="70" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" style="paint-order:stroke;stroke-width:4px;stroke-linejoin:round" stroke="#ffffff">动作</text><text x="420" y="114" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" style="paint-order:stroke;stroke-width:4px;stroke-linejoin:round" stroke="#ffffff">观察</text><text x="673" y="79" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" style="paint-order:stroke;stroke-width:4px;stroke-linejoin:round" stroke="#ffffff">终态</text><text x="445" y="181.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">轨迹</text><text x="445" y="196.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">一路上的观察、决策和执行记录</text><text x="20" y="244" text-anchor="start" font-size="11" font-weight="500" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Epoch 的定义：任务 = 一段提示 + 一个评分器；环境 = 动作空间 + 周围的上下文，常常就是一个 Docker 容器</text><text x="225" y="290.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">只有轨迹，没有环境</text><text x="225" y="305.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">模型只能照着模仿，没办法自己再试一次</text><text x="655" y="290.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">只有环境，没有验证器</text><text x="655" y="305.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">模型试了也不知道试得对不对</text></svg>
