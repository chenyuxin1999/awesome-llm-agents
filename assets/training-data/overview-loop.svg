<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" role="img" aria-label="训练数据的基本循环"><defs><marker id="ah-overviewloop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6577"/></marker></defs><rect x="0" y="0" width="880" height="400" fill="#ffffff"/><rect x="10" y="44" width="860" height="318" rx="8" fill="none" stroke="#47546A" stroke-width="1.2" stroke-dasharray="5 4"/><path d="M170,101 L227,101" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-overviewloop)"/><path d="M390,101 L447,101" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-overviewloop)"/><path d="M620,101 L677,101" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-overviewloop)"/><path d="M820,132 L820,251" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-overviewloop)"/><path d="M680,285 L623,285" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-overviewloop)"/><path d="M450,285 L393,285" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-overviewloop)"/><path d="M230,285 L100,285 L100,135" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-overviewloop)"/><rect x="30" y="70" width="140" height="62" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="230" y="70" width="160" height="62" rx="5" fill="#E3EBFF" stroke="#2B57C9" stroke-width="1.5"/><rect x="450" y="70" width="170" height="62" rx="5" fill="#E3EBFF" stroke="#2B57C9" stroke-width="1.5"/><rect x="680" y="70" width="170" height="62" rx="5" fill="#DCEFF1" stroke="#0E6E7E" stroke-width="1.5"/><rect x="680" y="254" width="170" height="62" rx="5" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.5"/><rect x="450" y="254" width="170" height="62" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="230" y="254" width="160" height="62" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><text x="20" y="24" text-anchor="start" font-size="12" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">目标：让模型补上还不会的本事。琥珀色小字是退款客服走完一圈的例子（示意）</text><text x="100" y="97.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">当前的模型</text><text x="100" y="112.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#8A5300" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">退款题 8 次只过 2 次</text><text x="310" y="97.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">找能力缺口</text><text x="310" y="112.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#8A5300" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">超过 30 天的单不会拒</text><text x="535" y="90.23" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">选或造任务</text><text x="535" y="105.29" text-anchor="middle" font-size="10.5" font-weight="400" fill="#8A5300" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">工单：订单 3301 已下单 41 天，</text><text x="535" y="119.78" text-anchor="middle" font-size="10.5" font-weight="400" fill="#8A5300" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">要退款</text><text x="765" y="90.92" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">在环境里做</text><text x="765" y="105.48" text-anchor="middle" font-size="10" font-weight="400" fill="#8A5300" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">get_order(3301)</text><text x="765" y="119.28" text-anchor="middle" font-size="10" font-weight="400" fill="#8A5300" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">→ refund(3301)</text><text x="765" y="274.23" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">留下轨迹</text><text x="765" y="289.29" text-anchor="middle" font-size="10.5" font-weight="400" fill="#8A5300" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">4 步：查单、退款、补库存、回</text><text x="765" y="303.78" text-anchor="middle" font-size="10.5" font-weight="400" fill="#8A5300" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">复</text><text x="535" y="281.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">检查结果</text><text x="535" y="296.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#8A5300" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">规则验证器：超期却退了款 ✗</text><text x="310" y="274.23" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">变成训练材料</text><text x="310" y="289.29" text-anchor="middle" font-size="10.5" font-weight="400" fill="#8A5300" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">失败记进题库，再补 50 道超</text><text x="310" y="303.78" text-anchor="middle" font-size="10.5" font-weight="400" fill="#8A5300" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">期题</text><text x="199" y="94" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" style="paint-order:stroke;stroke-width:4px;stroke-linejoin:round" stroke="#ffffff">做错的题</text><text x="419" y="94" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" style="paint-order:stroke;stroke-width:4px;stroke-linejoin:round" stroke="#ffffff">缺什么</text><text x="649" y="94" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" style="paint-order:stroke;stroke-width:4px;stroke-linejoin:round" stroke="#ffffff">一道题</text><text x="652" y="278" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" style="paint-order:stroke;stroke-width:4px;stroke-linejoin:round" stroke="#ffffff">整条记录</text><text x="421" y="278" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" style="paint-order:stroke;stroke-width:4px;stroke-linejoin:round" stroke="#ffffff">对错</text><text x="232" y="152" text-anchor="start" font-size="10.5" font-weight="600" fill="#2B57C9" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">分支1、2：基础能力与已有语料</text><text x="452" y="152" text-anchor="start" font-size="10.5" font-weight="600" fill="#2B57C9" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">分支3：课程 · 分支6：难度</text><text x="688" y="152" text-anchor="start" font-size="10.5" font-weight="600" fill="#0E6E7E" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">分支4：业务世界</text><text x="688" y="170" text-anchor="start" font-size="10.5" font-weight="600" fill="#0E6E7E" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">分支5：现成软件与日志</text><text x="452" y="242" text-anchor="start" font-size="10.5" font-weight="600" fill="#26805A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">分支7：真实反馈</text><text x="400" y="205" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">三样东西分开评价：生成数量 · 任务多样性 · 有效的学习信号</text><text x="24" y="352" text-anchor="start" font-size="10.5" font-weight="600" fill="#47546A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">分支8：把整条生产线做成可以审计的工程（虚线框）</text><text x="440" y="388" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">示意：本章八个前沿分支各自改动循环中的一环</text></svg>
