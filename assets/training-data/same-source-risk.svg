<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 290" width="880" height="290" role="img" aria-label="一致性与独立性"><defs><marker id="ah-samesourcerisk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6577"/></marker></defs><rect x="0" y="0" width="880" height="290" fill="#ffffff"/><path d="M170,142 L237,65" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-samesourcerisk)"/><path d="M170,142 L237,117" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-samesourcerisk)"/><path d="M170,142 L237,169" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-samesourcerisk)"/><path d="M170,142 L237,221" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-samesourcerisk)"/><path d="M500,142 L567,142" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-samesourcerisk)"/><rect x="20" y="110" width="150" height="64" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="240" y="44" width="260" height="42" rx="5" fill="#E3EBFF" stroke="#2B57C9" stroke-width="1.5"/><rect x="240" y="96" width="260" height="42" rx="5" fill="#DCEFF1" stroke="#0E6E7E" stroke-width="1.5"/><rect x="240" y="148" width="260" height="42" rx="5" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.5"/><rect x="240" y="200" width="260" height="42" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="570" y="96" width="290" height="92" rx="5" fill="#FDE8DD" stroke="#C2501A" stroke-width="1.5"/><text x="20" y="24" text-anchor="start" font-size="12" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">四份材料出自同一个模型时，可能非常一致地犯同一个错（示意）</text><text x="95" y="138.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">同一个模型</text><text x="95" y="153.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">同一种理解</text><text x="370" y="61.665" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">任务说明</text><text x="370" y="76.035" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">题目有歧义</text><text x="370" y="120.565" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">环境代码</text><text x="370" y="165.665" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">参考解</text><text x="370" y="180.035" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">恰好按其中一种理解写</text><text x="370" y="217.665" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">测试</text><text x="370" y="232.035" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">恰好只检查那一种理解</text><text x="715" y="131.23" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">整套数据看上去天衣无缝</text><text x="715" y="146.29" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">参考解能通过测试，验证也通过了，</text><text x="715" y="160.78" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">教给模型的却是错的东西</text><text x="440" y="268" text-anchor="middle" font-size="11" font-weight="500" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">后来的自适应课程（分支3）、数据生产框架（分支8）都要面对这个独立性问题</text></svg>
