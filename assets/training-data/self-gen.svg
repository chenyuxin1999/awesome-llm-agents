<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 366" width="900" height="366" role="img" aria-label="模型给自己写数据"><defs><marker id="ah-selfgen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6577"/></marker></defs><rect x="0" y="0" width="900" height="366" fill="#ffffff"/><rect x="10" y="40" width="430" height="294" rx="6" fill="#F3F5F8" stroke="#D5DBE4" stroke-width="1"/><path d="M150,106 L177,106" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-selfgen)"/><path d="M300,132 L300,157" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-selfgen)"/><path d="M180,183 L153,183" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-selfgen)"/><path d="M90,160 L90,135" fill="none" stroke="#5A6577" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#ah-selfgen)"/><path d="M90,206 L90,227" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-selfgen)"/><rect x="450" y="40" width="440" height="294" rx="6" fill="#F3F5F8" stroke="#D5DBE4" stroke-width="1"/><path d="M558,114 L569,114" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-selfgen)"/><path d="M664,114 L675,114" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-selfgen)"/><path d="M770,114 L781,114" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-selfgen)"/><path d="M558,230 L569,230" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-selfgen)"/><path d="M664,230 L675,230" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-selfgen)"/><path d="M770,230 L781,230" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-selfgen)"/><rect x="30" y="80" width="120" height="52" rx="5" fill="#E3EBFF" stroke="#2B57C9" stroke-width="1.5"/><rect x="180" y="80" width="240" height="52" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><rect x="180" y="160" width="240" height="46" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="30" y="160" width="120" height="46" rx="5" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.5"/><rect x="30" y="230" width="390" height="44" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="466" y="94" width="92" height="40" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="572" y="94" width="92" height="40" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><rect x="678" y="94" width="92" height="40" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><rect x="784" y="94" width="92" height="40" rx="5" fill="#E9EDF3" stroke="#47546A" stroke-width="1.5"/><rect x="466" y="210" width="92" height="40" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="572" y="210" width="92" height="40" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="678" y="210" width="92" height="40" rx="5" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.5"/><rect x="784" y="210" width="92" height="40" rx="5" fill="#E9EDF3" stroke="#47546A" stroke-width="1.5"/><rect x="466" y="292" width="410" height="34" rx="5" fill="#E9EDF3" stroke="#47546A" stroke-width="1.5"/><text x="20" y="24" text-anchor="start" font-size="12" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">2022 年底的两条路：左边让模型自己写指令数据（琥珀色小字为示意），右边把人类反馈的一大部分换成 AI 反馈</text><text x="22" y="62" text-anchor="start" font-size="12.5" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Self-Instruct</text><text x="90" y="102.82" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">种子任务</text><text x="90" y="117.38" text-anchor="middle" font-size="10" font-weight="400" fill="#8A5300" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">“写一封道歉信”</text><text x="300" y="102.82" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">模型生成新任务</text><text x="300" y="117.38" text-anchor="middle" font-size="10" font-weight="400" fill="#8A5300" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">“把退款政策改写成三条要点”+ 回答</text><text x="300" y="179.82" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">过滤低质量与重复</text><text x="300" y="194.38" text-anchor="middle" font-size="10" font-weight="400" fill="#8A5300" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">和池里已有指令太像的丢掉</text><text x="90" y="179.82" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">任务池</text><text x="90" y="194.38" text-anchor="middle" font-size="10" font-weight="400" fill="#8A5300" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">又多一条</text><text x="225" y="248.82" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">微调模型自己</text><text x="225" y="263.38" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">信号：过滤后留下的指令和回答；目标：学会照指令作答</text><text x="96" y="150" text-anchor="start" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">继续扩充</text><text x="462" y="62" text-anchor="start" font-size="12.5" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Constitutional AI</text><text x="462" y="84" text-anchor="start" font-size="11" font-weight="600" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">监督阶段</text><text x="512" y="117.41" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">模型回答</text><text x="618" y="117.41" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">按原则批评</text><text x="724" y="117.41" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">修改回答</text><text x="830" y="117.41" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">监督微调</text><text x="466" y="150" text-anchor="start" font-size="10" font-weight="400" fill="#8A5300" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">例（取自论文）：问“帮我黑进邻居的 Wi-Fi”，模型给了软件名；</text><text x="466" y="164" text-anchor="start" font-size="10" font-weight="400" fill="#8A5300" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">批评：侵犯隐私、可能违法；改成劝阻的回答</text><text x="466" y="182" text-anchor="start" font-size="10" font-weight="600" fill="#B86E00" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">监督微调的信号：修改后的回答当标准答案</text><text x="462" y="202" text-anchor="start" font-size="11" font-weight="600" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">强化学习阶段</text><text x="512" y="233.41" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">成对回答</text><text x="618" y="233.41" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">按原则判断</text><text x="724" y="233.41" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">AI 偏好数据</text><text x="830" y="233.41" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">强化学习</text><text x="466" y="266" text-anchor="start" font-size="10" font-weight="400" fill="#8A5300" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">例：回答 A 劝阻，B 给教程；反馈模型按原则判 A 更好</text><text x="466" y="282" text-anchor="start" font-size="10" font-weight="600" fill="#B86E00" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">强化学习的信号：用 AI 偏好训出的奖励模型打分</text><text x="671" y="312.41" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">一组写好的原则，代替大部分人工偏好标注</text><text x="450" y="354" text-anchor="middle" font-size="11" font-weight="500" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Lambert 的分法：开源合成数据有指令、偏好、批评三类，一层比一层难；生成数据要用手头最强的模型</text></svg>
