, Noto Sans CJK SC, Microsoft YaHei, sans-serif">环境从背景板变成可搜索的训练对象</text><text x="738" y="285.255" text-anchor="middle" font-size="10.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">风险：无解、无聊、专门迎合奖励的环境</text><text x="738" y="318" text-anchor="middle" font-size="10.5" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">接口解决怎么接进来，题目值不值得练另说</text></svg>
