<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" role="img" aria-label="跨领域借鉴前的检查"><defs><marker id="ah-transfercheck" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6577"/></marker></defs><rect x="0" y="0" width="900" height="330" fill="#ffffff"/><path d="M450,130 L450,157" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-transfercheck)"/><path d="M450,204 L450,229" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-transfercheck)"/><rect x="20" y="44" width="204" height="86" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="238" y="44" width="204" height="86" rx="5" fill="#E3EBFF" stroke="#2B57C9" stroke-width="1.5"/><rect x="456" y="44" width="204" height="86" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><rect x="674" y="44" width="204" height="86" rx="5" fill="#FDE8DD" stroke="#C2501A" stroke-width="1.5"/><rect x="170" y="160" width="560" height="44" rx="5" fill="#E9EDF3" stroke="#47546A" stroke-width="1.5"/><rect x="170" y="232" width="176" height="48" rx="5" fill="#DCEFF1" stroke="#0E6E7E" stroke-width="1.5"/><rect x="362" y="232" width="176" height="48" rx="5" fill="#DCEFF1" stroke="#0E6E7E" stroke-width="1.5"/><rect x="554" y="232" width="176" height="48" rx="5" fill="#DCEFF1" stroke="#0E6E7E" stroke-width="1.5"/><text x="20" y="24" text-anchor="start" font-size="12" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">借一篇外领域的数据工作之前，先问它改变了什么，再看搬到智能体训练还缺哪几块</text><text x="122" y="77.61" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">视觉合成数据</text><text x="122" y="91.67" text-anchor="middle" font-size="9.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">ProxyPose · X-Lens</text><text x="122" y="104.78" text-anchor="middle" font-size="9.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">监督的结构与传感器多样性</text><text x="340" y="77.61" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">受控任务</text><text x="340" y="91.67" text-anchor="middle" font-size="9.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Invariant Dynamics · KATA</text><text x="340" y="104.78" text-anchor="middle" font-size="9.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">把变量一个个隔离开</text><text x="558" y="77.61" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">选择与生成机制</text><text x="558" y="91.67" text-anchor="middle" font-size="9.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Requential Coding · LimiX-2</text><text x="558" y="104.78" text-anchor="middle" font-size="9.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">选择规则与机制多样性</text><text x="776" y="77.61" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">只有术语相似</text><text x="776" y="91.67" text-anchor="middle" font-size="9.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Flow Matching · First-Crossing</text><text x="776" y="104.78" text-anchor="middle" font-size="9.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">“轨迹”“干预”指的是别的对象</text><text x="450" y="185.565" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">先问：它改变的是监督的来源、样本的分布，还是模型的结构？</text><text x="258" y="252.82" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">动作</text><text x="258" y="267.38" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">智能体能做什么</text><text x="450" y="252.82" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">环境反馈</text><text x="450" y="267.38" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">做了以后世界怎样变</text><text x="642" y="252.82" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">独立验收</text><text x="642" y="267.38" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">生成器以外的检查</text><text x="450" y="310" text-anchor="middle" font-size="11" font-weight="500" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">补齐这三块，再用交互实验检验迁移是否成立；单凭相同的术语就认定方法适用，很危险</text></svg>
