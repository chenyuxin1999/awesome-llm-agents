<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" width="880" height="380" role="img" aria-label="动作的几种写法与同一个视频世界模型"><defs><marker id="ah-b2action" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6577"/></marker></defs><rect x="0" y="0" width="880" height="380" fill="#ffffff"/><path d="M274,65 L330,152" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-b2action)"/><path d="M274,115 L330,152" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-b2action)"/><path d="M274,165 L330,152" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-b2action)"/><path d="M274,215 L330,152" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-b2action)"/><path d="M274,265 L330,152" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-b2action)"/><path d="M504,152 L541,152" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-b2action)"/><rect x="24" y="44" width="250" height="42" rx="5" fill="#DCEFF1" stroke="#0E6E7E" stroke-width="1.5"/><rect x="24" y="94" width="250" height="42" rx="5" fill="#DCEFF1" stroke="#0E6E7E" stroke-width="1.5"/><rect x="24" y="144" width="250" height="42" rx="5" fill="#DCEFF1" stroke="#0E6E7E" stroke-width="1.5"/><rect x="24" y="194" width="250" height="42" rx="5" fill="#DCEFF1" stroke="#0E6E7E" stroke-width="1.5"/><rect x="24" y="244" width="250" height="42" rx="5" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.5"/><rect x="334" y="112" width="170" height="80" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="544" y="112" width="130" height="80" rx="5" fill="#E9EDF3" stroke="#47546A" stroke-width="1.5"/><rect x="696" y="44" width="164" height="140" rx="5" fill="#F3F5F8" stroke="#D5DBE4" stroke-width="1.5"/><rect x="708" y="96" width="140" height="38" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="708" y="140" width="140" height="38" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><rect x="334" y="214" width="526" height="82" rx="5" fill="#FDE8DD" stroke="#C2501A" stroke-width="1.5"/><rect x="24" y="304" width="836" height="58" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><text x="24" y="24" text-anchor="start" font-size="12" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">同一条物理动作可以写成很多样子；视频模型对哪种写法“听得懂”，决定了它能不能把控制和后果对上</text><text x="149" y="61.665" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">绝对关节目标 / 相对增量</text><text x="149" y="76.035" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">两种数值写法（2609.23252）</text><text x="149" y="111.665" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">像素里部分露出的实体轨迹</text><text x="149" y="126.035" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Masked Visual Actions</text><text x="149" y="161.665" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">光流 / 动作流</text><text x="149" y="176.035" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">FlowWAM、Hydra-0</text><text x="149" y="211.665" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">一个动作 = 一个图像块</text><text x="149" y="226.035" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">PatchWAM</text><text x="149" y="261.665" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">人手姿态流，再重定向</text><text x="149" y="276.035" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">RynnWorld-Teleop</text><text x="419" y="141.23" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">视频世界模型</text><text x="419" y="156.29" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">借用视频预训练</text><text x="419" y="170.78" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">学到的视觉先验</text><text x="609" y="141.23" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">场景的反应</text><text x="609" y="156.29" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">机器人和物体</text><text x="609" y="170.78" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">接下来怎么动</text><text x="778" y="66" text-anchor="middle" font-size="11" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Masked Visual Actions</text><text x="778" y="86" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">两种用法共用一个接口</text><text x="778" y="111.355" text-anchor="middle" font-size="10.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">露出机器人怎么动</text><text x="778" y="125.345" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">→ 预测场景（正向）</text><text x="778" y="155.355" text-anchor="middle" font-size="10.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">露出物体该怎么动</text><text x="778" y="169.345" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">→ 恢复机器人（逆向）</text><text x="597" y="244.23" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">写法一换，预测就变了（2609.23252）</text><text x="597" y="259.29" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">同一条命令轨迹换一种写法：两种写法可以互相还原（R² = 0.996），信息没丢，</text><text x="597" y="273.78" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">两种预测却几乎正交（cos = 0.067），目标条件下的动作选择从 53% 掉到 15%</text><text x="442" y="329.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">好的检验：从同一起点重放同一条物理轨迹，只改写法，相机与任务都不变</text><text x="442" y="344.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">在目标上取平均多数情况下能恢复任务表现；加一致性惩罚能补上最坏情况；对方向类输出直接平均并不合适</text></svg>
