<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 310" width="880" height="310" role="img" aria-label="规划流水线上的三个环节"><defs><marker id="ah-b4plan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6577"/></marker></defs><rect x="0" y="0" width="880" height="310" fill="#ffffff"/><path d="M200,75 L241,75" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-b4plan)"/><path d="M420,75 L461,75" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-b4plan)"/><path d="M640,75 L681,75" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-b4plan)"/><path d="M112,120 L112,103" fill="none" stroke="#5A6577" stroke-width="1.4" stroke-dasharray="3 3" marker-end="url(#ah-b4plan)"/><path d="M332,120 L332,103" fill="none" stroke="#5A6577" stroke-width="1.4" stroke-dasharray="3 3" marker-end="url(#ah-b4plan)"/><path d="M552,120 L552,103" fill="none" stroke="#5A6577" stroke-width="1.4" stroke-dasharray="3 3" marker-end="url(#ah-b4plan)"/><rect x="24" y="50" width="176" height="50" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><rect x="244" y="50" width="176" height="50" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="464" y="50" width="176" height="50" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><rect x="684" y="50" width="176" height="50" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="24" y="120" width="196" height="66" rx="5" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1.5"/><rect x="24" y="198" width="196" height="66" rx="5" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1.5"/><rect x="244" y="120" width="196" height="66" rx="5" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1.5"/><rect x="244" y="198" width="196" height="66" rx="5" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1.5"/><rect x="464" y="120" width="196" height="66" rx="5" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1.5"/><rect x="464" y="198" width="196" height="66" rx="5" fill="#FDE8DD" stroke="#C2501A" stroke-width="1.5"/><rect x="684" y="120" width="176" height="144" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><text x="24" y="24" text-anchor="start" font-size="12" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">规划失败可能出在提案、预测或价值任何一环；本分支的论文各自加固一环</text><text x="112" y="78.875" text-anchor="middle" font-size="12.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">候选提案</text><text x="332" y="78.875" text-anchor="middle" font-size="12.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">世界模型推演</text><text x="552" y="78.875" text-anchor="middle" font-size="12.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">价值评估、选择</text><text x="772" y="78.875" text-anchor="middle" font-size="12.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">真实执行</text><text x="122" y="142.765" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">SAGE</text><text x="122" y="157.135" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">用不同时间跨度的潜子目标</text><text x="122" y="170.935" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">引导候选，替代随机起步</text><text x="122" y="220.765" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">LeFlow</text><text x="122" y="235.135" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">学一个可复用的潜路径先验，</text><text x="122" y="248.935" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">规划时间降一个数量级</text><text x="342" y="142.765" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Representation WM</text><text x="342" y="157.135" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">直接在表示里连一条路径，</text><text x="342" y="170.935" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">逆动力学还原动作，不做搜索</text><text x="342" y="220.765" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">World Action Planner</text><text x="342" y="235.135" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">先全局优化整段计划，</text><text x="342" y="248.935" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">再比较邻近候选的想象结果</text><text x="562" y="142.765" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Q-Learning With WM</text><text x="562" y="157.135" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Q 只用真实转移训练；</text><text x="562" y="170.935" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">想象只在挑动作时出场</text><text x="562" y="220.765" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">风险</text><text x="562" y="235.135" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">价值函数在陌生状态下</text><text x="562" y="248.935" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">也可能失准</text><text x="772" y="154.32" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">真实转移</text><text x="772" y="168.88" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">回流给价值学习</text><text x="772" y="182.68" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">（QWM 的做法）</text><text x="772" y="196.48" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif"></text><text x="772" y="210.28" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">也用来检查：模型能否</text><text x="772" y="224.08" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">预测风险、提案能否</text><text x="772" y="237.88" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">覆盖有效路径</text><text x="442" y="292" text-anchor="middle" font-size="11" font-weight="600" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">三个环节的收益混在一起报告，就分不清到底是哪里变好了</text></svg>
