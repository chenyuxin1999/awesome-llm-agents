<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" width="880" height="380" role="img" aria-label="从想象到执行，每一道缝上的诊断"><defs><marker id="ah-b8trust" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6577"/></marker></defs><rect x="0" y="0" width="880" height="380" fill="#ffffff"/><path d="M200,72 L241,72" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-b8trust)"/><path d="M420,72 L461,72" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-b8trust)"/><path d="M640,72 L681,72" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-b8trust)"/><path d="M112,116 L112,99" fill="none" stroke="#5A6577" stroke-width="1.4" stroke-dasharray="3 3" marker-end="url(#ah-b8trust)"/><path d="M332,116 L332,99" fill="none" stroke="#5A6577" stroke-width="1.4" stroke-dasharray="3 3" marker-end="url(#ah-b8trust)"/><path d="M552,116 L552,99" fill="none" stroke="#5A6577" stroke-width="1.4" stroke-dasharray="3 3" marker-end="url(#ah-b8trust)"/><path d="M772,116 L772,99" fill="none" stroke="#5A6577" stroke-width="1.4" stroke-dasharray="3 3" marker-end="url(#ah-b8trust)"/><path d="M324,244 L329,244" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-b8trust)"/><path d="M452,244 L472,244 L472,223 L497,223" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-b8trust)"/><path d="M472,244 L472,267 L497,267" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-b8trust)"/><rect x="24" y="48" width="176" height="48" rx="5" fill="#DCEFF1" stroke="#0E6E7E" stroke-width="1.5"/><rect x="244" y="48" width="176" height="48" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="464" y="48" width="176" height="48" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><rect x="684" y="48" width="176" height="48" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="24" y="116" width="176" height="76" rx="5" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1.5"/><rect x="244" y="116" width="176" height="76" rx="5" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1.5"/><rect x="464" y="116" width="176" height="76" rx="5" fill="#FFFFFF" stroke="#D5DBE4" stroke-width="1.5"/><rect x="684" y="116" width="176" height="76" rx="5" fill="#FDE8DD" stroke="#C2501A" stroke-width="1.5"/><rect x="24" y="214" width="300" height="60" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><path d="M392,214 L452,244 L392,274 L332,244 z" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><rect x="500" y="206" width="360" height="34" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="500" y="250" width="360" height="34" rx="5" fill="#FDE8DD" stroke="#C2501A" stroke-width="1.5"/><rect x="24" y="314" width="836" height="50" rx="5" fill="#F3F5F8" stroke="#D5DBE4" stroke-width="1.5"/><text x="24" y="24" text-anchor="start" font-size="12" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">每一道缝都可能让“预测得像”变成“规划失败”；本分支的论文各守一道</text><text x="112" y="75.875" text-anchor="middle" font-size="12.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">动作输入</text><text x="332" y="75.875" text-anchor="middle" font-size="12.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">世界模型预测</text><text x="552" y="75.875" text-anchor="middle" font-size="12.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">规划器选动作</text><text x="772" y="75.875" text-anchor="middle" font-size="12.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">真实执行</text><text x="112" y="143.765" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">WorldEcho / WorldSync</text><text x="112" y="158.135" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">离专家的动作还跟不跟？</text><text x="112" y="171.935" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">常见失败：无视指令或画面失效</text><text x="332" y="143.765" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">WorldSimProbe</text><text x="332" y="158.135" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">动作要带来对应的运动，</text><text x="332" y="171.935" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">环境响应要基于实际运动</text><text x="552" y="143.765" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">VIScore</text><text x="552" y="158.135" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">编码器、预测器、规划器一起量；</text><text x="552" y="171.935" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">与成功率的秩相关超过 0.75</text><text x="772" y="143.765" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">BadWAM</text><text x="772" y="158.135" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">想象正常，执行被带偏；</text><text x="772" y="171.935" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">攻击下成功率 96.5% → 43.1%</text><text x="174" y="240.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">某个由世界模型建议的决策</text><text x="174" y="255.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">它预测的优势有多大？</text><text x="392" y="240" text-anchor="middle" font-size="10.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">优势 &gt; 模型</text><text x="392" y="254" text-anchor="middle" font-size="10.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">误差的可信界？</text><text x="680" y="226.565" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">是：采纳这个决策</text><text x="680" y="270.565" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">否：把证据花在验证世界模型上</text><text x="24" y="300" text-anchor="start" font-size="11" font-weight="600" fill="#B83560" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Dual-Frontier 的门：把“信不信模型”做成一个显式的决定</text><text x="442" y="335.32" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">一份报告至少应包含</text><text x="442" y="350.19" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">一步误差、多步漂移、动作敏感性、规划成功率、真实交互次数、总计算预算</text></svg>
