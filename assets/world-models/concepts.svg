<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300" role="img" aria-label="三种模型与两种不确定"><defs><marker id="ah-concepts" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6577"/></marker></defs><rect x="0" y="0" width="880" height="300" fill="#ffffff"/><path d="M260,70 L300,70" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-concepts)"/><path d="M260,144 L300,144" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-concepts)"/><path d="M260,218 L300,218" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-concepts)"/><line x1="440" y1="20" x2="440" y2="290" stroke="#D5DBE4" stroke-width="1"/><path d="M559,86 L559,106" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-concepts)"/><path d="M765,86 L765,106" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-concepts)"/><path d="M559,182 L559,202" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-concepts)"/><path d="M765,182 L765,202" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-concepts)"/><rect x="24" y="44" width="96" height="52" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="140" y="50" width="120" height="40" rx="5" fill="#E3EBFF" stroke="#2B57C9" stroke-width="1.5"/><rect x="302" y="50" width="92" height="40" rx="5" fill="#E9EDF3" stroke="#47546A" stroke-width="1.5"/><rect x="24" y="118" width="96" height="52" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><rect x="140" y="124" width="120" height="40" rx="5" fill="#E3EBFF" stroke="#2B57C9" stroke-width="1.5"/><rect x="302" y="124" width="92" height="40" rx="5" fill="#DCEFF1" stroke="#0E6E7E" stroke-width="1.5"/><rect x="24" y="192" width="96" height="52" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><rect x="140" y="198" width="120" height="40" rx="5" fill="#E3EBFF" stroke="#2B57C9" stroke-width="1.5"/><rect x="302" y="198" width="92" height="40" rx="5" fill="#DCEFF1" stroke="#0E6E7E" stroke-width="1.5"/><rect x="464" y="40" width="396" height="46" rx="5" fill="#E3EBFF" stroke="#2B57C9" stroke-width="1.5"/><rect x="464" y="108" width="190" height="74" rx="5" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.5"/><rect x="670" y="108" width="190" height="74" rx="5" fill="#FDE8DD" stroke="#C2501A" stroke-width="1.5"/><rect x="464" y="204" width="190" height="50" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="670" y="204" width="190" height="50" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><text x="24" y="26" text-anchor="start" font-size="12.5" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">同一个状态，三种问法</text><text x="72" y="73.72" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">正向模型</text><text x="200" y="73.41" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">状态 + 动作</text><text x="348" y="73.41" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">下一状态</text><text x="214" y="108" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">问的是：这样做会怎样</text><text x="72" y="147.72" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">逆向模型</text><text x="200" y="147.41" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">状态 + 想要的结果</text><text x="348" y="147.41" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">动作</text><text x="214" y="182" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">问的是：要达到它该怎么做</text><text x="72" y="221.72" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">策略</text><text x="200" y="221.41" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">状态（+ 目标）</text><text x="348" y="221.41" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">动作</text><text x="214" y="256" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">问的是：现在该做什么</text><text x="24" y="282" text-anchor="start" font-size="10.5" font-weight="500" fill="#5B45B0" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">三者可以共享参数，评测时最好分开报告</text><text x="464" y="26" text-anchor="start" font-size="12.5" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">预测和实际对不上，原因可能有两种</text><text x="662" y="66.565" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">推同一个杯子：模型说会停住，实际却滑倒了</text><text x="559" y="134.23" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">世界本身有随机</text><text x="559" y="149.29" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">同样的推法，本来就</text><text x="559" y="163.78" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">有时停、有时滑</text><text x="765" y="134.23" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">模型知识不足</text><text x="765" y="149.29" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">没见过这种材质，</text><text x="765" y="163.78" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">规律没学会</text><text x="559" y="225.82" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">该给出概率</text><text x="559" y="240.38" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">“多半停住，偶尔滑倒”</text><text x="765" y="225.82" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">该补数据或少信模型</text><text x="765" y="240.38" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">回真实环境再看一眼</text><text x="662" y="280" text-anchor="middle" font-size="11" font-weight="700" fill="#C2501A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">难点：只看这一次误差，分不清是哪一种</text></svg>
