<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" role="img" aria-label="世界模型在决策闭环里的位置"><defs><marker id="ah-overviewloop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6577"/></marker></defs><rect x="0" y="0" width="880" height="400" fill="#ffffff"/><path d="M144,100 L181,100" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-overviewloop)"/><path d="M314,100 L351,100" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-overviewloop)"/><path d="M449,168 L449,151" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-overviewloop)"/><path d="M544,100 L581,100" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-overviewloop)"/><path d="M714,100 L741,100" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-overviewloop)"/><path d="M802,130 L802,250 L84,250 L84,133" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-overviewloop)"/><path d="M802,250 L802,262 L366,262 L366,151" fill="none" stroke="#5A6577" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#ah-overviewloop)"/><rect x="24" y="70" width="120" height="60" rx="5" fill="#E3EBFF" stroke="#2B57C9" stroke-width="1.5"/><rect x="184" y="70" width="130" height="60" rx="5" fill="#E9EDF3" stroke="#47546A" stroke-width="1.5"/><rect x="354" y="52" width="190" height="96" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="584" y="70" width="130" height="60" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><rect x="744" y="70" width="116" height="60" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="378" y="168" width="52" height="26" rx="13" fill="#DCEFF1" stroke="#0E6E7E" stroke-width="1.5"/><rect x="436" y="168" width="52" height="26" rx="13" fill="#DCEFF1" stroke="#0E6E7E" stroke-width="1.5"/><rect x="494" y="168" width="52" height="26" rx="13" fill="#DCEFF1" stroke="#0E6E7E" stroke-width="1.5"/><rect x="24" y="330" width="202" height="54" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><rect x="238" y="330" width="202" height="54" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="452" y="330" width="202" height="54" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="680" y="316" width="180" height="68" rx="5" fill="#FDE8DD" stroke="#C2501A" stroke-width="1.5"/><text x="24" y="24" text-anchor="start" font-size="12" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">世界模型夹在“看见”和“动手”之间：先在里面推演候选动作的后果，挑一个去做，再用真实结果修正自己</text><text x="84" y="89.23" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">观察</text><text x="84" y="104.29" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">相机画面、网页、终端</text><text x="84" y="118.78" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">输出</text><text x="249" y="96.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">状态</text><text x="249" y="111.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">压缩历史后的隐状态</text><text x="449" y="89.23" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">世界模型</text><text x="449" y="104.29" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">状态 + 候选动作</text><text x="449" y="118.78" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">→ 下一状态、奖励、风险</text><text x="649" y="96.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">规划器或策略</text><text x="649" y="111.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">比较后果，挑一个</text><text x="802" y="96.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">真实环境</text><text x="802" y="111.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">执行，产生真实结果</text><text x="404" y="185" text-anchor="middle" font-size="10.5" font-weight="600" fill="#0E6E7E" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">动作 A</text><text x="462" y="185" text-anchor="middle" font-size="10.5" font-weight="600" fill="#0E6E7E" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">动作 B</text><text x="520" y="185" text-anchor="middle" font-size="10.5" font-weight="600" fill="#0E6E7E" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">动作 C</text><text x="449" y="214" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">候选动作逐个送进模型推演</text><text x="562" y="90" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" style="paint-order:stroke;stroke-width:4px;stroke-linejoin:round" stroke="#ffffff">想象的后果</text><text x="640" y="244" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" style="paint-order:stroke;stroke-width:4px;stroke-linejoin:round" stroke="#ffffff">新的观察</text><text x="600" y="278" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5B45B0" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">预测和真实结果对不上，就回头修正世界模型</text><text x="24" y="316" text-anchor="start" font-size="12" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">同一个模型的三种用法</text><text x="125" y="353.32" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">训练期：在想象里练策略</text><text x="125" y="368.19" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Dreamer、DreamGym</text><text x="339" y="353.32" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">部署期：行动前搜索候选</text><text x="339" y="368.19" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">PlaNet、MuZero、V-JEPA 2</text><text x="553" y="353.32" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">评测期：先在模型里试跑</text><text x="553" y="368.19" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">WorldSimProbe、文本验证器</text><text x="770" y="339.075" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">两个老问题</text><text x="770" y="353.945" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">误差随推演步数累积</text><text x="770" y="368.435" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">规划器专挑模型乐观处</text></svg>
