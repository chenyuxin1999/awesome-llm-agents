"/><path d="M806,287 L820,308" fill="none" stroke="#5B45B0" stroke-width="1.1" stroke-dasharray="3 2" marker-end="url(#ah-s2compare)"/><path d="M890,277 L904,256" fill="none" stroke="#5B45B0" stroke-width="1.1" stroke-dasharray="3 2" marker-end="url(#ah-s2compare)"/><path d="M890,287 L904,308" fill="none" stroke="#5B45B0" stroke-width="1.1" stroke-dasharray="3 2" marker-end="url(#ah-s2compare)"/><rect x="140" y="40" width="250" height="32" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="400" y="40" width="250" height="32" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><rect x="660" y="40" width="250" height="32" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><circle cx="164" cy="290" r="7" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><circle cx="196" cy="290" r="6" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><circle cx="228" cy="290" r="6" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><circle cx="260" cy="290" r="6" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><circle cx="292" cy="290" r="6" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><circle cx="324" cy="290" r="6" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><circle cx="356" cy="290" r="6" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><circle cx="525" cy="262" r="7" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><circle cx="465" cy="292" r="6" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><circle cx="525" cy="292" r="6" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><circle cx="585" cy="292" r="6" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><circle cx="445" cy="324" r="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><circle cx="485" cy="324" r="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><circle cx="565" cy="324" r="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><circle cx="605" cy="324" r="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><circle cx="680" cy="282" r="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><circle cx="722" cy="282" r="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><circle cx="764" cy="282" r="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><circle cx="806" cy="282" r="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><circle cx="848" cy="282" r="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><circle cx="890" cy="282" r="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><text x="24" y="26" text-anchor="start" font-size="12.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">同一个问题，三种回答：模型要预测什么，训练信号从哪来，在模型里想象多远</text><text x="265" y="61" text-anchor="middle" font-size="12" font-weight="700" fill="#5B45B0" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">第一阶段：PlaNet、Dreamer</text><text x="525" y="61" text-anchor="middle" font-size="12" font-weight="700" fill="#B83560" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">岔路一：MuZero（2019）</text><text x="785" y="61" text-anchor="middle" font-size="12" font-weight="700" fill="#26805A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">岔路二：MBPO（2019）</text><text x="78" y="121" text-anchor="middle" font-size="11" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">模型要预测什么</text><text x="78" y="203" text-anchor="middle" font-size="11" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">训练信号从哪来</text><text x="78" y="315" text-anchor="middle" font-size="11" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">想象怎么用、走多远</text><text x="78" y="416" text-anchor="middle" font-size="11" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">代价</text><text x="265" y="104" text-anchor="middle" font-size="10.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">下一个内部状态、这一步的奖励，</text><text x="265" y="120" text-anchor="middle" font-size="10.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">而且内部状态要能还原出画面</text><text x="525" y="104" text-anchor="middle" font-size="10.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">只预测三样：这一步的奖励、</text><text x="525" y="120" text-anchor="middle" font-size="10.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">局面还值多少分、该偏向哪些动作；</text><text x="525" y="136" text-anchor="middle" font-size="10.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">不还原画面</text><text x="785" y="104" text-anchor="middle" font-size="10.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">下一个状态和这一步的奖励</text><text x="785" y="120" text-anchor="middle" font-size="10.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">（在真实状态上直接学）</text><text x="265" y="182" text-anchor="middle" font-size="10.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">回放池里真实记下的</text><text x="265" y="198" text-anchor="middle" font-size="10.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">下一帧画面和真实奖励</text><text x="525" y="180" text-anchor="middle" font-size="10.2" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">奖励：真实观察到的奖励；</text><text x="525" y="196" text-anchor="middle" font-size="10.2" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">价值：真实往后拿到的分或最终胜负；</text><text x="525" y="212" text-anchor="middle" font-size="10.2" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">动作偏好：树搜索算出的结果</text><text x="785" y="182" text-anchor="middle" font-size="10.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">真实经历过的</text><text x="785" y="198" text-anchor="middle" font-size="10.5" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">下一个状态和奖励</text><text x="164" y="312" text-anchor="middle" font-size="9.5" font-weight="500" fill="#26805A" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">真实起点</text><text x="300" y="312" text-anchor="middle" font-size="9.5" font-weight="500" fill="#5B45B0" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">连推 15 步（示意）</text><text x="265" y="340" text-anchor="middle" font-size="10.2" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">在想象里练策略网络，</text><text x="265" y="356" text-anchor="middle" font-size="10.2" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">行动时直接出动作</text><text x="525" y="346" text-anchor="middle" font-size="10.2" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">每次行动前从当前局面长出一棵树，</text><text x="525" y="362" text-anchor="middle" font-size="10.2" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">选价值最高的那一枝的第一步</text><text x="680" y="326" text-anchor="start" font-size="9.5" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">绿线：真实经历；虚线：只想象几步</text><text x="785" y="346" text-anchor="middle" font-size="10.2" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">短想象和真实经验混在一起</text><text x="785" y="362" text-anchor="middle" font-size="10.2" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">训练策略</text><text x="265" y="406" text-anchor="middle" font-size="10.2" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">学还原画面，容量会花在</text><text x="265" y="422" text-anchor="middle" font-size="10.2" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">和决策无关的细节上</text><text x="525" y="406" text-anchor="middle" font-size="10.2" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">内部状态人看不懂，</text><text x="525" y="422" text-anchor="middle" font-size="10.2" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">很难检查模型想象了什么</text><text x="785" y="406" text-anchor="middle" font-size="10.2" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">想象很短，</text><text x="785" y="422" text-anchor="middle" font-size="10.2" font-weight="400" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">能补充的数据量有限</text><text x="460" y="470" text-anchor="middle" font-size="11" font-weight="600" fill="#B83560" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">MuZero 缩小了要预测的内容，MBPO 缩短了预测的步数，两者都在把想象留在模型可信的范围里</text></svg>
