<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" width="880" height="330" role="img" aria-label="Genie 的三个部件与视频世界这条线"><defs><marker id="ah-s3genie" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6577"/></marker></defs><rect x="0" y="0" width="880" height="330" fill="#ffffff"/><path d="M174,78 L207,78" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-s3genie)"/><path d="M174,92 L190,92 L190,178 L207,178" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-s3genie)"/><path d="M380,78 L417,110" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-s3genie)"/><path d="M380,178 L417,146" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-s3genie)"/><path d="M610,128 L637,128" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-s3genie)"/><path d="M692,96 L692,70 L515,70 L515,81" fill="none" stroke="#5A6577" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#ah-s3genie)"/><line x1="20" y1="238" x2="860" y2="238" stroke="#D5DBE4" stroke-width="1"/><path d="M220,295 L234,295" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-s3genie)"/><path d="M432,295 L446,295" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-s3genie)"/><path d="M644,295 L658,295" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-s3genie)"/><rect x="24" y="48" width="150" height="60" rx="5" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.5"/><rect x="210" y="40" width="170" height="76" rx="5" fill="#E9EDF3" stroke="#47546A" stroke-width="1.5"/><rect x="210" y="140" width="170" height="76" rx="5" fill="#DCEFF1" stroke="#0E6E7E" stroke-width="1.5"/><rect x="420" y="84" width="190" height="88" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="640" y="96" width="104" height="64" rx="5" fill="#E3EBFF" stroke="#2B57C9" stroke-width="1.5"/><rect x="24" y="272" width="196" height="46" rx="5" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.5"/><rect x="236" y="272" width="196" height="46" rx="5" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.5"/><rect x="448" y="272" width="196" height="46" rx="5" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.5"/><rect x="660" y="272" width="196" height="46" rx="5" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.5"/><text x="24" y="26" text-anchor="start" font-size="12.5" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Genie：从没有按键标注的视频里学出可操控的世界</text><text x="99" y="74.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">互联网游戏视频</text><text x="99" y="89.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">没有动作标签</text><text x="295" y="67.23" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">切成小块编号</text><text x="295" y="82.29" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">把每一帧切成小块，</text><text x="295" y="96.78" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">每块换成一个编号</text><text x="295" y="167.23" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">归纳隐含动作</text><text x="295" y="182.29" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">看相邻两帧，判断变化</text><text x="295" y="196.78" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">属于一小组里的哪一种</text><text x="515" y="109.985" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">生成下一帧</text><text x="515" y="125.045" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">前面各帧的编号</text><text x="515" y="139.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">加上一个隐含动作，</text><text x="515" y="154.025" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">得到下一帧的编号</text><text x="692" y="124.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">下一帧</text><text x="692" y="139.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">可以继续往下玩</text><text x="610" y="64" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" style="paint-order:stroke;stroke-width:4px;stroke-linejoin:round" stroke="#ffffff">接回去，逐帧生成</text><text x="806" y="116" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">拿来玩时，</text><text x="806" y="132" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">人每一步选一个</text><text x="806" y="148" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">隐含动作来操控</text><text x="24" y="230" text-anchor="start" font-size="10.2" font-weight="500" fill="#B86E00" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">训练信号：三个网络都拿视频里真实的画面当答案，要能还原原来那一帧，或者还原出真实的下一帧</text><text x="24" y="258" text-anchor="start" font-size="12.5" font-weight="700" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">视频世界这条线：把画面本身预测好</text><text x="122" y="291.665" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Sora 报告 2024</text><text x="122" y="306.035" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">规模化后出现三维一致、物体恒存</text><text x="334" y="291.665" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Genie 2024</text><text x="334" y="306.035" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">补上动作：隐含动作</text><text x="546" y="291.665" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Cosmos 2025</text><text x="546" y="306.035" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">给物理 AI 的可微调底座</text><text x="758" y="291.665" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Genie 3 2025</text><text x="758" y="306.035" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">720p、24 帧实时，几分钟一致</text></svg>
