<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" width="880" height="360" role="img" aria-label="V-JEPA 2 的两段训练与表示空间里的规划"><defs><marker id="ah-s4vjepa2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6577"/></marker></defs><rect x="0" y="0" width="880" height="360" fill="#ffffff"/><rect x="24" y="40" width="250" height="248" rx="6" fill="#F7F8FA" stroke="#D5DBE4" stroke-width="1"/><rect x="294" y="40" width="250" height="248" rx="6" fill="#F7F8FA" stroke="#D5DBE4" stroke-width="1"/><rect x="564" y="40" width="292" height="248" rx="6" fill="#F7F8FA" stroke="#D5DBE4" stroke-width="1"/><path d="M149,126 L149,144" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-s4vjepa2)"/><path d="M149,202 L149,220" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-s4vjepa2)"/><path d="M419,126 L419,144" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-s4vjepa2)"/><path d="M419,202 L419,220" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-s4vjepa2)"/><path d="M258,174 L307,174" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-s4vjepa2)"/><path d="M640,122 L640,143" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-s4vjepa2)"/><path d="M780,122 L780,143" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-s4vjepa2)"/><path d="M710,202 L710,220" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-s4vjepa2)"/><path d="M844,248 L852,248 L852,100 L843,100" fill="none" stroke="#5A6577" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#ah-s4vjepa2)"/><rect x="40" y="78" width="218" height="48" rx="5" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.5"/><rect x="40" y="146" width="218" height="56" rx="5" fill="#E9EDF3" stroke="#47546A" stroke-width="1.5"/><rect x="40" y="222" width="218" height="52" rx="5" fill="#E3EBFF" stroke="#2B57C9" stroke-width="1.5"/><rect x="310" y="78" width="218" height="48" rx="5" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.5"/><rect x="310" y="146" width="218" height="56" rx="5" fill="#DCEFF1" stroke="#0E6E7E" stroke-width="1.5"/><rect x="310" y="222" width="218" height="52" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="580" y="78" width="120" height="44" rx="5" fill="#E3EBFF" stroke="#2B57C9" stroke-width="1.5"/><rect x="720" y="78" width="120" height="44" rx="5" fill="#E3EBFF" stroke="#2B57C9" stroke-width="1.5"/><rect x="580" y="146" width="260" height="56" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="580" y="222" width="260" height="52" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="24" y="302" width="520" height="46" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="564" y="302" width="292" height="46" rx="5" fill="#FDE8DD" stroke="#C2501A" stroke-width="1.5"/><text x="149" y="62" text-anchor="middle" font-size="12.5" font-weight="700" fill="#5B45B0" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">第一段：只看视频</text><text x="419" y="62" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0E6E7E" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">第二段：接上动作</text><text x="710" y="62" text-anchor="middle" font-size="12.5" font-weight="700" fill="#B83560" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">部署：朝目标图像规划</text><text x="24" y="24" text-anchor="start" font-size="12" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">大量无动作的视频学“世界怎样变化”，少量带动作的机器人数据学“我的动作怎样影响世界”（Meta, 2025）</text><text x="149" y="105.565" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">一百多万小时无标注视频</text><text x="149" y="170.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">编码器 + 预测器</text><text x="149" y="185.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">遮住一部分，预测被遮部分的表示</text><text x="149" y="244.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">学到：理解与预测</text><text x="149" y="259.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">不需要任何动作标签</text><text x="419" y="105.41" text-anchor="middle" font-size="11" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">不到 62 小时 DROID 机器人视频</text><text x="419" y="163.23" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">动作条件预测器</text><text x="419" y="178.29" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">编码器冻结，只学</text><text x="419" y="192.78" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">表示 + 动作 → 下一表示</text><text x="419" y="244.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">得到：V-JEPA 2-AC</text><text x="419" y="259.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">一个潜空间里的世界模型</text><text x="282" y="166" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" style="paint-order:stroke;stroke-width:4px;stroke-linejoin:round" stroke="#ffffff">编码器</text><text x="640" y="103.565" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">当前图像</text><text x="780" y="103.565" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">目标图像</text><text x="710" y="170.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">在表示空间里试候选动作序列</text><text x="710" y="185.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">挑预测结果最接近目标表示的那组</text><text x="710" y="244.32" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">只执行第一个动作，然后重新规划</text><text x="710" y="259.19" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">模型预测控制，每一步重来</text><text x="284" y="328.565" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">结果：没见过的环境里，抓取放置新物体成功率 65% 到 80%</text><text x="710" y="321.665" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">留下的问题</text><text x="710" y="336.035" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">可预测的表示未必可控；接触和受力未必保留</text></svg>
