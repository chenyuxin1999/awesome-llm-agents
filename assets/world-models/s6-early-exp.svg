<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" width="880" height="360" role="img" aria-label="Early Experience 的数据怎样产生、怎样用"><defs><marker id="ah-s6earlyexp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6577"/></marker></defs><rect x="0" y="0" width="880" height="360" fill="#ffffff"/><path d="M174,82 L203,82" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-s6earlyexp)"/><path d="M366,82 L395,82" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-s6earlyexp)"/><path d="M548,82 L577,82" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-s6earlyexp)"/><path d="M720,112 L720,132 L240,132 L240,150" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-s6earlyexp)"/><path d="M720,132 L650,132 L650,150" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-s6earlyexp)"/><rect x="24" y="152" width="420" height="136" rx="6" fill="#F7F8FA" stroke="#D5DBE4" stroke-width="1"/><path d="M220,229 L247,229" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-s6earlyexp)"/><rect x="456" y="152" width="404" height="136" rx="6" fill="#F7F8FA" stroke="#D5DBE4" stroke-width="1"/><path d="M652,229 L669,229" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-s6earlyexp)"/><rect x="24" y="52" width="150" height="60" rx="5" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.5"/><rect x="206" y="52" width="160" height="60" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><rect x="398" y="52" width="150" height="60" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="580" y="52" width="280" height="60" rx="5" fill="#E9EDF3" stroke="#47546A" stroke-width="1.5"/><rect x="40" y="188" width="180" height="82" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="250" y="188" width="180" height="82" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><rect x="472" y="188" width="180" height="82" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="672" y="188" width="172" height="82" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><rect x="24" y="302" width="560" height="46" rx="5" fill="#DDF3E8" stroke="#26805A" stroke-width="1.5"/><rect x="600" y="302" width="260" height="46" rx="5" fill="#E9EDF3" stroke="#47546A" stroke-width="1.5"/><text x="24" y="24" text-anchor="start" font-size="12" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">不需要奖励：在专家走过的状态上自己换个动作试一试，把环境返回的结果当监督（Meta 与俄亥俄州立大学, 2025）</text><text x="99" y="78.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">专家轨迹</text><text x="99" y="93.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">状态 → 专家动作</text><text x="286" y="78.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">agent 提出别的动作</text><text x="286" y="93.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">在同一个状态上</text><text x="473" y="78.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">真的去执行</text><text x="473" y="93.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">环境返回下一状态</text><text x="720" y="78.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">“自己动手换来的后果”</text><text x="720" y="93.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">状态、替代动作、下一状态，没有奖励</text><text x="234" y="174" text-anchor="middle" font-size="12.5" font-weight="700" fill="#5B45B0" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">用法一：隐式世界建模</text><text x="130" y="210.83" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">先学预测</text><text x="130" y="225.7" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">状态 + 动作</text><text x="130" y="240.19" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">→ 环境会返回什么</text><text x="130" y="254.68" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">（就是下一个词预测）</text><text x="340" y="218.075" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">再学专家动作</text><text x="340" y="232.945" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">同一组参数上</text><text x="340" y="247.435" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">做模仿学习</text><text x="658" y="174" text-anchor="middle" font-size="12.5" font-weight="700" fill="#B83560" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">用法二：自我反思</text><text x="562" y="218.075" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">把后果摆在一起</text><text x="562" y="232.945" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">专家动作的后果</text><text x="562" y="247.435" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">vs 自己试的后果</text><text x="758" y="218.075" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">写出专家为什么更好</text><text x="758" y="232.945" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">连同专家动作</text><text x="758" y="247.435" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">一起学</text><text x="304" y="328.565" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">作者自报：8 个环境上相对纯模仿平均提升约 9.6 个点，分布外约 9.4 个点</text><text x="730" y="321.32" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">之后再做强化学习，</text><text x="730" y="336.19" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">最终成绩也更高</text></svg>
