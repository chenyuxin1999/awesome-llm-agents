<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340" role="img" aria-label="语言模型当世界模型的三种用法"><defs><marker id="ah-s6textuses" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6577"/></marker></defs><rect x="0" y="0" width="880" height="340" fill="#ffffff"/><path d="M194,100 L233,116" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-s6textuses)"/><path d="M194,186 L233,152" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-s6textuses)"/><path d="M416,130 L446,130 L446,80 L467,80" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-s6textuses)"/><path d="M416,130 L446,130 L446,172 L467,172" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-s6textuses)"/><path d="M416,130 L446,130 L446,264 L467,264" fill="none" stroke="#5A6577" stroke-width="1.4" marker-end="url(#ah-s6textuses)"/><rect x="24" y="52" width="170" height="96" rx="5" fill="#E3EBFF" stroke="#2B57C9" stroke-width="1.5"/><rect x="24" y="166" width="170" height="40" rx="5" fill="#DCEFF1" stroke="#0E6E7E" stroke-width="1.5"/><rect x="236" y="84" width="180" height="92" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="470" y="44" width="390" height="72" rx="5" fill="#ECE7FB" stroke="#5B45B0" stroke-width="1.5"/><rect x="470" y="136" width="390" height="72" rx="5" fill="#FCE4EC" stroke="#B83560" stroke-width="1.5"/><rect x="470" y="228" width="390" height="72" rx="5" fill="#FFF1DC" stroke="#B86E00" stroke-width="1.5"/><rect x="236" y="214" width="180" height="86" rx="5" fill="#FDE8DD" stroke="#C2501A" stroke-width="1.5"/><text x="24" y="24" text-anchor="start" font-size="12" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">网页、终端、接口里的状态本身就是文字，语言模型可以直接预测“这个动作之后会出现什么”</text><text x="109" y="81.985" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">文字状态</text><text x="109" y="97.045" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">一个网页、一段</text><text x="109" y="111.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">命令行输出、一条</text><text x="109" y="126.025" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">接口返回</text><text x="109" y="182.665" text-anchor="middle" font-size="11.5" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">候选动作</text><text x="109" y="197.035" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">点一下、下一条命令</text><text x="326" y="119.23" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">语言模型当世界模型</text><text x="326" y="134.29" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">预测下一状态</text><text x="326" y="148.78" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">（常常只写变化的部分）</text><text x="665" y="76.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">推理期：行动前先想一步</text><text x="665" y="91.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">RAP 用树搜索长推理树；WebDreamer 想象每个候选把页面带到哪</text><text x="665" y="168.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">训练期：吸收进策略</text><text x="665" y="183.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">Early Experience：策略先学预测自己动作的后果，再学专家动作</text><text x="665" y="260.475" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">训练期：当合成环境</text><text x="665" y="275.535" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">DreamGym：经验模型生成转移和反馈，agent 在里面做强化学习</text><text x="326" y="240.02" text-anchor="middle" font-size="12" font-weight="600" fill="#18202C" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">共同的风险</text><text x="326" y="254.58" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">幻觉、过时知识</text><text x="326" y="268.38" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">多步推演越走越偏</text><text x="326" y="282.18" text-anchor="middle" font-size="10" font-weight="400" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">（WebDreamer：想一步最好）</text><text x="24" y="324" text-anchor="start" font-size="10.5" font-weight="500" fill="#5A6577" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">第四种用法（执行前验证一个转移对不对得上）见三.9</text></svg>
